 left?\u000f","p":1},{"t":"rule","x":"\u000eAIn some contexts,\u000f\u000eD either word\u000f\u000eA is possible.\u000f","p":1},{"t":"eg","x":"\u000eHWhat/Which\u000f\u000eE size shoe do you take?\u000f","p":1},{"t":"eg","x":"\u000eHWhat/Which\u000f\u000eE languages can you speak?\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"Question phrases"},{"t":"eg","x":"\u000eIWhat\u000f\u000eA can combine with other words,\u000f\u000eD mainly nouns.\u000f","p":1},{"t":"eg","x":"\u000eHWhat time\u000f\u000eE is the next train?\u000f","p":1},{"t":"eg","x":"\u000eHWhat about\u000f\u000eE some lunch? ~ Good idea.\u000f","p":1},{"t":"eg","x":"\u000eANote also \u000f\u000eFwhat colour, what make, what kind/type/sort of, \u000f\u000eAand \u000f\u000eFwhat…like?\u000f","p":1},{"t":"eg","x":"\u000eHWhat’s\u000f\u000eE your teacher \u000f\u000eHlike\u000f\u000eE? ~ She’s nice.\u000f","p":1},{"t":"eg","x":"\u000eIHow\u000f\u000eA can combine with other words, mainly\u000f\u000eD adjectives and adverbs.\u000f","p":1},{"t":"eg","x":"\u000eHHow old\u000f\u000eE is this building?\u000f","p":1},{"t":"eg","x":"\u000eHHow far\u000f\u000eE did you walk?\u000f","p":1},{"t":"eg","x":"How often, how long, how many, and how much."},{"t":"eg","x":"\u000eHHow many\u000f\u000eE people live in the building?\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"Modifying a question word"},{"t":"rule","x":"\u000eAWe can ask for exact information with \u000f\u000eIexactly\u000f\u000eA or \u000f\u000eIprecisely\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eHWhen\u000f\u000eE are you leaving \u000f\u000eHexactly\u000f\u000eE?\u000f","p":1},{"t":"eg","x":"\u000eHWhat precisely\u000f\u000eE does the job involve?\u000f","p":1},{"t":"rule","x":"\u000eAWe can ask for \u000f\u000eDapproximate\u000f\u000eA information with \u000f\u000eIroughly\u000f\u000eA, \u000f\u000eIapproximately\u000f\u000eA, and, \u000f\u000eDbefore\u000f\u000eA a question phrase, \u000f\u000eIabout\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eHRoughly\u000f\u000eE how many customers do you get in a day?\u000f","p":1},{"t":"eg","x":"\u000eHApproximately\u000f\u000eE how far is it?\u000f","p":1},{"t":"eg","x":"\u000eHAbout\u000f\u000eE what time will we arrive?\u000f","p":1},{"t":"tip","x":"We can emphasize a wh-question with on earth or with ever. Where on earth have you been? Whatever/What ever can the matter be?"}]}]},{"n":12,"t":"Negative questions","u":"Sentences & Sentence Types","s":[{"l":"A","b":[{"t":"rule","x":"A negative yes/no question often expresses surprise."},{"t":"eg","x":"\u000eHAren’t\u000f\u000eE you ready yet?\u000f","note":"I am surprised that you are not ready.","p":1},{"t":"rule","x":"\u000eAA negative yes/no question or a question with \u000f\u000eFwhy\u000f\u000eA can be a complaint.\u000f","p":1},{"t":"eg","x":"\u000eHCan’t\u000f\u000eE you turn the volume down?\u000f","p":1},{"t":"eg","x":"\u000eHWhy\u000f\u000eE hasn’t the job been done?\u000f","p":1},{"t":"rule","x":"\u000eAWe can use \u000f\u000eFWhy don’t we/you…?\u000f\u000eI or \u000f\u000eFWhy not + verb …?\u000f\u000eA for a suggestion.\u000f","p":1},{"t":"eg","x":"\u000eHWhy don’t\u000f\u000eE you take a taxi?\u000f","p":1},{"t":"eg","x":"\u000eHWhy not\u000f\u000eE use your credit card?\u000f","p":1}]},{"l":"B","b":[{"t":"eg","x":"\u000eANegative questions with \u000f\u000eFwho\u000f\u000eA, \u000f\u000eFwhat\u000f\u000eA, or \u000f\u000eFwhich\u000f\u000eA usually ask for information.\u000f","p":1},{"t":"eg","x":"\u000eHWho hasn’t\u000f\u000eE returned this library book?\u000f","p":1},{"t":"eg","x":"\u000eHWhat can’t\u000f\u000eE you understand?\u000f","p":1},{"t":"eg","x":"\u000eHWhich\u000f\u000eE computer \u000f\u000eHisn’t\u000f\u000eE working?\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"We can use a negative yes/no question to ask the hearer to agree."},{"t":"eg","x":"\u000eHIsn’t\u000f\u000eE there a quicker way?\u000f","p":1},{"t":"eg","x":"\u000eHHaven’t\u000f\u000eE we met somewhere before?\u000f","p":1},{"t":"rule","x":"The meaning is similar to"},{"t":"eg","x":"We’ve met somewhere before, haven’t we?"}]},{"l":"D","b":[{"t":"rule","x":"\u000eAWe make a question negative by putting \u000f\u000eFn’t\u000f\u000eA after the auxiliary.\u000f","p":1},{"t":"rule","x":"\u000eAPositive: \u000f\u000eHDo\u000f\u000eE you like chocolate?\u000f","p":1},{"t":"rule","x":"\u000eANegative: \u000f\u000eHDon’t\u000f\u000eE you like chocolate?\u000f","p":1},{"t":"rule","x":"\u000eAThe negative of \u000f\u000eFam I\u000f\u000eA is \u000f\u000eFaren’t I\u000f\u000eI.\u000f","p":1},{"t":"eg","x":"\u000eEWhy \u000f\u000eHaren’t I\u000f\u000eE on the list?\u000f","p":1},{"t":"rule","x":"\u000eAWe do \u0001not\u0002 use \u000f\u000eFnot\u000f\u000eA after the auxiliary.\u000f","p":1},{"t":"wrong","x":"Do \u0004not\u0005 you like chocolate?"},{"t":"rule","x":"\u000eABut in more formal English \u000f\u000eFnot\u000f\u000eA can come after the subject.\u000f","p":1},{"t":"eg","x":"\u000eEAre we \u000f\u000eHnot\u000f\u000eE a democratic people?\u000f","p":1},{"t":"rule","x":"\u000eAWe can use other negative words. \u000f\u000eB➤5F\u000f","p":1},{"t":"eg","x":"\u000eEAre you \u000f\u000eHnever\u000f\u000eE going to finish?\u000f","p":1},{"t":"eg","x":"\u000eEIs there \u000f\u000eHno\u000f\u000eE electricity\u000f\u000eD?\u000f","p":1}]},{"l":"E","b":[{"t":"rule","x":"\u000eAIf a question word is the subject, \u000f\u000eFn’t\u000f\u000eA or \u000f\u000eFnot\u000f\u000eA comes after the auxiliary.\u000f","p":1},{"t":"rule","x":"\u000eAPositive: \u000f\u000eEWho \u000f\u000eHhas\u000f\u000eE got a ticket?\u000f","p":1},{"t":"rule","x":"\u000eANegative: \u000f\u000eEWho \u000f\u000eHhasn’t/has not\u000f\u000eE got a ticket?\u000f","p":1},{"t":"rule","x":"\u000eAWe can also use other negative words in a \u000f\u000eIwh-question\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"\u000eAPositive: \u000f\u000eEHave you \u000f\u000eHever\u000f\u000eE been skiing?\u000f","p":1},{"t":"rule","x":"\u000eANegative: \u000f\u000eEHave you \u000f\u000eHnever\u000f\u000eE been skiing?\u000f","p":1},{"t":"tip","x":"Be careful when answering a yes/no negative question. No agrees that the negative is true. Yes means that the positive is true. For example, Aren’t you ready? – \u0001No\u0002, but I will be in ten minutes. / Yes, I am. Let’s go."}]}]},{"n":13,"t":"Answering questions","u":"Sentences & Sentence Types","s":[{"l":"A","b":[{"t":"rule","x":"Some questions can be answered in a word or phrase, but others need a longer answer."},{"t":"eg","x":"\u000eEWhat colour is your car?\u000f\u000eB ~ \u000f\u000eHBlue\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEWhen is your exam?\u000f\u000eB ~ \u000f\u000eHNext Thursday.\u000f","p":1},{"t":"eg","x":"\u000eEHow is Lucy?\u000f\u000eB ~ \u000f\u000eHOh, a lot better, thank you. She’ll be back at work next week.\u000f","p":1},{"t":"rule","x":"It is usually enough to give the relevant information. You do not need to say"},{"t":"eg","x":"\u000eEMy car is blue\u000f\u000eA in the first answer.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eAWe can sometimes answer with just \u000f\u000eIyes\u000f\u000eA or \u000f\u000eIno\u000f\u000eA, but a short answer is often better.\u000f","p":1},{"t":"eg","x":"\u000eHIs it\u000f\u000eE raining?\u000f\u000eB ~ \u000f\u000eEYes, \u000f\u000eHit is\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eHCan Alice\u000f\u000eE swim?\u000f\u000eB ~ \u000f\u000eENo, \u000f\u000eHshe can’t.\u000f","p":1},{"t":"rule","x":"\u000eAA short answer relates to the subject and auxiliary verb of the question (\u000f\u000eEyour sister\u000f\u000eA and \u000f\u000eEcan\u000f\u000eA). \u000f","p":1},{"t":"rule","x":"\u000eAA positive answer is: \u000f\u000eIyes + pronoun + auxiliary.\u000f","p":1},{"t":"rule","x":"\u000eAA negative answer is\u000f\u000eI: no + pronoun + auxiliary + \u000f\u000eFn’t\u000f\u000eI.\u000f","p":1},{"t":"rule","x":"\u000eAIn simple tenses we use the auxiliary \u000f\u000eFdo\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eHDo you\u000f\u000eE like it?\u000f\u000eB ~ \u000f\u000eEYes, \u000f\u000eHI do.\u000f","p":1},{"t":"eg","x":"\u000eHDid we\u000f\u000eE succeed?\u000f\u000eB ~ \u000f\u000eENo, we \u000f\u000eHdidn’t\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"We can use \u0001be\u0002 as an ordinary verb."},{"t":"eg","x":"\u000eHAre you\u000f\u000eE late?\u000f\u000eB ~ \u000f\u000eEYes, \u000f\u000eHI am\u000f\u000eE./No,\u000f\u000eH I’m not.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"\u000eAWe can sometimes use another phrase or clause instead of \u000f\u000eFyes\u000f\u000eA or \u000f\u000eFno\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEAm I the winner?\u000f\u000eB ~ \u000f\u000eHOf course\u000f\u000eE you are.\u000f","p":1},{"t":"eg","x":"\u000eEDid you fail?\u000f\u000eB ~ \u000f\u000eHI’m afraid\u000f\u000eE I did\u000f\u000eD.\u000f","p":1},{"t":"rule","x":"\u000eAWe often add information or a comment after a simple \u000f\u000eFyes\u000f\u000eA or \u000f\u000eFno\u000f\u000eA, or after a short answer.\u000f","p":1},{"t":"eg","x":"\u000eEWere you late?\u000f\u000eB ~ \u000f\u000eEYes, \u000f\u000eHI missed the bus.\u000f","p":1},{"t":"eg","x":"\u000eEDid Carl get the job he wanted?\u000f\u000eB ~ \u000f\u000eENo, he didn’t, \u000f\u000eHunfortunately\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEHave you seen the film?\u000f\u000eB ~ \u000f\u000eEYes, I have. \u000f\u000eHI really enjoyed it.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"We cannot normally use a short answer to reply to a request, offer, invitation, or suggestion."},{"t":"eg","x":"\u000eECan I use your phone?\u000f\u000eB ~ \u000f\u000eHOf course.\u000f","p":1},{"t":"eg","x":"\u000eEWould you like a sweet?\u000f\u000eB ~ \u000f\u000eHYes, please.\u000f","p":1},{"t":"eg","x":"\u000eEWould you like to come to my party?\u000f\u000eB ~ \u000f\u000eHYes, I’d love to. Thank you very much.\u000f","p":1},{"t":"eg","x":"\u000eEShall we have a coffee?\u000f\u000eB ~ \u000f\u000eHGood idea\u000f\u000eG.\u000f","p":1},{"t":"eg","x":"\u000eAWe cannot answer \u000f\u000eEYes, we shall.\u000f","p":1},{"t":"rule","x":"A negative answer to a request, invitation, or suggestion needs some explanation."},{"t":"eg","x":"\u000eECan I use your phone?\u000f\u000eB ~ \u000f\u000eHSorry, someone’s using it at the moment.\u000f","p":1},{"t":"eg","x":"\u000eEWould you like to come to my party?\u000f\u000eB ~ \u000f\u000eHI’d love to, but I’ll be away this weekend.\u000f","p":1},{"t":"tip","x":"In some situations it can seem unhelpful to simply answer Yes or Yes, it is. In a friendly conversation, try to add something to keep the conversation going, e.g. Is that watch new? ~ Yes, it is. I bought it last week."}]}]},{"n":14,"t":"Question tags","u":"Sentences & Sentence Types","s":[{"l":"A","b":[{"t":"sub","x":"Form"},{"t":"rule","x":"\u000eAA question tag refers back to the \u000f\u000eDsubject and auxiliary\u000f\u000eA of the main clause.\u000f","p":1},{"t":"rule","x":"Subject Aux. Tag"},{"t":"eg","x":"\u000eEPaul was joking, \u000f\u000eHwasn’t he\u000f\u000eE?\u000f","p":1},{"t":"rule","x":"\u000eAA negative tag is \u000f\u000eFauxiliary \u000f\u000eI+ \u000f\u000eFn’t\u000f\u000eI + \u000f\u000eFpronoun \u000f\u000eI(\u000f\u000eEwasn’t he?\u000f\u000eI).\u000f","p":1},{"t":"rule","x":"\u000eAA positive tag is like a negative one, but without \u000f\u000eFn’t\u000f\u000eI.\u000f","p":1},{"t":"eg","x":"\u000eEPaul wasn’t joking, \u000f\u000eHwas he\u000f\u000eE?\u000f","p":1},{"t":"rule","x":"\u000eAIn simple tenses we use the auxiliary \u000f\u000eFdo\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEYou came home early, \u000f\u000eHdidn’t you\u000f\u000eE?\u000f","p":1},{"t":"rule","x":"We can use \u0001be\u0002 as an ordinary verb."},{"t":"eg","x":"\u000eEThat wasn’t very clever, \u000f\u000eHwas it\u000f\u000eE?\u000f","p":1},{"t":"eg","x":"\u000eAAfter \u000f\u000eFI am\u000f\u000eA, the tag is \u000f\u000eFaren’t I\u000f\u000eD?\u000f","p":1},{"t":"eg","x":"\u000eDI\u000f\u000eE’m late, \u000f\u000eHaren’t I\u000f\u000eD?\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"More about pronouns"},{"t":"rule","x":"\u000eAWe can use the subject \u000f\u000eFthere\u000f\u000eA in a tag.\u000f","p":1},{"t":"eg","x":"\u000eEThere’s lots to do,\u000f\u000eH isn’t there\u000f\u000eE?\u000f","p":1},{"t":"rule","x":"\u000eAAfter \u000f\u000eIthis/that or -thing\u000f\u000eA, we use \u000f\u000eFit\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"That’s right, isn’t \u0004it\u0005?"},{"t":"wrong","x":"... isn’t that?"},{"t":"eg","x":"\u000eESomething went wrong, didn’t \u000f\u000eHit\u000f\u000eE?\u000f","p":1},{"t":"rule","x":"\u000eAAfter \u000f\u000eIthese/those or -one/-body\u000f\u000eA, we use \u000f\u000eFthey\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEThese CDs are cheap, aren’t\u000f\u000eH they\u000f\u000eE?\u000f","p":1},{"t":"eg","x":"\u000eEAnybody could just walk in, couldn’t\u000f\u000eH they\u000f\u000eE?\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"Positive and negative"},{"t":"rule","x":"The usual patterns are these:"},{"t":"eg","x":"positive statement + negative tag"},{"t":"eg","x":"negative statement + positive tag"},{"t":"eg","x":"\u000eAThese tags ask the hearer to agree that the statement is true. It is usually\u000f\u000eD an invitation to continue the conversation.\u000f","p":1},{"t":"eg","x":"\u000eEIt’s cold, \u000f\u000eHisn’t it\u000f\u000eE?\u000f","p":1},{"t":"eg","x":"\u000eEIt isn’t very warm, \u000f\u000eHis it\u000f\u000eE?\u000f","p":1},{"t":"rule","x":"\u000eAThe intonation\u000f\u000eD falls\u000f\u000eA on the tag because the statement\u000f\u000eD is clearly true\u000f\u000eA. But the voice can rise when the \u000f\u000eDsentence is like a question\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEYou’ve got the tickets, \u000f\u000eHhaven’t you\u000f\u000eE?\u000f","p":1},{"t":"rule","x":"We can use this rising intonation in a question or request."},{"t":"eg","x":"\u000eEYou couldn’t lend me £10, \u000f\u000eHcould you\u000f\u000eE?\u000f","p":1}]},{"l":"D","b":[{"t":"sub","x":"Positive statement + positive tag"},{"t":"rule","x":"This pattern has a different meaning from the examples above."},{"t":"eg","x":"\u000eEI’ve got no time at the moment. ~ You’re busy, \u000f\u000eHare you\u000f\u000eE?\u000f","p":1},{"t":"eg","x":"\u000eEVicky doesn’t live here any more. ~ Oh, she’s moved, \u000f\u000eHhas she\u000f\u000eE?\u000f","p":1},{"t":"rule","x":"\u000eAThis means that I \u000f\u000eDrealize\u000f\u000eA from what you say that she has moved, and I want you to \u000f\u000eDconfirm this and continue the conversation.\u000f","p":1},{"t":"tip","x":"Tags are useful when you are making friendly remarks, e.g. about the weather."}]}]},{"n":15,"t":"Echo questions, echo tags, and exclamations","u":"Sentences & Sentence Types","s":[{"l":"A","b":[{"t":"sub","x":"Echo questions"},{"t":"rule","x":"\u000eAWe can use an \u000f\u000eDecho question\u000f\u000eA when we do not understand something or we find it hard to believe. The voice \u000f\u000eDrises\u000f\u000eA on the question word.\u000f","p":1},{"t":"eg","x":"\u000eEI often eat bits of wood. ~ \u000f\u000eHWhat\u000f\u000eE do you eat?\u000f\u000eB / \u000f\u000eEYou eat \u000f\u000eHwhat\u000f\u000eE?\u000f","p":1},{"t":"eg","x":"\u000eEMy father knew Oprah Winfrey. ~ \u000f\u000eHWho\u000f\u000eE did he know? / He knew \u000f\u000eHwho\u000f\u000eE?\u000f","p":1},{"t":"eg","x":"\u000eEDid you see the naked lady? ~ Did I see the \u000f\u000eHwhat\u000f\u000eE?\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"Echo tags"},{"t":"rule","x":"\u000eAWe form an echo tag like a question tag (\u000f\u000eB➤14\u000f\u000eA). A positive statement has a \u000f\u000eDpositive tag\u000f\u000eA, and a negative statement has a \u000f\u000eDnegative tag.\u000f","p":1},{"t":"eg","x":"\u000eEI'm leaving my job. ~ Oh, \u000f\u000eHare you\u000f\u000eE?\u000f","p":1},{"t":"eg","x":"\u000eEThe printer doesn't work. ~ \u000f\u000eHDoesn't i\u000f\u000eEt? Oh dear. \u000f\u000eDAn echo tag expresses interest.\u000f","p":1},{"t":"rule","x":"Now look at these examples."},{"t":"eg","x":"\u000eEI'm leaving my job. ~ You aren't, \u000f\u000eHare you\u000f\u000eE?\u000f","p":1},{"t":"eg","x":"\u000eEThe printer doesn’t work. ~ It does, \u000f\u000eHdoesn’t it\u000f\u000eE? I’ve just been using it.\u000f","p":1},{"t":"eg","x":"\u000eEMax won the prize. ~ He didn’t, \u000f\u000eHdid he\u000f\u000eE?\u000f","p":1},{"t":"rule","x":"This expresses surprise or disbelief. I didn’t expect Max to win the prize."},{"t":"rule","x":"We can use a negative tag to reply to a positive statement."},{"t":"eg","x":"\u000eEThe music was great. ~ Yes, \u000f\u000eHwasn’t it\u000f\u000eE?\u000f","p":1},{"t":"eg","x":"We both agree that the music was great."}]},{"l":"C","b":[{"t":"sub","x":"Exclamations"},{"t":"rule","x":"An exclamation is any phrase or sentence spoken with emphasis and feeling."},{"t":"eg","x":"Oh no! Lovely! You idiot! Stop!"},{"t":"rule","x":"\u000eAThere are patterns with \u000f\u000eFhow\u000f\u000eA and \u000f\u000eFwhat\u000f\u000eA that can be used in an exclamation, although not always with an exclamation mark (\u000f\u000eI!\u000f\u000eA).\u000f","p":1},{"t":"rule","x":"\u000eAAfter \u000f\u000eFhow\u000f\u000eA we can use an adjective, an adverb, or a subject + verb.\u000f","p":1},{"t":"eg","x":"\u000eHHow\u000f\u000eE awful! \u000f\u000eHHow\u000f\u000eE nice to see you.\u000f","p":1},{"t":"eg","x":"\u000eELook at the plants —\u000f\u000eH how\u000f\u000eE they've grown!\u000f","p":1},{"t":"rule","x":"\u000eAAfter \u000f\u000eFwhat\u000f\u000eA there can be a noun phrase with \u000f\u000eFa/an\u000f\u000eA or without an article.\u000f","p":1},{"t":"eg","x":"\u000eHWhat\u000f\u000eE a surprise! \u000f\u000eHWhat\u000f\u000eE a good idea.\u000f","p":1},{"t":"eg","x":"\u000eHWhat\u000f\u000eE nonsense you talk.\u000f","p":1},{"t":"rule","x":"Some exclamations have the form of a negative question."},{"t":"eg","x":"\u000eHAren’t\u000f\u000eE you lucky. \u000f\u000eHDon’t\u000f\u000eE you look smart!\u000f","note":"This means that you look very smart.","p":1},{"t":"tip","x":"You can use an echo tag to agree with a friendly statement, e.g. You can use an echo tag to agree with a friendly statement, e.g. Lovely day! ~ Beautiful, isn’t it?"}]}]},{"n":16,"t":"Replacing and leaving out words","u":"Sentences & Sentence Types","s":[{"l":"A","b":[{"t":"rule","x":"\u000eAWe often \u000f\u000eDavoid repeating\u000f\u000eA a word when it is not necessary to do so. For example, we replace a noun phrase with a pronoun.\u000f","p":1},{"t":"eg","x":"\u000eEWhere’s Kirsty? \u000f\u000eHShe’s\u000f\u000eE late.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eAWe can also leave out a noun after a number, a quantifier, \u000f\u000eFthis/that/these/those\u000f\u000eA, or a superlative adjective.\u000f","p":1},{"t":"eg","x":"\u000eEHave you got a sister? ~ I’ve got \u000f\u000eHtwo\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEThere’s soup here. Would you like \u000f\u000eHsome\u000f\u000eE?\u000f","p":1},{"t":"wrong","x":"Would you like?"},{"t":"eg","x":"\u000eEThese shirts are cotton, but \u000f\u000eHthose\u000f\u000eE aren’t.\u000f","p":1},{"t":"eg","x":"\u000eEWhich question was the \u000f\u000eHmost difficult\u000f\u000eE?\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"\u000eATo avoid repeating a to-infinitive, we can often leave out the words after \u000f\u000eFto\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEWould you like to join us? ~ I’d love \u000f\u000eHto\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEI got the job, although I didn’t expect \u000f\u000eHto\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eABut we repeat an auxiliary after \u000f\u000eFto\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI was chosen for the job, although I didn’t expect to \u000f\u000eHbe\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eAAfter \u000f\u000eFlike\u000f\u000eI, \u000f\u000eFtry\u000f\u000eA, and \u000f\u000eFwant\u000f\u000eA, we often leave out \u000f\u000eFto\u000f\u000eA as well.\u000f","p":1},{"t":"rule","x":"\u000eEYou can stay as long as you \u000f\u000eHlike\u000f\u000eE.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"\u000eAThe main verb can sometimes\u000f\u000eD be left out.\u000f","p":1},{"t":"eg","x":"Arsenal have won six games and Chelsea five.","note":"= ... and Chelsea have won five."}]},{"l":"E","b":[{"t":"rule","x":"\u000eAIn conversational English certain kinds of words can \u000f\u000eDbe left off the beginning of a sentenc\u000f\u000eAe if the meaning is still \u000f\u000eDclear\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eECan’t find my keys.\u000f\u000eB (= \u000f\u000eHI\u000f\u000eE can’t find …\u000f\u000eB)\u000f","p":1},{"t":"eg","x":"\u000eESorry about that.\u000f\u000eB (= \u000f\u000eHI’m\u000f\u000eE sorry …\u000f\u000eB)\u000f","p":1},{"t":"eg","x":"\u000eEGetting dark now.\u000f\u000eB (= \u000f\u000eHIt’s\u000f\u000eE getting …\u000f\u000eB)\u000f","p":1},{"t":"eg","x":"\u000eEEverything OK?\u000f\u000eB (= \u000f\u000eHIs\u000f\u000eE everything OK?\u000f\u000eB)\u000f","p":1},{"t":"eg","x":"\u000eETired?\u000f\u000eB (= \u000f\u000eHAre\u000f\u000eE you tired?\u000f\u000eB)\u000f","p":1}]},{"l":"F","b":[{"t":"eg","x":"\u000eAIn some special styles of English, words are\u000f\u000eD left out to save space\u000f\u000eA. This happens in \u000f\u000eDnewspaper headlines and in instructions.\u000f","p":1},{"t":"eg","x":"\u000eESix arrested in raid.\u000f\u000eB (Six \u000f\u000eKpeople have been\u000f\u000eB arrested in a raid.)\u000f","p":1},{"t":"eg","x":"\u000eEInsert battery.\u000f\u000eB (Insert \u000f\u000eKthe\u000f\u000eB battery.\u000f\u000eA)\u000f","p":1},{"t":"rule","x":"Note style is used when it is necessary to be brief, e.g. when writing a postcard."},{"t":"eg","x":"\u000eEHotel fine, weather marvellous.\u000f\u000eB (\u000f\u000eKThe\u000f\u000eB hotel \u000f\u000eKis\u000f\u000eB fine,\u000f\u000eK and the\u000f\u000eB weather \u000f\u000eKis\u000f\u000eB marvellous.)\u000f","p":1},{"t":"rule","x":"Text messages often use note style and abbreviations."},{"t":"eg","x":"Arrive 30 mins. CU soon."},{"t":"tip","x":"It is not always possible to avoid repetition. Look at this sentence: I bought some sweets and biscuits, but I’ve eaten all the sweets. We need to repeat sweets here to make the meaning clear."}]}]},{"n":17,"t":"Leaving out words after auxiliary","u":"Sentences & Sentence Types","s":[{"l":"A","b":[{"t":"rule","x":"\u000eAA clause can \u000f\u000eDend\u000f\u000eA with an \u000f\u000eDauxiliary\u000f\u000eA if the meaning is clear from the context.\u000f","p":1},{"t":"eg","x":"\u000eEI haven’t brought a map, but Laura \u000f\u000eHhas\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEThe meeting went on longer than I thought it \u000f\u000eHwould\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eAIn simple tenses we use \u000f\u000eFdo\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEDon’t leave. You’ll be sorry if you \u000f\u000eHdo\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eAWe also use the ordinary verb \u000f\u000eFbe\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEThis sweater isn’t dry. ~ This one \u000f\u000eHis\u000f\u000eE.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eAThe auxiliary can be \u000f\u000eDpositive or negative\u000f\u000eA. A positive auxiliary \u000f\u000eDcannot be a short form.\u000f","p":1},{"t":"eg","x":"\u000eEAm I too late? ~ I’m afraid you \u000f\u000eHare\u000f\u000eE.\u000f","p":1},{"t":"wrong","x":"I’m afraid you’re."},{"t":"rule","x":"But the negative can be."},{"t":"eg","x":"\u000eEOf course you are\u000f\u000eHn’t\u000f\u000eE.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"\u000eAIn some contexts we put\u000f\u000eD a tag\u000f\u000eA or an \u000f\u000eDadverbial\u000f\u000eA after the auxiliary.\u000f","p":1},{"t":"eg","x":"\u000eEThat’s a nice colour. ~ It is, \u000f\u000eHisn’t it?\u000f","p":1},{"t":"eg","x":"\u000eEIs there a market today? ~ I don’t know. There was \u000f\u000eHyesterday\u000f\u000eE.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"\u000eASometimes we have to use \u000f\u000eDtwo\u000f\u000eA auxiliary verbs. When both are in the \u000f\u000eDprevious\u000f\u000eA clause, we can\u000f\u000eD leave out the second.\u000f","p":1},{"t":"eg","x":"\u000eEYou could have hurt yourself. ~ Yes, I suppose I \u000f\u000eHcould (have).\u000f","p":1},{"t":"rule","x":"\u000eAWhen the first auxiliary is \u000f\u000eDnew\u000f\u000eA in the context, we \u000f\u000eDcannot\u000f\u000eA leave out the second.\u000f","p":1},{"t":"eg","x":"\u000eEHave the team won? ~ They look happy, so they\u000f\u000eH must have\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEIs Tom still waiting? ~ He \u000f\u000eHmight be.\u000f","p":1},{"t":"eg","x":"\u000eEWhen will the grass be cut? ~ It already \u000f\u000eHhas been.\u000f","p":1}]},{"l":"E","b":[{"t":"rule","x":"\u000eAA short yes/no question consists of an\u000f\u000eD auxiliary + subjec\u000f\u000eAt.\u000f","p":1},{"t":"eg","x":"\u000eEI’ve never been to New York. \u000f\u000eHHave you\u000f\u000eE?\u000f","p":1},{"t":"eg","x":"\u000eEI wanted Karen to do well in her exam. ~ And \u000f\u000eHdid she\u000f\u000eE?\u000f\u000eB Yes, she did very well.\u000f","p":1},{"t":"rule","x":"\u000eAIn a short \u000f\u000eIwh-question\u000f\u000eA, we simply use a question word or question phrase.\u000f","p":1},{"t":"eg","x":"\u000eEI’m giving up my course. ~ Oh, \u000f\u000eHwhy?\u000f","p":1},{"t":"eg","x":"\u000eEI’ve got a meeting today. ~ \u000f\u000eHWhat time?\u000f","p":1},{"t":"rule","x":"When the question word is the subject, the auxiliary can come after it."},{"t":"eg","x":"\u000eESomething’s happened. ~ \u000f\u000eHWhat (has)?\u000f","p":1},{"t":"rule","x":"A sub-clause can also end with a question word if the meaning is clear."},{"t":"eg","x":"\u000eEThe road is closed. No one knows \u000f\u000eHwhy\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEI put the card somewhere, but I can’t remember \u000f\u000eHwhere\u000f\u000eE.\u000f","p":1},{"t":"tip","x":"You can end a clause with a negative auxiliary when contradicting someone: What time did you have breakfast? ~ I didn’t. I never have breakfast."}]}]},{"n":18,"t":"Too, either, so, and neither/nor","u":"Sentences & Sentence Types","s":[{"l":"A","b":[{"t":"sub","x":"Too and either"},{"t":"rule","x":"\u000eAAfter a clause there can be a short addition with \u000f\u000eFtoo\u000f\u000eA or \u000f\u000eFeither\u000f\u000eA, to say that what is true of one thing is also true of another.\u000f","p":1},{"t":"sub","x":"Positive:"},{"t":"rule","x":"\u000eIsubject + auxiliary + \u000f\u000eFtoo\u000f","p":1},{"t":"eg","x":"\u000eEI’m falling asleep. ~ \u000f\u000eHI am, too.\u000f","p":1},{"t":"eg","x":"\u000eEI’ve spent all my money. ~ \u000f\u000eHI have too.\u000f","p":1},{"t":"sub","x":"Negative:"},{"t":"rule","x":"\u000eIsubject + auxiliary + \u000f\u000eFn’t\u000f\u000eI + \u000f\u000eFeither\u000f","p":1},{"t":"eg","x":"\u000eEI haven’t got a watch. ~ \u000f\u000eHI haven’t, either.\u000f","p":1},{"t":"eg","x":"\u000eETom can’t drive, and \u000f\u000eHEmma can’t either.\u000f","p":1},{"t":"rule","x":"\u000eAIn simple tenses we use \u000f\u000eFdo\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEThis pen doesn’t work. And \u000f\u000eHthis one doesn’t either.\u000f","p":1},{"t":"eg","x":"\u000eEI enjoyed the film. ~ \u000f\u000eHI did, too.\u000f","p":1},{"t":"rule","x":"\u000eAWe can also use \u000f\u000eFbe\u000f\u000eA as an ordinary verb.\u000f","p":1},{"t":"eg","x":"\u000eEI’m not hungry. ~ \u000f\u000eHI’m not either.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"So and neither/nor"},{"t":"rule","x":"\u000eAWe can also form a short addition with \u000f\u000eFso\u000f\u000eA \u0001and\u0002 \u000f\u000eFneither/no\u000f\u000eDr\u000f\u000eA. Here \u000f\u000eFso\u000f\u000eA means\u000f\u000eI ‘\u0001too\u0002’ or ‘also’.\u000f","p":1},{"t":"sub","x":"Positive:"},{"t":"rule","x":"\u000eFso\u000f\u000eI + auxiliary + subject\u000f","p":1},{"t":"eg","x":"\u000eEI’m falling asleep. ~ \u000f\u000eHSo am I.\u000f","p":1},{"t":"eg","x":"\u000eEYou’re beautiful. ~ \u000f\u000eHSo are you.\u000f","p":1},{"t":"sub","x":"Negative:"},{"t":"rule","x":"\u000eDneither/nor\u000f\u000eA + auxiliary + subject\u000f","p":1},{"t":"eg","x":"\u000eEI’m not going. ~ \u000f\u000eHNor am I.\u000f","p":1},{"t":"eg","x":"\u000eETom can’t drive, and \u000f\u000eHneither can Emma.\u000f","p":1},{"t":"rule","x":"\u0001So am I\u0002 means the same as I \u0001am\u0002, \u0001too\u0002, and \u0001Nor am I\u0002 means the same as I’m not \u0001either\u0002."}]},{"l":"C","b":[{"t":"sub","x":"Negative after positive; positive after negative"},{"t":"rule","x":"In these examples, a negative addition follows a positive statement, and a positive addition follows a negative statement. Something which is true of one thing is not true of another."},{"t":"eg","x":"\u000eEI’m tired. ~ Well, \u000f\u000eHI’m not.\u000f","p":1},{"t":"eg","x":"\u000eEWe didn’t enjoy the film. ~ Oh, \u000f\u000eHwe did.\u000f","p":1},{"t":"rule","x":"\u000eAThe stress is on \u000f\u000eEI\u000f\u000eA and \u000f\u000eEwe\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"We can also use a short statement to contradict what someone says."},{"t":"eg","x":"You’re tired. ~ No, I’m \u0004not\u0005."},{"t":"rule","x":"I can’t sing. ~ You can, you know."},{"t":"rule","x":"\u000eAThe stress here is on \u000f\u000eDnot\u000f\u000eA in the first and on \u000f\u000eDcan\u000f\u000eA in the second.\u000f","p":1},{"t":"tip","x":"In informal English you can use \u0001Me too\u0002 or \u0001Me neither\u0002 for a short addition about yourself, e.g. I’d love to go to India. ~ \u0001Me too\u0002. I haven’t had a holiday this year. ~ \u0001Me neither\u0002."}]}]},{"n":19,"t":"Think so, hope not, etc","u":"Sentences & Sentence Types","s":[{"l":"A","b":[{"t":"sub","x":"\u000eLSo\u000f\u000eC replacing a clause\u000f","p":1},{"t":"rule","x":"\u000eFSo\u000f\u000eA can replace a whole clause.\u000f","p":1},{"t":"eg","x":"\u000eEWill you be going out? ~ Yes, I expect \u000f\u000eHso\u000f\u000eE.\u000f","note":"= I expect I will be going out.","p":1},{"t":"eg","x":"\u000eEAre these figures correct? ~ I think \u000f\u000eHso\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eAWe cannot leave out \u000f\u000eDso\u000f\u000eA or use \u000f\u000eDit.\u000f","p":1},{"t":"eg","x":"\u000eKNot \u000f\u000eEYes, I expect\u000f\u000eB or \u000f\u000eEYes, I expect it.\u000f","p":1},{"t":"rule","x":"\u000eAWith \u000f\u000eFso\u000f\u000eA we can use: \u000f","p":1},{"t":"eg","x":"be afraid, \u0004it\u0005 appears/appeared, assume, believe, expect, guess, hope, imagine, presume, say, it seems/seemed, suppose, suspect, tell (someone), think."}]},{"l":"B","b":[{"t":"sub","x":"\u000eLSo\u000f\u000eC or \u000f\u000eLnot\u000f\u000eC in the negative\u000f","p":1},{"t":"rule","x":"There are two negative patterns:"},{"t":"sub","x":"negative verb + so"},{"t":"eg","x":"\u000eEWill you be late in? ~ I do\u000f\u000eHn’t\u000f\u000eE expect \u000f\u000eHso\u000f\u000eE.\u000f","p":1},{"t":"sub","x":"positive verb + not"},{"t":"eg","x":"\u000eEIs it going to rain? ~ I hope \u000f\u000eHnot\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eAWith \u000f\u000eEexpect\u000f\u000eB, \u000f\u000eEimagine\u000f\u000eA, and \u000f\u000eEthink\u000f\u000eA, we usually form the \u000f\u000eDnegative\u000f\u000eA with \u000f\u000eFso\u000f\u000eD.\u000f","p":1},{"t":"eg","x":"Is \u0004the\u0005 boss \u0004in\u0005? ~ I don’t think \u0004so\u0005."},{"t":"rule","x":"\u000eDI think \u0001not\u0002\u000f\u000eA is possible but rather formal.\u000f","p":1},{"t":"rule","x":"\u000eASome verbs and expressions always form the \u000f\u000eDnegative\u000f\u000eA with \u000f\u000eFnot\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEThere’s no point in waiting. ~ I guess \u000f\u000eHnot\u000f\u000eE.\u000f","p":1},{"t":"wrong","x":"I don’t guess \u0004so\u0005."},{"t":"rule","x":"\u000eAIn this pattern we use \u000f\u000eEbe afraid\u000f\u000eB, \u000f\u000eEassume\u000f\u000eB, \u000f\u000eEguess\u000f\u000eB, \u000f\u000eEhope\u000f\u000eB, \u000f\u000eEpresume\u000f\u000eB,\u000f\u000eA and \u000f\u000eEsuspect\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"We can use these verbs \u0001in\u0002 either pattern:"},{"t":"sub","x":"\u000eCappear\u000f\u000eA, \u000f\u000eCbelieve\u000f\u000eA, \u000f\u000eCsay\u000f\u000eA, \u000f\u000eCseem\u000f\u000eA, \u000f\u000eCsuppose\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEWe aren’t going to win a prize. ~ No, I do\u000f\u000eHn’t\u000f\u000eE suppose \u000f\u000eHso\u000f\u000eE. / No, I suppose \u000f\u000eHnot\u000f\u000eE.\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"\u000eLSo\u000f\u000eC at the beginning\u000f","p":1},{"t":"rule","x":"\u000eAWith \u000f\u000eEappear\u000f\u000eB, \u000f\u000eEassume\u000f\u000eB, \u000f\u000eEbelieve\u000f\u000eB, \u000f\u000eEsay\u000f\u000eB, \u000f\u000eEseem\u000f\u000eA, and \u000f\u000eEunderstand\u000f\u000eA, we can use \u000f\u000eFso\u000f\u000eA at the beginning of a clause to comment on the truth of a statement.\u000f","p":1},{"t":"eg","x":"\u000eEWill there be a party? ~ \u000f\u000eHSo I’ve heard.\u000f","p":1},{"t":"eg","x":"\u000eEAre the tickets all sold? ~ \u000f\u000eHSo they say.\u000f","p":1},{"t":"eg","x":"\u000eEOur tutor had a late night. ~ \u000f\u000eHSo it seems.\u000f","p":1}]},{"l":"D","b":[{"t":"sub","x":"\u000eLIf so\u000f\u000eC and \u000f\u000eLif not\u000f","p":1},{"t":"rule","x":"\u000eFSo\u000f\u000eA and \u000f\u000eFnot\u000f\u000eA can replace a clause after \u000f\u000eFif\u000f\u000eD.\u000f","p":1},{"t":"eg","x":"\u000eENeed a loan? \u000f\u000eHIf so\u000f\u000eE, give us a ring.\u000f","note":"If you need a loan, ...","p":1},{"t":"eg","x":"\u000eEHave you got transport? \u000f\u000eHIf not\u000f\u000eE, I can give you a lift.\u000f","note":"If you haven’t got transport, ...","p":1}]},{"l":"E","b":[{"t":"sub","x":"\u000eLNot\u000f\u000eC after and adverb\u000f","p":1},{"t":"rule","x":"We can use \u0001not\u0002 after certain adverbs, e.g. certainly, definitely, maybe, of course, perhaps, possibly, probably."},{"t":"eg","x":"Are you going to accept the offer? ~ No, certainly \u0004not\u0005."},{"t":"tip","x":"Do not use \u0001so\u0002 with know and sure. Say: Yes, I know and Are you sure?"}]}]},{"n":20,"t":"More patterns with so","u":"Sentences & Sentence Types","s":[{"l":"A","b":[{"t":"sub","x":"\u000eLDo so, do it, \u000f\u000eCand \u000f\u000eLdo that\u000f","p":1},{"t":"rule","x":"\u000eAWe can use \u000f\u000eFdo so\u000f\u000eA or \u000f\u000eFdo \u0001it\u0002\u000f\u000eA to avoid repeating an action verb and the words after it. \u000f\u000eFDo so\u000f\u000eA is a little formal.\u000f","p":1},{"t":"eg","x":"\u000eEIf you haven’t paid yet, please \u000f\u000eHdo so\u000f\u000eE now.\u000f","p":1},{"t":"eg","x":"\u000eEShe had always wanted to fly a plane, and now at last she was \u000f\u000eHdoing so/it.\u000f","p":1},{"t":"rule","x":"\u000eAThe stress is on \u000f\u000eFdo\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"\u000eAWith \u000f\u000eFdo \u0001that\u0002\u000f\u000eA, we usually stress \u000f\u000eFthat\u000f\u000eD.\u000f","p":1},{"t":"eg","x":"\u000eEThe plates need washing. ~ I’ll \u000f\u000eHdo that\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEI’d like to burn that building down. ~ I wouldn’t \u000f\u000eHdo that\u000f\u000eE if I were you.\u000f","p":1},{"t":"rule","x":"\u000eAIn the last example we stress \u000f\u000eFthat\u000f\u000eA to express surprise or shock at the action.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"\u000eLSo\u000f\u000eC in short answers\u000f","p":1},{"t":"rule","x":"\u000eAA short answer with \u000f\u000eFso\u000f\u000eA can express agreement. The pattern is: \u000f\u000eFso + pronoun + auxiliary or be.\u000f","p":1},{"t":"eg","x":"\u000eEThis is a one-way street. ~ Oh, so \u000f\u000eHit is.\u000f","p":1},{"t":"rule","x":"The speaker is noticing or remembering that it is a one-way street."},{"t":"rule","x":"Compare these two patterns."},{"t":"eg","x":"\u000eEYou’ve made a mistake. ~ \u000f\u000eHSo I have\u000f\u000eE.\u000f","note":"I agree I have made a mistake.","p":1},{"t":"eg","x":"\u000eEI’ve made a mistake. ~ \u000f\u000eHSo have I.\u000f","note":"I have made a mistake, too.","p":1}]},{"l":"C","b":[{"t":"sub","x":"\u000eLSo\u000f\u000eC and \u000f\u000eLthat way\u000f","p":1},{"t":"rule","x":"\u000eAIn formal English \u000f\u000eFso\u000f\u000eA can replace an adjective after \u000f\u000eFbecome\u000f\u000eA and \u000f\u000eFremain\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEThe situation is not yet serious, but it may become \u000f\u000eHso\u000f\u000eD.\u000f\u000eA (= become \u000f\u000eCserious\u000f\u000eA)\u000f","p":1},{"t":"rule","x":"\u000eFGet/stay that way\u000f\u000eA is more informal.\u000f","p":1},{"t":"eg","x":"\u000eEThe situation isn’t serious yet, but it may \u000f\u000eHget that way.\u000f","p":1},{"t":"rule","x":"\u000eAWe can also use \u000f\u000eFso\u000f\u000eA after \u000f\u000eFmore\u000f\u000eD or \u000f\u000eFless\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEIt’s often busy here — more \u000f\u000eHso\u000f\u000eE in summer.\u000f","p":1}]},{"l":"D","b":[{"t":"sub","x":"The same"},{"t":"rule","x":"\u000eIThe same\u000f\u000eA can replace words just mentioned, e.g. an object or complement.\u000f","p":1},{"t":"eg","x":"\u000eEI’m having steak. ~ I’ll have \u000f\u000eHthe same\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEMonday was pretty hot, and Tuesday was \u000f\u000eHthe same.\u000f","p":1},{"t":"rule","x":"\u000eAWe can use \u000f\u000eFdo/say/think the same (thing)\u000f\u000eA, \u000f\u000eFfeel the same (way)\u000f\u000eA, and \u000f\u000eFThe same is true of ... / The same goes for ..\u000f\u000eD.\u000f","p":1},{"t":"eg","x":"\u000eEOne night Alan walked in his sleep. Next night he \u000f\u000eHdid the same thing.\u000f","p":1},{"t":"eg","x":"\u000eEThe others think we should stay together, and \u000f\u000eHI think the same.\u000f","p":1},{"t":"eg","x":"\u000eERents are very high here, but \u000f\u000eHthe same goes for\u000f\u000eE lots of other towns.\u000f","p":1},{"t":"tip","x":"When someone wishes you a happy new year or a nice weekend, you can return the good wishes by answering The same to you."}]}]},{"n":21,"t":"Word order and information","u":"Sentences & Sentence Types","s":[{"l":"A","b":[{"t":"rule","x":"Imagine you are sitting in a café with a friend drinking a cup of coffee when one of you makes this comment."},{"t":"eg","x":"This coffee tastes awful."},{"t":"rule","x":"\u000eAThis statement begins with the subject \u000f\u000eI(\u000f\u000eFThis coffee\u000f\u000eI)\u000f\u000eA and the verb \u000f\u000eI(\u000f\u000eFtastes\u000f\u000eI)\u000f\u000eA, the normal word order in a statement. \u000f","p":1},{"t":"rule","x":"\u000eAHere a complement \u000f\u000eI(\u000f\u000eFawful\u000f\u000eI)\u000f\u000eA follows the verb.\u000f","p":1},{"t":"rule","x":"\u000eAWe can also look at the sentence from the point of view of the information it communicates. The first phrase \u000f\u000eI(\u000f\u000eFThis coffee\u000f\u000eI)\u000f\u000eA is the \u000f\u000eCtopic\u000f\u000eA, what the sentence is about. The last phrase \u000f\u000eF(awful)\u000f\u000eA is the \u000f\u000eCimportant information\u000f\u000eA about the topic.\u000f","p":1},{"t":"rule","x":"\u000eFThis coffee\u000f\u000eA is ‘old information’ because it is naturally in our thoughts in the situation.\u000f","p":1},{"t":"rule","x":"\u000eFAwful\u000f\u000eA is ‘new information’, the point of the message. \u000f","p":1},{"t":"rule","x":"\u000eAThe sentence starts with \u000f\u000eDold information\u000f\u000eA and then tells us something \u000f\u000eDnew\u000f\u000eA about it. This is a typical way of communicating information, although it is certainly not an absolute rule.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"A sentence in a text also typically starts with old information, something mentioned in the previous sentence."},{"t":"eg","x":"\u000eEHealth workers want big pay rises. \u000f\u000eHThe nurses\u000f\u000eE may even go on strike.\u000f","p":1},{"t":"eg","x":"\u000eEThere was a huge explosion. \u000f\u000eHIt\u000f\u000eE was heard ten miles away.\u000f","p":1},{"t":"rule","x":"\u000eAIn each of the last two examples, the second sentence links to the previous one by mentioning old information (\u000f\u000eEhealth workers ← nurses\u000f\u000eA) or using a pronoun (\u000f\u000eEexplosion ← it\u000f\u000eA).\u000f","p":1},{"t":"rule","x":"A clause or sentence can also begin by making a contrast with something in the previous one."},{"t":"eg","x":"\u000eEFifty years ago, not many people flew, but \u000f\u000eHtoday\u000f\u000eE air travel is much more common.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"Compare these two sentences."},{"t":"eg","x":"\u000eEThe girls did well. \u000f\u000eHAmy\u000f\u000eE won first prize.\u000f","p":1},{"t":"eg","x":"\u000eEThere were lots of prizes. \u000f\u000eHFirst prize\u000f\u000eE went to Amy.\u000f","p":1},{"t":"rule","x":"We choose a structure which links the subject to the previous sentence."}]},{"l":"D","b":[{"t":"rule","x":"Sometimes we can use an abstract noun referring back to an idea."},{"t":"eg","x":"\u000eESomeone threw a stone through the window. T\u000f\u000eHhis incident\u000f\u000eE upset everyone.\u000f","p":1},{"t":"eg","x":"\u000eEThe people here have nothing. \u000f\u000eHTheir poverty\u000f\u000eE is extreme.\u000f","p":1},{"t":"tip","x":"When writing a connected text such as an email or a letter, try to link sentences by starting with known information and saying something new about it."}]}]},{"n":22,"t":"Phrases in front position","u":"Sentences & Sentence Types","s":[{"l":"","b":[{"t":"rule","x":"\u000eAThe subject often comes in \u000f\u000eDfront position\u000f\u000eA (at the beginning of a sentence). But sometimes we put another phrase \u000f\u000eDbefore the subject\u000f\u000eA. We do this to make the phrase more \u000f\u000eDprominent\u000f\u000eA.\u000f","p":1}]},{"l":"A","b":[{"t":"sub","x":"Adverbial in front position"},{"t":"rule","x":"\u000eAMost kinds of adverbial can go in front position. \u000f\u000eI➤121A\u000f","p":1},{"t":"eg","x":"\u000eEAdam hasn’t come. \u000f\u000eHMaybe\u000f\u000eE he’s forgotten.\u000f","p":1},{"t":"eg","x":"\u000eEI didn’t lock the car. \u000f\u000eHLuckily\u000f\u000eE it’s still there.\u000f","p":1},{"t":"rule","x":"\u000eDAdverbials of time\u000f\u000eA often go in front position to help show the sequence of events.\u000f","p":1},{"t":"eg","x":"\u000eHFirst\u000f\u000eE you mix the sand and cement, and \u000f\u000eHthen\u000f\u000eE you add water.\u000f","p":1},{"t":"rule","x":"\u000eAAn adverbial of manner in front position is rather \u000f\u000eDliterary\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eHSlowly\u000f\u000eB the sun sank into the Pacific.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"Inversion after an adverbial"},{"t":"rule","x":"\u000eAWhen an \u000f\u000eDadverbial of place\u000f\u000eA comes in front position, there is sometimes inversion of subject and verb.\u000f","p":1},{"t":"eg","x":"Daniel walked along to number 16."},{"t":"eg","x":"\u000eHOutside the house\u000f\u000eE was a large van.\u000f","p":1},{"t":"eg","x":"\u000eEThere was just a table and two chairs in the room\u000f\u000eD. \u000f\u000eHOn the table\u000f\u000eE lay a newspaper\u000f\u000eD.\u000f","p":1},{"t":"eg","x":"\u000eAInversion happens with verbs of \u000f\u000eDplace and movement\u000f\u000eA, e.g. \u000f\u000eFbe, come, go, lie, sit, stand\u000f\u000eI.\u000f","p":1},{"t":"rule","x":"There is no inversion with other verbs."},{"t":"eg","x":"Outside two men were talking."},{"t":"wrong","x":"Outside were talking two men."}]},{"l":"C","b":[{"t":"sub","x":"\u000eCInversion after \u000f\u000eJhere/there\u000f","p":1},{"t":"rule","x":"\u000eAWe can use \u000f\u000eFhere\u000f\u000eA and \u000f\u000eFthere\u000f\u000eA in front position to draw attention to something. \u0001There\u0002 is inversion of subject and verb.\u000f","p":1},{"t":"eg","x":"\u000eHHere\u000f\u000eE is\u000f\u000eB an announcement.\u000f","p":1},{"t":"eg","x":"\u000eHThere\u000f\u000eE goes\u000f\u000eB the bus, look.\u000f","p":1},{"t":"rule","x":"\u000eAIn this pattern we can use \u000f\u000eFbe\u000f\u000eD, \u000f\u000eFcome\u000f\u000eD,\u000f\u000eA or \u000f\u000eFgo\u000f\u000eA in the \u000f\u000eDpresent simple.\u000f","p":1},{"t":"rule","x":"\u000eAWhen the subject is a \u000f\u000eDpronoun\u000f\u000eA, there is \u000f\u000eDno inversion.\u000f","p":1},{"t":"eg","x":"\u000eEWhere’s my bag?\u000f\u000eB ~ \u000f\u000eEHere \u000f\u000eHit is\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEThe kids are back. Here t\u000f\u000eHhey come.\u000f","p":1}]},{"l":"D","b":[{"t":"sub","x":"Object and complement"},{"t":"rule","x":"We can put an object or complement in front position for emphasis when it links or contrasts with what has gone before."},{"t":"eg","x":"\u000eEDo you prefer cats or dogs? ~ \u000f\u000eHDogs\u000f\u000eE I love, but \u000f\u000eHcats\u000f\u000eE I can’t stand.\u000f","p":1},{"t":"eg","x":"\u000eEThe scheme has many good points. \u000f\u000eHOne advantage\u000f\u000eE is the low cost\u000f\u000eB.\u000f","p":1},{"t":"tip","x":"There are no fixed rules about what goes in front position. You can also say I love dogs, but I can’t stand cats. It is a matter of style and emphasis."}]}]},{"n":23,"t":"The empty subject there","u":"Sentences & Sentence Types","s":[{"l":"A","b":[{"t":"rule","x":"\u000eATo point out the \u000f\u000eDexistence\u000f\u000eA of something, we use \u000f\u000eFthere + be\u000f\u000eI.\u000f","p":1},{"t":"eg","x":"\u000eHThere’s\u000f\u000eE hot water in the kettle.\u000f","p":1},{"t":"eg","x":"\u000eHThere are\u000f\u000eE some letters for you.\u000f","p":1},{"t":"eg","x":"\u000eET\u000f\u000eHhere was\u000f\u000eE an accident here last week.\u000f","p":1},{"t":"eg","x":"\u000eHThere were\u000f\u000eE ten people in the queue.\u000f","p":1},{"t":"eg","x":"\u000eHThere must have been\u000f\u000eE a power cut.\u000f","p":1},{"t":"rule","x":"\u000eAThe verb \u000f\u000eFbe\u000f\u000eA agrees with the noun phrase after it:\u000f","p":1},{"t":"eg","x":"\u000eEThere \u000f\u000eHis/was\u000f\u000eE a letter, \u000f\u000eDbut \u000f\u000eEThere \u000f\u000eHare/were\u000f\u000eE some letters.\u000f","p":1},{"t":"rule","x":"\u000eABut in informal speech you may hear \u000f\u000eFthere’s\u000f\u000eA before a plural:\u000f","p":1},{"t":"eg","x":"\u0004There\u0005’s some letters."},{"t":"rule","x":"\u000eAFor the choice of \u000f\u000eFthere\u000f\u000eA and \u000f\u000eFit\u000f\u000eA, \u000f\u000eI➤24D\u000f\u000eA.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eAWe form negatives and questions with \u000f\u000eFthere\u000f\u000eA in the normal way.\u000f","p":1},{"t":"eg","x":"\u000eHThere isn’t\u000f\u000eE any hot water.\u000f","p":1},{"t":"eg","x":"\u000eHAre there\u000f\u000eE any letters for me?\u000f","p":1},{"t":"eg","x":"\u000eEWhat\u000f\u000eH is there\u000f\u000eE to do in this place?\u000f","p":1},{"t":"rule","x":"\u000eAWe often use \u000f\u000eFno\u000f\u000eA with a noun.\u000f","p":1},{"t":"eg","x":"\u000eEThere’s \u000f\u000eHno\u000f\u000eE hot water.\u000f","p":1},{"t":"rule","x":"\u000eAWe can use \u000f\u000eFthere\u000f\u000eA in a question tag.\u000f","p":1},{"t":"eg","x":"\u000eEThere’s enough time, \u000f\u000eHisn’t there?\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"\u000eFThere\u000f\u000eA can be the subject of a to-infinitive or an -ing form, although this is rather \u000f\u000eDliterary\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI didn’t expect \u000f\u000eHthere to be\u000f\u000eE such a crowd.\u000f","p":1},{"t":"eg","x":"\u000eEI love the idea of \u000f\u000eHthere being\u000f\u000eE life forms elsewhere in the universe.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"\u000eAWe can use this pattern with \u000f\u000eFthere\u000f\u000eA and an active or a passive \u000f\u000eDparticiple\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eHThere’s\u000f\u000eE someone \u000f\u000eHwaiting\u000f\u000eE for you.\u000f","note":"= Someone is waiting for you.","p":1},{"t":"eg","x":"\u000eHThere was\u000f\u000eE a van \u000f\u000eHparked\u000f\u000eE by the house.\u000f","note":"= A van was parked by the house.","p":1},{"t":"rule","x":"\u000eABut we do not use a participle for\u000f\u000eD a single complete action\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u0004There\u0005 was a noise that woke me up."},{"t":"wrong","x":"\u0004There\u0005 was a noise waking me up."},{"t":"rule","x":"When the relative pronoun is not the subject, we cannot use a participle."},{"t":"eg","x":"\u0004There\u0005’s something that I need to do."},{"t":"wrong","x":"\u0004There\u0005’s something needing to do."}]},{"l":"E","b":[{"t":"rule","x":"\u000eAAfter \u000f\u000eFthere\u000f\u000eA, other verbs are possible, but only in \u000f\u000eDa formal or literary style.\u000f","p":1},{"t":"eg","x":"\u000eENearby \u000f\u000eHthere stands\u000f\u000eE an ancient tower.\u000f","p":1},{"t":"eg","x":"\u000eHThere\u000f\u000eE now \u000f\u000eHfollows\u000f\u000eE a short interval.\u000f","p":1},{"t":"rule","x":"\u000eAThese verbs include: \u000f\u000eFappear, arise, arrive, come, enter, exist, follow, lie, live, occur, remain, result, sit, stand, take place.\u000f","p":1},{"t":"rule","x":"\u000eABetween \u000f\u000eFthere\u000f\u000eA and \u000f\u000eFbe\u000f\u000eA we can use \u000f\u000eFappear, chance, happen, prove, seem, tend, turn out, or use.\u000f","p":1},{"t":"eg","x":"\u000eHThere seems to be\u000f\u000eE no truth in the story.\u000f","p":1},{"t":"tip","x":"\u000eATo mention that something exists, say, e.g. \u000f\u000eEThere’s a bus service\u000f\u000eD,\u000f\u000eA not \u000f\u000eEA bus service is.\u000f","p":1}]}]},{"n":24,"t":"The empty subject it","u":"Sentences & Sentence Types","s":[{"l":"A","b":[{"t":"rule","x":"\u000eAWe can use \u000f\u000eFit\u000f\u000eA to refer to the \u000f\u000eDtime, distance, the environment, or the weather.\u000f","p":1},{"t":"eg","x":"\u000eHIt’s\u000f\u000eE half past three.\u000f","p":1},{"t":"eg","x":"\u000eEHow far is \u000f\u000eHit\u000f\u000eE to the hotel?\u000f","p":1},{"t":"eg","x":"\u000eEI\u000f\u000eHt’\u000f\u000eEll be busy in town.\u000f","p":1},{"t":"eg","x":"\u000eHIt\u000f\u000eE was cold yesterday.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eAEach of these sentences has a \u000f\u000eDclause as its subject.\u000f","p":1},{"t":"eg","x":"\u000eHTo make new friends\u000f\u000eB is difficult.\u000f","p":1},{"t":"eg","x":"\u000eHThat it rained\u000f\u000eB was a pity.\u000f","p":1},{"t":"rule","x":"\u000eAThis word order is \u000f\u000eDpossible but not very usua\u000f\u000eAl. Instead we use the subject \u000f\u000eFit\u000f\u000eA, and the clause comes later in the sentence.\u000f","p":1},{"t":"eg","x":"\u000eHIt\u000f\u000eE’s difficult to make new friends.\u000f","p":1},{"t":"eg","x":"\u000eHIt\u000f\u000eE was a pity that it rained.\u000f","p":1},{"t":"eg","x":"\u000eHIt\u000f\u000eE amazes me how much things cost.\u000f","p":1},{"t":"rule","x":"\u000eAWith a \u000f\u000eDgerund\u000f\u000eA clause we use both patterns.\u000f","p":1},{"t":"eg","x":"\u000eHMaking new friends\u000f\u000eB is difficult.\u000f","p":1},{"t":"eg","x":"\u000eHIt’\u000f\u000eEs difficult making new friends.\u000f","p":1},{"t":"rule","x":"\u000eAWe can also use \u000f\u000eFit\u000f\u000eA in the pattern: \u000f\u000eIsubject + verb + \u0001it\u0002 + complement + clause\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI find \u000f\u000eHit\u000f\u000eE difficult to make new friends.\u000f","p":1},{"t":"eg","x":"\u000eEWe all thought \u000f\u000eFit\u000f\u000eE a pity that it rained.\u000f","p":1},{"t":"wrong","x":"We all thought that \u0004it\u0005 rained a pity."}]},{"l":"C","b":[{"t":"rule","x":"\u000eFIt\u000f\u000eA can also be an empty subject before \u000f\u000eFappear, \u0001happen\u0002, \u0001seem\u0002,\u000f\u000eA and \u000f\u000eFturn out\u000f\u000eD.\u000f","p":1},{"t":"eg","x":"\u000eHIt seems\u000f\u000eE the phone has been stolen.\u000f","p":1},{"t":"eg","x":"\u000eHIt turned out\u000f\u000eE that the card was stolen.\u000f","p":1},{"t":"eg","x":"\u000eANote also the patterns \u000f\u000eDi\u000f\u000eFt looks as if / as though\u000f\u000eA and \u000f\u000eFit seems as if / as though.\u000f","p":1},{"t":"eg","x":"\u000eHIt looks as if\u000f\u000eE it’s going to rain.\u000f","p":1},{"t":"eg","x":"\u000eHIt seems as though\u000f\u000eE we’re not welcome.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"\u000eFIt\u000f\u000eA and \u000f\u000eFthere\u000f\u000eA can both be empty subjects, but they are used in different ways. \u000f\u000eFThere + be\u000f\u000eA expresses the fact that something exists or happens.\u000f","p":1},{"t":"rule","x":"\u000eFIt + be\u000f\u000eA refers to something \u000f\u000eDdefinite\u000f\u000eA and known in the situation, or it refers to the time or the environment.\u000f","p":1},{"t":"eg","x":"\u000eHThere\u000f\u000eE’s someone at the door. \u000f\u000eHIt\u000f\u000eE’s Jade.\u000f","p":1},{"t":"eg","x":"\u000eHIt\u000f\u000eE was Saturday, so \u000f\u000eHthere\u000f\u000eE weren’t any classes.\u000f","p":1},{"t":"rule","x":"\u000eHThere’\u000f\u000eEs quite a wind today. → Yes, \u000f\u000eHit\u000f\u000eE’s really windy, isn’t it?\u000f","p":1},{"t":"rule","x":"\u000eAWe normally use \u000f\u000eFthere\u000f\u000eA with a noun phrase of \u000f\u000eDindefinite\u000f\u000eA meaning, e.g. \u000f\u000eFsomeone, any classes, a wind.\u000f","p":1},{"t":"rule","x":"Compare these patterns."},{"t":"eg","x":"\u000eHThere i\u000f\u000eEsn’t any truth in the story.\u000f","p":1},{"t":"eg","x":"\u000eEThe story \u000f\u000eHhas\u000f\u000eE no truth in it.\u000f","p":1},{"t":"rule","x":"\u000eAAnd compare this pattern with \u000f\u000eFit\u000f\u000eA referring forward to a clause.\u000f","p":1},{"t":"eg","x":"\u000eHIt\u000f\u000eE isn’t true what they say.\u000f","p":1},{"t":"tip","x":"Don’t start a sentence with a clause, especially in speech. Say It was lovely to see you again, not To see you again was lovely."}]}]},{"n":25,"t":"Emphasis","u":"Sentences & Sentence Types","s":[{"l":"A","b":[{"t":"sub","x":"Emphatic stress"},{"t":"rule","x":"We can speak a word with greater force to make it more prominent and often to contrast it with something else."},{"t":"eg","x":"\u000eEI wanted a \u000f\u000eHlarge\u000f\u000eE packet, not a small one.\u000f","p":1},{"t":"rule","x":"\u000eAIn writing we can use \u000f\u000eCCAPITAL LETTERS\u000f\u000eA, \u000f\u000eDitalics\u000f\u000eA, \u000f\u000eCbold\u000f\u000eA or \u000f\u000eDunderlining\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"We can stress a word expressing an extreme quality or feeling."},{"t":"eg","x":"\u000eEIt’s a \u000f\u000eHhuge\u000f\u000eE building.\u000f","p":1},{"t":"eg","x":"\u000eEI’d \u000f\u000eHlove\u000f\u000eE a cup of coffee.\u000f","p":1},{"t":"eg","x":"\u000eEI’ve got a \u000f\u000eHterrible\u000f\u000eE memory\u000f\u000eD.\u000f","p":1},{"t":"rule","x":"\u000eAWhen a word has two or more syllables, only one syllable is spoken with stress. \u000f\u000eJTerr\u000f\u000eA has extra stress, but \u000f\u000eJible\u000f\u000eA is weakly stressed.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"Emphasis in the verb phrase"}]},{"l":"B","b":[{"t":"sub","x":"Emphasis in the verb phrase"},{"t":"rule","x":"\u000eAWe can stress the auxiliary or the ordinary verb \u000f\u000eIbe\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEYes, I \u000f\u000eHcan\u000f\u000eE swim – quite well, in fact.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHwasn’t\u000f\u000eE asleep. I was listening.\u000f","p":1},{"t":"rule","x":"\u000eAWe say \u000f\u000eHYes, I CAN\u000f\u000eE swim\u000f\u000eA in order to emphasize the positive meaning.\u000f","p":1},{"t":"rule","x":"\u000eAIn a simple tense we use \u000f\u000eCdo\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEOh, your garden \u000f\u000eHdoes\u000f\u000eE look nice.\u000f","p":1},{"t":"eg","x":"\u000eEI’m quite sure I \u000f\u000eHdid\u000f\u000eE download the file.\u000f","p":1},{"t":"rule","x":"\u000eAWe do not need to mark emphatic \u000f\u000eCdo\u000f\u000eA in writing:\u000f","p":1},{"t":"eg","x":"Your garden does look nice."},{"t":"rule","x":"Look at these examples."},{"t":"eg","x":"\u000eEWe \u000f\u000eHmight\u000f\u000eE go away for the weekend.\u000f","note":"possibly, not definitely","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHdid\u000f\u000eE have an MP3 player once.\u000f","note":"in the past, not now","p":1}]},{"l":"C","b":[{"t":"sub","x":"\u000eCEmphasis with \u000f\u000eGit\u000f","p":1},{"t":"rule","x":"To emphasize a phrase, we can use it + be + phrase + relative clause."},{"t":"rule","x":"Didn’t Edison invent the telephone? →"},{"t":"eg","x":"\u000eKNo, it was Bell\u000f\u000eB who invented the phone.\u000f","p":1},{"t":"eg","x":"\u000eHIt’s the light bulb\u000f\u000eE that Edison invented.\u000f","p":1},{"t":"eg","x":"\u000eHIt was me\u000f\u000eE who suggested the idea.\u000f","p":1},{"t":"eg","x":"\u000eHIt’s today\u000f\u000eE, not tomorrow, that we leave.\u000f","p":1}]},{"l":"D","b":[{"t":"sub","x":"\u000eCEmphasis with \u000f\u000eGwhat\u000f","p":1},{"t":"rule","x":"\u000eAWe can use a what-clause + \u000f\u000eCbe\u000f\u000eA to emphasize part of a sentence.\u000f","p":1},{"t":"eg","x":"\u000eHWhat\u000f\u000eE caused the crash was \u000f\u000eHbad driving\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eHWhat\u000f\u000eE you need is a \u0 },{"l":"B","b":[{"t":"rule","x":"\u000eAIn the negative we use \u000f\u000eJnot\u000f\u000eA or \u000f\u000eJn't\u000f\u000eI.\u000f","p":1},{"t":"eg","x":"\u000eEThe dogs \u000f\u000eHhave not eaten\u000f\u000eE their food.\u000f","p":1},{"t":"eg","x":"\u000eEThe post \u000f\u000eHhasn’t come\u000f\u000eE yet.\u000f","p":1},{"t":"rule","x":"\u000eAIn questions we put \u000f\u000eJhave\u000f\u000eA or \u000f\u000eJhas\u000f\u000eA before the subject.\u000f","p":1},{"t":"eg","x":"\u000eEHow long \u000f\u000eHhave you worked\u000f\u000eE here?\u000f","p":1},{"t":"eg","x":"\u000eHHas\u000f\u000eE Sarah \u000f\u000eHpassed\u000f\u000eE her exam?\u000f","p":1},{"t":"rule","x":"Use"}]},{"l":"C","b":[{"t":"rule","x":"\u000eAWhen we use the present perfect, we look\u000f\u000eD back from the present\u000f\u000eA. For example, we can use the present perfect for an action in a period leading up to the present.\u000f","p":1},{"t":"eg","x":"\u000eEThe café \u000f\u000eHhas just opened\u000f\u000eE.\u000f","note":"It is open now.","p":1},{"t":"eg","x":"\u000eEThe visitors \u000f\u000eHhave arrived\u000f\u000eE.\u000f","note":"They are here now.","p":1},{"t":"eg","x":"\u000eAThe period of time referred to by the present perfect \u000f\u000eDcan be very lon\u000f\u000eAg. It can cover the \u000f\u000eDwhole of history\u000f\u000eA or t\u000f\u000eDhe whole of someone’s life up to the present.\u000f","p":1},{"t":"eg","x":"\u000eEThere \u000f\u000eHhave \u000f\u000eEalways\u000f\u000eH been\u000f\u000eE wars.\u000f","p":1},{"t":"eg","x":"\u000eHHave\u000f\u000eE you ever\u000f\u000eH ridden\u000f\u000eE a horse?\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"\u000eAWe can use the present perfect for \u000f\u000eDa series of actions before now.\u000f","p":1},{"t":"eg","x":"\u000eHI've ridden\u000f\u000eE horses lots of times.\u000f","p":1},{"t":"eg","x":"\u000eEWe\u000f\u000eH’ve\u000f\u000eE often \u000f\u000eHtalked\u000f\u000eE about moving.\u000f","p":1},{"t":"rule","x":"\u000eAWe can also use the present perfect for\u000f\u000eD a state lasting up to the present.\u000f","p":1},{"t":"eg","x":"\u000eEThe film \u000f\u000eHhas been \u000f\u000eEon for about a week.\u000f","p":1},{"t":"eg","x":"\u000eHI’ve had\u000f\u000eE this computer for three years.\u000f","p":1}]},{"l":"E","b":[{"t":"eg","x":"\u000eASome typical time phrases with the present perfect are \u000f\u000eKjust\u000f\u000eB, \u000f\u000eKrecently\u000f\u000eB, \u000f\u000eKlately\u000f\u000eB, \u000f\u000eKyet\u000f\u000eB, \u000f\u000eKstill\u000f\u000eB, \u000f\u000eKalready\u000f\u000eB, \u000f\u000eKbefore\u000f\u000eB, \u000f\u000eKso far\u000f\u000eB, \u000f\u000eKever/never\u000f\u000eB, \u000f\u000eKtoday\u000f\u000eB, \u000f\u000eKfor weeks/years\u000f\u000eB, \u000f\u000eKsince 1998\u000f\u000eB.\u000f","p":1},{"t":"rule","x":"\u000eAFor \u000f\u000eCyet\u000f\u000eA, \u000f\u000eCstill\u000f\u000eA, and \u000f\u000eCalready\u000f\u000eA, \u000f\u000eB→ 125B–D.\u000f","p":1},{"t":"rule","x":"\u000eAFor more details of time phrases with the present perfect and simple past, \u000f\u000eB→ 32.\u000f","p":1},{"t":"tip","x":"In American English, the past simple is sometimes used when in British English the present perfect would be used. e.g. I just saw something very strange. Did you ever meet anyone famous?"}]}]},{"n":31,"t":"Past simple or present perfect?","u":"Verb Tenses","s":[{"l":"A","b":[{"t":"sub","x":"Actions"},{"t":"rule","x":"\u000eAThe choice of tense depends on whether the speaker sees something \u000f\u000eDas in the past or linked to the present.\u000f","p":1},{"t":"rule","x":"\u000eCPast: \u000f\u000eEThe car \u000f\u000eHbroke\u000f\u000eE down yesterday.\u000f","p":1},{"t":"rule","x":"\u000eCPresent: \u000f\u000eEThe car \u000f\u000eHhas broken\u000f\u000eE down.\u000f","note":"So it is out of action now.","p":1},{"t":"rule","x":"We use the past simple for a finished time. The car broke down does not tell us about the present — it may be all right now, or it may be still out of action."},{"t":"eg","x":"\u000eAThe present perfect makes a link to the present. \u000f\u000eEThe car \u000f\u000eHhas broken\u000f\u000eE down\u000f\u000eA tells us that it is out of action \u000f\u000eCnow\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"\u000eAWhen we refer to a specific time in the past (e.g. \u000f\u000eFyesterday\u000f\u000eA), we use the past simple rather than the present perfect.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"States"},{"t":"rule","x":"If a state is over, we use the past."},{"t":"eg","x":"\u000eEI \u000f\u000eHhad that\u000f\u000eE motorbike for years.\u000f","note":"Then I sold it.","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHwas there\u000f\u000eE from three o’clock to five.\u000f","note":"Then I left.","p":1},{"t":"rule","x":"If the state still exists now, we use the present perfect."},{"t":"eg","x":"\u000eEI’\u000f\u000eHve had this\u000f\u000eE motorbike for years.\u000f","p":1},{"t":"eg","x":"\u000eEI’\u000f\u000eHve been here\u000f\u000eE since three o’clock.\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"Repeated actions"},{"t":"rule","x":"When we use the past simple for repeated actions, it means that the series of actions is over."},{"t":"eg","x":"\u000eEGayle \u000f\u000eHacted\u000f\u000eE in more than fifty films.\u000f","note":"Her career is over.","p":1},{"t":"eg","x":"\u000eEGayle \u000f\u000eHhas acted\u000f\u000eE in more than fifty films.\u000f","note":"Her career has continued up to the present and may or may not be over.","p":1}]},{"l":"D","b":[{"t":"sub","x":"Reporting news"},{"t":"rule","x":"We often use the present perfect when we first tell some news, and then we use the past simple for the details such as when and how it happened."},{"t":"eg","x":"There has been a serious accident on the M6. It happened at ten o’clock this morning when a lorry went out of control and collided with a car."},{"t":"rule","x":"The same thing happens in conversation."},{"t":"eg","x":"\u000eEI’\u000f\u000eHve just been\u000f\u000eE on holiday.\u000f\u000eB ~ \u000f\u000eEOh, where \u000f\u000eHdid\u000f\u000eE you go?\u000f","p":1},{"t":"eg","x":"\u000eEThe new chairs \u000f\u000eHhave arrived\u000f\u000eE. They \u000f\u000eHcame\u000f\u000eE yesterday morning.\u000f","p":1},{"t":"tip","x":"The present perfect is often (but not always) used for recent events. The important thing is that we see the action or state as relevant to the present or in a period that includes the present."}]}]},{"n":32,"t":"Past simple and present perfect: time phrases","u":"Verb Tenses","s":[{"l":"A","b":[{"t":"sub","x":"\u000eLJust, recently\u000f\u000eC, and \u000f\u000eLalready\u000f","p":1},{"t":"rule","x":"\u000eAWe use \u000f\u000eFjust\u000f\u000eA \u0001and\u0002 \u000f\u000eFrecently\u000f\u000eA with either tense with \u000f\u000eDlittle difference\u000f\u000eA in meaning.\u000f","p":1},{"t":"eg","x":"\u000eEI’\u000f\u000eHve just heard\u000f\u000eE the news.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHjust heard\u000f\u000eE the news.\u000f","p":1},{"t":"eg","x":"\u000eAThere can be a difference with \u000f\u000eFalready\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI\u000f\u000eH’ve already\u000f\u000eE heard.\u000f\u000eA (before now)\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHalready knew\u000f\u000eE yesterday\u000f\u000eD.\u000f\u000eA (before then)\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"\u000eLOnce\u000f\u000eC, etc and \u000f\u000eLever, never\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"\u000eLOnce\u000f\u000eC, etc and \u000f\u000eLever, never\u000f","p":1},{"t":"rule","x":"\u000eFOnce, \u0001twice\u0002, \u0001etc\u0002.\u000f\u000eA with the present perfect means \u0001one\u0002 or \u0001more\u0002 times up to now.\u000f","p":1},{"t":"eg","x":"\u000eEWe\u000f\u000eH’ve\u000f\u000eE only \u000f\u000eHbeen\u000f\u000eE to Scotland \u000f\u000eHonce\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEWe\u000f\u000eH’ve been\u000f\u000eE there at least \u000f\u000eHthree times\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eAWith the past simple \u000f\u000eFonce\u000f\u000eA usually means one occasion in the past.\u000f","p":1},{"t":"eg","x":"\u000eEWe \u000f\u000eHwent\u000f\u000eE to Scotland \u000f\u000eHonce\u000f\u000eE – in 2002.\u000f","p":1},{"t":"rule","x":"\u000eFEver\u000f\u000eA or \u000f\u000eFnever\u000f\u000eA with the present perfect means ‘in all the time up to now’.\u000f","p":1},{"t":"eg","x":"\u000eEI’\u000f\u000eHve never done\u000f\u000eE white water rafting.\u000f","p":1},{"t":"eg","x":"\u000eHHave\u000f\u000eE you \u000f\u000eHever\u000f\u000eE visited our showroom?\u000f","p":1},{"t":"rule","x":"\u000eAThe past simple means a \u000f\u000eDfinished period.\u000f","p":1},{"t":"eg","x":"\u000eHDid\u000f\u000eE you \u000f\u000eHever visit\u000f\u000eE our \u000f\u000eHold\u000f\u000eE showroom?\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"\u000eLThis morning\u000f\u000eG,\u000f\u000eL this week,\u000f\u000eC etc\u000f","p":1},{"t":"rule","x":"Look at these examples:"},{"t":"eg","x":"\u000eEIt \u000f\u000eHhas been\u000f\u000eE windy \u000f\u000eHthis morning\u000f\u000eE.\u000f","note":"The morning is not yet over.","p":1},{"t":"eg","x":"\u000eEIt \u000f\u000eHwas\u000f\u000eE windy \u000f\u000eHthis morning\u000f\u000eE.\u000f","note":"It is now afternoon or evening.","p":1},{"t":"rule","x":"\u000eAWe usually use the present perfect for a period\u000f\u000eD \u0001not yet over\u0002\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI’\u000f\u000eHve watched\u000f\u000eE a lot of sport \u000f\u000eHthis week\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"But we use the past simple for one time during the period."},{"t":"eg","x":"\u000eEI \u000f\u000eHwatched\u000f\u000eE a great game \u000f\u000eHthis week\u000f\u000eE.\u000f","note":"earlier in the same week","p":1},{"t":"rule","x":"We often use the negative with an unfinished time."},{"t":"eg","x":"\u000eEIt \u000f\u000eHhasn’t been\u000f\u000eE / It \u000f\u000eHwasn’t\u000f\u000eE cold \u000f\u000eHtoday\u000f\u000eE.\u000f","p":1}]},{"l":"D","b":[{"t":"sub","x":"\u000eLFor\u000f\u000eC and \u000f\u000eLsince\u000f","p":1},{"t":"rule","x":"\u000eAWe often use \u000f\u000eFfor\u000f\u000eA and \u000f\u000eFsince\u000f\u000eA with the present perfect to express a state.\u000f","p":1},{"t":"eg","x":"\u000eEHe’\u000f\u000eHs been\u000f\u000eE ill \u000f\u000eHfor\u000f\u000eE two days / \u000f\u000eHsince\u000f\u000eE Monday.\u000f","p":1},{"t":"rule","x":"\u000eAWe use \u000f\u000eFfor\u000f\u000eA with the past simple to say \u000f\u000eDhow long something went on\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"The man stood there \u0004for\u0005 a moment."},{"t":"eg","x":"We walked \u0004for\u0005 hours that day."},{"t":"rule","x":"\u000eAWe use \u000f\u000eFfor\u000f\u000eA and \u000f\u000eFsince\u000f\u000eA with the negative present perfect to say when something last happened.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHhaven’t skied for\u000f\u000eE years / \u000f\u000eHsince\u000f\u000eE 2003.\u000f","p":1},{"t":"tip","x":"To say when something last happened, we can also use It’s … since … with either tense, e.g. • It’s years since I’ve skied or • It’s years since I last skied."}]}]},{"n":33,"t":"The past continuous","u":"Verb Tenses","s":[{"l":"A","b":[{"t":"sub","x":"Form"},{"t":"rule","x":"\u000eAThe past continuous is the past of \u000f\u000eJbe + ing-form\u000f\u000eI.\u000f","p":1},{"t":"eg","x":"\u000eEIt \u000f\u000eHwas getting\u000f\u000eE dark.\u000f","p":1},{"t":"eg","x":"\u000eEPeople \u000f\u000eHwere going\u000f\u000eE home from work.\u000f","p":1},{"t":"eg","x":"\u000eEMy mobile \u000f\u000eHwasn’t working.\u000f","p":1},{"t":"eg","x":"\u000eEWhat \u000f\u000eHwere\u000f\u000eE you \u000f\u000eHthinking\u000f\u000eE about?\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"Basic uses"},{"t":"rule","x":"\u000eAWe use the past continuous to express the idea that\u000f\u000eD at a time in the past we were in the middle of something.\u000f","p":1},{"t":"eg","x":"\u000eEAt 3 a.m. I \u000f\u000eHwas lying\u000f\u000eE there wide awake. The pub was full of people who \u000f\u000eHwere\u000f\u000eE all \u000f\u000eHwatching\u000f\u000eE football on a big screen.\u000f","p":1},{"t":"eg","x":"\u000eEWe stood there horrified. Water \u000f\u000eHwas pouring\u000f\u000eE through a hole in the ceiling.\u000f","p":1},{"t":"rule","x":"Compare the present continuous and past continuous."},{"t":"eg","x":"I’m travelling around the world.","note":"I am in the middle of my journey."},{"t":"eg","x":"\u000eEI \u000f\u000eHwas travelling\u000f\u000eE around the world.\u000f","note":"I was in the middle of my journey.","p":1},{"t":"rule","x":"(I was in the middle of my journey.)"},{"t":"rule","x":"We sometimes use the past continuous for an action going on over a whole period."},{"t":"eg","x":"The builders were working all night."},{"t":"rule","x":"\u000eAWe could also use the past simple (\u000f\u000eDworked\u000f\u000eA) here.\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"Past continuous and simple"},{"t":"rule","x":"An action in the past continuous can happen around a time or around another action."},{"t":"eg","x":"\u000eEIt \u000f\u000eHwas raining\u000f\u000eE at ten o’clock.\u000f","p":1},{"t":"eg","x":"\u000eEIt \u000f\u000eHwas raining\u000f\u000eE when I left.\u000f","p":1},{"t":"eg","x":"The past continuous is the longer action (the rain falling), and the past simple is the shorter, complete action (my leaving). The shorter action interrupts the longer one."},{"t":"eg","x":"\u000eEI \u000f\u000eHwas washing\u000f\u000eE my hair when you rang.\u000f","p":1},{"t":"eg","x":"\u000eEWhile we \u000f\u000eHwere waiting\u000f\u000eE, a man came in.\u000f","p":1},{"t":"rule","x":"But when one complete action followed another, we use the past simple for both."},{"t":"eg","x":"\u000eEThe bell \u000f\u000eHrang\u000f\u000eE, and Tim \u000f\u000eHwent\u000f\u000eE to the door.\u000f","p":1}]},{"l":"D","b":[{"t":"sub","x":"Past states"},{"t":"rule","x":"For a past state we normally use the simple."},{"t":"eg","x":"\u000eEThe woman \u000f\u000eHhad\u000f\u000eE long dark hair.\u000f","p":1},{"t":"eg","x":"\u000eEMy grandmother \u000f\u000eHloved\u000f\u000eE this house.\u000f","note":"not She was loving this house.","p":1},{"t":"rule","x":"\u000eASome verbs can be either simple or continuous for a temporary state. \u000f\u000eI➤36B\u000f","p":1},{"t":"eg","x":"\u000eEThe men \u000f\u000eHwore / were wearing\u000f\u000eE masks.\u000f","p":1},{"t":"tip","x":"Use the past simple for the main action and the continuous for the background, e.g. • The sun was shining. We walked along the beach. People were lying in the sun. Children were playing."}]}]},{"n":34,"t":"The present perfect continuous","u":"Verb Tenses","s":[{"l":"A","b":[{"t":"sub","x":"Form"},{"t":"rule","x":"\u000eAThe present perfect continuous is the present of \u000f\u000eJhave + been + ing-form\u000f\u000eI.\u000f","p":1},{"t":"eg","x":"\u000eEThe game \u000f\u000eHhas been going\u000f\u000eE on for ages.\u000f","p":1},{"t":"eg","x":"\u000eEYou h\u000f\u000eHaven’t been revising\u000f\u000eE enough.\u000f","p":1},{"t":"eg","x":"\u000eEHow long \u000f\u000eHhave \u000f\u000eEyou\u000f\u000eH been working\u000f\u000eE here?\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"Use"},{"t":"rule","x":"\u000eAWe use the present perfect continuous for \u000f\u000eDan action over a period of time leading up to the present.\u000f","p":1},{"t":"eg","x":"\u000eEWhere have you been? I’\u000f\u000eHve been waiting here\u000f\u000eE for half an hour.\u000f","p":1},{"t":"eg","x":"\u000eEIt’s wet here. The roof \u000f\u000eHhas been leaking\u000f\u000eD.\u000f","p":1},{"t":"rule","x":"We do not use the present simple."},{"t":"wrong","x":"I wait here \u0004for\u0005 half an hour."},{"t":"rule","x":"The action can be continuing in the present."},{"t":"eg","x":"\u000eEI’m waiting for Tom. 00eE / Max \u000f\u000eHhad typed\u000f\u000eE the message, he \u000f\u000eHmailed\u000f\u000eE it.\u000f","p":1},{"t":"rule","x":"Compare these examples:"},{"t":"eg","x":"\u000eEWhen I \u000f\u000eHarrived\u000f\u000eE, the meeting \u000f\u000eHbegan\u000f\u000eE.\u000f","note":"I arrived and then the meeting began.","p":1},{"t":"eg","x":"\u000eEWhen I \u000f\u000eHarrived\u000f\u000eE, the meeting \u000f\u000eHhad begun\u000f\u000eE.\u000f","note":"The meeting began before I arrived.","p":1}]},{"l":"C","b":[{"t":"sub","x":"The past perfect continuous"},{"t":"rule","x":"\u000eAThis tense is \u000f\u000eJhad been + ing-form\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eESomeone \u000f\u000eHhad been using\u000f\u000eE my computer.\u000f","p":1},{"t":"eg","x":"\u000eEUntil then things \u000f\u000eHhadn’t been going\u000f\u000eE well.\u000f","p":1},{"t":"eg","x":"\u000eHHad\u000f\u000eE you already \u000f\u000eHbeen practising?\u000f","p":1},{"t":"rule","x":"\u000eAWe use the past perfect continuous for an action that\u000f\u000eD went on over a period before a past time\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEWhen I \u000f\u000eHfound\u000f\u000eE the file, I\u000f\u000eH’d been looking\u000f\u000eE for it for some time.\u000f","p":1},{"t":"rule","x":"The action of looking went on for some time before the discovery of the file."}]},{"l":"D","b":[{"t":"sub","x":"Comparison of tenses"},{"t":"rule","x":"Compare these pairs of sentences."},{"t":"eg","x":"\u000eEI’m tired. I’\u000f\u000eHve been working.\u000f","p":1},{"t":"eg","x":"\u000eEI was tired. I’\u000f\u000eHd been working.\u000f","p":1},{"t":"eg","x":"\u000eEThe volunteers had\u000f\u000eH collected\u000f\u000eE hundreds of pounds\u000f\u000eD.\u000f\u000eA (result of the action)\u000f","p":1},{"t":"eg","x":"\u000eEThe volunteers \u000f\u000eHhad been collecting\u000f\u000eE money all morning\u000f\u000eD.\u000f\u000eA (the action going on)\u000f","p":1},{"t":"eg","x":"\u000eEWhen I saw Alice, she \
