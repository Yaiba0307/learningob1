000eAOffering: \u000f\u000eHIf\u000f\u000eE you’re hungry, help yourself.\u000f","p":1},{"t":"rule","x":"\u000eAWarning: \u000f\u000eHIf\u000f\u000eE you don’t copy the file, you risk losing the information.\u000f","p":1},{"t":"rule","x":"\u000eAThreatening: \u000f\u000eHIf\u000f\u000eE you don’t leave immediately, I’ll call the police.\u000f","p":1},{"t":"tip","x":"The standard types of conditional are not the only possible verb patterns. In general we can use verb forms in the same way as in other sentences. We can say We’ve finished, so we can go home, so we can also say If we’ve finished, we can go home."}]}]},{"n":156,"t":"Type 0 and 1 conditionals","u":"Conditionals & Unreal Past","s":[{"l":"A","b":[{"t":"rule","x":"\u000eAType 0 is \u000f\u000eIif ... + present ... + present.\u000f","p":1},{"t":"eg","x":"\u000eEIf the doorbell \u000f\u000eHrings\u000f\u000eE, the dog \u000f\u000eHbarks\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEThe batteries \u000f\u000eHtake\u000f\u000eE over if we \u000f\u000eHlose\u000f\u000eE power.\u000f","p":1},{"t":"rule","x":"One thing always follows automatically from another."},{"t":"rule","x":"\u000eAType 0 is also used for the automatic result of a possible\u000f\u000eD future action.\u000f","p":1},{"t":"eg","x":"\u000eEIf we \u000f\u000eHwin\u000f\u000eE the league, we \u000f\u000eHget\u000f\u000eE promoted.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eAType 1 is \u000f\u000eJif\u000f\u000eI ... + present ... + \u000f\u000eJwill\u000f\u000eI.\u000f","p":1},{"t":"eg","x":"\u000eEIf it \u000f\u000eHrains\u000f\u000eE, we’\u000f\u000eHll get\u000f\u000eE wet.\u000f","p":1},{"t":"eg","x":"\u000eEIf we \u000f\u000eHdon’t hurry\u000f\u000eE, we \u000f\u000eHwon’t be\u000f\u000eE in time.\u000f","p":1},{"t":"eg","x":"\u000eEThe milk \u000f\u000eHwill go\u000f\u000eE off if you \u000f\u000eHleave\u000f\u000eE it by the radiator.\u000f","p":1},{"t":"rule","x":"\u000eAThis is an open condition. \u000f\u000eEIf it rains\u000f\u000eA means that it may or may not rain.\u000f","p":1},{"t":"rule","x":"\u000eAWe \u000f\u000eDdo not\u000f\u000eA normally use \u000f\u000eJwill\u000f\u000eA in the if-clause.\u000f","p":1},{"t":"wrong","x":"If it will rain, ..."},{"t":"rule","x":"\u000eABut we can use \u000f\u000eJwill\u000f\u000eA in the if-clause for an action \u000f\u000eDhappening later than the action in the main clause.\u000f","p":1},{"t":"eg","x":"\u000eHIf\u000f\u000eE this medicine does me / will do me good, I’ll take it.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"As well as the present simple, we can use the present continuous or perfect."},{"t":"eg","x":"\u000eHIf\u000f\u000eE they’re having a party, it’ll be noisy.\u000f","p":1},{"t":"eg","x":"\u000eHIf\u000f\u000eE I’ve finished my work by ten, I’ll probably watch a film on TV.\u000f","p":1},{"t":"rule","x":"\u000eAAs well as \u000f\u000eJwill\u000f\u000eA, we can use other modal verbs and similar expressions.\u000f","p":1},{"t":"eg","x":"\u000eHIf\u000f\u000eE they ask me, how \u000f\u000eHshould\u000f\u000eE I answer?\u000f","p":1},{"t":"eg","x":"\u000eEI’m \u000f\u000eHgoing to look\u000f\u000eE silly \u000f\u000eHif\u000f\u000eE it all goes wrong\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"We can use the imperative."},{"t":"eg","x":"\u000eHIf\u000f\u000eE you make a mistake, \u000f\u000eHcorrect it\u000f\u000eE.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"\u000eAA present tense in the if-clause can\u000f\u000eD refer to the present.\u000f","p":1},{"t":"eg","x":"\u000eHIf\u000f\u000eE it’s raining, I’m not going out.\u000f","p":1},{"t":"rule","x":"\u000eHIf\u000f\u000eE you think you can do the job, why not apply for it? \u000f","p":1}]},{"l":"E","b":[{"t":"rule","x":"\u000eAWe can use \u000f\u000eCwill\u000f\u000eA in the if-clause for willingness and \u000f\u000eCwon’t\u000f\u000eA for a refusal.\u000f","p":1},{"t":"eg","x":"\u000eHIf\u000f\u000eE Tom \u000f\u000eHwill\u000f\u000eE lend a hand, we’ll soon finish.\u000f","p":1},{"t":"eg","x":"\u000eHIf\u000f\u000eE the car \u000f\u000eHwon’t\u000f\u000eE start, I’ll take the bus.\u000f","p":1}]},{"l":"F","b":[{"t":"rule","x":"\u000eAInstead of a Type 1 with \u000f\u000eCif\u000f\u000eA you + simple present, we can use these patterns in informal speech.\u000f","p":1},{"t":"eg","x":"Touch me and I’ll scream.","note":"If you touch me, I’ll scream."},{"t":"eg","x":"Go away or I’ll scream.","note":"If you don’t go away, I’ll scream."},{"t":"tip","x":"We can use will in an if-clause for a request. If you’ll take a seat, someone will be with you in a moment. If you’ll just sign here, please. Thank you."}]}]},{"n":157,"t":"Type 2 conditionals","u":"Conditionals & Unreal Past","s":[{"l":"A","b":[{"t":"rule","x":"\u000eAType 2 is \u000f\u000eJif\u000f\u000eI ... + past ... + \u000f\u000eJwould\u000f\u000eI.\u000f","p":1},{"t":"eg","x":"\u000eEIf I \u000f\u000eHhad\u000f\u000eE the money, I \u000f\u000eHwould buy\u000f\u000eE a yacht.\u000f","p":1},{"t":"eg","x":"\u000eEI’\u000f\u000eHd tell\u000f\u000eE you the answer if I \u000f\u000eHknew\u000f\u000eE it.\u000f","p":1},{"t":"eg","x":"\u000eEIf the plane \u000f\u000eHwasn’t\u000f\u000eE safe, we wouldn’t fly.\u000f","p":1},{"t":"eg","x":"\u000eEIf we \u000f\u000eHlived\u000f\u000eE in the countryside, I’\u000f\u000eHd have\u000f\u000eE a longer journey to work.\u000f","p":1},{"t":"rule","x":"The past tense expresses an unreal condition. If I had the money means that I haven’t really got it, but I am imagining a situation where I have."},{"t":"rule","x":"\u000eAWe do not normally use \u000f\u000eCwould\u000f\u000eA in the if-clause.\u000f","p":1},{"t":"wrong","x":"If I would have the money, ..."}]},{"l":"B","b":[{"t":"rule","x":"\u000eAWe also use Type 2 for the \u000f\u000eDfuture\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEIf we \u000f\u000eHleft\u000f\u000eE early tomorrow, we\u000f\u000eH’d be\u000f\u000eE in Manchester by lunchtime.\u000f","p":1},{"t":"eg","x":"\u000eEIf you \u000f\u000eHlost\u000f\u000eE the video, you \u000f\u000eHwould have\u000f\u000eE to pay for a new one\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"Compare Types 1 and 2."},{"t":"rule","x":"\u000eA1: \u000f\u000eEIf we \u000f\u000eHtake\u000f\u000eE a taxi, it\u000f\u000eH’ll be\u000f\u000eE quicker\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"\u000eA2: \u000f\u000eEIf we \u000f\u000eHtook\u000f\u000eE a taxi, it\u000f\u000eH’d be\u000f\u000eE quicker.\u000f","p":1},{"t":"rule","x":"Type 1 expresses an open possibility – we may or may not take a taxi."},{"t":"rule","x":"\u000eAType 2 expresses a \u000f\u000eDtheoretical\u000f\u000eA possibility – something less real.\u000f","p":1},{"t":"rule","x":"Normally we do not mix Types 1 and 2."},{"t":"wrong","x":"If you break it, you’d be in trouble."},{"t":"wrong","x":"If you broke it, you’ll be in trouble."}]},{"l":"C","b":[{"t":"rule","x":"\u000eAAs well as the past simple, we can use the past continuous or \u000f\u000eJcould\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEIf the sun \u000f\u000eHwas shining\u000f\u000eE, it’\u000f\u000eHd be\u000f\u000eE perfect.\u000f","p":1},{"t":"eg","x":"\u000eEIf I \u000f\u000eHcould have\u000f\u000eE my child looked after, I \u000f\u000eHwould go\u000f\u000eE out to work.\u000f","p":1},{"t":"rule","x":"\u000eAAs well as \u000f\u000eJwould\u000f\u000eA, we can use other modal verbs such as \u000f\u000eJcould\u000f\u000eA or \u000f\u000eJmight\u000f\u000eA in the main clause.\u000f","p":1},{"t":"eg","x":"\u000eEIf I \u000f\u000eHhad\u000f\u000eE a light, I \u000f\u000eHcould\u000f\u000eE see.\u000f","p":1},{"t":"eg","x":"\u000eEIf we \u000f\u000eHcould\u000f\u000eE re-start the computer, that \u000f\u000eHmight\u000f\u000eE solve the problem.\u000f","p":1},{"t":"rule","x":"We can also use continuous forms."},{"t":"eg","x":"\u000eEIf Shakespeare \u000f\u000eHwas\u000f\u000eE alive today, he \u000f\u000eHwould be writing\u000f\u000eE for television.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"\u000eAWe can use \u000f\u000eJwould\u000f\u000eA in the if-clause for a request.\u000f","p":1},{"t":"eg","x":"\u000eEIf you’\u000f\u000eHd\u000f\u000eE just \u000f\u000eHsign\u000f\u000eE here, please. Thank you.\u000f","p":1},{"t":"eg","x":"\u000eEIf you \u000f\u000eHwouldn’t mind\u000f\u000eE holding the line, I’ll try to put you through.\u000f","p":1},{"t":"rule","x":"\u000eAIn a main clause we can use \u000f\u000eJwill\u000f\u000eA or \u000f\u000eJcan\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"\u000eAWe can also use \u000f\u000eJwould like\u000f\u000eA in an if-clause, e.g. for a suggestion.\u000f","p":1},{"t":"eg","x":"\u000eEIf you\u000f\u000eH’d like\u000f\u000eE to see the exhibition, it would be nice to go together.\u000f","p":1},{"t":"tip","x":"We can use a Type 2 conditional for a polite request, e.g. Would it be all right if I brought a friend? This is less direct and so more polite than Will it be all right if I bring a friend?"}]}]},{"n":158,"t":"Type 3 conditionals","u":"Conditionals & Unreal Past","s":[{"l":"A","b":[{"t":"rule","x":"\u000eAType 3 is \u000f\u000eJif\u000f\u000eI ... + past perfect ... + \u000f\u000eJwould\u000f\u000eI + perfect\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEIf you \u000f\u000eHhad come\u000f\u000eE on your bike, you \u000f\u000eHwould have been\u000f\u000eE in time.\u000f","p":1},{"t":"eg","x":"\u000eEMy brother \u000f\u000eHwould have been\u000f\u000eE promoted if he’\u000f\u000eHd stayed\u000f\u000eE in his job.\u000f","p":1},{"t":"eg","x":"\u000eEWe’\u000f\u000eHd have gone\u000f\u000eE to the concert if we’\u000f\u000eHd known\u000f\u000eE about it.\u000f","note":"We would have gone if we had known.","p":1},{"t":"rule","x":"The verb forms refer to something unreal, an imaginary past action. If you had come on your bike means that really you didn’t come on your bike, but I am imagining a situation where you did."},{"t":"rule","x":"We do not use the past simple or past perfect in the main clause."},{"t":"eg","x":"\u000eEWe \u000f\u000eHwould have got\u000f\u000eE lost if we hadn’t bought a map.\u000f","p":1},{"t":"wrong","x":"We had got lost if we hadn’t bought a map."},{"t":"rule","x":"\u000eAAnd we do not normally use \u000f\u000eJwould\u000f\u000eA in the if-clause.\u000f","p":1},{"t":"eg","x":"\u000eEIf you’\u000f\u000eHd lent\u000f\u000eE him the money, you would never have got it back.\u000f","p":1},{"t":"wrong","x":"If you would have lent him the money, you would never have got it back."},{"t":"rule","x":"\u000eAYou may hear clauses such as \u000f\u000eEif we would have done\u000f\u000eA in informal speech. But many people regard it as incorrect.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eAWe can use \u000f\u000eIcould + perfect\u000f\u000eA in the if-clause.\u000f","p":1},{"t":"eg","x":"\u000eEIf I \u000f\u000eHcould have warned\u000f\u000eE you in time, I would have done.\u000f","p":1},{"t":"rule","x":"\u000eAAs well as \u000f\u000eJwould\u000f\u000eA, we can use other modal verbs such as \u000f\u000eJcould\u000f\u000eA or \u000f\u000eJmight\u000f\u000eA in the main clause.\u000f","p":1},{"t":"eg","x":"\u000eEIf I’d written the address down, I \u000f\u000eHcould have saved\u000f\u000eE myself a lot of trouble.\u000f","p":1},{"t":"eg","x":"\u000eEThe plan \u000f\u000eHmight not have worked\u000f\u000eE if we hadn’t had a piece of luck.\u000f","p":1},{"t":"rule","x":"We can also use continuous forms."},{"t":"eg","x":"\u000eEIf he had had any money, he \u000f\u000eHwouldn’t have been sleeping\u000f\u000eE on the streets.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"We can mix Types 2 and 3."},{"t":"eg","x":"\u000eEIf Tom really \u000f\u000eHwas\u000f\u000eE ambitious, he \u000f\u000eHwould have found\u000f\u000eE a decent job years ago.\u000f","p":1},{"t":"eg","x":"\u000eEIf you \u000f\u000eHhadn’t woken\u000f\u000eE me up in the night, I \u000f\u000eHwouldn’t feel\u000f\u000eE so tired now.\u000f","p":1},{"t":"rule","x":"We can also use a Type 1 condition with a Type 3 main clause."},{"t":"eg","x":"\u000eEIf you \u000f\u000eHknow\u000f\u000eE London so well, you \u000f\u000eHshouldn’t have got\u000f\u000eE so hopelessly lost.\u000f","p":1},{"t":"tip","x":"We can use a Type 3 condition to point out that we were not at fault and to put the blame on someone else, e.g. If you hadn’t insisted on taking so much stuff, we wouldn’t have had to pay excess baggage."}]}]},{"n":159,"t":"Should, were, had, and inversion","u":"Conditionals & Unreal Past","s":[{"l":"","b":[{"t":"rule","x":"\u000eAThe following types of clause are rather formal. It is more usual to use Types 1–3, \u000f\u000eB➤\u000f\u000eK156–158\u000f\u000eA.\u000f","p":1}]},{"l":"A","b":[{"t":"rule","x":"\u000eAWe can use \u000f\u000eJshould\u000f\u000eA for something that might possibly happen.\u000f","p":1},{"t":"rule","x":"\u000eEIf you \u000f\u000eHshould\u000f\u000eE fall ill, we will pay your medical expenses.\u000f","p":1},{"t":"eg","x":"\u000eEIf I \u000f\u000eHshould\u000f\u000eE be elected, I would do my best to represent your interests.\u000f","p":1},{"t":"eg","x":"\u000eAMore neutral would be \u000f\u000eEIf you fall ill\u000f\u000eA, ... and \u000f\u000eEIf I was elected\u000f\u000eA ...\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eASometimes we use \u000f\u000eJwere\u000f\u000eA instead of \u000f\u000eJwas\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEIf the picture was/\u000f\u000eHwere\u000f\u000eE genuine, it would be worth millions of pounds.\u000f","p":1},{"t":"rule","x":"\u000eAWe can also use \u000f\u000eJwere\u000f\u000eA for a theoretical possibility.\u000f","p":1},{"t":"eg","x":"\u000eEIf the decision \u000f\u000eHwere to\u000f\u000eE go against us, we would appeal.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"\u000eAIn a condition with \u000f\u000eJshould\u000f\u000eA or \u000f\u000eJwere\u000f\u000eA, we can invert the subject and verb and leave out \u000f\u000eJif\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eHShould you \u000f\u000eEfall ill, we will pay your medical expenses.\u000f","p":1},{"t":"eg","x":"\u000eHShould we\u000f\u000eE not succeed, the consequences would be disastrous.\u000f","p":1},{"t":"eg","x":"\u000eHWere the decision\u000f\u000eE to go against us, we would appeal.\u000f","p":1},{"t":"eg","x":"\u000eHWere the picture \u000f\u000eEgenuine, it would be worth millions of pounds.\u000f","p":1},{"t":"rule","x":"\u000eAWe cannot do this with \u000f\u000eJwas\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEIf the picture \u000f\u000eHwas\u000f\u000eE genuine, it ...\u000f","p":1},{"t":"wrong","x":"Was the picture genuine, it ..."},{"t":"rule","x":"Compare these sentences."},{"t":"eg","x":"\u000eHIf I hadn’t\u000f\u000eE carried out the order, I would have lost my job.\u000f","p":1},{"t":"eg","x":"\u000eHHad I not\u000f\u000eE carried out the order, I would have lost my job.\u000f","p":1},{"t":"rule","x":"\u000eAA Type 3 if-clause has the past perfect (\u000f\u000eEIf I hadn’t carried\u000f\u000eC ...\u000f\u000eA, \u000f\u000eB➤\u000f\u000eK158\u000f\u000eA). In more formal English, we can invert the subject and \u000f\u000eJhad\u000f","p":1},{"t":"rule","x":"\u000eA(\u000f\u000eHHad I not ...\u000f\u000eA).\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"\u000eALook at these examples with \u000f\u000eJnot for\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI’d give up teaching \u000f\u000eHif it wasn’t for\u000f\u000eE the long holidays.\u000f","note":"Without the long holidays, I would give up teaching.","p":1},{"t":"eg","x":"\u000eEYou saved my life. \u000f\u000eHIf it hadn’t been for\u000f\u000eE you/\u000f\u000eHHad \u000f\u000eLit \u000f\u000eHnot been for\u000f\u000eE you, I would have drowned.\u000f","note":"Without you, I would have drowned.","p":1},{"t":"rule","x":"\u000eAWe can also use \u000f\u000eJbut for\u000f\u000eB ➤\u000f\u000eK161B\u000f","p":1},{"t":"tip","x":"We can use happen to or by chance for something that is not very probable, e.g. • If you (\u0001should\u0002) happen to fall ill, you don’t need to worry about the bills, • If by chance you (\u0001should\u0002) come across a copy of the book, make sure you buy it."}]}]},{"n":160,"t":"More about if","u":"Conditionals & Unreal Past","s":[{"l":"","b":[{"t":"rule","x":"160. More \u0001about\u0002 if <done>"}]},{"l":"A","b":[{"t":"sub","x":"\u000eLWhen \u000f\u000eCand \u000f\u000eLif\u000f","p":1},{"t":"rule","x":"Compare these sentences."},{"t":"eg","x":"\u000eHWhen\u000f\u000eE Amy comes, can you let her in?\u000f","note":"Amy will come.","p":1},{"t":"eg","x":"\u000eHIf\u000f\u000eE Amy comes, can you let her in?\u000f","note":"Amy might come.","p":1},{"t":"rule","x":"\u000eAWe use \u000f\u000eJif\u000f\u000eA (not \u000f\u000eJwhen\u000f\u000eA) for an unreal condition.\u000f","p":1},{"t":"eg","x":"\u000eHIf\u000f\u000eE I had a camera, I could take a photo.\u000f","p":1},{"t":"rule","x":"\u000eAIn some contexts \u000f\u000eJwhen\u000f\u000eA and \u000f\u000eJif\u000f\u000eA are both possible.\u000f","p":1},{"t":"eg","x":"\u000eEI feel nervous \u000f\u000eHwhen/if\u000f\u000eE I’m flying.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"Then"},{"t":"rule","x":"\u000eAAfter an \u000f\u000eIif-clause\u000f\u000eA we can use \u000f\u000eJthen\u000f\u000eA in the main clause. \u000f\u000eJThen\u000f\u000eA emphasizes the link between the two ideas.\u000f","p":1},{"t":"rule","x":"\u000eEIf the figures don’t add \u0001up\u0002, \u000f\u000eHthen\u000f\u000eE you must have made a mistake.\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"Short clauses"},{"t":"rule","x":"\u000eAWe can sometimes use a short clause with \u000f\u000eCif\u000f\u000eA without a subject and verb.\u000f","p":1},{"t":"eg","x":"\u000eEI’d like a sea view \u000f\u000eHif\u000f\u000eE (that is) possible.\u000f","p":1},{"t":"eg","x":"\u000eHIf\u000f\u000eE (you are) in difficulty, call this number.\u000f","p":1}]},{"l":"D","b":[{"t":"sub","x":"What if"},{"t":"rule","x":"\u000eCWhat if\u000f\u000eA asks you to imagine a situation.\u000f","p":1},{"t":"eg","x":"\u000eHWhat if\u000f\u000eE we can’t get tickets?\u000f","p":1},{"t":"eg","x":"\u000eHWhat if\u000f\u000eE you’d had an accident?\u000f","p":1}]},{"l":"E","b":[{"t":"sub","x":"Even if"},{"t":"rule","x":"Look at this example."},{"t":"eg","x":"\u000eEI’m going to solve this puzzle \u000f\u000eHeven if\u000f\u000eE it takes me all night.\u000f","note":"It may or may not take me all night, but I’m going to solve it.","p":1}]},{"l":"F","b":[{"t":"sub","x":"Unless"},{"t":"rule","x":"\u000eCUnless\u000f\u000eA with a positive verb is equivalent to \u000f\u000eCif\u000f\u000eA with a negative verb.\u000f","p":1},{"t":"rule","x":"\u000eEWe’ll go broke \u000f\u000eHunless\u000f\u000eE we find a sponsor.\u000f","p":1},{"t":"rule","x":"(… if we don’t find a sponsor)"},{"t":"rule","x":"The main clause can be negative."},{"t":"rule","x":"\u000eEYou can’t play \u000f\u000eHunless\u000f\u000eE you’re a member.\u000f","p":1},{"t":"rule","x":"\u000eA(You can play \u000f\u000eConly\u000f\u000eA if you’re a member.)\u000f","p":1},{"t":"rule","x":"\u000eAWe do not normally use \u000f\u000eCunless\u000f\u000eA meaning \u000f\u000eCif not\u000f\u000eA in an unreal condition.\u000f","p":1},{"t":"eg","x":"\u000eHIf\u000f\u000eE I hadn’t fallen, I would have won.\u000f","p":1},{"t":"wrong","x":"\u0004Unless\u0005 I had fallen, …"},{"t":"rule","x":"\u000eAAnd we do not use \u000f\u000eCunless\u000f\u000eA when talking about a feeling caused by something not happening.\u000f","p":1},{"t":"eg","x":"\u000eEI’ll be upset \u000f\u000eHif\u000f\u000eE you don’t come.\u000f","p":1},{"t":"wrong","x":"I’ll be upset \u0004unless\u0005 you come."},{"t":"tip","x":"\u000eAWe can use \u000f\u000eCwhat if\u000f\u000eA to make a suggestion, e.g. \u000f\u000eHWhat if\u000f\u000eE we all meet up this evening?\u000f","p":1}]}]},{"n":161,"t":"Other ways of expressing a condition","u":"Conditionals & Unreal Past","s":[{"l":"A","b":[{"t":"sub","x":"\u000eLAs long as, provided,\u000f\u000eC etc\u000f","p":1},{"t":"rule","x":"\u000eAAs well as \u000f\u000eFif\u000f\u000eA, we can use \u000f\u000eFas/so long as\u000f\u000eA to express a condition.\u000f","p":1},{"t":"rule","x":"\u000eEYou can smoke \u000f\u000eHas long as\u000f\u000eE you do it outside the building.\u000f","p":1},{"t":"eg","x":"\u000eEI don’t care what a car looks like \u000f\u000eHso long as\u000f\u000eE it gets me from A to B.\u000f","p":1},{"t":"rule","x":"\u000eAWe can also use \u000f\u000eFprovided (that), providing (that)\u000f\u000eA, and \u000f\u000eFon condition that.\u000f","p":1},{"t":"eg","x":"\u000eEThe machine will last for years \u000f\u000eHprovided (that)\u000f\u000eE it is looked after properly.\u000f","p":1},{"t":"eg","x":"\u000eEThe country was \u000f\u000eHgiven aid on condition that\u000f\u000eE it signed a trade agreement.\u000f","p":1},{"t":"rule","x":"These conjunctions are more formal."}]},{"l":"B","b":[{"t":"sub","x":"\u000eLIn case of, with\u000f\u000eJ,\u000f\u000eC etc\u000f","p":1},{"t":"rule","x":"\u000eAWe can use the prepositions \u000f\u000eFin case of\u000f\u000eA and \u000f\u000eFin the event of.\u000f","p":1},{"t":"eg","x":"\u000eHIn case of fire\u000f\u000eE, break glass.\u000f\u000eA (on a sign)\u000f","note":"If there is a fire, ...","p":1},{"t":"eg","x":"\u000eHIn the event of \u000f\u000eEa major emergency, local hospitals would be alerted.\u000f","note":"If there was a major emergency, ...","p":1},{"t":"eg","x":"\u000eAThe prepositions \u000f\u000eFwith, without\u000f\u000eA, and \u000f\u000eFbut for\u000f\u000eA can also express a condition.\u000f","p":1},{"t":"eg","x":"\u000eHWith\u000f\u000eE more time, we could do it properly.\u000f","note":"If we had more time, ...","p":1},{"t":"eg","x":"\u000eHWithout\u000f\u000eE the map, I’d have got lost.\u000f","note":"If I hadn’t had the map, ...","p":1},{"t":"eg","x":"\u000eHBut for\u000f\u000eE you, I’d have drowned.\u000f","note":"If it hadn’t been for you, ...","p":1},{"t":"rule","x":"\u000eFIn that case\u000f\u000eA means ‘if that is so’.\u000f","p":1},{"t":"eg","x":"\u000eEI’ve lost my ticket. ~ \u000f\u000eHIn that case\u000f\u000eE, you’ll have to buy another one.\u000f","p":1},{"t":"rule","x":"\u000eFOtherwise\u000f\u000eA means ‘if that is not so’.\u000f","p":1},{"t":"eg","x":"\u000eEHold on tight, \u000f\u000eHotherwise\u000f\u000eE you might fall.\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"In case"},{"t":"rule","x":"\u000eACompare \u000f\u000eFif\u000f\u000eA and \u000f\u000eFin case.\u000f","p":1},{"t":"eg","x":"\u000eEI’ll get some money from the bank \u000f\u000eHif\u000f\u000eE I need some.\u000f","note":"I’ll wait until I need some and then get it.","p":1},{"t":"eg","x":"\u000eEI’ll get some money from the bank \u000f\u000eHin case\u000f\u000eE I need some.\u000f","note":"I’ll get some now because I might need it later.","p":1},{"t":"rule","x":"\u000eAWe can use \u000f\u000eFshould\u000f\u000eA after \u000f\u000eFin case.\u000f","p":1},{"t":"eg","x":"\u000eEI had some water \u000f\u000eHin case\u000f\u000eE I woke up / I \u000f\u000eHshould\u000f\u000eE wake up thirsty in the night\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"\u000eAWe can use \u000f\u000eFin case\u000f\u000eA as an adverbial.\u000f","p":1},{"t":"eg","x":"\u000eEI’ll take an umbrella (just) \u000f\u000eHin case\u000f\u000eE.\u000f","p":1},{"t":"tip","x":"\u000eAIn American English \u000f\u000eFin case\u000f\u000eA can mean the same as if, e.g. \u000f\u000eHIn case\u000f\u000eE you need any help, let me know.\u000f","p":1}]}]},{"n":162,"t":"Unreal past and subjunctive","u":"Conditionals & Unreal Past","s":[{"l":"A","b":[{"t":"sub","x":"The unreal present and past"},{"t":"rule","x":"After \u0001as if\u0002, \u0001as though\u0002, \u0001if\u0002, imagine, suppose, and supposing, we can use the past tense for something unreal in the present or something unlikely to happen in the future."},{"t":"eg","x":"\u000eEImagine you want/\u000f\u000eHwanted\u000f\u000eE to murder someone. How would you go about it?\u000f","p":1},{"t":"eg","x":"\u000eESuppose we win/\u000f\u000eHwon\u000f\u000eE the lottery.\u000f","p":1},{"t":"rule","x":"\u000eAAfter \u000f\u000eFit’s time\u000f\u000eA and \u000f\u000eFwould rather\u000f\u000eA, we do \u000f\u000eDnot\u000f\u000eA normally use the\u000f\u000eD present tense.\u000f","p":1},{"t":"eg","x":"\u000eEIt’s time you \u000f\u000eHhad\u000f\u000eE your hair cut.\u000f","p":1},{"t":"eg","x":"\u000eEI’d rather we all \u000f\u000eHtravelled\u000f\u000eE together.\u000f","p":1},{"t":"rule","x":"\u000eAFor an \u000f\u000eDunreal\u000f\u000eA situation in the \u000f\u000eDpast\u000f\u000eA, we use the\u000f\u000eD past perfect.\u000f","p":1},{"t":"eg","x":"\u000eESuppose you\u000f\u000eH’d fallen\u000f\u000eE. What then?\u000f","p":1},{"t":"eg","x":"\u000eEHe walked past as if he \u000f\u000eHhadn’t seen\u000f\u000eE me.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"The subjunctive"},{"t":"rule","x":"\u000eAThe subjunctive is the \u000f\u000eDbase\u000f\u000eA form of a verb. There is no \u000f\u000eF-s\u000f\u000eA in the third person singular.\u000f","p":1},{"t":"eg","x":"\u000eEWe propose that work \u000f\u000eHgo\u000f\u000eE ahead.\u000f","p":1},{"t":"eg","x":"\u000eEIt is important that exact records \u000f\u000eHbe\u000f\u000eE kept.\u000f","p":1},{"t":"rule","x":"We can use the subjunctive in a \u0001that-clause\u0002 saying that something is necessary. It follows a clause with e.g. demand, essential, insist, recommend, request, suggest."},{"t":"rule","x":"\u000eCThe subjunctive\u000f\u000eA is rather formal and used more in America than in Britain, where other forms are often used.\u000f","p":1},{"t":"eg","x":"\u000eEWe propose that work \u000f\u000eHshould go\u000f\u000eE ahead.\u000f","p":1},{"t":"eg","x":"\u000eEIt is important that exact records \u000f\u000eHare kept.\u000f","p":1},{"t":"rule","x":"\u000eAThere is a\u000f\u000eD past subjunctive\u000f\u000eA form \u000f\u000eFwere\u000f\u000eA, which we can use instead of \u000f\u000eFwas\u000f\u000eA in the first and third person singular.\u000f","p":1},{"t":"eg","x":"\u000eEIf I was/\u000f\u000eHwere\u000f\u000eE a bit taller, I could reach.\u000f","p":1},{"t":"eg","x":"\u000eESuppose the story was/\u000f\u000eHwere\u000f\u000eE true.\u000f","p":1},{"t":"rule","x":"\u000eAWe can use it after \u000f\u000eFas if\u000f\u000eI, \u000f\u000eFsuppose\u000f\u000eA, etc.\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"\u000eCVerbs after \u000f\u000eLwish\u000f","p":1},{"t":"rule","x":"\u000eATo wish for a \u000f\u000eDfuture\u000f\u000eA change, we use \u000f\u000eFwould\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI wish Simon\u000f\u000eH would reply\u000f\u000eE to my emails.\u000f","p":1},{"t":"rule","x":"\u000eATo wish that the \u000f\u000eDpresent situation \u0001could\u0002 be different\u000f\u000eA, we use the \u000f\u000eDpast\u000f\u000eA or \u000f\u000eFcould\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI wish I \u000f\u000eHhad\u000f\u000eE more spare time.\u000f","p":1},{"t":"wrong","x":"I wish I \u0004would\u0005 have more spare time."},{"t":"eg","x":"\u000eEI wish I \u000f\u000eHcould help\u000f\u000eE, but I can’t.\u000f","p":1},{"t":"rule","x":"\u000eAFor a wish about the \u000f\u000eDpast\u000f\u000eA, we use the\u000f\u000eF past perfect or could + perfect.\u000f","p":1},{"t":"eg","x":"\u000eEI wish I’\u000f\u000eHd\u000f\u000eE never \u000f\u000eHbought\u000f\u000eE this lousy car.\u000f","p":1},{"t":"eg","x":"\u000eEI wish you \u000f\u000eHcould have come\u000f\u000eE to our party.\u000f","p":1},{"t":"rule","x":"\u000eAWe can use \u000f\u000eFif only\u000f\u000eA instead of \u000f\u000eFI wish\u000f\u000eI.\u000f","p":1},{"t":"eg","x":"\u000eHIf only\u000f\u000eE I \u000f\u000eHhad\u000f\u000eE more spare time.\u000f","p":1},{"t":"tip","x":"\u000eEIf I were you\u000f\u000eA is useful for giving people advice, e.g. \u000f\u000eHIf I were you\u000f\u000eE, I wouldn’t worry.\u000f","p":1}]}]},{"n":163,"t":"Noun clauses","u":"Noun Clauses","s":[{"l":"A","b":[{"t":"rule","x":"\u000eAA noun clause begins with \u000f\u000eFthat\u000f\u000eA, \u0001a\u0002\u000f\u000eD question word\u000f\u000eA, or \u000f\u000eFif/whether\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI expected \u000f\u000eHthat\u000f\u000eE there would be problems.\u000f","p":1},{"t":"eg","x":"\u000eEThe price depends on \u000f\u000eHwhere\u000f\u000eE you sit.\u000f","p":1},{"t":"eg","x":"\u000eEWe aren’t sure\u000f\u000eH if/whether\u000f\u000eE we agree.\u000f","p":1},{"t":"rule","x":"\u000eAIn informal English, we can often leave out \u000f\u000eDthat\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"I knew (\u0004that\u0005) you weren’t listening."}]},{"l":"B","b":[{"t":"rule","x":"\u000eAWe use the term \u000f\u000eDnoun clause\u000f\u000eA because these clauses \u000f\u000eFfunction like noun phrases.\u000f\u000eA For example, they can be the object of a sentence.\u000f","p":1},{"t":"eg","x":"\u000eEI can’t believe \u000f\u000eHyou were so stupid.\u000f","p":1},{"t":"eg","x":"\u000eEI wonder \u000f\u000eHwhat’s happening.\u000f","p":1},{"t":"rule","x":"\u000eASometimes there is also an \u000f\u000eDindirect\u000f\u000eA object or a phrase with \u000f\u000eDto\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEWe told \u000f\u000eHthe driver (that)\u000f\u000eE we were in a hurry.\u000f","p":1},{"t":"eg","x":"\u000eEI mentioned \u000f\u000eHto Karen\u000f\u000eE that you would be here this evening.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"We sometimes use a noun clause as the subject of a sentence."},{"t":"eg","x":"\u000eHThat you feel upset\u000f\u000eE is only natural.\u000f","p":1},{"t":"eg","x":"\u000eHHow we’re going to achieve our aim\u000f\u000eE hasn’t been explained.\u000f","p":1},{"t":"rule","x":"\u000eAWe do not leave out \u000f\u000eFthat\u000f\u000eA in this position, and\u000f\u000eD we can use \u000f\u000eFwhether\u000f\u000eD \u0001but not\u0002 \u000f\u000eFif\u000f\u000eD.\u000f","p":1},{"t":"eg","x":"\u000eHWhether\u000f\u000eE we can succeed isn’t clear.\u000f","p":1},{"t":"rule","x":"\u000eAWe often prefer to use \u000f\u000eDit\u000f\u000eA as subject and put the noun clause at the end.\u000f","p":1},{"t":"eg","x":"\u000eHIt’s\u000f\u000eE only natural \u000f\u000eHthat you feel upset.\u000f","p":1},{"t":"eg","x":"\u000eHIt\u000f\u000eE isn’t clear \u000f\u000eHwhether we can succeed.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"\u000eAA noun clause can \u0001be\u0002 a complement of \u000f\u000eFbe\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEThe truth is\u000f\u000eH I don’t like her much.\u000f","p":1},{"t":"eg","x":"\u000eEThe advantage of this system is \u000f\u000eHthat you get much better picture quality.\u000f","p":1}]},{"l":"E","b":[{"t":"rule","x":"\u000eAA \u000f\u000eFwh-clause\u000f\u000eA or \u000f\u000eFwhether\u000f\u000eA (but not \u000f\u000eFif\u000f\u000eA or \u000f\u000eFthat\u000f\u000eA) can come after a preposition.\u000f","p":1},{"t":"eg","x":"\u000eEThey’re looking \u000f\u000eHinto what can be done.\u000f","p":1},{"t":"eg","x":"\u000eEThere’s no news \u000f\u000eHon whether the project is going ahead.\u000f","p":1},{"t":"rule","x":"Sometimes we can leave out a preposition."},{"t":"eg","x":"\u000eEI was surprised \u000f\u000eH(at) how cold it was.\u000f","p":1},{"t":"eg","x":"\u000eEWe agreed\u000f\u000eH (on) how much we would pay.\u000f","p":1}]},{"l":"F","b":[{"t":"rule","x":"\u000eAWe can also use a \u000f\u000eFthat-clause\u000f\u000eA after some adjectives and nouns.\u000f","p":1},{"t":"sub","x":"\u000eEWe were \u000f\u000eHglad that things had gone so well\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEWhat gave you the \u000f\u000eHidea that I can sing?\u000f","p":1},{"t":"rule","x":"\u000eAWe normally put in \u000f\u000eFthat\u000f\u000eA after a noun.\u000f","p":1},{"t":"eg","x":"The fact \u0004that\u0005 I had no ID didn’t help."},{"t":"wrong","x":"The fact I had no ID didn’t help."},{"t":"eg","x":"Refer to indirect speech/reported speech in 165 to 168"},{"t":"eg","x":"Refer to subjunctive 162B"},{"t":"tip","x":"A \u0001that-clause\u0002 relates to a statement, a \u0001wh-clause\u0002 relates to a wh-question, and a clause with if/whether to a yes/no question"}]}]},{"n":164,"t":"Nominalization","u":"Noun Clauses","s":[{"l":"A","b":[{"t":"rule","x":"Compare these three examples:"},{"t":"rule","x":"\u000eAMain clause: \u000f\u000eHThe campaign succeeded\u000f\u000eE, and this meant that lives were saved.\u000f","p":1},{"t":"rule","x":"\u000eANoun clause: \u000f\u000eEThe fact \u000f\u000eHthat the campaign succeeded\u000f\u000eE meant that lives were saved.\u000f","p":1},{"t":"rule","x":"\u000eANoun phrase: \u000f\u000eHThe success of the campaign\u000f\u000eE meant that lives were saved.\u000f","p":1},{"t":"rule","x":"\u000eAA statement like \u000f\u000eEThe campaign succeeded\u000f\u000eA can be a main clause, or we can use it as a \u000f\u000eIthat-clause\u000f\u000eA as part of a larger sentence. \u000f","p":1},{"t":"rule","x":"\u000eASometimes we can turn a clause into a\u000f\u000eD noun phrase\u000f\u000eA such as \u000f\u000eEthe success of the campaign\u000f\u000eB.\u000f\u000eA In this case, we change a \u000f\u000eDverb\u000f\u000eA (\u000f\u000eBsucceeded\u000f\u000eA) \u000f","p":1},{"t":"rule","x":"into a noun (success). Using a noun phrase rather than a clause is called \"nominalization.\" It is often neater to use a phrase, especially in written English."},{"t":"rule","x":"Here are some more examples:"},{"t":"eg","x":"\u000eHThe residents’ protests\u000f\u000eE were ignored. (The residents protested.)\u000f","p":1},{"t":"eg","x":"\u000eHThe publication of the report\u000f\u000eE was delayed for several weeks. (The report was published.)\u000f","p":1},{"t":"rule","x":"\u000eAIn this example, the noun (\u000f\u000eBbeauty\u000f\u000eA) corresponds to an adjective (\u000f\u000eBbeautiful\u000f\u000eA):\u000f","p":1},{"t":"eg","x":"\u000eEWe love \u000f\u000eHthe beauty of the landscape\u000f\u000eE. (The landscape is \u000f\u000eHbeautiful\u000f\u000eE.)\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eAWhen we change a clause into a noun phrase, the subject of the clause has the \u000f\u000eDpossessive\u000f\u000eA form or comes in an \u000f\u000eFof-phrase\u000f\u000eA.\u000f\u000eI ->86C\u000f","p":1},{"t":"table","rows":[["I was happy","\u000eENothing could spoil \u000f\u000eHmy happiness.\u000f"],["The President departed","\u000eHThe President's departure/ The departure of the President\u000f\u000eE was \u000f"]]},{"t":"eg","x":"delayed."},{"t":"eg","x":"The game ended  —  I didn't see the end of the game"}]},{"l":"C","b":[{"t":"rule","x":"\u000eIA verb + object\u000f\u000eA becomes\u000f\u000eI a noun + preposition + object\u000f","p":1},{"t":"table","rows":[["\u0003They opened the leisure centre","\u000eEThe opening \u000f\u000eHof\u000f\u000eE the leisure centre was widely welcomed.\u000f"],["\u0003Someone attacked the army post","\u000eEThe attack \u000f\u000eHon\u000f\u000eE the army post took place yesterday.\u000f"],["They've changed the law","\u000eEThere's been a change \u000f\u000eHin\u000f\u000eE the law\u000f"]]}]},{"l":"D","b":[{"t":"rule","x":"An adverb in a clause is equivalent to an adjective in a noun phrase."},{"t":"table","rows":[["\u000eEThe residents protested \u000f\u000eHangrily\u000f","\u000eEThe residents’ \u000f\u000eHangry\u000f\u000eE protests were ignored.\u000f"],["\u000eEThe landscape is \u000f\u000eHamazingly\u000f\u000eE beautiful\u000f","\u000eEDiscover the \u000f\u000eHamazing\u000f\u000eE beauty of the landscape\u000f"]]}]}]},{"n":165,"t":"Basics of indirect speech","u":"Indirect Speech","s":[{"l":"A","b":[{"t":"rule","x":"We use direct speech when we quote someone's words."},{"t":"eg","x":"\u000eE\"I’ll ring you later,\" said Jack.\u000f\u000eA (in a story)\u000f","p":1},{"t":"eg","x":"\u000eE\"This play really made me laugh.\"\u000f\u000eB –\u000f\u000eE The Post\u000f\u000eA (an advertisement for a play)\u000f","p":1},{"t":"eg","x":"\u000eAIn ‘\u000f\u000eIindirect speech\u000f\u000eA’ or ‘\u000f\u000eIreported speech\u000f\u000eA,’ we report the meaning in our \u000f\u000eDown words\u000f\u000eA and from\u000f\u000eD our own point of view.\u000f","p":1},{"t":"eg","x":"\u000eEJack said \u000f\u000eHhe would ring later.\u000f","p":1},{"t":"eg","x":"\u000eEOne critic claims \u000f\u000eHthe play is very funny.\u000f","p":1},{"t":"rule","x":"\u000eAThe indirect speech is the \u000f\u000eDobject of the verbs\u000f\u000eA of reporting \u000f\u000eEsaid\u000f\u000eA and \u000f\u000eEclaims\u000f\u000eB.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eAWe can use a verb of reporting with a \u000f\u000eFthat-clause\u000f\u000eA or a \u000f\u000eFwh-clause.\u000f","p":1},{"t":"eg","x":"\u000eEPolly \u000f\u000eHsaid that\u000f\u000eE she was going away.\u000f","p":1},{"t":"eg","x":"\u000eEHe \u000f\u000eHwondered why\u000f\u000eE it was so quiet.\u000f","p":1},{"t":"eg","x":"\u000eAVerbs of reporting are verbs like \u000f\u000eEagree, ask, believe, hear, know, suggest, think, understand.\u000f","p":1},{"t":"rule","x":"\u000eAWe often use \u000f\u000eFthat\u000f\u000eA in indirect speech, but in informal English, we can leave it out, especially after a common verb like \u000f\u000eFsay\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEAlice says (\u000f\u000eHthat\u000f\u000eE) she’ll be five minutes.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"\u000eAWe can sometimes use a \u000f\u000eDto-infinitive\u000f\u000eA clause or a \u000f\u000eDgerund clause\u000f\u000eA. \u000f\u000eJ->170\u000f","p":1},{"t":"eg","x":"\u000eEJack promised \u000f\u000eHto ring later.\u000f","p":1},{"t":"eg","x":"\u000eESomeone suggested \u000f\u000eHgoing for a walk.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"Sometimes there is an indirect object after the verb of reporting."},{"t":"eg","x":"\u000eENo one\u000f\u000eH told me\u000f\u000eE you were coming.\u000f","p":1},{"t":"eg","x":"\u000eEThe police have \u000f\u000eHwarned the public\u000f\u000eE that the man is dangerous.\u000f","p":1},{"t":"rule","x":"\u000eAOther verbs in this pattern are: \u000f\u000eEadvise, assure, inform, promise, reassure, remind.\u000f","p":1},{"t":"rule","x":"\u000eASometimes we use a phrase with \u000f\u000eFto\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eECan you \u000f\u000eHexplain to me\u000f\u000eE what’s going on?\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHsuggested to the others\u000f\u000eE that we should meet them here.\u000f","p":1},{"t":"rule","x":"\u000eAOther verbs in this pattern are: \u000f\u000eEadmit, announce, complain, declare, mention, point out, recommend, report, say, write.\u000f","p":1}]},{"l":"E","b":[{"t":"rule","x":"\u000eAWe sometimes use an adjective such as \u000f\u000eEsure\u000f\u000eA or \u000f\u000eEcertain\u000f\u000eA to introduce indirect speech.\u000f","p":1},{"t":"eg","x":"\u000eEHe’s \u000f\u000eHsure\u000f\u000eE (that) the figure is wrong.\u000f","p":1}]},{"l":"F","b":[{"t":"rule","x":"\u000eAWhen reporting two or more sentences, we\u000f\u000eD \u0001do not need\u0002\u000f\u000eA a verb of reporting in every one.\u000f","p":1},{"t":"eg","x":"\u000eEThe President \u000f\u000eHsaid\u000f\u000eE that the situation was under control. He had sent in the army.\u000f","p":1},{"t":"rule","x":"The second sentence is indirect speech."},{"t":"tip","x":"As well as speech or writing, we can also report thoughts, e.g., I thought I had plenty of time, but I only just made it. The thought is not necessarily expressed in speech."}]}]},{"n":166,"t":"Tell, say, and ask","u":"Indirect Speech","s":[{"l":"A","b":[{"t":"rule","x":"\u000eAWe normally use an indirect object after \u000f\u000eFtell\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEYou \u000f\u000eHtold me\u000f\u000eE you didn’t like Chinese food.\u000f","p":1},{"t":"eg","x":"Josh told us he was going to London."},{"t":"wrong","x":"Josh told he was going to London."},{"t":"rule","x":"\u000eABut after \u000f\u000eFsay\u000f\u000eA we do not use an indirect object.\u000f","p":1},{"t":"eg","x":"\u000eEYou \u000f\u000eHsaid\u000f\u000eE you didn’t like Chinese food.\u000f","p":1},{"t":"eg","x":"Josh said he was going to London."},{"t":"wrong","x":"Josh said us he was going to London."},{"t":"eg","x":"Josh said he was going to London."},{"t":"wrong","x":"Josh said us he was going to London."}]},{"l":"B","b":[{"t":"rule","x":"\u000eAWe can use either a\u000f\u000eF \u0001that-clause\u0002\u000f\u000eA or a \u000f\u000eFwh-clause\u000f\u000eA after \u000f\u000eFtell\u000f\u000eA or \u000f\u000eFsay\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEKate \u000f\u000eHtold me (that)\u000f\u000eE she’s fed up.\u000f","p":1},{"t":"eg","x":"\u000eEKate \u000f\u000eHsaid (that)\u000f\u000eE she’s fed up.\u000f","p":1},{"t":"eg","x":"\u000eEKate \u000f\u000eHtold me what\u000f\u000eE the matter was.\u000f","p":1},{"t":"rule","x":"\u000eFSay + wh-clause\u000f\u000eA is used mostly in a negative statement or a question where the information is not actually reported.\u000f","p":1},{"t":"eg","x":"\u000eEKate \u000f\u000eHdidn’t say what\u000f\u000eE the matter was.\u000f","p":1},{"t":"eg","x":"\u000eHDid\u000f\u000eE they say\u000f\u000eH how much\u000f\u000eE it would cost?\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"\u000eAThere are a few expressions where we can use \u000f\u000eFtell\u000f\u000eD without an indirect object.\u000f","p":1},{"t":"sub","x":"\u000eEHe likes \u000f\u000eHtelling stories / telling jokes.\u000f","p":1},{"t":"rule","x":"\u000eEDon’t \u000f\u000eHtell lies.\u000f\u000eE You should \u000f\u000eHtell the truth.\u000f","p":1},{"t":"eg","x":"\u000eEThe children learn to \u000f\u000eHtell the time.\u000f","p":1},{"t":"eg","x":"\u000eECan you\u000f\u000eH tell the difference\u000f\u000eE between tap water and bottled water?\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"\u000eAAfter \u000f\u000eFsay\u000f\u000eA we can use a phrase with \u000f\u000eFto\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI\u000f\u000eH said to him,\u000f\u000eE ‘I’ve been mugged.’\u000f","p":1},{"t":"rule","x":"In indirect speech we prefer these patterns."},{"t":"eg","x":"\u000eEI \u000f\u000eHsaid\u000f\u000eE I’d been mugged.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHtold him\u000f\u000eE I’d been mugged.\u000f","p":1},{"t":"rule","x":"\u000eABut we can use a phrase with \u000f\u000eFto\u000f\u000eA if the information is\u000f\u000eD not reported.\u000f","p":1},{"t":"eg","x":"\u000eEThe PM \u000f\u000eHsaid\u000f\u000eE a few words \u000f\u000eHto\u000f\u000eE the visitors.\u000f","p":1},{"t":"eg","x":"\u000eEWhat did the boss \u000f\u000eHsay to\u000f\u000eE you?\u000f","p":1}]},{"l":"E","b":[{"t":"rule","x":"\u000eAWe use \u000f\u000eFtalk\u000f\u000eA and \u000f\u000eFspeak\u000f\u000eA to say who spoke, to whom, for how long, or what about.\u000f","p":1},{"t":"eg","x":"\u000eEDaniel was \u000f\u000eHtalking\u000f\u000eE to a young woman.\u000f","p":1},{"t":"eg","x":"\u000eEThe President \u000f\u000eHspoke\u000f\u000eE for an hour.\u000f","p":1},{"t":"eg","x":"\u000eEWe don’t \u000f\u000eHtalk\u000f\u000eE about politics.\u000f","p":1},{"t":"eg","x":"\u000eFTalk\u000f\u000eA and \u000f\u000eFspeak\u000f\u000eA are not verbs of reporting.\u000f","p":1},{"t":"eg","x":"\u000eELaura \u000f\u000eHsaid\u000f\u000eE she was tired.\u000f","p":1},{"t":"wrong","x":"Laura talked/spoke she was tired."}]},{"l":"F","b":[{"t":"rule","x":"\u000eAWe can use \u000f\u000eFask\u000f\u000eA with or without an indirect object.\u000f","p":1},{"t":"eg","x":"\u000eESimon looked upset, so I \u000f\u000eHasked (him)\u000f\u000eE if there was anything wrong.\u000f","p":1},{"t":"rule","x":"\u000eAWe use \u000f\u000eDtell\u000f\u000eA and \u000f\u000eDask\u000f\u000eA in indirect orders and requests.   \u000f\u000eJ->170A\u000f","p":1},{"t":"eg","x":"\u000eEWe \u000f\u000eHtold/asked\u000f\u000eE Mike to hurry up.\u000f","p":1},{"t":"tip","x":"\u000eARemember that you \u000f\u000eFsay something\u000f\u000eA, but you \u000f\u000eFtell somebody something.\u000f","p":1}]}]},{"n":167,"t":"Changes in indirect speech","u":"Indirect Speech","s":[{"l":"A","b":[{"t":"sub","x":"People, place, and time"},{"t":"rule","x":"Imagine a situation where Oliver and Tina are at home one afternoon. Tina wants to go out in the car, but it won’t start. She rings the garage and asks a mechanic if he can come and repair it. He is too busy to come immediately, but he agrees to come the next morning."},{"t":"rule","x":"He says:"},{"t":"eg","x":"OK, I’ll be at your house at eight tomorrow morning."},{"t":"rule","x":"A moment later Tina says to Oliver:"},{"t":"eg","x":"The mechanic says he’ll be \u0004here\u0005 at eight tomorrow morning."},{"t":"rule","x":"Now the speaker is a different person, so where the mechanic said I’ll be..., Tina says He’ll be.... And the speaker is in a different place, so at your house for the mechanic is \u0001here\u0002 for Tina."},{"t":"rule","x":"Next day the mechanic has not arrived even by nine o’clock, so Tina rings him and says:"},{"t":"eg","x":"You said you would be \u0004here\u0005 by eight this morning."},{"t":"eg","x":"Now the time has changed. Instead of tomorrow morning, Tina says this morning. And the promise is now out of date, so will changes to would."},{"t":"rule","x":"\u000eAto \u000f\u000eEwould\u000f\u000eA. \u000f","p":1},{"t":"rule","x":"\u000eAFor changes to verb forms, see ➤\u000f\u000eB168.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"Pronouns and possessives"},{"t":"rule","x":"When you report what someone has said, both pronouns and possessives can change."},{"t":"rule","x":"\u000eE“I’m really enjoying myself.” → Jade said \u000f\u000eHshe\u000f\u000eE was enjoying \u000f\u000eHherself\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eE“I like your new hairstyle.” → Martin said \u000f\u000eHhe\u000f\u000eE liked my new \u000f\u000eHhairstyle\u000f\u000eE.\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"Adverbials of time"},{"t":"rule","x":"Here are some typical changes from direct to indirect speech:"},{"t":"rule","x":"\u000eEnow\u000f\u000eB → \u000f\u000eEthen / at that time / immediately\u000f","p":1},{"t":"rule","x":"\u000eEtoday\u000f\u000eB → \u000f\u000eEyesterday / that day / on Tuesday, etc.\u000f","p":1},{"t":"rule","x":"\u000eEyesterday\u000f\u000eB → \u000f\u000eEthe day before / the previous day / on Monday, etc.\u000f","p":1},{"t":"rule","x":"\u000eEtomorrow\u000f\u000eB → \u000f\u000eEthe next day / the following day / on Thursday, etc.\u000f","p":1},{"t":"rule","x":"\u000eEthis week\u000f\u000eB → \u000f\u000eElast week / that week\u000f","p":1},{"t":"rule","x":"\u000eElast year\u000f\u000eB → \u000f\u000eEthe year before / the previous year / in 2005, etc.\u000f","p":1},{"t":"rule","x":"\u000eEnext month\u000f\u000eB → \u000f\u000eEthe month after / the following month / in May, etc.\u000f","p":1},{"t":"rule","x":"\u000eEan hour ago\u000f\u000eB → \u000f\u000eEan hour before / an hour earlier / at 2.30, etc.\u000f","p":1},{"t":"tip","x":"Except when we talk about time, \u0001this\u0002 or \u0001that\u0002 usually changes to \u0001the\u0002 in indirect speech, or the phrase is replaced by \u0001it\u0002, e.g. This steak is nice. → She said the steak was nice. / She said \u0001it\u0002 was nice."}]}]},{"n":168,"t":"Tenses in indirect speech","u":"Indirect Speech","s":[{"l":"A","b":[{"t":"rule","x":"We can use a present-tense verb of reporting to report recent statements."},{"t":"eg","x":"\u000eERobert \u000f\u000eHsays\u000f\u000eE he’s hungry.\u000f","p":1},{"t":"rule","x":"In this case, we do not change the tense."},{"t":"rule","x":"\u000eHI’m\u000f\u000eE hungry.\u000f\u000eB → \u000f\u000eEHe says he’s hungry.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"A verb of reporting is often in a past tense, even when we report recent statements."},{"t":"eg","x":"\u000eEHe \u000f\u000eHsaid\u000f\u000eE he was hungry.\u000f","p":1},{"t":"rule","x":"We often change the tense in indirect speech from present to past."},{"t":"rule","x":"\u000eEI’\u000f\u000eHm\u000f\u000eE hungry.\u000f\u000eB → \u000f\u000eEHe said he \u000f\u000eHwas\u000f\u000eE hungry.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"In general, we are more likely to change the tense if we are unsure if the statement is still true and still relevant."},{"t":"eg","x":"\u000eEYou told me he \u000f\u000eHlived\u000f\u000eE in Bath, but actually, he lives in Bristol.\u000f\u000eA (untrue statement)\u000f","p":1},{"t":"eg","x":"\u000eEThe forecast said it \u000f\u000eHwas\u000f\u000eE going to rain, and it did.\u000f\u000eA (forecast now out of date)\u000f","p":1},{"t":"rule","x":"The past tense is also used to report in a neutral or objective way."},{"t":"eg","x":"\u000eEThe PM said it \u000f\u000eHwas\u000f\u000eE the right decision.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"The tense change in indirect speech is from present to past."},{"t":"rule","x":"\u000eEI feel awful.\u000f\u000eB → \u000f\u000eEShe said she \u000f\u000eHfelt\u000f\u000eE awful.\u000f","p":1},{"t":"rule","x":"\u000eEYou’re crazy.\u000f\u000eB → \u000f\u000eEHe thought I \u000f\u000eHwas\u000f\u000eE crazy.\u000f","p":1},{"t":"rule","x":"\u000eEI’ve got time.\u000f\u000eB → \u000f\u000eEI said I \u000f\u000eHhad\u000f\u000eE time.\u000f","p":1},{"t":"rule","x":"If the verb phrase is more than one word, then the first word changes."},{"t":"rule","x":"\u000eEYou’\u000f\u000eHre\u000f\u000eE lying.\u000f\u000eB → \u000f\u000eEI knew she \u000f\u000eHwas\u000f\u000eE lying.\u000f","p":1},{"t":"rule","x":"\u000eEI’\u000f\u000eHve\u000f\u000eE finished.\u000f\u000eB → \u000f\u000eEHe said he’\u000f\u000eHd\u000f\u000eE finished.\u000f","p":1},{"t":"rule","x":"So the present continuous changes to the past continuous, and so on."}]},{"l":"E","b":[{"t":"rule","x":"A past-tense verb usually changes to the past perfect."},{"t":"rule","x":"\u000eEI \u000f\u000eHwon\u000f\u000eE the game.\u000f\u000eB → \u000f\u000eEHe said he’\u000f\u000eHd won\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eABut \u000f\u000eEHe said he won\u000f\u000eA is also possible.\u000f","p":1},{"t":"rule","x":"A past perfect verb does not change."}]},{"l":"F","b":[{"t":"eg","x":"\u000eFWill\u000f\u000eI, \u000f\u000eFcan\u000f\u000eI,\u000f\u000eA and \u000f\u000eFmay\u000f\u000eA change to \u000f\u000eFwould\u000f\u000eI, \u000f\u000eFcould\u000f\u000eA, and \u000f\u000eFmight\u000f\u000eI.\u000f","p":1},{"t":"rule","x":"\u000eEWe’\u000f\u000eHll\u000f\u000eE be late.\u000f\u000eB → \u000f\u000eEI thought we’\u000f\u000eHd\u000f\u000eE be late.\u000f","p":1},{"t":"rule","x":"\u000eEI \u000f\u000eHcan’t\u000f\u000eE see.\u000f\u000eB → \u000f\u000eEHe said he c\u000f\u000eHouldn’t\u000f\u000eE see.\u000f","p":1},{"t":"eg","x":"\u000eFMust\u000f\u000eA can be the same or change to \u000f\u000eFhave to\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"\u000eEI \u000f\u000eHmust\u000f\u000eE go now.\u000f\u000eB → \u000f\u000eESarah said she \u000f\u000eHmust\u000f\u000eE go / she \u000f\u000eHhad to\u000f\u000eE go.\u000f","p":1},{"t":"eg","x":"\u000eFWould\u000f\u000eI, \u000f\u000eFcould\u000f\u000eI, \u000f\u000eFshould\u000f\u000eI, \u000f\u000eFmight\u000f\u000eI, \u000f\u000eFought to\u000f\u000eI, \u000f\u000eFhad better\u000f\u000eA, and \u000f\u000eFused to\u000f\u000eA do not change.\u000f","p":1},{"t":"rule","x":"\u000eEI \u000f\u000eHcould\u000f\u000eE help.\u000f\u000eB → \u000f\u000eEHe said he \u000f\u000eHcould\u000f\u000eE help.\u000f","p":1},{"t":"tip","x":"Changing the tense after \u0001said\u0002, \u0001told me\u0002, etc. is always possible, while keeping it the same can be a mistake. So in general, it is safer to change the tense."}]}]},{"n":169,"t":"Reporting questions","u":"Indirect Speech","s":[{"l":"A","b":[{"t":"rule","x":"\u000eAWhen we report a question, we use verbs such as \u000f\u000eEask, enquire, need to find out, want to know, wonder\u000f\u000eB.\u000f","p":1},{"t":"rule","x":"\u000eAWe can report a \u000f\u000eFwh\u000f\u000eI-question:\u000f","p":1},{"t":"rule","x":"\u000eE“\u000f\u000eHWhere\u000f\u000eE did you eat?”\u000f\u000eB → \u000f\u000eEI \u000f\u000eHasked\u000f\u000eE Elaine \u000f\u000eHwhere\u000f\u000eE she’d eaten.\u000f","p":1},{"t":"rule","x":"\u000eE“\u000f\u000eHHow much\u000f\u000eE is a ticket?”\u000f\u000eB → \u000f\u000eEJames \u000f\u000eHenquired how much\u000f\u000eE a ticket was.\u000f","p":1},{"t":"rule","x":"\u000eE“\u000f\u000eHWho\u000f\u000eE have you invited?”\u000f\u000eB → \u000f\u000eEPeter is \u000f\u000eHwondering who\u000f\u000eE we’ve invited.\u000f","p":1},{"t":"rule","x":"\u000eE“\u000f\u000eHWhen\u000f\u000eE is the lecture?”\u000f\u000eB → \u000f\u000eESomeone\u000f\u000eH wants to know when\u000f\u000eE the lecture is.\u000f","p":1},{"t":"rule","x":"\u000eE“\u000f\u000eHWhat\u000f\u000eE size do you take?”\u000f\u000eB → \u000f\u000eEThe assistant \u000f\u000eHasked me what\u000f\u000eE size I took.\u000f","p":1},{"t":"rule","x":"\u000eATo report a yes/no question, we use \u000f\u000eFif/whether\u000f\u000eI.\u000f","p":1},{"t":"rule","x":"\u000eE“Is the drug safe?”\u000f\u000eB → \u000f\u000eEPeople are \u000f\u000eHasking if/whethe\u000f\u000eEr the drug is safe.\u000f","p":1},{"t":"rule","x":"\u000eE“Has the car been repaired?”\u000f\u000eB → \u000f\u000eEHe \u000f\u000eHwants to know if/whether\u000f\u000eE the car has been repaired.\u000f","p":1},{"t":"rule","x":"\u000eAAfter \u000f\u000eFif/whethe\u000f\u000eDr\u000f\u000eA we can use \u000f\u000eFor not\u000f\u000eA to stress the need for a yes/no answer.\u000f","p":1},{"t":"rule","x":"\u000eEWe need to find out\u000f\u000eH if/whethe\u000f\u000eEr the drug is safe \u000f\u000eHor not.\u000f","p":1},{"t":"rule","x":"\u000eEWe need to find out \u000f\u000eHwhether or not\u000f\u000eE the drug is safe.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eAIn an indirect question the word order is usually \u000f\u000eFsubject + verb\u000f\u000eA, as in a statement.\u000f","p":1},{"t":"eg","x":"\u000eEI’ll ask when \u000f\u000eHthe bus leaves.\u000f","p":1},{"t":"rule","x":"Compare:"},{"t":"eg","x":"\u000eHThe bus leaves\u000f\u000eE at three ten.\u000f","note":"not I’ll ask when does the bus leave.","p":1},{"t":"rule","x":"\u000eABut we can use inversion when the reporting verb comes at the end, as a kind of \u000f\u000eDafterthought\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEWhen \u000f\u000eHdoes the bus leave\u000f\u000eE, I wonder.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"In an indirect question the tense can change from present to past in the same way as in a statement. ➤168 “What do you want?” → The man asked what we wanted."},{"t":"rule","x":"\u000eE“\u000f\u000eHCan\u000f\u000eE we take photos?”\u000f\u000eB → \u000f\u000eEAnna wondered if we \u000f\u000eHcould\u000f\u000eE take photos.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"\u000eAWe can use an indirect question form after \u000f\u000eFsay, \u0001tell\u0002\u000f\u000eA, etc. when we are talking about the answer to a question.\u000f","p":1},{"t":"eg","x":"\u000eEDid Zoe \u000f\u000eHsay when\u000f\u000eE she would call?\u000f","p":1},{"t":"eg","x":"\u000eEI wish you’d \u000f\u000eHtell\u000f\u000eE me \u000f\u000eHwhether\u000f\u000eE you agree.\u000f","p":1},{"t":"eg","x":"\u000eEI haven’t been \u000f\u000eHinformed what\u000f\u000eE time the flight gets in.\u000f","p":1},{"t":"tip","x":"You can use an indirect question when you approach someone to ask politely for information. Could you tell me where the lift is, please? is more polite than just asking Where is the lift?"}]}]},{"n":170,"t":"Reporting requests, offers, etc","u":"Indirect Speech","s":[{"l":"A","b":[{"t":"rule","x":"\u000eATo report an order or request, we usually use \u000f\u000eFtell/ask + object + to-infinitive.\u000f","p":1},{"t":"rule","x":"\u000eE“Please wait there.”\u000f\u000eB → \u000f\u000eEHe \u000f\u000eHtold us to wait.\u000f","p":1},{"t":"rule","x":"\u000eE“Could you help us, please?”\u000f\u000eB → \u000f\u000eEWe \u000f\u000eHasked someone to help\u000f\u000eE us.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eFAsk\u000f\u000eA can be with or without an indirect object.\u000f","p":1},{"t":"rule","x":"\u000eE“Sit down, please.”\u000f\u000eB → \u000f\u000eEThe boss \u000f\u000eHasked him to sit\u000f\u000eE down.\u000f","p":1},{"t":"rule","x":"\u000eE“May I sit down?”\u000f\u000eB → \u000f\u000eEHe \u000f\u000eHasked to sit\u000f\u000eE down.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"--"},{"t":"rule","x":"\u000eAWe use \u000f\u000eFask for + noun phrase\u000f\u000eA to report a request to have something.\u000f","p":1},{"t":"rule","x":"\u000eE“Can I have a receipt, please?”\u000f\u000eB → \u000f\u000eEI \u000f\u000eHasked\u000f\u000eE (the assistant) \u000f\u000eHfor\u000f\u000eE a receipt.\u000f","p":1},{"t":"rule","x":"\u000eATo report a request for permission, we use \u000f\u000eFask if/whether.\u000f","p":1},{"t":"eg","x":"\u000eETim\u000f\u000eH asked if/whether\u000f\u000eE he could smoke.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"--"},{"t":"rule","x":"There are many kinds of sentences that we can report with a performative verb like apologize or refuse, which shows the use of the statement. Here are some patterns with such verbs:"},{"t":"rule","x":"A single clause:"},{"t":"rule","x":"\u000eE“I'm sorry.”\u000f\u000eB → \u000f\u000eEThe man \u000f\u000eHapologized\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eE“Mind the wet paint.”\u000f\u000eB → \u000f\u000eEShe \u000f\u000eHwarned\u000f\u000eE me about the wet paint.\u000f","p":1},{"t":"rule","x":"Verb + to-infinitive"},{"t":"rule","x":"\u000eE“I’m not walking.”\u000f\u000eB → \u000f\u000eEI \u000f\u000eHrefused to walk.\u000f","p":1},{"t":"rule","x":"\u000eE“I’ll be good.”\u000f\u000eB → \u000f\u000eEHe \u000f\u000eHpromised to be\u000f\u000eE good.\u000f","p":1},{"t":"rule","x":"\u000eAAlso: \u000f\u000eEagree, offer, threaten, volunteer.\u000f","p":1},{"t":"rule","x":"Verb + object + to-infinitive “Would you like to come with us?” → They invited me to go with them."},{"t":"rule","x":"\u000eAAlso: \u000f\u000eEadvise, remind, warn.\u000f","p":1},{"t":"rule","x":"Verb + gerund"},{"t":"rule","x":"\u000eE“Let’s discuss this.”\u000f\u000eB → \u000f\u000eEHe \u000f\u000eHsuggested discussing\u000f\u000eE the matter.\u000f","p":1},{"t":"rule","x":"\u000eAAlso: \u000f\u000eEadmit, deny.\u000f","p":1},{"t":"rule","x":"Verb + preposition + gerund"},{"t":"rule","x":"\u000eE“I must go.”\u000f\u000eB → \u000f\u000eEHe \u000f\u000eHinsisted on going.\u000f","p":1},{"t":"rule","x":"\u000eE“You should have complained.”\u000f\u000eB → \u000f\u000eECarl \u000f\u000eHcriticized\u000f\u000eE me \u000f\u000eHfor not complaining\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eAAlso: \u000f\u000eEapologize for, object to; accuse ... of, congratulate ... on, thank ... for.\u000f","p":1},{"t":"rule","x":"Verb + that-clause"},{"t":"rule","x":"\u000eE“Yes, it’s too risky.”\u000f\u000eB → \u000f\u000eEHe \u000f\u000eHagreed (that)\u000f\u000eE it was too risky.\u000f","p":1},{"t":"rule","x":"\u000eAMany verbs can be used in this pattern, e.g., \u000f\u000eEcomplain, deny, predict, warn.\u000f","p":1},{"t":"rule","x":"Verb + object + that-clause"},{"t":"rule","x":"\u000eE“You’ll be fine.”\u000f\u000eB → \u000f\u000eEThey \u000f\u000eHassured\u000f\u000eE me (\u000f\u000eHthat\u000f\u000eE) I would be fine.\u000f","p":1},{"t":"rule","x":"\u000eAAlso: \u000f\u000eEpromise, reassure, remind, warn.\u000f","p":1},{"t":"tip","x":"We can also use the form of an indirect statement or question to report requests, offers, etc. e.g. He said he would be good. We asked if he could help us."}]}]},{"n":171,"t":"Basics of relative clauses","u":"Relative Clauses","s":[{"l":"A","b":[{"t":"sub","x":"Relative pronouns"},{"t":"rule","x":"A relative clause follows a noun phrase. The clause identifies which one, or it adds information. A relative pronoun (e.g. who, which, that) replaces a personal pronoun."},{"t":"eg","x":"The boy who won got a prize."},{"t":"wrong","x":"the boy who he won"},{"t":"eg","x":"The film that we saw was really good."},{"t":"wrong","x":"the film that we saw it"},{"t":"rule","x":"\u000eAWe can sometimes use a clause without a relative pronoun.\u000f\u000eI ->\u000f\u000eJ172E\u000f","p":1},{"t":"eg","x":"\u000eEThe film \u000f\u000eHwe saw\u000f\u000eE was really good.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"Commas with relative clauses"},{"t":"rule","x":"Some clauses are separated from the rest of the sentence by one or two commas and by a short pause in speech."},{"t":"rule","x":"\u000eEArsenal, \u000f\u000eHwho are third\u000f\u000eE, play at Chelsea\u000f\u000eC.\u000f\u000eA This clause adds information about Arsenal. The sentence would make sense \u000f\u000eDwithout it.\u000f","p":1},{"t":"rule","x":"A clause without commas or pause usually identifies which one we mean."},{"t":"eg","x":"\u000eEThe team \u000f\u000eHthat Chelsea face\u000f\u000eE is Arsenal\u000f\u000eC. \u000f\u000eEThe team is Arsenal\u000f\u000eA on its own \u000f\u000eDwould not make sense.\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"Types of relative clause"},{"t":"eg","x":"\u000eAThere are \u000f\u000eDfive functions\u000f\u000eA that relative clauses can perform.\u000f","p":1},{"t":"sub","x":"Identifying clause"},{"t":"rule","x":"\u000eAA relative clause without commas can identify which one we mean. \u000f\u000eJ->B\u000f","p":1},{"t":"eg","x":"\u000eEWho was the man \u000f\u000eHwho said hello?\u000f","p":1},{"t":"sub","x":"Classifying clause"},{"t":"rule","x":"A relative clause without commas can say what kind of thing we are talking about."},{"t":"eg","x":"\u000eEWe’re looking for a pub \u000f\u000eHthat serves food.\u000f","p":1},{"t":"rule","x":"\u000eAThe clause \u000f\u000eEthat serves food\u000f\u000eA describes the kind of pub we mean.\u000f","p":1},{"t":"sub","x":"Clause used for emphasis"},{"t":"rule","x":"\u000eAWe can use a relative clause without commas in a pattern with \u000f\u000eFit + be\u000f\u000eI. \u000f\u000eJ->25C\u000f","p":1},{"t":"eg","x":"\u000eEIt’s my husband \u000f\u000eHwho does the cooking.\u000f","p":1},{"t":"sub","x":"Adding clause"},{"t":"rule","x":"\u000eAA relative clause with commas can add more information.  \u000f\u000eJ->B\u000f","p":1},{"t":"eg","x":"\u000eEI was with Ted, \u000f\u000eHwho lives upstairs.\u000f","p":1},{"t":"sub","x":"Connective clause"},{"t":"rule","x":"A relative clause with a comma can tell us what happened next."},{"t":"eg","x":"\u000eEI shouted to the man, \u000f\u000eHwho ran off.\u000f","p":1},{"t":"rule","x":"In speech we use two main clauses."},{"t":"eg","x":"\u000eEI shouted to the man, \u000f\u000eHand he\u000f\u000eE ran off.\u000f","p":1},{"t":"tip","x":"Sometimes a relative clause is separated from the noun it relates to, e.g. The bus was leaving that we wanted to catch. But in writing you should put the clause next to the noun e.g. The bus that we wanted to catch was leaving."}]}]},{"n":172,"t":"Relative clauses without commas","u":"Relative Clauses","s":[{"l":"A","b":[{"t":"sub","x":"Who, which, and that"},{"t":"rule","x":"\u000eAWe use \u000f\u000eFwho/\u0001that\u0002\u000f\u000eA for \u000f\u000eDpeople\u000f\u000eA and \u000f\u000eFwhich/that\u000f\u000eA with other nouns.\u000f","p":1},{"t":"eg","x":"\u000eEI know the woman \u000f\u000eHwho/that\u000f\u000eE served us.\u000f","p":1},{"t":"eg","x":"\u000eEIt was a dream \u000f\u000eHwhich/that\u000f\u000eE came true.\u000f","p":1},{"t":"rule","x":"\u000eAWith people, \u000f\u000eFwho\u000f\u000eA is more \u000f\u000eDusual\u000f\u000eA than \u000f\u000eFthat\u000f\u000eD,\u000f\u000eA especially in writing. After other nouns, \u000f\u000eFwhich\u000f\u000eA can be a little \u000f\u000eDformal\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"\u000eFThat\u000f\u000eA is more usual than \u000f\u000eFwhich\u000f\u000eA after\u000f\u000eD a quantifier or pronoun.\u000f","p":1},{"t":"eg","x":"\u000eEThere was little \u000f\u000eHthat\u000f\u000eE we could do to help.\u000f","p":1},{"t":"eg","x":"\u000eEThere's something \u000f\u000eHthat's\u000f\u000eE worrying me.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"Relative patterns"},{"t":"rule","x":"\u000eAThe \u000f\u000eDrelative pronoun\u000f\u000eA can be the \u000f\u000eDsubject\u000f\u000eA or \u000f\u000eDobject\u000f\u000eA of the clause.\u000f","p":1},{"t":"eg","x":"\u000eEI don't like people \u000f\u000eHwho\u000f\u000eE smoke at work.\u000f","p":1},{"t":"rule","x":"\u000eBSubject: \u000f\u000eKThey smoke\u000f\u000eB at work.\u000f","p":1},{"t":"eg","x":"\u000eEThey're the people \u000f\u000eHthat\u000f\u000eE we saw earlier.\u000f","p":1},{"t":"rule","x":"\u000eBObject: \u000f\u000eKWe saw them\u000f\u000eB earlier.\u000f","p":1},{"t":"rule","x":"\u000eAWe can often \u000f\u000eDleave out\u000f\u000eA an object relative pronoun. \u000f\u000eI➤ E\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"Whom"},{"t":"rule","x":"\u000eFWho\u000f\u000eA can be an \u000f\u000eDobject pronoun\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI met a friend \u000f\u000eHwho\u000f\u000eE I knew at college.\u000f","p":1},{"t":"rule","x":"\u000eAWe can also use \u000f\u000eFwhom\u000f\u000eA as an object.\u000f","p":1},{"t":"eg","x":"\u000eEI met a friend \u000f\u000eHwhom\u000f\u000eE I knew at college.\u000f","p":1},{"t":"rule","x":"\u000eABut \u000f\u000eFwhom\u000f\u000eA is \u000f\u000eDformal and rather old-fashioned\u000f\u000eA. In everyday speech we use \u000f\u000eDthat\u000f\u000eA \u0001or\u0002 leave out the pronoun. For more examples of \u000f\u000eFwhom\u000f\u000eD,\u000f","p":1},{"t":"rule","x":"\u000eI➤ D\u000f\u000eA and \u000f\u000eI➤ 173B.\u000f","p":1}]},{"l":"D","b":[{"t":"sub","x":"Relatives and prepositions"},{"t":"rule","x":"\u000eFWho, \u0001which\u0002,\u000f\u000eI and \u000f\u000eFthat\u000f\u000eA can be the object of a preposition.\u000f","p":1},{"t":"eg","x":"\u000eETom is the man \u000f\u000eHwho\u000f\u000eE I share a flat \u000f\u000eHwith\u000f\u000eE.\u000f","note":"I share a flat with Tom.","p":1},{"t":"eg","x":"\u000eESuch is the world \u000f\u000eHthat\u000f\u000eE we live \u000f\u000eHin\u000f\u000eE.\u000f","note":"We live in the world.","p":1},{"t":"rule","x":"\u000eAIn informal English, the preposition comes in the\u000f\u000eD same place as in a main clause,\u000f\u000eA e.g., \u000f\u000eDafter \u000f\u000eEI share a flat\u000f\u000eB or \u000f\u000eEwe live.\u000f","p":1},{"t":"rule","x":"\u000eAIn more formal English, we can put the preposition before \u000f\u000eFwhom\u000f\u000eI or \u000f\u000eFwhich\u000f\u000eI.\u000f","p":1},{"t":"eg","x":"\u000eEThe person \u000f\u000eHwith whom\u000f\u000eE I share a flat.\u000f","p":1},{"t":"eg","x":"\u000eEFactors \u000f\u000eHover which\u000f\u000eE we have no control.\u000f","p":1}]},{"l":"E","b":[{"t":"sub","x":"Leaving out the pronoun"},{"t":"rule","x":"\u000eAWe can leave out the \u000f\u000eDpronoun\u000f\u000eA from a clause\u000f\u000eD without commas\u000f\u000eA when\u000f\u000eD it is not the subject.\u000f","p":1},{"t":"eg","x":"\u000eEIt's the hottest summer \u000f\u000eHI can remember.\u000f","p":1},{"t":"eg","x":"\u000eEThe person \u000f\u000eHwe spoke to\u000f\u000eE was helpful.\u000f","p":1},{"t":"rule","x":"\u000eAWe do not leave out a subject pronoun. \u000f\u000eKNot \u000f\u000eEThe person spoke to us was helpful.\u000f","p":1},{"t":"tip","x":"\u000eAAs a general rule, use \u000f\u000eDwho\u000f\u000eA for people and \u000f\u000eDthat\u000f\u000eA with other nouns. Say \u000f\u000eEthe man \u000f\u000eHwho\u000f\u000eE phoned\u000f\u000eA but \u000f\u000eEthe bus \u000f\u000eHthat\u000f\u000eE came.\u000f","p":1}]}]},{"n":173,"t":"Relative clauses with commas","u":"Relative Clauses","s":[{"l":"A","b":[{"t":"rule","x":"\u000eAA relative clause with commas \u000f\u000eDadds information\u000f\u000eA or says \u000f\u000eDwhat happens next.\u000f","p":1},{"t":"eg","x":"\u000eEThe President, \u000f\u000eHwho was visiting a local high school\u000f\u000eE, faced protests by students.\u000f","p":1},{"t":"eg","x":"\u000eEShe kicked the ball, \u000f\u000eHwhich flew over the fence into the next garden.\u000f","p":1},{"t":"rule","x":"Adding clauses and connective clauses are rather formal and typical of a written style."}]},{"l":"B","b":[{"t":"rule","x":"\u000eAThe relative clause is \u000f\u000eDseparated\u000f\u000eA from the main clause by \u000f\u000eDcommas, dashes, or brackets.\u000f","p":1},{"t":"eg","x":"\u000eEFirst to shoot was Ali, \u000f\u000eHwho missed.\u000f","p":1},{"t":"eg","x":"\u000eEWe live in Parma, \u000f\u000eHwhich isn't far away.\u000f","p":1},{"t":"eg","x":"\u000eEThe head teacher is Mr. Baxter —\u000f\u000eH whom everyone likes.\u000f","p":1},{"t":"eg","x":"\u000eEThe cat (\u000f\u000eHwhose name was Molly)\u000f\u000eE was sitting on the sofa.\u000f","p":1},{"t":"rule","x":"\u000eAIn an adding clause we use \u000f\u000eFwho\u000f\u000eI, \u000f\u000eFwhom\u000f\u000eI, \u000f\u000eFwhose\u000f\u000eI, or \u000f\u000eFwhich\u000f\u000eI but not \u000f\u000eFthat\u000f\u000eI.\u000f\u000eA And we \u000f\u000eDcannot\u000f\u000eA leave out the relative pronoun.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"A preposition can go before the relative pronoun."},{"t":"eg","x":"\u000eEThe actress thanked her parents, \u000f\u000eHto whom\u000f\u000eE she owed her success.\u000f","p":1},{"t":"eg","x":"\u000eEI made a call, \u000f\u000eHfor which\u000f\u000eE I had to pay.\u000f","p":1},{"t":"rule","x":"Putting it at the end is less formal."},{"t":"eg","x":"\u000eEI made a call, \u000f\u000eHwhich\u000f\u000eE I had to pay \u000f\u000eHfor\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eAWe can also use a preposition + \u000f\u000eDwhich\u000f\u000eA + noun.\u000f","p":1},{"t":"eg","x":"\u000eEWe got home at midnight, \u000f\u000eHby which time\u000f\u000eE everyone else was in bed.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"\u000eAWe can use a quantifier such as \u000f\u000eFall\u000f\u000eI, \u000f\u000eFone\u000f\u000eI, or \u000f\u000eFsome\u000f\u000eA with \u000f\u000eFof whom\u000f\u000eI / \u000f\u000eFof which\u000f\u000eA for a whole or part quantity.\u000f","p":1},{"t":"eg","x":"\u000eEThere were two people in the car, \u000f\u000eHone of whom\u000f\u000eE was injured. (\u000f\u000eHOne of them\u000f\u000eE was injured.)\u000f","p":1},{"t":"eg","x":"\u000eEThe police received several bomb warnings, \u000f\u000eHall of which\u000f\u000eE were false alarms.\u000f","p":1}]},{"l":"E","b":[{"t":"rule","x":"\u000eFWhich\u000f\u000eA can relate to a whole clause, not just to a noun.\u000f","p":1},{"t":"eg","x":"\u000eEThe team lost, \u000f\u000eHwhich\u000f\u000eE wasn't surprising. (\u000f\u000eHThe fact that\u000f\u000eE the team lost wasn’t surprising.)\u000f","p":1},{"t":"eg","x":"\u000eEWe had to wait, \u000f\u000eHwhich\u000f\u000eE annoyed us.\u000f","p":1},{"t":"rule","x":"\u000eEI get paid a bit more now, \u000f\u000eHwhich\u000f\u000eE means I can afford to run a car\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"\u000eAWe \u000f\u000eDcannot\u000f\u000eA use \u000f\u000eDwhat\u000f\u000eA.\u000f","p":1},{"t":"wrong","x":"The team lost, \u0004what\u0005 wasn’t surprising."},{"t":"tip","x":"Adding clauses are not often used in everyday speech. Use main clauses with \u0001and\u0002 or \u0001but\u0002, e.g. The head teacher is Mr. Baxter, and everyone likes him. I made a call, but I had to pay for it."}]}]},{"n":174,"t":"Whose, what, and whoever","u":"Relative Clauses","s":[{"l":"A","b":[{"t":"sub","x":"Whose"},{"t":"rule","x":"\u000eIWhose\u000f\u000eA has a \u000f\u000eDpossessive\u000f\u000eA meaning.\u000f","p":1},{"t":"eg","x":"\u000eEWe helped some people \u000f\u000eHwhose ca\u000f\u000eEr broke down. (\u000f\u000eHTheir car\u000f\u000eE broke down.)\u000f","p":1},{"t":"rule","x":"\u000eAWe use \u000f\u000eFwhose\u000f\u000eI + noun\u000f\u000eA (\u000f\u000eDwhose car\u000f\u000eA). \u000f\u000eCNOT \u000f\u000eEpeople whose the car broke down\u000f","p":1},{"t":"rule","x":"\u000eFWhose\u000f\u000eI + noun\u000f\u000eA can also be the \u000f\u000eDobject of the clause\u000f\u000eA or \u000f\u000eDof a preposition\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEThe prize goes to the contestant \u000f\u000eHwhose performance\u000f\u000eE the viewers like best.\u000f","p":1},{"t":"eg","x":"\u000eEThe neighbour \u000f\u000eHwhose dog\u000f\u000eE I'm looking after is in Australia.\u000f","p":1},{"t":"rule","x":"\u000eAWe can use \u000f\u000eFwhose\u000f\u000eA with a comma.\u000f","p":1},{"t":"eg","x":"\u000eEThe ball fell to Rooney, \u000f\u000eHwhose shot\u000f\u000eE hit the post.\u000f","p":1},{"t":"eg","x":"\u000eAAs well as people, \u000f\u000eDwhose\u000f\u000eA can refer to \u000f\u000eDhuman activity or organization.\u000f","p":1},{"t":"eg","x":"\u000eEShe sang a \u000f\u000eHsong\u000f\u000eE, \u000f\u000eHwhose sentiments\u000f\u000eE moved the audience.\u000f","p":1},{"t":"eg","x":"\u000eEIt’s the poor \u000f\u000eHcountries whose exports\u000f\u000eE are earning less money.\u000f","p":1},{"t":"rule","x":"\u000eAInstead of \u000f\u000eFwhose\u000f\u000eA relating to a thing, we can use \u000f\u000eFthe + noun + of which\u000f\u000eI.\u000f","p":1},{"t":"eg","x":"\u000eEShe sang a \u000f\u000eHsong, the sentiments of which\u000f\u000eE moved the audience.\u000f","p":1},{"t":"eg","x":"\u000eELook up any \u000f\u000eHword the meaning of which\u000f\u000eE is unclear.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"What"},{"t":"rule","x":"\u000eAWe can use \u000f\u000eFwhat\u000f\u000eA in this pattern.\u000f","p":1},{"t":"rule","x":"\u000eELet’s write a list of \u000f\u000eHwhat\u000f\u000eE we need to pack. (The things \u000f\u000eHthat\u000f\u000eE we need to pack)\u000f","p":1},{"t":"eg","x":"\u000eEI was looking for a coat, but I couldn’t find \u000f\u000eHwhat\u000f\u000eE I wanted. (\u000f\u000eHThe thing that\u000f\u000eE I wanted)\u000f","p":1},{"t":"rule","x":"\u000eABut \u000f\u000eFwhat\u000f\u000eD cannot\u000f\u000eA relate to a noun. \u000f\u000eKNOT \u000f\u000eEthe coat what I wanted\u000f","p":1},{"t":"rule","x":"\u000eAFor \u000f\u000eDwhat\u000f\u000eA used for emphasis, \u000f\u000eI➤ 25D.\u000f","p":1},{"t":"eg","x":"\u000eHWhat\u000f\u000eE I wanted was a coat.\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"\u000eWhoever\u000f, \u000ewhatever\u000f, etc"},{"t":"rule","x":"\u000eAWe can use \u000f\u000eFwhoever, whatever, whichever, wherever,\u000f\u000eI and \u000f\u000eFwhenever\u000f\u000eA in a relative clause.\u000f","p":1},{"t":"eg","x":"\u000eHWhoever\u000f\u000eE painted this graffiti should clean it off. (\u000f\u000eHThe person who\u000f\u000eE painted it – no matter who it is)\u000f","p":1},{"t":"eg","x":"\u000eEI’ll spend my money on \u000f\u000eHwhatever\u000f\u000eE I like. (\u000f\u000eHThe thing that\u000f\u000eE I like – no matter what it is)\u000f","p":1},{"t":"eg","x":"\u000eHWherever\u000f\u000eE he goes, he gets recognized. (In \u000f\u000eHthe place\u000f\u000eE he goes – no matter where)\u000f","p":1},{"t":"tip","x":"We cannot use \u0001who\u0002 in the same way as whoever. We say Whoever designed this building ought to be shot and not Who designed this building ought to be shot. But we can say The person who designed this building ..."}]}]},{"n":175,"t":"Relative adverbs","u":"Relative Clauses","s":[{"l":"A","b":[{"t":"eg","x":"\u000eAThere are relative adverbs \u000f\u000eFwhere, when,\u000f\u000eI and \u000f\u000eFwhy\u000f\u000eI.\u000f","p":1},{"t":"eg","x":"\u000eEThe house \u000f\u000eHwhere\u000f\u000eE I used to live has been knocked down.\u000f","p":1},{"t":"eg","x":"\u000eEDo you remember the time \u000f\u000eHwhen\u000f\u000eE we all went to a nightclub?\u000f","p":1},{"t":"eg","x":"\u000eEThe reason \u000f\u000eHwhy\u000f\u000eE we can sell so cheaply is because we buy in bulk.\u000f","p":1},{"t":"rule","x":"We use \u0001where\u0002 after nouns like place, area, town, country, house, situation. We use \u0001when\u0002 after nouns like \u0001time\u0002, \u0001day\u0002, \u0001weekend\u0002, \u0001moment\u0002, \u0001period\u0002. And we use \u0001why\u0002 after reason."}]},{"l":"B","b":[{"t":"rule","x":"\u000eAWe can use \u000f\u000eFwhere\u000f\u000eA and \u000f\u000eFwhen\u000f\u000eA without a noun.\u000f","p":1},{"t":"eg","x":"\u000eEThis is \u000f\u000eHwhere\u000f\u000eE I used to live. (\u000f\u000eHThe place where\u000f\u000eE I used to live)\u000f","p":1},{"t":"eg","x":"\u000eERemember \u000f\u000eHwhen\u000f\u000eE we went to a club? (\u000f\u000eHThe time when\u000f\u000eE we went to a club)\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"\u000eAInstead of a clause with \u000f\u000eFwhere\u000f\u000eA, we can use these patterns.\u000f","p":1},{"t":"eg","x":"\u000eEThis is the house \u000f\u000eHin which\u000f\u000eE I used to live.\u000f","p":1},{"t":"eg","x":"\u000eEThis is the house \u000f\u000eHthat\u000f\u000eE I used to live in.\u000f","p":1},{"t":"eg","x":"\u000eEThis is the house I used to live \u000f\u000eHin\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eAThe pattern \u000f\u000eEin which\u000f\u000eA is rather formal. In informal English \u000f\u000eEthe house I used to live in\u000f\u000eA is more usual.\u000f","p":1},{"t":"rule","x":"\u000eAInstead of \u000f\u000eFwhen\u000f\u000eA or \u000f\u000eFwhy\u000f\u000eA, \u0001we\u0002 can use this pattern.\u000f","p":1},{"t":"eg","x":"\u000eEDo you remember the time (\u000f\u000eHthat\u000f\u000eE) we all went to a nightclub?\u000f","p":1},{"t":"eg","x":"\u000eEThe reason (\u000f\u000eHthat\u000f\u000eE) we can sell so cheaply is because we buy in bulk.\u000f","p":1}]},{"l":"D","b":[{"t":"eg","x":"\u000eAClauses with \u000f\u000eFwhen\u000f\u000eA or \u000f\u000eFwhere\u000f\u000eA can be separated off by commas.\u000f","p":1},{"t":"eg","x":"\u000eEWe walked up to the top of the hill, \u000f\u000eHwhere\u000f\u000eE we got a marvellous view.\u000f","p":1},{"t":"eg","x":"\u000eEI’d rather go next week, \u000f\u000eHwhen\u000f\u000eE I won’t be so busy.\u000f","p":1},{"t":"rule","x":"\u000eAWe do not leave out \u000f\u000eFwhere\u000f\u000eA or \u000f\u000eFwhen\u000f\u000eA here, and we do not use \u000f\u000eFthat\u000f\u000eA.\u000f","p":1}]},{"l":"E","b":[{"t":"rule","x":"\u000eAWith the noun \u000f\u000eDway\u000f\u000eA, we can use these patterns.\u000f","p":1},{"t":"eg","x":"\u000eEI hate the \u000f\u000eHway in which\u000f\u000eE these adverts pop up on the screen.\u000f","p":1},{"t":"eg","x":"\u000eEI hate the \u000f\u000eHway that\u000f\u000eE these adverts pop up on the screen.\u000f","p":1},{"t":"eg","x":"\u000eEI hate the \u000f\u000eHway\u000f\u000eE these adverts pop up on the screen.\u000f","p":1},{"t":"rule","x":"\u000eEThe way in which\u000f\u000eA is more formal.\u000f","p":1},{"t":"rule","x":"\u000eAWe can also use \u000f\u000eFhow\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI hate \u000f\u000eHhow\u000f\u000eE these adverts pop up on the screen.\u000f","p":1},{"t":"tip","x":"\u000eARemember it’s \u000f\u000eFthe place where\u000f\u000eA, the time \u000f\u000eFwhen\u000f\u000eD,\u000f\u000eA and the reason \u000f\u000eFwhy\u000f\u000eA.\u000f","p":1}]}]},{"n":176,"t":"Relative clauses with a participle or infinitive","u":"Relative Clauses","s":[{"l":"A","b":[{"t":"sub","x":"Active participles"},{"t":"rule","x":"\u000eAWe can use an active participle in a \u000f\u000eDshortened relative clause.\u000f","p":1},{"t":"eg","x":"\u000eEWho are those people \u000f\u000eHtaking\u000f\u000eE photos? \u000f\u000eD(those people \u000f\u000eGwho are taking\u000f\u000eD photos)\u000f","
