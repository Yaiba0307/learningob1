 flavour)\u000f","\u000eEWould you like to \u000f\u000eHtaste\u000f\u000eE this soup? \u000f\u000eD(eat a little)\u000f"],["measure","\u000eEThis room \u000f\u000eHmeasures\u000f\u000eE 5 × 2 metres long.\u000f","\u000eEI can \u000f\u000eHmeasure\u000f\u000eE the garage\u000f\u000eA. \u000f\u000eD(find out the size)\u000f"],["weigh","It weighed 52 kilos. (was 52 kilos in weight)","\u000eEI’m \u000f\u000eHweighing\u000f\u000eE the luggage. \u000f\u000eD(find out the weight)\u000f"],["fit","\u000eEThis coat \u000f\u000eHfits\u000f\u000eE perfectly. \u000f\u000eD(is the correct size)\u000f","\u000eEI \u000f\u000eHwas fitting\u000f\u000eE a new switch. \u000f\u000eD(putting in place)\u000f"]]},{"t":"rule","x":"\u000eANote that enjoy is an action verb. Say\u000f\u000eE I enjoy parties\u000f\u000eA and\u000f\u000eE I'm enjoying this party\u000f\u000eA, but not \u000f\u000eEI enjoy this party\u000f","p":1}]}]},{"n":37,"t":"Overview of verb tenses","u":"Verb Tenses","s":[{"l":"","b":[{"t":"table","rows":[["Verb form","Use","Example"],["Present simple\nI play","a present state","\u000eEI \u000f\u000eHlike\u000f\u000eE old films. \u000f"],["","a fact","\u000eECardiff \u000f\u000eHis\u000f\u000eE in Wales.\u000f"],["","a permanent routine","\u000eEI \u000f\u000eHwork\u000f\u000eE at home most days.\u000f"],["Present continuous\nI am playing","in the middle of an action","\u000eEI’\u000f\u000eHm watching\u000f\u000eE this film.\u000f"],["","a temporary routine","\u000eEI’\u000f\u000eHm working\u000f\u000eE late this week.\u000f"],["Present perfect\nI have played","an action in a period up to now","\u000eHI’ve written\u000f\u000eE the letter. \u000f"],["","a series of actions up to now","I’ve played basketball a few times."],["","a state in a period up to now","\u000eHI’ve been\u000f\u000eE here for a week.\u000f"],["Present perfect continuous\nI have been playing","an action over a period up to now","\u000eEIt \u000f\u000eHhas been raining\u000f\u000eE all day.\u000f"],["Past simple\nI played","an action in the past","\u000eEI \u000f\u000eHwrote\u000f\u000eE the letter yesterday. \u000f"],["","a past state","I was there for a week."],["","a series of past actions","\u000eEI \u000f\u000eHplayed\u000f\u000eE basketball regularly at one time.\u000f"],["Past continuous\nI was playing","an action over a period of past time","\u000eHIt was raining\u000f\u000eE when I got up.\u000f"],["Past perfect\nI had played","an action before a past time","\u000eEWhen we got there, the rain \u000f\u000eHhad stopped. \u000f"],["","a state before a past time","\u000eHThe weather had been\u000f\u000eE awful for days.\u000f"],["Past perfect continuous\nI had been playing","an action over a period up to a past time","\u000eEWhen the match started, it \u000f\u000eHhad been raining\u000f\u000eE for hours.\u000f"]]},{"t":"rule","x":"a permanent routine                     - I work at home most days."},{"t":"rule","x":"a state in a period up to now           - I’ve been here for a week."},{"t":"rule","x":"a state in a period up to now               - I’ve been here for a week."},{"t":"rule","x":"a series of past actions                    - I played basketball regularly at one time."},{"t":"rule","x":"Each of these verb forms is either present (✓) or past (✗). It can be continuous (be + -ing form), perfect (have + past participle), or it can be both continuous and perfect (have + been + -ing). But some verbs cannot be used in the continuous ➤36"}]}]},{"n":38,"t":"Will and shall","u":"Verb Tenses","s":[{"l":"A","b":[{"t":"sub","x":"Form"},{"t":"rule","x":"\u000eAAfter \u000f\u000eJwill\u000f\u000eA we use an infinitive without \u000f\u000eJto\u000f\u000eA. \u000f\u000eJWill\u000f\u000eA and \u000f\u000eJwill no\u000f\u000eCt\u000f\u000eA have short forms \u000f\u000eJ’ll\u000f\u000eA and \u000f\u000eJwon’t\u000f\u000eI.\u000f","p":1},{"t":"eg","x":"\u000eEThis book \u000f\u000eHwill change\u000f\u000eE your life.\u000f","p":1},{"t":"eg","x":"\u000eEWe\u000f\u000eH’ll know t\u000f\u000eEhe results soon.\u000f","p":1},{"t":"eg","x":"\u000eEYou \u000f\u000eHwon’t get\u000f\u000eE another chance.\u000f","p":1},{"t":"eg","x":"\u000eHWill\u000f\u000eE you be in tomorrow?\u000f","p":1},{"t":"rule","x":"\u000eAAfter \u000f\u000eJI\u000f\u000eA or \u000f\u000eJwe\u000f\u000eA, either \u000f\u000eJwill\u000f\u000eA or \u000f\u000eJshall\u000f\u000eA can be used. \u000f\u000eJShall\u000f\u000eA is a little formal.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHwill\u000f\u000eE be / I \u000f\u000eHshall\u000f\u000eE be at home tomorrow.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"\u000eLWill\u000f\u000eC for the future\u000f","p":1},{"t":"rule","x":"\u000eJWill\u000f\u000eA often refers to things in the future that we can be \u000f\u000eDfairly sure about.\u000f","p":1},{"t":"eg","x":"\u000eEThe South \u000f\u000eHwill\u000f\u000eE stay dry at the weekend.\u000f","p":1},{"t":"eg","x":"\u000eEI\u000f\u000eH’ll\u000f\u000eE be 25 next year.\u000f","p":1},{"t":"rule","x":"\u000eJWill\u000f\u000eA does not express a wish or intention.\u000f","p":1},{"t":"rule","x":"\u000eAWe can also use \u000f\u000eJwill\u000f\u000eA with \u000f\u000eJhave to, be allowed to, \u000f\u000eAand\u000f\u000eJ be able to\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEWe’re late. We’\u000f\u000eHll have to\u000f\u000eE hurry.\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"An instant decision"},{"t":"rule","x":"\u000eAWe can \u000f\u000eDsometimes\u000f\u000eA use \u000f\u000eCI’ll\u000f\u000eA / \u000f\u000eCwe’ll\u000f\u000eA for an instant decision.\u000f","p":1},{"t":"eg","x":"\u000eEIt’s raining. I\u000f\u000eH’ll take\u000f\u000eE an umbrella.\u000f","p":1},{"t":"rule","x":"\u000eACompare \u000f\u000eJwill\u000f\u000eA and \u000f\u000eJbe going to\u000f\u000eA:\u000f","p":1},{"t":"eg","x":"\u000eEWhat do I need? Oh, I’\u000f\u000eHll buy\u000f\u000eE a paper.\u000f","note":"I’m deciding now to buy one.","p":1},{"t":"eg","x":"\u000eEI’\u000f\u000eHm going\u000f\u000eE to buy a paper. I won’t be long.\u000f","note":"I’ve already decided to buy one.","p":1}]},{"l":"D","b":[{"t":"sub","x":"Willingness"},{"t":"rule","x":"\u000eCWill\u000f\u000eA sometimes expresses willingness.\u000f","p":1},{"t":"eg","x":"\u000eEMy Polish friend \u000f\u000eHwill translate\u000f\u000eE it for you.\u000f","p":1},{"t":"eg","x":"\u000eEI’\u000f\u000eHll\u000f\u000eE sit / I’\u000f\u000eHm willing\u000f\u000eE to sit on the floor.\u000f","p":1},{"t":"rule","x":"\u000eCWon’t\u000f\u000eA or \u000f\u000eCwill not\u000f\u000eA can express unwillingness or an emphatic refusal to do something.\u000f","p":1},{"t":"eg","x":"\u000eEThe minister \u000f\u000eHwill not agree\u000f\u000eE to the plan.\u000f","p":1},{"t":"eg","x":"\u000eEI w\u000f\u000eHon’t listen\u000f\u000eE to this nonsense.\u000f","p":1}]},{"l":"E","b":[{"t":"sub","x":"\u000eCOther uses of \u000f\u000eGwill\u000f","p":1},{"t":"rule","x":"\u000eAWe use \u000f\u000eCwill\u000f\u000eA for offers and promises.\u000f","p":1},{"t":"eg","x":"\u000eEI’\u000f\u000eHll hold\u000f\u000eE the door open for you.\u000f","p":1},{"t":"eg","x":"\u000eA(I promise) \u000f\u000eEI’\u000f\u000eHll do\u000f\u000eE my best to help you.\u000f","p":1}]},{"l":"F","b":[{"t":"sub","x":"\u000eGShall I/we \u000f\u000eCor\u000f\u000eG Will I/we…?\u000f","p":1},{"t":"rule","x":"\u000eAWe use \u000f\u000eJshall I/\u0001we\u0002\u000f\u000eA to offer, or to ask for advice or suggestions.\u000f","p":1},{"t":"eg","x":"\u0004Shall\u0005 I carry that for you? — Oh, thanks."},{"t":"eg","x":"Where \u0004shall\u0005 I put these flowers?"},{"t":"eg","x":"What \u0004shall\u0005 \u0004we\u0005 do this weekend?"},{"t":"rule","x":"\u000eABut \u0001we\u0002 use \u000f\u000eCwill I/we\u000f\u000eA for the future.\u000f","p":1},{"t":"eg","x":"\u000eHWill\u000f\u000eE I need a visa?\u000f","p":1},{"t":"eg","x":"\u000eHWhen will\u000f\u000eE we get our results?\u000f","p":1},{"t":"rule","x":"\u000eAWe can use \u000f\u000eCshall \u0001we\u0002\u000f\u000eA for a suggestion.\u000f","p":1},{"t":"eg","x":"\u0004Shall\u0005 \u0004we\u0005 go / Let’s go out somewhere?"},{"t":"tip","x":"Do not confuse \u0001will\u0002 and want. Compare: \u0001I\u0002’ll sit down on this seat (a decision) I want to sit down, but there aren’t any seats (a wish)."}]}]},{"n":39,"t":"Be going to","u":"Verb Tenses","s":[{"l":"A","b":[{"t":"sub","x":"Form"},{"t":"rule","x":"\u000eAThe form is \u000f\u000eJbe going to + verb\u000f\u000eI.\u000f","p":1},{"t":"eg","x":"\u000eEI'\u000f\u000eHm going to watch\u000f\u000eE television.\u000f","p":1},{"t":"eg","x":"\u000eEIt \u000f\u000eHisn't going to rain\u000f\u000eE, is it?\u000f","p":1},{"t":"eg","x":"\u000eHAre you going to buy\u000f\u000eE a ticket?\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"\u000eLBe going to\u000f\u000eC for the future\u000f","p":1},{"t":"rule","x":"\u000eAWe can use \u000f\u000eJbe going to\u000f\u000eA for something in the future.\u000f","p":1},{"t":"eg","x":"\u000eEIt\u000f\u000eH's going to be\u000f\u000eE fine next week.\u000f","p":1},{"t":"eg","x":"\u000eEI think United \u000f\u000eHare going to win\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEMy father \u000f\u000eHis probably going to be\u000f\u000eE in hospital for at least two weeks.\u000f","p":1},{"t":"rule","x":"\u000eJWill\u000f\u000eA is also possible in these examples.\u000f","p":1},{"t":"rule","x":"\u000eJBe going to\u000f\u000eA has a sense of something in the present pointing to the future.\u000f","p":1},{"t":"eg","x":"\u000eEIt's ten already. We\u000f\u000eH're going to be\u000f\u000eE late.\u000f","p":1},{"t":"eg","x":"\u000eEThis wall \u000f\u000eHis going to fall\u000f\u000eE down soon.\u000f","p":1},{"t":"rule","x":"We can see from the time now that we are going to be late, and we can see from the condition of the wall now that it is going to fall down."}]},{"l":"C","b":[{"t":"sub","x":"Intentions"},{"t":"rule","x":"\u000eAWe can use \u000f\u000eJbe going to\u000f\u000eA for a plan or an intention.\u000f","p":1},{"t":"eg","x":"\u000eEThey'\u000f\u000eHre going to build\u000f\u000eE a house here.\u000f","p":1},{"t":"eg","x":"\u000eEI\u000f\u000eH'm going to start\u000f\u000eE my own business.\u000f","p":1},{"t":"rule","x":"This means that I intend to start / I have decided to start it."},{"t":"rule","x":"\u000eAWith verbs of movement, especially \u000f\u000eJgo\u000f\u000eA and \u000f\u000eJcome\u000f\u000eA, we often use \u000f\u000eDthe present continuous\u000f\u000eA rather than \u000f\u000eCbe going to\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI'\u000f\u000eHm going\u000f\u000eE out in a minute.\u000f","p":1},{"t":"eg","x":"\u000eEOf course we'\u000f\u000eHre coming\u000f\u000eE to your party.\u000f","p":1}]},{"l":"D","b":[{"t":"sub","x":"Was going to"},{"t":"rule","x":"\u000eAWe can use \u000f\u000eJwas/were \u0001going\u0002 \u0001to\u0002\u000f\u000eA for a prediction or an intention in the past.\u000f","p":1},{"t":"eg","x":"\u000eEI knew there \u000f\u000eHwas going to be\u000f\u000eE trouble.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHwas going to do\u000f\u000eE some shopping, so I took my credit card with me.\u000f","p":1},{"t":"rule","x":"This means that I intended to do some shopping."},{"t":"rule","x":"Sometimes the intended action does not actually happen."},{"t":"eg","x":"\u000eEThe bus pulled away just as we \u000f\u000eHwere going to get\u000f\u000eE on it.\u000f","p":1},{"t":"rule","x":"We did not get on the bus because it pulled away too soon."},{"t":"rule","x":"\u000eASometimes we can also use \u000f\u000eJwould\u000f\u000eA for a past prediction.\u000f","p":1},{"t":"eg","x":"\u000eEI knew there \u000f\u000eHwould be\u000f\u000eE trouble.\u000f","p":1},{"t":"eg","x":"\u000eEI thought that question \u000f\u000eHwould come\u000f\u000eE up in the exam.\u000f","p":1},{"t":"tip","x":"Was \u0001going\u0002 \u0001to\u0002 is useful when you are explaining that you meant to do something but didn’t actually do it, e.g. I'm sorry. I was \u0001going\u0002 to finish the report, but I really didn’t have time."}]}]},{"n":40,"t":"Present tenses for the future","u":"Verb Tenses","s":[{"l":"A","b":[{"t":"sub","x":"The present continuous"},{"t":"rule","x":"\u000eAWe use the present continuous for what someone\u000f\u000eD has arranged to do.\u000f","p":1},{"t":"eg","x":"\u000eEI\u000f\u000eH'm meeting\u000f\u000eE Kate at the club tonight.\u000f","p":1},{"t":"eg","x":"\u000eEWhat \u000f\u000eHare you doing\u000f\u000eE tomorrow?\u000f","p":1},{"t":"eg","x":"\u000eEJulie\u000f\u000eH is going\u000f\u000eE to Florida next month.\u000f","p":1},{"t":"rule","x":"This suggests that Julie has made arrangements such as buying her ticket."},{"t":"rule","x":"\u000eAThe meaning is similar to \u000f\u000eFbe going to\u000f\u000eA for an \u000f\u000eDintention\u000f\u000eA. We can often use \u000f\u000eDeither\u000f\u000eA form.\u000f","p":1},{"t":"eg","x":"\u000eEWe'\u000f\u000eHre visiting\u000f\u000eE / We'\u000f\u000eHre going to visit\u000f\u000eE friends at the weekend.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"The present simple"},{"t":"rule","x":"\u000eAWe can sometimes use the present simple for the future when we are talking about a \u000f\u000eDtimetable\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEThe meeting \u000f\u000eHis\u000f\u000eE on May 13.\u000f","p":1},{"t":"eg","x":"\u000eEThe train \u000f\u000eHleaves\u000f\u000eE in five minutes.\u000f","p":1},{"t":"eg","x":"\u000eEWhat time do you \u000f\u000eHarrive\u000f\u000eE in New York?\u000f","p":1},{"t":"rule","x":"\u000eAWe do \u000f\u000eDnot\u000f\u000eA use the present simple for \u000f\u000eDdecisions\u000f\u000eA or \u000f\u000eDintentions\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI'\u000f\u000eHll carry\u000f\u000eE that for you.\u000f","p":1},{"t":"wrong","x":"I carry that for you."},{"t":"eg","x":"\u000eEThey'\u000f\u000eHre going to build\u000f\u000eE a road through here soon.\u000f","p":1},{"t":"wrong","x":"They build a road through here soon."}]},{"l":"C","b":[{"t":"sub","x":"The present tense in a sub-clause"},{"t":"rule","x":"\u000eAWe often use the\u000f\u000eD present simple\u000f\u000eA for future time in a clause with \u000f\u000eFif, when, as, while, before, after, until, by the time, or as soon as\u000f\u000eA. \u000f","p":1},{"t":"eg","x":"\u000eAThis happens when\u000f\u000eD both clauses are about the future.\u000f","p":1},{"t":"eg","x":"\u000eEIf we \u000f\u000eHmeet\u000f\u000eE at seven, we'll be in time.\u000f","p":1},{"t":"eg","x":"\u000eEMy dad is going to retire when he\u000f\u000eH's\u000f\u000eE sixty.\u000f","p":1},{"t":"eg","x":"\u000eELet's wait until the rain \u000f\u000eHstops.\u000f","p":1},{"t":"eg","x":"\u000eECall me as soon as you \u000f\u000eHhave\u000f\u000eE any news.\u000f","p":1},{"t":"wrong","x":"... as soon as you'll have any news."},{"t":"rule","x":"\u000eAThe same thing happens in a \u000f\u000eDrelative clause or noun clause\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEThere will be a prize for the person who \u000f\u000eHscores\u000f\u000eE the most points.\u000f","p":1},{"t":"eg","x":"\u000eEMake sure everything \u000f\u000eHis\u000f\u000eE left tidy, will you?\u000f","p":1},{"t":"rule","x":"\u000eAWe also use the present, and not \u000f\u000eFwill\u000f\u000eA, with the \u000f\u000eDcontinuous and the perfect.\u000f","p":1},{"t":"eg","x":"\u000eEI'll relax when I\u000f\u000eH'm lying\u000f\u000eE by the pool.\u000f","p":1},{"t":"wrong","x":"... when I'll be lying by the pool."},{"t":"eg","x":"\u000eELet's carry on until we'\u000f\u000eHve finished\u000f\u000eE.\u000f","p":1},{"t":"wrong","x":"... until we'll have finished."},{"t":"tip","x":"If the main clause has a present-tense verb such as I expect, then we do not use another present-tense verb for the future. We say I expect the rain will stop soon, not I expect the rain stops soon."}]}]},{"n":41,"t":"Will, be going to, or the present tense?","u":"Verb Tenses","s":[{"l":"A","b":[{"t":"rule","x":"There is no single ‘future tense’ in English. There are a number of different forms we can use for the future, e.g. \u0001will\u0002 and be \u0001going to\u0002. There is often more than one possible form in a particular context."}]},{"l":"B","b":[{"t":"rule","x":"\u000eAWe use both \u000f\u000eFwill\u000f\u000eA and \u000f\u000eFbe going to\u000f\u000eA for the future.\u000f","p":1},{"t":"eg","x":"\u000eEIt\u000f\u000eH’ll\u000f\u000eE probably \u000f\u000eHrain\u000f\u000eE at the weekend.\u000f","p":1},{"t":"eg","x":"\u000eELook at those clouds. It’\u000f\u000eHs going to rain\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eAThe prediction with \u000f\u000eFbe going to\u000f\u000eA is based on the present situation.\u000f","p":1},{"t":"rule","x":"\u000eAWe use \u000f\u000eFbe going to\u000f\u000eA (not \u000f\u000eFwill\u000f\u000eA) when the future action seems certain to happen and is very close.\u000f","p":1},{"t":"eg","x":"\u000eEHelp! I’\u000f\u000eHm going to fall!\u000f","p":1},{"t":"sub","x":"\u000eEI’\u000f\u000eHm going to be sick\u000f\u000eE!\u000f","p":1},{"t":"rule","x":"Sometimes we can use either form."},{"t":"eg","x":"\u000eEI \u000f\u000eHwon’t be\u000f\u000eE / I’\u000f\u000eHm not going to be\u000f\u000eE late.\u000f","p":1},{"t":"eg","x":"\u000eEOne day the sun \u000f\u000eHwill cool down\u000f\u000eE / the sun \u000f\u000eHis going to cool down.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"\u000eAWhen we talk about i\u000f\u000eDntentions, plans, and arrangements\u000f\u000eA, we use \u000f\u000eFbe going to\u000f\u000eA or the present continuous, but not \u000f\u000eFwill\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEWe\u000f\u000eH’re going to eat\u000f\u000eE out tonight.\u000f","note":"We intend to eat out.","p":1},{"t":"eg","x":"\u000eEWe’\u000f\u000eHre eating\u000f\u000eE out tonight.\u000f","note":"We have arranged to eat out.","p":1},{"t":"eg","x":"\u000eFWill\u000f\u000eA has a different meaning.\u000f","p":1},{"t":"eg","x":"\u000eEI don’t feel like cooking tonight. ~ Well, we\u000f\u000eH’ll eat\u000f\u000eE out then.\u000f","p":1},{"t":"rule","x":"\u000eAHere \u000f\u000eFwill\u000f\u000eA expresses an instant decision rather than an existing intention.\u000f","p":1},{"t":"rule","x":"\u000eAWe use the present simple for a \u000f\u000eDtimetable\u000f\u000eA but not for an intention or arrangement.\u000f","p":1},{"t":"eg","x":"\u000eEThe play \u000f\u000eHstarts\u000f\u000eE at seven thirty.\u000f","note":"But not I act in a play next week.","p":1}]},{"l":"D","b":[{"t":"rule","x":"\u000eAWe do not use \u000f\u000eFwill\u000f\u000eA to first mention a plan, but we often use it for further details and comments.\u000f","p":1},{"t":"eg","x":"\u000eEI\u000f\u000eH’m going\u000f\u000eE on holiday on Saturday. I’\u000f\u000eHll be\u000f\u000eE away for three weeks.\u000f","p":1},{"t":"eg","x":"\u000eEWe’\u000f\u000eHre going to do\u000f\u000eE some walking. ~ Oh, that\u000f\u000eH’ll be\u000f\u000eE nice.\u000f","p":1},{"t":"eg","x":"\u000eEThey\u000f\u000eH’re going to lay\u000f\u000eE a new path. The work \u000f\u000eHwill take\u000f\u000eE a couple of days.\u000f","p":1},{"t":"rule","x":"\u000eANote that we do not use the ordinary verb \u000f\u000eFbe\u000f\u000eA in the present continuous.\u000f","p":1},{"t":"eg","x":"I’ll \u0004be\u0005 away for three weeks."},{"t":"wrong","x":"I’m being away for three weeks."},{"t":"tip","x":"Don’t automatically use \u0001will\u0002 for the future. Remember that \u0001be going to\u0002 can be used for both predictions and intentions, so it is often the safest choice, especially in conversation."}]}]},{"n":42,"t":"Be to, be about to, etc.","u":"Verb Tenses","s":[{"l":"A","b":[{"t":"sub","x":"\u000eLBe to \u000f\u000eCfor an arrangement\u000f","p":1},{"t":"rule","x":"\u000eAWe can use \u000f\u000eJbe + to-infinitive\u000f\u000eA for an official arrangement.\u000f","p":1},{"t":"eg","x":"\u000eEThe Prime Minister\u000f\u000eH is to\u000f\u000eE visit Rome.\u000f","p":1},{"t":"eg","x":"\u000eEThe two companies \u000f\u000eHare to\u000f\u000eE merge shortly.\u000f","p":1},{"t":"rule","x":"\u000eJBe\u000f\u000eA is often left out in news headlines.\u000f","p":1},{"t":"eg","x":"Prime Minister \u0004to\u0005 visit Rome."}]},{"l":"B","b":[{"t":"sub","x":"\u000eLBe to \u000f\u000eCfor an order\u000f","p":1},{"t":"eg","x":"\u000eJBe to\u000f\u000eA can also express\u000f\u000eD a rule or an order\u000f\u000eA by a person in authority.\u000f","p":1},{"t":"eg","x":"\u000eEThe teacher says we \u000f\u000eHare to\u000f\u000eE wait here.\u000f","p":1},{"t":"eg","x":"\u000eEYou’\u000f\u000eHre not to stay\u000f\u000eE up late.\u000f","p":1},{"t":"eg","x":"\u000eENo one \u000f\u000eHis to leave\u000f\u000eE this building.\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"\u000eLBe about to\u000f\u000eG and \u000f\u000eLbe on the point of\u000f","p":1},{"t":"rule","x":"\u000eAWe use \u000f\u000eJbe \u0001about\u0002 \u0001to\u0002\u000f\u000eA for the near future.\u000f","p":1},{"t":"eg","x":"\u000eEThe performance i\u000f\u000eHs about to\u000f\u000eE start.\u000f","p":1},{"t":"eg","x":"\u000eEHurry up. The bus \u000f\u000eHis about to\u000f\u000eE leave.\u000f","p":1},{"t":"rule","x":"\u000eAWe can use \u000f\u000eJjust\u000f\u000eA with \u000f\u000eJbe \u0001about\u0002 \u0001to\u0002\u000f\u000eA and \u000f\u000eJbe going to\u000f\u000eA for the very near future.\u000f","p":1},{"t":"sub","x":"\u000eEThe bus \u000f\u000eHis just about to leave\u000f\u000eE / \u000f\u000eHis just going to leave\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eJBe on the point of\u000f\u000eA means the same as \u000f\u000eJbe \u0001about\u0002 \u0001to\u0002\u000f\u000eA. It is followed by an\u000f\u000eF \u0001-ing form\u0002\u000f\u000eI.\u000f","p":1},{"t":"eg","x":"\u000eEI’\u000f\u000eHm on the point of quitting\u000f\u000eE my job.\u000f","p":1},{"t":"rule","x":"There is no time with these phrases."},{"t":"wrong","x":"We’re \u0004about\u0005 \u0004to\u0005 leave in ten minutes."}]},{"l":"D","b":[{"t":"sub","x":"Be due to"},{"t":"rule","x":"\u000eAWe can sometimes use \u000f\u000eJbe due + to-infinitive\u000f\u000eA to talk about a timetable.\u000f","p":1},{"t":"eg","x":"\u000eEThe meeting \u000f\u000eHis due to take\u000f\u000eE place today.\u000f","p":1},{"t":"eg","x":"\u000eEThe train i\u000f\u000eHs due to leave\u000f\u000eE at 4.20.\u000f","p":1}]},{"l":"E","b":[{"t":"sub","x":"Be set to"},{"t":"rule","x":"\u000eJBe set + to-infinitive\u000f\u000eA is used in news reports for things \u000f\u000eDexpected to happen soon\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEThe player \u000f\u000eHis set to leave\u000f\u000eE the club.\u000f","p":1},{"t":"eg","x":"\u000eEPrices \u000f\u000eHare set to rise\u000f\u000eE once more.\u000f","p":1}]},{"l":"F","b":[{"t":"sub","x":"Be bound/sure/certain to"},{"t":"rule","x":"\u000eAWe use these forms to say what \u000f\u000eDwill definitely happen in the future.\u000f","p":1},{"t":"eg","x":"\u000eEThere’\u000f\u000eHs bound to be\u000f\u000eE trouble.\u000f","p":1},{"t":"eg","x":"\u000eEThe president \u000f\u000eHis sure/certain to\u000f\u000eE resign.\u000f","p":1}]},{"l":"G","b":[{"t":"sub","x":"Was to, was about to, etc"},{"t":"rule","x":"We can use the forms in the past tense."},{"t":"eg","x":"\u000eEDaniel fell ill on the day \u000f\u000eHhe was to go\u000f\u000eE for a job interview.\u000f","p":1},{"t":"eg","x":"\u000eEWe saw that the bus \u000f\u000eHwas about to leave\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEWe were \u000f\u000eHon the point of buying\u000f\u000eE the flat when we had second thoughts.\u000f","p":1},{"t":"tip","x":"It is more important to recognize these forms than to use them. You can express most of the meanings differently, e.g. They have arranged to meet. We’re going to leave in a moment. There will definitely be trouble."}]}]},{"n":43,"t":"The future continuous and perfect","u":"Verb Tenses","s":[{"l":"A","b":[{"t":"sub","x":"Future continuous"},{"t":"rule","x":"\u000eAThe form is \u000f\u000eJwill be + ing-form\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI’\u000f\u000eHll be working\u000f\u000eE all day tomorrow.\u000f","p":1},{"t":"eg","x":"\u000eEWe \u000f\u000eHwon’t be doing\u000f\u000eE much on Sunday.\u000f","p":1},{"t":"eg","x":"\u000eHWill\u000f\u000eE you \u000f\u000eHbe staying\u000f\u000eE here long?\u000f","p":1},{"t":"rule","x":"We use the future continuous for an action that we will be in the middle of."},{"t":"eg","x":"\u000eEIn a week’s time I’\u000f\u000eHll be lying\u000f\u000eE in the sun.\u000f","p":1},{"t":"eg","x":"\u000eEWe’\u000f\u000eHll be having\u000f\u000eE tea at seven.\u000f","p":1},{"t":"rule","x":"We sometimes use it for an action over a whole future period."},{"t":"eg","x":"\u000eESarah \u000f\u000eHwill be revising\u000f\u000eE all evening.\u000f","p":1},{"t":"rule","x":"We also use the future continuous for an action which will result from a routine or arrangement."},{"t":"eg","x":"\u000eEI’\u000f\u000eHll be phoning\u000f\u000eE my mother tonight.\u000f","note":"It’s part of my regular routine.","p":1},{"t":"eg","x":"\u000eEThe Queen \u000f\u000eHwill be arriving\u000f\u000eE soon.\u000f","note":"It’s part of her schedule.","p":1},{"t":"rule","x":"Other forms are possible in this context."},{"t":"eg","x":"\u000eEI\u000f\u000eH’m going to\u000f\u000eE phone / I\u000f\u000eH’m phoning\u000f\u000eE tonight.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"Future perfect"},{"t":"rule","x":"\u000eAThe form is \u000f\u000eJwill have + past participle\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEWe\u000f\u000eH’ll have done\u000f\u000eE half the job soon.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHwon’t have got\u000f\u000eE home by six.\u000f","p":1},{"t":"eg","x":"\u000eEHow long \u000f\u000eHwill\u000f\u000eE the casserole \u000f\u000eHhave been\u000f\u000eE in the oven?\u000f","p":1},{"t":"rule","x":"We use the future perfect to talk about something being over in the future."},{"t":"eg","x":"\u000eEI’\u000f\u000eHll have finished\u000f\u000eE this book soon. I’m nearly at the end.\u000f","p":1},{"t":"eg","x":"\u000eEGemma \u000f\u000eHwon’t have completed\u000f\u000eE her studies until she’s 25.\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"Future perfect continuous"},{"t":"rule","x":"\u000eAThe form is \u000f\u000eJwill have been + ing-form\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEMike is leaving next month. He\u000f\u000eH’ll have been working\u000f\u000eE here ten years.\u000f","p":1},{"t":"eg","x":"\u000eEOur neighbours are moving. They \u000f\u000eHwon’t have been living\u000f\u000eE here long.\u000f","p":1},{"t":"eg","x":"\u000eEHow long \u000f\u000eHwill\u000f\u000eE the spaceship \u000f\u000eHhave been orbiting\u000f\u000eE the earth?\u000f","p":1},{"t":"rule","x":"We use this form when we imagine looking back from the future. In the first example, we look back from next month at Mike’s work continuing up to that time."},{"t":"rule","x":"The future perfect focuses on the result of an action."},{"t":"eg","x":"\u000eEI’\u000f\u000eHll have written\u000f\u000eE the report by six.\u000f","p":1},{"t":"rule","x":"The future perfect continuous focuses on the action going on."},{"t":"eg","x":"\u000eEI’\u000f\u000eHll have been writing\u000f\u000eE it for a week.\u000f","p":1},{"t":"tip","x":"You can use the future continuous to ask about someone’s plans and see if they fit in with your wishes, e.g. • How long will you be using the tennis court?"}]}]},{"n":44,"t":"The verb be","u":"Be, Have, Do & Make","s":[{"l":"A","b":[{"t":"rule","x":"\u000eAWe can use \u000f\u000eFbe\u000f\u000eA as an auxiliary verb.\u000f","p":1},{"t":"eg","x":"\u000eEI\u000f\u000eH’m\u000f\u000eE surfing the net.\u000f","p":1},{"t":"eg","x":"\u000eEThe information \u000f\u000eHis\u000f\u000eE updated daily.\u000f","p":1},{"t":"rule","x":"\u000eFBe\u000f\u000eA is used to form the continuous (\u000f\u000eFam surfing\u000f\u000eA) and the passive (\u000f\u000eFis updated\u000f\u000eA).\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eFBe\u000f\u000eA is more often an ordinary verb.\u000f","p":1},{"t":"eg","x":"\u000eEThe weather \u000f\u000eHis\u000f\u000eE marvellous.\u000f","p":1},{"t":"eg","x":"\u000eEThe talk \u000f\u000eHwas\u000f\u000eE quite interesting.\u000f","p":1},{"t":"rule","x":"It can be perfect or continuous."},{"t":"eg","x":"\u000eEThe weather \u000f\u000eHhas bee\u000f\u000eEn marvellous.\u000f","p":1},{"t":"eg","x":"\u000eEYou\u000f\u000eH’re being\u000f\u000eE very helpful.\u000f","p":1},{"t":"rule","x":"\u000eAAnd we can use \u000f\u000eFbe\u000f\u000eA after a modal verb.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHmight be\u000f\u000eE a bit late tomorrow.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"These are the simple-tense forms."},{"t":"sub","x":"Present:"},{"t":"rule","x":"I am, you/we/they are, he/she/it is"},{"t":"sub","x":"Past:"},{"t":"eg","x":"I/he/she/it was, you/we/they were"},{"t":"rule","x":"\u000eAWe \u0001do\u0002 \u000f\u000eCnot\u000f\u000eA use \u000f\u000eFdo\u000f\u000eA in simple tense negatives and questions.\u000f","p":1},{"t":"eg","x":"\u000eEIt\u000f\u000eH isn’t\u000f\u000eE very far now.\u000f","p":1},{"t":"wrong","x":"It doesn’t \u0004be\u0005 very far now."},{"t":"eg","x":"\u000eHWere\u000f\u000eE you at the meeting?\u000f","p":1},{"t":"wrong","x":"Did you \u0004be\u0005 at \u0004the\u0005 meeting?"},{"t":"rule","x":"In other tenses we form negatives and questions in the usual way."},{"t":"eg","x":"\u000eEI \u000f\u000eHhaven’t been\u000f\u000eE very well.\u000f","p":1},{"t":"eg","x":"\u000eEHow \u000f\u000eHhave\u000f\u000eE you \u000f\u000eHbeen\u000f\u000eE?\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"We use the ordinary verb \u0001be\u0002 in different ways, for example to talk about someone’s identity, nationality, or job, to talk about place and time, and to describe qualities, feelings, and behaviour."},{"t":"eg","x":"\u000eEThose girls \u000f\u000eHare\u000f\u000eE my cousins.\u000f","p":1},{"t":"eg","x":"\u000eEMy sister \u000f\u000eHis\u000f\u000eE a doctor.\u000f","p":1},{"t":"eg","x":"\u000eEThe museum \u000f\u000eHis\u000f\u000eE in South Kensington.\u000f","p":1},{"t":"eg","x":"\u000eEThe match \u000f\u000eHwas\u000f\u000eE last Saturday.\u000f","p":1},{"t":"eg","x":"\u000eEThat building \u000f\u000eHis\u000f\u000eE really ugly.\u000f","p":1},{"t":"eg","x":"\u000eEI\u000f\u000eH’m\u000f\u000eE cold and hungry.\u000f","p":1},{"t":"eg","x":"\u000eEPlease \u000f\u000eHbe\u000f\u000eE careful.\u000f","p":1}]},{"l":"E","b":[{"t":"rule","x":"\u000eAWe can use \u000f\u000eFbe\u000f\u000eA in the continuous for temporary behaviour.\u000f","p":1},{"t":"eg","x":"\u000eEThe neighbours \u000f\u000eHare being\u000f\u000eE noisy today.\u000f","p":1},{"t":"eg","x":"\u000eEThe children \u000f\u000eHwere being\u000f\u000eE silly.\u000f","p":1},{"t":"rule","x":"Compare these two sentences."},{"t":"eg","x":"\u000eEYou’\u000f\u000eHre being\u000f\u000eE stupid.\u000f\u000eA (behaving stupidly)\u000f","p":1},{"t":"eg","x":"\u000eEYou’\u000f\u000eHre\u000f\u000eE stupid\u000f\u000eD.\u000f\u000eA (a stupid person)\u000f","p":1}]},{"l":"F","b":[{"t":"rule","x":"\u000eFBeen\u000f\u000eA can \u0001be\u0002 a past participle of \u000f\u000eFgo\u000f\u000eA as well as \u000f\u000eFbe\u000f\u000eA. Compare these examples.\u000f","p":1},{"t":"eg","x":"\u000eETom has \u000f\u000eHbeen\u000f\u000eE to town. He got back half an hour ago\u000f\u000eD.\u000f","p":1},{"t":"eg","x":"\u000eETom has \u000f\u000eHgone\u000f\u000eE to town — he isn’t back yet.\u000f","p":1},{"t":"rule","x":"\u000eAHere \u000f\u000eFbeen\u000f\u000eA means ‘gone and come back’.\u000f","p":1},{"t":"rule","x":"\u000eFGone\u000f\u000eA means ‘gone and still away’.\u000f","p":1},{"t":"tip","x":"In questions about what places people have visited, we use \u0001been\u0002, e.g. • Have you ever \u0001been\u0002 to Africa?"}]}]},{"n":45,"t":"The verb have","u":"Be, Have, Do & Make","s":[{"l":"A","b":[{"t":"rule","x":"\u000eAWe can use \u000f\u000eFhave\u000f\u000eA as an auxiliary verb to form the perfect.\u000f","p":1},{"t":"eg","x":"\u000eEThe computer \u000f\u000eHhas\u000f\u000eE crashed.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHhad\u000f\u000eE already packed a suitcase\u000f\u000eD.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eAWe use \u000f\u000eFhave\u000f\u000eA and \u000f\u000eFhave got\u000f\u000eA to express possession and other related meanings.\u000f","p":1},{"t":"eg","x":"\u000eEI once \u000f\u000eHhad\u000f\u000eE a dog.\u000f","p":1},{"t":"eg","x":"\u000eEKate \u000f\u000eHhas got\u000f\u000eE blue eyes.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"\u000eAIn the present we normally use \u000f\u000eFhas got\u000f\u000eA or \u000f\u000eFhave got\u000f\u000eI.\u000f","p":1},{"t":"eg","x":"\u000eEAdam’\u000f\u000eHs got\u000f\u000eE the key.\u000f","p":1},{"t":"eg","x":"\u000eEMy neighbours \u000f\u000eHhave got\u000f\u000eE a balcony.\u000f","p":1},{"t":"eg","x":"\u000eAThese sentences are more usual than \u000f\u000eEAdam has the key\u000f\u000eA or \u000f\u000eEThey have a balcony\u000f\u000eA, especially in everyday conversation.\u000f","p":1},{"t":"rule","x":"We form negatives and questions in two different ways."},{"t":"eg","x":"\u000eEAdam \u000f\u000eHhasn’t got\u000f\u000eE the key.\u000f","p":1},{"t":"eg","x":"\u000eEAdam \u000f\u000eHdoesn’t have\u000f\u000eE the key.\u000f","p":1},{"t":"eg","x":"\u000eHHave\u000f\u000eE you \u000f\u000eHgot\u000f\u000eE a balcony?\u000f","p":1},{"t":"eg","x":"\u000eHDo\u000f\u000eE you \u000f\u000eHhave\u000f\u000eE a balcony?\u000f","p":1},{"t":"rule","x":"\u000eAAmericans prefer to use the \u000f\u000eFdo\u000f\u000eA pattern.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"\u000eAIn the past we normally use \u000f\u000eFhad\u000f\u000eA rather than \u000f\u000eFhad got\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHhad\u000f\u000eE a headache yesterday.\u000f","p":1},{"t":"eg","x":"\u000eEOur hotel \u000f\u000eHhad\u000f\u000eE a swimming pool\u000f\u000eD.\u000f","p":1},{"t":"rule","x":"\u000eANegatives and questions are with \u000f\u000eFdo\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHdidn’t have\u000f\u000eE a headache.\u000f","p":1},{"t":"eg","x":"\u000eHDid\u000f\u000eE the hotel \u000f\u000eHhave\u000f\u000eE a pool?\u000f","p":1},{"t":"eg","x":"\u000eHHad\u000f\u000eE the hotel \u000f\u000eHgot\u000f\u000eE a pool?\u000f\u000eA is less usual.\u000f","p":1}]},{"l":"E","b":[{"t":"rule","x":"\u000eAWe can also use \u000f\u000eFhave\u000f\u000eA with \u0001the\u0002 perfect and the\u000f\u000eI to-infinitive\u000f\u000eA or\u000f\u000eI -ing form.\u000f","p":1},{"t":"eg","x":"\u000eEI\u000f\u000eH’ve had\u000f\u000eE these shoes for years.\u000f","p":1},{"t":"eg","x":"\u000eEIt would be nice \u000f\u000eHto have\u000f\u000eE more money.\u000f","p":1},{"t":"eg","x":"\u000eEIt’s depressing \u000f\u000eHhaving\u000f\u000eE no job.\u000f","p":1},{"t":"rule","x":"\u000eAWe do not use \u000f\u000eFgot\u000f\u000eA in these patterns.\u000f","p":1},{"t":"rule","x":"We do not use the continuous to talk about possession."},{"t":"wrong","x":"They are having a balcony."}]},{"l":"F","b":[{"t":"rule","x":"\u000eAWe can use \u000f\u000eFhave\u000f\u000eA as an action verb with all the tenses, including the continuous.\u000f","p":1},{"t":"eg","x":"\u000eEWe’\u000f\u000eHre having\u000f\u000eE fun\u000f\u000eD.\u000f\u000eA (experiencing)\u000f","p":1},{"t":"eg","x":"\u000eEI’\u000f\u000eHve had\u000f\u000eE lots of presents.\u000f\u000eA (received)\u000f","p":1},{"t":"eg","x":"\u000eELucy always \u000f\u000eHhas\u000f\u000eE toast at breakfast\u000f\u000eD.\u000f\u000eA (eats)\u000f","p":1},{"t":"rule","x":"\u000eEMy father \u000f\u000eHhas\u000f\u000eE a sleep after lunch\u000f\u000eD.\u000f\u000eA (has a sleep = sleeps, \u000f\u000eB➤47\u000f\u000eA)\u000f","p":1},{"t":"rule","x":"\u000eAWe use \u000f\u000eFdo\u000f\u000eA as a simple-tense auxiliary.\u000f","p":1},{"t":"eg","x":"\u000eEWe \u000f\u000eHdon’t have\u000f\u000eE breakfast on Sundays.\u000f","p":1},{"t":"eg","x":"\u000eHDid\u000f\u000eE you \u000f\u000eHhave\u000f\u000eE a good journey?\u000f","p":1},{"t":"rule","x":"\u000eAWe cannot use \u000f\u000eFgot\u000f\u000eA with the ordinary verb.\u000f","p":1},{"t":"wrong","x":"We’ve \u0004got\u0005 a great time."},{"t":"tip","x":"\u000eAFor possession, use \u000f\u000eFI’ve go\u000f\u000eDt...\u000f\u000eA and \u000f\u000eFHave you got...?\u000f\u000eA for the present and \u000f\u000eFI had.\u000f\u000eD..\u000f\u000eA and \u000f\u000eFDid you have\u000f\u000eD...?\u000f\u000eA for the past.\u000f","p":1}]}]},{"n":46,"t":"The verbs do and make","u":"Be, Have, Do & Make","s":[{"l":"A","b":[{"t":"rule","x":"\u000eAWe can use \u000f\u000eFdo\u000f\u000eA as an \u000f\u000eDauxiliary verb in simple tenses.\u000f","p":1},{"t":"eg","x":"\u000eEI d\u000f\u000eHon’t\u000f\u000eE work on Saturdays.\u000f","p":1},{"t":"eg","x":"\u000eEWhat time \u000f\u000eHdid\u000f\u000eE you get up?\u000f","p":1},{"t":"rule","x":"\u000eEIt \u000f\u000eHdoes\u000f\u000eE feel cold. \u000f\u000eB➤25B\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eFDo\u000f\u000eA can also be an \u000f\u000eDordinary\u000f\u000eA verb.\u000f","p":1},{"t":"eg","x":"\u000eEI’\u000f\u000eHm doing\u000f\u000eE the crossword.\u000f","p":1},{"t":"eg","x":"\u000eEWe \u000f\u000eHdid\u000f\u000eE badly in the quiz.\u000f","p":1},{"t":"eg","x":"\u000eEYou \u000f\u000eHhaven’t done\u000f\u000eE anything wrong.\u000f","p":1},{"t":"eg","x":"\u000eEWhat on earth \u000f\u000eHwere\u000f\u000eE you \u000f\u000eHdoing\u000f\u000eE?\u000f","p":1},{"t":"eg","x":"\u000eHDid\u000f\u000eE everyone \u000f\u000eHdo\u000f\u000eE it right?\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"\u000eAWe use the ordinary verb \u000f\u000eFdo\u000f\u000eA when we \u000f\u000eDdo not say what the action is.\u000f","p":1},{"t":"rule","x":"\u000eEWhat are you \u000f\u000eHdoing\u000f\u000eE?\u000f\u000eB → \u000f\u000eEWriting a poem.\u000f","p":1},{"t":"eg","x":"\u000eELet’s \u000f\u000eHdo\u000f\u000eE something more interesting.\u000f","p":1},{"t":"eg","x":"\u000eEGuess what we \u000f\u000eHdid\u000f\u000eE yesterday.\u000f","p":1},{"t":"rule","x":"\u000eAWe also use \u000f\u000eFdo\u000f\u000eA to mean\u000f\u000eD ‘carry out’ or ‘complete’.\u000f","p":1},{"t":"eg","x":"\u000eHHave\u000f\u000eE you \u000f\u000eHdone\u000f\u000eE your homework?\u000f","p":1},{"t":"eg","x":"\u000eEWe \u000f\u000eHdid\u000f\u000eE the job in less than an hour.\u000f","p":1},{"t":"rule","x":"\u000eFDo\u000f\u000eA can replace another verb in the context of a task or a service.\u000f","p":1},{"t":"eg","x":"\u000eEI’\u000f\u000eHve done\u000f\u000eE the report.\u000f\u000eA (= written)\u000f","p":1},{"t":"eg","x":"\u000eDThe café \u000f\u000eGdoes\u000f\u000eD Sunday lunches.\u000f\u000eA (= serves)\u000f","p":1},{"t":"rule","x":"\u000eAWe can also use \u000f\u000eFdo\u000f\u000eA with a\u000f\u000eIn -ing\u000f\u000eA form.\u000f","p":1},{"t":"eg","x":"\u000eEWe ought to \u000f\u000eHdo some cleaning\u000f\u000eE in here.\u000f","p":1},{"t":"rule","x":"\u000eEI \u000f\u000eHdid a lot of skiing\u000f\u000eE last year. \u000f\u000eB➤78B\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"\u000eAWe use the ordinary verb \u000f\u000eFdo\u000f\u000eA to stand for an action, or when we talk about doing a task.\u000f","p":1},{"t":"eg","x":"\u000eEI’m afraid I’\u000f\u000eHve done\u000f\u000eE something silly.\u000f","p":1},{"t":"eg","x":"\u000eEWe’\u000f\u000eHre\u000f\u000eE just \u000f\u000eHdoing\u000f\u000eE the washing-up.\u000f","p":1},{"t":"rule","x":"\u000eAThe basic meaning of \u000f\u000eFmake\u000f\u000eA is ‘produce’ or ‘create’.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHwas\u000f\u000eE just \u000f\u000eHmaking\u000f\u000eE a cup of tea.\u000f","p":1},{"t":"eg","x":"\u000eEThe company \u000f\u000eHmakes\u000f\u000eE a small profit.\u000f","p":1},{"t":"rule","x":"\u000eAHere are some patterns with \u000f\u000eFmake\u000f\u000eA:\u000f","p":1},{"t":"sub","x":"Make + object"},{"t":"sub","x":"\u000eETom \u000f\u000eHmade this table.\u000f","p":1},{"t":"sub","x":"Make + two objects"},{"t":"sub","x":"\u000eETom \u000f\u000eHmade me this table.\u000f","p":1},{"t":"sub","x":"Make + complement"},{"t":"eg","x":"\u000eEA week in Ireland would \u000f\u000eHmake a nice break\u000f\u000eD.\u000f\u000eA (make = be)\u000f","p":1},{"t":"sub","x":"Make + object + complement"},{"t":"eg","x":"\u000eEThe music \u000f\u000eHmade me sad.\u000f","note":"= caused me to become sad","p":1},{"t":"sub","x":"\u000eJMake + object + infinitive without \u000f\u000eLto\u000f","p":1},{"t":"eg","x":"\u000eEThe music \u000f\u000eHmade me cry.\u000f","note":"= caused me to cry","p":1},{"t":"rule","x":"There are many idiomatic uses of \u0001do\u0002 and \u0001make\u0002, e.g. you do your work, you do a course or a subject, you do your best, and you make sure you don’t make a mistake."},{"t":"tip","x":"A useful idiom is \u0001to do with\u0002 meaning ‘connected with’, e.g. The boss wants to see you. It’s something \u0001to do with\u0002 an e-mail."}]}]},{"n":47,"t":"Have a look, etc","u":"Be, Have, Do & Make","s":[{"l":"A","b":[{"t":"rule","x":"Compare these sentences."},{"t":"eg","x":"\u000eEWe often \u000f\u000eHswim\u000f\u000eE in the pool.\u000f","p":1},{"t":"eg","x":"\u000eEWe often \u000f\u000eHhave a swim\u000f\u000eE in the pool.\u000f","p":1},{"t":"rule","x":"The two sentences have a very similar meaning. We can express some actions as a verb (swim) or as an idiom consisting of a verb + object (have a swim)."}]},{"l":"B","b":[{"t":"rule","x":"\u000eFHave\u000f\u000eA is often used in these idioms, but with some we use a different verb such as \u000f\u000eFmake\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEOne of the guests \u000f\u000eHcomplained\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEOne of the guests \u000f\u000eHmade a complaint.\u000f","p":1},{"t":"eg","x":"\u000eFHave\u000f\u000eA, \u000f\u000eFmake\u000f\u000eA, etc. are \u000f\u000eDordinary verbs and can be continuous.\u000f","p":1},{"t":"eg","x":"\u000eESomeone\u000f\u000eH is having\u000f\u000eE a swim.\u000f","p":1}]},{"l":"C","b":[{"t":"table","rows":[["Verb","Idiom"],["act","take action"],["affect","have an effect on"],["argue","have an argument"],["choose","make a choice"],["complain","make a complaint"],["contact","make contact with"],["control","have/take control of"],["decide","take/make a decision"],["describe","give a description of"],["discuss","have a discussion about"],["drink","have a drink / have something to drink"],["eat","have a meal / have something to eat"],["guess","have a guess"],["hold","take/have/keep hold of"],["look","have/take a look"],["move","make a move"],["rest","have a rest"],["revise","do some revision"],["sleep","have a sleep"],["start","make a start"],["suggest","make a suggestion"],["swim","have a swim / go for a swim"],["talk to","have a talk with"],["think","have a think"],["try","have a try / make an effort"],["use","make use of"],["walk","have/take a walk / go for a walk"],["wash","have a wash"],["work","do some work"]]}]},{"l":"D","b":[{"t":"rule","x":"Compare the use of the adverb and adjective in these sentences."},{"t":"rule","x":"\u000eCAdverb\u000f\u000eA: \u000f\u000eEI washed \u000f\u000eHquickly\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eCAdjective\u000f\u000eA: \u000f\u000eEI had a \u000f\u000eHquick\u000f\u000eE wash.\u000f","p":1},{"t":"tip","x":"The pattern with the adjective is usually neater. She made good use of the computer sounds much better than She used the computer well."}]}]},{"n":48,"t":"Modal verbs","u":"Modal Verbs","s":[{"l":"A","b":[{"t":"rule","x":"The modal verbs are can, could, must, should, ought, may, might, will, would, and \u0001shall\u0002. They express ideas such as ability, necessity, and possibility."},{"t":"eg","x":"necessity, and possibility."},{"t":"rule","x":"\u000eAA modal verb always has the same form and never has an ending such as \u000f\u000eF-s, -ing,\u000f\u000eI or \u000f\u000eF-ed\u000f\u000eA.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eAAfter a modal verb we put an \u000f\u000eDinfinitive\u000f\u000eA without \u000f\u000eFto\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEWe \u000f\u000eHcan park\u000f\u000eE here.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHmust go\u000f\u000eE now\u000f\u000eD.\u000f","p":1},{"t":"eg","x":"\u000eAThe only exception is \u000f\u000eFought\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHought to\u000f\u000eE go now.\u000f","p":1},{"t":"rule","x":"\u000eAThe infinitive can also \u000f\u000eDbe perfect, continuous, or passive.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHmay have shown\u000f\u000eE you this before.\u000f","p":1},{"t":"eg","x":"\u000eEThey \u000f\u000eHmay be showing\u000f\u000eE the film soon.\u000f","p":1},{"t":"eg","x":"\u000eEWe \u000f\u000eHmay be shown\u000f\u000eE the results later.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"\u000eATo form the negative we use \u000f\u000eFnot\u000f\u000eA \u0001or\u0002 \u000f\u000eFn’t\u000f\u000eA with the modal verb.\u000f","p":1},{"t":"eg","x":"\u000eEIt \u000f\u000eHmight not\u000f\u000eE work.\u000f","p":1},{"t":"eg","x":"\u000eEWe \u000f\u000eHshouldn’t\u000f\u000eE laugh.\u000f","p":1},{"t":"rule","x":"In questions we put the modal verb before the subject."},{"t":"eg","x":"\u000eHCan\u000f\u000eE we park here?\u000f","p":1},{"t":"wrong","x":"Do we can park here?"}]},{"l":"D","b":[{"t":"rule","x":"--"},{"t":"rule","x":"\u000eAThe verbs \u000f\u000eFneed\u000f\u000eA (\u000f\u000eB→ 51A–B\u000f\u000eA) and \u000f\u000eFdare\u000f\u000eA (\u000f\u000eB→ 58D\u000f\u000eA) can be used \u000f\u000eDeither as modal verbs or ordinary verbs.\u000f","p":1},{"t":"eg","x":"\u000eDYou needn’t go.\u000f\u000eA | \u000f\u000eDYou don’t need to go.\u000f","p":1}]},{"l":"E","b":[{"t":"rule","x":"Here are some meanings expressed by modal verbs."},{"t":"table","rows":[["Meaning","Examples"],["Necessity","\u000eEYou \u000f\u000eHmust\u000f\u000eE be careful. \u000f\u000eB➤50\u000f"],["No Necessity","\u000eEWe \u000f\u000eHneedn't\u000f\u000eE hurry - there's plenty of time \u000f\u000eB➤51\u000f"],["The right thing to do","You should revise/ you ought to revise your notes before the exam.➤52"],["Permission","\u000eHCan/May\u000f\u000eE I ask you a personal question?\u000f"],["","\u000eEWe \u000f\u000eHcouldn't\u000f\u000eE look around without a guide \u000f\u000eB➤53\u000f"],["Certainty","\u000eEYou \u000f\u000eHmust\u000f\u000eE be tired after that long walk\u000f"],["","\u000eEYou \u000f\u000eHcan't\u000f\u000eE be tired already. \u000f\u000eB➤54\u000f"],["Possibility","\u000eEI'm no sure, but I \u000f\u000eHmay/might\u000f\u000eE go out later.\u000f"],["","\u000eEWe \u000f\u000eHcould\u000f\u000eE go out later if you like \u000f\u000eB➤55\u000f"],["Ability","\u000eEJoshua \u000f\u000eHcan\u000f\u000eE walk on his hands\u000f"],["","\u000eENo one \u000f\u000eHcould\u000f\u000eE hit the target \u000f\u000eB➤56\u000f"],["Hypothesis","\u000eEA million pounds \u000f\u000eHwould\u000f\u000eE be very useful to me now. \u000f\u000eB➤57\u000f"]]}]}]},{"n":49,"t":"Modal phrases","u":"Modal Verbs","s":[{"l":"A","b":[{"t":"rule","x":"\u000eAThere are some phrases like \u000f\u000eFhave to\u000f\u000eI, \u000f\u000eFbe allowed to\u000f\u000eA, and \u000f\u000eFbe able to\u000f\u000eA which have similar meanings to modal verbs.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHmust\u000f\u000eE go now.\u000f\u000eB / \u000f\u000eEI \u000f\u000eHhave to\u000f\u000eE go now.\u000f","p":1},{"t":"eg","x":"\u000eEWe \u000f\u000eHcouldn’t\u000f\u000eE touch the exhibits.\u000f\u000eB / \u000f\u000eEWe \u000f\u000eHweren’t allowed to\u000f\u000eE touch the exhibits.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHcan\u000f\u000eE look after myself.\u000f\u000eB / \u000f\u000eEI’\u000f\u000eHm able to\u000f\u000eE look after myself.\u000f","p":1},{"t":"rule","x":"Modal phrases can be used in many more patterns than modal verbs. For example, we can use modal phrases after \u0001will\u0002, and in certain other forms."},{"t":"rule","x":"\u000eBAfter \u000f\u000eFwill\u000f\u000eB: \u000f\u000eEWe\u000f\u000eH’ll have to\u000f\u000eE leave early.\u000f","p":1},{"t":"wrong","x":"We’ll must leave early."},{"t":"rule","x":"\u000eBPerfect: \u000f\u000eEI \u000f\u000eHhaven’t been able to\u000f\u000eE find out.\u000f","p":1},{"t":"wrong","x":"I haven’t can find out."},{"t":"rule","x":"\u000eBContinuous: \u000f\u000eEI\u000f\u000eH’m having to\u000f\u000eE do two jobs.\u000f","p":1},{"t":"wrong","x":"I’m musting do two jobs."},{"t":"rule","x":"\u000eBInfinitive: \u000f\u000eEWe hope\u000f\u000eH to be allowed\u000f\u000eE to vote.\u000f","p":1},{"t":"wrong","x":"We hope to may vote."},{"t":"rule","x":"\u000eBIng-form: \u000f\u000eEI \u000f\u000eHhate not being able to\u000f\u000eE sleep.\u000f","p":1},{"t":"wrong","x":"I hate not canning sleep."},{"t":"rule","x":"Where it is not possible to use a modal verb, we can use a modal phrase instead."}]},{"l":"B","b":[{"t":"rule","x":"Here are some examples of modal phrases:"},{"t":"table","rows":[["Modal phrase","Example","Meaning"],["Have to","\u000eEWe \u000f\u000eHhad to\u000f\u000eE phone for help\u000f","\u000eANecessity (must) \u000f\u000eB➤50\u000f"],["Had better","\u000eEI\u000f\u000eH'd better\u000f\u000eE do some work. \u000f","\u000eAThe best thing to do (must, should) \u000f\u000eB➤52C\u000f"],["Be supposed to","\u000eEYou\u000f\u000eH're supposed to\u000f\u000eE key the number in\u000f","\u000eAThe rule ( must, should) \u000f\u000eB➤52D\u000f"],["Be allowed to","\u000eEYou\u000f\u000eH're allowed to\u000f\u000eE walk on the grass\u000f","\u000eAPermission ( can, could, may) \u000f\u000eB➤53\u000f"],["Be able to","\u000eEThey \u000f\u000eHwere able to\u000f\u000eE save the man's life\u000f","\u000eAAbility ( can, could) \u000f\u000eB➤56\u000f"],["Be unable to","\u000eEWe \u000f\u000eHare unable to\u000f\u000eE offer this service.\u000f","\u000eAAbility ( can't, couldn't) \u000f\u000eB➤56B\u000f"],["Wouldn't mind","\u000eEI \u000f\u000eHwouldn't mind\u000f\u000eE going for a walk.\u000f","\u000eAWillingness \u000f\u000eB➤57D\u000f"],["Would rather","\u000eEI'\u000f\u000eHd rather\u000f\u000eE sit in the shade than in the sun\u000f","\u000eAPreference \u000f\u000eB➤57E\u000f"],["Used to","\u000eEThey\u000f\u000eH used to\u000f\u000eE be a cinema here\u000f","\u000eAThe past \u000f\u000eB➤58A\u000f"],["Be going to","\u000eEThe forecast says it'\u000f\u000eHs going to\u000f\u000eE rain \u000f","The future (will) ➤ 39"],["Be sure to","\u000eEThe plan \u000f\u000eHis sure to\u000f\u000eE go wrong\u000f","Prediction (will definitely) ➤ 42F"]]},{"t":"tip","x":"We cannot use two modal verbs together, so \u0001not\u0002: I might can go. But we can use a phrase like \u0001be able to\u0002 or \u0001have to\u0002 after the modal verb: I might \u0001be able to\u0002 go."}]}]},{"n":50,"t":"Must and have to","u":"Modal Verbs","s":[{"l":"A","b":[{"t":"rule","x":"\u000eJMust\u000f\u000eA has just one form and is followed by a \u000f\u000eIto-infinitive.\u000f","p":1},{"t":"rule","x":"\u000eEYou \u000f\u000eHmust wear\u000f\u000eE something smart.\u000f","p":1},{"t":"rule","x":"\u000eJHave to\u000f\u000eA has both present and past forms.\u000f","p":1},{"t":"eg","x":"\u000eEWe \u000f\u000eHhave to\u000f\u000eE wear something smart.\u000f","p":1},{"t":"eg","x":"\u000eEDavid \u000f\u000eHhas to\u000f\u000eE work on Sundays.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHhad to\u000f\u000eE get up early today.\u000f","p":1},{"t":"rule","x":"\u000eAWe form negatives and questions with \u000f\u000eJdo\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEWe \u000f\u000eHdon’t have to\u000f\u000eE wear smart clothes.\u000f","p":1},{"t":"eg","x":"\u000eEWhat time \u000f\u000eHdid\u000f\u000eE you \u000f\u000eHhave to\u000f\u000eE get up?\u000f","p":1},{"t":"rule","x":"\u000eJHave to\u000f\u000eA can be continuous or perfect and has an infinitive and \u000f\u000eIing-form\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"I’m having to do the work of two people."},{"t":"eg","x":"We’ve had to make a few changes."},{"t":"eg","x":"\u000eEI don’t like \u000f\u000eHto have to\u000f\u000eE wait around.\u000f","p":1},{"t":"eg","x":"\u000eEIt’s no fun \u000f\u000eHhaving to\u000f\u000eE stand all the way.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eJMust\u000f\u000eA and \u000f\u000eJhave to\u000f\u000eA refer to what is necessary now or in the near future.\u000f","p":1},{"t":"eg","x":"\u000eEI’m really sweaty. I \u000f\u000eHmust\u000f\u000eE have a shower.\u000f","p":1},{"t":"rule","x":"\u000eEWe \u000f\u000eHmust\u000f\u000eE make the arrangements soon.\u000f","p":1},{"t":"eg","x":"\u000eEWe \u000f\u000eHhave to\u000f\u000eE turn left here. It’s one-way.\u000f","p":1},{"t":"eg","x":"\u000eEMark \u000f\u000eHhas to\u000f\u000eE take an exam next week.\u000f","p":1},{"t":"rule","x":"\u000eAFor the near future we can also use \u000f\u000eJwill \u0001have to\u0002\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHhave to\u000f\u000eE go / I’\u000f\u000eHll have to\u000f\u000eE go out soon.\u000f","p":1},{"t":"rule","x":"\u000eAWe sometimes use \u000f\u000eJmust\u000f\u000eA to recommend something enjoyable.\u000f","p":1},{"t":"eg","x":"\u000eEYou really \u000f\u000eHmust\u000f\u000eE watch this programme.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"There is a difference in meaning between \u0001must\u0002 and \u0001have to\u0002. We normally use \u0001must\u0002 when the speaker/writer decides what is necessary, and we use \u0001have to\u0002 when the necessity comes from the situation."},{"t":"rule","x":"\u000eEYou \u000f\u000eHmust\u000f\u000eE wait in the queue.\u000f","p":1},{"t":"rule","x":"(I’m telling you.)"},{"t":"eg","x":"\u000eEYou \u000f\u000eHhave to\u000f\u000eE wait in the queue.\u000f","note":"That’s the rule.","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHmust\u000f\u000eE go on a diet. I want to lose weight.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHhave to\u000f\u000eE go on a diet. Doctor’s orders.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"\u000eAInstead of \u000f\u000eJhave to\u000f\u000eA, we can use \u000f\u000eJhave got to\u000f\u000eA. The meaning is the same.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHhave to\u000f\u000eE fill this form in.\u000f","p":1},{"t":"eg","x":"\u000eEI’\u000f\u000eHve got to\u000f\u000eE fill this form in.\u000f","p":1},{"t":"eg","x":"\u000eHDoes\u000f\u000eE everyone \u000f\u000eHhave to\u000f\u000eE register?\u000f","p":1},{"t":"eg","x":"\u000eHHas\u000f\u000eE everyone \u000f\u000eHgot to\u000f\u000eE register?\u000f","p":1},{"t":"rule","x":"\u000eJHave got to\u000f\u000eA is informal and used mostly in the present simple. In the past \u000f\u000eJhad to\u000f\u000eA is more usual than \u000f\u000eJhad got to\u000f\u000eI.\u000f","p":1},{"t":"eg","x":"\u000eEI couldn’t go out because I \u000f\u000eHhad to\u000f\u000eE finish my project.\u000f","p":1},{"t":"rule","x":"\u000eAWe \u000f\u000eDdo not\u000f\u000eA use \u000f\u000eJgot\u000f\u000eA in the\u000f\u000eD perfect or continuous, the infinitive, or the ing-form\u000f\u000eA.\u000f","p":1},{"t":"tip","x":"In general it is safer to use \u0001have to\u0002 than to use \u0001must\u0002. \u0001Have to\u0002 is much more common in speech. Sometimes \u0001must\u0002 can sound strange if you use it in the wrong way."}]}]},{"n":51,"t":"Don't have to, needn't, and mustn't","u":"Modal Verbs","s":[{"l":"A","b":[{"t":"sub","x":"\u000eLDon't have to\u000f\u000eC and \u000f\u000eLneedn't\u000f","p":1},{"t":"rule","x":"\u000eAWe use \u000f\u000eLdon’t \u0001have to\u0002\u000f\u000eA and \u000f\u000eLneedn’t\u000f\u000eA when we say that something \u000f\u000eDis not necessary.\u000f","p":1},{"t":"eg","x":"\u000eEYou \u000f\u000eHdon’t have to\u000f\u000eE apologize. It’s not your fault.\u000f","p":1},{"t":"eg","x":"\u000eEYou\u000f\u000eH needn’t\u000f\u000eE apologize. It’s not your fault.\u000f","p":1},{"t":"eg","x":"\u000eLDon’t have to\u000f\u000eA is more usual than \u000f\u000eLneedn’t\u000f\u000eF.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"Need to"},{"t":"rule","x":"There is an ordinary verb \u0001need\u0002, which we can use in positive and negative sentences and in questions. \u0001Need to\u0002 means the same as \u0001have to\u0002. To form negatives and questions we use \u0001do\u0002."},{"t":"rule","x":"\u0001have to\u0002"},{"t":"eg","x":"\u000eEThe colours \u000f\u000eHhave to\u000f\u000eE match.\u000f","p":1},{"t":"eg","x":"\u000eEThe figure doesn’t \u000f\u000eHhave to\u000f\u000eE be exact.\u000f","p":1},{"t":"eg","x":"\u000eHDo\u000f\u000eE we \u000f\u000eHhave to\u000f\u000eE book in advance?\u000f","p":1},{"t":"sub","x":"\u000eJneed to\u000f\u000eA (ordinary verb)\u000f","p":1},{"t":"eg","x":"\u000eEThe colours \u000f\u000eHneed to\u000f\u000eE match.\u000f","p":1},{"t":"eg","x":"\u000eEThe figure doesn’t \u000f\u000eHneed to\u000f\u000eE be exact.\u000f","p":1},{"t":"rule","x":"\u000eEDo we \u000f\u000eHneed to\u000f\u000eE book in advance?\u000f","p":1},{"t":"sub","x":"\u000eJneedn’t\u000f\u000eA (modal verb)\u000f","p":1},{"t":"eg","x":"\u000eEThe figure \u000f\u000eHneedn’t\u000f\u000eE be exact.\u000f","p":1},{"t":"eg","x":"\u000eCBUT NOT \u000f\u000eEThe colours need match.\u000f","p":1},{"t":"rule","x":"\u000eAThe modal verb \u000f\u000eLneedn’t\u000f\u000eA is normally used only in the negative.\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"\u000eLDidn't need to do\u000f\u000eC and \u000f\u000eLneedn't have done\u000f","p":1},{"t":"rule","x":"\u000eAWe use \u000f\u000eLdidn’t need to\u000f\u000eA for an action that didn’t happen because it wasn’t necessary.\u000f","p":1},{"t":"eg","x":"\u000eEIt was a lovely day. I \u000f\u000eHdidn’t need to\u000f\u000eE take my umbrella, so I left it at home.\u000f","p":1},{"t":"rule","x":"If something happened which we now see was unnecessary, we can use either form."},{"t":"eg","x":"\u000eEI \u000f\u000eHneedn’t have brought\u000f\u000eE / \u000f\u000eHdidn’t need to bring\u000f\u000eE this umbrella with me, but I didn’t realize it would be such a lovely day.\u000f","p":1}]},{"l":"D","b":[{"t":"sub","x":"Mustn't"},{"t":"rule","x":"\u000eAWe use \u000f\u000eFmustn’t\u000f\u000eA to tell someone not to do something or to avoid something.\u000f","p":1},{"t":"eg","x":"\u000eEYou \u000f\u000eHmustn’t\u000f\u000eE forget your keys.\u000f","p":1},{"t":"eg","x":"\u000eEWe \u000f\u000eHmustn’t\u000f\u000eE lose this game.\u000f","p":1},{"t":"eg","x":"\u000eFMustn’t\u000f\u000eA or \u000f\u000eFmay not\u000f\u000eA be used to forbid something.\u000f","p":1},{"t":"eg","x":"\u000eEStudents \u000f\u000eHmust not / may not\u000f\u000eE use dictionaries in the exam.\u000f","p":1},{"t":"tip","x":"Mustn’t has a different meaning from don’t \u0001have to\u0002 / needn’t. Use mustn’t for a necessity not to do something. Use don’t \u0001have to\u0002 or needn’t when there is no necessity. I mustn’t run. I’ve got a weak heart. I don’t \u0001have to\u0002 / I needn’t run. I’ve got plenty of time."}]}]},{"n":52,"t":"Should, ought to, had better, and be supposed to","u":"Modal Verbs","s":[{"l":"","b":[{"t":"eg","x":"A."},{"t":"rule","x":"\u000eAWe use \u000f\u000eLshould\u000f\u000eA and \u000f\u000eLought to\u000f\u000eA when we say what is the right thing or the best thing to do.\u000f","p":1},{"t":"eg","x":"\u000eEWe \u000f\u000eHshould\u000f\u000eE recycle / We \u000f\u000eHought to\u000f\u000eE recycle as much as possible.\u000f","p":1},{"t":"rule","x":"\u000eEYou \u000f\u000eHshould\u000f\u000eE see / You\u000f\u000eH ought to\u000f\u000eE see the film. You’ll love it.\u000f","p":1},{"t":"rule","x":"\u000eAIn negatives and questions we normally use \u000f\u000eLshould\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEPeople \u000f\u000eFshouldn’t\u000f\u000eE leave litter everywhere.\u000f","p":1},{"t":"eg","x":"\u000eEWho \u000f\u000eFshould\u000f\u000eE we invite to the wedding?\u000f","p":1},{"t":"rule","x":"\u000eAWe can use the continuous or perfect after \u000f\u000eLshould\u000f\u000eA and \u000f\u000eLought to\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHshould be doing\u000f\u000eE some work now.\u000f","p":1},{"t":"eg","x":"\u000eEYou \u000f\u000eHought to have said\u000f\u000eE thank you.\u000f","p":1},{"t":"eg","x":"B."},{"t":"rule","x":"\u000eAWe can also use \u000f\u000eLshould\u000f\u000eA to say that something is \u000f\u000eDprobable\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEThey \u000f\u000eHshould\u000f\u000eE have my letter by now.\u000f","p":1},{"t":"eg","x":"\u000eEThere’s only a short queue, so we \u000f\u000eHshouldn’t\u000f\u000eE have to wait long.\u000f","p":1},{"t":"eg","x":"\u000eLShould\u000f\u000eA implies \u000f\u000eDif all goes well\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEThere are no reports of delays, so the train \u000f\u000eHshould\u000f\u000eE be on time.\u000f","p":1},{"t":"rule","x":"We do not use it for things going wrong."},{"t":"eg","x":"\u000eEThe train \u000f\u000eHwill probably\u000f\u000eE be late.\u000f","p":1}]},{"l":"C","b":[{"t":"eg","x":"\u000eLHad better\u000f\u000eA says what is the best thing to do in a particular situation.\u000f","p":1},{"t":"eg","x":"\u000eEI think James \u000f\u000eHhad better\u000f\u000eE see a doctor.\u000f","p":1},{"t":"eg","x":"\u000eEI’\u000f\u000eHd better\u000f\u000eE tidy up this mess, hadn’t I?\u000f","p":1},{"t":"rule","x":"\u000eLHad better\u000f\u000eA is stronger than \u000f\u000eLshould\u000f\u000eA or \u000f\u000eLought to\u000f\u000eA. \u000f\u000eEI’d better tidy up\u000f\u000eA means that I am going to tidy up because it is the best way to deal with the problem.\u000f","p":1},{"t":"rule","x":"\u000eAThe negative is \u000f\u000eLhad better not\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eECome on. We’\u000f\u000eHd better not\u000f\u000eE be late.\u000f","p":1},{"t":"eg","x":"\u000eEThe lorry \u000f\u000eHhad better not\u000f\u000eE park across the entrance.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"\u000eAWe use \u000f\u000eLbe supposed to\u000f\u000eA for what should happen because it is the rule or the normal way of doing things.\u000f","p":1},{"t":"eg","x":"\u000eEYou’\u000f\u000eHre supposed to\u000f\u000eE wait in the queue.\u000f","p":1},{"t":"rule","x":"In the negative it means something isn’t allowed."},{"t":"eg","x":"\u000eEWe’\u000f\u000eHre not supposed to\u000f\u000eE keep pets here\u000f\u000eD.\u000f","p":1},{"t":"eg","x":"\u000eLBe supposed to\u000f\u000eA can mean that something is arranged or intended.\u000f","p":1},{"t":"eg","x":"\u000eEI’\u000f\u000eHm supposed to be\u000f\u000eE on holiday, but I keep getting calls from the office.\u000f","p":1},{"t":"eg","x":"\u000eEHow \u000f\u000eHis\u000f\u000eE this device \u000f\u000eHsupposed to\u000f\u000eE work?\u000f","p":1},{"t":"tip","x":"To talk about what people in general say or believe, we can use \u0001be supposed to\u0002. Too much sugar is supposed to be bad for you means that people say too much sugar is bad for you."}]}]},{"n":53,"t":"Can, could, may, and be allowed to","u":"Modal Verbs","s":[{"l":"A","b":[{"t":"sub","x":"Asking permission"},{"t":"rule","x":"\u000eAWe use \u000f\u000eLcan\u000f\u000eA, \u000f\u000eLcould\u000f\u000eA, or \u000f\u000eLmay\u000f\u000eA to ask permission.\u000f","p":1},{"t":"eg","x":"\u000eHCan\u000f\u000eE I take your umbrella?\u000f","p":1},{"t":"eg","x":"\u000eHCould\u000f\u000eE I use this calculator, please?\u000f","p":1},{"t":"eg","x":"\u000eHMay\u000f\u000eE we come in?\u000f\u000eB –\u000f\u000eE Yes, of course.\u000f","p":1},{"t":"rule","x":"\u000eLCould\u000f\u000eA is less direct than \u000f\u000eLcan\u000f\u000eA and often more polite.\u000f\u000eL \u0001May\u0002\u000f\u000eA is rather formal.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"Giving/refusing permission"},{"t":"rule","x":"\u000eAWe use \u000f\u000eLcan\u000f\u000eA or \u000f\u000eLmay\u000f\u000eA to give permission.\u000f","p":1},{"t":"rule","x":"\u000eEYou \u000f\u000eHcan\u000f\u000eE use my mobile if you like.\u000f","p":1},{"t":"eg","x":"\u000eEMay I see the letter?\u000f\u000eB –\u000f\u000eE Of course you \u000f\u000eHmay\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eLMay\u000f\u000eA is more formal.\u000f","p":1},{"t":"rule","x":"\u000eAWe use \u000f\u000eLcannot/can’t\u000f\u000eA to refuse permission.\u000f","p":1},{"t":"rule","x":"\u000eEYou \u000f\u000eHcan’t\u000f\u000eE have Saturday off. I’m sorry.\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"Talking about permission"},{"t":"rule","x":"\u000eATo talk about permission when\u000f\u000eD we are not giving it or asking for it\u000f\u000eA, we can use \u000f\u000eLcan\u000f\u000eA referring to the present or future and \u000f\u000eLcould\u000f\u000eA referring to the past.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHcan\u000f\u000eE stay up as late as I like.\u000f","p":1},{"t":"eg","x":"\u000eEAt one time you \u000f\u000eHcould\u000f\u000eE park here.\u000f","p":1},{"t":"rule","x":"\u000eAWe do not usually use \u000f\u000eLmay\u000f\u000eA here.\u000f","p":1},{"t":"rule","x":"\u000eAWe \u0001can\u0002 also use \u000f\u000eLbe allowed \u0001to\u0002\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI’\u000f\u000eHm allowed to\u000f\u000eE stay up as late as I like.\u000f","p":1},{"t":"eg","x":"\u000eHWas\u000f\u000eE Tina \u000f\u000eHallowed to\u000f\u000eE leave work early?\u000f","p":1},{"t":"sub","x":"Compare these two sentences:"},{"t":"eg","x":"\u000eHMay\u000f\u000eE we leave early please?\u000f","note":"Will you allow it?","p":1},{"t":"eg","x":"\u000eHAre\u000f\u000eE we \u000f\u000eHallowed to\u000f\u000eE leave early?\u000f","note":"What is the rule?","p":1},{"t":"rule","x":"\u000eAWe also use \u000f\u000eLbe allowed to\u000f\u000eA where \u000f\u000eLcan\u000f\u000eA and \u000f\u000eLmay\u000f\u000eA are not possible: with \u000f\u000eLwill\u000f\u000eA, in the perfect or continuous, and in the to-infinitive and ing-form.\u000f","p":1},{"t":"eg","x":"\u000eEYou \u000f\u000eHwon’t be allowed to\u000f\u000eE take photos in the museum.\u000f","p":1},{"t":"eg","x":"\u000eEThe media \u000f\u000eHhave not been allowed to\u000f\u000eE report what’s been going on.\u000f","p":1},{"t":"eg","x":"\u000eENo one\u000f\u000eH is being allowed to\u000f\u000eE occupy any of the buildings.\u000f","p":1},{"t":"eg","x":"\u000eEI expected \u000f\u000eHto be allowed to\u000f\u000eE sit down.\u000f","p":1},{"t":"eg","x":"\u000eEIt’s great \u000f\u000eHbeing allowed to\u000f\u000eE miss lessons.\u000f","p":1},{"t":"rule","x":"\u000eAFor general permission in the past, we use \u000f\u000eLcould\u000f\u000eA \u0001or\u0002 \u000f\u000eLwas/were allowed \u0001to\u0002\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEYears ago you \u000f\u000eHcould\u000f\u000eE feed / you \u000f\u000eHwere allowed to\u000f\u000eE feed the animals.\u000f","p":1},{"t":"rule","x":"\u000eABut for a specific action with permission, we use \u000f\u000eLwas/were allowed \u0001to\u0002\u000f\u000eF.\u000f","p":1},{"t":"eg","x":"\u000eEThe four children \u000f\u000eHwere allowed to\u000f\u000eE feed the animals.\u000f","p":1},{"t":"tip","x":"\u000eAYou can answer a request for permission with \u000f\u000eD(\u000f\u000eEYes,) of course\u000f\u000eD.\u000f\u000eA To refuse, you should give a reason, e.g. \u000f\u000eESorry, I’m using it.\u000f","p":1}]}]},{"n":54,"t":"Will, must, and can't expressing certainty","u":"Modal Verbs","s":[{"l":"A","b":[{"t":"rule","x":"\u000eAWe can use \u000f\u000eLwill\u000f\u000eA for an assumption.\u000f","p":1},{"t":"eg","x":"\u000eEDon’t ring Luke now. He\u000f\u000eH’ll\u000f\u000eE be at work.\u000f","p":1},{"t":"eg","x":"\u000eEThere’s someone at the door. ~ It\u000f\u000eH’ll\u000f\u000eE be the postman.\u000f","p":1},{"t":"rule","x":"\u000eAThe speaker assumes that the postman is at the door because this is his normal time. \u000f\u000eEIt’ll be the postman\u000f\u000eA is a kind of prediction about the present.\u000f","p":1}]},{"l":"B","b":[{"t":"eg","x":"\u000eLMust\u000f\u000eA can express certainty.\u000f","p":1},{"t":"rule","x":"\u000eEYou saw the film last week, so you \u000f\u000eHmust\u000f\u000eE know what it’s about.\u000f","p":1},{"t":"eg","x":"\u000eEJane got up at four, so she \u000f\u000eHmust\u000f\u000eE be tired.\u000f","p":1},{"t":"rule","x":"The speaker sees it as necessarily and logically true that Jane is tired."},{"t":"rule","x":"\u000eAWe use \u000f\u000eLcan’t\u000f\u000eA for something impossible.\u000f","p":1},{"t":"eg","x":"\u000eEThis \u000f\u000eHcan’t\u000f\u000eE be Christopher’s textbook. He doesn’t do physics.\u000f","p":1},{"t":"eg","x":"\u000eAAmericans use \u000f\u000eLmust not\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEThis \u000f\u000eHmust not\u000f\u000eE be Christopher’s textbook.\u000f","p":1},{"t":"rule","x":"\u000eAWe use \u000f\u000eLcan\u000f\u000eA in questions about what is possible.\u000f","p":1},{"t":"eg","x":"\u000eEWho \u000f\u000eHcan\u000f\u000eE that be at the door?\u000f","p":1},{"t":"eg","x":"\u000eHCan\u000f\u000eE it really be true?\u000f","p":1},{"t":"eg","x":"\u000eLMust\u000f\u000eA and \u000f\u000eLcan’t\u000f\u000eA are opposites.\u000f","p":1},{"t":"eg","x":"\u000eEThe bill \u000f\u000eHcan’t\u000f\u000eE be so much. There \u000f\u000eHmust\u000f\u000eE be a mistake.\u000f","note":"There is certainly a mistake.","p":1}]},{"l":"C","b":[{"t":"rule","x":"\u000eAAfter \u000f\u000eLwill\u000f\u000eF, \u000f\u000eLmust\u000f\u000eA, and \u000f\u000eJcan’t\u000f\u000eA expressing certainty, we can use the continuous.\u000f","p":1},{"t":"eg","x":"\u000eEWhere’s Carl? ~ He\u000f\u000eH’ll be sitting\u000f\u000eE in a café somewhere, I expect.\u000f","p":1},{"t":"eg","x":"\u000eEThe bus is late. It \u000f\u000eHmust be coming\u000f\u000eE soon.\u000f","p":1},{"t":"rule","x":"\u000eACompare \u000f\u000eFmust do\u000f\u000eA and \u000f\u000eFmust be doing\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"\u000eEYou’ve got exams soon. You \u000f\u000eHmust work.\u000f","p":1},{"t":"rule","x":"(I’m telling you to work.)"},{"t":"eg","x":"\u000eESam isn’t at home. He \u000f\u000eHmust be working.\u000f","note":"So I’m sure he’s working.","p":1},{"t":"rule","x":"\u000eAWe can also use the perfect with \u000f\u000eLwill\u000f\u000eF, \u000f\u000eLmust\u000f\u000eA, and \u000f\u000eLcan’t\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eESomeone \u000f\u000eHmust have set\u000f\u000eE off the alarm.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHcan’t have made\u000f\u000eE a mistake.\u000f","p":1},{"t":"rule","x":"We can use the passive with the perfect."},{"t":"eg","x":"\u000eEThe best seats \u000f\u000eHwill have been sold\u000f\u000eE now.\u000f","p":1},{"t":"eg","x":"\u000eEThe bike \u000f\u000eHmust have been stolen\u000f\u000eE while we were having our lunch.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"--"},{"t":"rule","x":"\u000eAWe can use \u000f\u000eLhad to\u000f\u000eA and \u000f\u000eLcouldn’t\u000f\u000eA when something was certain in the past.\u000f","p":1},{"t":"eg","x":"\u000eEThe fingerprints were his, so he \u000f\u000eHhad to be\u000f\u000eE the murderer.\u000f","p":1},{"t":"eg","x":"\u000eEIt \u000f\u000eHcouldn’t be\u000f\u000eE anyone else.\u000f","p":1},{"t":"tip","x":"As well as \u0001must\u0002, we can sometimes use \u0001have (got) to\u0002 for logical certainty, e.g. You’ve got to be joking! to convey disbelief. But in general it is safer to use \u0001must\u0002 for certainty."}]}]},{"n":55,"t":"May, might, can, and could","u":"Modal Verbs","s":[{"l":"A","b":[{"t":"rule","x":"\u000eAWe use \u000f\u000eLmay\u000f\u000eA and \u000f\u000eLmight\u000f\u000eA for possibility.\u000f","p":1},{"t":"eg","x":"\u000eEThis old picture \u000f\u000eHmay/might\u000f\u000eE be valuable.\u000f","p":1},{"t":"eg","x":"\u000eEThe shop \u000f\u000eHmay not/might not\u000f\u000eE be open.\u000f","p":1},{"t":"rule","x":"This includes their use for an uncertain prediction or intention."},{"t":"eg","x":"\u000eEIt \u000f\u000eHmay/might\u000f\u000eE rain tomorrow.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHmay/might\u000f\u000eE go away next weekend.\u000f","p":1},{"t":"rule","x":"\u000eAWe often avoid \u000f\u000eLmay/might\u000f\u000eA in questions.\u000f","p":1},{"t":"eg","x":"\u000eHDo you think\u000f\u000eE it’\u000f\u000eHll\u000f\u000eE rain tomorrow?\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eAWe can use a statement with \u000f\u000eLcould\u000f\u000eA or \u000f\u000eLmight\u000f\u000eA to make a suggestion or to express criticism that something is not done.\u000f","p":1},{"t":"eg","x":"\u000eEYou \u000f\u000eHcould/might\u000f\u000eE listen when I’m talking.\u000f","p":1},{"t":"sub","x":"\u000eEYou \u000f\u000eHcould/might have helped\u000f\u000eE us\u000f\u000eD.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"\u000eAWe use \u000f\u000eLcould\u000f\u000eA for possibility or for an uncertain prediction.\u000f","p":1},{"t":"eg","x":"\u000eEThis old picture \u000f\u000eHcould\u000f\u000eE be valuable.\u000f","p":1},{"t":"eg","x":"\u000eEThe asteroid \u000f\u000eHcould\u000f\u000eE hit the earth.\u000f","p":1},{"t":"rule","x":"\u000eAWe \u0001can\u0002 also use \u000f\u000eLmay\u000f\u000eA or \u000f\u000eLmight\u000f\u000eA here but not \u000f\u000eLcan\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"\u000eAWe also use \u000f\u000eLcould\u000f\u000eA to suggest possible future actions.\u000f","p":1},{"t":"eg","x":"\u000eEWe \
