        ? '<button class="btn ghost sm" id="ed-reset">Restore original</button>' : ''}
    </div>
  </div>`;
}

function wireEditor(n, idx){
  const ta = document.getElementById('edit-area');
  if (!ta) return;
  document.getElementById('ed-save').onclick = () => {
    saveEdit(n, idx, ta.value);
    editing = null;
    drawTopic(); drawTree();
    toast('Section saved');
  };
  document.getElementById('ed-cancel').onclick = () => { editing = null; drawTopic(); };
  const r = document.getElementById('ed-reset');
  if (r) r.onclick = () => {
    if (!confirm('Discard your changes to this section and restore the original text?')) return;
    resetEdit(n, idx);
    editing = null;
    drawTopic(); drawTree();
    toast('Original restored');
  };
  ta.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter'){ e.preventDefault(); document.getElementById('ed-save').click(); }
    if (e.key === 'Escape'){ editing = null; drawTopic(); }
  });
}

/* ==================== concept-driven question generation ====================
   Every generated question targets the word a section is actually teaching:
   the term its rules highlight, and the word its examples put in bold.
   ========================================================================== */

// fallback families, used only to top up distractors
const CLOZE = [
  ['article', ['a', 'an', 'the']],
  ['preposition', ['at', 'on', 'in', 'by', 'for', 'since', 'to', 'with', 'from',
                   'during', 'until', 'about', 'of', 'into', 'over', 'under',
                   'between', 'among', 'across', 'through', 'along']],
  ['modal verb', ['can', 'could', 'may', 'might', 'must', 'should', 'will', 'would', 'shall']],
  ['quantifier', ['much', 'many', 'few', 'little', 'some', 'any', 'all', 'both',
                  'either', 'neither', 'every', 'each', 'enough', 'several', 'most',
                  'another', 'other', 'others', 'none']],
  ['linking word', ['and', 'but', 'so', 'or', 'because', 'although', 'if', 'unless',
                    'when', 'while', 'until', 'since', 'though', 'whereas']],
  ['relative or question word', ['who', 'whom', 'which', 'that', 'whose', 'where',
                                 'when', 'what', 'why', 'how']],
  ['pronoun', ['I', 'me', 'he', 'him', 'she', 'her', 'it', 'we', 'us', 'they', 'them',
               'myself', 'himself', 'herself', 'itself', 'ourselves', 'themselves',
               'mine', 'his', 'hers', 'ours', 'theirs', 'one', 'ones', 'another',
               'someone', 'anyone', 'everyone', 'nobody', 'something', 'anything',
               'everything', 'nothing', 'somewhere', 'anywhere', 'everywhere', 'nowhere']],
  ['auxiliary verb', ['is', 'are', 'was', 'were', 'has', 'have', 'had', 'do', 'does',
                      'did', 'been', 'being', 'am']]
];

const SECS = [];      // one entry per section that can be drilled

function markedTerms(x){
  const out = [];
  String(x).replace(/\u0001([^\u0001\u0002]*)\u0002/g, (m, t) => { out.push(t.trim()); return m; });
  return out;
}

// the word an example puts in bold - what the example exists to show
function egKey(x){
  let m = /\u0004([^\u0004\u0005]*)\u0005/.exec(x);
  if (m) return m[1].trim();
  const re = /\u000e(.)([^\u000e\u000f]*)\u000f/g;
  let r, best = '';
  while ((r = re.exec(x)) !== null){
    const st = STYLES[r[1].charCodeAt(0) - 65];
    if (st && st[1] && r[2].trim().length > best.length) best = r[2].trim();
  }
  return best;
}

const CLEAN_KEY = /^[A-Za-z][A-Za-z'\u2019-]*(?: [A-Za-z][A-Za-z'\u2019-]*)?$/;
const JUNK_TERM = /^(etc|eg|e\.g|ie|i\.e|not|but|and|or|compare|note|but not)$/i;

function goodTerm(w){
  if (!w || w.length > 18 || !CLEAN_KEY.test(w)) return false;
  if (JUNK_TERM.test(w.replace(/\.$/, ''))) return false;
  if (w === w.toUpperCase() && w.length > 2) return false;   // "BUT NOT"
  return true;
}

function buildSections(){
  SECS.length = 0;
  TOPICS.forEach(t => effSecs(t.n).forEach(sec => {
    const terms = [], egs = [], pairs = [], rules = [];
    let cur = '', prevEg = null;
    sec.b.forEach(b => {
      if (b.t === 'table') return;
      const plain = stripMarks(b.x).trim();
      if (b.t === 'rule' || b.t === 'tip' || b.t === 'sub'){
        const own = markedTerms(b.x).filter(goodTerm);
        own.forEach(w => { if (terms.indexOf(w) < 0) terms.push(w); });
        if (b.t === 'rule' && plain.length > 25 && plain.length < 165){
          cur = plain;
          rules.push({ x: plain, terms: own });
        }
        prevEg = null;
      } else if (b.t === 'eg'){
        const key = egKey(b.x);
        // a slash alternative or a trailing gloss makes a confusing gap-fill
        const usable = plain.replace(/\s*\([^()]*\)\s*$/, '').trim();
        if (usable.length > 12 && usable.length < 130
            && !/[\u2026]|\.\.\.|\s\/\s|\//.test(usable))
          egs.push({ x: usable, k: goodTerm(key) ? key : '', r: cur });
        prevEg = plain;
      } else if (b.t === 'wrong'){
        const bad = plain;
        const clean = s => s && s.length > 8 && s.length < 130
          && !/^\.\.\.|\u2026|\bAnd NOT\b/.test(s);
        if (prevEg && clean(prevEg) && clean(bad))
          pairs.push({ ok: prevEg, bad, r: cur });
        prevEg = null;
      }
    });
    egs.forEach(e => { if (e.k && terms.indexOf(e.k) < 0) terms.push(e.k); });
    if (egs.length || pairs.length)
      SECS.push({ n: t.n, l: sec.l, rule: rules.length ? rules[0].x : '', rules, terms, egs, pairs });
  }));
}

function familyFor(word){
  const w = String(word).toLowerCase();
  for (const [label, set] of CLOZE) if (set.indexOf(w) >= 0) return { label, set };
  return null;
}

// distractors: siblings the section itself contrasts, then its topic, then the family
function distractors(answer, sec, want, avoid){
  const seen = { [answer.toLowerCase()]: 1 };
  const out = [];
  const take = list => list.forEach(w => {
    w = String(w).trim();
    const k = w.toLowerCase();
    if (!w || seen[k] || out.length >= want) return;
    if (avoid && new RegExp('(^|\\s)' + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
        + '($|[\\s.,;:!?])', 'i').test(avoid)) return;
    if (w.split(/\s+/).length > 2 || !goodTerm(w)) return;
    const a = answer.toLowerCase();
    if (k.indexOf(a) >= 0 || a.indexOf(k) >= 0) return;
    seen[k] = 1; out.push(w);
  });
  take(sec.terms);
  if (out.length < want){
    const sibs = [];
    SECS.forEach(s => { if (s.n === sec.n && s !== sec) sibs.push.apply(sibs, s.terms); });
    take(sibs);
  }
  const fam = familyFor(answer);
  if (out.length < want && fam) take(shuffle(fam.set));
  // without a closed family, unrelated words make poor distractors - give up instead
  if (out.length < want && fam){
    const unit = T[sec.n].u, sibs = [];
    SECS.forEach(s => { if (T[s.n].u === unit && s.n !== sec.n) sibs.push.apply(sibs, s.terms); });
    take(shuffle(sibs));
  }
  return out;
}

function blankOut(sentence, word){
  const esc_ = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp('(^|\\s)(' + esc_ + ')(?=$|[\\s.,;:!?\u2019\'"])', 'i');
  if (!re.test(sentence)) return null;
  return sentence.replace(re, '$1\u2003_____\u2003').replace(/\s+/g, ' ').trim();
}

function why(sec, extra){
  const bits = [];
  if (sec.rule) bits.push(esc(sec.rule));
  if (extra) bits.push(extra);
  return bits.join(' ');
}

/* ---- 1. blank the word the example is demonstrating ---- */
function makeKeyCloze(pool){
  for (let i = 0; i < 70; i++){
    const sec = pick(pool);
    const usable = sec.egs.filter(e => e.k);
    if (!usable.length) continue;
    const e = pick(usable);
    const gap = blankOut(e.x, e.k);
    if (!gap) continue;
    const opts = distractors(e.k, sec, 3, gap);
    if (opts.length < 3) continue;
    const all = shuffle([e.k].concat(opts));
    return {
      id: 'g' + (S.gen++), n: sec.n, k: 'gen',
      q: 'Complete the sentence: <i>' + esc(gap) + '</i>',
      o: all, a: all.indexOf(e.k),
      e: why({ rule: e.r || sec.rule }, 'The sentence is: \u201c' + esc(e.x) + '\u201d')
    };
  }
  return null;
}

/* ---- 2. blank the highlighted term inside a rule ---- */
function makeRuleGap(pool){
  for (let i = 0; i < 70; i++){
    const sec = pick(pool);
    const withTerms = sec.rules.filter(r => r.terms.length);
    if (!withTerms.length) continue;
    const rl = pick(withTerms);
    const cands = rl.terms.filter(w => blankOut(rl.x, w));
    if (!cands.length) continue;
    const answer = pick(cands);
    const gap = blankOut(rl.x, answer);
    const opts = distractors(answer, sec, 3, gap);
    if (opts.length < 3) continue;
    const all = shuffle([answer].concat(opts));
    const match = sec.egs.filter(e => e.r === rl.x);
    const eg = (match.length ? pick(match) : (sec.egs.length ? pick(sec.egs) : null));
    return {
      id: 'g' + (S.gen++), n: sec.n, k: 'gen',
      q: 'Complete the rule: <i>' + esc(gap) + '</i>',
      o: all, a: all.indexOf(answer),
      e: why({ rule: '' }, eg ? 'For example: \u201c' + esc(eg.x) + '\u201d' : '')
         || 'From topic ' + sec.n + ', ' + esc(T[sec.n].t) + '.'
    };
  }
  return null;
}

/* ---- 3. the book's own right / wrong contrast ---- */
function makeContrast(pool){
  for (let i = 0; i < 70; i++){
    const sec = pick(pool);
    if (!sec.pairs.length) continue;
    const p = pick(sec.pairs);
    if (p.ok.toLowerCase() === p.bad.toLowerCase()) continue;
    const all = shuffle([p.ok, p.bad]);
    return {
      id: 'g' + (S.gen++), n: sec.n, k: 'gen',
      q: 'Which sentence is correct?',
      o: all, a: all.indexOf(p.ok),
      e: why({ rule: p.r || sec.rule }, 'The other version is not correct English.')
    };
  }
  return null;
}

/* ---- 4. which example shows this rule ---- */
function makeMatchExample(pool){
  for (let i = 0; i < 60; i++){
    const sec = pick(pool);
    const withRule = sec.egs.filter(e => e.r);
    if (!withRule.length) continue;
    const chosen = pick(withRule);
    const right = chosen.x;
    const others = [];
    const unit = T[sec.n].u;
    shuffle(SECS).forEach(s => {
      if (others.length >= 3 || s === sec || !s.egs.length) return;
      if (T[s.n].u !== unit) return;
      const cand = pick(s.egs).x;
      if (cand !== right && others.indexOf(cand) < 0) others.push(cand);
    });
    if (others.length < 3) continue;
    const all = shuffle([right].concat(others));
    return {
      id: 'g' + (S.gen++), n: sec.n, k: 'gen',
      q: 'Which sentence shows this rule?<br><i>' + esc(chosen.r) + '</i>',
      o: all, a: all.indexOf(right),
      e: 'From topic ' + sec.n + ', ' + esc(T[sec.n].t) + '.'
    };
  }
  return null;
}

function generate(n, allowedTopics){
  const pool = SECS.filter(s => !allowedTopics || allowedTopics[s.n]);
  if (!pool.length) return [];
  const withKey = pool.filter(s => s.egs.some(e => e.k));
  const withRule = pool.filter(s => s.rules.some(r => r.terms.length));
  const withPair = pool.filter(s => s.pairs.length);
  const withBoth = pool.filter(s => s.egs.some(e => e.r));
  const plan = [];
  if (withKey.length)  plan.push([0.40, makeKeyCloze, withKey]);
  if (withRule.length) plan.push([0.25, makeRuleGap, withRule]);
  if (withPair.length) plan.push([0.20, makeContrast, withPair]);
  if (withBoth.length) plan.push([0.15, makeMatchExample, withBoth]);
  if (!plan.length) return [];

  const out = [], seen = {};
  let guard = 0;
  while (out.length < n && guard++ < n * 30){
    let r = Math.random(), chosen = plan[plan.length - 1];
    for (const p of plan){ if (r < p[0]){ chosen = p; break; } r -= p[0]; }
    const q = chosen[1](chosen[2]);
    if (!q || seen[q.q]) continue;
    seen[q.q] = 1;
    out.push(q);
  }
  return out;
}

/* ============================ GitHub sync ============================
   Progress and section edits are mirrored to a JSON file in a (private)
   GitHub repository through the contents API. The token is kept only in
   this browser's storage and is never included in backups or the synced
   file. Merging is field-by-field, so two devices don't overwrite each other.
   ===================================================================== */

const SYNC_KEY = 'pocketgrammar.sync';

function b64enc(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000)
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64dec(b64){
  const bin = atob(String(b64).replace(/\s/g, ''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

// key-order-independent serialisation, for "did anything change?" checks
function stable(v){
  if (v === null || typeof v !== 'object') return JSON.stringify(v);
  if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
  return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
}

// the part of S that is worth syncing (device preferences stay local)
function syncPayload(s){
  return { q: s.q || {}, days: s.days || {}, read: s.read || {},
           edits: s.edits || {}, editsAt: s.editsAt || {}, gen: s.gen || 0 };
}

// merge two copies without losing work done on either device
function mergeState(a, b){
  const out = { q: {}, days: {}, read: {}, edits: {}, editsAt: {}, gen: 0 };
  const tries = r => (r.c || 0) + (r.w || 0);

  const qa = a.q || {}, qb = b.q || {};
  Object.keys(qa).concat(Object.keys(qb)).forEach(id => {
    const x = qa[id], y = qb[id];
    if (!x) { out.q[id] = y; return; }
    if (!y) { out.q[id] = x; return; }
    // more history wins; on a tie, the one reviewed more recently
    out.q[id] = tries(x) > tries(y) ? x
              : tries(y) > tries(x) ? y
              : ((x.d || 0) >= (y.d || 0) ? x : y);
  });

  const da = a.days || {}, db = b.days || {};
  Object.keys(da).concat(Object.keys(db)).forEach(d => {
    const x = da[d], y = db[d];
    out.days[d] = !x ? y : !y ? x : { a: Math.max(x.a, y.a), c: Math.max(x.c, y.c) };
  });

  Object.assign(out.read, b.read || {}, a.read || {});

  const ea = a.edits || {}, eb = b.edits || {};
  const ta = a.editsAt || {}, tb = b.editsAt || {};
  const keys = {};
  [ea, eb, ta, tb].forEach(o => Object.keys(o).forEach(k => { keys[k] = 1; }));
  Object.keys(keys).forEach(k => {
    const t1 = ta[k] || 0, t2 = tb[k] || 0;
    let src;
    if (t1 > t2) src = ea;                       // newer change wins, including a restore
    else if (t2 > t1) src = eb;
    else src = ea[k] ? ea : eb;                  // no timestamps: keep whichever has it
    if (src[k]) out.edits[k] = src[k];
    if (t1 || t2) out.editsAt[k] = Math.max(t1, t2);
  });

  out.gen = Math.max(a.gen || 0, b.gen || 0);
  return out;
}

const Sync = {
  cfg: null, sha: null, timer: null, busy: false, again: false,
  state: 'off', note: '', last: 0,

  load(){
    try{ this.cfg = JSON.parse(localStorage.getItem(SYNC_KEY) || 'null'); }
    catch(e){ this.cfg = null; }
  },
  store(cfg){
    this.cfg = cfg;
    try{
      if (cfg) localStorage.setItem(SYNC_KEY, JSON.stringify(cfg));
      else localStorage.removeItem(SYNC_KEY);
    }catch(e){}
  },
  on(){ return !!(this.cfg && this.cfg.token && this.cfg.owner && this.cfg.repo); },

  api(rest){
    const c = this.cfg;
    return 'https://api.github.com/repos/' + encodeURIComponent(c.owner) + '/'
         + encodeURIComponent(c.repo) + (rest || '');
  },
  fileUrl(){
    return this.api('/contents/' + this.cfg.path.split('/').map(encodeURIComponent).join('/'));
  },
  headers(extra){
    return Object.assign({
      'Authorization': 'Bearer ' + this.cfg.token,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    }, extra || {});
  },

  setStatus(state, note){
    this.state = state; this.note = note || '';
    const el = document.getElementById('savenote');
    if (!el) return;
    const t = new Date(this.last || Date.now());
    const hm = t.getHours() + ':' + String(t.getMinutes()).padStart(2, '0');
    el.textContent =
      state === 'syncing' ? '180 topics \u00b7 syncing\u2026' :
      state === 'ok'      ? '180 topics \u00b7 synced ' + hm :
      state === 'offline' ? '180 topics \u00b7 offline \u2014 will sync later' :
      state === 'error'   ? '180 topics \u00b7 sync problem \u2014 see Progress' :
                            el.textContent;
    const p = document.getElementById('sync-status');
    if (p) p.textContent = this.describe();
  },
  describe(){
    if (!this.on()) return 'Not connected.';
    const where = this.cfg.owner + '/' + this.cfg.repo;
    if (this.state === 'error') return 'Connected to ' + where + ' \u2014 ' + this.note;
    if (this.state === 'offline') return 'Connected to ' + where + ' \u2014 offline, changes will sync when you\u2019re back online.';
    if (this.state === 'syncing') return 'Connected to ' + where + ' \u2014 syncing\u2026';
    if (!this.last) return 'Connected to ' + where + '.';
    const t = new Date(this.last);
    return 'Connected to ' + where + ' \u2014 last synced ' + t.toLocaleString();
  },

  explain(status, body){
    if (status === 401) return 'the token was rejected \u2014 it may have expired.';
    if (status === 403) return /rate limit/i.test(body || '')
      ? 'GitHub\u2019s rate limit was hit \u2014 it will retry later.'
      : 'the token can\u2019t write to this repository. Check it has Contents: Read and write.';
    if (status === 404) return 'repository not found, or the token can\u2019t see it.';
    return 'GitHub returned an error (' + status + ').';
  },

  async pull(){
    const r = await fetch(this.fileUrl() + '?ref=' + encodeURIComponent(this.cfg.branch),
                          { headers: this.headers(), cache: 'no-store' });
    if (r.status === 404){ this.sha = null; return null; }      // no file yet
    if (!r.ok) throw { status: r.status, body: await r.text() };
    const j = await r.json();
    this.sha = j.sha;
    let text = j.encoding === 'base64' && j.content ? b64dec(j.content) : '';
    if (!text){
      const raw = await fetch(this.fileUrl() + '?ref=' + encodeURIComponent(this.cfg.branch),
        { headers: this.headers({ 'Accept': 'application/vnd.github.raw+json' }), cache: 'no-store' });
      if (!raw.ok) throw { status: raw.status, body: await raw.text() };
      text = await raw.text();
    }
    const data = JSON.parse(text);
    return data && data.state ? data.state : null;
  },

  async put(payload){
    const body = {
      message: 'Sync progress ' + new Date().toISOString().slice(0, 16).replace('T', ' '),
      content: b64enc(JSON.stringify({ app: 'pocket-grammar', v: 1, at: Date.now(), state: payload }, null, 1)),
      branch: this.cfg.branch
    };
    if (this.sha) body.sha = this.sha;
    const r = await fetch(this.fileUrl(), {
      method: 'PUT', headers: this.headers({ 'Content-Type': 'application/json' }),
      body: JSON.stringify(body)
    });
    if (r.status === 409 || r.status === 422) return 'conflict';
    if (!r.ok) throw { status: r.status, body: await r.text() };
    const j = await r.json();
    this.sha = j.content && j.content.sha;
    return 'ok';
  },

  // pull, merge into S, push the result if it differs from GitHub's copy
  async run(){
    if (!this.on()) return;
    if (this.busy){ this.again = true; return; }
    this.busy = true;
    this.setStatus('syncing');
    try{
      for (let attempt = 0; attempt < 3; attempt++){
        const remote = await this.pull();
        const local = syncPayload(S);
        const merged = remote ? mergeState(local, remote) : local;
        if (stable(merged) !== stable(local)) applyMerged(merged);
        if (remote && stable(merged) === stable(remote)) break;   // nothing to push
        const res = await this.put(merged);
        if (res === 'ok') break;
        // someone else wrote in between - go round again with fresh data
      }
      this.last = Date.now();
      this.setStatus('ok');
    }catch(e){
      if (e && e.status) this.setStatus('error', this.explain(e.status, e.body));
      else this.setStatus(navigator.onLine === false ? 'offline' : 'error',
                          'couldn\u2019t reach GitHub.');
    }finally{
      this.busy = false;
      if (this.again){ this.again = false; this.schedule(1500); }
    }
  },

  schedule(ms){
    if (!this.on()) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.run(), ms == null ? 4000 : ms);
  }
};

// bring merged data into the live app without disturbing a quiz or the editor
function applyMerged(m){
  const editsChanged = stable(m.edits) !== stable(S.edits || {});
  S.q = m.q; S.days = m.days; S.read = m.read;
  S.edits = m.edits; S.editsAt = m.editsAt;
  S.gen = Math.max(S.gen || 0, m.gen || 0);
  Store.save(S);
  if (editsChanged){ TOPICS.forEach(indexTopic); rebuildPools(); }
  if (!session && !editing) render();
}

/* ---------------- settings panel (rendered inside Progress) ---------------- */
function syncPanelHTML(){
  if (Sync.on()){
    return `<section class="panel pad stack">
      <h3 style="font-family:var(--serif);font-size:20px">Sync across devices</h3>
      <p class="lede" id="sync-status" style="margin:0">${esc(Sync.describe())}</p>
      <div class="btnrow">
        <button class="btn ghost sm" id="sync-now">Sync now</button>
        <button class="btn ghost sm" id="sync-off">Disconnect this device</button>
      </div>
      <p class="eyebrow" style="margin:0">Changes sync a few seconds after you make them,
        and again whenever you come back to the app.</p>
    </section>`;
  }
  const c = Sync.cfg || {};
  return `<section class="panel pad stack">
    <h3 style="font-family:var(--serif);font-size:20px">Sync across devices</h3>
    <p class="lede" style="margin:0">Keep progress and section edits the same on your Mac and

function wireSyncPanel(){
  const now = document.getElementById('sync-now');
  if (now) now.onclick = () => Sync.run();
  const off = document.getElementById('sync-off');
  if (off) off.onclick = () => {
    if (!confirm('Disconnect this device? Your progress stays here and on GitHub; '
               + 'this device just stops syncing and forgets the token.')) return;
    Sync.store(null); Sync.sha = null; Sync.setStatus('off');
    const n = document.getElementById('savenote');
    if (n) n.textContent = '180 topics \u00b7 progress saved automatically';
    renderProgress();
  };
  const go = document.getElementById('sync-connect');
  if (!go) return;
  go.onclick = async () => {
    const msg = document.getElementById('sync-msg');
    const owner = document.getElementById('s-owner').value.trim();
    const repo = document.getElementById('s-repo').value.trim();
    const token = document.getElementById('s-token').value.trim();
    const say = t => { msg.textContent = t; };
    if (!/^[A-Za-z0-9-]+$/.test(owner)) return say('Enter your GitHub username.');
    if (!/^[A-Za-z0-9._-]+$/.test(repo)) return say('Enter the repository name, e.g. grammar-data.');
    if (token.length < 20) return say('Paste the access token.');
    go.disabled = true; say('Checking\u2026');

    const prev = Sync.cfg;
    Sync.cfg = { owner, repo, token, branch: 'main', path: 'pocket-grammar/progress.json' };
    try{
      const r = await fetch(Sync.api(''), { headers: Sync.headers(), cache: 'no-store' });
      if (!r.ok) throw { status: r.status, body: await r.text() };
      const info = await r.json();
      Sync.cfg.branch = info.default_branch || 'main';
      if (!info.private && !confirm('\u201c' + repo + '\u201d is a PUBLIC repository \u2014 anyone could '
          + 'read your progress and edits. Use it anyway? (A private repository is recommended.)')){
        Sync.cfg = prev; go.disabled = false; return say('Cancelled \u2014 choose a private repository.');
      }
      Sync.store(Sync.cfg);
      await Sync.run();
      if (Sync.state === 'error'){
        say('Connected, but: ' + Sync.note);
      } else {
        toast('Sync is on');
      }
      renderProgress();
    }catch(e){
      Sync.cfg = prev;
      go.disabled = false;
      say(e && e.status ? 'Couldn\u2019t connect: ' + Sync.explain(e.status, e.body)
                        : 'Couldn\u2019t reach GitHub \u2014 check your connection.');
    }
  };
}

function copyBackup(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(ta);
  ta.focus(); ta.setSelectionRange(0, ta.value.length);
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  ta.remove();
  if (!ok && navigator.clipboard) navigator.clipboard.writeText(text).then(
    () => toast('Backup copied'), () => toast('Couldn\u2019t copy \u2014 try Export'));
  else toast(ok ? 'Backup copied \u2014 paste it somewhere safe' : 'Couldn\u2019t copy');
}

function toast(msg){
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2200);
}

function drawTree(){
  const tree = document.getElementById('tree');
  if (!tree) return;
  const q = query.trim().toLowerCase();

  if (q.length >= 2){
    const hits = [];
    for (const t of TOPICS){
      const i = t._low.indexOf(q);
      if (i < 0) continue;
      const start = Math.max(0, i - 45);
      const snip = (start ? '\u2026' : '') + t._txt.slice(start, i + q.length + 70) + '\u2026';
      hits.push({ t, snip, score: t.t.toLowerCase().includes(q) ? 0 : 1 });
      if (hits.length > 60) break;
    }
    hits.sort((a, b) => a.score - b.score || a.t.n - b.t.n);
    tree.innerHTML = hits.length
      ? hits.map(h => `<button class="hit" data-n="${h.t.n}">
            <b>${h.t.n}. ${hi(h.t.t, q)}</b>
            <small>${hi(h.snip, q)}</small></button>`).join('')
      : `<div class="empty"><p>Nothing matches \u201c${esc(query)}\u201d.</p></div>`;
  } else {
    tree.innerHTML = UNITS.map(u => {
      const open = openUnits.has(u);
      const nums = UNIT_TOPICS[u];
      const readN = nums.filter(n => S.read[n]).length;
      return `<div class="unit">
        <button data-unit="${esc(u)}" aria-expanded="${open}">
          <span>${esc(u)}</span><i>${readN}/${nums.length}</i>
        </button>
        ${open ? `<ul class="tlist">${nums.map(n =>
          `<li><button data-n="${n}" aria-current="${n === current}">
             <em>${n}</em><span>${esc(T[n].t)}</span></button></li>`).join('')}</ul>` : ''}
      </div>`;
    }).join('');
  }

  tree.querySelectorAll('[data-unit]').forEach(b => b.onclick = () => {
    const u = b.dataset.unit;
    openUnits.has(u) ? openUnits.delete(u) : openUnits.add(u);
    drawTree();
  });
  tree.querySelectorAll('[data-n]').forEach(b => b.onclick = () => {
    current = +b.dataset.n;
    editing = null;
    backStack = [];
    query = '';
    const inp = document.getElementById('q'); if (inp) inp.value = '';
    openUnits.add(T[current].u);
    if (window.innerWidth <= 920) document.querySelector('.sidewrap').classList.remove('open');
    drawTree(); drawTopic(); window.scrollTo(0, 0);
  });
}

function hi(text, q){
  const s = esc(text);
  if (!q) return s;
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
  return s.replace(re, '<mark>$1</mark>');
}

/* ---- cross-references: turn "\u27a484", "\u2192 177B, 178B", "165 to 168" into links ---- */
const ARROW = '\u2192\u27a4\u25b6\u2794\u25ba';
const TOK   = '\\d{1,3}[A-Z]?(?:[-\u2013][A-Z]\\b)?';
const SEP   = '\\s*(?:,\\s*|and\\s+|to\\s+|[-\u2013])\\s*';
const RE_RUN   = new RegExp('[' + ARROW + ']\\s*(' + TOK + '(?:' + SEP + TOK + ')*)', 'g');
const RE_NUM   = /(\d{1,3})([A-Z]?(?:[-\u2013][A-Z]\b)?)/g;
const RE_TOPIC = /\btopics?\s+(\d{1,3})\b/gi;
const RE_RANGE = /\b(\d{1,3})\s*(?:to|[-\u2013])\s*(\d{1,3})\b/g;
const RE_CUE   = /\b(refer|see|details|clauses|topics)\b/i;
const RE_CUE2  = /\b(refer to|see also|see|for more details|for details|more on|described in|explained in)\b/i;
const RE_BARE  = /(^|[^\w.])(\d{1,3})(?:[A-Z](?:[-\u2013][A-Z]\b)?)?(?![\w])/g;

// s must already be HTML-escaped; esc() emits no digits, so offsets stay valid
function xref(s){
  const marks = [];
  const add = (start, end, n) => {
    if (!(n >= 1 && n <= 180)) return;
    if (marks.some(m => start < m.end && end > m.start)) return;   // no overlaps
    marks.push({ start, end, n });
  };
  let m, t;
  RE_RUN.lastIndex = 0;
  while ((m = RE_RUN.exec(s)) !== null){
    const base = m.index + m[0].length - m[1].length;
    RE_NUM.lastIndex = 0;
    while ((t = RE_NUM.exec(m[1])) !== null)
      add(base + t.index, base + t.index + t[0].length, +t[1]);
  }
  RE_TOPIC.lastIndex = 0;
  while ((m = RE_TOPIC.exec(s)) !== null)
    add(m.index + m[0].length - m[1].length, m.index + m[0].length, +m[1]);
  if (RE_CUE2.test(s) && !new RegExp('[' + ARROW + ']').test(s)){
    RE_BARE.lastIndex = 0;
    while ((m = RE_BARE.exec(s)) !== null){
      const at = m.index + m[1].length;
      if (/\bpages?$/i.test(s.slice(0, at).trim())) continue;
      add(at, m.index + m[0].length, +m[2]);
    }
  }
  if (RE_CUE.test(s)){
    RE_RANGE.lastIndex = 0;
    while ((m = RE_RANGE.exec(s)) !== null){
      if (+m[2] <= +m[1]) continue;
      add(m.index, m.index + m[1].length, +m[1]);
      const p = m.index + m[0].length - m[2].length;
      add(p, p + m[2].length, +m[2]);
    }
  }
  if (!marks.length) return s;
  marks.sort((a, b) => a.start - b.start);
  let out = '', pos = 0;
  for (const k of marks){
    const label = T[k.n] ? k.n + '. ' + T[k.n].t : 'topic ' + k.n;
    out += s.slice(pos, k.start)
        +  '<a class="xref" href="#" data-x="' + k.n + '" title="' + esc(label) + '">'
        +  s.slice(k.start, k.end) + '</a>';
    pos = k.end;
  }
  return out + s.slice(pos);
}

// \u0001 ... \u0002 wrap a word the rule is talking about
function terms(s){
  return s.replace(/\u0001([^\u0001\u0002]*)\u0002/g,
    '<b class="term" data-term="$1" title="Find other topics about \u201c$1\u201d">$1</b>');
}

// \u0004 ... \u0005 wrap the word an example is demonstrating
// \u000e<code> ... \u000f is a run of the notebook's own colour / weight / slant
function styled(s){
  return s.replace(/\u000e(.)([^\u000e\u000f]*)\u000f/g,
    (m, code, body) => '<span class="f' + (code.charCodeAt(0) - 65) + '">' + body + '</span>');
}

function keys(s){
  return s.replace(/\u0004([^\u0004\u0005]*)\u0005/g, '<b class="key">$1</b>')
          .replace(/\u0006([^\u0006\u0007]*)\u0007/g, '<i class="em">$1</i>')
          .replace(/\u0010([^\u0010\u0011]*)\u0011/g, '<span class="emr">$1</span>');
}

function blockHTML(b){
  if (b.t === 'table'){
    const cell = c => styled(keys(xref(esc(c.replace(/^\u0003/, ''))))).replace(/\n/g, '<br>');
    const cls = c => c.startsWith('\u0003') ? ' class="egcell"' : '';
    const [head, ...body] = b.rows;
    const headIsLabel = head.filter(c => c.trim()).length >= 2
      && head.every(c => !c.startsWith('\u0003') && c.length < 34 && !/[.?!]$/.test(c.trim()));
    const rows = headIsLabel
      ? `<thead><tr>${head.map(c => `<th>${cell(c)}</th>`).join('')}</tr></thead>
         <tbody>${body.map(r => `<tr>${r.map(c => `<td${cls(c)}>${cell(c)}</td>`).join('')}</tr>`).join('')}</tbody>`
      : `<tbody>${b.rows.map(r => `<tr>${r.map(c => `<td${cls(c)}>${cell(c)}</td>`).join('')}</tr>`).join('')}</tbody>`;
    return `<div class="twrap"><table class="gt">${rows}</table></div>`;
  }
  const note = b.note ? ` <span class="gloss">(${esc(b.note)})</span>` : '';
  if (b.t === 'eg')   return `<p class="eg${b.p ? ' pdf' : ''}">${styled(keys(xref(esc(b.x))))}${note}</p>`;
  if (b.t === 'wrong')return `<p class="bad${b.p ? ' pdf' : ''}">${styled(keys(xref(esc(b.x))))}${note}</p>`;
  if (b.t === 'tip')  return `<div class="tip"><b>Tip</b>${styled(keys(terms(xref(esc(b.x)))))}</div>`;
  if (b.t === 'sub')  return `<h4 class="sub">${styled(keys(terms(xref(esc(b.x)))))}</h4>`;
  return `<p class="rule${b.p ? ' pdf' : ''}">${styled(keys(terms(xref(esc(b.x)))))}</p>`;
}

let backStack = [];
function goTopic(n, remember){
  if (!T[n]) return;
  editing = null;
  if (remember !== false && n !== current) backStack.push(current);
  current = n;
  openUnits.add(T[n].u);
  drawTree(); drawTopic();
  window.scrollTo(0, 0);
}

function drawTopic(){
  const pane = document.getElementById('pane');
  if (!pane) return;
  const t = T[current];
  S.read[t.n] = 1; S.last = t.n; persist();

  const extras = EXTRAS[t.n] || [];
  const prev = t.n > 1 ? t.n - 1 : null, next = t.n < 180 ? t.n + 1 : null;

  pane.innerHTML = `<article class="topic">
    <header class="topic-head">
      <div class="eyebrow">${esc(t.u)} \u00b7 topic ${t.n} of 180</div>
      <h2>${esc(t.t)}</h2>
    </header>
    ${effSecs(t.n).map((sec, i) => `<section class="sec ${sec.l ? '' : 'nolabel'}">
        ${sec.l ? `<div class="sec-label">${sec.l}</div>` : ''}
        <div class="sec-body">${
          editing === t.n + '|' + i
            ? editorHTML(t.n, i, sec)
            : `<button class="sec-edit" data-edit="${i}">${sec.edited ? 'Edited \u00b7 edit' : 'Edit'}</button>`
              + sec.b.map(blockHTML).join('')
        }</div>
      </section>`).join('')}
    ${extras.length ? `<div class="extra">
        <h3>Going further</h3>
        <ul>${extras.map(x => `<li>${xref(rich(x))}</li>`).join('')}</ul>
      </div>` : ''}
    ${backStack.length ? `<div style="margin-bottom:14px">
      <button class="btn ghost sm" id="xback">\u21a9 Back to ${backStack[backStack.length-1]}. ${esc(T[backStack[backStack.length-1]].t)}</button>
    </div>` : ''}
    <div class="topic-foot">
      ${prev ? `<button class="btn ghost sm" data-go="${prev}">\u2190 ${prev}. ${esc(T[prev].t)}</button>` : '<span></span>'}
      <button class="btn go sm" id="drill">Practise this unit</button>
      ${next ? `<button class="btn ghost sm" data-go="${next}">${next}. ${esc(T[next].t)} \u2192</button>` : '<span></span>'}
    </div>
  </article>`;

  pane.querySelectorAll('[data-edit]').forEach(btn => btn.onclick = () => {
    openEditor(t.n, +btn.dataset.edit);
  });
  if (editing && editing.slice(0, editing.indexOf('|')) === String(t.n))
    wireEditor(t.n, +editing.split('|')[1]);
  pane.querySelectorAll('b.term').forEach(el => el.onclick = () => {
    query = el.dataset.term;
    const inp = document.getElementById('q');
    if (inp){ inp.value = query; }
    if (window.innerWidth <= 920) document.querySelector('.sidewrap').classList.add('open');
    drawTree();
    const side = document.querySelector('.side');
    if (side) side.scrollTop = 0;
  });
  pane.querySelectorAll('a.xref').forEach(a => a.onclick = e => {
    e.preventDefault();
    goTopic(+a.dataset.x);
  });
  pane.querySelectorAll('[data-go]').forEach(b => b.onclick = () => {
    current = +b.dataset.go;
    openUnits.add(T[current].u);
    drawTree(); drawTopic(); window.scrollTo(0, 0);
  });
  const xb = document.getElementById('xback');
  if (xb) xb.onclick = () => { const n = backStack.pop(); goTopic(n, false); };
  document.getElementById('drill').onclick = () => {
    S.units = [t.u]; persist();
    startQuiz(false);
  };
  drawTree();
}

/* ============================ PRACTICE ============================ */
function renderPractice(){
  if (session) return drawQuestion();
  const st = poolStatus();
  app.innerHTML = `
    <div class="quiz stack">
      ${st.done ? `<div class="banner">
        <b>Bank complete \u2014 every written question answered at least once.</b>
        Use <em>Generate a new test</em> for freshly built questions, or keep practising
        to move items through the review schedule.</div>` : ''}
      <section class="panel pad stack">
        <div>
          <h2 style="font-family:var(--serif);font-size:24px">Set up a test</h2>
          <p class="lede" style="margin:6px 0 0">Questions you get wrong come back sooner;
             ones you get right come back later.</p>
        </div>
        <div>
          <div class="eyebrow">Questions per test</div>
          <div class="chips" id="sizes">
            ${[5,10,20,30].map(n => `<button class="chip" data-size="${n}"
              aria-pressed="${S.size === n}">${n}</button>`).join('')}
          </div>
        </div>
        <div>
          <div class="eyebrow">Units \u2014 leave all off to draw from everything</div>
          <div class="chips" id="units">
            ${UNITS.map(u => `<button class="chip" data-unit="${esc(u)}"
              aria-pressed="${S.units.includes(u)}">${esc(u)}</button>`).join('')}
          </div>
        </div>
        <div class="btnrow">
          <button class="btn go" id="begin">Start test</button>
          <button class="btn ghost" id="begingen">Generate a new test</button>
          ${S.units.length ? '<button class="btn ghost" id="clearunits">Clear units</button>' : ''}
        </div>
        <p class="eyebrow">${st.fresh.length} unseen \u00b7 ${st.due.length} due for review \u00b7 ${st.pool.length} in this selection</p>
      </section>
    </div>`;

  document.querySelectorAll('#sizes .chip').forEach(b => b.onclick = () => {
    S.size = +b.dataset.size; persist(); renderPractice();
  });
  document.querySelectorAll('#units .chip').forEach(b => b.onclick = () => {
    const u = b.dataset.unit;
    S.units = S.units.includes(u) ? S.units.filter(x => x !== u) : S.units.concat(u);
    persist(); renderPractice();
  });
  const cu = document.getElementById('clearunits');
  if (cu) cu.onclick = () => { S.units = []; persist(); renderPractice(); };
  document.getElementById('begin').onclick = () => startQuiz(false);
  document.getElementById('begingen').onclick = () => startQuiz(true);
}

function startQuiz(forceGen){
  const qs = buildSession(S.size, forceGen);
  if (!qs.length){ toast('No questions available for that selection'); return; }
  session = { qs, i: 0, answered: [], picks: [], picked: null };
  view = 'practice';
  document.querySelectorAll('#tabs button').forEach(b =>
    b.setAttribute('aria-current', b.dataset.tab === 'practice' ? 'true' : 'false'));
  drawQuestion();
  window.scrollTo(0, 0);
}

function drawQuestion(){
  if (session.i >= session.qs.length) return drawResults();
  const q = session.qs[session.i];
  const t = T[q.n];
  const picked = session.picked;
  const pct = Math.round(session.i / session.qs.length * 100);

  app.innerHTML = `
  <div class="quiz">
    <section class="panel">
      <div class="qbar"><i style="width:${pct}%"></i></div>
      <div class="qmeta">
        <span>Question ${session.i + 1} of ${session.qs.length}</span>
        <span>${session.answered.filter(Boolean).length} correct so far</span>
      </div>
      <div class="qbody">
        <div class="qtopic">Topic ${q.n} \u00b7 ${esc(t.t)}${q.k === 'gen' ? ' \u00b7 generated' : ''}</div>
        <div class="qtext">${rich(q.q)}</div>
        <div class="opts" id="opts">
          ${q._order.map((o, i) => {
            let cls = '';
            if (picked !== null){
              if (o.correct) cls = 'right';
              else if (i === picked) cls = 'wrong';
            }
            return `<button class="opt ${cls}" data-i="${i}" ${picked !== null ? 'disabled' : ''}>
              <kbd>${'ABCD'[i]}</kbd><span>${rich(o.text)}</span></button>`;
          }).join('')}
        </div>
        ${picked === null ? '' : `<div class="verdict ${q._order[picked].correct ? 'ok' : 'no'}">
          <b>${q._order[picked].correct ? 'Correct' : 'Not quite \u2014 the answer is ' +
             rich(q._order.find(o => o.correct).text)}</b>
          ${rich(q.e)}
          <div style="margin-top:8px"><a href="#" data-read="${q.n}">Read topic ${q.n}: ${esc(t.t)}</a></div>
        </div>`}
      </div>
      <div class="qfoot">
        <button class="btn ghost sm" id="quit">End test</button>
        ${picked === null ? '<span class="eyebrow">Press A\u2013D or click an answer</span>'
          : `<button class="btn" id="next">${session.i + 1 === session.qs.length ? 'See results' : 'Next question'}</button>`}
      </div>
    </section>
  </div>`;

  document.querySelectorAll('#opts .opt').forEach(b => b.onclick = () => answer(+b.dataset.i));
  document.getElementById('quit').onclick = () => { session = null; renderPractice(); };
  const nx = document.getElementById('next');
  if (nx) nx.onclick = advance;
  const link = document.querySelector('[data-read]');
  if (link) link.onclick = e => {
    e.preventDefault();
    current = +link.dataset.read; openUnits = new Set([T[current].u]);
    session = null; go('reference');
  };
}

function answer(i){
  if (session.picked !== null) return;
  const q = session.qs[session.i];
  const correct = q._order[i].correct;
  session.picked = i;
  session.picks.push(i);
  session.answered.push(correct);
  record(q, correct);
  drawQuestion();
}

function advance(){
  session.i++; session.picked = null;
  drawQuestion();
  window.scrollTo(0, 0);
}

document.addEventListener('keydown', e => {
  if (view !== 'practice' || !session) return;
  if (session.i >= session.qs.length) return;
  const k = e.key.toUpperCase();
  if (session.picked === null && 'ABCD'.includes(k)){
    const idx = 'ABCD'.indexOf(k);
    if (idx < session.qs[session.i]._order.length) answer(idx);
  } else if (session.picked !== null && (e.key === 'Enter' || e.key === ' ')){
    e.preventDefault(); advance();
  }
});

function drawResults(){
  const right = session.answered.filter(Boolean).length;
  const total = session.qs.length;
  const pc = Math.round(right / total * 100);
  const msg = pc === 100 ? 'Clean sweep.'
    : pc >= 80 ? 'Strong round.'
    : pc >= 50 ? 'Solid \u2014 the misses come back tomorrow.'
    : 'These will come back soon. Worth re-reading the topics below.';

  app.innerHTML = `
  <div class="quiz stack">
    <section class="panel">
      <div class="score">
        <div class="n">${right}<span style="font-size:26px;color:var(--muted)">/${total}</span></div>
        <p>${msg}</p>
        <div class="btnrow" style="justify-content:center;margin-top:20px">
          <button class="btn go" id="again">Another test</button>
          <button class="btn ghost" id="gen">Generate a new test</button>
          <button class="btn ghost" id="done">Back to setup</button>
        </div>
      </div>
      ${session.qs.map((q, i) => {
        const ok = session.answered[i];
        const sol = q._order.find(o => o.correct).text;
        return `<div class="rev">
          <div class="q"><span class="flag ${ok ? 'ok' : 'no'}"></span>${rich(q.q)}</div>
          ${ok ? '' : `<div class="a you">You chose: ${rich(q._order[session.picks[i]].text)}</div>`}
          <div class="a sol">Answer: ${rich(sol)}</div>
          <div class="why">${rich(q.e)} <a href="#" data-read="${q.n}">Topic ${q.n} \u00b7 ${esc(T[q.n].t)}</a></div>
        </div>`;
      }).join('')}
    </section>
  </div>`;

  document.getElementById('again').onclick = () => startQuiz(false);
  document.getElementById('gen').onclick = () => startQuiz(true);
  document.getElementById('done').onclick = () => { session = null; renderPractice(); };
  document.querySelectorAll('[data-read]').forEach(a => a.onclick = e => {
    e.preventDefault();
    current = +a.dataset.read; openUnits = new Set([T[current].u]);
    session = null; go('reference');
  });
}

/* ============================ PROGRESS ============================ */
function renderProgress(){
  const rows = unitStats();
  const days = Object.keys(S.days).sort().slice(-14);
  const totalA = Object.values(S.days).reduce((s, d) => s + d.a, 0);
  const totalC = Object.values(S.days).reduce((s, d) => s + d.c, 0);
  const weak = BANK.map(q => ({ q, st: S.q[q.id] }))
    .filter(x => x.st && x.st.w > 0 && x.st.b < 2)
    .sort((a, b) => b.st.w - a.st.w).slice(0, 8);

  app.innerHTML = `
  <div class="stack">
    <section class="panel">
      <div class="mini" style="grid-template-columns:repeat(4,1fr)">
        <div><b>${streak()}</b><small>day streak</small></div>
        <div><b>${totalA}</b><small>answers given</small></div>
        <div><b>${totalA ? Math.round(totalC / totalA * 100) : 0}%</b><small>overall accuracy</small></div>
        <div><b>${Object.keys(S.read).length}/180</b><small>topics opened</small></div>
      </div>
    </section>

    ${days.length ? `<section class="panel pad">
      <h3 style="font-family:var(--serif);font-size:20px;margin-bottom:14px">Recent days</h3>
      <div style="display:flex;align-items:flex-end;justify-content:flex-start;gap:6px;height:110px">
        ${days.map(d => {
          const r = S.days[d];
          const h = Math.max(6, Math.min(100, r.a / Math.max(...days.map(x => S.days[x].a)) * 100));
          const acc = Math.round(r.c / r.a * 100);
          return `<div style="flex:1 1 0;max-width:44px;text-align:center" title="${d}: ${r.a} answered, ${acc}% correct">
            <div style="height:${h}px;background:var(--right);border-radius:2px 2px 0 0;opacity:${.35 + acc/160}"></div>
            <small style="font-size:10px;color:var(--muted)">${d.slice(8)}</small></div>`;
        }).join('')}
      </div>
    </section>` : ''}

    <section class="panel pad">
      <h3 style="font-family:var(--serif);font-size:20px;margin-bottom:14px">By unit</h3>
      <table class="ptable">
        <thead><tr><th>Unit</th><th>Reading</th><th class="num">Attempted</th>
          <th class="num">Accuracy</th><th style="width:130px">Mastery</th></tr></thead>
        <tbody>${rows.map(r => `<tr>
          <td>${esc(r.u)}</td>
          <td style="color:var(--muted);font-size:13px">${r.read}/${r.topics} topics</td>
          <td class="num">${r.seen}/${r.qs}</td>
          <td class="num">${r.total ? Math.round(r.right / r.total * 100) + '%' : '\u2014'}</td>
          <td><div class="pbar"><i style="width:${r.qs ? r.mastered / r.qs * 100 : 0}%"></i></div></td>
        </tr>`).join('')}</tbody>
      </table>
    </section>

    ${weak.length ? `<section class="panel pad">
      <h3 style="font-family:var(--serif);font-size:20px;margin-bottom:6px">Worth another look</h3>
      <p class="lede" style="margin:0 0 12px">Questions you've missed most often.</p>
      ${weak.map(x => `<div style="padding:9px 0;border-bottom:1px solid var(--rule-soft)">
        <div style="font-family:var(--serif)">${rich(x.q.q)}</div>
        <small style="color:var(--muted)">Missed ${x.st.w}\u00d7 \u00b7
          <a href="#" data-read="${x.q.n}">topic ${x.q.n}: ${esc(T[x.q.n].t)}</a></small>
      </div>`).join('')}
    </section>` : ''}

    ${syncPanelHTML()}

    <section class="panel pad stack">
      <h3 style="font-family:var(--serif);font-size:20px">Your data</h3>
      <p class="lede" style="margin:0">Progress is stored in this browser. Export a backup
        before clearing your browser data, or to move to another device.</p>
      <div class="btnrow">
        <button class="btn ghost sm" id="exp">Export backup</button>
        <button class="btn ghost sm" id="copy">Copy backup</button>
        <button class="btn ghost sm" id="imp">Import backup</button>
        <button class="btn ghost sm" id="reset">Reset all progress</button>
      </div>
      <input type="file" id="file" accept="application/json" hidden>
      <textarea id="paste" placeholder="Paste a backup here, then tap Import"
        style="display:none;width:100%;min-height:110px;padding:10px;border:1px solid var(--rule);
               border-radius:3px;font-size:16px;font-family:inherit"></textarea>
    </section>
  </div>`;

  document.querySelectorAll('[data-read]').forEach(a => a.onclick = e => {
    e.preventDefault();
    current = +a.dataset.read; openUnits = new Set([T[current].u]); go('reference');
  });
  document.getElementById('exp').onclick = () => {
    const text = JSON.stringify(S);
    const a = document.createElement('a');
    if (typeof a.download === 'undefined'){       // older iOS Safari
      copyBackup(text);
      return;
    }
    const blob = new Blob([text], { type: 'application/json' });
    a.href = URL.createObjectURL(blob);
    a.download = 'pocket-grammar-progress-' + dayStr(todayNum()) + '.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
  };
  document.getElementById('copy').onclick = () => copyBackup(JSON.stringify(S));
  wireSyncPanel();
  document.getElementById('imp').onclick = () => {
    const pasted = document.getElementById('paste');
    if (pasted.style.display === 'block' && pasted.value.trim()){
      try{
        const o = JSON.parse(pasted.value);
        if (!o.q || !o.days) throw 0;
        S = Object.assign(S, o); persist(); renderProgress(); toast('Backup restored');
      }catch(err){ toast('That doesn\u2019t look like a Pocket Grammar backup'); }
      return;
    }
    if (typeof document.createElement('input').files === 'undefined'){
      pasted.style.display = 'block'; pasted.focus(); return;
    }
    document.getElementById('file').click();
  };
  document.getElementById('file').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const o = JSON.parse(r.result);
        if (!o.q || !o.days) throw 0;
        S = Object.assign(S, o); persist(); renderProgress();
        toast('Backup restored');
      }catch(err){ toast('That file isn\u2019t a Pocket Grammar backup'); }
    };
    r.readAsText(f);
  };
  document.getElementById('reset').onclick = () => {
    if (!confirm('Delete all progress, streaks and review history? This cannot be undone.')) return;
    S = { q:{}, days:{}, read:{}, size:S.size, units:[], gen:0, last:null };
    persist(); renderProgress(); toast('Progress reset');
  };
}

/* ============================ boot ============================ */
(function(){
  const COL = { k: 'var(--ink)', b: 'var(--eg)', r: 'var(--wrong)', p: '#6b3fa0' };
  const css = STYLES.map((s, i) =>
    `.f${i}{color:${COL[s[0]] || 'var(--ink)'};` +
    `font-weight:${s[1] ? 700 : 'inherit'};font-style:${s[2] ? 'italic' : 'normal'}}`).join('');
  const el = document.createElement('style');
  el.textContent = css;
  document.head.appendChild(el);
})();

window.addEventListener('error', e => {
  const app = document.getElementById('app');
  if (app && !app.dataset.ok){
    app.innerHTML = '<section class="panel pad"><h2 style="font-family:var(--serif)">'
      + 'This page didn\u2019t load properly</h2><p class="lede">' + esc(String(e.message || e))
      + '</p><p class="lede">If you are on an older iPhone or iPad, updating iOS usually fixes it.</p></section>';
  }
});

(async function(){
  const saved = await Store.init();
  if (saved) S = Object.assign(S, saved);
  if (!S.edits) S.edits = {};
  if (!S.editsAt) S.editsAt = {};
  TOPICS.forEach(indexTopic);
  rebuildPools();
  Sync.load();
  const note = document.getElementById('savenote');
  note.textContent = Store.mode === 'memory'
    ? '180 topics \u00b7 progress won\u2019t be saved here \u2014 download the file to keep it'
    : '180 topics \u00b7 progress saved automatically';
  current = S.last || 1;
  render();
  app.dataset.ok = '1';
  if (Sync.on()) Sync.run();
})();

</script>
</body>
</html>
