ect, and the passive.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHmight be playing\u000f\u000eE badminton tomorrow.\u000f","p":1},{"t":"eg","x":"\u000eETina \u000f\u000eHcould be working\u000f\u000eE late today.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHmay have thrown\u000f\u000eE the leaflet away.\u000f","p":1},{"t":"eg","x":"\u000eEThe flight \u000f\u000eHcould have been\u000f\u000eE delayed.\u000f","p":1},{"t":"eg","x":"\u000eEHe \u000f\u000eHmight have been\u000f\u000eE having a shower.\u000f","p":1},{"t":"tip","x":"\u0001Might as well\u0002 is a useful phrase to say that there is no better alternative, e.g. This lamp is useless. I \u0001might as well\u0002 throw it away."}]}]},{"n":56,"t":"Can, could and be able to","u":"Modal Verbs","s":[{"l":"A","b":[{"t":"sub","x":"\u000eLCan\u000f\u000eC and \u000f\u000eLcould\u000f","p":1},{"t":"rule","x":"\u000eAWe use \u000f\u000eLcan\u000f\u000eA to express ability.\u000f","p":1},{"t":"eg","x":"\u000eENicola \u000f\u000eHcan\u000f\u000eE play chess.\u000f","p":1},{"t":"eg","x":"\u000eHCan\u000f\u000eE you draw a perfect circle?\u000f","p":1},{"t":"eg","x":"\u000eEWe \u000f\u000eHcan’t\u000f\u000eE lift this piano.\u000f","p":1},{"t":"rule","x":"\u000eAThe negative of \u000f\u000eLcan\u000f\u000eA is \u000f\u000eLcannot\u000f\u000eA, written as one word. It has a short form \u000f\u000eLcan’t\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"\u000eAWe use \u000f\u000eLcould\u000f\u000eA for ability in the past.\u000f","p":1},{"t":"eg","x":"\u000eEMy grandfather \u000f\u000eHcould\u000f\u000eE walk on his hands.\u000f","p":1},{"t":"rule","x":"\u000eAAs well as physical or mental ability, we also use \u000f\u000eLcan\u000f\u000eA and \u000f\u000eLcould\u000f\u000eA for an opportunity to do something.\u000f","p":1},{"t":"eg","x":"\u000eEWe \u000f\u000eHcan\u000f\u000eE sit in the garden when it’s sunny.\u000f","p":1},{"t":"eg","x":"\u000eEWe \u000f\u000eHcouldn’t\u000f\u000eE keep a dog in our old flat.\u000f","p":1}]},{"l":"B","b":[{"t":"eg","x":"\u0004Be able to\u0005"},{"t":"rule","x":"\u000eLAm/is/are able to\u000f\u000eA means the same as \u000f\u000eLcan\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEThe pupils \u000f\u000eHcan\u000f\u000eE read / \u000f\u000eHare able to\u000f\u000eE read.\u000f","p":1},{"t":"rule","x":"\u000eAThe negative is \u000f\u000eLnot able to\u000f\u000eA or \u000f\u000eLunable to\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEThe office \u000f\u000eHcannot\u000f\u000eE supply / \u000f\u000eHis not able to\u000f\u000eE supply / \u000f\u000eHis unable to\u000f\u000eE supply the figures.\u000f","p":1},{"t":"rule","x":"\u000eAWe \u0001can\u0002 use \u000f\u000eLbe able to\u000f\u000eA (but not \u000f\u000eLcan\u000f\u000eA) in other tenses and forms.\u000f","p":1},{"t":"eg","x":"\u000eEYou \u000f\u000eHwill be able to\u000f\u000eE check your progress.\u000f","p":1},{"t":"eg","x":"\u000eEHe \u000f\u000eHhasn’t been able to\u000f\u000eE play for ages.\u000f","p":1},{"t":"eg","x":"\u000eEIt’s nice \u000f\u000eHto be able to\u000f\u000eE relax.\u000f","p":1},{"t":"eg","x":"\u000eHBeing able to\u000f\u000eE speak the language is a great advantage.\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"\u000eLCould\u000f\u000eC and \u000f\u000eLwas/were able to\u000f","p":1},{"t":"rule","x":"Both these forms are possible when we talk about a general ability in the past."},{"t":"eg","x":"\u000eETracy \u000f\u000eHcould\u000f\u000eE swim / \u000f\u000eHwas able to\u000f\u000eE swim when she was a baby.\u000f","p":1},{"t":"rule","x":"\u000eABut we use \u000f\u000eLwas/were able to\u000f\u000eA (and not \u000f\u000eLcould\u000f\u000eA) for a particular situation.\u000f","p":1},{"t":"eg","x":"\u000eEFiremen \u000f\u000eHwere able to\u000f\u000eE put out the fire.\u000f","p":1},{"t":"eg","x":"\u000eEThe man \u000f\u000eHwas able to\u000f\u000eE call for help.\u000f","p":1},{"t":"wrong","x":"The man \u0004could\u0005 call for help."},{"t":"rule","x":"He had the ability to call for help (and he did actually call for help)."},{"t":"rule","x":"In negatives and questions either form is possible."},{"t":"eg","x":"\u000eEWe \u000f\u000eHcouldn’t\u000f\u000eE get / \u000f\u000eHweren’t able to\u000f\u000eE get tickets for the show.\u000f","p":1},{"t":"eg","x":"\u000eHCould\u000f\u000eE you find / \u000f\u000eHWere you able to\u000f\u000eE find it?\u000f","p":1},{"t":"rule","x":"\u000eAWe normally use \u000f\u000eLcould\u000f\u000eA (not \u000f\u000eLwas/were able \u0001to\u0002\u000f\u000eA) with verbs of perception and verbs of thinking.\u000f","p":1},{"t":"eg","x":"\u000eEWe co\u000f\u000eHuld see\u000f\u000eE smoke on the horizon.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHcould understand\u000f\u000eE that you felt upset.\u000f","p":1},{"t":"rule","x":"\u000eAFor a chance not taken, we use \u000f\u000eLcould have\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEHe \u000f\u000eHcould have\u000f\u000eE run, but he was too lazy.\u000f","p":1},{"t":"tip","x":"Succeeded in doing and managed to do mean the same as was able \u0001to\u0002, e.g.: Detectives were able to solve / succeeded in solving / managed to solve the mystery."}]}]},{"n":57,"t":"Would","u":"Modal Verbs","s":[{"l":"A","b":[{"t":"sub","x":"Form"},{"t":"rule","x":"\u000eLWould\u000f\u000eA has a short form \u000f\u000eL’d\u000f\u000eF.\u000f","p":1},{"t":"eg","x":"\u000eEAnyone \u000f\u000eHwould\u000f\u000eE look silly in that hat.\u000f","p":1},{"t":"eg","x":"\u000eEI’\u000f\u000eHd\u000f\u000eE look ridiculous wearing that.\u000f","p":1},{"t":"rule","x":"\u000eAWe form negatives and questions in the same way as other modal verbs. \u000f\u000eB➤48C\u000f","p":1},{"t":"eg","x":"\u000eEThis colour \u000f\u000eHwouldn’t\u000f\u000eE suit me, would it?\u000f","p":1},{"t":"eg","x":"\u000eEWhen \u000f\u000eHwould\u000f\u000eE I wear it?\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"Use"},{"t":"rule","x":"\u000eAWe use \u000f\u000eLwould\u000f\u000eA for a possible, hypothetical situation. Compare:\u000f","p":1},{"t":"rule","x":"\u000eEWe’re going to have a barbecue.\u000f\u000eB → \u000f\u000eEOh, that’\u000f\u000eHll\u000f\u000eE be nice.\u000f\u000eA (a future situation)\u000f","p":1},{"t":"rule","x":"\u000eEWe’re thinking of having a barbecue.\u000f\u000eB → \u000f\u000eEOh, that’\u000f\u000eHd\u000f\u000eE be nice\u000f\u000eD.\u000f\u000eA (a possible situation)\u000f","p":1},{"t":"rule","x":"\u000eAWith \u000f\u000eLwould\u000f\u000eA there is often a phrase or clause explaining the possible situation.\u000f","p":1},{"t":"eg","x":"\u000eEYou \u000f\u000eHwouldn’t\u000f\u000eE be much use \u000f\u000eHin a crisis\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eENo one \u000f\u000eHwould\u000f\u000eE pay taxes \u000f\u000eHif they didn’t have to\u000f\u000eD. \u000f\u000eB➤158\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"Would like"},{"t":"rule","x":"\u000eLWould like\u000f\u000eA means the same as \u000f\u000eLwant\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEFiona \u000f\u000eHwould like\u000f\u000eE to work in television.\u000f","p":1},{"t":"eg","x":"\u000eEWe’\u000f\u000eHd like\u000f\u000eE a place of our own to live.\u000f","p":1},{"t":"rule","x":"We use it in offers and invitations:"},{"t":"eg","x":"\u000eHWould anyone like\u000f\u000eE a drink?\u000f","p":1},{"t":"eg","x":"\u000eHWould you like\u000f\u000eE to join us for lunch?\u000f","p":1},{"t":"rule","x":"\u000eACompare \u000f\u000eLlike\u000f\u000eA and \u000f\u000eLwould \u0001like\u0002\u000f\u000eA:\u000f","p":1},{"t":"eg","x":"\u000eEI’m a great dancer. I \u000f\u000eHlike\u000f\u000eE going / I \u000f\u000eHlike\u000f\u000eE to go to clubs\u000f\u000eD.\u000f\u000eA (I always enjoy going.)\u000f","p":1},{"t":"eg","x":"\u000eELet’s go out somewhere. I’\u000f\u000eHd like\u000f\u000eE to go to a club\u000f\u000eD.\u000f\u000eA (I want to go.)\u000f","p":1},{"t":"rule","x":"\u000eAWe can also use \u000f\u000eLwould\u000f\u000eA with verbs such as \u000f\u000eLlove\u000f\u000eF, \u000f\u000eLhate\u000f\u000eA, and \u000f\u000eLenjoy\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEEmily \u000f\u000eHwould love\u000f\u000eE to do deep-sea diving.\u000f","p":1},{"t":"eg","x":"\u000eEI’\u000f\u000eHd hate\u000f\u000eE to live in a big city.\u000f","p":1}]},{"l":"D","b":[{"t":"sub","x":"Would mind"},{"t":"rule","x":"\u000eAWe use this in\u000f\u000eD negatives\u000f\u000eA and \u000f\u000eDquestions\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHwouldn’t mind\u000f\u000eE watching this film.\u000f\u000eA (I want to watch it.)\u000f","p":1},{"t":"eg","x":"\u000eHWould\u000f\u000eE you \u000f\u000eHmind\u000f\u000eE changing places?\u000f\u000eB (\u000f\u000eAa polite request)\u000f","p":1}]},{"l":"E","b":[{"t":"rule","x":"\u0001Would rather\u0002"},{"t":"rule","x":"\u000eLWould rather\u000f\u000eA means ‘prefer’ or ‘would prefer’.\u000f","p":1},{"t":"eg","x":"\u000eEI’\u000f\u000eHd rather\u000f\u000eE walk than wait for a bus.\u000f","p":1},{"t":"eg","x":"\u000eEKaren \u000f\u000eHwould rather\u000f\u000eE we kept together.\u000f","p":1},{"t":"eg","x":"\u000eHWould\u000f\u000eE you \u000f\u000eHrather\u000f\u000eE eat now or later?\u000f","p":1},{"t":"rule","x":"\u000eAIt is followed by an infinitive without \u000f\u000eCto\u000f\u000eA (\u000f\u000eDwalk\u000f\u000eA) or by a clause (\u000f\u000eDwe kept together\u000f\u000eA).\u000f","p":1},{"t":"rule","x":"\u000eAThe negative is \u000f\u000eLwould rather not\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI’\u000f\u000eHd rather not\u000f\u000eE take any risks.\u000f","p":1},{"t":"tip","x":"To ask for something, use \u0001would like\u0002, not want. I’d like a drink is more polite than I want a drink."}]}]},{"n":58,"t":"Used to and dare","u":"Modal Verbs","s":[{"l":"A","b":[{"t":"sub","x":"Used to"},{"t":"rule","x":"\u000eLUsed to\u000f\u000eA means that something happened regularly or continued for a time in the past but no longer does so.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHused to\u000f\u000eE come here when I was a child.\u000f","p":1},{"t":"eg","x":"\u000eEEmma \u000f\u000eHused to\u000f\u000eE have a bicycle, but then she sold it.\u000f","p":1},{"t":"rule","x":"\u000eAThere is \u000f\u000eDno present-tense form\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eA❌\u000f\u000eDI use to come here now.\u000f","p":1},{"t":"rule","x":"\u000eAWe use \u000f\u000eLdid\u000f\u000eA in negatives and questions.\u000f","p":1},{"t":"eg","x":"\u000eEThere \u000f\u000eHdidn’t use to\u000f\u000eE be so much crime.\u000f","p":1},{"t":"eg","x":"\u000eEWhat \u000f\u000eHdid\u000f\u000eE people \u000f\u000eHuse to\u000f\u000eE do before they had television?\u000f","p":1},{"t":"rule","x":"\u000eAWe can also use \u000f\u000eLnever\u000f\u000eA for the negative.\u000f","p":1},{"t":"eg","x":"\u000eEThere \u000f\u000eHnever used to be\u000f\u000eE so much crime.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"\u000eLUsed to \u000f\u000eCand \u000f\u000eLbe/get used to\u000f","p":1},{"t":"rule","x":"Compare these patterns:"},{"t":"eg","x":"\u000eEWe \u000f\u000eHused to live\u000f\u000eE in the country before we moved to London.\u000f","p":1},{"t":"eg","x":"\u000eEIt was strange at first, but we’\u000f\u000eHre used to living\u000f\u000eE here now.\u000f","p":1},{"t":"rule","x":"\u000eLUsed to do\u000f\u000eA refers to the past, and \u000f\u000eLbe \u0001used to\u0002 doing\u000f\u000eA means that something no longer feels strange.\u000f","p":1},{"t":"rule","x":"\u000eLGet used to\u000f\u000eA refers to something becoming more familiar.\u000f","p":1},{"t":"eg","x":"\u000eEIf you go to live in France, you’ll have to \u000f\u000eHget used to driving\u000f\u000eE on the right.\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"\u000eLWould\u000f\u000eG f\u000f\u000eCor past habits\u000f","p":1},{"t":"rule","x":"\u000eAIn literary English, \u000f\u000eLwould\u000f\u000eA can be \u0001used to\u0002 talk about past x":"\u000eEThe flats were \u000f\u000eHknocked down\u000f\u000eE last year.\u000f","p":1},{"t":"eg","x":"\u000eEHas the doctor been \u000f\u000eHsent for\u000f\u000eE?\u000f","p":1},{"t":"eg","x":"\u000eESlavery should be \u000f\u000eHdone away with\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEThe child is always being \u000f\u000eHmade fun of\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eAThe adverb or preposition (\u000f\u000eFdown, \u0001for\u0002\u000f\u000eD,\u000f\u000eA etc.) comes after the participle.\u000f","p":1},{"t":"tip","x":"Be + passive participle can express an action or a state. Compare: • The vase was broken by a guest (action) • The vase was broken. It lay in pieces. (state)"}]}]},{"n":60,"t":"The use of the passive","u":"The Passive","s":[{"l":"A","b":[{"t":"sub","x":"Introduction"},{"t":"rule","x":"Compare the active and passive sentences:"},{"t":"rule","x":"\u000eCActive: \u000f\u000eEAmy \u000f\u000eHfaxed\u000f\u000eE the report.\u000f","p":1},{"t":"rule","x":"\u000eCPassive: \u000f\u000eEThe report \u000f\u000eHwas faxed\u000f\u000eE by Amy.\u000f","p":1},{"t":"rule","x":"We can choose to talk about Amy and what she did, or about the report and what happened to it. This often depends on what is old or new information. ➤21"}]},{"l":"B","b":[{"t":"sub","x":"The agent"},{"t":"rule","x":"\u000eAWhen we need to mention the agent in a passive sentence, we use \u000f\u000eFby\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEThe story was written \u000f\u000eHby Dickens\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"But often we mention other information rather than the agent."},{"t":"eg","x":"\u000eEThe concert is being held\u000f\u000eH in the park.\u000f","p":1},{"t":"eg","x":"\u000eEPlugs should be wired \u000f\u000eHcorrectly\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"Often the agent is irrelevant or too obvious to mention."},{"t":"eg","x":"A new government has been elected."}]},{"l":"C","b":[{"t":"sub","x":"Typical contexts"},{"t":"rule","x":"We sometimes use the passive in speech, but it is more common in writing, especially in the impersonal style of textbooks and factual information."},{"t":"eg","x":"The paint is pumped into a large tank."},{"t":"eg","x":"The slaves were sold to traders."},{"t":"eg","x":"Many new jobs have been created."},{"t":"rule","x":"The focus is on the processes rather than on the people carrying them out."},{"t":"rule","x":"The passive is also sometimes used for rules and procedures under a contract."},{"t":"eg","x":"The service is provided under a contract."},{"t":"rule","x":"Application should be made in writing."},{"t":"rule","x":"\u000eAThe active \u000f\u000eEYou should apply...\u000f\u000eA is more friendly and less impersonal.\u000f","p":1}]},{"l":"D","b":[{"t":"sub","x":"You, we, etc"},{"t":"rule","x":"\u000eAIn informal English, \u0001we\u0002 often avoid the passive (P) by using the active (A) with \u000f\u000eFyou, we, they, people\u000f\u000eD,\u000f\u000eA or \u000f\u000eFsomeone\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"Examples:"},{"t":"rule","x":"○ P: Nothing can be done about it."},{"t":"rule","x":"\u000eCA: \u000f\u000eHYou\u000f\u000eE can’t do anything about it.\u000f","p":1},{"t":"rule","x":"○ P: Education is valued."},{"t":"rule","x":"\u000eCA: \u000f\u000eHWe/People\u000f\u000eE value education.\u000f","p":1},{"t":"rule","x":"○ P: The gates have been opened."},{"t":"rule","x":"\u000eCA: \u000f\u000eHSomeone\u000f\u000eE has opened the gates.\u000f","p":1}]},{"l":"E","b":[{"t":"sub","x":"Verbs without passive forms"},{"t":"rule","x":"\u000eAAn \u000f\u000eDintransitive\u000f\u000eA verb (e.g. \u000f\u000eFhappen\u000f\u000eA) has no object and so \u000f\u000eDcannot\u000f\u000eA be passive\u000f","p":1},{"t":"rule","x":"Some state verbs with an object cannot be passive, e.g. have, lack, suit"},{"t":"eg","x":"○ My friend has a sport car."},{"t":"wrong","x":"A sports car is had by my friend"},{"t":"rule","x":"\u000eABut other state verbs can be passive, e.g. \u000f\u000eBknow, love, need, own, want\u000f","p":1},{"t":"rule","x":"○ Old toys are wanted by collectors"},{"t":"tip","x":"Do not overuse the passive. Use it only when it fits the context and the style. Even in formal writing, most clauses are active."}]}]},{"n":61,"t":"Some passive patterns","u":"The Passive","s":[{"l":"A","b":[{"t":"sub","x":"Give, send, etc"},{"t":"rule","x":"\u000eAIn the active, \u000f\u000eDgive\u000f\u000eA can have two objects.\u000f","p":1},{"t":"eg","x":"\u000eEThe nurse gives \u000f\u000eHthe patient a pill\u000f","p":1},{"t":"rule","x":"\u000eDEither of these\u000f\u000eA objects can be the subject of a passive sentence\u000f","p":1},{"t":"eg","x":"\u000eHA pill\u000f\u000eE is given to the patient\u000f","p":1},{"t":"eg","x":"\u000eHThe patient\u000f\u000eE is given a pill\u000f","p":1},{"t":"rule","x":"It is quite usual in English to begin with the person receiving something"},{"t":"eg","x":"\u000eHThe speaker\u000f\u000eE was handed a note\u000f","p":1},{"t":"eg","x":"\u000eHI\u000f\u000eE've been offered a job\u000f","p":1},{"t":"eg","x":"\u000eHThe residents\u000f\u000eE will be found new homes\u000f","p":1},{"t":"rule","x":"\u000eASome verbs in this pattern (aka. 2 objects) are \u000f\u000eBask, feed, find, give, hand, lend, offer, pay, promise, sell, send, show, teach, tell\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"It is said …"},{"t":"rule","x":"\u000eAWe use this pattern with\u000f\u000eD verbs of reporting\u000f","p":1},{"t":"eg","x":"\u000eHIt is said\u000f\u000eE that the number 13 is unlucky\u000f","p":1},{"t":"eg","x":"\u000eHIt is thought\u000f\u000eE that the painting is genuine\u000f","p":1},{"t":"eg","x":"\u000eHIt was reported\u000f\u000eE that people were dying\u000f","p":1},{"t":"rule","x":"Some verbs in this pattern are accept, agree, announce, argue, assume, believe, claim, decided, expect, feel, find, hope, know, notice, predict, realize, report, say, see, show, state, suggest, think, understand."}]},{"l":"C","b":[{"t":"sub","x":"… said to be …"},{"t":"rule","x":"\u000eAThis pattern involves \u000f\u000eDa passive verb\u000f\u000eA of \u000f\u000eDreporting\u000f\u000eA and a \u000f\u000eDto-infinitive\u000f","p":1},{"t":"rule","x":"\u000eEThe number 13 \u000f\u000eHis \u0001said\u0002 to be\u000f\u000eE unlucky (Active: People say that the number 13 \u000f\u000eHis unlucky\u000f\u000eE)\u000f","p":1},{"t":"rule","x":"\u000eEWe \u000f\u000eHwere expected to win\u000f\u000eE, but we lost ( Active: People expected us to win)\u000f","p":1},{"t":"rule","x":"\u000eANote these forms of the \u000f\u000eDto-infinitive\u000f","p":1},{"t":"rule","x":"\u000eEA crowd was reported \u000f\u000eHto be gathering\u000f\u000eE (Active: He reported that a crowd \u000f\u000eHwas gathering\u000f\u000eE)\u000f","p":1},{"t":"rule","x":"\u000eEHe is known \u000f\u000eHto have committed\u000f\u000eE crimes (Active: People know that he \u000f\u000eHhas committed\u000f\u000eE crimes)\u000f","p":1},{"t":"rule","x":"\u000eEA man is belived \u000f\u000eHto have been killed\u000f\u000eE ( Active: People believe that a man \u000f\u000eHhas been killed\u000f\u000eE)\u000f","p":1},{"t":"rule","x":"Some verbs in this pattern are assume, believe, claim, expect, feel, find, know, mean, prove, report, say, see, show, state, suppose, think, undestand"}]},{"l":"D","b":[{"t":"sub","x":"Passive verb + to-infinitive"},{"t":"rule","x":"\u000eAWe use this pattern with verbs like tell, persuade, advise, force, and allow \u000f\u000eC->68B-C\u000f","p":1},{"t":"rule","x":"\u000eEDrivers \u000f\u000eHare advised to avoid\u000f\u000eE the area ( Active: Authorities \u000f\u000eHadvise \u000f\u000eEdrivers\u000f\u000eH to avoid\u000f\u000eE the area).\u000f","p":1},{"t":"rule","x":"\u000eANote also make \u000f\u000eB➤\u000f\u000eA72D and see, hear, etc \u000f\u000eB➤\u000f\u000eA72E\u000f","p":1},{"t":"rule","x":"\u000eEThe hostages \u000f\u000eHwere made to lie\u000f\u000eE down ( Active: Terrorists \u000f\u000eHmade \u000f\u000eEthe hostages\u000f\u000eH to lie\u000f\u000eE down)\u000f","p":1},{"t":"rule","x":"\u000eEThe man \u000f\u000eHwas seen to run\u000f\u000eE away (Active: A woman \u000f\u000eHsaw\u000f\u000eE the man run \u000f\u000eHaway\u000f\u000eE)\u000f","p":1}]},{"l":"E","b":[{"t":"sub","x":"Passive verb + participle"},{"t":"rule","x":"This pattern involves an active participle"},{"t":"rule","x":"\u000eEThe man \u000f\u000eHwas seen running\u000f\u000eE away (Active: They\u000f\u000eH saw \u000f\u000eEthe man\u000f\u000eH running \u000f\u000eEaway)\u000f","p":1},{"t":"rule","x":"\u000eEWe \u000f\u000eHwere kept waiting\u000f\u000eE half an hour (Active: They\u000f\u000eH kept \u000f\u000eEus\u000f\u000eH waiting\u000f\u000eE an hour)\u000f","p":1},{"t":"rule","x":"\u000eAWe\u000f\u000eB use see, hear, etc and catch, find, leave, lose, spend, waste.  \u000f\u000eA➤81A\u000f","p":1},{"t":"tip","x":"\u000eAUse \u000f\u000eDallow\u000f\u000eA in the passive but not \u000f\u000eDlet\u000f\u000eA, e.g. \u000f\u000eBThe hostages \u000f\u000eKwere allowed to\u000f\u000eB go free\u000f","p":1}]}]},{"n":62,"t":"Patterns with have and get","u":"The Passive","s":[{"l":"A","b":[{"t":"sub","x":"\u000eCThe passive with\u000f\u000eG get\u000f","p":1},{"t":"rule","x":"\u000eAWe sometimes form the passive with \u000f\u000eDget\u000f\u000eA rather than \u000f\u000eDbe\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eELuckily I \u000f\u000eHgot accepted\u000f\u000eE at art school.\u000f","p":1},{"t":"eg","x":"\u000eELots of people \u000f\u000eHget killed\u000f\u000eE on the roads.\u000f","p":1},{"t":"rule","x":"The pattern is used mainly in informal English, and it has a more limited use than \u0001be\u0002. We can use \u0001get\u0002 to talk about good or bad things happening."},{"t":"rule","x":"\u000eAWe can also use \u000f\u000eDget\u000f\u000eA for something \u000f\u000eDhappening incidentally, as part of a larger operation.\u000f","p":1},{"t":"eg","x":"\u000eEThe dustbin \u000f\u000eHgets emptied\u000f\u000eE once a week.\u000f","p":1},{"t":"rule","x":"\u000eABut it is not used for a \u000f\u000eDplanned\u000f\u000eA action.\u000f","p":1},{"t":"eg","x":"\u000eEThe railway \u000f\u000eHwas privatized\u000f\u000eE in the 1990s.\u000f","p":1},{"t":"wrong","x":"The railway got privatized."},{"t":"rule","x":"\u000eAWe use \u000f\u000eDdo\u000f\u000eA in \u000f\u000eDsimple-tense negatives and questions.\u000f","p":1},{"t":"eg","x":"\u000eEThe bins \u000f\u000eHdidn’t get emptied\u000f\u000eE yesterday.\u000f","p":1},{"t":"eg","x":"\u000eEHow often \u000f\u000eHdo \u000f\u000eErugby players\u000f\u000eH get injured\u000f\u000eE?\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"\u000eCIdioms with\u000f\u000eG get\u000f","p":1},{"t":"rule","x":"\u000eAWe use \u000f\u000eDget\u000f\u000eA + passive participle in some idiomatic expressions.\u000f","p":1},{"t":"eg","x":"\u000eEI’ll have to\u000f\u000eH get washed\u000f\u000eE. (wash myself)\u000f","p":1},{"t":"eg","x":"\u000eEEd has \u000f\u000eHgot married\u000f\u000eE. (married someone)\u000f","p":1},{"t":"eg","x":"\u000eAThese include \u000f\u000eDget washed, get shaved, get (un)dressed; get engaged, get married, get divorced.\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"Have/get something done"},{"t":"rule","x":"\u000eAThis pattern means ' \u000f\u000eDcause something to be done\u000f\u000eA’. We use it mainly to talk about professional services to a customer.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHhad \u000f\u000eEmy car\u000f\u000eH serviced\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHgot \u000f\u000eEmy car\u000f\u000eH serviced\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"This means that I arranged for a garage to service my car. It is a little informal."},{"t":"rule","x":"Here are some more examples."},{"t":"eg","x":"\u000eEWe \u000f\u000eHmust have/get \u000f\u000eEthe machine\u000f\u000eH repaired\u000f","p":1},{"t":"eg","x":"\u000eELucy \u000f\u000eHhas had \u000f\u000eEher kitchen\u000f\u000eH extended\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEWe’re \u000f\u000eHhaving/getting \u000f\u000eEa new tap\u000f\u000eH fitted\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEWhere \u000f\u000eHdid you have/get \u000f\u000eEyour hair\u000f\u000eH cut\u000f\u000eE?\u000f","p":1},{"t":"rule","x":"\u000eAWe can also use \u000f\u000eDget\u000f\u000eA informally for a job we do ourselves.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHmust get \u000f\u000eEmy homework\u000f\u000eH done\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEWe \u000f\u000eHgot \u000f\u000eEeverything\u000f\u000eH packed \u000f\u000eEand ready.\u000f","p":1}]},{"l":"D","b":[{"t":"sub","x":"Have something happen"},{"t":"rule","x":"\u000eAThis pattern has the same form as \u000f\u000eDhave something done\u000f\u000eA in C. It often refers to an unpleasant experience.\u000f","p":1},{"t":"eg","x":"\u000eEWe \u000f\u000eHhad\u000f\u000eE a window \u000f\u000eHbroken\u000f\u000eE in the storm.\u000f","p":1},{"t":"eg","x":"\u000eEMy sister \u000f\u000eHhas had \u000f\u000eEsome money\u000f\u000eH stolen\u000f\u000eE.\u000f","p":1},{"t":"tip","x":"Do not confuse had something done and have done something. If we had your grass cut, then someone did it for us; if we had cut the grass , then we did it before a time in the past (past perfect ➤35A)"}]}]},{"n":63,"t":"The passive to-infinitive and gerund","u":"The Passive","s":[{"l":"A","b":[{"t":"rule","x":"\u000eALook at these forms of the verb \u000f\u000eDplay\u000f","p":1},{"t":"table","rows":[["","Active","Passive"],["To-infinitive","To play","To be played"],["Perfect to-infinitive","To have played","To have been played"],["Gerund","Playing","Being played"],["Perfect gerund","Having played","Having been played"]]},{"t":"rule","x":"Here are some examples of the passive forms."},{"t":"table","rows":[["To-infinitive","\u000eEIt's embarrassing \u000f\u000eHto be criticized \u000f\u000eEin public\u000f"],["Perfect to-infinitive","\u000eEThe fire seems\u000f\u000eH to have been caused\u000f\u000eE by an electrical fault\u000f"],["Gerund","\u000eHBeing searched\u000f\u000eE by customs officers is not pleasant experience\u000f"],["Perfect gerund","\u000eEThere is no record of any message \u000f\u000eHhaving been sent\u000f"]]}]},{"l":"B","b":[{"t":"rule","x":"\u000eAThe active gerund has a passive meaning after \u000f\u000eDneed\u000f\u000eA  or want (=\u0001need\u0002 ).\u000f","p":1},{"t":"eg","x":"\u000eEThe room \u000f\u000eHneeds decorating\u000f\u000eE. (= The room needs to be decorated.)\u000f","p":1},{"t":"rule","x":"We cannot use the passive gerund here."},{"t":"wrong","x":"It needed being decorated"}]},{"l":"C","b":[{"t":"rule","x":"\u000eAWe sometimes use an active to-infinitive for\u000f\u000eD jobs we have to do.\u000f","p":1},{"t":"eg","x":"\u000eEWe \u000f\u000eHhad \u000f\u000eEthe living-room\u000f\u000eH to decorate\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEI’ve \u000f\u000eHgot \u000f\u000eEsome work\u000f\u000eH to do\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"When the subject (we, I) is the person doing the job, we use the active. But in other cases, we use the passive."},{"t":"eg","x":"\u000eEThe living-room\u000f\u000eH had to be decorated\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEThe work \u000f\u000eHis to be done \u000f\u000eEby tomorrow.\u000f","p":1},{"t":"rule","x":"\u000eAAfter the subject there, the infinitive is\u000f\u000eD either active or passive.\u000f","p":1},{"t":"eg","x":"\u000eEThere’s a wall \u000f\u000eHto paint / to be painted\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEThere’s work \u000f\u000eHto do / to be done\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"After an adjective, we usually use the active."},{"t":"eg","x":"\u000eEThe piano is \u000f\u000eHtoo heavy to move\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eABut if we use a phrase with \u000f\u000eDby\u000f\u000eA, then the infinitive is passive.\u000f","p":1},{"t":"eg","x":"\u000eEThe piano is \u000f\u000eHtoo heavy to be moved by\u000f\u000eE one person.\u000f","p":1},{"t":"tip","x":"\u000eAWhen we talk about leisure activities, we normally use the active, e.g. \u000f\u000eBThere are lots of exciting \u000f\u000eKthings to do\u000f\u000eB.\u000f","p":1}]}]},{"n":64,"t":"The infinitive","u":"The Infinitive","s":[{"l":"A","b":[{"t":"rule","x":"\u000eAAn infinitive can be with \u000f\u000eIto\u000f\u000eA or without \u000f\u000eIto\u000f","p":1},{"t":"eg","x":"\u000eEI’d prefer \u000f\u000eHto sit\u000f\u000eE at the back.\u000f","p":1},{"t":"eg","x":"\u000eEI’d rather \u000f\u000eHsit\u000f\u000eE at the back.\u000f","p":1},{"t":"rule","x":"\u000eAWhether we use \u000f\u000eIto\u000f\u000eA depends on the grammatical pattern. For example, we use it after \u000f\u000eFprefer\u000f\u000eA but not after \u000f\u000eFwould rather\u000f\u000eI.\u000f","p":1},{"t":"rule","x":"\u000eAThe most common use of an infinitive without \u000f\u000eIto\u000f\u000eA is after a modal verb.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHcan sit \u000f\u000eEat the back.\u000f","p":1},{"t":"rule","x":"\u000eAFor the infinitive without to, \u000f\u000eB➤72\u000f\u000eA.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"A to-infinitive can have these forms."},{"t":"rule","x":"\u000eCSimple: \u000f\u000eDto do\u000f","p":1},{"t":"eg","x":"\u000eEIt’s great \u000f\u000eHto see \u000f\u000eEyou.\u000f","p":1},{"t":"rule","x":"\u000eCPerfect: \u000f\u000eDto have done\u000f","p":1},{"t":"eg","x":"\u000eEI seem\u000f\u000eH to have left\u000f\u000eE my umbrella behind.\u000f","p":1},{"t":"rule","x":"\u000eCContinuous: \u000f\u000eDto be doing\u000f","p":1},{"t":"eg","x":"\u000eEYou’re lucky\u000f\u000eH to be living \u000f\u000eEhere.\u000f","p":1},{"t":"rule","x":"\u000eCPerfect + continuous: \u000f\u000eDto have been doing\u000f","p":1},{"t":"eg","x":"\u000eEA man at the bus stop appeared \u000f\u000eHto have been drinking\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eAFor passive forms, \u000f\u000eB➤63A.\u000f","p":1},{"t":"rule","x":"\u000eAIn the negative, \u000f\u000eInot\u000f\u000eA comes before the infinitive\u000f","p":1},{"t":"eg","x":"\u000eEI'd prefer \u000f\u000eHto not sit\u000f\u000eE at the front.\u000f","p":1},{"t":"eg","x":"\u000eEIt would have been too risky \u000f\u000eHto not have had\u000f\u000eE medical insurance. \u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"An infinitive can be followed by an object or complement and /or by one or more adverbials . The infinitive together with such phrases is an infinitive clause."},{"t":"rule","x":"\u000eEA sightseeing tour is the best way \u000f\u000eHto see the city\u000f\u000eE ( infinitive + object).\u000f","p":1},{"t":"rule","x":"\u000eEI’m doing my best\u000f\u000eH to keep fit \u000f\u000eE(infinitive + complement).\u000f","p":1},{"t":"rule","x":"\u000eEI’d be \u000f\u000eHquite happy to sit at the back \u000f\u000eE(infinitive + adverbial).\u000f","p":1},{"t":"rule","x":"Or an infinitive clause can be just an infinitive on its own."},{"t":"eg","x":"\u000eEWe decided\u000f\u000eH to leave\u000f\u000eE.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"\u000eAIn an infinitive clause, a preposition comes in its normal place, often\u000f\u000eD after a verb or adjective.\u000f","p":1},{"t":"eg","x":"\u000eEIt isn’t enough money to live \u000f\u000eHon\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEThere’s nothing to get excited \u000f\u000eHabout\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEI need a vase to put these flowers \u000f\u000eHin\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eAIn more formal English the clause can \u000f\u000eDbegin\u000f\u000eA with \u000f\u000eDa preposition and relative pronoun.\u000f","p":1},{"t":"eg","x":"\u000eEIt is not enough money \u000f\u000eHon which\u000f\u000eE to live.\u000f","p":1},{"t":"tip","x":"A one-word adverbial can often go after \u0001to\u0002 and before the verb, e.g. Now we’ve got a chance to really relax. This is called a split infinitive. A few people think it is incorrect, but in fact it is common usage."}]}]},{"n":65,"t":"Some patterns with the to-infinitive","u":"The Infinitive","s":[{"l":"A","b":[{"t":"sub","x":"\u000eCThe to-infinitive with \u000f\u000eJit\u000f","p":1},{"t":"rule","x":"\u000eAWe often use a pattern with \u000f\u000eFit\u000f\u000eA as the subject and an infinitive clause \u000f\u000eDat or near the end of the sentence.\u000f","p":1},{"t":"eg","x":"\u000eHIt \u000f\u000eEseems rude\u000f\u000eH to refuse the invitation.\u000f","p":1},{"t":"sub","x":"\u000eHIt’s\u000f\u000eE a mistake\u000f\u000eH not to take any exercise.\u000f","p":1},{"t":"eg","x":"\u000eHIt \u000f\u000eEtakes ages\u000f\u000eH to defrost this fridge.\u000f","p":1},{"t":"rule","x":"\u000eAAn infinitive clause can sometimes be the subject, but this is \u000f\u000eDless common.\u000f","p":1},{"t":"eg","x":"\u000eHTo refuse the invitation \u000f\u000eEseems rude.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"To-infinitive clause as complement"},{"t":"rule","x":"\u000eAThe clause can \u0001be\u0002 a complement after \u000f\u000eFbe\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEMy intention is\u000f\u000eH to emigrate to Australia.\u000f","p":1},{"t":"eg","x":"\u000eEThe important thing is \u000f\u000eHnot to panic.\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"Purpose"},{"t":"rule","x":"\u000eAA\u000f\u000eI to-infinitive\u000f\u000eA clause can express purpose.\u000f","p":1},{"t":"eg","x":"\u000eEJack went out\u000f\u000eH to do some shopping\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEI am writing\u000f\u000eH to enquire about courses\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eHTo get a seat, \u000f\u000eEyou need to arrive early.\u000f","p":1},{"t":"rule","x":"In the negative we cannot use a simple to-infinitive."},{"t":"wrong","x":"We were quiet not to disturb you."},{"t":"rule","x":"\u000eAInstead we use \u000f\u000eFso as\u000f\u000eA or \u000f\u000eFso that\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEWe were quiet \u000f\u000eHso as not to\u000f\u000eE disturb you.\u000f","p":1},{"t":"eg","x":"\u000eEWe were quiet\u000f\u000eH so that\u000f\u000eE we would\u000f\u000eHn’t\u000f\u000eE disturb you.\u000f","p":1}]},{"l":"D","b":[{"t":"sub","x":"Outcome"},{"t":"rule","x":"A to-infinitive clause sometimes expresses an outcome."},{"t":"eg","x":"\u000eELaura arrived home from work\u000f\u000eH to find her house on fire\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEThe prince grew \u000f\u000eHup to be a handsome young man\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eAWe can use \u000f\u000eFonly\u000f\u000eA to express the idea that effort has been wasted.\u000f","p":1},{"t":"eg","x":"\u000eEWe all arrived early \u000f\u000eHonly to find\u000f\u000eE it had been cancelled.\u000f","p":1}]},{"l":"E","b":[{"t":"sub","x":"Comment"},{"t":"rule","x":"A to-infinitive clause can express a comment on the speaker’s honesty."},{"t":"eg","x":"\u000eHTo tell you the truth,\u000f\u000eE I’ve had enough sightseeing for today.\u000f","p":1},{"t":"eg","x":"\u000eANote also \u000f\u000eFto be (perfectly) frank/honest\u000f\u000eI.\u000f","p":1}]},{"l":"F","b":[{"t":"sub","x":"To hear… /To see …"},{"t":"rule","x":"\u000eAWe can use a clause with \u000f\u000eFto hear\u000f\u000eA or \u000f\u000eFto see\u000f\u000eA to explain\u000f\u000eD why you could get the wrong idea.\u000f","p":1},{"t":"eg","x":"\u000eHTo hear him talk\u000f\u000eE, you’d think he was God’s gift to women.\u000f","p":1},{"t":"eg","x":"\u000eHTo see her in those clothes\u000f\u000eE, you’d never guess she was fabulously rich.\u000f","p":1},{"t":"tip","x":"A gerund as subject is more usual than an infinitive. Defrosting this fridge takes ages sounds better than To defrost this fridge takes ages."}]}]},{"n":66,"t":"Verb + to-infinitive or gerund?","u":"The Infinitive","s":[{"l":"A","b":[{"t":"rule","x":"We use a to-infinitive after certain verbs."},{"t":"eg","x":"\u000eEI \u000f\u000eHdecided to walk\u000f\u000eE to the hotel.\u000f","p":1},{"t":"rule","x":"Other verbs take a gerund."},{"t":"eg","x":"\u000eEI \u000f\u000eHsuggested walking\u000f\u000eE to the hotel.\u000f","p":1},{"t":"rule","x":"\u000eASome verbs take either form. \u000f\u000eB➤67\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"These verbs take a to-infinitive."},{"t":"rule","x":"afford, agree, aim, appear, arrange, ask, attempt, beg, care, choose, claim, consent, decide, demand, desire, expect, fail, happen, help, hesitate, hope, learn, manage, offer, plan, prepare, pretend, promise, prove, refuse, seek, seem, tend, threaten, turn out, volunteer, vote, can’t wait, want, wish."}]},{"l":"C","b":[{"t":"rule","x":"These verbs take a gerund."},{"t":"rule","x":"admit, avoid, consider, delay, deny, detest, dislike, enjoy, can’t face, fancy, finish, give up, can’t help, imagine, involve, justify, keep, keep on, mind, miss, postpone, practice, quit, resist, report, resent, resume, risk, suggest."}]},{"l":"D","b":[{"t":"rule","x":"\u000eIWant + to-infinitive\u000f\u000eA is a common pattern. \u000f\u000eIWish\u000f\u000eA and \u000f\u000eIdesire\u000f\u000eA are more formal.\u000f","p":1},{"t":"eg","x":"\u000eEDo you \u000f\u000eHwant to say anything\u000f\u000eE?\u000f","p":1},{"t":"sub","x":"\u000eEDo you \u000f\u000eHwish to make a comment\u000f\u000eE?\u000f","p":1},{"t":"rule","x":"\u000eIFancy + \u000f\u000eAgerund is informal.\u000f","p":1},{"t":"sub","x":"\u000eEDo you \u000f\u000eHfancy going out somewhere\u000f\u000eE?\u000f","p":1}]},{"l":"E","b":[{"t":"rule","x":"Look + to-infinitive can mean ‘seem’."}]},{"l":"E","b":[{"t":"rule","x":"Look + to-infinitive can mean ‘seem’."},{"t":"eg","x":"\u000eEThe company \u000f\u000eHlooks to be in\u000f\u000eE difficulties.\u000f","p":1},{"t":"rule","x":"In the continuous it can mean ‘aim to’."},{"t":"eg","x":"\u000eEWe \u000f\u000eHare looking to win\u000f\u000eE today.\u000f","p":1}]},{"l":"F","b":[{"t":"rule","x":"\u000eAWe use a to-infinitive after \u000f\u000eFask\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEThe customer \u000f\u000eHasked to see the manager\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eAUsually there is an object after \u000f\u000eFask\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEHe \u000f\u000eHasked the manager to sort\u000f\u000eE the problem out.\u000f","p":1}]},{"l":"G","b":[{"t":"rule","x":"\u000eAWe use \u000f\u000eFmind\u000f\u000eA and \u000f\u000eFcare\u000f\u000eA mainly in negatives and questions.\u000f","p":1},{"t":"eg","x":"\u000eEI d\u000f\u000eHon’t mind walking\u000f\u000eE if it’s fine.\u000f","p":1},{"t":"eg","x":"\u000eHWould\u000f\u000eE you\u000f\u000eH care to come\u000f\u000eE with us?\u000f","p":1}]},{"l":"H","b":[{"t":"rule","x":"\u000eIAllow\u000f\u000eA take a gerund.\u000f","p":1},{"t":"sub","x":"\u000eEThey \u000f\u000eHdon’t allow sunbathing here\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eABut when it has an object, \u000f\u000eFallow\u000f\u000eA takes a to-infinitive.\u000f","p":1},{"t":"eg","x":"\u000eEThey \u000f\u000eHdon’t allow you to sunbathe \u000f\u000eEhere.\u000f","p":1}]},{"l":"I","b":[{"t":"rule","x":"We can use a combination of forms."},{"t":"sub","x":"\u000eEI’m \u000f\u000eHafraid I failed to learn to ski\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHrefuse to risk losing\u000f\u000eE so much money.\u000f","p":1},{"t":"sub","x":"\u000eEWe \u000f\u000eHwere considering offering to help\u000f\u000eE.\u000f","p":1},{"t":"tip","x":"We can use agree with a to-infinitive, e.g. We agreed to pay the cost. But we cannot do the same with accept. We say We accepted that we should pay the cost, NOT We accepted to pay the cost."}]}]},{"n":67,"t":"Verbs talking either form","u":"The Infinitive","s":[{"l":"A","b":[{"t":"rule","x":"Some verbs can take either a to-infinitive or a gerund with no difference in meaning."},{"t":"sub","x":"\u000eEI \u000f\u000eHhate to arrive / hate arriving\u000f\u000eE late.\u000f","p":1},{"t":"eg","x":"\u000eEWe \u000f\u000eHintend to take / intend taking\u000f\u000eE action.\u000f","p":1},{"t":"sub","x":"\u000eEIf I soon\u000f\u000eH started to rain / started raining\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eAThese verbs are: \u000f\u000eFbegin, bother, can’t bear, can’t stand, cease, commence, continue, hate, intend, like, love, prefer, propose, start.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"We usually avoid two ing-forms together."},{"t":"sub","x":"\u000eEI \u000f\u000eHwas intending to study\u000f\u000eE law.\u000f","p":1},{"t":"wrong","x":"I was intending studying law"},{"t":"rule","x":"\u000eAAfter \u000f\u000eFbegin, \u0001continue\u0002\u000f\u000eD,\u000f\u000eA and \u000f\u000eFstart\u000f\u000eD,\u000f\u000eA a state verb usually has the to-infinitive form.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHbegan to understand\u000f\u000eE the problems.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"Like, love, and hate take either form."},{"t":"eg","x":"\u000eEKate likes to cook\u000f\u000eH / likes cooking\u000f\u000eE.\u000f","p":1},{"t":"sub","x":"\u000eEI \u000f\u000eHhate to travel / hate travelling\u000f\u000eE by bus.\u000f","p":1},{"t":"rule","x":"\u000eILike\u000f\u000eA takes a to-infinitive when something is a good idea rather than a pleasure.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHlike to keep\u000f\u000eE the place tidy.\u000f","p":1},{"t":"rule","x":"\u000eIWould like, would love\u000f\u000eD,\u000f\u000eA and \u000f\u000eIwould hate\u000f\u000eA normally take a to-infinitive.\u000f","p":1},{"t":"eg","x":"\u000eEOur guest \u000f\u000eHwould like to say\u000f\u000eE something\u000f","p":1},{"t":"eg","x":"\u000eEWe’d \u000f\u000eHlove to go\u000f\u000eE on a cruise.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"The to-infinitive and gerund have different meanings after the verbs on th u000eHsomething to read \u000f\u000eEon the train.\u000f","note":"something that you can read","p":1}]},{"l":"C","b":[{"t":"sub","x":"What to do"},{"t":"rule","x":"\u000eAWe can use a question word or phrase before a\u000f\u000eF \u0001to-infinitive\u0002.\u000f","p":1},{"t":"eg","x":"\u000eEI don’t know\u000f\u000eH what to say\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eENo one told Tom\u000f\u000eH where to meet \u000f\u000eEus.\u000f","p":1},{"t":"eg","x":"\u000eEI wasn’t sure\u000f\u000eH how much to tip \u000f\u000eEthe waiter\u000f","p":1},{"t":"rule","x":"The pattern expresses an indirect question about what the best action is."},{"t":"rule","x":"\u000eEI don’t know \u0001what\u0002 to say\u000f\u000eA means that I don’t know what I \u000f\u000eCshould\u000f\u000eA say\u000f","p":1},{"t":"rule","x":"\u000eAWe can also use \u000f\u000eFwhether + to-infinitive\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI was wondering\u000f\u000eH whether to ring \u000f\u000eEyou.\u000f","p":1},{"t":"eg","x":"\u000eEPaul can’t decide\u000f\u000eH whether to go \u000f\u000eEor not.\u000f","note":"He can’t decide whether he should go.","p":1},{"t":"rule","x":"\u000eAAfter \u000f\u000eEwhat, which, whose, how many\u000f\u000eD,\u000f\u000eA and \u000f\u000eEhow much\u000f\u000eD,\u000f\u000eA we can use a noun.\u000f","p":1},{"t":"eg","x":"\u000eEI didn’t know\u000f\u000eH what size to buy\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEThe driver wasn’t sure\u000f\u000eH which way to go\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eAWhen we talk about teaching and learning, we can use \u000f\u000eElearn (how) \u0001to\u0002\u000f\u000eD,\u000f\u000eE tell/show someone how to\u000f\u000eD, and \u000f\u000eEteach someone how to\u000f","p":1},{"t":"eg","x":"\u000eEStudents \u000f\u000eHlearn (how) to plan\u000f\u000eEtheir work.\u000f","p":1},{"t":"eg","x":"\u000eEThe instructor\u000f\u000eH showed us how to give\u000f\u000eE the kiss of life.\u000f","p":1},{"t":"tip","x":"\u000eADo not use an infinitive after if. Say\u000f\u000eE I don’t know whether to accept\u000f\u000eA but not \u000f\u000eEI don’t know if to accept\u000f","p":1}]}]},{"n":71,"t":"For and of with a to-infinitive","u":"The Infinitive","s":[{"l":"A","b":[{"t":"rule","x":"\u000eAWe can use a \u000f\u000eFto-infinitive\u000f\u000eA after \u000f\u000eFfor\u000f\u000eI + noun phrase.\u000f","p":1},{"t":"eg","x":"\u000eEMy wish is\u000f\u000eH for the world to be \u000f\u000eEat peace.\u000f","p":1},{"t":"eg","x":"\u000eEIt’s important\u000f\u000eH for her to train \u000f\u000eEregularly if she wants to compete.\u000f","p":1},{"t":"rule","x":"\u000eAThe noun phrase (\u000f\u000eEthe world, her\u000f\u000eA) is the \u000f\u000eDobject\u000f\u000eA of \u000f\u000eFfor\u000f\u000eA \u0001and\u0002 also functions as the \u000f\u000eDsubject\u000f\u000eA of the\u000f\u000eF \u0001to-infinitive\u0002\u000f\u000eA. A pronoun has the \u000f\u000eDobject form\u000f","p":1},{"t":"rule","x":"\u000eA(\u000f\u000eDher\u000f\u000eA).\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eAThe \u000f\u000eFfor-pattern\u000f\u000eA can begin a sentence.\u000f","p":1},{"t":"eg","x":"\u000eHFor a newspaper to publish \u000f\u000eEsuch lies is absolutely disgraceful.\u000f","p":1},{"t":"rule","x":"\u000eABut more often we use \u000f\u000eFit\u000f\u000eA as the subject.\u000f","p":1},{"t":"eg","x":"\u000eHIt \u000f\u000eEis absolutely disgraceful\u000f\u000eH for a newspaper to publish \u000f\u000eEsuch lies.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"The pattern can express purpose."},{"t":"rule","x":"\u000eHFor plants to grow \u000f\u000eEproperly, you need to water them regularly.\u000f","p":1},{"t":"eg","x":"\u000eEThere are telephones\u000f\u000eH for drivers to call f\u000f\u000eEor help if they break down.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"\u000eAWe can use the pattern after a verb which combines with \u000f\u000eFfor\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEWe’ve arranged\u000f\u000eH for plans to be drawn\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEIt took ages\u000f\u000eH for everyone to check in\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEI’ll wait\u000f\u000eH for you to finish your \u000f\u000eEbreakfast.\u000f","p":1},{"t":"rule","x":"\u000eASuch verbs are: \u000f\u000eEarrange \u0001for\u0002, ask for, call for, look for, pay for, send for, take (time) for, wait for.\u000f","p":1}]},{"l":"E","b":[{"t":"rule","x":"Many adjectives and nouns which take a \u0001to-infinitive\u0002 can also take the pattern with \u0001for\u0002. For example, we can say something is easy to do or easy for someone to do."},{"t":"eg","x":"\u000eEIt’s easy\u000f\u000eH for people to criticize\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEThere’s no need\u000f\u000eH for you to go\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEI’ve brought some photos\u000f\u000eH for everyone to have \u000f\u000eEa look at.\u000f","p":1}]},{"l":"F","b":[{"t":"rule","x":"\u000eAWe use \u000f\u000eFof + noun phrase + to-infinitive\u000f\u000eA after adjectives that say what people are like or how they behave.\u000f","p":1},{"t":"eg","x":"\u000eEIt was kind\u000f\u000eH of you to help \u000f\u000eEme.\u000f","p":1},{"t":"eg","x":"\u000eEIt was rude\u000f\u000eH of your friend not to shake \u000f\u000eEhands with anyone.\u000f","p":1},{"t":"rule","x":"The adjectives include: brave, careless, clever, foolish, generous, good, kind, mean, nice, rude, selfish, silly, stupid, typical, unfair, unreasonable, unwise, wrong."},{"t":"rule","x":"\u000eASome of these adjectives can take the pattern with \u000f\u000eFfor\u000f\u000eA. Compare these sentences.\u000f","p":1},{"t":"eg","x":"\u000eEIt was nice \u000f\u000eHof\u000f\u000eE Tom to walk the dog.\u000f","note":"It was a kind action by Tom.","p":1},{"t":"eg","x":"\u000eEIt was nice\u000f\u000eH for Tom\u000f\u000eE to walk the dog.\u000f","note":"It was a pleasant experience for Tom.","p":1},{"t":"tip","x":"\u000eAYou can use \u000f\u000eFof\u000f\u000eA in this sense when thanking someone, e.g. \u000f\u000eDT\u000f\u000eEhat’s very kind of you \u000f\u000eAor \u000f\u000eEIt was very good of you to help.\u000f","p":1}]}]},{"n":72,"t":"The infinitive without to","u":"The Infinitive","s":[{"l":"A","b":[{"t":"sub","x":"\u000eCAn \u000f\u000eJinfinitive without \u000f\u000eLto\u000f\u000eC can have these forms.\u000f","p":1},{"t":"sub","x":"\u000eCSimple: \u000f\u000eDdo\u000f","p":1},{"t":"rule","x":"\u000eCPerfect: \u000f\u000eDhave done\u000f","p":1},{"t":"rule","x":"\u000eCContinuous: \u000f\u000eDbe doing\u000f","p":1},{"t":"rule","x":"\u000eCPerfect + continuous: \u000f\u000eDhave been doing\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eAWe use the \u000f\u000eFinfinitive \u0001without\u0002 \u0001to\u0002\u000f\u000eA after a modal verb.\u000f","p":1},{"t":"eg","x":"\u000eENothing \u000f\u000eHwill go \u000f\u000eEwrong.\u000f","p":1},{"t":"eg","x":"\u000eEYou \u000f\u000eHcould have phoned \u000f\u000eEme.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHshould be \u000f\u000eEworking really.\u000f","p":1},{"t":"eg","x":"\u000eEYour friend\u000f\u000eH must have been joking\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eABut note \u000f\u000eEbe able to, be allowed to, be going to, have to, ought to\u000f\u000eD,\u000f\u000eA and \u000f\u000eEought to.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHought to be working\u000f\u000eE really.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"\u000eAWe use the \u000f\u000eFinfinitive \u0001without\u0002 \u0001to\u0002\u000f\u000eA after\u000f\u000eF had better, would rather,\u000f\u000eA and \u000f\u000eFrather than\u000f\u000eI.\u000f","p":1},{"t":"eg","x":"\u000eEWe’d \u000f\u000eHbetter not be\u000f\u000eE late.\u000f","p":1},{"t":"eg","x":"\u000eEI’d \u000f\u000eHrather have stayed\u000f\u000eE in than gone out.\u000f","p":1},{"t":"eg","x":"\u000eEThey decided to accept the offer\u000f\u000eH rather than take/taking \u000f\u000eEtheir case to court.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"\u000eFMake\u000f\u000eD, \u000f\u000eFlet\u000f\u000eD,\u000f\u000eA and \u000f\u000eFhave\u000f\u000eA can take an object and an \u000f\u000eFinfinitive \u0001without\u0002 \u0001to\u0002.\u000f","p":1},{"t":"eg","x":"\u000eAT\u000f\u000eEhe official \u000f\u000eHmade me fill\u000f\u000eE out a form.\u000f","p":1},{"t":"eg","x":"\u000eHThey let the pupils go\u000f\u000eE home early.\u000f","p":1},{"t":"eg","x":"\u000eEI'll \u000f\u000eHhave the porter bring \u000f\u000eEup your bags.\u000f","note":"I’ll tell the porter to bring up your bags.","p":1},{"t":"rule","x":"\u000eAHere are some more examples with \u000f\u000eIlet\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI can’t \u000f\u000eHlet you have\u000f\u000eE a copy.\u000f\u000eA (give you)\u000f","p":1},{"t":"eg","x":"\u000eEPlease \u000f\u000eHlet us know\u000f\u000eE.\u000f\u000eA (tell us)\u000f","p":1},{"t":"eg","x":"\u000eHLet me go\u000f\u000eE or I’ll scream\u000f\u000eA. (release me)\u000f","p":1},{"t":"rule","x":"\u000eACompare \u000f\u000eFforce\u000f\u000eA, \u000f\u000eFallow\u000f\u000eA, and \u000f\u000eFget\u000f\u000eA, which all take a \u000f\u000eFto-infinitive.\u000f","p":1},{"t":"eg","x":"\u000eEThe gunman \u000f\u000eHforced the pilot to land\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEThey \u000f\u000eHallowed the pupils to go\u000f\u000eE home early.\u000f","p":1},{"t":"eg","x":"\u000eEI’ll \u000f\u000eHget the porter to bring\u000f\u000eE up your bags.\u000f","p":1}]},{"l":"E","b":[{"t":"rule","x":"\u000eFHear\u000f\u000eD, \u000f\u000eFsee\u000f\u000eD,\u000f\u000eA etc can take an object and an \u000f\u000eFinfinitive \u0001without\u0002 \u0001to\u0002\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEDid you \u000f\u000eHsee the men leave\u000f\u000eE the building?\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHheard someone knock\u000f\u000eE on the door.\u000f","p":1},{"t":"sub","x":"\u000eEWe \u000f\u000eHfelt the ground shake\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eAWe can also use a participle.  \u000f\u000eB➤81\u000f","p":1},{"t":"eg","x":"\u000eEWe felt the ground \u000f\u000eHshaking\u000f","p":1}]},{"l":"F","b":[{"t":"rule","x":"\u000eAAfter \u000f\u000eFexcept\u000f\u000eA and \u000f\u000eFbut\u000f\u000eA (= except), we normally use an\u000f\u000eF infinitive \u0001without\u0002 \u0001to\u0002.\u000f","p":1},{"t":"eg","x":"\u000eEIn the flat I do everything\u000f\u000eH except cook\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEYou’ve done nothing\u000f\u000eH but grumble\u000f\u000eE all day.\u000f","p":1}]},{"l":"G","b":[{"t":"rule","x":"\u000eAWe sometimes put an infinitive after \u000f\u000eFbe\u000f\u000eA when explaining what action we mean.\u000f","p":1},{"t":"eg","x":"\u000eEThe only thing I can do\u000f\u000eH is (to) apologize\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"The infinitive can be with or \u0001without\u0002 \u0001to\u0002."},{"t":"tip","x":"\u000eAWe say \u000f\u000eEthey made me wait\u000f\u000eA \u0001without\u0002 \u000f\u000eDto,\u000f\u000eA but with \u000f\u000eEmake\u000f\u000eA in \u0001the\u0002 passive we use the to-infinitive:\u000f\u000eE I was made \u0001to\u0002 wait.\u000f","p":1}]}]},{"n":73,"t":"The gerund","u":"Gerunds & Participles","s":[{"l":"A","b":[{"t":"sub","x":"\u000eAT\u000f\u000eChese are the forms of the gerund.\u000f","p":1},{"t":"rule","x":"\u000eCSimple: \u000f\u000eDdoing\u000f","p":1},{"t":"eg","x":"\u000eEIt was nice \u000f\u000eHmeeting\u000f\u000eE you.\u000f","p":1},{"t":"rule","x":"\u000eCPerfect: \u000f\u000eDhaving done\u000f","p":1},{"t":"eg","x":"\u000eEHe gave no sign of\u000f\u000eH having understood\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"\u000eCSimple passive: \u000f\u000eDbeing done\u000f","p":1},{"t":"eg","x":"\u000eEI was angry at\u000f\u000eH being teased\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eCPerfect passive: \u000f\u000eDhaving been done\u000f","p":1},{"t":"eg","x":"\u000eEThe cyclist was compensated for\u000f\u000eH having been injured\u000f\u000eE in the accident.\u000f","p":1},{"t":"rule","x":"\u000eAThere are some spelling rules for the \u000f\u000eFing-form\u000f\u000eA. \u000f\u000eB➤178\u000f","p":1},{"t":"rule","x":"\u000eAIn the negative, \u000f\u000eFnot\u000f\u000eA comes before the gerund.\u000f","p":1},{"t":"eg","x":"\u000eEIt was awful\u000f\u000eH not hearing\u000f\u000eE any news.\u000f","p":1},{"t":"eg","x":"\u000eEI regret\u000f\u000eH not having learned\u000f\u000eE the language.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"A gerund can be followed by an object or a complement and/or by one or more adverbials. The gerund together with such phrases is a gerund clause."},{"t":"eg","x":"\u000eENo one likes\u000f\u000eH cleaning shoes\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eHBeing a doctor \u000f\u000eEmeans people always want your advice.\u000f","p":1},{"t":"eg","x":"\u000eHGoing on holiday \u000f\u000eEmakes me nervous.\u000f","p":1},{"t":"rule","x":"Or a gerund clause can be just a gerund on its own."},{"t":"eg","x":"\u000eEDo you like\u000f\u000eH dancing\u000f\u000eE?\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"A gerund clause can have a subject."},{"t":"rule","x":"It comes before the gerund."},{"t":"eg","x":"\u000eEWe rely on\u000f\u000eH our neighbour watering plants \u000f\u000eEwhile we’re away.\u000f","p":1},{"t":"eg","x":"\u000eEI dislike\u000f\u000eH journalists asking \u000f\u000eEme questions\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"\u000eAThe subject can be possessive. Typical possessive subjects are \u000f\u000eFmy, your,\u000f\u000eA etc or a\u000f\u000eF name + 's\u000f","p":1},{"t":"eg","x":"\u000eEIt’s a nuisance \u000f\u000eHyou/your coming \u000f\u000eEin late.\u000f","p":1},{"t":"eg","x":"\u000eEDo you mind \u000f\u000eHme/my sitting \u000f\u000eEhere?\u000f","p":1},{"t":"eg","x":"\u000eEI’m fed up with\u000f\u000eH Sarah/Sarah’s laughing \u000f\u000eEat my accent.\u000f","p":1},{"t":"rule","x":"Both forms have the same meaning here. But the possessive is more formal, and it is less usual in everyday speech."},{"t":"rule","x":"A possessive is more likely at the beginning of a sentence."},{"t":"eg","x":"\u000eHYour coming \u000f\u000eEin late is a nuisance.\u000f","p":1},{"t":"eg","x":"\u000eHSarah’s laughing \u000f\u000eEat my accent is getting on my nerves.\u000f","p":1},{"t":"tip","x":"A gerund is sometimes referred to as an \u0001ing-form\u0002. But an \u0001ing-form\u0002 can be an active participle as well as a gerund. Gerund: Jogging isn’t my idea of fun. PARTICIPLE: He was jogging along the street. BUT remember that it is more important to use the forms correctly than to worry about what to call them."}]}]},{"n":74,"t":"Some patterns with the gerund","u":"Gerunds & Participles","s":[{"l":"A","b":[{"t":"sub","x":"As subject and complement"},{"t":"rule","x":"\u000eAThe gerund clause can be the \u000f\u000eDsubject\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eHDigging\u000f\u000eE is hard work.\u000f","p":1},{"t":"eg","x":"\u000eHChoosing the colour\u000f\u000eE won’t be easy.\u000f","p":1},{"t":"rule","x":"\u000eAWhen we use \u000f\u000eFit\u000f\u000eA as the subject, the gerund clause comes at or near the end of the sentence.\u000f","p":1},{"t":"eg","x":"\u000eEIt won’t be easy \u000f\u000eHchoosing the colour.\u000f","p":1},{"t":"rule","x":"\u000eAThe gerund clause can also \u0001be\u0002 a complement after \u000f\u000eFbe\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEMy worst fear is \u000f\u000eHhaving nowhere to live\u000f\u000eE.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"\u000eLIt\u000f\u000eC, \u000f\u000eLthere\u000f\u000eC, and \u000f\u000eLhave\u000f","p":1},{"t":"rule","x":"\u000eAWe often use a gerund after the subject \u000f\u000eFit\u000f\u000eA and certain expressions.\u000f","p":1},{"t":"eg","x":"\u000eHIt’s \u000f\u000eEno \u000f\u000eHgood\u000f\u000eE / no \u000f\u000eHuse arguing\u000f\u000eE with me.\u000f","p":1},{"t":"eg","x":"\u000eHIt \u000f\u000eEmight be \u000f\u000eHworth taking\u000f\u000eE the tour.\u000f","p":1},{"t":"eg","x":"\u000eHIt \u000f\u000eEwas an \u000f\u000eHexperience seeing\u000f\u000eE a rodeo.\u000f","p":1},{"t":"eg","x":"\u000eHIt’s \u000f\u000eEa \u000f\u000eHnuisance being\u000f\u000eE without electricity.\u000f","p":1},{"t":"eg","x":"\u000eHIt’s fun skiing\u000f\u000eE down a mountain.\u000f","p":1},{"t":"rule","x":"\u000eAWe can use a gerund after \u000f\u000eFthere\u000f\u000eI ... \u000f\u000eFproblem/difficulty\u000f\u000eA and \u000f\u000eFthere\u000f\u000eI ... \u000f\u000eFpoint\u000f\u000eI.\u000f","p":1},{"t":"eg","x":"\u000eHThere\u000f\u000eE won’t be any \u000f\u000eHproblem parking\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eHThere\u000f\u000eE is no \u000f\u000eHpoint waiting\u000f\u000eE any longer.\u000f","p":1},{"t":"rule","x":"\u000eAThere is also a pattern with \u000f\u000eFhave\u000f\u000eA (= experience) and a gerund.\u000f","p":1},{"t":"eg","x":"\u000eEYou won’t \u000f\u000eHhave any problem parking.\u000f","p":1},{"t":"eg","x":"\u000eEWe \u000f\u000eHhad fun skiing\u000f\u000eE down the mountain.\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"Verb + gerund"},{"t":"rule","x":"Some verbs take a gerund."},{"t":"eg","x":"\u000eEThese people \u000f\u000eHkeep sending\u000f\u000eE me emails\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"\u000eAFor a list of these verbs \u000f\u000eB➤66C\u000f\u000eA.\u000f","p":1}]},{"l":"D","b":[{"t":"sub","x":"Verb + object + gerund"},{"t":"rule","x":"We can use a gerund after a verb + object."},{"t":"eg","x":"\u000eEI can’t \u000f\u000eHimagine people buying\u000f\u000eE that.\u000f","p":1},{"t":"eg","x":"\u000eEThe arrangements \u000f\u000eHinvolve us giving\u000f\u000eE two other people a lift.\u000f","p":1},{"t":"rule","x":"\u000eAThe object of the verb (\u000f\u000eEpeople, us\u000f\u000eA) also functions as the subject of the gerund.\u000f","p":1},{"t":"rule","x":"\u000eAA pronoun has the \u000f\u000eDobject form\u000f\u000eA (\u000f\u000eEus\u000f\u000eA).\u000f","p":1},{"t":"rule","x":"\u000eAWe can use a possessive form. \u000f\u000eB➤73C\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEThe arrangements \u000f\u000eHinvolve your giving\u000f\u000eE two other people a lift.\u000f","p":1},{"t":"rule","x":"The verbs we can use before an object + gerund include: avoid, can’t bear, discuss, dislike, enjoy, excuse, experience, (not) fancy, forget, hate, can’t help, imagine, involve, justify, mind, miss, practice, remember, resent, risk, save, stop, tolerate, unde rstand."},{"t":"tip","x":"Use a gerund at the start of a sentence or a to-infinitive at the end. Say Booking early was a good idea or It was a good idea to book early."}]}]},{"n":75,"t":"Preposition + gerund","u":"Gerunds & Participles","s":[{"l":"A","b":[{"t":"rule","x":"We sometimes use a gerund after a preposition."},{"t":"eg","x":"\u000eEI drove all the way \u000f\u000eHwithout stopping\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eAWe \u000f\u000eDcannot\u000f\u000eA use a \u000f\u000eFto-infinitive\u000f\u000eA or a \u000f\u000eFthat-clause\u000f\u000eA here.\u000f","p":1},{"t":"wrong","x":"I drove all the way without to stop."},{"t":"wrong","x":"I drove all the way without I stopped."},{"t":"rule","x":"\u000eAFor the gerund after combinations of \u000f\u000eIverb/adjective/noun + preposition\u000f\u000eA, \u000f\u000eB➤76\u000f\u000eA.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"Here are some more examples."},{"t":"eg","x":"\u000eEI got there \u000f\u000eHby hitching\u000f\u000eE a lift.\u000f","p":1},{"t":"eg","x":"\u000eHInstead of landing\u000f\u000eE at Heathrow, we had to go to Manchester.\u000f","p":1},{"t":"eg","x":"\u000eEPlease turn off the lights \u000f\u000eHbefore leaving\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eHFar from being\u000f\u000eE the end of the story, it was only the beginning.\u000f","p":1},{"t":"eg","x":"\u000eEI felt tired \u000f\u000eHin spite of having\u000f\u000eE slept well.\u000f","p":1},{"t":"eg","x":"\u000eEThe drug was finally approved for sale \u000f\u000eHafter being tested\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"We can use a gerund after these prepositions: after, against, as a result of, as well as, because of, before, besides, by, by means of, despite, far from, for, how/what about, in, in addition to, in favour of, in spite of, instead of, on, on account of, since, through, with, without."}]},{"l":"C","b":[{"t":"rule","x":"With most of these prepositions, the gerund can have a subject."},{"t":"eg","x":"\u000eEThe picture was hanging upside down \u000f\u000eHwithout anyone noticing\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eHDespite me/my refusing \u000f\u000eEhim, he completely forgot.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"\u000eFOn\u000f\u000eA and \u000f\u000eFin\u000f\u000eA have special meanings in this pattern.\u000f","p":1},{"t":"eg","x":"\u000eHOn turning\u000f\u000eE the corner, I saw a most unexpected sight.\u000f","note":"As soon as I had turned the corner, ...","p":1},{"t":"eg","x":"\u000eHIn building\u000f\u000eE the motorway, they attracted new industry to the area.\u000f","note":"As a result of building the motorway, ...","p":1},{"t":"rule","x":"\u000eAThis use of \u000f\u000eFon\u000f\u000eA and \u000f\u000eFin\u000f\u000eA is a little formal.\u000f","p":1}]},{"l":"E","b":[{"t":"rule","x":"\u000eAWe can use \u000f\u000eDf\u000f\u000eFor\u000f\u000eI + gerund\u000f\u000eA to explain the use or purpose of something.\u000f","p":1},{"t":"eg","x":"\u000eEThese pages are \u000f\u000eHfor making\u000f\u000eE notes on.\u000f","p":1}]},{"l":"F","b":[{"t":"rule","x":"\u000eAWe can also use a gerund after \u000f\u000eFthan\u000f\u000eD, \u000f\u000eFas\u000f\u000eD,\u000f\u000eA and \u000f\u000eFlike\u000f\u000eA expressing comparison.\u000f","p":1},{"t":"eg","x":"\u000eEA holiday is nicer \u000f\u000eHthan sitting \u000f\u000eEat a desk.\u000f","p":1},{"t":"eg","x":"\u000eEWalking is good for you, but not as good \u000f\u000eHas swimming\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEGetting information from the company is \u000f\u000eHlike getting\u000f\u000eE blood out of a stone.\u000f","p":1},{"t":"tip","x":"\u000eAYou can use \u000f\u000eFhow about\u000f\u000eA or \u000f\u000eFwhat about\u000f\u000eI + gerund\u000f\u000eA to make a suggestion, e.g. \u000f\u000eHHow about going\u000f\u000eE to the park\u000f\u000eA?\u000f","p":1}]}]},{"n":76,"t":"Combination + gerund","u":"Gerunds & Participles","s":[{"l":"A","b":[{"t":"sub","x":"Verb + preposition"},{"t":"rule","x":"\u000eAWe can use a gerund after a prepositional verb such as \u000f\u000eEthink of\u000f\u000eA or \u000f\u000eEinsist on\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI’m \u000f\u000eHthinking of selling\u000f\u000eE my car.\u000f","p":1},{"t":"eg","x":"\u000eEPaul \u000f\u000eHinsists on getting\u000f\u000eE there early.\u000f","p":1},{"t":"eg","x":"\u000eEThey \u000f\u000eHapologized for making\u000f\u000eE a mess.\u000f","p":1},{"t":"rule","x":"Other prepositional verbs in this pattern include: dis/agree with, (dis)approve of, believe in, care for, complain about, concentrate on, cope with, count on, depend on, dream about/of, feel like, get on with, protest at/about, put up with, refrain from, rely on, succeed in, talk about, vote for, worry about. For prepositional verbs with \u0001to\u0002, ➤77C."}]},{"l":"B","b":[{"t":"sub","x":"Verb + object + preposition"},{"t":"rule","x":"\u000eAWe can use a gerund after a \u000f\u000eFverb + object + preposition\u000f\u000eA.\u000f","p":1},{"t":"sub","x":"\u000eEThey \u000f\u000eHforgive me for interrupting.\u000f","p":1},{"t":"sub","x":"\u000eEHuman \u000f\u000eHsaved the child from drowning\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eAOther verbs in this pattern include: \u000f\u000eEaccuse … of, arrest …  and adjectives we can use either \u000f\u000eIa preposition + gerund\u000f\u000eA or\u000f\u000eI a to-infinitive\u000f\u000eA with no difference in meaning.\u000f","p":1},{"t":"eg","x":"\u000eEThe people \u000f\u000eHvoted for joining / to join\u000f\u000eE the European Community.\u000f","p":1},{"t":"rule","x":"Other examples are: aim at doing / to \u0001do\u0002, annoyed at finding / to find, content with being / to be, excited at seeing / to see, grateful for having / to have, surprised at finding / to find."}]},{"l":"B","b":[{"t":"rule","x":"Sometimes there are two different patterns with different uses. Compare the examples."},{"t":"rule","x":"I don’t agree with dumping waste in the sea. (I don’t think it’s right. Agree = to approve to approve of something because you think it is morally right. used especially in negative sentences)"},{"t":"eg","x":"\u000eEWe all \u000f\u000eHagreed to meet\u000f\u000eE the next day\u000f\u000eD. \u000f\u000eA(We decided to meet. Agree = decide)\u000f","p":1},{"t":"eg","x":"\u000eEThis \u000f\u000eHreminds me of walking\u000f\u000eE in Scotland years ago.\u000f\u000eD (\u000f\u000eAbrings back a memory, or you think of something because of it. \u000f","p":1},{"t":"rule","x":"\u000eFRemind someone of doing something\u000f\u000eA” is rare and often sounds unnatural unless it clearly refers to a memory of a past experience. \u000f","p":1},{"t":"rule","x":"\u000eAUsually English prefers: \u000f\u000eFremind me of + noun; remind me about + noun / action\u000f\u000eD)\u000f","p":1},{"t":"eg","x":"\u000eEWhy didn’t you \u000f\u000eHremind me to bring\u000f\u000eE a map? \u000f\u000eA(to do something in the future)\u000f","p":1},{"t":"eg","x":"\u000eEKaren was \u000f\u000eHpleased about winning\u000f\u000eE / to win a prize.\u000f\u000eD (pleased about a past event. feeling happy about something)\u000f","p":1},{"t":"eg","x":"\u000eEI’m \u000f\u000eHpleased to meet\u000f\u000eE you.\u000f\u000eD (in the present. happy or willing to do
