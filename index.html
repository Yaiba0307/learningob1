) after: admit \u0001to\u0002, close \u0001to\u0002, confess \u0001to\u0002, look forward \u0001to\u0002, object \u0001to\u0002, opposed \u0001to\u0002, resigned \u0001to\u0002, resort \u0001to\u0002, be used \u0001to\u0002. ➤58B."},{"t":"tip","x":"When you arrange to see someone that you haven’t seen for a while, it is polite to say I look forward to seeing you. (NOT I look forward to see you.)"}]}]},{"n":78,"t":"Determiner + gerund","u":"Gerunds & Participles","s":[{"l":"A","b":[{"t":"rule","x":"\u000eAWe can sometimes put a determiner such as \u000f\u000eFthe\u000f\u000eA before a gerund.\u000f","p":1},{"t":"eg","x":"\u000eENancy likes her new job, but t\u000f\u000eHhe driving\u000f\u000eE makes her tired\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"Compare the two sentences."},{"t":"eg","x":"\u000eHDriving\u000f\u000eE makes her tired.\u000f","note":"all driving, driving in general","p":1},{"t":"eg","x":"\u000eHThe driving\u000f\u000eE makes her tired.\u000f","note":"the driving she does in her job","p":1},{"t":"rule","x":"\u000eIThe\u000f\u000eA + gerund is specific rather than general.\u000f","p":1},{"t":"rule","x":"\u000eAWe use \u000f\u000eFdo the + gerund\u000f\u000eA for some types of work, especially routine housework.\u000f","p":1},{"t":"eg","x":"\u000eEI usually \u000f\u000eHdo the cleaning\u000f\u000eE at weekends.\u000f","p":1},{"t":"eg","x":"\u000eESomeone \u000f\u000eHdoes the gardening\u000f\u000eE for us.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eAAs well as \u000f\u000eFthe\u000f\u000eA, we can use \u000f\u000eFthis, that, some, no, a lot of, a little, a bit of,\u000f\u000eA and \u000f\u000eFmuch\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eHThis arguing\u000f\u000eE gets on my nerves.\u000f","p":1},{"t":"eg","x":"\u000eEI might do \u000f\u000eHsome fishing\u000f\u000eE at the weekend.\u000f","p":1},{"t":"sub","x":"\u000eHNo parking\u000f\u000eE (Parking is not allowed.)\u000f","p":1},{"t":"eg","x":"\u000eEI’d better do \u000f\u000eHa bit of tidying\u000f\u000eE up.\u000f","p":1},{"t":"eg","x":"\u000eELuckily there isn’t \u000f\u000eHmuch ironing\u000f\u000eE to do.\u000f","p":1},{"t":"rule","x":"We can also use a possessive."},{"t":"eg","x":"\u000eHYour driving\u000f\u000eE terrifies me.\u000f","note":"the way you drive","p":1},{"t":"rule","x":"(the way you drive)"},{"t":"rule","x":"\u000eACompare the subject \u000f\u000eFyour\u000f\u000eA. \u000f\u000eB➤73C\u000f","p":1},{"t":"eg","x":"\u000eHYour driving\u000f\u000eE isn’t advisable. You’re tired.\u000f","note":"the idea of you driving","p":1}]},{"l":"C","b":[{"t":"rule","x":"The gerund cannot be plural."},{"t":"wrong","x":"Your drivings terrify me."},{"t":"rule","x":"\u000eABut there are some words formed from \u000f\u000eFverb + -ing\u000f\u000eA which are ordinary nouns and \u000f\u000eDcan be plural.\u000f","p":1},{"t":"eg","x":"\u000eEI have attended a lot of \u000f\u000eHmeetings\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEWe were surrounded by tall \u000f\u000eHbuildings\u000f\u000eE.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"A gerund clause can have an object."},{"t":"eg","x":"\u000eEOur main job is \u000f\u000eHkeeping records\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eHPlaying ball games\u000f\u000eE is prohibited.\u000f","p":1},{"t":"rule","x":"\u000eASometimes we can use the pattern \u000f\u000eFthe + gerund + of + object.\u000f","p":1},{"t":"eg","x":"\u000eEOur main job is \u000f\u000eHthe keeping of records\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eHThe playing of ball games\u000f\u000eE is prohibited.\u000f","p":1},{"t":"rule","x":"\u000eAThis pattern with \u000f\u000eFof\u000f\u000eA can be rather formal and is typical of an official, written style.\u000f","p":1},{"t":"rule","x":"\u000eASometimes the noun phrase after \u000f\u000eFof\u000f\u000eA is the understood subject.\u000f","p":1},{"t":"eg","x":"\u000eEI was suddenly woken up by \u000f\u000eHthe ringing of the telephone\u000f\u000eE.\u000f","note":"The phone was ringing.","p":1},{"t":"tip","x":"In the of-pattern we often use other abstract nouns rather than a gerund. For example, the management of the economy is more usual than the managing of the economy, and the education of the children more usual than the educating of the children."}]}]},{"n":79,"t":"Participles","u":"Gerunds & Participles","s":[{"l":"A","b":[{"t":"rule","x":"\u000eAThere are \u000f\u000eDthree\u000f\u000eA main participle forms.\u000f","p":1},{"t":"rule","x":"\u000eAAn \u000f\u000eFactive participle\u000f\u000eA is a\u000f\u000eI verb + \u000f\u000eF-ing\u000f\u000eA, sometimes called a \u000f\u000eI‘present’ participle\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI fell asleep \u000f\u000eHwatching\u000f\u000eE television.\u000f","p":1},{"t":"rule","x":"\u000eAFor spelling rules, \u000f\u000eB➤178\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"\u000eAThe\u000f\u000eF past participle\u000f\u000eA has a regular ending in \u000f\u000eF-ed\u000f\u000eA. For spelling rules, \u000f\u000eB➤177B\u000f\u000eA, \u000f\u000eB178B\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI’ve \u000f\u000eHwatched\u000f\u000eE all these DVDs.\u000f","p":1},{"t":"rule","x":"\u000eAFor irregular forms: \u000f\u000eBTable\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEThe journey has \u000f\u000eHtaken\u000f\u000eE a long time.\u000f","p":1},{"t":"rule","x":"\u000eAThe \u000f\u000eFpassive participle\u000f\u000eA has the \u000f\u000eDsame form\u000f\u000eA as the past participle.\u000f","p":1},{"t":"eg","x":"\u000eEThe game was \u000f\u000eHwatched\u000f\u000eE by a few people.\u000f","p":1},{"t":"eg","x":"\u000eHTaken\u000f\u000eE by surprise, he just stood there.\u000f","p":1},{"t":"rule","x":"\u000eAWe can put \u000f\u000eFnot\u000f\u000eA before a participle.\u000f","p":1},{"t":"eg","x":"\u000eEIsat there \u000f\u000eHnot listening\u000f\u000eE to a word.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eAThe participles combine with \u000f\u000eJbe\u000f\u000eA or \u000f\u000eJhave\u000f\u000eA in the following verb forms.\u000f","p":1},{"t":"rule","x":"Continuous: be + active participle"},{"t":"eg","x":"\u000eEThe train \u000f\u000eHwas stopping\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"Perfect: have + past participle"},{"t":"eg","x":"\u000eEMy watch \u000f\u000eHhas stopped.\u000f","p":1},{"t":"rule","x":"Passive: be + passive participle"},{"t":"eg","x":"\u000eEWe \u000f\u000eHwere stopped\u000f\u000eE by the police.\u000f","p":1},{"t":"rule","x":"On the following pages, other uses of the participles are dealt with."}]},{"l":"C","b":[{"t":"eg","x":"As well as the main participles, there are three more complex forms."},{"t":"rule","x":"\u000eCPerfect participle: \u000f\u000eFhaving + past participle\u000f","p":1},{"t":"eg","x":"\u000eHHaving cooked\u000f\u000eE the meal, they ate.\u000f","p":1},{"t":"rule","x":"\u000eCPerfect passive participle: \u000f\u000eFhaving been + passive participle\u000f","p":1},{"t":"eg","x":"\u000eEThe meal \u000f\u000eHhaving been cooked\u000f\u000eE, they ate.\u000f","p":1},{"t":"rule","x":"\u000eCContinuous passive participle: \u000f\u000eFbeing + passive participle\u000f","p":1},{"t":"eg","x":"\u000eEThey watched the meal\u000f\u000eH being cooked\u000f\u000eE.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"A participle can be followed by an object or complement and/or by one or more adverbials in a participle clause."},{"t":"eg","x":"\u000eEWe saw a policeman \u000f\u000eHchasing someone.\u000f","p":1},{"t":"eg","x":"\u000eHInjured in the leg\u000f\u000eE, he left the field.\u000f","p":1},{"t":"rule","x":"Or the clause can be just a participle."},{"t":"eg","x":"\u000eEI just lay there \u000f\u000eHthinking\u000f\u000eE.\u000f","p":1}]},{"l":"E","b":[{"t":"rule","x":"A participle clause can sometimes have a subject."},{"t":"eg","x":"\u000eHThe flat being untidy,\u000f\u000eE I had to clear up.\u000f","p":1},{"t":"eg","x":"\u000eHThe lights having fused\u000f\u000eE, it was dark.\u000f","p":1},{"t":"tip","x":"To avoid writing sentences like this: Walking along the street, a car raced past. This ‘hanging participle’ (walking) makes it sound as if the car was walking, which is nonsense. The subject of the main clause should be the people walking. Write: Walking along the street, we saw a car race past."}]}]},{"n":80,"t":"Participle + noun","u":"Gerunds & Participles","s":[{"l":"A","b":[{"t":"rule","x":"\u000eAWe can use an\u000f\u000eF active or passive participle\u000f\u000eA before a noun.\u000f","p":1},{"t":"eg","x":"\u000eHCheering crowds\u000f\u000eE welcomed the team.\u000f","note":"crowds who were cheering","p":1},{"t":"eg","x":"\u000eHBoiling water\u000f\u000eE turns to steam.\u000f","note":"water which is boiling","p":1},{"t":"eg","x":"\u000eEThe \u000f\u000eHdamaged goods\u000f\u000eE were unsaleable.\u000f","note":"goods which had been damaged","p":1},{"t":"eg","x":"\u000eEThe terrorists used a \u000f\u000eHstolen car\u000f\u000eE.\u000f","note":"a car which had been stolen","p":1},{"t":"rule","x":"\u000eAThe participle functions like an \u000f\u000eDadjective\u000f\u000eA. Compare \u000f\u000eEcheering crowds / noisy crowds\u000f\u000eA and \u000f\u000eEboiling water / hot water\u000f\u000eA.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eASometimes we use a participle with a \u000f\u000eFprefix\u000f\u000eA (e.g. \u000f\u000eFre-, \u0001mis-\u0002\u000f\u000eA).\u000f","p":1},{"t":"eg","x":"\u000eEa \u000f\u000eHrewritten\u000f\u000eE version\u000f","p":1},{"t":"eg","x":"\u000eEa \u000f\u000eHmisspent\u000f\u000eE youth\u000f","p":1},{"t":"rule","x":"\u000eHunderfed\u000f\u000eE children\u000f","p":1},{"t":"rule","x":"\u000eEan \u000f\u000eHunsmiling\u000f\u000eE face\u000f","p":1},{"t":"eg","x":"\u000eEa \u000f\u000eHdisconnected\u000f\u000eE telephone\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"There are a few past participles that we can use before a noun."},{"t":"eg","x":"\u000eEThe road is blocked by a \u000f\u000eHfallen\u000f\u000eE tree.\u000f","note":"a tree which has fallen","p":1},{"t":"rule","x":"Compare the participles."},{"t":"eg","x":"\u000eEThe \u000f\u000eHescaped\u000f\u000eE prisoner was recaptured.\u000f","note":"Past: he had escaped.","p":1},{"t":"eg","x":"\u000eEThe \u000f\u000eHinjured\u000f\u000eE prisoner saw a doctor\u000f\u000eA.\u000f","note":"Passive: he had been injured.","p":1}]},{"l":"D","b":[{"t":"rule","x":"Sometimes we put an adverb before the participle."},{"t":"sub","x":"\u000eHfanatically cheering\u000f\u000eE crowds\u000f","p":1},{"t":"sub","x":"\u000eHProperly trained\u000f\u000eE staff\u000f","p":1},{"t":"rule","x":"We can also form a compound participle:"},{"t":"rule","x":"\u000eEa \u000f\u000eHfast-growing\u000f\u000eE economy\u000f","p":1},{"t":"rule","x":"\u000eHearth-moving\u000f\u000eE equipment\u000f","p":1},{"t":"rule","x":"\u000eEa \u000f\u000eHnice-looking\u000f\u000eE jacket\u000f","p":1},{"t":"eg","x":"\u000eHoil-fired\u000f\u000eE central heating\u000f","p":1},{"t":"rule","x":"We do not use longer phrases before the participle."},{"t":"wrong","x":"written-in-pencil \u0004not\u0005es"},{"t":"wrong","x":"with-great-enthusiasm cheering crowds"},{"t":"rule","x":"\u000eABut we can say \u000f\u000eEnotes written in pencil\u000f\u000eA. \u000f\u000eB➤176\u000f","p":1}]},{"l":"E","b":[{"t":"rule","x":"\u000eAWe can add \u000f\u000eF-ed\u000f\u000eA to some \u000f\u000eDnouns\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEa \u000f\u000eHwalled\u000f\u000eE city\u000f\u000eA (a city with a wall)\u000f","p":1},{"t":"rule","x":"This happens mostly with compounds."},{"t":"rule","x":"\u000eEa \u000f\u000eHdark-haired\u000f\u000eE woman\u000f","p":1},{"t":"rule","x":"(a woman with dark hair)"},{"t":"rule","x":"\u000eEa \u000f\u000eHshort-sleeved\u000f\u000eE shirt\u000f","p":1},{"t":"rule","x":"(a shirt with short sleeves)"},{"t":"tip","x":"It is neater to say a stolen car than a car which has been stolen. But not all combinations are possible. We can say a barking dog but not an eating dog. It is safer to use only those combinations that you have already heard or seen, such as boiling water."}]}]},{"n":81,"t":"Verb + object + participle","u":"Gerunds & Participles","s":[{"l":"A","b":[{"t":"sub","x":"I saw you doing it"},{"t":"rule","x":"\u000eAWe can use an \u000f\u000eIobject + active participle\u000f\u000eA after a verb of \u000f\u000eDperception\u000f\u000eA, e.g. see\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHsaw two men cutting\u000f\u000eE down a tree\u000f","p":1},{"t":"eg","x":"\u000eEWe \u000f\u000eHheard you arguing\u000f\u000eE with Steven\u000f","p":1},{"t":"rule","x":"\u000eAWe can use: \u000f\u000eEfeel, hear, listen to, notice, observe, see, smell, watch\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"I saw you do/doing it"},{"t":"rule","x":"\u000eAThere is also a pattern with\u000f\u000eF object + infinitive without to\u000f\u000eA. We use \u0001it\u0002 to refer to a\u000f\u000eD complete action\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHsaw them cut\u000f\u000eE the tree down.\u000f\u000eA (It didn’t take long. I saw them. They cut it down.)\u000f","p":1},{"t":"rule","x":"The participle means that the action was in progress at the time."},{"t":"eg","x":"\u000eAI \u000f\u000eHsaw them cutting\u000f\u000eE the tree down as I went past\u000f\u000eA. (I saw them. They were cutting it down.)\u000f","p":1},{"t":"rule","x":"When we talk about a short action, we can use either form."},{"t":"eg","x":"\u000eEWe didn’t \u000f\u000eHnotice anyone leave/leaving\u000f\u000eE the building.\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"I saw it (being) done"},{"t":"rule","x":"\u000eAThe patterns in \u000f\u000eJB\u000f\u000eA can be used with a participle in the passive,\u000f","p":1},{"t":"eg","x":"\u000eEI saw it \u000f\u000eHcut\u000f\u000eE down\u000f\u000eA. (complete action)\u000f","p":1},{"t":"eg","x":"\u000eEI saw \u000f\u000eHit being\u000f\u000eE cut down.\u000f\u000eA (in progress)\u000f","p":1},{"t":"eg","x":"\u000eEWe heard a shot \u000f\u000eHfired\u000f\u000eE.\u000f\u000eA (complete action)\u000f","p":1},{"t":"eg","x":"\u000eEWe heard shot s\u000f\u000eHbeing fired\u000f\u000eA. (in progress)\u000f","p":1}]},{"l":"D","b":[{"t":"sub","x":"I kept you waiting"},{"t":"rule","x":"\u000eAWe can use an \u000f\u000eFobject + active participle\u000f\u000eA after: \u000f\u000eFcatch, find, get, have, keep, leave, start\u000f\u000eI.\u000f","p":1},{"t":"sub","x":"\u000eEThey \u000f\u000eHcaught a student cheating.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHgot the printer working\u000f\u000eE again.\u000f","p":1},{"t":"eg","x":"\u000eEThe trainer \u000f\u000eHhad the players running\u000f\u000eE around the field\u000f\u000eA. (He made them run.)\u000f","p":1},{"t":"rule","x":"\u000eAWe can also use: \u000f\u000eFspend, \u0001waste\u0002\u000f\u000eD, or \u000f\u000eFlose\u000f\u000eA and an amount of\u000f\u000eD time or money.\u000f","p":1},{"t":"eg","x":"\u000eEI’ve \u000f\u000eHspent an hour looking\u000f\u000eE for that disk.\u000f","p":1},{"t":"eg","x":"\u000eEHe \u000f\u000eHwasted money betting\u000f\u000eE on horses.\u000f","p":1},{"t":"rule","x":"\u000eAWe can use a \u000f\u000eFpassive participle\u000f\u000eA with \u000f\u000eFfind, get, have\u000f\u000eD,\u000f\u000eA and \u000f\u000eFleave\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEThe police \u000f\u000eHfound a body buried\u000f\u000eE nearby.\u000f","p":1}]},{"l":"E","b":[{"t":"sub","x":"You were seen doing it"},{"t":"rule","x":"\u000eASome verbs in \u000f\u000eCA\u000f\u000eA and \u000f\u000eCD\u000f\u000eA can be passive before the participle: \u000f\u000eFhear, observe, see, catch, find, keep, leave\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEThe men \u000f\u000eHwere seen cutting\u000f\u000eE down a tree.\u000f","p":1},{"t":"eg","x":"\u000eEA student \u000f\u000eHwas caught cheating\u000f\u000eE.\u000f","p":1}]},{"l":"F","b":[{"t":"sub","x":"I want it done"},{"t":"rule","x":"\u000eAA\u000f\u000eF passive participle\u000f\u000eA (or \u000f\u000eFto-infinitive\u000f\u000eA) is used after \u000f\u000eFhave, like, need, prefe\u000f\u000eDr,\u000f\u000eA and \u000f\u000eFwant\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHwant\u000f\u000eE t\u000f\u000eHhis page (to be) copied\u000f\u000eE, please.\u000f","p":1},{"t":"sub","x":"\u000eEWe \u000f\u000eHprefer the sound (to be) turned\u000f\u000eE off.\u000f","p":1},{"t":"tip","x":"\u000eATwo useful sentences are an apology, \u000f\u000eESorry to keep you waiting\u000f\u000eA, and a warning, \u000f\u000eEI can smell something burning.\u000f","p":1}]}]},{"n":82,"t":"Participles for time and reason","u":"Gerunds & Participles","s":[{"l":"A","b":[{"t":"sub","x":"Time"},{"t":"rule","x":"\u000eAA clause of time can have an \u000f\u000eFactive participle\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEMike hurt his hand\u000f\u000eH playing volleyball\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEI was rushing around \u000f\u000eHserving tea.\u000f","p":1},{"t":"eg","x":"\u000eAThe actions take place at the \u000f\u000eDsame time.\u000f","p":1},{"t":"rule","x":"The participle can come first in writing."},{"t":"eg","x":"\u000eHComing up the steps,\u000f\u000eE I slipped and fell.\u000f","p":1},{"t":"rule","x":"\u000eAWe can also use a participle for\u000f\u000eD two short connected actions\u000f\u000eA, one after the other.\u000f","p":1},{"t":"eg","x":"\u000eHOpening the file\u000f\u000eE, he took out a photo.\u000f","p":1},{"t":"rule","x":"This pattern is rather literary."},{"t":"rule","x":"\u000eAWhen a short action comes before another connected one, we can use a \u000f\u000eFperfect participle\u000f\u000eA for the first action.\u000f","p":1},{"t":"eg","x":"\u000eHHaving opened\u000f\u000eE the file / \u000f\u000eHOpening\u000f\u000eE the file, he took out a photo.\u000f","p":1},{"t":"rule","x":"\u000eAWhen the first action\u000f\u000eD is not short\u000f\u000eA, we must use the perfect.\u000f","p":1},{"t":"eg","x":"\u000eHHaving studied\u000f\u000eE the photo, he replaced it.\u000f","p":1},{"t":"eg","x":"\u000eHHaving dug\u000f\u000eE a hole, the men went away.\u000f","p":1},{"t":"wrong","x":"Digging a hole, the men went away."},{"t":"rule","x":"The passive participle can be simple, continuous, or perfect."},{"t":"eg","x":"\u000eEHe walked slowly, \u000f\u000eHhelped\u000f\u000eE by a nurse.\u000f","p":1},{"t":"eg","x":"\u000eEI can’t stay here \u000f\u000eHbeing bitten\u000f\u000eE by insects.\u000f","p":1},{"t":"eg","x":"\u000eEA hole \u000f\u000eHhaving been dug\u000f\u000eE, they went away.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"Reason"},{"t":"rule","x":"A participle clause can express reason."},{"t":"eg","x":"\u000eHBeing rather busy\u000f\u000eE, I forgot the time.\u000f","p":1},{"t":"eg","x":"\u000eHNot feeling well\u000f\u000eE, Emma went to lie down.\u000f","p":1},{"t":"eg","x":"\u000eHHaving lost my passport\u000f\u000eE, I have to apply for a new one.\u000f","p":1},{"t":"eg","x":"\u000eHThe restaurant having closed\u000f\u000eE, there was nowhere to eat.\u000f","p":1},{"t":"rule","x":"This type of participle clause can be rather formal."},{"t":"rule","x":"\u000eAWe can use \u000f\u000eFwith\u000f\u000eA before a participle clause \u0001with\u0002 a subject.\u000f","p":1},{"t":"eg","x":"\u000eAI \u000f\u000eEcan’t concentrate \u000f\u000eHwith you talking.\u000f","p":1},{"t":"eg","x":"\u000eHWith the restaurant having closed\u000f\u000eE, there was nowhere to eat.\u000f","p":1},{"t":"rule","x":"\u000eAThis pattern is neutral in style and less formal than\u000f\u000eE The restaurant having closed ...\u000f","p":1},{"t":"rule","x":"The passive participle can be simple, continuous, or perfect."},{"t":"eg","x":"\u000eEHe died young, \u000f\u000eHkilled\u000f\u000eE in a road accident.\u000f","p":1},{"t":"eg","x":"\u000eEThe ponies get fat, \u000f\u000eHbeing fed\u000f\u000eE by tourists.\u000f","p":1},{"t":"eg","x":"\u000eHHaving been renovated\u000f\u000eE at great expense, the palace looks magnificient.\u000f","p":1},{"t":"tip","x":"Some of these patterns are a little tricky and can sound formal. It is usually safer to use conjunctions such as \u0001when\u0002, \u0001while\u0002, and \u0001because\u0002 to make your meaning clear."}]}]},{"n":83,"t":"Some patterns with participles","u":"Gerunds & Participles","s":[{"l":"A","b":[{"t":"sub","x":"I sat reading"},{"t":"rule","x":"\u000eAWe can use a participle after \u000f\u000eFgo, lie, run, sit\u000f\u000eA, and \u000f\u000eFstand\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEEveryone \u000f\u000eHstood watching\u000f\u000eE the aircraft.\u000f","p":1},{"t":"eg","x":"\u000eEThe girl \u000f\u000eHlay trapped\u000f\u000eE in the wreckage.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"I went swimming"},{"t":"rule","x":"\u000eAWe use\u000f\u000eF go + active participle\u000f\u000eA for leisure activities that we go out to do.\u000f","p":1},{"t":"eg","x":"\u000eEWe \u000f\u000eHwent riding\u000f\u000eE yesterday.\u000f","p":1},{"t":"eg","x":"\u000eESimon has \u000f\u000eHgone fishing.\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"Conjunction + participle"},{"t":"rule","x":"\u000eAWe can use an\u000f\u000eF active or passive participle\u000f\u000eA after some conjunctions.\u000f","p":1},{"t":"eg","x":"\u000eEWear gloves \u000f\u000eHwhen using\u000f\u000eE an electric saw.\u000f","p":1},{"t":"eg","x":"\u000eHOnce opened,\u000f\u000eE the contents should be consumed within three days.\u000f","p":1},{"t":"rule","x":"\u000eAThe pattern is used mainly in writing and with \u000f\u000eFalthough, if, once, unless, until, when, whenever\u000f\u000eA, and \u000f\u000eFwhile\u000f\u000eA.\u000f","p":1}]},{"l":"D","b":[{"t":"sub","x":"Result"},{"t":"rule","x":"A clause with an active participle can express result."},{"t":"eg","x":"\u000eEThe film star made a dramatic entrance, \u000f\u000eHattracting everyone's attention\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEThey pumped waste into the river, \u000f\u000eHkilling all the fish.\u000f\u000eA (... and killed all the fish.)\u000f","p":1}]},{"l":"E","b":[{"t":"sub","x":"Conditions"},{"t":"rule","x":"A participle clause can express a condition."},{"t":"eg","x":"\u000eEWe’ll eat outside, \u000f\u000eHweather permitting\u000f\u000eE.\u000f\u000eA (if the weather permits it)\u000f","p":1},{"t":"eg","x":"\u000eHTaken daily\u000f\u000eE, vitamin pills can improve your health.\u000f\u000eA (if they are taken daily)\u000f","p":1}]},{"l":"F","b":[{"t":"sub","x":"\u000eLWith\u000f\u000eG for details\u000f","p":1},{"t":"rule","x":"\u000eAThis example has \u000f\u000eFwith\u000f\u000eA and a subject of the participle clause.\u000f","p":1},{"t":"eg","x":"\u000eEThere were scenes of celebration, \u000f\u000eHwith people dancing\u000f\u000eE in the streets.\u000f","p":1},{"t":"rule","x":"The clause adds detail."}]},{"l":"G","b":[{"t":"sub","x":"\u000eLFollowing\u000f\u000eG, \u000f\u000eLconsidering\u000f\u000eG, etc\u000f","p":1},{"t":"rule","x":"Some participles are used as prepositions."},{"t":"eg","x":"\u000eGF\u000f\u000eHollowing\u000f\u000eE the reception, there will be a talk by the professor.\u000f\u000eA (after the reception)\u000f","p":1},{"t":"eg","x":"\u000eHConsidering\u000f\u000eE the weather, the day was a great success.\u000f\u000eA (in view of the weather)\u000f","p":1},{"t":"eg","x":"\u000eEI am writing \u000f\u000eHregarding\u000f\u000eE your complaint.\u000f\u000eA (about your complaint)\u000f","p":1}]},{"l":"H","b":[{"t":"sub","x":"Idioms"},{"t":"rule","x":"Some participle clauses are idioms."},{"t":"eg","x":"\u000eHStrictly speaking\u000f\u000eE, that's not allowed.\u000f","p":1},{"t":"eg","x":"\u000eHAll being well,\u000f\u000eE we'll be there by six.\u000f","p":1},{"t":"tip","x":"Use talking of to link to a new topic, e.g. I'm doing a computer course. → Talking of computers, ours are all down."}]}]},{"n":84,"t":"Noun and noun phrase","u":"Nouns","s":[{"l":"A","b":[{"t":"rule","x":"\u000eAA noun is a word like \u000f\u000eFcar\u000f\u000eI, \u000f\u000eFuncle\u000f\u000eI, or \u000f\u000eFsuccess\u000f\u000eI.\u000f\u000eA Nouns have different kinds of meaning. There are:\u000f","p":1},{"t":"rule","x":"\u000eAConcrete nouns: \u000f\u000eBcomputer, dog\u000f","p":1},{"t":"rule","x":"\u000eAAbstract nouns: \u000f\u000eBstrength, excitement\u000f","p":1},{"t":"eg","x":"\u000eANouns referring to events, e.g. \u000f\u000eEfestival\u000f","p":1},{"t":"eg","x":"\u000eANouns referring to roles, e.g. \u000f\u000eDdesigner\u000f","p":1},{"t":"eg","x":"\u000eANames\u000f\u000eD, e.g. \u000f\u000eEAmerica\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eASome nouns have a plural form with s e.g. \u000f\u000eBcars, dogs\u000f","p":1},{"t":"rule","x":"\u000eAThere are also irregular plurals e.g\u000f\u000eB. feet, knives \u000f\u000eI➤85C\u000f","p":1},{"t":"rule","x":"\u000eAThe only other ending that we put on a noun is the possessive form with 's or s', e.g.\u000f\u000eB the driver's seat \u000f\u000eI➤86\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"\u000eAA noun phrase can be a \u000f\u000eDnoun on its own\u000f","p":1}]},{"l":"E","b":[{"t":"rule","x":"g. We all need money; Silence is golden"},{"t":"rule","x":"\u000eABut more often a noun combines with other words to form a \u000f\u000eCnoun phrase\u000f","p":1},{"t":"rule","x":"\u000eBSome money\u000f\u000eA: Determiner + noun\u000f","p":1},{"t":"rule","x":"\u000eBThe road:\u000f\u000eA Determiner + noun\u000f","p":1},{"t":"rule","x":"\u000eBHis opinion:\u000f\u000eA Determiner + noun\u000f","p":1},{"t":"rule","x":"\u000eBA good game:\u000f\u000eA Determiner + adjective + noun\u000f","p":1},{"t":"rule","x":"\u000eBSeveral of the young people\u000f\u000eA: Determiner + of + Determiner + adjective + noun\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"\u000eAA noun phrase can be the \u000f\u000eCsubject, object or complement\u000f\u000eA of a sentence\u000f","p":1},{"t":"sub","x":"\u000eHThe vehicle\u000f\u000eE hit \u000f\u000eHa tree\u000f","p":1},{"t":"sub","x":"\u000eHThe day\u000f\u000eE was\u000f\u000eH an absolute disaster\u000f","p":1},{"t":"rule","x":"\u000eAIt can also come after a \u000f\u000eCpreposition\u000f","p":1},{"t":"eg","x":"\u000eEWe are all looking \u000f\u000eHat the photos\u000f","p":1}]},{"l":"E","b":[{"t":"rule","x":"These words can combine with a noun to form a noun phrase"},{"t":"rule","x":"Determiners:"},{"t":"rule","x":"Adjectives:"},{"t":"eg","x":"\u000eAOther nouns, e.g. \u000f\u000eEa \u000f\u000eHcar\u000f\u000eE accident\u000f","p":1}]},{"l":"F","b":[{"t":"rule","x":"We can use a phrase after a noun to modify it. The phrase can be one of these types"},{"t":"rule","x":"\u000eAPrepositional phrase,\u000f\u000eD e.g. \u000f\u000eEtea \u000f\u000eHfor two\u000f","p":1},{"t":"rule","x":"\u000eAAdverb phrase, \u000f\u000eBe.g.\u000f\u000eE the people \u000f\u000eHupstairs\u000f","p":1},{"t":"rule","x":"\u000eAAdjective phrase, \u000f\u000eBe.g. \u000f\u000eEa hole \u000f\u000eHfull of water\u000f","p":1},{"t":"rule","x":"\u000eANoun phrase, \u000f\u000eBe.g. \u000f\u000eEthe weather\u000f\u000eH that day\u000f","p":1},{"t":"rule","x":"The prepositional phrase is the most common"},{"t":"eg","x":"\u000eEI'd love an apartment \u000f\u000eHon Fifth Avenue\u000f","p":1},{"t":"eg","x":"\u000eEThe period \u000f\u000eHafter lunch\u000f\u000eE is always quiet\u000f","p":1},{"t":"rule","x":"We can use two or more phrases, or phrases and clauses together"},{"t":"eg","x":"\u000eEPassengers \u000f\u000eHon services through the tunnel\u000f\u000eE will suffer delays\u000f","p":1},{"t":"eg","x":"\u000eEPolice are baffled by the case \u000f\u000eHof a girl from Convetry who has disappeared.\u000f","p":1},{"t":"tip","x":"\u000eAFor noun + preposition combinations, e.g. the idea of, the reason for \u000f\u000eB➤\u000f\u000eA147D\u000f","p":1}]}]},{"n":85,"t":"The plural of nouns","u":"Nouns","s":[{"l":"A","b":[{"t":"sub","x":"Regular plurals"},{"t":"rule","x":"A countable noun can be singular or plural."},{"t":"rule","x":"\u000eAThe regular plural ending is \u000f\u000eL-s\u000f\u000eA or \u000f\u000eL-es\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"\u000eEone book → two book\u000f\u000eHs\u000f","p":1},{"t":"rule","x":"\u000eEone dish → two dish\u000f\u000eHes\u000f","p":1},{"t":"rule","x":"\u000eAWe add \u000f\u000eL-es\u000f\u000eA after a sound like \u000f\u000eFs, \u0001z\u0002, \u0001sh\u0002\u000f\u000eD,\u000f\u000eA or \u000f\u000eFch\u000f\u000eA. For pronunciation and spelling, \u000f\u000eB➤177A\u000f\u000eA.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"Compound nouns"},{"t":"rule","x":"\u000eATo form the plural of a compound nouns or two nouns together, we add \u000f\u000eF-s/-es\u000f","p":1},{"t":"rule","x":"Weekends, fire-fighters, metal boxes"},{"t":"rule","x":"\u000eAWe also add \u000f\u000eL-s\u000f\u000eA to a\u000f\u000eD verb + adverb compound\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEfry-up\u000f\u000eHs\u000f\u000eE breakdown\u000f\u000eHs\u000f\u000eE handout\u000f\u000eHs\u000f","p":1},{"t":"rule","x":"But when there is a prepositional phrase, we make the first noun plural."},{"t":"rule","x":"\u000eEDoctor\u000f\u000eHs\u000f\u000eE-of-Philosophy mother\u000f\u000eHs-\u000f\u000eEin-law\u000f","p":1},{"t":"rule","x":"\u000eAAnd with a noun in \u000f\u000eL-er + adverb\u000f\u000eA, we add \u000f\u000eL-s/-es\u000f\u000eA to the noun.\u000f","p":1},{"t":"rule","x":"\u000eEpasser\u000f\u000eHs\u000f\u000eE-by runner\u000f\u000eHs\u000f\u000eE-up\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"Irregular plurals"},{"t":"rule","x":"Some plurals are formed by changing the vowel sound."},{"t":"rule","x":"\u000eEfoot → \u000f\u000eHfeet\u000f\u000eE man → \u000f\u000eHmen\u000f","p":1},{"t":"rule","x":"\u000eEmouse → \u000f\u000eHmice\u000f\u000eE tooth → \u000f\u000eHteeth\u000f","p":1},{"t":"rule","x":"\u000eEwoman → \u000f\u000eHwomen\u000f","p":1},{"t":"rule","x":"\u000eAThere is an old plural form \u000f\u000eL-en\u000f\u000eA which has survived in these two nouns.\u000f","p":1},{"t":"rule","x":"\u000eEchild → \u000f\u000eHchildren\u000f\u000eE ox → \u000f\u000eHoxen\u000f","p":1},{"t":"rule","x":"\u000eAWith some nouns we change \u000f\u000eLf\u000f\u000eA to \u000f\u000eLv\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"\u000eElife → \u000f\u000eHlives\u000f\u000eE half → \u000f\u000eHhalves\u000f","p":1},{"t":"rule","x":"\u000eAOthers are: \u000f\u000eEcalves, knives, leaves, loaves, shelves, thieves, wives, wolves\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"\u000eABut some nouns ending in \u000f\u000eLf\u000f\u000eA or \u000f\u000eLfe\u000f\u000eA are regular: \u000f\u000eEbeliefs, chiefs, cliffs, safes\u000f\u000eB.\u000f","p":1},{"t":"rule","x":"\u000eAIn the plural nouns \u000f\u000eEbaths, mouths, paths, truth\u000f\u000eDs\u000f\u000eA, and \u000f\u000eEyouths\u000f\u000eA, the \u000f\u000eLths\u000f\u000eA sound is usually voiced /\u000f\u000eFðz\u000f\u000eA/. But \u000f\u000eEbirths, \u0001deaths\u0002\u000f\u000eD,\u000f\u000eA and \u000f\u000eEmonths\u000f\u000eA are regular /\u000f\u000eIθs\u000f\u000eA/.\u000f","p":1},{"t":"eg","x":"\u000eEHouses\u000f\u000eA also has two voiced /\u000f\u000eIz\u000f\u000eA/ sounds.\u000f","p":1},{"t":"rule","x":"\u000eASome nouns have the same singular and plural form. These are \u000f\u000eEaircraft, \u0001spacecraft\u0002\u000f\u000eA, etc. Some animals, e.g. \u000f\u000eEsheep, \u0001deer\u0002\u000f\u000eD,\u000f\u000eA and some fish, e.g. \u000f\u000eEcod\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"A number of words from Greek and Latin have special plural endings. They include:"},{"t":"rule","x":"\u000eEcriterion → \u000f\u000eHcriteria\u000f\u000eE, medium → \u000f\u000eHmedia\u000f\u000eE, phenomenon → \u000f\u000eHphenomena\u000f\u000eE, analysis → \u000f\u000eHanalyses\u000f\u000eE, crisis → \u000f\u000eHcrises\u000f\u000eE, nucleus → \u000f\u000eHnuclei\u000f\u000eE, stimulus → \u000f\u000eHstimuli\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eAOther irregular plurals are \u000f\u000eEpenny → \u000f\u000eHpence\u000f\u000eA and \u000f\u000eEperson → \u000f\u000eHpeople\u000f\u000eA.\u000f","p":1},{"t":"tip","x":"We normally use the plural for a negative or unknown quantity, e.g. Have you read any good books lately?"}]}]},{"n":86,"t":"The possessive form","u":"Nouns","s":[{"l":"A","b":[{"t":"sub","x":"Form"},{"t":"rule","x":"\u000eASingular noun + ’s: \u000f\u000eEmy friend’s name\u000f","p":1},{"t":"rule","x":"\u000eAS-plural + ’: \u000f\u000eEmy friends’ names\u000f","p":1},{"t":"rule","x":"\u000eAOther plurals + ’s: \u000f\u000eEthe children’s names\u000f","p":1},{"t":"rule","x":"\u000eAWe add an \u000f\u000eFapostrophe (’) + s\u000f\u000eA to a singular noun; \u000f","p":1},{"t":"rule","x":"\u000eAWe add an apostrophe to a plural in \u000f\u000eD-s\u000f\u000eA;\u000f","p":1},{"t":"rule","x":"\u000eAWe add an apostrophe + \u000f\u000eDs\u000f\u000eA to\u000f\u000eD a plural not ending in -s.\u000f\u000eA For pronunciation, see p. \u000f\u000eI177A.\u000f","p":1},{"t":"rule","x":"\u000eFOne, each othe\u000f\u000eDr,\u000f\u000eA and pronouns ending in \u000f\u000eF-one/-body\u000f\u000eA can be possessive.\u000f","p":1},{"t":"eg","x":"\u000eEI found \u000f\u000eHsomeone’s\u000f\u000eE coat here.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"Use"},{"t":"rule","x":"\u000eAWe use the possessive form for a connection, often the fact that\u000f\u000eD someone has something, or something belongs to them.\u000f","p":1},{"t":"rule","x":"\u000eESam\u000f\u000eH’s\u000f\u000eE dog, Lucy\u000f\u000eH’s\u000f\u000eE idea, people\u000f\u000eH’s\u000f\u000eE jobs\u000f","p":1},{"t":"rule","x":"\u000eESam’s dog\u000f\u000eA means ‘\u000f\u000eEthe dog that belongs to Sam\u000f\u000eA’. So we \u000f\u000eDdo not\u000f\u000eA put \u000f\u000eDthe\u000f\u000eA before a singular name.\u000f","p":1},{"t":"wrong","x":"\u0004the\u0005 Sam’s dog"},{"t":"rule","x":"We can leave out the noun after the possessive if the meaning is clear."},{"t":"rule","x":"\u000eEIs this your umbrella?\u000f\u000eB → \u000f\u000eENo, it’s \u000f\u000eHPeter's.\u000f","p":1},{"t":"rule","x":"\u000eAWe can sometimes use \u000f\u000eDtwo possessive forms together.\u000f","p":1},{"t":"eg","x":"\u000eEAnita is my \u000f\u000eHmother’s brother’s\u000f\u000eE daughter.\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"Possessive form or of?"},{"t":"eg","x":"\u000eAThese \u000f\u000eDtwo\u000f\u000eA patterns have the \u000f\u000eDsame meaning\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"\u000eAPossessive form: \u000f\u000eHmy friend’s\u000f\u000eE name\u000f","p":1},{"t":"rule","x":"\u000eAOf-pattern: \u000f\u000eEthe name\u000f\u000eH of my friend\u000f","p":1},{"t":"rule","x":"\u000eASometimes we can use \u000f\u000eDeither form\u000f\u000eA. But \u000f\u000eDoften only one is possible.\u000f","p":1},{"t":"eg","x":"your dad’s car"},{"t":"wrong","x":"the car of your dad"},{"t":"eg","x":"the end of the term"},{"t":"wrong","x":"the term’s end"},{"t":"rule","x":"\u000eAWe normally use the possessive with \u000f\u000eDpeople\u000f\u000eA.\u000f","p":1},{"t":"sub","x":"\u000eHmy uncle’s\u000f\u000eE job\u000f","p":1},{"t":"rule","x":"\u000eHthe Atkinsons’\u000f\u000eE house\u000f","p":1},{"t":"rule","x":"\u000eABut with a long description, we use \u000f\u000eFof\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEIt’s the home \u000f\u000eHof a wealthy businessman from Moscow\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eAThe \u000f\u000eFof\u000f\u000eI-\u000f\u000eApattern is sometimes possible for relations between people.\u000f","p":1},{"t":"eg","x":"\u000eHthe girl’s\u000f\u000eE mother\u000f\u000eB / \u000f\u000eEthe mother\u000f\u000eH of the girl\u000f","p":1},{"t":"rule","x":"\u000eAWe generally use \u000f\u000eFof\u000f\u000eA with things.\u000f","p":1},{"t":"eg","x":"\u000eEthe middle\u000f\u000eH of the night\u000f","p":1},{"t":"eg","x":"\u000eEthe results \u000f\u000eHof the inquiry\u000f","p":1},{"t":"rule","x":"\u000eABut we can use \u000f\u000eDboth patterns\u000f\u000eA with \u000f\u000eDplaces or organizations.\u000f","p":1},{"t":"eg","x":"\u000eHScotland’s\u000f\u000eE rivers\u000f\u000eB / \u000f\u000eEthe rivers\u000f\u000eH of Scotland\u000f","p":1},{"t":"eg","x":"\u000eHthe firm’s\u000f\u000eE policy\u000f\u000eB / \u000f\u000eEthe policy \u000f\u000eHof the firm\u000f","p":1},{"t":"tip","x":"\u000eAUse the possessive form with people and the \u000f\u000eDof\u000f\u000eA-pattern with things. Say \u000f\u000eEmy sister's address\u000f\u000eA but \u000f\u000eEthe address of the website\u000f\u000eB.\u000f","p":1}]}]},{"n":87,"t":"Some uses of the possessive","u":"Nouns","s":[{"l":"A","b":[{"t":"rule","x":"\u000eAAs well as the idea of belonging (\u000f\u000eB➤86B\u000f\u000eA), the possessive can also mean that something is intended for someone.\u000f","p":1},{"t":"sub","x":"\u000eHa customers’ car park\u000f\u000eA (for customers)\u000f","p":1},{"t":"sub","x":"\u000eHa children’s playground\u000f\u000eA (for children)\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"The possessive can show the type of thing we are talking about."},{"t":"sub","x":"\u000eHa bird’s nest\u000f\u000eA (a nest made by a bird)\u000f","p":1},{"t":"sub","x":"\u000eHa man’s voice\u000f\u000eA (a male voice)\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"We can use the possessive for the person doing the action."},{"t":"eg","x":"\u000eHThe man’s reply\u000f\u000eE surprised us.\u000f","note":"The man replied.","p":1}]},{"l":"D","b":[{"t":"rule","x":"We can also use the possessive for the person who the action is directed at."},{"t":"eg","x":"\u000eHEmma’s promotion\u000f\u000eE was well deserved.\u000f","note":"They promoted Emma.","p":1}]},{"l":"E","b":[{"t":"rule","x":"In these examples the possessive pattern is used for a person's qualities."},{"t":"sub","x":"\u000eET\u000f\u000eHhe man's stupidity / The stupidity of the man\u000f\u000eE annoys me.\u000f","note":"The man is stupid.","p":1}]},{"l":"F","b":[{"t":"rule","x":"The possessive form can express time."},{"t":"eg","x":"\u000eEDo we have \u000f\u000eHyesterday’s newspaper\u000f\u000eE?\u000f","p":1},{"t":"eg","x":"\u000eHLast month’s figures\u000f\u000eE were excellent.\u000f","p":1},{"t":"rule","x":"\u000eELast month’s figures\u000f\u000eA means the figures for last month.\u000f","p":1},{"t":"rule","x":"We cannot use a time of day."},{"t":"eg","x":"the three o’clock race"},{"t":"rule","x":"\u000eA(\u000f\u000eCnot\u000f\u000eE three o’clock’s race\u000f\u000eB)\u000f","p":1}]},{"l":"G","b":[{"t":"rule","x":"The possessive form can also express length of time."},{"t":"eg","x":"\u000eEThe coast is \u000f\u000eHhalf an hour’s drive\u000f\u000eE away.\u000f","p":1},{"t":"eg","x":"\u000eEThere’s \u000f\u000eHa whole year’s work\u000f\u000eE on this disk.\u000f","p":1},{"t":"rule","x":"We sometimes use a plural noun."},{"t":"eg","x":"\u000eEI would like\u000f\u000eH a few minutes’ rest\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEWe get just \u000f\u000eHthree weeks’ holiday\u000f\u000eE a year.\u000f","p":1},{"t":"rule","x":"\u000eAThe apostrophe goes after the plural \u000f\u000eL-s\u000f\u000eF.\u000f","p":1}]},{"l":"H","b":[{"t":"rule","x":"We can use the possessive form without a following noun for someone’s home or a particular kind of shop or office."},{"t":"eg","x":"\u000eEWe’re all meeting at \u000f\u000eHDave’s\u000f\u000eE (house/flat).\u000f","p":1},{"t":"eg","x":"\u000eEIs there a \u000f\u000eHbaker’s\u000f\u000eE (shop) near here, do you know?\u000f","p":1},{"t":"eg","x":"\u000eEI was in the waiting room at the \u000f\u000eHdentist’s\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"We can also use company names."},{"t":"eg","x":"\u000eEI bought the milk at \u000f\u000eHTesco’s.\u000f","p":1},{"t":"tip","x":"People whose first language is English are not always consistent in their use of the apostrophe, and it is sometimes missed out. Many companies leave out the apostrophe from their name, e.g. Barclays Bank."}]}]},{"n":88,"t":"Countable and uncountable nouns","u":"Nouns","s":[{"l":"A","b":[{"t":"rule","x":"Countable nouns can be singular or plural: boat(s), day(s), problem(s), man/men. We use countable nouns for separate, individual things we can count:"},{"t":"eg","x":"\u000eEa boat, three days, some problems\u000f\u000eD, etc.\u000f","p":1},{"t":"rule","x":"\u000eAMany countable nouns are concrete, e.g. \u000f\u000eEcar(s), shop(s)\u000f\u000eD.\u000f\u000eA But some are abstract, e.g. \u000f\u000eEidea(s), situation(s)\u000f\u000eD.\u000f","p":1},{"t":"rule","x":"Uncountable nouns are neither singular nor plural: air, butter, electricity, music, peace. We use uncountable nouns for things that do not naturally divide into separate units. Many uncountable nouns are abstract, e.g. \u0001happiness\u0002, \u0001security\u0002. But some are concrete, e.g. \u0001water\u0002, \u0001sand\u0002."},{"t":"rule","x":"\u000eAMany nouns can be either countable or uncountable. \u000f\u000eB►90\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eAAn uncountable noun takes a singular verb, and we use \u000f\u000eFthis/that\u000f\u000eA, not \u000f\u000eFthese/ \u0001those/they\u0002\u000f\u000eD.\u000f","p":1},{"t":"eg","x":"\u000eHThis\u000f\u000eE milk \u000f\u000eHis\u000f\u000eE off. I’ll pour \u000f\u000eHit\u000f\u000eE away.\u000f","p":1},{"t":"rule","x":"We can use an uncountable noun on its own."},{"t":"eg","x":"\u000eHWater\u000f\u000eE is essential for life.\u000f","p":1},{"t":"wrong","x":"\u0004The\u0005 water is essential for life."},{"t":"rule","x":"\u000eABut \u0001a\u0002 singular noun normally has to have a word like \u000f\u000eFa\u000f\u000eA or \u000f\u000eFthe\u000f\u000eD.\u000f","p":1},{"t":"eg","x":"\u0004The\u0005 boat leaves at ten o’clock."},{"t":"wrong","x":"Boat leaves at ten o’clock."},{"t":"rule","x":"\u000eASome words go with both countable and uncountable nouns: \u000f\u000eEthe boat \u000f\u000eAor \u000f\u000eEthe water\u000f\u000eA and \u000f\u000eEmy boat \u000f\u000eAor \u000f\u000eEmy water.\u000f","p":1},{"t":"rule","x":"\u000eABut some words go with only one kind of noun: \u000f\u000eEa boat\u000f\u000eA but not \u000f\u000eEa water\u000f\u000eA and \u000f\u000eEhow \u000f\u000eHmany\u000f\u000eE boats\u000f\u000eA but \u000f\u000eEhow \u000f\u000eHmuch\u000f\u000eE water.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"\u000eAWe cannot say \u000f\u000eEa flour\u000f\u000eA or \u000f\u000eEtwo woods.\u000f","p":1},{"t":"rule","x":"\u000eAIf we want to say how much flour or wood, then we use a pattern with \u000f\u000eFof\u000f\u000eD.\u000f","p":1},{"t":"sub","x":"\u000eEa \u000f\u000eHpacket of flour\u000f","p":1},{"t":"sub","x":"\u000eEtwo \u000f\u000eHpieces of wood\u000f","p":1},{"t":"rule","x":"\u000eAWe cannot leave out \u000f\u000eFof\u000f\u000eD.\u000f","p":1},{"t":"rule","x":"\u000eAWe can also use \u000f\u000eFof\u000f\u000eA before a plural noun.\u000f","p":1},{"t":"sub","x":"\u000eEa \u000f\u000eHbox of matches\u000f","p":1},{"t":"sub","x":"\u000eEa \u000f\u000eHkilo of tomatoes\u000f","p":1},{"t":"rule","x":"\u000eABefore \u000f\u000eFof + uncountable or plural noun\u000f\u000eA we can use containers or measurements.\u000f","p":1},{"t":"eg","x":"\u000eEa \u000f\u000eHcup of\u000f\u000eE coffee\u000f","p":1},{"t":"rule","x":"\u000eEa \u000f\u000eHbottle of\u000f\u000eE wine\u000f","p":1},{"t":"eg","x":"\u000eEthree \u000f\u000eHmetres of\u000f\u000eE material\u000f","p":1},{"t":"rule","x":"\u000eABefore \u000f\u000eFof + uncountable noun\u000f\u000eA we can use \u000f\u000eFpiece\u000f\u000eA \u0001and\u0002 nouns of similar meaning.\u000f","p":1},{"t":"rule","x":"\u000eEa \u000f\u000eHsheet/piece/bit of\u000f\u000eE paper\u000f","p":1},{"t":"eg","x":"\u000eEa \u000f\u000eHdrop of\u000f\u000eE water/milk/oil\u000f","p":1},{"t":"tip","x":"Crowd of, group of, and series of go with a plural noun, e.g. a crowd of people, a group of tourists, a series of mistakes, but not a series of confusion."}]}]},{"n":89,"t":"Information, news, etc","u":"Nouns","s":[{"l":"A","b":[{"t":"rule","x":"It is not always clear from the meaning whether a noun is countable or uncountable. For example, \u0001information\u0002, \u0001news\u0002, and furniture are uncountable."},{"t":"eg","x":"\u000eEI’ve found out \u000f\u000eHsome information\u000f\u000eE.\u000f","p":1},{"t":"wrong","x":"an \u0004information\u0005"},{"t":"eg","x":"\u000eEThere \u000f\u000eHwas\u000f\u000eE no \u000f\u000eHnews\u000f\u000eE of the missing child.\u000f","p":1},{"t":"wrong","x":"There were no \u0004news\u0005."},{"t":"eg","x":"\u000eEThey had very \u000f\u000eHlittle furniture\u000f\u000eE.\u000f","p":1},{"t":"wrong","x":"very few furnitures"},{"t":"rule","x":"\u000eABut we can often use \u000f\u000eEpiece/bit/item of\u000f\u000eA with such nouns.\u000f","p":1},{"t":"eg","x":"\u000eEI’ve found out\u000f\u000eH a piece of information\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEThey had very \u000f\u000eHfew items of furniture\u000f\u000eE.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"Here are some more uncountable nouns (in bold type) whose equivalents may be countable in other languages. Some countable expressions are given in brackets."},{"t":"eg","x":"\u000eElooking for \u000f\u000eHaccommodation\u000f\u000eA (but\u000f\u000eE a place to live\u000f\u000eA)\u000f","p":1},{"t":"eg","x":"\u000eEgetting some \u000f\u000eHadvice\u000f","p":1},{"t":"rule","x":"\u000eEtaking some \u000f\u000eHbaggage/luggage\u000f\u000eA (but\u000f\u000eE some bags/cases\u000f\u000eA)\u000f","p":1},{"t":"eg","x":"\u000eEpaying in \u000f\u000eHcash\u000f\u000eD (\u000f\u000eAbut \u000f\u000eEnotes and coins\u000f\u000eD)\u000f","p":1},{"t":"eg","x":"\u000eEsome warm \u000f\u000eHclothing\u000f\u000eD (\u000f\u000eAbut \u000f\u0 ag\u000f\u000eA (a bag made of plastic)\u000f","p":1},{"t":"eg","x":"a brick wall"},{"t":"eg","x":"a cardboard box"},{"t":"rule","x":"The pattern can express the idea that something is a part of something else."},{"t":"eg","x":"\u000eEthe car door\u000f\u000eA (the door of the car)\u000f","p":1},{"t":"eg","x":"the TV screen"},{"t":"eg","x":"the town centre"},{"t":"tip","x":"A milk bottle is a bottle for putting milk in, e.g. an empty milk bottle. A bottle of milk is a bottle full of milk, e.g. a bottle of milk in the fridge."}]}]},{"n":92,"t":"Agreement","u":"Nouns","s":[{"l":"A","b":[{"t":"rule","x":"\u000eA‘\u000f\u000eFAgreement\u000f\u000eA’ means using a singular verb after a singular or uncountable subject and a plural verb after a plural subject.\u000f","p":1},{"t":"rule","x":"Singular:"},{"t":"eg","x":"\u000eEThe \u000f\u000eHhouse is\u000f\u000eE empty.\u000f","p":1},{"t":"eg","x":"\u000eEThis \u000f\u000eHcoat looks\u000f\u000eE nice.\u000f","p":1},{"t":"rule","x":"Plural:"},{"t":"eg","x":"\u000eEThe \u000f\u000eHhouses are\u000f\u000eE empty.\u000f","p":1},{"t":"eg","x":"\u000eEThese \u000f\u000eHcoats look\u000f\u000eE nice.\u000f","p":1},{"t":"rule","x":"This happens when we use a present-tense verb in the third person."},{"t":"rule","x":"\u000eAWith a past-tense verb, there is agreement only with \u000f\u000eFbe\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"\u000eASingular: \u000f\u000eEThe \u000f\u000eHhouse was\u000f\u000eE empty.\u000f","p":1},{"t":"rule","x":"\u000eAPlural: \u000f\u000eEThe \u000f\u000eHhouses were\u000f\u000eE empty.\u000f","p":1},{"t":"rule","x":"Other verbs have only one form."},{"t":"eg","x":"\u000eEThe house/houses \u000f\u000eHlooked\u000f\u000eE empty.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eAPhrases linked by \u000f\u000eFand\u000f\u000eA take a plural verb.\u000f","p":1},{"t":"eg","x":"\u000eHSimon and Chloe go\u000f\u000eE sailing.\u000f","p":1},{"t":"eg","x":"\u000eHWheat and maize are\u000f\u000eE exported.\
