p":1},{"t":"eg","x":"\u000eEHe ignored the phone \u000f\u000eHringing\u000f\u000eE on his desk. \u000f\u000eD(the phone \u000f\u000eGthat was ringing\u000f\u000eD)\u000f","p":1},{"t":"rule","x":"The participle can refer to a state."},{"t":"eg","x":"\u000eEMoney \u000f\u000eHbelonging\u000f\u000eE to the club was stolen. \u000f\u000eD(money \u000f\u000eGthat belonged\u000f\u000eD to the club)\u000f","p":1},{"t":"rule","x":"We can also use it to report a message."},{"t":"eg","x":"\u000eEThere’s a sign \u000f\u000eHwarning\u000f\u000eE of the danger.\u000f","p":1},{"t":"rule","x":"We can sometimes use the participle for a repeated action."},{"t":"rule","x":"\u000eEPeople \u000f\u000eHtravelling\u000f\u000eE into London every day are used to the hold-ups.\u000f","p":1},{"t":"rule","x":"\u000eA(people \u000f\u000eGwho travel\u000f\u000eA into London)\u000f","p":1},{"t":"rule","x":"But we do not use it for a single action."},{"t":"eg","x":"\u000eEThe man \u000f\u000eHwho escaped\u000f\u000eE has been caught.\u000f","p":1},{"t":"wrong","x":"The man escaping..."}]},{"l":"B","b":[{"t":"sub","x":"Passive participles"},{"t":"rule","x":"\u000eAWe can use a passive participle in\u000f\u000eD a shortened relative clause for both single and repeated actions.\u000f","p":1},{"t":"eg","x":"\u000eEThis is the design \u000f\u000eHchosen\u000f\u000eE for the logo.\u000f","note":"the design which has been chosen","p":1},{"t":"eg","x":"\u000eECars \u000f\u000eHleft\u000f\u000eE here will be towed away.\u000f","note":"cars which are left here","p":1}]},{"l":"C","b":[{"t":"sub","x":"Word order with participles"},{"t":"rule","x":"\u000eAA participle can go before a noun.\u000f\u000eB ➤80\u000f","p":1},{"t":"eg","x":"\u000eEWe heard \u000f\u000eHrunning\u000f\u000eE water.\u000f","p":1},{"t":"rule","x":"A participle clause comes after the noun."},{"t":"eg","x":"\u000eEWe heard \u000f\u000eHwater \u000f\u000eErunning in the pipes.\u000f","p":1},{"t":"wrong","x":"We heard running in the pipes water"}]},{"l":"D","b":[{"t":"sub","x":"Infinitive relative clauses"},{"t":"rule","x":"\u000eAWe can use a relative clause with a\u000f\u000eI to-infinitive\u000f\u000eA after \u000f\u000eFfirst, \u0001second\u0002,\u000f\u000eA etc.; after \u000f\u000eFnext\u000f\u000eD, \u000f\u000eFlast\u000f\u000eD,\u000f\u000eA and \u000f\u000eFonly\u000f\u000eA; and after a superlative adjective (e.g. \u000f","p":1},{"t":"eg","x":"\u000eEoldest\u000f\u000eA).\u000f","p":1},{"t":"eg","x":"\u000eEWho was the \u000f\u000eHfirst\u000f\u000eE woman \u000f\u000eHto fly\u000f\u000eE around the world?\u000f","note":"the first woman who flew ...","p":1},{"t":"eg","x":"\u000eEYou’re the \u000f\u000eHonly\u000f\u000eE person \u000f\u000eHto volunteer\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEHe became the \u000f\u000eHyoungest\u000f\u000eE player \u000f\u000eHto represent\u000f\u000eE his country\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"\u000eAWe can use a \u000f\u000eIto-infinitive\u000f\u000eA in this pattern with a \u000f\u000eIpreposition + \u000f\u000eFwhich\u000f\u000eI.\u000f","p":1},{"t":"eg","x":"\u000eEI need a piano \u000f\u000eHon which to practise\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEIt’s an ideal location \u000f\u000eHfrom which to explore\u000f\u000eE the Lake District.\u000f","p":1},{"t":"rule","x":"\u000eAIn less formal English we leave out \u000f\u000eFwhich\u000f\u000eA and put the preposition at the end.\u000f","p":1},{"t":"eg","x":"\u000eEI need a piano \u000f\u000eHto practise on\u000f\u000eA.\u000f","p":1},{"t":"tip","x":"\u000eAThe to-infinitive is sometimes used in quiz questions, e.g.\u000f\u000eB Which was the \u000f\u000eHfirst\u000f\u000eB country \u000f\u000eHto win\u000f\u000eB the football World Cup?\u000f","p":1}]}]},{"n":177,"t":"Endings: -s, -ed, and -y","u":"Spelling & Pronunciation","s":[{"l":"A","b":[{"t":"sub","x":"\u000eCThe \u000f\u000eL-s/-es\u000f\u000eC ending\u000f","p":1},{"t":"rule","x":"\u000eAWe add \u000f\u000eJ-s\ \u000f\u000eE → privatize\u000f","p":1},{"t":"rule","x":"\u000eElov\u000f\u000eHe\u000f\u000eE → lovable\u000f","p":1},{"t":"rule","x":"\u000eEcultur\u000f\u000eHe\u000f\u000eE → cultural\u000f","p":1},{"t":"rule","x":"\u000eABut we keep a \u000f\u000eJdouble e\u000f\u000eA before \u000f\u000eJ-ing\u000f\u000eA:\u000f","p":1},{"t":"rule","x":"see → seeing"},{"t":"rule","x":"\u000eAWhen we add \u000f\u000eJ-ed\u000f\u000eC, \u000f\u000eJ-er\u000f\u000eC, \u000f\u000eAor \u000f\u000eJ-est\u000f\u000eA to a word ending in \u000f\u000eJe\u000f\u000eA, we do \u000f\u000eCnot\u000f\u000eA write a double \u000f\u000eCe\u000f\u000eA:\u000f","p":1},{"t":"rule","x":"type → typed"},{"t":"rule","x":"late → later"},{"t":"rule","x":"nice → nicest"},{"t":"rule","x":"\u000eASome words ending in \u000f\u000eJce\u000f\u000eA or \u000f\u000eJge\u000f\u000eA keep the \u000f\u000eJe\u000f\u000eA before \u000f\u000eJa\u000f\u000eA or \u000f\u000eJo\u000f\u000eA:\u000f","p":1},{"t":"rule","x":"noticeable, courageous"},{"t":"rule","x":"\u000eAWe do \u000f\u000eCnot usually leave out e\u000f\u000eA before a \u000f\u000eDconsonant\u000f\u000eA:\u000f","p":1},{"t":"rule","x":"\u000eEmov\u000f\u000eHe\u000f\u000eE → moves\u000f","p":1},{"t":"rule","x":"\u000eEnic\u000f\u000eHe\u000f\u000eE → nicely\u000f","p":1},{"t":"rule","x":"\u000eAExceptions are words ending in \u000f\u000eJue\u000f\u000eA:\u000f","p":1},{"t":"rule","x":"\u000eEarg\u000f\u000eHue\u000f\u000eE → argument\u000f","p":1},{"t":"rule","x":"\u000eEtr\u000f\u000eHue\u000f\u000eE → truly\u000f","p":1},{"t":"rule","x":"\u000eATo form an adverb from a word ending in a \u000f\u000eIconsonant + \u000f\u000eJle\u000f\u000eA, we change \u000f\u000eJle\u000f\u000eA to \u000f\u000eJy\u000f\u000eA:\u000f","p":1},{"t":"rule","x":"\u000eEsim\u000f\u000eHple\u000f\u000eE → simpl\u000f\u000eHy\u000f","p":1},{"t":"rule","x":"\u000eEpossi\u000f\u000eHble\u000f\u000eE → possibl\u000f\u000eHy\u000f","p":1},{"t":"rule","x":"\u000eANote also that af an apostrophe instead of part of a word, e.g\u000f\u000eB. \u000f\u000eEit’s\u000f\u000eA instead of \u000f\u000eEit is\u000f\u000eB.\u000f\u000eA There is no space before the apostrophe.\u000f","p":1},{"t":"rule","x":"Most short forms are with auxiliary verbs, pronouns, and question words."},{"t":"rule","x":"But we can sometimes use a noun."},{"t":"eg","x":"\u000eEThe \u000f\u000eHheating’ll\u000f\u000eE soon warm us up.\u000f","p":1},{"t":"rule","x":"\u000eAWe cannot use a short form of a verb when it would be \u000f\u000eDstressed\u000f\u000eA in speech.\u000f","p":1},{"t":"eg","x":"\u000eEIs it tomorrow? – Yes, it \u000f\u000eHis\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eABut \u000f\u000eDunstressed n’t\u000f\u000eA can end a sentence.\u000f","p":1},{"t":"eg","x":"\u000eEIs it expensive? – No, it \u000f\u000eHisn’t\u000f\u000eE.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eAThe form \u000f\u000eF’s\u000f\u000eA can mean \u000f\u000eFis\u000f\u000eA or \u000f\u000eFhas\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEIt’\u000f\u000eHs\u000f\u000eE a big house. It\u000f\u000eH’s\u000f\u000eE got six bedrooms.\u000f","note":"It is ... It has got ...","p":1},{"t":"rule","x":"\u000eAAnd the form \u000f\u000eF’d\u000f\u000eA can mean \u000f\u000eFhad\u000f\u000eA or \u000f\u000eFwould\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEIf you’\u000f\u000eHd\u000f\u000eE gone, you’\u000f\u000eHd\u000f\u000eE have enjoyed it.\u000f","note":"If you had gone, you would have ...","p":1},{"t":"eg","x":"\u000eAThere are two different ways we can shorten \u000f\u000eFis no\u000f\u000eDt\u000f\u000eA and \u000f\u000eFare not\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEIt \u000f\u000eHisn’t\u000f\u000eE working. / It\u000f\u000eH’s not\u000f\u000eE working.\u000f","p":1},{"t":"eg","x":"\u000eEWe \u000f\u000eHaren’t\u000f\u000eE ready. / We’\u000f\u000eHre not\u000f\u000eE ready.\u000f","p":1},{"t":"eg","x":"\u000eAOther forms like \u000f\u000eEI’ll not\u000f\u000eA, \u000f\u000eEYou’re not\u000f\u000eA are less usual than \u000f\u000eEI \u000f\u000eHwon’t\u000f\u000eB, \u000f\u000eEI \u000f\u000eHhaven’t\u000f\u000eA, etc.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"--"},{"t":"sub","x":"Short Form Full Form"},{"t":"table","rows":[["aren’t","are not"],["can’t","cannot"],["couldn’t","could not"],["daren't","Dare not"],["didn’t","did not"],["doesn’t","does not"],["don’t","do not"],["hadn’t","had not"],["hasn’t","has not"],["haven’t","have not"],["he’d","he had / would"],["he’ll","he will"],["he’s","he is / has"],["how’s","how is / has"],["I’d","I had / would"],["I’ll","I will"],["I’m","I am"],["I’ve","I have"],["isn’t","is not"],["it’d","it had / would"],["it’ll","it will"],["it’s","it is / has"],["Let's","Let us"],["mightn’t","might not"],["mustn’t","must not"],["needn’t","need not"],["Oughtn't","Ought not"],["Shan't","Shall not"],["she’d","she had / would"],["she’ll","she will"],["she’s","she is / has"],["shouldn’t","should not"],["that’s","that is / has"],["there’s","there is / has"],["they’d","they had / would"],["they’ll","they will"],["they’re","they are"],["they’ve","they have"],["we’d","we had / would"],["we’re","we are"],["we’ve","we have"],["weren’t","were not"],["what’s","what is / has"],["when’s","when is / has"],["where’s","where is / has"],["who’d","who had / would"],["who’ll","who will"],["who’s","who is / has"],["won’t","will not"],["wouldn’t","would not"],["you’d","you had / would"],["you’ll","you will"],["you’re","you are"],["you’ve","you have"]]},{"t":"rule","x":"Untitled"},{"t":"rule","x":"➤➤➤➤➤➤"}]}]}];
const BANK=[{"id":"h0","n":1,"q":"Which word class does <b>probably<\/b> belong to?","o":["Adverb","Adjective","Determiner","Conjunction"],"a":0,"e":"Probably is an adverb. Adverbs modify verbs, adjectives or whole clauses; adjectives like <i>different<\/i> modify nouns.","k":"mcq"},{"id":"h1","n":1,"q":"<b>Some money<\/b> is an example of which kind of phrase?","o":["A noun phrase","A verb phrase","An adverb phrase","A prepositional phrase"],"a":0,"e":"A noun phrase has a noun, optionally with a determiner and/or adjective in front: <i>music, some money, a good game<\/i>.","k":"mcq"},{"id":"h2","n":1,"q":"Which of these is a prepositional phrase?","o":["on the road","very carefully","have been thinking","most ridiculous"],"a":0,"e":"A prepositional phrase is a preposition + noun phrase, e.g. <i>on the road, by Friday, for a long time<\/i>.","k":"mcq"},{"id":"h3","n":1,"q":"Which type of determiner is <b>several<\/b>?","o":["Quantifier","Article","Demonstrative","Possessive"],"a":0,"e":"Quantifiers include (a) few, (a) little, many, much, some, any, every, all, several, enough.","k":"mcq"},{"id":"h4","n":2,"q":"<i>The visitors have arrived.<\/i> What clause structure is this?","o":["S + V","S + V + O","S + V + C","S + V + A"],"a":0,"e":"There is no object or complement, so it is S + V. A verb used this way is intransitive (arrive, rise, wait).","k":"mcq"},{"id":"h5","n":2,"q":"<i>The song became a big hit.<\/i> The verb <b>became<\/b> is…","o":["a linking verb","a transitive verb","an intransitive verb","an auxiliary verb"],"a":0,"e":"Become is a linking verb (be, become, look, seem). It is followed by a complement, here the noun phrase <i>a big hit<\/i>.","k":"mcq"},{"id":"h6","n":2,"q":"<i>Sarah sent me a text message.<\/i> Which structure is this?","o":["S + V + O + O","S + V + O + C","S + V + O + A","S + V + C"],"a":0,"e":"There are two objects: the indirect object <i>me<\/i> and the direct object <i>a text message<\/i>.","k":"mcq"},{"id":"h7","n":2,"q":"<i>I put my mobile in my pocket.<\/i> Why can't <i>in my pocket<\/i> be left out?","o":["Put requires an object + adverbial","It is the subject","It is a complement","Put is intransitive"],"a":0,"e":"Put always takes an object plus an adverbial. Some verbs strongly predict their structure this way.","k":"mcq"},{"id":"h8","n":2,"q":"<i>The project kept everyone very busy.<\/i> <b>Very busy<\/b> is…","o":["a complement relating to the object","a second object","an adverbial","the subject"],"a":0,"e":"This is S + V + O + C. The complement <i>very busy<\/i> describes the object <i>everyone<\/i>.","k":"mcq"},{"id":"h9","n":3,"q":"Choose the correct sentence.","o":["You give the attendant your ticket.","You give your ticket the attendant.","You give to the attendant your ticket.","You give the attendant to your ticket."],"a":0,"e":"With two objects the indirect object (the attendant) comes first, then the direct object (your ticket).","k":"mcq"},{"id":"h10","n":3,"q":"Complete: <i>Nigel bought a diamond ring ___ Celia.<\/i>","o":["for","to","at","with"],"a":0,"e":"Buy takes <b>for<\/b> in a prepositional phrase. Verbs with <i>for<\/i> include buy, cook, fetch, find, get, keep, make, order, reserve, save.","k":"mcq"},{"id":"h11","n":3,"q":"Which verb goes with <b>to<\/b> rather than <b>for<\/b>?","o":["lend","cook","reserve","fetch"],"a":0,"e":"Lend belongs to the <i>to<\/i> group (award, give, hand, lend, offer, pass, pay, send, show, teach, tell).","k":"mcq"},{"id":"h12","n":3,"q":"Which sentence is correct?","o":["I'll explain everything to you.","I'll explain you everything.","I'll explain to you everything.","I'll explain you to everything."],"a":0,"e":"Explain cannot take an indirect object. Use <i>explain something to someone<\/i>. Same for announce, describe, report, suggest.","k":"mcq"},{"id":"h13","n":3,"q":"When there are two pronouns after <b>send<\/b>, what do we normally use?","o":["to or for","an indirect object","no preposition","that"],"a":0,"e":"With two pronouns we normally use to/for: <i>We'll send them to you straight away.<\/i>","k":"mcq"},{"id":"h14","n":4,"q":"<i>What a nice photo!<\/i> is which sentence type?","o":["Exclamation","Statement","Question","Imperative"],"a":0,"e":"Exclamations express a feeling. The four types are statement, question, imperative and exclamation.","k":"mcq"},{"id":"h15","n":4,"q":"<i>I promise to behave myself.<\/i> The verb <b>promise<\/b> here is…","o":["a performative verb","a modal verb","an auxiliary verb","a linking verb"],"a":0,"e":"Performative verbs perform the act by being said: admit, apologize, guarantee, insist, predict, promise, refuse, suggest, warn.","k":"mcq"},{"id":"h16","n":4,"q":"Compared with <i>I'll behave<\/i>, the sentence <i>I promise to behave<\/i> is…","o":["more emphatic","less certain","more informal","ungrammatical"],"a":0,"e":"Performative verbs are fairly emphatic, and some are rather formal — <i>I apologize<\/i> is more formal than <i>I'm sorry<\/i>.","k":"mcq"},{"id":"h17","n":5,"q":"Rewrite with <b>not<\/b>: <i>We have no time.<\/i>","o":["We haven't any time.","We haven't no time.","We don't have no time.","We have not some time."],"a":0,"e":"<i>No + noun<\/i> corresponds to <i>not … any<\/i>. English does not use two negatives together in standard usage.","k":"mcq"},{"id":"h18","n":5,"q":"Which is the <b>not/n't<\/b> equivalent of <i>I've never seen the film<\/i>?","o":["I haven't ever seen the film.","I haven't never seen the film.","I didn't ever see the film.","I haven't seen the film ever not."],"a":0,"e":"Never corresponds to <i>not … ever<\/i>. Other pairs: seldom / not often, no longer / not … any more.","k":"mcq"},{"id":"h19","n":5,"q":"Choose the correct negative.","o":["The message didn't arrive.","The message no arrived.","The message not arrived.","The message arrived not."],"a":0,"e":"For a simple tense with no auxiliary we add <i>do/does/did + n't<\/i> before the base form.","k":"mcq"},{"id":"h20","n":5,"q":"<i>Few people were interested<\/i> means roughly the same as…","o":["Not many people were interested.","Many people were interested.","No people were interested.","People were not interested at all."],"a":0,"e":"Few has a negative meaning and corresponds to <i>not many<\/i>. Little corresponds to <i>not much<\/i>.","k":"mcq"},{"id":"h21","n":6,"q":"Complete: <i>Under no circumstances ___ travel alone.<\/i>","o":["should you","you should","should to you","you should to"],"a":0,"e":"After a negative phrase in front position, the auxiliary comes before the subject — this is inversion.","k":"mcq"},{"id":"h22","n":6,"q":"Which sentence uses inversion correctly?","o":["Seldom do we have any visitors.","Seldom we have any visitors.","Seldom have we any visitors do.","Seldom do have we any visitors."],"a":0,"e":"With a simple tense we supply the auxiliary <i>do<\/i>: <i>Seldom do we have any visitors.<\/i>","k":"mcq"},{"id":"h23","n":6,"q":"Where does <b>at all<\/b> usually go?","o":["At the end of a clause or after a negative phrase","Directly before the verb","At the front of the clause","Between subject and auxiliary"],"a":0,"e":"<i>We don't like our new boss at all.<\/i> / <i>In no time at all, the tour was over.<\/i>","k":"mcq"},{"id":"h24","n":6,"q":"Which word can follow <b>nothing<\/b> or <b>none<\/b> to strengthen a negative?","o":["whatsoever","absolutely","hardly","seldom"],"a":0,"e":"<i>There's nothing whatever we can do.<\/i> / <i>I have no sympathy whatsoever.<\/i> Absolutely goes <i>before<\/i> no/nobody/nowhere.","k":"mcq"},{"id":"h25","n":7,"q":"What is the negative imperative of <i>make so much fuss<\/i>?","o":["Don't make so much fuss.","Not make so much fuss.","Doesn't make so much fuss.","No make so much fuss."],"a":0,"e":"The negative imperative is <i>do not / don't<\/i> + base form.","k":"mcq"},{"id":"h26","n":7,"q":"<i>Do be careful.<\/i> Why is <b>do<\/b> used?","o":["For emphasis","To form a question","To make it negative","To make it polite"],"a":0,"e":"<i>Do<\/i> + base form adds emphasis to an imperative.","k":"mcq"},{"id":"h27","n":7,"q":"Which tag suits a warning: <i>Drive carefully, ___?<\/i>","o":["won't you","will you","don't you","can't you"],"a":0,"e":"After a positive imperative in a warning we use <i>won't you?<\/i>; after a negative imperative, <i>will you?<\/i>","k":"mcq"},{"id":"h28","n":7,"q":"What is the negative of <i>Let's waste time<\/i> in British English?","o":["Let's not waste / Don't let's waste time.","Let's don't waste time.","Not let's waste time.","Let's no waste time."],"a":0,"e":"The negative of <i>let's<\/i> is <i>let's not<\/i> or, in British English, <i>don't let's<\/i>.","k":"mcq"},{"id":"h29","n":8,"q":"Which is the most polite way to ask a favour?","o":["I wonder if you'd mind dealing with the matter for me.","Deal with the matter.","You must deal with the matter.","Deal with it, will you?"],"a":0,"e":"To be very polite when asking a favour we use a longer formula, usually in question form.","k":"mcq"},{"id":"h30","n":8,"q":"Why is <i>Give me a lift<\/i> usually inappropriate?","o":["A request normally needs a question form","It is grammatically wrong","Lift is the wrong noun","Imperatives are never used"],"a":0,"e":"It is always worth putting a request into a question form, e.g. <i>Would you mind giving me a lift?<\/i>","k":"mcq"},{"id":"h31","n":9,"q":"<i>Do you sell magazines?<\/i> is which type of question?","o":["A yes/no question","A wh-question","An echo question","A question tag"],"a":0,"e":"Yes/no questions begin with an auxiliary verb and can be answered yes or no.","k":"mcq"},{"id":"h32","n":9,"q":"Choose the correct word order.","o":["Could I have reserved a seat?","Could have I reserved a seat?","I could have reserved a seat?","Have could I reserved a seat?"],"a":0,"e":"Only the first auxiliary moves in front of the subject; the rest of the verb phrase stays in order.","k":"mcq"},{"id":"h33","n":9,"q":"Choose the correct question.","o":["Why were you late?","Why did you be late?","Why you were late?","Why was you late?"],"a":0,"e":"<i>Be<\/i> as a main verb inverts with the subject directly; we do not add <i>do<\/i>.","k":"mcq"},{"id":"h34","n":10,"q":"Which question asks about the subject and therefore has no inversion?","o":["Who caused the trouble?","Who did you see?","What did they buy?","Where did she go?"],"a":0,"e":"When the question word is the subject, normal statement order is kept and <i>do<\/i> is not used.","k":"mcq"},{"id":"h35","n":10,"q":"Complete: <i>___ are you travelling?<\/i> (answer: Tomorrow)","o":["When","Where","Why","How"],"a":0,"e":"When asks about time. Wh-questions begin with a question word and usually have inversion.","k":"mcq"},{"id":"h36","n":12,"q":"<i>Didn't you enjoy the film?<\/i> A negative question often expresses…","o":["surprise or an expectation","a plain request for information","an order","a strong refusal"],"a":0,"e":"Negative questions typically show surprise, or that the speaker expected the opposite.","k":"mcq"},{"id":"h37","n":14,"q":"Add the tag: <i>That's right, ___?<\/i>","o":["isn't it","isn't that","is it","doesn't it"],"a":0,"e":"The tag repeats the auxiliary and uses a pronoun, not the original noun or demonstrative.","k":"mcq"},{"id":"h38","n":14,"q":"Add the tag: <i>You haven't finished, ___?<\/i>","o":["have you","haven't you","did you","do you"],"a":0,"e":"A negative statement takes a positive tag, and the tag repeats the same auxiliary (<i>have<\/i>).","k":"mcq"},{"id":"h39","n":14,"q":"Add the tag: <i>Let's sit down, ___?<\/i>","o":["shall we","will we","don't we","aren't we"],"a":0,"e":"After <i>let's<\/i> the tag is <i>shall we?<\/i> in British English.","k":"mcq"},{"id":"h40","n":16,"q":"<i>I hope so.<\/i> What does <b>so<\/b> replace?","o":["A whole clause mentioned before","A noun","An adjective","A prepositional phrase"],"a":0,"e":"<i>So<\/i> stands for a clause, avoiding repetition: <i>Is it raining? ~ I hope so.<\/i>","k":"mcq"},{"id":"h41","n":18,"q":"Complete: <i>I don't like it, and ___.<\/i>","o":["neither does he","so does he","neither he does","he doesn't neither"],"a":0,"e":"After a negative we use <i>neither/nor<\/i> + auxiliary + subject. After a positive we use <i>so<\/i> + auxiliary + subject.","k":"mcq"},{"id":"h42","n":18,"q":"Complete: <i>She's tired, and ___.<\/i>","o":["so am I","neither am I","so I am","I am so"],"a":0,"e":"<i>So + auxiliary + subject<\/i> expresses agreement with a positive statement.","k":"mcq"},{"id":"h43","n":19,"q":"Which is correct?","o":["I guess not.","I don't guess so.","I guess no.","I not guess so."],"a":0,"e":"With <i>guess<\/i> the usual negative form is <i>I guess not<\/i>, not <i>I don't guess so<\/i>.","k":"mcq"},{"id":"h44","n":21,"q":"In English, new or important information usually comes…","o":["at the end of the clause","at the beginning","directly after the subject","before the verb"],"a":0,"e":"Given information tends to come first and new information last — this is the end-focus principle.","k":"mcq"},{"id":"h45","n":22,"q":"Choose the correct order.","o":["Outside two men were talking.","Outside were talking two men.","Outside talking were two men.","Two men outside were talking outside."],"a":0,"e":"Putting an adverbial in front position does not by itself invert subject and verb here.","k":"mcq"},{"id":"h46","n":23,"q":"Complete: <i>___ a problem with the heating.<\/i>","o":["There's","It's","That's","Here's"],"a":0,"e":"<i>There<\/i> is the empty subject used to introduce the existence of something.","k":"mcq"},{"id":"h47","n":24,"q":"Complete: <i>___ is difficult to explain.<\/i>","o":["It","There","This","That"],"a":0,"e":"<i>It<\/i> is the empty subject standing in for the real subject, often a to-infinitive or that-clause.","k":"mcq"},{"id":"h48","n":25,"q":"<i>It was Sarah who paid.<\/i> This structure is called…","o":["a cleft sentence","an echo question","inversion","nominalization"],"a":0,"e":"Cleft sentences with <i>it<\/i> put special emphasis on one element of the clause.","k":"mcq"},{"id":"h49","n":26,"q":"Which use is typical of the present simple?","o":["A repeated or habitual action","An action happening right now","A finished action with present result","An arrangement made for tomorrow"],"a":0,"e":"The present simple is used for habits, repeated actions, permanent situations and general truths.","k":"mcq"},{"id":"h50","n":26,"q":"Complete: <i>Water ___ at 100 degrees.<\/i>","o":["boils","is boiling","has boiled","boil"],"a":0,"e":"General truths take the present simple.","k":"mcq"},{"id":"h51","n":27,"q":"Complete: <i>Look — it ___ again.<\/i>","o":["'s raining","rains","rained","has rained"],"a":0,"e":"The present continuous describes something happening at or around the moment of speaking.","k":"mcq"},{"id":"h52","n":27,"q":"Which is a typical use of the present continuous?","o":["A temporary situation","A permanent fact","A completed past event","A general truth"],"a":0,"e":"The continuous suggests something temporary or in progress, contrasted with the permanence of the simple.","k":"mcq"},{"id":"h53","n":28,"q":"Complete: <i>I usually ___ the bus, but this week I ___.<\/i>","o":["take / 'm walking","am taking / walk","take / walk","am taking / am walking"],"a":0,"e":"The habit takes the present simple; the temporary change takes the present continuous.","k":"mcq"},{"id":"h54","n":28,"q":"Which verb is not normally used in the continuous?","o":["know","work","travel","study"],"a":0,"e":"State verbs like know, believe, belong and understand are not normally used in continuous forms.","k":"mcq"},{"id":"h55","n":29,"q":"Complete: <i>We ___ to Spain last summer.<\/i>","o":["went","have gone","were going","have been"],"a":0,"e":"A finished action with a finished time expression (<i>last summer<\/i>) takes the past simple.","k":"mcq"},{"id":"h56","n":30,"q":"Complete: <i>I ___ the dishes — the kitchen is tidy now.<\/i>","o":["'ve washed","washed","was washing","had washed"],"a":0,"e":"The present perfect links a past action to a present result.","k":"mcq"},{"id":"h57","n":30,"q":"How is the present perfect formed?","o":["have/has + past participle","have/has + base form","was/were + -ing","had + past participle"],"a":0,"e":"The present perfect is the present tense of <i>have<\/i> plus the past participle.","k":"mcq"},{"id":"h58","n":31,"q":"Which sentence is correct?","o":["I saw him yesterday.","I have seen him yesterday.","I have saw him yesterday.","I did see him yesterday already."],"a":0,"e":"A finished time expression such as <i>yesterday<\/i> requires the past simple, not the present perfect.","k":"mcq"},{"id":"h59","n":32,"q":"Which time phrase goes with the present perfect?","o":["since Monday","two days ago","last week","in 2019"],"a":0,"e":"<i>Since<\/i> marks a period continuing to now, so it takes the present perfect. Finished-time phrases take the past simple.","k":"mcq"},{"id":"h60","n":33,"q":"Complete: <i>While I ___ TV, the phone rang.<\/i>","o":["was watching","watched","have watched","had watched"],"a":0,"e":"The past continuous sets a longer background action interrupted by a shorter past simple action.","k":"mcq"},{"id":"h61","n":34,"q":"Complete: <i>She's tired — she ___ all morning.<\/i>","o":["'s been running","'s run","was running","ran"],"a":0,"e":"The present perfect continuous emphasises the duration of an activity with a present result.","k":"mcq"},{"id":"h62","n":35,"q":"Complete: <i>The train ___ before we got to the station.<\/i>","o":["had left","has left","left","was leaving"],"a":0,"e":"The past perfect shows that one past action happened before another past action.","k":"mcq"},{"id":"h63","n":36,"q":"Which sentence is correct?","o":["I think you're right.","I am thinking you're right.","I think you are being right.","I am thinking you are right."],"a":0,"e":"<i>Think<\/i> meaning 'have an opinion' is a state verb and is not used in the continuous.","k":"mcq"},{"id":"h64","n":38,"q":"Complete: <i>That bag looks heavy. I ___ carry it for you.<\/i>","o":["'ll","'m going to","am","was going to"],"a":0,"e":"<i>Will<\/i> is used for a decision made at the moment of speaking, such as an offer.","k":"mcq"},{"id":"h65","n":39,"q":"Complete: <i>Look at those clouds — it ___ rain.<\/i>","o":["'s going to","will","shall","is to"],"a":0,"e":"<i>Be going to<\/i> is used for a prediction based on present evidence.","k":"mcq"},{"id":"h66","n":40,"q":"Complete: <i>I ___ the dentist at four tomorrow.<\/i>","o":["'m seeing","see","will see","would see"],"a":0,"e":"The present continuous is used for a fixed personal arrangement in the future.","k":"mcq"},{"id":"h67","n":40,"q":"Complete: <i>The train ___ at 6.15.<\/i>","o":["leaves","is leaving","will leave","would leave"],"a":0,"e":"The present simple is used for timetables and scheduled events.","k":"mcq"},{"id":"h68","n":41,"q":"Which is best for a plan already decided?","o":["We're going to redecorate the flat.","We'll redecorate the flat.","We redecorate the flat.","We would redecorate the flat."],"a":0,"e":"<i>Be going to<\/i> expresses an intention or plan decided before the moment of speaking.","k":"mcq"},{"id":"h69","n":42,"q":"<i>The Prime Minister is to visit Beijing.<\/i> <b>Be to<\/b> here suggests…","o":["an official arrangement","an offer","a possibility","a habit"],"a":0,"e":"<i>Be to<\/i> is used for official plans and arrangements, common in news reporting.","k":"mcq"},{"id":"h70","n":43,"q":"Complete: <i>This time next week I ___ on a beach.<\/i>","o":["'ll be lying","'ll lie","'ll have lain","lie"],"a":0,"e":"The future continuous describes an action in progress at a point in the future.","k":"mcq"},{"id":"h71","n":43,"q":"Complete: <i>By 2030 they ___ the bridge.<\/i>","o":["will have finished","will finish","will be finishing","finish"],"a":0,"e":"The future perfect describes something completed before a point in the future.","k":"mcq"},{"id":"h72","n":44,"q":"Which sentence is correct?","o":["There were a lot of people.","There was a lot of people.","It were a lot of people.","There have a lot of people."],"a":0,"e":"The verb agrees with the following noun phrase; <i>a lot of people<\/i> is plural.","k":"mcq"},{"id":"h73","n":45,"q":"Which sentence describes a repeated action?","o":["I have a shower every morning.","I am having a shower.","I have had a shower.","I had been having a shower."],"a":0,"e":"<i>Have<\/i> in the sense of an activity can be used in the continuous, but a habit takes the simple.","k":"mcq"},{"id":"h74","n":46,"q":"Choose the correct verb: <i>___ the housework.<\/i>","o":["do","make","have","take"],"a":0,"e":"We <i>do<\/i> work, jobs and chores; we <i>make<\/i> things we produce or create.","k":"mcq"},{"id":"h75","n":46,"q":"Choose the correct verb: <i>___ a decision.<\/i>","o":["make","do","have","give"],"a":0,"e":"<i>Make a decision<\/i> is fixed. Compare <i>do the shopping, do business<\/i>.","k":"mcq"},{"id":"h76","n":47,"q":"<i>Have a look<\/i> is an example of…","o":["a verb + noun structure replacing a simple verb","a phrasal verb","the passive","an imperative"],"a":0,"e":"Patterns like <i>have a look, have a rest, have a swim<\/i> use have + noun instead of the plain verb.","k":"mcq"},{"id":"h77","n":48,"q":"Which is true of modal verbs?","o":["They have no -s in the third person","They take to before the next verb","They have past participles","They can follow another modal"],"a":0,"e":"Modals have no -s, no -ing and no infinitive form, and are followed by the bare infinitive.","k":"mcq"},{"id":"h78","n":48,"q":"Which sentence is correct?","o":["She can swim well.","She cans swim well.","She can to swim well.","She can swimming well."],"a":0,"e":"Modals are followed by the base form without <i>to<\/i>, and never take an -s ending.","k":"mcq"},{"id":"h79","n":49,"q":"<i>Be able to<\/i> and <i>have to<\/i> are examples of…","o":["modal phrases","pure modals","auxiliaries of the perfect","linking verbs"],"a":0,"e":"Modal phrases have the meanings of modals but behave like ordinary verbs, so they have full forms.","k":"mcq"},{"id":"h80","n":50,"q":"Complete: <i>You ___ have a licence to drive.<\/i> (a legal rule)","o":["have to","should","might","would"],"a":0,"e":"External rules and regulations usually take <i>have to<\/i>; <i>must<\/i> often expresses the speaker's own authority.","k":"mcq"},{"id":"h81","n":50,"q":"Which expresses the speaker's own strong feeling?","o":["You must see this film.","You have to see this film by law.","You are able to see this film.","You should have seen this film."],"a":0,"e":"<i>Must<\/i> typically comes from the speaker; <i>have to<\/i> points to an outside obligation.","k":"mcq"},{"id":"h82","n":51,"q":"<i>You don't have to pay.<\/i> This means…","o":["It isn't necessary to pay.","It's forbidden to pay.","You should pay.","You must not pay."],"a":0,"e":"<i>Don't have to<\/i> and <i>needn't<\/i> mean absence of obligation. <i>Mustn't<\/i> means prohibition.","k":"mcq"},{"id":"h83","n":51,"q":"<i>You mustn't touch that.<\/i> This means…","o":["It is forbidden.","It isn't necessary.","It is optional.","It is advisable."],"a":0,"e":"<i>Mustn't<\/i> expresses prohibition, which is quite different from <i>don't have to<\/i>.","k":"mcq"},{"id":"h84","n":52,"q":"Complete: <i>You ___ see a doctor about that cough.<\/i> (advice)","o":["should","must not","don't have to","will"],"a":0,"e":"<i>Should<\/i> and <i>ought to<\/i> give advice or say what is the right thing to do.","k":"mcq"},{"id":"h85","n":52,"q":"<i>We'd better leave now.<\/i> <b>Had better<\/b> suggests…","o":["strong advice, often with a warning","a past habit","a polite request","a possibility"],"a":0,"e":"<i>Had better<\/i> gives urgent advice and implies a bad result if it is not followed. It is followed by the bare infinitive.","k":"mcq"},{"id":"h86","n":52,"q":"<i>The train was supposed to arrive at six.<\/i> This suggests…","o":["it probably didn't","it definitely did","it will arrive","it must arrive"],"a":0,"e":"<i>Be supposed to<\/i> in the past often implies that the expected thing did not happen.","k":"mcq"},{"id":"h87","n":53,"q":"Complete: <i>___ I borrow your pen?<\/i> (asking permission, neutral)","o":["Can","Must","Should","Would"],"a":0,"e":"Can, could and may all ask permission; <i>may<\/i> is the most formal and <i>can<\/i> the most neutral.","k":"mcq"},{"id":"h88","n":53,"q":"Which is used for permission in the past that was general, not a single occasion?","o":["I could stay up late as a child.","I was able to stay up late last night.","I might stay up late.","I must stay up late."],"a":0,"e":"<i>Could<\/i> expresses general past permission or ability; a single achieved occasion prefers <i>was able to<\/i>.","k":"mcq"},{"id":"h89","n":54,"q":"<i>That can't be Tom — he's in Japan.<\/i> <b>Can't<\/b> expresses…","o":["certainty that something is untrue","lack of permission","lack of ability","a prohibition"],"a":0,"e":"For deduction, <i>must<\/i> expresses certainty that something is true and <i>can't<\/i> certainty that it is not.","k":"mcq"},{"id":"h90","n":54,"q":"Complete: <i>The lights are on, so someone ___ be at home.<\/i>","o":["must","can't","might not","needn't"],"a":0,"e":"<i>Must<\/i> expresses a confident deduction based on evidence.","k":"mcq"},{"id":"h91","n":55,"q":"<i>It might rain later.<\/i> The speaker thinks it is…","o":["possible","certain","impossible","forbidden"],"a":0,"e":"May, might and could all express possibility; <i>might<\/i> and <i>could<\/i> often suggest a slightly smaller chance.","k":"mcq"},{"id":"h92","n":55,"q":"Which sentence expresses possibility, not ability?","o":["The road could be closed.","She could swim at four.","I could see the sea.","We could hear voices."],"a":0,"e":"<i>Could<\/i> for possibility refers to what may be true; the others describe past ability or perception.","k":"mcq"},{"id":"h93","n":56,"q":"Complete: <i>The car broke down, but we ___ repair it ourselves.<\/i>","o":["were able to","could","can","have been able"],"a":0,"e":"For a specific past achievement we use <i>was/were able to<\/i> or <i>managed to<\/i>, not <i>could<\/i>.","k":"mcq"},{"id":"h94","n":57,"q":"<i>Would you mind waiting?<\/i> The function of <b>would<\/b> here is…","o":["making a polite request","talking about the past","expressing certainty","expressing obligation"],"a":0,"e":"<i>Would<\/i> forms polite requests and offers, and also appears in unreal conditionals.","k":"mcq"},{"id":"h95","n":57,"q":"<i>When I was young, we would spend every summer by the sea.<\/i> <b>Would<\/b> here means…","o":["used to (a past habit)","might have","was able to","was obliged to"],"a":0,"e":"<i>Would<\/i> can describe repeated past actions, though not past states — for states use <i>used to<\/i>.","k":"mcq"},{"id":"h96","n":58,"q":"Which sentence is correct?","o":["I used to live in Perth.","I used to living in Perth.","I use to live in Perth.","I am used to live in Perth."],"a":0,"e":"<i>Used to<\/i> + base form describes a past habit or state that is no longer true.","k":"mcq"},{"id":"h97","n":58,"q":"<i>I'm used to getting up early.<\/i> This means…","o":["it is now familiar to me","I did it in the past","I must do it","I would rather do it"],"a":0,"e":"<i>Be used to<\/i> + noun or gerund means 'be accustomed to'. This is different from <i>used to<\/i> + base form.","k":"mcq"},{"id":"h98","n":59,"q":"How is the passive formed?","o":["be + past participle","have + past participle","be + -ing","do + base form"],"a":0,"e":"All passive forms use a form of <i>be<\/i> plus the past participle.","k":"mcq"},{"id":"h99","n":59,"q":"Make passive: <i>They are repairing the road.<\/i>","o":["The road is being repaired.","The road is repaired.","The road has repaired.","The road was repairing."],"a":0,"e":"The present continuous passive is <i>am/is/are being<\/i> + past participle.","k":"mcq"},{"id":"h100","n":59,"q":"Make passive: <i>Someone has stolen my bike.<\/i>","o":["My bike has been stolen.","My bike is stolen.","My bike was stealing.","My bike has stolen."],"a":0,"e":"The present perfect passive is <i>have/has been<\/i> + past participle.","k":"mcq"},{"id":"h101","n":60,"q":"Why is the passive often used?","o":["The agent is unknown or unimportant","It is always more polite","It shortens the sentence","It is required after modals"],"a":0,"e":"We choose the passive when the doer is unknown, obvious, or less important than the action.","k":"mcq"},{"id":"h102","n":60,"q":"Which sentence keeps the topic at the front, as the passive is designed to do?","o":["The bridge was built in 1932.","They built the bridge in 1932.","In 1932 someone built a bridge.","A bridge, they built in 1932."],"a":0,"e":"The passive lets us begin with what the sentence is about, keeping new information at the end.","k":"mcq"},{"id":"h103","n":61,"q":"Which verb allows two passives?","o":["give","explain","describe","announce"],"a":0,"e":"<i>They gave me a prize<\/i> → <i>I was given a prize<\/i> / <i>A prize was given to me.<\/i> Explain and describe cannot take an indirect object.","k":"mcq"},{"id":"h104","n":61,"q":"<i>He is said to be very rich.<\/i> This pattern is used to…","o":["report an opinion without naming the source","give an order","express an ability","make a request"],"a":0,"e":"Reporting patterns like <i>is said/believed/thought to<\/i> avoid naming who holds the opinion.","k":"mcq"},{"id":"h105","n":62,"q":"<i>I had my hair cut.<\/i> This means…","o":["someone else cut it for me","I cut it myself","I wanted to cut it","I was going to cut it"],"a":0,"e":"<i>Have something done<\/i> means arranging for someone else to do it. <i>Get something done<\/i> is more informal.","k":"mcq"},{"id":"h106","n":63,"q":"Complete: <i>She hates ___ interrupted.<\/i>","o":["being","to be being","been","be"],"a":0,"e":"The passive gerund is <i>being<\/i> + past participle.","k":"mcq"},{"id":"h107","n":64,"q":"Which verb is followed by a to-infinitive?","o":["decide","enjoy","avoid","finish"],"a":0,"e":"Decide, hope, promise, refuse and want take the to-infinitive; enjoy, avoid and finish take the gerund.","k":"mcq"},{"id":"h108","n":65,"q":"Complete: <i>I went to the shop ___ some milk.<\/i>","o":["to buy","for buying","for buy","buying"],"a":0,"e":"The to-infinitive expresses purpose. <i>For + gerund<\/i> expresses the function of a thing, not a person's purpose.","k":"mcq"},{"id":"h109","n":66,"q":"Which sentence is correct?","o":["She enjoys swimming.","She enjoys to swim.","She enjoys swim.","She enjoys for swimming."],"a":0,"e":"Enjoy is always followed by the gerund.","k":"mcq"},{"id":"h110","n":66,"q":"Which verb takes the gerund, not the to-infinitive?","o":["avoid","agree","offer","manage"],"a":0,"e":"Avoid, admit, deny, mind, practise and suggest take the gerund.","k":"mcq"},{"id":"h111","n":67,"q":"<i>I remember locking the door<\/i> means…","o":["I locked it and I recall doing so","I must not forget to lock it","I forgot to lock it","I will lock it"],"a":0,"e":"With <i>remember<\/i>, the gerund refers to an earlier action; the to-infinitive refers to a duty still ahead.","k":"mcq"},{"id":"h112","n":67,"q":"<i>He stopped to smoke<\/i> means…","o":["he paused in order to smoke","he gave up smoking","he was smoking","he refused to smoke"],"a":0,"e":"<i>Stop + to-infinitive<\/i> gives the purpose of stopping; <i>stop + gerund<\/i> means to end the activity.","k":"mcq"},{"id":"h113","n":68,"q":"Complete: <i>They persuaded me ___ .<\/i>","o":["to stay","staying","stay","for staying"],"a":0,"e":"Verbs like advise, allow, ask, persuade, tell and want take object + to-infinitive.","k":"mcq"},{"id":"h114","n":69,"q":"Complete: <i>It's easy ___ mistakes.<\/i>","o":["to make","making","make","for making"],"a":0,"e":"Adjectives such as easy, difficult, glad, sorry and lucky are often followed by a to-infinitive.","k":"mcq"},{"id":"h115","n":71,"q":"Complete: <i>It was kind ___ you to help.<\/i>","o":["of","for","to","with"],"a":0,"e":"<i>Of<\/i> is used when the adjective describes the person (kind, nice, silly). <i>For<\/i> is used otherwise: <i>It's important for you to rest.<\/i>","k":"mcq"},{"id":"h116","n":72,"q":"Complete: <i>She made me ___ it again.<\/i>","o":["do","to do","doing","done"],"a":0,"e":"After <i>make<\/i> and <i>let<\/i> we use the bare infinitive in the active. The passive of make takes <i>to<\/i>: <i>I was made to do it.<\/i>","k":"mcq"},{"id":"h117","n":72,"q":"Which is correct?","o":["I saw him leave the building.","I saw him to leave the building.","I saw him for leaving the building.","I saw he leave the building."],"a":0,"e":"Verbs of perception take object + bare infinitive (a complete action) or object + -ing (an action in progress).","k":"mcq"},{"id":"h118","n":73,"q":"In <i>Swimming is good exercise<\/i>, <b>swimming<\/b> is…","o":["a gerund acting as subject","a present participle","an adjective","an infinitive"],"a":0,"e":"A gerund is an -ing form used as a noun; it can be subject, object or complement.","k":"mcq"},{"id":"h119","n":74,"q":"Complete: <i>I don't mind ___ .<\/i>","o":["waiting","to wait","wait","for wait"],"a":0,"e":"Mind is one of the verbs that takes the gerund.","k":"mcq"},{"id":"h120","n":75,"q":"Complete: <i>She's good ___ solving problems.<\/i>","o":["at","to","for","in"],"a":0,"e":"After a preposition we always use the gerund, never the infinitive.","k":"mcq"},{"id":"h121","n":75,"q":"Which is correct?","o":["I'm interested in learning Spanish.","I'm interested in to learn Spanish.","I'm interested to learning Spanish.","I'm interested for learn Spanish."],"a":0,"e":"A preposition is always followed by a gerund.","k":"mcq"},{"id":"h122","n":76,"q":"Complete: <i>It's no use ___ about it.<\/i>","o":["complaining","to complain","complain","complained"],"a":0,"e":"Fixed combinations such as <i>it's no use<\/i>, <i>it's worth<\/i> and <i>can't help<\/i> take the gerund.","k":"mcq"},{"id":"h123","n":77,"q":"Complete: <i>This knife is ___ bread.<\/i>","o":["for cutting","to cutting","for cut","to cutting of"],"a":0,"e":"<i>For + gerund<\/i> states the general function of a thing; <i>to + infinitive<\/i> states a person's purpose.","k":"mcq"},{"id":"h124","n":78,"q":"<i>His constant complaining annoyed everyone.<\/i> <b>Complaining<\/b> here follows…","o":["a possessive determiner","an article only","a preposition","a modal"],"a":0,"e":"A gerund can take a determiner, including a possessive, when it behaves fully as a noun.","k":"mcq"},{"id":"h125","n":79,"q":"In <i>a broken window<\/i>, <b>broken<\/b> is…","o":["a past participle used as an adjective","a gerund","a finite verb","an adverb"],"a":0,"e":"Past participles used as adjectives usually carry a passive meaning.","k":"mcq"},{"id":"h126","n":80,"q":"Which phrase is correct?","o":["a surprising result","a surprised result","a surprise result surprising","a result surprising"],"a":0,"e":"An -ing participle describes what something does or causes; an -ed participle describes how someone feels.","k":"mcq"},{"id":"h127","n":81,"q":"Complete: <i>I found her ___ in the garden.<\/i>","o":["working","work","to work","worked"],"a":0,"e":"Verb + object + -ing participle describes an action in progress when it was observed.","k":"mcq"},{"id":"h128","n":82,"q":"<i>Feeling tired, she went to bed early.<\/i> The participle clause expresses…","o":["reason","purpose","contrast","condition"],"a":0,"e":"Participle clauses commonly express time or reason, replacing a full clause with <i>because<\/i> or <i>when<\/i>.","k":"mcq"},{"id":"h129","n":83,"q":"Which sentence is correctly formed?","o":["Having finished the work, we went home.","Having finish the work, we went home.","Having finished the work, the work was done.","Have finished the work, we went home."],"a":0,"e":"<i>Having + past participle<\/i> shows the first action was completed before the second. The subject must be the same in both clauses.","k":"mcq"},{"id":"h130","n":85,"q":"What is the plural of <b>knife<\/b>?","o":["knives","knifes","knifs","knive"],"a":0,"e":"Nouns ending in -f or -fe often change to -ves: knife/knives, leaf/leaves, wife/wives.","k":"mcq"},{"id":"h131","n":85,"q":"What is the plural of <b>crisis<\/b>?","o":["crises","crisises","crisis","crisi"],"a":0,"e":"Greek and Latin nouns ending in -is take -es: crisis/crises, analysis/analyses, basis/bases.","k":"mcq"},{"id":"h132","n":85,"q":"What is the plural of <b>tomato<\/b>?","o":["tomatoes","tomatos","tomatoies","tomato"],"a":0,"e":"Some nouns ending in -o add -es: tomatoes, potatoes, heroes. Others simply add -s: photos, pianos.","k":"mcq"},{"id":"h133","n":86,"q":"Which is correct for a plural noun?","o":["the students' results","the students's results","the student's results (many students)","the students results'"],"a":0,"e":"A regular plural already ending in -s takes only an apostrophe.","k":"mcq"},{"id":"h134","n":86,"q":"Which is correct?","o":["the children's toys","the childrens' toys","the childrens toys","the children toys'"],"a":0,"e":"An irregular plural not ending in -s takes apostrophe + s.","k":"mcq"},{"id":"h135","n":87,"q":"Which phrase normally uses the possessive form rather than <i>of<\/i>?","o":["my sister's car","the car's of my sister","the roof's of the house","the leg's of the table"],"a":0,"e":"The possessive with 's is normal with people and animals; <i>of<\/i> is usual with things.","k":"mcq"},{"id":"h136","n":88,"q":"Which sentence is correct?","o":["Water is essential for life.","The water is essential for life.","A water is essential for life.","Waters are essential for life."],"a":0,"e":"An uncountable noun used in a general sense takes no article.","k":"mcq"},{"id":"h137","n":88,"q":"Which sentence is correct?","o":["The boat leaves at ten.","Boat leaves at ten.","Boats leaves at ten.","A boat leave at ten."],"a":0,"e":"A singular countable noun normally needs a determiner such as <i>a<\/i> or <i>the<\/i>.","k":"mcq"},{"id":"h138","n":89,"q":"Which sentence is correct?","o":["I've found out some information.","I've found out an information.","I've found out some informations.","I've found out a few informations."],"a":0,"e":"Information, news, advice, furniture and luggage are uncountable in English.","k":"mcq"},{"id":"h139","n":89,"q":"Which is correct?","o":["There was no news of the child.","There were no news of the child.","There was no newses of the child.","There were not any news of the child."],"a":0,"e":"<i>News<\/i> looks plural but is uncountable and takes a singular verb.","k":"mcq"},{"id":"h140","n":89,"q":"How can you make <b>furniture<\/b> countable?","o":["an item of furniture","a furniture","one furniture","two furnitures"],"a":0,"e":"With uncountable nouns we use <i>a piece/bit/item of<\/i>.","k":"mcq"},{"id":"h141","n":90,"q":"<i>I ordered a pizza with tomato.<\/i> Why is <b>tomato<\/b> uncountable here?","o":["It refers to the material, not whole items","It is always uncountable","It follows a preposition","It is plural in meaning"],"a":0,"e":"Foods are countable as separate items but uncountable when cut or used as a substance.","k":"mcq"},{"id":"h142","n":90,"q":"Which pair shows the countable/uncountable contrast correctly?","o":["a glass of water / handling glass","a water / a glass","glasses of glass / a water","water glass / glasses water"],"a":0,"e":"The countable noun names a specific object; the uncountable noun names the material.","k":"mcq"},{"id":"h143","n":92,"q":"Complete: <i>The police ___ investigating.<\/i>","o":["are","is","was","has"],"a":0,"e":"<i>Police<\/i> takes a plural verb. So do <i>people<\/i> and <i>cattle<\/i>.","k":"mcq"},{"id":"h144","n":92,"q":"Complete: <i>Ten kilometres ___ a long way to walk.<\/i>","o":["is","are","were","have been"],"a":0,"e":"A measurement or amount treated as a single quantity takes a singular verb.","k":"mcq"},{"id":"h145","n":93,"q":"Which noun has a plural form but is not counted?","o":["mathematics","chair","idea","building"],"a":0,"e":"Subjects like mathematics, physics and economics end in -s but take a singular verb.","k":"mcq"},{"id":"h146","n":94,"q":"<i>Trousers<\/i> is an example of…","o":["a pair noun","a group noun","an uncountable noun","a proper noun"],"a":0,"e":"Pair nouns (trousers, scissors, glasses) are always plural; we count them with <i>a pair of<\/i>.","k":"mcq"},{"id":"h147","n":94,"q":"Which is a group noun that can take a singular or plural verb in British English?","o":["team","water","advice","luggage"],"a":0,"e":"Group nouns such as team, government and family can be seen as one unit or as individual members.","k":"mcq"},{"id":"h148","n":96,"q":"Complete: <i>I bought ___ book. ___ book was excellent.<\/i>","o":["a / The","the / A","a / A","the / The"],"a":0,"e":"<i>A/an<\/i> introduces something for the first time; <i>the<\/i> refers back to it.","k":"mcq"},{"id":"h149","n":96,"q":"Complete: <i>Could you shut ___ door, please?<\/i>","o":["the","a","an","no article"],"a":0,"e":"<i>The<\/i> is used when it is clear from the situation which one is meant.","k":"mcq"},{"id":"h150","n":97,"q":"Complete: <i>She plays ___ piano beautifully.<\/i>","o":["the","a","an","no article"],"a":0,"e":"We use <i>the<\/i> with musical instruments in this sense.","k":"mcq"},{"id":"h151","n":97,"q":"Complete: <i>He was sent to ___ prison for two years.<\/i>","o":["no article","the","a","an"],"a":0,"e":"With institutions used for their normal purpose we use no article: <i>in prison, at school, in hospital<\/i>.","k":"mcq"},{"id":"h152","n":98,"q":"Which is correct for a general statement?","o":["Dogs are loyal animals.","The dogs are loyal animals.","A dogs are loyal animals.","Dog is loyal animals."],"a":0,"e":"For generalizations we use a plural noun with no article.","k":"mcq"},{"id":"h153","n":99,"q":"Which sentence uses a singular noun on its own correctly?","o":["We travelled by train.","We travelled by the train.","We travelled by a train.","We travelled by trains."],"a":0,"e":"<i>By + means of transport<\/i> takes no article: by car, by bus, by plane.","k":"mcq"},{"id":"h154","n":100,"q":"Complete: <i>I'll see you ___ Monday morning.<\/i>","o":["on","in the","at the","the"],"a":0,"e":"Specific days and dates take <i>on<\/i>, with no article before the day name.","k":"mcq"},{"id":"h155","n":100,"q":"Complete: <i>We usually go out ___ evening.<\/i>","o":["in the","at","on","the"],"a":0,"e":"<i>In the morning/afternoon/evening<\/i>, but <i>at night<\/i>.","k":"mcq"},{"id":"h156","n":101,"q":"Which name takes <b>the<\/b>?","o":["the Netherlands","the France","the Mount Everest","the Lake Como"],"a":0,"e":"Plural country names and names with 'republic/kingdom/states' take <i>the<\/i>; most single countries, mountains and lakes do not.","k":"mcq"},{"id":"h157","n":101,"q":"Which is correct?","o":["the Pacific Ocean","Pacific Ocean","a Pacific Ocean","the Pacific ocean's"],"a":0,"e":"Oceans, seas, rivers and mountain ranges take <i>the<\/i>.","k":"mcq"},{"id":"h158","n":102,"q":"Which is correct?","o":["It's her book.","It's hers book.","It's her's book.","It's she book."],"a":0,"e":"<i>Her<\/i> is the possessive determiner before a noun; <i>hers<\/i> is the possessive pronoun used alone.","k":"mcq"},{"id":"h159","n":103,"q":"Complete: <i>___ shoes over there are mine.<\/i>","o":["Those","That","This","These"],"a":0,"e":"<i>Those<\/i> is plural and refers to things at a distance; <i>these<\/i> is plural and near.","k":"mcq"},{"id":"h160","n":105,"q":"Complete: <i>How ___ money do you need?<\/i>","o":["much","many","few","several"],"a":0,"e":"<i>Much<\/i> goes with uncountable nouns, <i>many<\/i> with plural countable nouns.","k":"mcq"},{"id":"h161","n":105,"q":"Which is correct?","o":["There aren't many chairs.","There aren't much chairs.","There isn't many chairs.","There aren't a much chairs."],"a":0,"e":"<i>Many<\/i> is used with plural countable nouns.","k":"mcq"},{"id":"h162","n":105,"q":"<i>A few friends came<\/i> suggests…","o":["a small but positive number","almost nobody","a large number","nobody at all"],"a":0,"e":"<i>A few<\/i> is positive; <i>few<\/i> alone stresses that the number is small — nearly negative.","k":"mcq"},{"id":"h163","n":106,"q":"Complete: <i>___ of the students passed.<\/i>","o":["Most","Most of","The most","Almost"],"a":0,"e":"<i>Most of the<\/i> + noun, or <i>most<\/i> + noun for generalizations. Here 'Most' fits before 'of the students'.","k":"mcq"},{"id":"h164","n":106,"q":"Which is correct?","o":["All the students were present.","All of students were present.","All students of were present.","The all students were present."],"a":0,"e":"<i>All (of) the<\/i> + noun. <i>Of<\/i> is optional before <i>the<\/i>, but required before a pronoun.","k":"mcq"},{"id":"h165","n":107,"q":"Complete: <i>___ of the twins can walk yet.<\/i>","o":["Neither","Both","Either","None"],"a":0,"e":"<i>Neither<\/i> means 'not one and not the other' of two.","k":"mcq"},{"id":"h166","n":107,"q":"Which is correct?","o":["Both houses are for sale.","The both houses are for sale.","Both of houses are for sale.","Both house is for sale."],"a":0,"e":"<i>Both<\/i> + plural noun, or <i>both of the<\/i> + plural noun. We do not say <i>the both<\/i>.","k":"mcq"},{"id":"h167","n":107,"q":"Complete: <i>___ student was given a certificate.<\/i> (all of them, one by one)","o":["Each","Both","Either","Few"],"a":0,"e":"<i>Each<\/i> and <i>every<\/i> take a singular noun and verb; <i>each<\/i> stresses the individuals.","k":"mcq"},{"id":"h168","n":108,"q":"Complete: <i>I haven't got ___ money.<\/i>","o":["any","some","much of","a few"],"a":0,"e":"<i>Any<\/i> is normal in negatives and questions; <i>some<\/i> in positive statements.","k":"mcq"},{"id":"h169","n":108,"q":"Which uses <b>some<\/b> correctly in a question?","o":["Would you like some tea?","Would you like any tea?","Do you have some tea? (asking if any exists)","Have you got some tea at all?"],"a":0,"e":"<i>Some<\/i> is used in offers and requests where we expect a yes.","k":"mcq"},{"id":"h170","n":109,"q":"Complete: <i>Is there ___ bread?<\/i>","o":["enough","enough of","the enough","much of"],"a":0,"e":"<i>Enough<\/i> comes before a noun but after an adjective: <i>enough bread<\/i>, <i>big enough<\/i>.","k":"mcq"},{"id":"h171","n":110,"q":"Which is correct?","o":["Between you and me, it's a secret.","Between you and I, it's a secret.","Between yourself and I, it's a secret.","Between we, it's a secret."],"a":0,"e":"After a preposition we use the object pronoun: <i>me<\/i>, not <i>I<\/i>.","k":"mcq"},{"id":"h172","n":112,"q":"Complete: <i>She taught ___ to play the guitar.<\/i>","o":["herself","her","hers","she"],"a":0,"e":"A reflexive pronoun is used when the subject and object are the same person.","k":"mcq"},{"id":"h173","n":112,"q":"<i>I did it myself.<\/i> <b>Myself<\/b> here is…","o":["an emphatic pronoun","a reflexive object","a possessive","a subject"],"a":0,"e":"The emphatic pronoun stresses who did it and can be left out without changing the grammar.","k":"mcq"},{"id":"h174","n":113,"q":"Complete: <i>I'd like a coffee. Would you like ___?<\/i>","o":["one","it","ones","some one"],"a":0,"e":"<i>One<\/i> replaces a singular countable noun; <i>ones<\/i> replaces a plural.","k":"mcq"},{"id":"h175","n":114,"q":"Complete: <i>Everyone ___ arrived.<\/i>","o":["has","have","are","were"],"a":0,"e":"Compound pronouns like everyone, somebody and nothing take a singular verb.","k":"mcq"},{"id":"h176","n":114,"q":"Which is correct?","o":["Somebody left their coat.","Somebody left its coat.","Somebody left theirs coat.","Somebody left him coat."],"a":0,"e":"<i>They/their<\/i> is commonly used after everyone, someone and somebody when the person's sex is unknown.","k":"mcq"},{"id":"h177","n":116,"q":"Which adjective can only be used before a noun?","o":["main","glad","asleep","afraid"],"a":0,"e":"Some adjectives (main, only, elder) come only before a noun; others (glad, asleep, afraid) only after a linking verb.","k":"mcq"},{"id":"h178","n":117,"q":"Put the adjectives in the usual order: <i>a ___ ___ ___ table<\/i> (wooden / small / round)","o":["small round wooden","wooden small round","round wooden small","small wooden round"],"a":0,"e":"The usual order is opinion, size, shape, age, colour, origin, material.","k":"mcq"},{"id":"h179","n":117,"q":"Which order is correct?","o":["a lovely old Italian car","an Italian old lovely car","an old lovely Italian car","a lovely Italian old car"],"a":0,"e":"Opinion comes first, then age, then origin, then the noun.","k":"mcq"},{"id":"h180","n":118,"q":"Complete: <i>The film was ___, so we were ___.<\/i>","o":["boring / bored","bored / boring","boring / boring","bored / bored"],"a":0,"e":"The -ing form describes the cause; the -ed form describes the feeling.","k":"mcq"},{"id":"h181","n":119,"q":"<i>The rich<\/i> in <i>The rich should pay more tax<\/i> means…","o":["rich people in general","one rich person","richness","a rich thing"],"a":0,"e":"<i>The<\/i> + adjective refers to a whole group of people and takes a plural verb.","k":"mcq"},{"id":"h182","n":121,"q":"Where does an adverbial of manner normally go?","o":["End position","Front position","Between subject and verb always","Before the object"],"a":0,"e":"Adverbials of manner usually go at the end: <i>She sang beautifully.<\/i>","k":"mcq"},{"id":"h183","n":122,"q":"Complete: <i>I ___ go to the cinema.<\/i> (mid position)","o":["often","often to","to often","do often"],"a":0,"e":"Adverbs of frequency go in mid position, before the main verb but after <i>be<\/i> and after the first auxiliary.","k":"mcq"},{"id":"h184","n":122,"q":"Which is correct?","o":["She is always late.","She always is late.","Always she is late for.","She is late always."],"a":0,"e":"After the verb <i>be<\/i>, the mid-position adverb comes directly after it.","k":"mcq"},{"id":"h185","n":123,"q":"Which adverb has the same form as its adjective?","o":["fast","quick","careful","happy"],"a":0,"e":"<i>Fast, hard, late, early<\/i> keep the same form. Note <i>hardly<\/i> and <i>lately<\/i> have different meanings.","k":"mcq"},{"id":"h186","n":123,"q":"<i>He hardly worked<\/i> means…","o":["he did almost no work","he worked with great effort","he worked recently","he worked quickly"],"a":0,"e":"<i>Hardly<\/i> means 'almost not'. <i>Hard<\/i> as an adverb means 'with effort'.","k":"mcq"},{"id":"h187","n":124,"q":"Which sentence places the manner adverbial correctly?","o":["She opened the letter carefully.","She opened carefully the letter.","Carefully she the letter opened.","She carefully the letter opened."],"a":0,"e":"An adverbial does not normally come between the verb and its object.","k":"mcq"},{"id":"h188","n":125,"q":"When place and time both appear at the end, which comes first?","o":["Place, then time","Time, then place","Either, freely","Time must go in front position"],"a":0,"e":"The usual order at the end of a clause is manner, place, then time.","k":"mcq"},{"id":"h189","n":126,"q":"Complete: <i>We ___ eat out.<\/i> (meaning almost never)","o":["seldom","often","usually","always"],"a":0,"e":"<i>Seldom<\/i> and <i>rarely<\/i> have a negative meaning close to <i>not often<\/i>.","k":"mcq"},{"id":"h190","n":127,"q":"In <i>very old<\/i>, <b>very<\/b> is…","o":["an adverb of degree","an adjective","a determiner","a conjunction"],"a":0,"e":"Adverbs of degree (very, quite, extremely, rather) modify adjectives and adverbs.","k":"mcq"},{"id":"h191","n":128,"q":"Complete: <i>The coffee was too hot ___ .<\/i>","o":["to drink","for drinking","for drink","to drinking"],"a":0,"e":"<i>Too + adjective + to-infinitive<\/i> shows that something is impossible.","k":"mcq"},{"id":"h192","n":128,"q":"Which is correct?","o":["It's such a nice day.","It's such nice day.","It's so a nice day.","It's so nice a day that."],"a":0,"e":"<i>Such<\/i> goes with a noun phrase; <i>so<\/i> goes with an adjective or adverb alone.","k":"mcq"},{"id":"h193","n":129,"q":"<i>Frankly, I don't agree.<\/i> <b>Frankly<\/b> is…","o":["a comment adverbial","an adverb of manner","an adverb of degree","a linking adverbial"],"a":0,"e":"Comment adverbials express the speaker's attitude to what is being said.","k":"mcq"},{"id":"h194","n":130,"q":"Which is a linking adverbial?","o":["However","Carefully","Extremely","Yesterday"],"a":0,"e":"Linking adverbials (however, therefore, moreover) connect a sentence to what came before.","k":"mcq"},{"id":"h195","n":131,"q":"What is the comparative of <b>happy<\/b>?","o":["happier","more happy","happyer","most happy"],"a":0,"e":"Two-syllable adjectives ending in -y change y to i and add -er.","k":"mcq"},{"id":"h196","n":131,"q":"What is the comparative of <b>expensive<\/b>?","o":["more expensive","expensiver","most expensive","expensiviest"],"a":0,"e":"Adjectives of three or more syllables take <i>more<\/i> and <i>most<\/i>.","k":"mcq"},{"id":"h197","n":132,"q":"What is the comparative of <b>bad<\/b>?","o":["worse","badder","worser","more bad"],"a":0,"e":"Irregular forms: good/better/best, bad/worse/worst, far/further/furthest.","k":"mcq"},{"id":"h198","n":133,"q":"What is the comparative adverb of <b>carefully<\/b>?","o":["more carefully","carefullier","carefuller","most carefully"],"a":0,"e":"Adverbs ending in -ly take <i>more<\/i> and <i>most<\/i>.","k":"mcq"},{"id":"h199","n":134,"q":"Complete: <i>She's not as tall ___ her brother.<\/i>","o":["as","than","that","like"],"a":0,"e":"<i>As … as<\/i> expresses equality; <i>than<\/i> is used after a comparative.","k":"mcq"},{"id":"h200","n":134,"q":"Which is correct?","o":["He's taller than me.","He's taller as me.","He's more tall than me.","He's tallest than me."],"a":0,"e":"<i>Than<\/i> follows a comparative form; the object pronoun is normal in everyday English.","k":"mcq"},{"id":"h201","n":134,"q":"Complete: <i>The sooner we leave, ___ .<\/i>","o":["the better","better","the best","more better"],"a":0,"e":"The pattern <i>the + comparative, the + comparative<\/i> links two changes.","k":"mcq"},{"id":"h202","n":136,"q":"Complete: <i>The cat is hiding ___ the sofa.<\/i> (at the back of it)","o":["behind","in front of","among","across"],"a":0,"e":"<i>Behind<\/i> means at the back of; <i>in front of<\/i> is the opposite.","k":"mcq"},{"id":"h203","n":137,"q":"Complete: <i>I was ___ the bus stop.<\/i>","o":["at","on","in","to"],"a":0,"e":"<i>At<\/i> treats a place as a point in space: at the door, at the corner, at the bus stop.","k":"mcq"},{"id":"h204","n":137,"q":"Complete: <i>Don't leave your glasses ___ the floor.<\/i>","o":["on","at","in","over"],"a":0,"e":"<i>On<\/i> is used for a surface, and also for position on a line: <i>Bath is on the River Avon.<\/i>","k":"mcq"},{"id":"h205","n":137,"q":"Complete: <i>She's ___ the theatre, watching a play.<\/i>","o":["at","in","on","to"],"a":0,"e":"We use <i>at<\/i> with a building or institution when we mean its normal purpose.","k":"mcq"},{"id":"h206","n":137,"q":"Complete: <i>He keeps his money ___ a box.<\/i>","o":["in","on","at","by"],"a":0,"e":"<i>In<\/i> is three-dimensional — used for something enclosed by an area or volume.","k":"mcq"},{"id":"h207","n":138,"q":"Complete: <i>They walked ___ the bridge to the other side.<\/i>","o":["across","through","along","among"],"a":0,"e":"<i>Across<\/i> means from one side to the other of a surface; <i>through<\/i> implies going inside something.","k":"mcq"},{"id":"h208","n":139,"q":"Complete: <i>The meeting is ___ Tuesday.<\/i>","o":["on","in","at","by"],"a":0,"e":"<i>On<\/i> for days and dates, <i>in<\/i> for months, seasons and years, <i>at<\/i> for clock times and festivals.","k":"mcq"},{"id":"h209","n":139,"q":"Complete: <i>We're going away ___ August.<\/i>","o":["in","on","at","by"],"a":0,"e":"<i>In<\/i> is used with months, seasons, years and longer periods.","k":"mcq"},{"id":"h210","n":139,"q":"Complete: <i>The film starts ___ eight o'clock.<\/i>","o":["at","on","in","by"],"a":0,"e":"<i>At<\/i> is used with clock times, and with <i>night<\/i>, <i>the weekend<\/i> and festivals.","k":"mcq"},{"id":"h211","n":140,"q":"Complete: <i>I've lived here ___ 2019.<\/i>","o":["since","for","ago","from"],"a":0,"e":"<i>Since<\/i> marks the starting point; <i>for<\/i> marks the length of a period.","k":"mcq"},{"id":"h212","n":140,"q":"Complete: <i>We waited ___ two hours.<\/i>","o":["for","since","ago","during"],"a":0,"e":"<i>For<\/i> + a length of time. <i>Since<\/i> + a point in time.","k":"mcq"},{"id":"h213","n":140,"q":"Complete: <i>She left ten minutes ___ .<\/i>","o":["ago","since","before","for"],"a":0,"e":"<i>Ago<\/i> follows the time expression and is used with the past simple.","k":"mcq"},{"id":"h214","n":141,"q":"Complete: <i>Please finish it ___ Friday.<\/i> (not later than)","o":["by","until","during","in"],"a":0,"e":"<i>By<\/i> means not later than; <i>until<\/i> means up to that time and no longer.","k":"mcq"},{"id":"h215","n":141,"q":"Complete: <i>I waited ___ six o'clock, then left.<\/i>","o":["until","by","for","since"],"a":0,"e":"<i>Until<\/i> describes a situation continuing up to a point in time.","k":"mcq"},{"id":"h216","n":141,"q":"Complete: <i>Nobody spoke ___ the meeting.<\/i>","o":["during","for","since","while"],"a":0,"e":"<i>During<\/i> is a preposition followed by a noun; <i>while<\/i> is a conjunction followed by a clause.","k":"mcq"},{"id":"h217","n":142,"q":"Complete: <i>The house was built ___ stone.<\/i>","o":["of","from","by","with"],"a":0,"e":"<i>Made of<\/i> shows the material is still recognisable; <i>made from<\/i> suggests it has been changed.","k":"mcq"},{"id":"h218","n":143,"q":"In <i>She turned off the light<\/i>, <b>off<\/b> is…","o":["an adverb particle","a preposition","a conjunction","an adjective"],"a":0,"e":"Phrasal verbs combine a verb with an adverb particle; the object can often go before or after the particle.","k":"mcq"},{"id":"h219","n":143,"q":"Which is correct?","o":["Turn it off.","Turn off it.","Turn it off it.","Off turn it."],"a":0,"e":"With a phrasal verb, a pronoun object must come between the verb and the particle.","k":"mcq"},{"id":"h220","n":144,"q":"<i>Put off<\/i> in <i>They put off the meeting<\/i> means…","o":["postpone","cancel","attend","arrange"],"a":0,"e":"Many phrasal verbs are idiomatic — their meaning cannot be worked out from the parts.","k":"mcq"},{"id":"h221","n":145,"q":"In <i>look after the children<\/i>, <b>after<\/b> is…","o":["a preposition, so the object follows it","an adverb particle","optional","a conjunction"],"a":0,"e":"In a prepositional verb the object always comes after the preposition: <i>look after them<\/i>, not <i>look them after<\/i>.","k":"mcq"},{"id":"h222","n":146,"q":"Which pattern is correct?","o":["I'll look into the problem.","I'll look the problem into.","I'll look it into.","I'll into look the problem."],"a":0,"e":"Prepositional verbs never separate the verb from the preposition.","k":"mcq"},{"id":"h223","n":147,"q":"Complete: <i>She's good ___ maths.<\/i>","o":["at","in","on","for"],"a":0,"e":"Adjective + preposition combinations must be learned: good at, interested in, afraid of, proud of.","k":"mcq"},{"id":"h224","n":147,"q":"Complete: <i>There's no need ___ worry.<\/i>","o":["to","for","of","at"],"a":0,"e":"<i>Need<\/i> as a noun is followed by <i>to<\/i> + infinitive or <i>for<\/i> + noun.","k":"mcq"},{"id":"h225","n":148,"q":"A clause containing a subject and a finite verb that can stand alone is…","o":["a main clause","a subordinate clause","a phrase","a participle clause"],"a":0,"e":"Main clauses stand alone; subordinate clauses depend on a main clause.","k":"mcq"},{"id":"h226","n":150,"q":"Which word links two alternatives?","o":["or","and","so","because"],"a":0,"e":"<i>Or<\/i> offers alternatives; <i>and<\/i> adds; <i>so<\/i> shows result; <i>because<\/i> shows reason.","k":"mcq"},{"id":"h227","n":151,"q":"Complete: <i>It was raining, ___ we stayed in.<\/i>","o":["so","but","or","because"],"a":0,"e":"<i>So<\/i> introduces a result. <i>Because<\/i> would introduce the reason instead.","k":"mcq"},{"id":"h228","n":152,"q":"Complete: <i>I'll call you ___ I arrive.<\/i>","o":["when","when will","that","for"],"a":0,"e":"In a time clause we use the present tense for future meaning — never <i>will<\/i>.","k":"mcq"},{"id":"h229","n":152,"q":"Which is correct?","o":["As soon as she arrives, we'll start.","As soon as she will arrive, we'll start.","As soon as she arrived, we'll start.","As soon as she is arriving, we start."],"a":0,"e":"Time clauses with <i>when, as soon as, until, before, after<\/i> take the present for the future.","k":"mcq"},{"id":"h230","n":153,"q":"Complete: <i>We left early ___ miss the traffic.<\/i>","o":["so as to","for to","so that to","in order for"],"a":0,"e":"Purpose can be expressed by <i>to<\/i>, <i>in order to<\/i> or <i>so as to<\/i> + infinitive.","k":"mcq"},{"id":"h231","n":154,"q":"Complete: <i>She sings ___ a professional.<\/i>","o":["like","as","so as","such as"],"a":0,"e":"<i>Like<\/i> + noun means 'similar to'. <i>As<\/i> + noun means 'in the role of'.","k":"mcq"},{"id":"h232","n":156,"q":"Complete: <i>If you heat ice, it ___ .<\/i>","o":["melts","will melt","would melt","melted"],"a":0,"e":"A type 0 conditional uses present + present for something that always happens.","k":"mcq"},{"id":"h233","n":156,"q":"Complete: <i>If it rains, we ___ wet.<\/i>","o":["'ll get","get","would get","got"],"a":0,"e":"Type 1 is <i>if<\/i> + present + <i>will<\/i>, for a real future possibility.","k":"mcq"},{"id":"h234","n":156,"q":"Which sentence is correct?","o":["If it rains, we'll stay in.","If it will rain, we'll stay in.","If it rains, we stay in tomorrow will.","If it would rain, we'll stay in."],"a":0,"e":"We do not normally use <i>will<\/i> in the if-clause of a type 1 conditional.","k":"mcq"},{"id":"h235","n":157,"q":"Complete: <i>If I ___ rich, I'd travel the world.<\/i>","o":["were","am","will be","have been"],"a":0,"e":"Type 2 uses past simple + <i>would<\/i> for an unreal or unlikely present situation. <i>Were<\/i> is used for all persons.","k":"mcq"},{"id":"h236","n":157,"q":"<i>If I had more time, I would help you.<\/i> This suggests…","o":["I don't have more time","I will have more time","I had more time before","I must find more time"],"a":0,"e":"The type 2 conditional describes an imaginary or contrary-to-fact present situation.","k":"mcq"},{"id":"h237","n":158,"q":"Complete: <i>If she ___ harder, she would have passed.<\/i>","o":["had studied","studied","would study","has studied"],"a":0,"e":"Type 3 is <i>if<\/i> + past perfect + <i>would have<\/i> + past participle, for an unreal past.","k":"mcq"},{"id":"h238","n":158,"q":"<i>If we had left earlier, we wouldn't have missed the train.<\/i> What actually happened?","o":["We left late and missed the train.","We left early and caught it.","We are about to leave.","We always miss the train."],"a":0,"e":"Type 3 conditionals describe the opposite of what really happened.","k":"mcq"},{"id":"h239","n":159,"q":"Rewrite without <b>if<\/b>: <i>If I had known…<\/i>","o":["Had I known…","Did I know…","Have I known…","Should I have known…"],"a":0,"e":"Inversion of the auxiliary replaces <i>if<\/i> in formal style: <i>Had I known, Were I you, Should you need help<\/i>.","k":"mcq"},{"id":"h240","n":160,"q":"Complete: <i>___ you need anything, just ask.<\/i>","o":["If","Unless","Despite","However"],"a":0,"e":"<i>Unless<\/i> means 'except if', so it would reverse the meaning here.","k":"mcq"},{"id":"h241","n":160,"q":"<i>Unless you hurry, you'll be late<\/i> means the same as…","o":["If you don't hurry, you'll be late.","If you hurry, you'll be late.","Because you hurry, you'll be late.","Although you hurry, you'll be late."],"a":0,"e":"<i>Unless<\/i> is close in meaning to <i>if … not<\/i>.","k":"mcq"},{"id":"h242","n":161,"q":"Which phrase can express a condition without <b>if<\/b>?","o":["as long as","in spite of","because of","as well as"],"a":0,"e":"<i>As long as, provided that, on condition that<\/i> and <i>supposing<\/i> all introduce conditions.","k":"mcq"},{"id":"h243","n":162,"q":"Complete: <i>I wish I ___ taller.<\/i>","o":["were","am","will be","have been"],"a":0,"e":"After <i>wish<\/i> we use the unreal past; <i>were<\/i> is used for all persons in careful style.","k":"mcq"},{"id":"h244","n":162,"q":"Complete: <i>It's time we ___ .<\/i>","o":["left","leave","will leave","have left"],"a":0,"e":"<i>It's time<\/i> + past tense expresses that something should happen now — another use of the unreal past.","k":"mcq"},{"id":"h245","n":162,"q":"Complete: <i>I'd rather you ___ smoke in here.<\/i>","o":["didn't","don't","won't","haven't"],"a":0,"e":"<i>Would rather<\/i> + subject + past tense expresses a preference about someone else's behaviour.","k":"mcq"},{"id":"h246","n":163,"q":"In <i>I know that he's right<\/i>, the that-clause is…","o":["the object of know","the subject","an adverbial","a relative clause"],"a":0,"e":"That-clauses commonly act as the object of verbs of thinking, saying and knowing.","k":"mcq"},{"id":"h247","n":163,"q":"Which is correct?","o":["I don't know where she lives.","I don't know where does she live.","I don't know where lives she.","I don't know where she does live it."],"a":0,"e":"An indirect question uses statement word order, with no inversion and no <i>do<\/i>.","k":"mcq"},{"id":"h248","n":164,"q":"<i>The destruction of the city shocked everyone.<\/i> <b>Destruction<\/b> is an example of…","o":["nominalization","a gerund clause","a relative clause","the passive"],"a":0,"e":"Nominalization turns a verb or adjective into a noun, common in formal and written English.","k":"mcq"},{"id":"h249","n":165,"q":"Change to indirect speech: <i>'I'm tired,' she said.<\/i>","o":["She said she was tired.","She said she is tired.","She said I was tired.","She said that am tired."],"a":0,"e":"Tenses usually shift back one step, and pronouns change to fit the new speaker.","k":"mcq"},{"id":"h250","n":166,"q":"Which is correct?","o":["He told me he was busy.","He said me he was busy.","He told to me he was busy.","He said me that busy."],"a":0,"e":"<i>Tell<\/i> takes an indirect object; <i>say<\/i> does not — <i>say to someone<\/i> is the alternative.","k":"mcq"},{"id":"h251","n":166,"q":"Which is correct?","o":["She asked me where I lived.","She asked me where did I live.","She asked to me where I lived.","She asked me where lived I."],"a":0,"e":"<i>Ask<\/i> takes an object directly, and reported questions use statement word order.","k":"mcq"},{"id":"h252","n":167,"q":"In indirect speech, <b>tomorrow<\/b> usually becomes…","o":["the next day","yesterday","today","that day"],"a":0,"e":"Time and place words shift: today → that day, tomorrow → the next day, here → there.","k":"mcq"},{"id":"h253","n":168,"q":"Change: <i>'I have finished,' he said.<\/i>","o":["He said he had finished.","He said he has finished.","He said he finished had.","He said that have finished."],"a":0,"e":"The present perfect shifts back to the past perfect.","k":"mcq"},{"id":"h254","n":168,"q":"When is a tense shift not necessary?","o":["When the statement is still true","Never","Only in questions","Only after tell"],"a":0,"e":"If the reporting verb is present, or the information remains true, the original tense can be kept.","k":"mcq"},{"id":"h255","n":169,"q":"Change: <i>'Are you coming?' she asked.<\/i>","o":["She asked if I was coming.","She asked was I coming.","She asked if was I coming.","She asked do I come."],"a":0,"e":"Yes/no questions are reported with <i>if<\/i> or <i>whether<\/i> plus statement order.","k":"mcq"},{"id":"h256","n":170,"q":"Change: <i>'Please sit down,' he said.<\/i>","o":["He asked me to sit down.","He asked me sit down.","He asked me that I sit down.","He said me to sit down."],"a":0,"e":"Requests and orders are reported with <i>ask/tell someone to do something<\/i>.","k":"mcq"},{"id":"h257","n":171,"q":"Complete: <i>The man ___ lives next door is a doctor.<\/i>","o":["who","which","whose","whom"],"a":0,"e":"<i>Who<\/i> refers to people; <i>which<\/i> to things; <i>that<\/i> to either in defining clauses.","k":"mcq"},{"id":"h258","n":172,"q":"In which sentence can the relative pronoun be omitted?","o":["The book (that) I read was good.","The man who lives here is old.","The car which broke down is mine.","The woman who called is my aunt."],"a":0,"e":"The relative pronoun can be dropped when it is the object of the relative clause, not the subject.","k":"mcq"},{"id":"h259","n":172,"q":"Which is correct?","o":["The film that we saw was long.","The film that we saw it was long.","The film what we saw was long.","The film we saw it was long."],"a":0,"e":"We do not repeat the object with a pronoun inside the relative clause.","k":"mcq"},{"id":"h260","n":173,"q":"Which sentence needs commas?","o":["My brother, who lives in Perth, is a teacher.","The man who lives in Perth is a teacher.","The book that you lent me is good.","The people who came were late."],"a":0,"e":"Non-defining clauses add extra information and take commas; defining clauses identify and do not.","k":"mcq"},{"id":"h261","n":173,"q":"Which pronoun cannot be used in a non-defining clause?","o":["that","who","which","whose"],"a":0,"e":"<i>That<\/i> is only used in defining relative clauses.","k":"mcq"},{"id":"h262","n":174,"q":"Complete: <i>The woman ___ car was stolen called the police.<\/i>","o":["whose","who's","which","whom"],"a":0,"e":"<i>Whose<\/i> shows possession and can refer to people or things.","k":"mcq"},{"id":"h263","n":175,"q":"Complete: <i>That's the house ___ I was born.<\/i>","o":["where","which","that","who"],"a":0,"e":"Relative adverbs: <i>where<\/i> for place, <i>when<\/i> for time, <i>why<\/i> for reason.","k":"mcq"},{"id":"h264","n":176,"q":"Which is a reduced relative clause?","o":["The man standing there is my uncle.","The man who is standing there is my uncle.","The man is standing there.","Standing there, and my uncle."],"a":0,"e":"A participle can replace a relative pronoun + verb: <i>who is standing<\/i> → <i>standing<\/i>.","k":"mcq"},{"id":"h265","n":177,"q":"What is the third person singular of <b>carry<\/b>?","o":["carri
