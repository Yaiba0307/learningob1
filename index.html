hat’s\u000f\u000eE why it’s cold.\u000f","p":1},{"t":"eg","x":"\u000eEWe’re not made of money. ~ \u000f\u000eHThat’s\u000f\u000eE true.\u000f","p":1}]},{"l":"G","b":[{"t":"rule","x":"\u000eAWe can use \u000f\u000eFthat\u000f\u000eA or \u000f\u000eFthose\u000f\u000eA in a rather formal pattern.\u000f","p":1},{"t":"eg","x":"\u000eEI knew the voice as \u000f\u000eHthat\u000f\u000eE of my sister.\u000f","p":1},{"t":"eg","x":"\u000eESome leaves are poisonous, especially \u000f\u000eHthose\u000f\u000eE of evergreen shrubs.\u000f","note":"the leaves of evergreen shrubs","p":1},{"t":"rule","x":"\u000eAOn the phone use \u000f\u000eFthis\u000f\u000eA to identify yourself.\u000f","p":1},{"t":"eg","x":"\u000eASay \u000f\u000eEHello. This is Anna.\u000f","p":1},{"t":"eg","x":"\u000eATo ask who the other person is, say \u000f\u000eEWho is this?\u000f","p":1}]}]},{"n":104,"t":"Introduction to quantifiers","u":"Quantifiers","s":[{"l":"A","b":[{"t":"sub","x":"What is a quantifier"},{"t":"rule","x":"\u000eAA quantifier is a word like \u000f\u000eFmany, \u0001no\u0002\u000f\u000eD,\u000f\u000eA or \u000f\u000eFsome\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u0004many\u0005 times  —  \u0004no\u0005 tickets  —  \u0004some\u0005 water"},{"t":"rule","x":"\u000eAA quantifier says how \u0001many\u0002/much. For example, \u000f\u000eFmany\u000f\u000eA means a large quantity.\u000f","p":1},{"t":"rule","x":"\u000eAThe choice of quantifier can depend on whether a noun is countable or not. \u000f\u000eB➤105\u000f","p":1},{"t":"rule","x":"A quantifier can be more than one word."},{"t":"eg","x":"lots of fun  —  a few people"},{"t":"rule","x":"Some can have an adverb of degree."},{"t":"eg","x":"\u000eHtoo many\u000f\u000eE emails\u000f\u000eB  \u000f\u000eHquite a lot of\u000f\u000eE money\u000f","p":1},{"t":"eg","x":"\u000eHalmost all\u000f\u000eE the tickets\u000f\u000eB  \u000f\u000eHvery little\u000f\u000eE time\u000f","p":1},{"t":"rule","x":"We can use a quantifier without a noun."},{"t":"eg","x":"\u000eEMost shops are open late, but \u000f\u000eHsome\u000f\u000eE close at five. \u000f\u000eHA few\u000f\u000eE close at six.\u000f","p":1},{"t":"rule","x":"\u000eFOf\u000f\u000eA must have a noun phrase or \u000f\u000eFit/them\u000f\u000eA after it.\u000f","p":1},{"t":"eg","x":"\u000eEA lot (\u000f\u000eHof the stores / of them\u000f\u000eE) open late.\u000f","p":1},{"t":"rule","x":"\u000eAWe use \u000f\u000eFnone\u000f\u000eA (not \u000f\u000eFno\u000f\u000eA) without a noun.\u000f","p":1},{"t":"eg","x":"\u000eHNone\u000f\u000eE were open.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"Large and small quantities"},{"t":"rule","x":"Here are some examples."},{"t":"rule","x":"A large quantity:"},{"t":"rule","x":"\u000eHa lot of / lots of\u000f\u000eE letters\u000f","p":1},{"t":"eg","x":"\u000eHmany\u000f\u000eE questions\u000f\u000eB  \u000f\u000eHmuch\u000f\u000eE discussion\u000f","p":1},{"t":"eg","x":"\u000eHa large number of\u000f\u000eE accidents\u000f","p":1},{"t":"eg","x":"\u000eHnumerous\u000f\u000eE delays\u000f\u000eB  \u000f\u000eHa great deal of\u000f\u000eE work\u000f","p":1},{"t":"rule","x":"A neutral quantity:"},{"t":"eg","x":"some money  —  a number of companies"},{"t":"rule","x":"A small quantity:"},{"t":"eg","x":"a few books  —  a little oil  —  several people"},{"t":"rule","x":"\u000eHa small number of\u000f\u000eE cases\u000f","p":1},{"t":"eg","x":"\u000eHa small amount of\u000f\u000eE electricity\u000f","p":1},{"t":"rule","x":"Zero quantity:"},{"t":"eg","x":"no work  —  there isn’t any bread"}]},{"l":"C","b":[{"t":"sub","x":"Whole and part quantities"},{"t":"rule","x":"\u000eATo talk about these quantities, we can use words like \u000f\u000eFall\u000f\u000eA and \u000f\u000eFmost\u000f\u000eA. \u000f\u000eB➤106\u000f","p":1},{"t":"eg","x":"\u000eEThe story is in \u000f\u000eHall (of)\u000f\u000eE the papers.\u000f","p":1},{"t":"eg","x":"\u000eEThe bed takes up \u000f\u000eHmost of\u000f\u000eE the space.\u000f","p":1},{"t":"eg","x":"\u0004Half (of\u0005) the audience were asleep."},{"t":"rule","x":"\u000eAWe often use \u000f\u000eFof\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"\u000eAWe can use large/small quantifiers with \u000f\u000eFof + determiner\u000f\u000eA to express a whole/part meaning. Compare these examples.\u000f","p":1},{"t":"eg","x":"\u000eEI found \u000f\u000eHsome\u000f\u000eE information.\u000f","note":"an amount","p":1},{"t":"eg","x":"\u000eHSome of the\u000f\u000eE information was irrelevant.\u000f","note":"a part of the total","p":1},{"t":"rule","x":"\u000eAWe use \u000f\u000eFnone\u000f\u000eA (not \u000f\u000eFno\u000f\u000eA) with \u000f\u000eFof\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eHNone of\u000f\u000eE my friends went to the party.\u000f","p":1},{"t":"tip","x":"We can use the whole/part pattern with a singular noun, e.g. I’ve read some of this book."}]}]},{"n":105,"t":"A lot of, many, much, etc","u":"Quantifiers","s":[{"l":"A","b":[{"t":"eg","x":"\u000eFA lot of, lots of, many\u000f\u000eD, \u000f\u000eAand \u000f\u000eFmuch\u000f\u000eA express a \u000f\u000eDlarge\u000f\u000eA quantity. \u000f","p":1},{"t":"rule","x":"\u000eAWe use \u000f\u000eFa lot of\u000f\u000eA and \u000f\u000eFlots of\u000f\u000eA with a \u000f\u000eDplural\u000f\u000eA or \u000f\u000eDuncountable\u000f\u000eA noun.\u000f","p":1},{"t":"sub","x":"\u000eEWe get \u000f\u000eHa lot of visitors / lots of visitors.\u000f","p":1},{"t":"eg","x":"\u000eEYou’ll have \u000f\u000eHa lot of fun / lots of fun.\u000f","p":1},{"t":"rule","x":"\u000eFMany\u000f\u000eA goes with a \u000f\u000eDplural\u000f\u000eA noun and \u000f\u000eFmuch\u000f\u000eA with an \u000f\u000eDuncountable\u000f\u000eA noun.\u000f","p":1},{"t":"eg","x":"\u000eEThere aren’t \u000f\u000eHmany trains\u000f\u000eE on Sunday.\u000f","p":1},{"t":"eg","x":"\u000eEThere isn’t \u000f\u000eHmuch traffic\u000f\u000eE on Sunday.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eAAs a general rule, we use \u000f\u000eFa lot of\u000f\u000eA and \u000f\u000eFlots of\u000f\u000eA in \u000f\u000eDpositive\u000f\u000eA statements and \u000f\u000eFmany\u000f\u000eA or \u000f\u000eFmuch\u000f\u000eA in \u000f\u000eDnegatives\u000f\u000eA and questions.\u000f","p":1},{"t":"eg","x":"\u000eEWe \u000f\u000eHget a lot of\u000f\u000eE visitors.\u000f","p":1},{"t":"eg","x":"\u000eEWe \u000f\u000eHdon’t get many\u000f\u000eE visitors.\u000f","p":1},{"t":"eg","x":"\u000eHDo\u000f\u000eE you \u000f\u000eHget many\u000f\u000eE visitors?\u000f","p":1},{"t":"rule","x":"\u000eABut there are \u000f\u000eDexceptions\u000f\u000eA. In positive statements we use \u000f\u000eFmany\u000f\u000eA or \u000f\u000eFmuch\u000f\u000eA after \u000f\u000eFvery, so, too, as\u000f\u000eD,\u000f\u000eA and \u000f\u000eFhow\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eHVery many\u000f\u000eE crimes go unreported.\u000f","p":1},{"t":"eg","x":"\u000eEYou’re making \u000f\u000eHtoo much\u000f\u000eE noise.\u000f","p":1},{"t":"rule","x":"\u0001A lot of\u0002 and lots of are used more in informal English (even in negatives and questions), and \u0001many\u0002 and \u0001much\u0002 are used in positive statements in more formal English."},{"t":"eg","x":"\u000eEWe don’t get \u000f\u000eHa lot of\u000f\u000eE visitors.\u000f","p":1},{"t":"eg","x":"\u000eHMuch\u000f\u000eE criticism has been expressed.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"\u000eFA few, a little\u000f\u000eD,\u000f\u000eA and \u000f\u000eFa bit of\u000f\u000eA express a \u000f\u000eDsmall\u000f\u000eA quantity and are used \u000f\u000eDmainly in positive statements\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI took \u000f\u000eHa few photos.\u000f","p":1},{"t":"eg","x":"\u000eEI’ve got a \u000f\u000eHlittle money / a bit of money\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eFA few\u000f\u000eA goes with a \u000f\u000eDplural\u000f\u000eA noun and \u000f\u000eFa little\u000f\u000eI / \u000f\u000eFa bit of\u000f\u000eA with an \u000f\u000eDuncountable\u000f\u000eA noun.\u000f","p":1},{"t":"rule","x":"\u000eFA bit of\u000f\u000eA is more informal than \u000f\u000eFa little\u000f\u000eI.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"\u000eFFew\u000f\u000eA and \u000f\u000eFlittle\u000f\u000eA without \u000f\u000eFa\u000f\u000eA have a negative meaning. Compare these examples.\u000f","p":1},{"t":"eg","x":"Is this a holiday area?"},{"t":"eg","x":"\u000eE~ \u000f\u000eHYes\u000f\u000eE, there are \u000f\u000eHa few\u000f\u000eE tourists.\u000f","p":1},{"t":"rule","x":"(some tourists / a small number of tourists)"},{"t":"eg","x":"\u000eHNo\u000f\u000eE, there are \u000f\u000eHfew\u000f\u000eE tourists.\u000f","note":"not many tourists","p":1},{"t":"eg","x":"\u000eEEven at 3 a.m. there was \u000f\u000eHa little\u000f\u000eE traffic.\u000f","note":"some traffic","p":1},{"t":"eg","x":"\u000eEIt was 3 a.m. so there was \u000f\u000eHlittle\u000f\u000eE traffic.\u000f","note":"not much traffic","p":1}]},{"l":"E","b":[{"t":"rule","x":"\u000eFMany, \u0001few\u0002,\u000f\u000eA and \u000f\u000eFlittle\u000f\u000eA sometimes come after a determiner, e.g. \u000f\u000eFhis, \u0001the\u0002\u000f\u000eI.\u000f","p":1},{"t":"eg","x":"\u000eETim was with one of \u000f\u000eHhis many\u000f\u000eE girlfriends.\u000f","p":1},{"t":"eg","x":"\u000eHThe few\u000f\u000eE hotels in the area are full.\u000f","p":1},{"t":"rule","x":"\u000eAWe can use \u000f\u000eFvery\u000f\u000eA before \u000f\u000eFfew\u000f\u000eA or \u000f\u000eFlittle\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEThere are \u000f\u000eHvery few\u000f\u000eE tourists here.\u000f","p":1},{"t":"tip","x":"TIP We often use a few in phrases of time, e.g. I'm here for a few days. I'll be back in a few minutes."}]}]},{"n":106,"t":"All, most, etc","u":"Quantifiers","s":[{"l":"A","b":[{"t":"rule","x":"\u000eAWe can use \u000f\u000eFall\u000f\u000eA or \u000f\u000eFmost\u000f\u000eA to make a generalization.\u000f","p":1},{"t":"rule","x":"\u000eM(all/most + plural)\u000f\u000eN - plural verb\u000f","p":1},{"t":"eg","x":"\u000eHAll rabbits\u000f\u000eE love green food.\u000f","p":1},{"t":"eg","x":"\u000eHMost children \u000f\u000eEenjoy games.\u000f","p":1},{"t":"rule","x":"\u000eM(all/most + uncountable) \u000f\u000eN- singular verb\u000f","p":1},{"t":"eg","x":"\u000eHAll water\u000f\u000eE contains dissolved substances. \u000f","p":1},{"t":"eg","x":"\u000eHMost pollution comes\u000f\u000eE from human activity\u000f\u000eA.\u000f\u000eE.   \u000f","p":1},{"t":"eg","x":"\u000eHMost information\u000f\u000eE is available online. \u000f","p":1},{"t":"rule","x":"\u0001All\u0002"},{"t":"rule","x":"Compare these examples."},{"t":"eg","x":"\u000eHMost people\u000f\u000eE want a quiet life. \u000f","note":"people in general","p":1},{"t":"eg","x":"\u000eEI know \u000f\u000eHmost of the people\u000f\u000eE here.\u000f","note":"a specific group of people","p":1},{"t":"rule","x":"\u000eAWe can express \u000f\u000eFmost\u000f\u000eA in other ways.\u000f","p":1},{"t":"eg","x":"\u000eEA\u000f\u000eH/The majority of clubs\u000f\u000eE have a website.\u000f","p":1},{"t":"sub","x":"\u000eEI know \u000f\u000eHmore than half (of) the guests.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eAReferring to a specific group, we use \u000f\u000eFall / \u0001most\u0002 / half / none + of + determiner + noun\u000f\u000eI.\u000f","p":1},{"t":"eg","x":"\u000eHAll (of) our rabbits\u000f\u000eE died.\u000f","p":1},{"t":"eg","x":"\u000eHAll (of) the water\u000f\u000eE was used.\u000f","p":1},{"t":"eg","x":"\u000eHAll (of) the cake\u000f\u000eE has been eaten\u000f\u000eN ( or can say the whole cake..)\u000f","p":1},{"t":"eg","x":"\u0004Most\u0005 of the pubs in town serve food."},{"t":"wrong","x":"the \u0004most\u0005 of the pubs"},{"t":"eg","x":"\u000eHMost of the water\u000f\u000eE in the tank has evaporated\u000f","note":"this structure is only when most can be used in singular noun","p":1},{"t":"rule","x":"\u000eHMost of the cake\u000f\u000eE has been eaten.\u000f\u000eN (only when \u0001most\u0002 can be used in singular noun)\u000f","p":1},{"t":"eg","x":"\u000eHMost of the book \u000f\u000eEis useful.\u000f","p":1},{"t":"eg","x":"\u0004Half (of\u0005) the audience were asleep."},{"t":"eg","x":"\u000eHNone of these jackets\u000f\u000eE fit me any more.\u000f","p":1},{"t":"rule","x":"\u000eAWe cannot leave out \u000f\u000eFof\u000f\u000eA after \u000f\u000eFmost\u000f\u000eA or \u000f\u000eFnone\u000f\u000eA. We can leave it out after \u000f\u000eFall\u000f\u000eA and \u000f\u000eFhalf\u000f\u000eA, but not before a pronoun.\u000f","p":1},{"t":"eg","x":"\u000eEThe rabbits got sick. \u000f\u000eHAll of them\u000f\u000eE died.\u000f","p":1},{"t":"eg","x":"\u000eEI started the book. I read\u000f\u000eH half of it.\u000f","p":1},{"t":"rule","x":"\u000eAWe can use \u000f\u000eFa/an\u000f\u000eA with \u000f\u000eFhalf\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEWe waited \u000f\u000eHhalf an hour.\u000f","p":1},{"t":"rule","x":"\u000eAWe can use \u000f\u000eFall\u000f\u000eA after an object pronoun.\u000f","p":1},{"t":"eg","x":"\u000eEThe rabbits died. We lost \u000f\u000eHthem all\u000f\u000eE / all of them.\u000f","p":1},{"t":"rule","x":"It can also come in mid position."},{"t":"eg","x":"\u000eEThe rabbits \u000f\u000eHall\u000f\u000eE died. / They \u000f\u000eHall\u000f\u000eE died.\u000f","p":1},{"t":"rule","x":"\u000eAWe can use \u000f\u000eFmostly\u000f\u000eA (but not \u000f\u000eFmost\u000f\u000eA) in mid position.\u000f","p":1},{"t":"eg","x":"\u000eEThe pubs in town \u000f\u000eHmostly\u000f\u000eE serve food.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"\u000eFNone\u000f\u000eA means ‘\u000f\u000eDnot any of the group’\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eHNone of the rabbits\u000f\u000eE survived, I’m afraid.\u000f","p":1},{"t":"wrong","x":"\u0004All\u0005 of the rabbits didn’t survive."},{"t":"rule","x":"\u000eFNot \u0001all\u0002\u000f\u000eA means \u000f\u000eD‘fewer/less than all’.\u000f","p":1},{"t":"eg","x":"\u000eHNot all (of) the rabbits\u000f\u000eE died. Some of them survived.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"\u000eAWe can use \u000f\u000eFwhole\u000f\u000eA as an adjective before a singular noun.\u000f","p":1},{"t":"eg","x":"\u000eEDid you watch \u000f\u000eHthe whole game?\u000f","p":1},{"t":"wrong","x":"the \u0004all\u0005 game"},{"t":"eg","x":"\u000eHThis whole idea\u000f\u000eE is crazy.\u000f","p":1},{"t":"eg","x":"\u000eEYou didn’t eat \u000f\u000eHa whole chicken!\u000f","p":1},{"t":"rule","x":"\u000eAWe can also use \u000f\u000eFwhole\u000f\u000eA as a noun.\u000f","p":1},{"t":"eg","x":"\u000eEDid you watch \u000f\u000eHthe whole of the game?\u000f","p":1},{"t":"tip","x":"Do not confuse all day and every day. We spent all day on the beach means that we were there from morning till evening. We spent every day on the beach means that we went there each day of our holiday."}]}]},{"n":107,"t":"Both, either, neither, every and each","u":"Quantifiers","s":[{"l":"A","b":[{"t":"eg","x":"\u000eFBoth, either\u000f\u000eD,\u000f\u000eA and \u000f\u000eFneither\u000f\u000eA mean two things.\u000f","p":1},{"t":"eg","x":"\u000eEPolice closed the street at \u000f\u000eHboth ends.\u000f","note":"one end and the other","p":1},{"t":"eg","x":"\u000eEI’m lucky. I can write with \u000f\u000eHeither hand.\u000f","note":"one hand or the other","p":1},{"t":"eg","x":"\u000eHNeither of the twins\u000f\u000eE can walk yet.\u000f","note":"not one twin and not the other","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eAWe use \u000f\u000eFboth\u000f\u000eA with a plural noun.\u000f\u000eM (exactly two people or things.)\u000f","p":1},{"t":"eg","x":"\u000eHBoth houses\u000f\u000eE are for sale.\u000f","p":1},{"t":"eg","x":"\u000eHBoth (of) the houses\u000f\u000eE are for sale.\u000f","p":1},{"t":"eg","x":"\u000eHBoth her parents\u000f\u000eE are out of work.\u000f","p":1},{"t":"rule","x":"\u000eABut we do not say \u000f\u000eEthe both houses\u000f\u000eB.\u000f","p":1},{"t":"rule","x":"\u000eAWe can use an object \u000f\u000eIpronoun + \u000f\u000eFboth\u000f\u000eI.\u000f","p":1},{"t":"eg","x":"\u000eETwo prisoners escaped, but the police caught \u000f\u000eHthem both\u000f\u000eE / both of them.\u000f","p":1},{"t":"rule","x":"\u000eDBoth\u000f\u000eA can also come in mid position.\u000f","p":1},{"t":"eg","x":"\u000eEThe teams are \u000f\u000eHboth\u000f\u000eE confident.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"\u000eAWe use \u000f\u000eFeither\u000f\u000eA or \u000f\u000eFneither\u000f\u000eI + singular noun.  \u000f\u000eM( \u0001either\u0002/\u0001neither\u0002 of the + plural noun, also use singular verb)\u000f","p":1},{"t":"eg","x":"\u000eHEither way is\u000f\u000eE as good as the other.\u000f","p":1},{"t":"eg","x":"\u000eHNeither car is\u000f\u000eE economical to run.\u000f","p":1},{"t":"rule","x":"\u000eAIn positions other than the subject we use \u000f\u000eFnot … either\u000f\u000eA rather than \u000f\u000eFneither\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI do\u000f\u000eHn’t\u000f\u000eE like \u000f\u000eHeither\u000f\u000eE of those pictures.\u000f","p":1},{"t":"rule","x":"\u000eABut \u000f\u000eFneither\u000f\u000eA can be the subject.\u000f","p":1},{"t":"eg","x":"\u000eHNeither\u000f\u000eE of those pictures appeals to me.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"\u000eAWe use \u000f\u000eFevery\u000f\u000eA o\u000f\u000eIr \u000f\u000eFeach\u000f\u000eI + singular noun\u000f\u000eA for all the members of a group.\u000f","p":1},{"t":"eg","x":"\u000eEThere were flags on \u000f\u000eHevery/each house.\u000f","p":1},{"t":"eg","x":"\u000eHEvery/Each minute\u000f\u000eE the tension grew.\u000f","p":1},{"t":"rule","x":"\u000eFEvery/each\u000f\u000eA + noun has a singular verb.\u000f","p":1},{"t":"eg","x":"\u000eHEvery/Each customer\u000f\u000eE is greeted.\u000f","p":1}]},{"l":"E","b":[{"t":"rule","x":"\u000eAIn many contexts either \u000f\u000eFevery\u000f\u000eA or \u000f\u000eFeach\u000f\u000eA is possible, but there is a difference.\u000f","p":1},{"t":"rule","x":"\u000eFEvery child\u000f\u000eA means all the children and implies a large number. \u000f\u000eFEach child\u000f\u000eA means all the children individually, one by one.\u000f","p":1},{"t":"eg","x":"\u000eHEvery child\u000f\u000eE needs love and attention.\u000f","p":1},{"t":"eg","x":"\u000eHEach child\u000f\u000eE had his/her photo taken.\u000f","p":1},{"t":"rule","x":"\u000eFEach\u000f\u000eA refers to two or more; \u000f\u000eFevery\u000f\u000eA to three or more.\u000f","p":1},{"t":"eg","x":"\u000eEUnited scored in \u000f\u000eHeach half\u000f\u000eE / both halves.\u000f","p":1},{"t":"eg","x":"\u000eEPeople came running from \u000f\u000eHevery direction\u000f\u000eE / all directions.\u000f","p":1}]},{"l":"F","b":[{"t":"rule","x":"\u000eAWe can use \u000f\u000eFeach\u000f\u000eA but not \u000f\u000eFevery\u000f\u000eA in these patterns.\u000f","p":1},{"t":"eg","x":"\u000eHEach of the student\u000f\u000eEs has a personal tutor.\u000f","p":1},{"t":"eg","x":"\u000eEWe gave t\u000f\u000eHhem each / each of them\u000f\u000eE a kiss.\u000f","p":1},{"t":"eg","x":"\u000eEThe winners \u000f\u000eHeach\u000f\u000eE received a prize.\u000f","p":1},{"t":"eg","x":"\u000eEThe tickets are £20 \u000f\u000eHeach\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eABut we can use \u000f\u000eFeach/every one (of)\u000f\u000eI.\u000f","p":1},{"t":"eg","x":"\u000eHeach one\u000f\u000eK / \u000f\u000eHevery one\u000f\u000eE of the students\u000f","p":1},{"t":"tip","x":"Use \u0001every\u0002 for things happening regularly, e.g. I go swimming every Friday. The meetings are every four weeks."}]}]},{"n":108,"t":"Some and any","u":"Quantifiers","s":[{"l":"A","b":[{"t":"sub","x":"\u000eJSome/any\u000f\u000eC for a quantity\u000f","p":1},{"t":"rule","x":"\u000eISome\u000f\u000eA + \u000f\u000eIplural or uncountable noun\u000f\u000eA is equivalent to \u000f\u000eIa/an + singular noun\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEYou’ll need \u000f\u000eHsome\u000f\u000eE wood, \u000f\u000eHa\u000f\u000eE hammer, and \u000f\u000eHsome\u000f\u000eE nails.\u000f","p":1},{"t":"rule","x":"\u000eISome\u000f\u000eA is a \u000f\u000eDpositive\u000f\u000eA quantity. We use \u000f\u000eIany\u000f\u000eA mainly in\u000f\u000eD negatives and questions.\u000f","p":1},{"t":"rule","x":"\u000eCPositive\u000f\u000eB: \u000f\u000eEI’ve got \u000f\u000eHsome\u000f\u000eE nails.\u000f","p":1},{"t":"rule","x":"\u000eCNegative\u000f\u000eA: \u000f\u000eEI haven’t got \u000f\u000eHany\u000f\u000eE nails.\u000f","p":1},{"t":"rule","x":"\u000eCQuestion\u000f\u000eA: \u000f\u000eEHave you got \u000f\u000eHany/some\u000f\u000eE nails?\u000f","p":1},{"t":"rule","x":"\u000eAWe use \u000f\u000eIany\u000f\u000eA with other negative words.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHnever\u000f\u000eE seem to have \u000f\u000eHany\u000f\u000eE money.\u000f","p":1},{"t":"eg","x":"\u000eEWe’ve won\u000f\u000eH hardly any\u000f\u000eE games this year.\u000f","p":1},{"t":"rule","x":"\u000eIAny\u000f\u000eA is the usual choice in questions.\u000f","p":1},{"t":"eg","x":"\u000eEDid you catch \u000f\u000eHany\u000f\u000eE fish?\u000f\u000eB – Yes, lots. / No.\u000f","p":1},{"t":"rule","x":"\u000eABut we use \u000f\u000eJsome\u000f\u000eA for a more \u000f\u000eDpositive\u000f\u000eA tone, especially in offers and requests.\u000f","p":1},{"t":"eg","x":"\u000eEDid you catch \u000f\u000eHsome\u000f\u000eE fish?\u000f","p":1},{"t":"eg","x":"\u000eEWould you like \u000f\u000eHsome\u000f\u000eE cornflakes?\u000f","p":1},{"t":"rule","x":"In an if-clause we can use either."},{"t":"rule","x":"\u000eEIf you need \u000f\u000eHsome/any\u000f\u000eE help, let me know.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"\u000eJSomeone\u000f\u000eC, etc\u000f","p":1},{"t":"rule","x":"\u000eAWe choose between \u000f\u000eIsomeone/anyone\u000f\u000eA, etc. in the same way as \u000f\u000eIsome/\u0001any\u0002.\u000f","p":1},{"t":"eg","x":"\u000eHSomeone\u000f\u000eE has done something to my bike.\u000f","p":1},{"t":"eg","x":"\u000eEI haven’t got \u000f\u000eHanything\u000f\u000eE to wear.\u000f","p":1},{"t":"eg","x":"\u000eECould you do \u000f\u000eHsomething\u000f\u000eE for me?\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"\u000eJSome/any\u000f\u000eC for a part quantity\u000f","p":1},{"t":"rule","x":"\u000eACompare these two uses of \u000f\u000eIsome\u000f\u000eA:\u000f","p":1},{"t":"eg","x":"\u000eEThere were \u000f\u000eHsome people\u000f\u000eE in the studio.\u000f","p":1},{"t":"rule","x":"Quantity: /səm/ ‘a number of people’"},{"t":"eg","x":"\u000eHSome people\u000f\u000eE enjoy quiz shows.\u000f","p":1},{"t":"rule","x":"\u000eDPart: /ˈsʌm/\u000f\u000eA = ‘\u0001some\u0002 but not all’\u000f","p":1},{"t":"rule","x":"\u000eEHere \u000f\u000eFsome/\u0001any\u0002\u000f\u000eE means a part\u000f","p":1},{"t":"eg","x":"\u000eHSome trains\u000f\u000eE have a restaurant car.\u000f","p":1},{"t":"eg","x":"\u000eHSome fish\u000f\u000eE can change their sex.\u000f","p":1},{"t":"eg","x":"\u000eHSome of the trains\u000f\u000eE were cancelled.\u000f","p":1},{"t":"eg","x":"\u000eHSome of the fish\u000f\u000eE in the tank were a beautiful blue colour.\u000f","p":1},{"t":"eg","x":"\u000eEI like \u000f\u000eHsome jazz\u000f\u000eE but not all of it.\u000f","p":1},{"t":"eg","x":"\u000eEI didn’t watch \u000f\u000eHany of the game.\u000f","p":1},{"t":"rule","x":"\u000eAWhen \u000f\u000eJsome\u000f\u000eA means a part, we can use it in a \u000f\u000eDnegative\u000f\u000eA sentence.\u000f","p":1},{"t":"eg","x":"\u000eHSome people don’t\u000f\u000eE enjoy quiz shows.\u000f","p":1}]},{"l":"D","b":[{"t":"sub","x":"Any"},{"t":"rule","x":"\u000eAWhen \u000f\u000eJany\u000f\u000eA means ‘it doesn’t matter which’, we can use it in \u000f\u000eDpositive\u000f\u000eA sentences. ( \u0001any\u0002 + singular countable noun)\u000f","p":1},{"t":"rule","x":"\u000eEYou can choose \u000f\u000eHany colour\u000f\u000eE you like.\u000f","p":1},{"t":"eg","x":"\u000eECome\u000f\u000eH any time\u000f\u000eE. I’m always here.\u000f","p":1},{"t":"eg","x":"\u000eHAnyone\u000f\u000eE could just walk in here.\u000f","p":1},{"t":"tip","x":"A phrase with some + singular noun can help you to be vague about details, e.g. The flight was delayed for some reason. The flight was delayed for some reason. You must come and see me some time."}]}]},{"n":109,"t":"Enough, some more, etc","u":"Quantifiers","s":[{"l":"A","b":[{"t":"rule","x":"\u0001Enough\u0002"},{"t":"rule","x":"\u000eAWe can use \u000f\u000eFenough\u000f\u000eA with a plural or uncountable noun.\u000f","p":1},{"t":"eg","x":"\u000eEThere aren’t\u000f\u000eH enough chairs.\u000f","p":1},{"t":"eg","x":"\u000eEIs there \u000f\u000eHenough room\u000f\u000eE for all of us?\u000f","p":1},{"t":"rule","x":"\u000eAWe can use \u000f\u000eFof\u000f\u000eA for a part quantity.\u000f","p":1},{"t":"eg","x":"\u000eEI’ve seen \u000f\u000eHenough of this film.\u000f","p":1}]},{"l":"B","b":[{"t":"eg","x":"\u000eFPlenty of\u000f\u000eC and\u000f\u000eF too many/much\u000f","p":1},{"t":"rule","x":"\u000eFPlenty of\u000f\u000eA means ‘\u0001enough\u0002’ or ‘more than enough.’\u000f","p":1},{"t":"eg","x":"\u000eEThere are \u000f\u000eHplenty of jobs\u000f\u000eE available.\u000f","p":1},{"t":"eg","x":"\u000eEDon’t rush. We’ve got \u000f\u000eHplenty of time\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eAFor ‘more than \u0001enough\u0002’ as a bad thing, we use \u000f\u000eFtoo many/much.\u000f","p":1},{"t":"eg","x":"\u000eEYou always take \u000f\u000eHtoo many clothes\u000f\u000eE on holiday. Why take so many?\u000f","p":1},{"t":"eg","x":"\u000eEI put \u000f\u000eHtoo much salt\u000f\u000eE in the soup.\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"\u000eIAnother\u000f\u000eC and \u000f\u000eIsome more\u000f","p":1},{"t":"rule","x":"\u000eAThese express an extra quantity. We use \u000f\u000eFanother\u000f\u000eA with a singular noun and \u000f\u000eFsome more\u000f\u000eA with a plural or uncountable noun.\u000f","p":1},{"t":"eg","x":"\u000eEWould you like \u000f\u000eHanother sausage?\u000f","p":1},{"t":"eg","x":"\u000eEHave some\u000f\u000eH more carrots.\u000f","p":1},{"t":"eg","x":"\u000eEI’ll get \u000f\u000eHsome more orange juice.\u000f","p":1},{"t":"rule","x":"\u000eAIn some contexts (\u000f\u000eB➤108A\u000f\u000eA), we use any.\u000f","p":1},{"t":"eg","x":"\u000eEThere isn’t\u000f\u000eH any more orange juice\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eFAnother\u000f\u000eA can also mean ‘a different one.’\u000f","p":1},{"t":"eg","x":"\u000eEI’m going to buy\u000f\u000eH another computer\u000f\u000eE to replace this one.\u000f","p":1},{"t":"rule","x":"\u000eABefore \u000f\u000eFmore\u000f\u000eA, we can also use \u000f\u000eFa lot, lots, many, much, a few, a little, \u000f\u000eAand \u000f\u000eFa bit.\u000f","p":1},{"t":"eg","x":"\u000eEI’ve got \u000f\u000eHlots more\u000f\u000eE jobs to do after this.\u000f","p":1},{"t":"eg","x":"\u000eECan’t you put \u000f\u000eHa bit more\u000f\u000eE effort into it?\u000f","p":1}]},{"l":"D","b":[{"t":"sub","x":"Other"},{"t":"rule","x":"\u000eFOther\u000f\u000eA is an adjective meaning ‘different’ or ‘not the one just mentioned.’\u000f","p":1},{"t":"eg","x":"\u000eEWe crossed to \u000f\u000eHthe other side\u000f\u000eE of the road.\u000f","p":1},{"t":"eg","x":"\u000eESarah was there, but I didn’t know any of \u000f\u000eHthe other guests.\u000f","p":1},{"t":"rule","x":"\u000eAWe can use \u000f\u000eFother\u000f\u000eA without a noun to refer to a thing or a person.\u000f","p":1},{"t":"eg","x":"\u000eETake one bag. Give me \u000f\u000eHthe other\u000f\u000eE (one).\u000f","p":1},{"t":"eg","x":"\u000eEOne twin is taller than \u000f\u000eHthe other\u000f\u000eE (one).\u000f","p":1},{"t":"rule","x":"\u000eAWe can use \u000f\u000eFothers\u000f\u000eA without a noun for more than one.\u000f","p":1},{"t":"eg","x":"\u000eESome pubs serve food, but \u000f\u000eHothers\u000f\u000eE don’t.\u000f","p":1},{"t":"eg","x":"\u000eEI’m early. The \u000f\u000eHothers\u000f\u000eE will be here soon.\u000f","p":1},{"t":"rule","x":"\u000eINumber + \u0001other\u0002\u000f\u000eA means an extra quantity.\u000f","p":1},{"t":"eg","x":"\u000eEThere are \u000f\u000eHfour other\u000f\u000eE/four more rooms upstairs.\u000f","p":1},{"t":"tip","x":"You can use another in a phrase expressing an extra period of time, e.g. I’m staying on for another three days / for three more days."}]}]},{"n":110,"t":"Personal Pronouns","u":"Pronouns","s":[{"l":"A","b":[{"t":"sub","x":"Subject and object forms"},{"t":"rule","x":"These are the forms:"},{"t":"table","rows":[["","Singular subject","Singular object","Plural subject","Plural object"],["First","I","me","we","us"],["Second","you","you","you","you"],["Third","he / she / it","him / her / it","they","them"]]},{"t":"rule","x":"\u000eAWe use the subject form for the \u000f\u000eDsubject\u000f\u000eA of a \u000f\u000eDfinite clause.\u000f","p":1},{"t":"eg","x":"\u000eEI know Gemma. \u000f\u000eHShe\u000f\u000eE’s in my class.\u000f","p":1},{"t":"rule","x":"\u000eAWe use the object form for the\u000f\u000eD object of a verb or preposition\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEThese notes are for Matthew. Could you give \u000f\u000eHthem\u000f\u000eE to \u000f\u000eHhim\u000f\u000eE, please?\u000f","p":1},{"t":"rule","x":"\u000eAWe use the object form for a \u000f\u000eDpronoun on its own\u000f\u000eA. \u000f","p":1},{"t":"rule","x":"Compare these answers."},{"t":"eg","x":"\u000eEWho said that? –\u000f\u000eH Me\u000f\u000eE. / I did.\u000f","p":1},{"t":"rule","x":"\u000eAWe also use the object form after \u000f\u000eJbe\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEIt wasn’t \u000f\u000eHme\u000f\u000eE who made the mistake.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"\u000eJAnd /or\u000f\u000eC with pronouns\u000f","p":1},{"t":"rule","x":"\u000eAWe can use \u000f\u000eJand\u000f\u000eA \u0001or\u0002 \u000f\u000eJor\u000f\u000eA to combine a pronoun with a noun phrase or another pronoun.\u000f","p":1},{"t":"eg","x":"\u000eHElaine and I\u000f\u000eE are good friends.\u000f","p":1},{"t":"eg","x":"\u000eESam could have rung \u000f\u000eHyou or me\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eAWe normally put\u000f\u000eI I/\u000f\u000eJme\u000f\u000eA after \u000f\u000eJand\u000f\u000eA.\u000f","p":1},{"t":"wrong","x":"I \u0004and\u0005 Elaine"}]},{"l":"C","b":[{"t":"sub","x":"Nouns and pronouns"},{"t":"rule","x":"\u000eAWe do \u000f\u000eDnot\u000f\u000eA usually use a \u000f\u000eDpronoun together with a noun\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"Gemma is in my class."},{"t":"wrong","x":"Gemma she’s in my class."},{"t":"rule","x":"But in informal speech, we can use this pattern to emphasize a topic."},{"t":"eg","x":"\u000eHYour brother, he\u000f\u000eE makes me laugh.\u000f","p":1},{"t":"eg","x":"\u000eHThose new students,\u000f\u000eE I just saw \u000f\u000eHthem\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"We make clear what the topic is before we continue with the message."},{"t":"rule","x":"We can also use the following pattern in informal speech:"},{"t":"eg","x":"\u000eHShe\u000f\u000eE is in my class, \u000f\u000eHGemma\u000f\u000eE (is).\u000f","p":1},{"t":"rule","x":"\u000eEI just saw \u000f\u000eHthem\u000f\u000eE, \u000f\u000eHthose new students,\u000f","p":1}]},{"l":"D","b":[{"t":"sub","x":"Noun or pronoun?"},{"t":"rule","x":"Compare these sentences:"},{"t":"eg","x":"\u000eEMatt was picked to play, but \u000f\u000eHhe\u000f\u000eE was ill.\u000f","p":1},{"t":"eg","x":"\u000eEMatt and Tom were picked to play, but \u000f\u000eHMatt\u000f\u000eE was ill\u000f\u000eD.\u000f","p":1},{"t":"rule","x":"\u000eAWe use a pronoun (\u000f\u000eFhe\u000f\u000eA) when the reference is clear. We use a noun (\u000f\u000eFMatt\u000f\u000eA) when a pronoun would not be clear.\u000f","p":1},{"t":"tip","x":"After and, choose the pronoun form as if it was on its own. You say I’m going out, so say Leo and I are going out. You say Come with me, so say Come with Amber and me."}]}]},{"n":111,"t":"The use of pronouns","u":"Pronouns","s":[{"l":"A","b":[{"t":"sub","x":"\u000eLHe, she\u000f\u000eG,\u000f\u000eC and \u000f\u000eLit\u000f","p":1},{"t":"rule","x":"\u000eJHe/him\u000f\u000eI, \u000f\u000eJshe/her\u000f\u000eA, and \u000f\u000eJit\u000f\u000eA are \u000f\u000eDsingular\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"\u000eJHe\u000f\u000eA means a male person, \u000f\u000eJshe \u000f\u000eAmeans a female person, and \u000f\u000eJit\u000f\u000eA means something not human.\u000f","p":1},{"t":"eg","x":"\u000eEInvite Mark. \u000f\u000eHHe\u000f\u000eE’s great fun. I like \u000f\u000eHhim\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEInvite Anna. \u000f\u000eHShe\u000f\u000eE’s great fun. I like \u000f\u000eHher\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEThat tune is good. \u000f\u000eHIt’\u000f\u000eEs catchy. I like \u000f\u000eHit.\u000f","p":1},{"t":"rule","x":"\u000eAWe use \u000f\u000eCit\u000f\u000eA not only for things but also for \u000f\u000eDanimals, actions, situations, feelings, and ideas.\u000f","p":1},{"t":"eg","x":"\u000eEWhat’s that? – Is \u000f\u000eHit\u000f\u000eE a beetle?\u000f","p":1},{"t":"eg","x":"\u000eEWe got lost. \u000f\u000eHIt\u000f\u000eE was awful.\u000f","p":1},{"t":"eg","x":"\u000eEThey were cheating. I knew \u000f\u000eHit\u000f\u000eD.\u000f","p":1},{"t":"rule","x":"\u000eAFor \u0001it\u0002 as an empty subject\u000f\u000eD, \u000f\u000eB➤24\u000f","p":1},{"t":"rule","x":"\u000eAWe also use \u000f\u000eJit\u000f\u000eA for an\u000f\u000eD unknown person\u000f\u000eA when we talk about identity.\u000f","p":1},{"t":"eg","x":"\u000eEThere’s the phone.\u000f\u000eH It\u000f\u000eE might be Debbie.\u000f","p":1},{"t":"eg","x":"\u000eEWho broke this glass? –\u000f\u000eH It\u000f\u000eE was Paul.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u0001They\u0002"},{"t":"rule","x":"\u000eJThey/them\u000f\u000eA refers to people and things.\u000f","p":1},{"t":"eg","x":"\u000eEI like your cousins. \u000f\u000eHThey\u000f\u000eE’re great fun.\u000f","p":1},{"t":"eg","x":"\u000eEI like these pictures. \u000f\u000eHThey’\u000f\u000eEre nice.\u000f","p":1},{"t":"rule","x":"\u000eAWe can use \u000f\u000eJthey\u000f\u000eA for other people in general, or for the authorities.\u000f","p":1},{"t":"rule","x":"\u000eHThey\u000f\u000eE say we need to save energy.\u000f","p":1},{"t":"eg","x":"\u000eHThey\u000f\u000eE’re going to increase taxes.\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"A person of unknown sex"},{"t":"rule","x":"We can refer to such a person like this:"},{"t":"eg","x":"\u000eEWhen the winner is known, \u000f\u000eHhe or she\u000f\u000eE should make\u000f\u000eH his or her\u000f\u000eE way to the stage.\u000f","p":1},{"t":"rule","x":"\u000eAIt is regarded as sexist to only use \u000f\u000eJhe\u000f\u000eA and \u000f\u000eJhis\u000f\u000eA here. \u000f\u000eJThey\u000f\u000eA can be used for \u000f\u000eDa single person of unknown sex\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEWhen the winner is known, \u000f\u000eHthey\u000f\u000eE should make \u000f\u000eHtheir\u000f\u000eE way to the stage.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"We"},{"t":"rule","x":"\u000eJWe/us\u000f\u000eA means me and one or more others. It can include \u000f\u000eJyou\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eHWe’\u000f\u000eEre late. – Yes, we are.\u000f","note":"= you and I","p":1},{"t":"eg","x":"\u000eHWe\u000f\u000eE’re late. – Yes, you are.\u000f","note":"= he/she/they and I","p":1},{"t":"rule","x":"\u000eIWe\u000f\u000eA can also mean people in general.\u000f","p":1},{"t":"rule","x":"\u000eHWe\u000f\u000eE know that the ice caps are melting.\u000f","p":1},{"t":"eg","x":"\u000eELanguage enables \u000f\u000eHus\u000f\u000eE to communicate.\u000f","p":1}]},{"l":"E","b":[{"t":"rule","x":"You"},{"t":"rule","x":"\u000eAWe use \u000f\u000eJyou\u000f\u000eA for the person or people spoken to, or for people in general.\u000f","p":1},{"t":"rule","x":"\u000eHYou\u000f\u000eE can wear anything to the theatre.\u000f","p":1},{"t":"eg","x":"\u000eEHow do \u000f\u000eHyou\u000f\u000eE train a police dog?\u000f","p":1},{"t":"tip","x":"One meaning people in general, including the speaker, is rather formal. Say I hope so, rather than One hopes so."}]}]},{"n":112,"t":"Reflexive and emphatic pronouns","u":"Pronouns","s":[{"l":"A","b":[{"t":"rule","x":"\u000eAWe form the pronouns with \u000f\u000eJself/selves\u000f\u000eA.\u000f","p":1},{"t":"table","rows":[["Person","Singular","Plural"],["First","myself","ourselves"],["Second","yourself","yourselves"],["Third","himself","themselves"]]},{"t":"rule","x":"herself"},{"t":"rule","x":"itself"}]},{"l":"B","b":[{"t":"rule","x":"\u000eAWe use a reflexive pronoun as an \u000f\u000eDobject\u000f\u000eA referring \u000f\u000eDback to the subject\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI blamed \u000f\u000eHmyself\u000f\u000eE for the accident.\u000f","p":1},{"t":"eg","x":"\u000eELuke is teaching \u000f\u000eHhimself\u000f\u000eE Italian.\u000f","p":1},{"t":"eg","x":"\u000eEThe country declared \u000f\u000eHitself\u000f\u000eE independent.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"Look at these examples:"},{"t":"eg","x":"\u000eEI didn’t have my passport with \u000f\u000eHme\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEMy mother likes the family all around \u000f\u000eHher\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eAWe use the personal pronoun when it clearly refers to the subject (\u000f\u000eJI\u000f\u000e\u0001I\u0002, \u000f\u000eJmy mother\u000f\u000eA). But we sometimes need a reflexive to make the meaning clear.\u000f","p":1},{"t":"rule","x":"\u000eESue read an article about \u000f\u000eHherself\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"(about Sue, not someone else)"},{"t":"rule","x":"\u000eAWe also use a reflexive after\u000f\u000eD combinations with a preposition.\u000f","p":1},{"t":"eg","x":"\u000eEOne man was \u000f\u000eHtalking to himself.\u000f","p":1},{"t":"sub","x":"\u000eEI was\u000f\u000eH annoyed with myself.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"There are some idiomatic uses:"},{"t":"sub","x":"\u000eHEnjoy yourselves.\u000f\u000eA (have a good time)\u000f","p":1},{"t":"eg","x":"\u000eEPlease \u000f\u000eHhelp yourself\u000f\u000eE.\u000f\u000eA (take e.g. food)\u000f","p":1},{"t":"sub","x":"\u000eEI was \u000f\u000eHby myself / on my own.\u000f\u000eA (alone)\u000f","p":1}]},{"l":"E","b":[{"t":"rule","x":"Some verbs taking a reflexive in other languages do not do so in English."},{"t":"eg","x":"\u000eEI \u000f\u000eHfeel\u000f\u000eE ill.\u000f","p":1},{"t":"eg","x":"\u000eECan’t you \u000f\u000eHremember\u000f\u000eE?\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHgot up\u000f\u000eE early.\u000f","p":1},{"t":"eg","x":"\u000eEPlease \u000f\u000eHsit down.\u000f","p":1},{"t":"rule","x":"\u000eAOther verbs like this include: \u000f\u000eIcomplain, concentrate, hurry, lie down, relax, rest, stand up, wonder, worry\u000f\u000eA.\u000f","p":1}]},{"l":"F","b":[{"t":"rule","x":"\u000eAWe use \u000f\u000eDemphatic\u000f\u000eA pronouns to\u000f\u000eD emphasize a noun phrase\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEThe President \u000f\u000eHhimself\u000f\u000eE welcomed us.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHmyself\u000f\u000eE have no opinion on the matter.\u000f","p":1},{"t":"rule","x":"The pronoun can mean \"without help\":"},{"t":"eg","x":"\u000eEWe built the house \u000f\u000eHourselves\u000f\u000eE.\u000f","p":1}]},{"l":"G","b":[{"t":"rule","x":"\u000eANote also \u000f\u000eJeach other / one another\u000f\u000eI:\u000f","p":1},{"t":"eg","x":"\u000eEWe should all help \u000f\u000eHone another\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEJane and Amy smiled at \u000f\u000eHeach other\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"This means that Jane smiled at Amy, and Amy smiled at Jane."},{"t":"rule","x":"Compare the reflexive pronoun:"},{"t":"eg","x":"\u000eEThe acrobats fell and hurt \u000f\u000eHthemselves\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEThe two boxers hurt\u000f\u000eH each other.\u000f","p":1},{"t":"tip","x":"Say I must wash / I must have a bath and I must get changed. A reflexive is less usual with these verbs."}]}]},{"n":113,"t":"One and ones","u":"Pronouns","s":[{"l":"A","b":[{"t":"rule","x":"\u000eAWe sometimes use \u000f\u000eJone\u000f\u000eA or \u000f\u000eJones\u000f\u000eA instead of a noun.\u000f","p":1},{"t":"eg","x":"\u000eEWhich is your coat? ~ This \u000f\u000eHone\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEA blue pen or a black \u000f\u000eHone\u000f\u000eE?\u000f","p":1},{"t":"eg","x":"\u000eEThis television is a bit bigger than the \u000f\u000eHone\u000f\u000eE we had before.\u000f","p":1},{"t":"eg","x":"\u000eEThese two houses are the only \u000f\u000eHones\u000f\u000eE in the street with gardens.\u000f","p":1},{"t":"eg","x":"\u000eEGet some tomatoes – small \u000f\u000eHones\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eAWe use \u000f\u000eJone/\u0001ones\u0002\u000f\u000eA to avoid repeating a noun. \u000f\u000eJOne\u000f\u000eA is singular and \u000f\u000eJones\u000f\u000eA is plural.\u000f","p":1},{"t":"rule","x":"\u000eAWe \u000f\u000eDcannot\u000f\u000eA do this with an \u000f\u000eDuncountable noun\u000f\u000eA, but we can\u000f\u000eD leave out the noun\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEDo you prefer pop music or \u000f\u000eHclassical\u000f\u000eE?\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eAIn some patterns we can either replace the noun with \u000f\u000eJone/\u0001ones\u0002\u000f\u000eA or\u000f\u000eD simply leave it out.\u000f","p":1},{"t":"sub","x":"After a demonstrative"},{"t":"eg","x":"\u000eELook at these rings. \u000f\u000eHThis (one)\u000f\u000eE is nice.\u000f","p":1},{"t":"sub","x":"\u000eCAfter\u000f\u000eJ each, any, other, either\u000f\u000eC, and \u000f\u000eJneither\u000f","p":1},{"t":"eg","x":"\u000eHEach (one)\u000f\u000eE of these patterns is different.\u000f","p":1},{"t":"eg","x":"\u000eEDon’t lose that key because I haven’t got \u000f\u000eHanother\u000f\u000eE (one).\u000f","p":1},{"t":"eg","x":"\u000eEThere are two choices, and \u000f\u000eHneither (one)\u000f\u000eE appeals to me.\u000f","p":1},{"t":"sub","x":"\u000eCAfter \u000f\u000eJwhich\u000f","p":1},{"t":"eg","x":"\u000eEI couldn’t answer all the questions. ~ \u000f\u000eHWhich (ones)\u000f\u000eE did you find difficult?\u000f","p":1},{"t":"sub","x":"After a superlative"},{"t":"eg","x":"\u000eEThese photos are the \u000f\u000eHnicest (ones)\u000f\u000eE.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"\u000eAIn some patterns we \u000f\u000eDcannot leave out \u000f\u000eFone/\u0001ones\u0002\u000f\u000eI:\u000f","p":1},{"t":"sub","x":"After an adjective"},{"t":"eg","x":"\u000eEI had an accident but not a \u000f\u000eHserious one\u000f\u000eE.\u000f","p":1},{"t":"sub","x":"\u000eCAfter \u000f\u000eJthe\u000f","p":1},{"t":"eg","x":"\u000eEThese sweets are t\u000f\u000eHhe ones\u000f\u000eE I like.\u000f","p":1},{"t":"sub","x":"\u000eCAfter \u000f\u000eJevery\u000f","p":1},{"t":"eg","x":"\u000eEWe’ve been on several trips, and \u000f\u000eHevery one\u000f\u000eE was enjoyable.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"\u000eAWe can replace \u000f\u000eJa/an + noun\u000f\u000eA with \u000f\u000eJone\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"\u000eEI’ve got a map if you need \u000f\u000eHone\u000f\u000eE. \u000f\u000eA(a map)\u000f","p":1},{"t":"eg","x":"\u000eEI’m not used to weddings. I haven’t been to \u000f\u000eHone\u000f\u000eE for ages. \u000f\u000eA(a wedding)\u000f","p":1},{"t":"rule","x":"\u000eACompare \u000f\u000eJone/some\u000f\u000eA and \u000f\u000eJit/they\u000f\u000eA:\u000f","p":1},{"t":"eg","x":"\u000eEI haven’t got a backpack. I’ll have to buy \u000f\u000eHone\u000f\u000eE.\u000f\u000eA (a backpack)\u000f","p":1},{"t":"eg","x":"\u000eEI haven’t got any boots. I’ll have to buy \u000f\u000eHsome\u000f\u000eE.\u000f\u000eA (some boots)\u000f","p":1},{"t":"rule","x":"\u000eEI’ve got a backpack. You can borrow \u000f\u000eHit\u000f\u000eE if you like.\u000f\u000eA (the backpack)\u000f","p":1},{"t":"eg","x":"\u000eEI’ve got some boots, but \u000f\u000eHthey\u000f\u000eE might not fit you.\u000f\u000eA (the boots)\u000f","p":1},{"t":"tip","x":"We can sometimes leave out one/\u0001ones\u0002 when we use two adjectives, e.g.: Is this the old price or the new (\u0001one\u0002)? We’ve got French books and German (\u0001ones\u0002). We can also leave out one/\u0001ones\u0002 after an adjective of colour, e.g.: My toothbrush is the blue."}]}]},{"n":114,"t":"Everyone, something, etc","u":"Pronouns","s":[{"l":"A","b":[{"t":"eg","x":"\u000eFEvery, some, any, no\u000f\u000eA form compounds with \u000f\u000eF-one/-body\u000f\u000eA and \u000f\u000eF-thing\u000f\u000eA, and adverbs with \u000f\u000eF-where\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI saw \u000f\u000eHsomeone/somebody\u000f\u000eE outside.\u000f","p":1},{"t":"eg","x":"\u000eEIs there \u000f\u000eHanything\u000f\u000eE on television?\u000f","p":1},{"t":"eg","x":"\u000eEI've looked \u000f\u000eHeverywhere\u000f\u000eE for that receipt.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eIEveryone/everybody\u000f\u000eA means '\u000f\u000eDall the people\u000f\u000eA.'\u000f","p":1},{"t":"eg","x":"\u000eHEveryone\u000f\u000eE watched in amazement.\u000f","p":1},{"t":"rule","x":"\u000eFSomeone/somebody\u000f\u000eD means 'a person.'\u000f","p":1},{"t":"eg","x":"\u000eHSomeone's\u000f\u000eE left all this litter here.\u000f","p":1},{"t":"rule","x":"\u000eFNo one/nobody\u000f\u000eD means 'no people.'\u000f","p":1},{"t":"eg","x":"\u000eHNobody\u000f\u000eE wants to take such a risk.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"We use -thing for things, actions, etc."},{"t":"eg","x":"\u000eEI've got \u000f\u000eHeverything\u000f\u000eE I need, thank you.\u000f","p":1},{"t":"eg","x":"\u000eHSomething\u000f\u000eE was happening at last.\u000f","p":1},{"t":"eg","x":"\u000eEJust keep quiet and say \u000f\u000eHnothing\u000f\u000eE.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"\u000eIEverywhere\u000f\u000eA means '(in) all places.'\u000f","p":1},{"t":"eg","x":"\u000eEThere are advertisements \u000f\u000eHeverywhere\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eISomewhere\u000f\u000eA means '(in) a place.'\u000f","p":1},{"t":"eg","x":"\u000eEHave you put my bag \u000f\u000eHsomewhere\u000f\u000eE?\u000f","p":1},{"t":"rule","x":"\u000eINowhere\u000f\u000eA means '(in) no places.'\u000f","p":1},{"t":"eg","x":"\u000eEThere's \u000f\u000eHnowhere\u000f\u000eE to sit down.\u000f","p":1}]},{"l":"E","b":[{"t":"rule","x":"\u000eAWe choose between \u000f\u000eIsomeone/anyone,\u000f\u000eA etc as between some/any. \u000f\u000eI➤108A,D\u000f","p":1},{"t":"eg","x":"There's someone at the door."},{"t":"eg","x":"\u000eEI'm not expecting \u000f\u000eHanyone\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEWe can go \u000f\u000eHanywhere\u000f\u000eE you like.\u000f","p":1}]},{"l":"F","b":[{"t":"rule","x":"\u000eI-one/-body\u000f\u000eA has a possessive form\u000f","p":1},{"t":"eg","x":"\u000eEThe guide had \u000f\u000eHeveryone's\u000f\u000eE passports.\u000f","p":1},{"t":"eg","x":"\u000eEI can get a lift in \u000f\u000eHsomebody's\u000f\u000eE car.\u000f","p":1}]},{"l":"G","b":[{"t":"rule","x":"\u000eAWe can use an \u000f\u000eDadjective\u000f\u000eA or \u000f\u000eDelse\u000f\u000eA after any of the compounds.\u000f","p":1},{"t":"eg","x":"\u000eEI heard \u000f\u000eHsomething interesting\u000f\u000eE today.\u000f","p":1},{"t":"eg","x":"\u000eELet's go \u000f\u000eHsomewhere nice\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEHave you got \u000f\u000eHanything cheaper\u000f\u000eE?\u000f","p":1},{"t":"eg","x":"\u000eECan I do \u000f\u000eHanything else\u000f\u000eE for you?\u000f","p":1},{"t":"rule","x":"We can also use a phrase or clause."},{"t":"eg","x":"\u000eHNobody in our group\u000f\u000eE speaks Greek.\u000f","p":1},{"t":"eg","x":"\u000eEI've told you\u000f\u000eH everything I know.\u000f","p":1},{"t":"rule","x":"We can use an adverb before a compound."},{"t":"eg","x":"\u000eEThis plant will grow \u000f\u000eHalmost anywhere.\u000f","p":1},{"t":"eg","x":"\u000eEI've done \u000f\u000eHabsolutely nothing\u000f\u000eE wrong.\u000f","p":1}]},{"l":"H","b":[{"t":"rule","x":"\u000eAThe compounds take a \u000f\u000eDsingular\u000f\u000eA verb \u000f\u000eI(applied to all compounds)\u000f","p":1},{"t":"eg","x":"\u000eHSomeone has\u000f\u000eE left the message\u000f","p":1},{"t":"eg","x":"\u000eHIs everything\u000f\u000eE all right?\u000f","p":1},{"t":"rule","x":"After -one/-body we normally use they/their even with a singular verb."},{"t":"eg","x":"\u000eHEveryone \u000f\u000eEwas asked what they thought\u000f","p":1},{"t":"eg","x":"\u000eHSomebody\u000f\u000eE has left their mobile there.\u000f","p":1},{"t":"tip","x":"If you want to be vague, then the informal phrase or something, meaning 'or something similar, can be useful, e.g. For lunch I'll have a sandwich or something. Let's go for a walk or something"}]}]},{"n":115,"t":"Introduction to adjectives","u":"Adjectives","s":[{"l":"A","b":[{"t":"eg","x":"\u000eEThese \u000f\u000eHexcellent\u000f\u000eE apartments are in a \u000f\u000eHquiet residential\u000f\u000eE area.\u000f","p":1},{"t":"rule","x":"\u000eAAn adjective modifies a noun. The adjectives here express physical qualities\u000f\u000eB ( quiet ) \u000f\u000eAor an opinion\u000f\u000eB ( excellent ), \u000f\u000eAor they classify something\u000f","p":1},{"t":"rule","x":"( residential, so not industrial)"}]},{"l":"B","b":[{"t":"rule","x":"An adjective always has the same form. There are no endings for number or gender"},{"t":"eg","x":"\u000eEAn \u000f\u000eHold\u000f\u000eE man an \u000f\u000eHold\u000f\u000eE woman \u000f\u000eHold\u000f\u000eE people\u000f","p":1},{"t":"rule","x":"\u000eABut some adjectives can have comparative/superlative endings. \u000f\u000eJ->131\u000f","p":1},{"t":"eg","x":"\u000eEMy wife is \u000f\u000eHolder\u000f\u000eE than I am\u000f","p":1},{"t":"rule","x":"\u000eAMost adjectives have \u000f\u000eDno special form\u000f\u000eA. But there are some endings used to form adjectives from other words\u000f","p":1},{"t":"rule","x":"\u000eEResidenti\u000f\u000eHal\u000f\u000eE, beauti\u000f\u000eHful\u000f\u000eE, cloud\u000f\u000eHy\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"We can use two or more adjectives together."},{"t":"eg","x":"\u000eEA\u000f\u000eH beautiful white sandy\u000f\u000eE beach.\u000f","p":1},{"t":"eg","x":"\u000eAFor the order of adjectives. \u000f\u000eL-->117\u000f","p":1},{"t":"rule","x":"We can put adverb of degree (e.g very )in front of most adjectives."},{"t":"eg","x":"\u000eEA \u000f\u000eHvery large\u000f\u000eE apartment\u000f","p":1},{"t":"eg","x":"\u000eEA \u000f\u000eHreally beautiful\u000f\u000eE beach\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"\u000eAOne main position for an adjective is \u000f\u000eD\"attributive\"\u000f\u000eA - before a noun\u000f","p":1},{"t":"eg","x":"\u000eEBrisbane is a \u000f\u000eHlovely\u000f\u000eE city\u000f","p":1},{"t":"rule","x":"The other is \"predicative\" - after a linking verb such as be"},{"t":"eg","x":"\u000eEBrisbane is \u000f\u000eHlovely\u000f","p":1},{"t":"eg","x":"\u000eEThe party seemed very \u000f\u000eHnoisy\u000f","p":1},{"t":"rule","x":"\u000eAWe can also sometimes put an adjective after a noun \u000f\u000eI->116C\u000f","p":1}]},{"l":"E","b":[{"t":"eg","x":"\u000eASome adjectives can follow \u000f\u000eEas\u000f\u000eA or \u000f\u000eEthan\u000f","p":1},{"t":"eg","x":"\u000eELet me know as soon \u000f\u000eHas possible\u000f","p":1},{"t":"eg","x":"\u000eEI went to bed later \u000f\u000eHthan usual\u000f","p":1}]},{"l":"F","b":[{"t":"rule","x":"We can sometimes use an adjective immediately after a conjunction"},{"t":"eg","x":"\u000eEPick the fruit \u000f\u000eHwhen ripe \u000f\u000eE(when it is ripe)\u000f","p":1},{"t":"rule","x":"\u000eHIf possible\u000f\u000eE, please send a photo (if it is possible)\u000f","p":1}]},{"l":"G","b":[{"t":"rule","x":"In literary English you may see examples like this"},{"t":"eg","x":"\u000eHUncertain\u000f\u000eE, the woman hesitated.\u000f","p":1},{"t":"eg","x":"\u000eEThe weather, \u000f\u000eHbright and sunny\u000f\u000eE, had brought everyone out of doors.\u000f","p":1},{"t":"tip","x":"\u000eAUse an adjective to express approval or enthusiasm: \u000f\u000eEWe've got permission - Oh, \u000f\u000eHgood/great\u000f\u000eE. That's \u000f\u000eHmarvellous\u000f","p":1}]}]},{"n":116,"t":"More about adjectives","u":"Adjectives","s":[{"l":"A","b":[{"t":"sub","x":"Attributive only"},{"t":"rule","x":"\u000eASome adjectives can go only in \u000f\u000eDattributive\u000f\u000eA position (before a noun)\u000f","p":1},{"t":"eg","x":"\u000eEThe project was an \u000f\u000eHutter\u000f\u000eE failure.\u000f","p":1},{"t":"eg","x":"\u000eEThe \u000f\u000eHouter\u000f\u000eE door is locked at night.\u000f","p":1},{"t":"eg","x":"\u000eEThe house is on a \u000f\u000eHmain\u000f\u000eE road.\u000f","p":1}]},{"l":"E","b":[{"t":"rule","x":"g. chief, elder, eventual, former, inner, lone, main, mere, only, outer, own, principal, sheer, sole, upper, utter."}]},{"l":"B","b":[{"t":"sub","x":"Predicative only"},{"t":"rule","x":"\u000eASome adjectives can go only in \u000f\u000eDpredicative\u000f\u000eA position (after a linking verb such \u000f\u000eEas be\u000f\u000eA)\u000f","p":1},{"t":"eg","x":"\u000eEI was \u000f\u000eHpleased\u000f\u000eE to see my friends.\u000f","p":1},{"t":"eg","x":"\u000eEThe children were soon \u000f\u000eHasleep\u000f","p":1},{"t":"rule","x":"These words include:"},{"t":"rule","x":"\u000eASome with a-, \u000f\u000eEe.g. afraid, alike, alone, asleep, awake;\u000f","p":1},{"t":"rule","x":"\u000eASome expressing feelings, \u000f\u000eEe.g. content, glad, pleased, upset\u000f","p":1},{"t":"rule","x":"There is sometimes another word we can use before a noun"},{"t":"eg","x":"\u000eEBeing \u000f\u000eHasleep\u000f\u000eE/ a \u000f\u000eHsleeping\u000f\u000eE child\u000f","p":1},{"t":"eg","x":"\u000eEBeing \u000f\u000eHalive\u000f\u000eE/ a \u000f\u000eHliving\u000f\u000eE person\u000f","p":1},{"t":"eg","x":"\u000eEFeeling \u000f\u000eHlonely/alone\u000f\u000eE / a \u000f\u000eHlonely\u000f\u000eE feeling\u000f","p":1},{"t":"rule","x":"\u000eEAshamed, glad, pleased, and upset\u000f\u000eA can come before a noun when not referring directly to a person.\u000f","p":1},{"t":"eg","x":"\u000eEthe \u000f\u000eHglad\u000f\u000eE news, an \u000f\u000eHupset\u000f\u000eE stomach\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"After a noun (postpositive)"},{"t":"rule","x":"1. Some adjectives can have a prepositional phrase after them."},{"t":"eg","x":"\u000eEPeople were \u000f\u000eHanxious for news.\u000f","p":1},{"t":"eg","x":"\u000eEThe box was\u000f\u000eH full of old clothes.\u000f","p":1},{"t":"rule","x":"2. The adjective + prepositional phrase can go directly after the noun."},{"t":"eg","x":"\u000eEPeople \u000f\u000eHanxious for news\u000f\u000eE kept ringing\u000f\u000eH.\u000f","p":1},{"t":"eg","x":"\u000eEI found \u000f\u000eHa box full of old clothes\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEThe book \u000f\u000eHavailable at the library\u000f\u000eE is out of stock.\u000f","p":1},{"t":"rule","x":"But we cannot put it before the noun"},{"t":"wrong","x":"a full of old clothes box"},{"t":"rule","x":"3. Sometimes the position of the adjective depends on the meaning."},{"t":"eg","x":"\u000eEThe sum \u000f\u000eHinvolved\u000f\u000eE is small. ( relevant)\u000f","p":1},{"t":"eg","x":"\u000eEIt's a rather \u000f\u000eHinvolved\u000f\u000eE story. ( complicated)\u000f","p":1},{"t":"eg","x":"\u000eEThere were 65 people \u000f\u000eHpresent\u000f\u000eE. ( there)\u000f","p":1},{"t":"eg","x":"\u000eELet's discuss the \u000f\u000eHpresent\u000f\u000eE situation. ( now)\u000f","p":1},{"t":"rule","x":"4. \u000eANote also compound + adjective (\u000f\u000eCindefinite pronouns)\u000f\u000eF -->114G\u000f","p":1},{"t":"eg","x":"\u000eEYou mustn't do \u000f\u000eHanything silly\u000f","p":1},{"t":"eg","x":"\u000eHAnyone interested\u000f\u000eE can join\u000f","p":1},{"t":"eg","x":"\u000eEThere’s \u000f\u000eHnothing important\u000f\u000eE left.\u000f","p":1},{"t":"eg","x":"\u000eEI heard \u000f\u000eHsomething interesting\u000f\u000eE today.\u000f","p":1},{"t":"eg","x":"\u000eELet's go \u000f\u000eHsomewhere nice\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEHave you got \u000f\u000eHanything cheaper\u000f\u000eE?\u000f","p":1},{"t":"eg","x":"\u000eECan I do \u000f\u000eHanything else\u000f\u000eE for you?\u000f","p":1},{"t":"rule","x":"5. Participial Adjectives"},{"t":"rule","x":"\u000eAWhen the adjective is derived from a participle (present or past), it often follows the noun to describe a \u000f\u000eCstate\u000f\u000eA or \u000f\u000eCcondition\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEThe sum \u000f\u000eHinvolved\u000f\u000eE is small\u000f","p":1},{"t":"eg","x":"\u000eEThe man \u000f\u000eHstanding\u000f\u000eE by the door is my friend\u000f","p":1},{"t":"rule","x":"6. Formal or Poetic Language"},{"t":"rule","x":"Adjectives may follow the noun for poetic or literary effect, or to sound formal."},{"t":"eg","x":"\u000eEThe prince \u000f\u000eHbrave\u000f\u000eE and true saved the kingdom.\u000f","p":1},{"t":"eg","x":"\u000eEWe have time \u000f\u000eHenough\u000f\u000eE to finish this.\u000f","p":1},{"t":"rule","x":"7. Legal, Technical, or Specialized Language"},{"t":"rule","x":"Some contexts, like legal or formal writing, place adjectives after the noun."},{"t":"eg","x":"\u000eEThe court \u000f\u000eHmartial\u000f\u000eE convened yesterday.\u000f","p":1},{"t":"eg","x":"\u000eEThe attorney \u000f\u000eHgeneral\u000f\u000eE is here.\u000f","p":1},{"t":"rule","x":"8. Adjectives Following Certain Nouns"},{"t":"rule","x":"In some expressions, the noun-adjective order is idiomatic."},{"t":"eg","x":"\u000eEThe heir \u000f\u000eHapparent\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEA body \u000f\u000eHpolitic\u000f\u000eE.\u000f","p":1},{"t":"tip","x":"TIP: Well ( in good health) and ill are not often used before a noun. How are you? I'm very well, thank you. How's your father?. I'm afraid he's ill/he's not very well at the moment"}]}]},{"n":117,"t":"The order of adjectives","u":"Adjectives","s":[{"l":"A","b":[{"t":"rule","x":"When two or more adjectives come before a noun, there is often a fixed order."},{"t":"eg","x":"A nice big warm fire"},{"t":"wrong","x":"a warm big nice fire"},{"t":"eg","x":"\u000eAThe order of adjectives depends \u000f\u000eDmainly on the kind of meaning they express.\u000f\u000eA An expression of \u000f\u000eDopinion\u000f\u000eA like \u000f\u000eEnice\u000f\u000eA comes first.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eAWhen we use an adjective and a \u000f\u000eDnoun modifier\u000f\u000eA, the adjective comes first.\u000f","p":1},{"t":"eg","x":"\u000eEthe \u000f\u000eHold town\u000f\u000eE wall\u000f","p":1},{"t":"eg","x":"\u000eHdark winter\u000f\u000eE evenings\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"The modifiers usually go in the following order, starting with group 1:"},{"t":"rule","x":"1.      \u000eKOpinion\u000f\u000eB: nice, excellent, awful, etc.\u000f","p":1},{"t":"rule","x":"2.      \u000eKSize\u000f\u000eB: long, large, small, short, etc.\u000f","p":1},{"t":"rule","x":"3.      \u000eKMost other qualities\u000f\u000eB: clear, busy, famous, friendly, soft, quiet, etc.\u000f","p":1},{"t":"rule","x":"4.      \u000eKAge\u000f\u000eB: new, old\u000f","p":1},{"t":"rule","x":"5.      \u000eKShape\u000f\u000eB: round, square, fat, narrow, etc.\u000f","p":1},{"t":"rule","x":"6.      \u000eKColour\u000f\u000eB: blue, red, white, black, etc.\u000f","p":1},{"t":"rule","x":"7.      \u000eKParticiple forms\u000f\u000eB: running, missing, covered, broken, etc.\u000f","p":1},{"t":"rule","x":"8.      \u000eKOrigin\u000f\u000eB: British, Italian, American, etc.\u000f","p":1},{"t":"rule","x":"9.      \u000eKMaterial\u000f\u000eB: sandy, paper, plastic, etc.\u000f","p":1},{"t":"rule","x":"10.     \u000eKType\u000f\u000eB: electronic, human, chemical, money (problems), etc.\u000f","p":1},{"t":"rule","x":"11.     \u000eKPurpose\u000f\u000eB: alarm (clock), tennis (court), walking (boots), etc.\u000f","p":1},{"t":"sub","x":"Examples of Usage"},{"t":"eg","x":"an old cardboard box (age + material)"},{"t":"rule","x":"a new improved model (age + participle)"},{"t":"eg","x":"a small square room (size + shape)"},{"t":"eg","x":"two excellent public tennis courts (opinion + type + purpose)"},{"t":"rule","x":"In general, the word closest to the noun has the closest link with it. In the phrase excellent public tennis courts, the word tennis is closely connected with courts."},{"t":"rule","x":"\u000eAThe \u000f\u000eDrules are not absolute\u000f\u000eA. We may prefer a short word before a long one.\u000f","p":1},{"t":"eg","x":"\u000eEA \u000f\u000eHbig horrible\u000f\u000eE building.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"A modifier can be a compound."},{"t":"rule","x":"an old pale blue football shirt a powerful high-speed electric drill"}]},{"l":"E","b":[{"t":"rule","x":"With two similar adjectives, the shorter one usually comes first."},{"t":"rule","x":"\u000eEa \u000f\u000eHbright, cheerful\u000f\u000eE smile\u000f","p":1},{"t":"rule","x":"\u000eAYou can also use \u000f\u000eDand\u000f\u000eA:\u000f","p":1},{"t":"eg","x":"\u000eEa bright \u000f\u000eHand\u000f\u000eE cheerful smile\u000f","p":1},{"t":"rule","x":"\u000eABut \u000f\u000eFand\u000f\u000eA is not used with different meanings:\u000f","p":1},{"t":"rule","x":"\u000eEa \u000f\u000eHlovely old\u000f\u000eE city\u000f","p":1},{"t":"wrong","x":"a lovely \u0004and\u0005 old city"},{"t":"tip","x":"We use \u0001and\u0002 when the adjectives come after a verb like \u0001be\u0002, e.g., The city is old and lovely. An expression of opinion (lovely) comes last."}]}]},{"n":118,"t":"Tired and exhausted; amusing and amused, etc","u":"Adjectives","s":[{"l":"A","b":[{"t":"sub","x":"Ungradable adjectives"},{"t":"rule","x":"\u000eAMost adjectives are \u000f\u000eCgradable\u000f\u000eA — they express qualities which can exist in different grades or degrees.\u000f","p":1},{"t":"eg","x":"\u000eEIt’s \u000f\u000eHvery/extremely\u000f\u000eE warm today.\u000f","p":1},{"t":"eg","x":"\u000eEI feel \u000f\u000eHrather\u000f\u000eE tired/\u000f\u000eHa bit\u000f\u000eE tired now. \u000f","p":1},{"t":"rule","x":"Some adjectives are ungradable. They express extreme qualities such as perfection. We cannot use words like \u0001very\u0002 or fairly with an ungradable adjective, but we can use absolutely."},{"t":"eg","x":"\u000eEIt’s \u000f\u000eHabsolutely\u000f\u000eE boiling today.\u000f","p":1},{"t":"eg","x":"\u000eEI feel \u000f\u000eHabsolutely\u000f\u000eE exhausted now.\u000f","p":1},{"t":"rule","x":"\u000eAWith some ungradable adjectives, we can also use \u000f\u000eFcompletely\u000f\u000eA or \u000f\u000eFtotally\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEI’m afraid that’s \u000f\u000eHcompletely impossible.\u000f","p":1},{"t":"eg","x":"\u000eEIt’s a \u000f\u000eHtotally incredible\u000f\u000eE story.\u000f","p":1},{"t":"rule","x":"\u000eCReally\u000f\u000eA and \u000f\u000eCso\u000f\u000eA go with both types.\u000f","p":1},{"t":"eg","x":"\u000eEI felt \u000f\u000eHreally/so\u000f\u000eE tired.\u000f","p":1},{"t":"eg","x":"\u000eEI felt \u000f\u000eHreally/so\u000f\u000eE exhausted.\u000f","p":1},{"t":"rule","x":"\u000eAFor \u000f\u000eIquite\u000f\u000eA and \u000f\u000eIrather ➤128.\u000f","p":1},{"t":"sub","x":"Other ungradable adjectives include:"},{"t":"rule","x":"absurd, amazed/ing, awful, brilliant, certain, delicious, delighted, dreadful, enormous, essential, excellent, false, fascina ted/ing, horrible, huge, ideal, magnificent, marvellous, perfect, ridiculous, terrible, terrific, terrified/ing, thrilled/ing, useless, vast."}]},{"l":"B","b":[{"t":"sub","x":"\u000eCAdjectives\u000f\u000eG in -ing and -ed\u000f","p":1},{"t":"rule","x":"Look at these examples."},{"t":"eg","x":"\u000eEThe film made me laugh a lot. It was really \u000f\u000eHamusing\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEI talked to an \u000f\u000eHinteresting\u000f\u000eE man.\u000f","p":1},{"t":"eg","x":"\u000eEThis weather is so \u000f\u000eHdepressing\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eAAdjectives ending in \u000f\u000eI-ing\u000f\u000eA express t\u000f\u000eDhe idea that something affects us. \u000f","p":1},{"t":"eg","x":"\u000eEa film is \u000f\u000eHamusing\u000f\u000eE because it makes us laugh.\u000f","p":1},{"t":"rule","x":"\u000eACompare the adjectives ending in \u000f\u000eI-ed:\u000f","p":1},{"t":"eg","x":"\u000eEThe audience laughed a lot. They were really \u000f\u000eHamused\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEI was \u000f\u000eHinterested\u000f\u000eE in the conversation.\u000f","p":1},{"t":"eg","x":"\u000eEI feel \u000f\u000eHdepressed\u000f\u000eE when it rains.\u000f","p":1},{"t":"eg","x":"\u000eAAdjectives in \u000f\u000eI-ed\u000f\u000eA express the feelings \u000f\u000eDwe have about something. \u000f","p":1},{"t":"rule","x":"\u000eEwe are \u000f\u000eHamused\u000f\u000eE when we see something funny.\u000f","p":1},{"t":"rule","x":"\u000eDOther pairs of adjectives in\u000f\u000eF -ing\u000f\u000eD and\u000f\u000eF -ed\u000f\u000eD include:\u000f","p":1},{"t":"rule","x":"alarming/ed, amazing/ed, annoying/ed, boring/ed, confusing/ed, disappointing/ed, exciting/ed, fascinating/ed, frightening/ed, pleasing/ed, puzzling/ed, relaxing/ed, shocking/ed, surprising/ed, thrilling/ed, tiring/ed, worrying/ed ."},{"t":"tip","x":"Do not use \u0001very\u0002 with an ungradable adjective like excellent. Say: It’s excellent or It’s very good, but not It’s very excellent."}]}]},{"n":119,"t":"The + adjective","u":"Adjectives","s":[{"l":"A","b":[{"t":"sub","x":"\u000eGThe poor,\u000f\u000eC etc\u000f","p":1},{"t":"rule","x":"\u000eAWe can use \u000f\u000eJthe + adjective\u000f\u000eA to refer to some groups of people in society:\u000f","p":1},{"t":"eg","x":"\u000eHThe poor\u000f\u000eE lived in terrible conditions. (poor people in general)\u000f","p":1},{"t":"eg","x":"\u000eHThe young\u000f\u000eE should respect the old. (young/old people in general)\u000f","p":1},{"t":"rule","x":"\u000eAWe can also say \u000f\u000eFpoor people\u000f\u000eI, \u000f\u000eFold people\u000f\u000eI, etc.,\u000f\u000eA with the same general meaning:\u000f","p":1},{"t":"eg","x":"Poor people lived in terrible conditions."},{"t":"rule","x":"\u000eAFor a \u000f\u000eDspecific\u000f\u000eA person or group of people, we use \u000f\u000eJman\u000f\u000eI, \u000f\u000eJpeople\u000f\u000eI,\u000f\u000eA etc.:\u000f","p":1},{"t":"eg","x":"A young man welcomed us."},{"t":"wrong","x":"A young welcomed us."},{"t":"eg","x":"The old people have just left."},{"t":"wrong","x":"The old have just left."},{"t":"rule","x":"\u000eAThe \u000f\u000eCthe + adjective\u000f\u000eA takes a plural verb. However, we do not add \u000f\u000eD-s\u000f\u000eA to the adjective:\u000f","p":1},{"t":"eg","x":"The old are respected."},{"t":"wrong","x":"The olds."},{"t":"rule","x":"Other adjectives and participle forms used in this way include:"},{"t":"rule","x":"blind, dead, deaf, disabled, elderly, homeless, hungry, living, middle-aged, (under)privileged, rich, sick, sighted, strong, unemployed, weak; and some nationality words, e.g., the French."},{"t":"rule","x":"The adjective can also have an adverb in front of it:"},{"t":"eg","x":"\u000eEthe \u000f\u000eHvery\u000f\u000eE rich\u000f","p":1},{"t":"eg","x":"\u000eEthe \u000f\u000eHseverely\u000f\u000eE disabled\u000f","p":1},{"t":"rule","x":"Some adjectives normally have an adverb in front of them:"},{"t":"eg","x":"\u000eEthe \u000f\u000eHless\u000f\u000eE fortunate\u000f","p":1},{"t":"eg","x":"\u000eEthe \u000f\u000eHmentally\u000f\u000eE ill\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"\u000eGThe supernatural,\u000f\u000eC etc\u000f","p":1},{"t":"rule","x":"\u000eASome adjectives and participle forms can be used after \u000f\u000eCthe\u000f\u000eA for things in general which have a particular abstract quality:\u000f","p":1},{"t":"eg","x":"\u000eEDo you believe in \u000f\u000eHthe supernatural\u000f\u000eE?\u000f","p":1},{"t":"eg","x":"\u000eEIt was a journey into\u000f\u000eH the unknown\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eAWe use a \u000f\u000eDsingular\u000f\u000eA verb:\u000f","p":1},{"t":"eg","x":"\u000eHThe new\u000f\u000eE drives out \u000f\u000eHthe old.\u000f","p":1},{"t":"rule","x":"\u000eASome other words used in this way are: \u000f\u000eIabsurd, mysterious, unexplained.\u000f","p":1},{"t":"eg","x":"\u000eEHe has a good sense of\u000f\u000eH the absurd.\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"\u000eGThe unexpected,\u000f\u000eC etc\u000f","p":1},{"t":"rule","x":"\u000eAA few words can be used after \u000f\u000eCthe\u000f\u000eA with a more specific meaning:\u000f","p":1},{"t":"eg","x":"\u000eEI hate getting up in \u000f\u000eHthe dark\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEI fear \u000f\u000eHthe worst\u000f\u000eE but hope for \u000f\u000eHthe best.\u000f","p":1},{"t":"eg","x":"\u000eEYou’re asking \u000f\u000eHthe impossible\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEHave you heard \u000f\u000eHthe latest (news)?\u000f","p":1},{"t":"eg","x":"\u000eHThe unexpected\u000f\u000eE sometimes happens.\u000f","p":1},{"t":"tip","x":"Use the + adjective/participle + thing for a particular aspect of a situation: The good thing about friends is that you can trust them. The annoying thing was that I didn’t have the money for a taxi."}]}]},{"n":120,"t":"Introduction to Adverbial","u":"Adverbials","s":[{"l":"A","b":[{"t":"rule","x":"\u000eAAdverbial add \u000f\u000eDmore details\u000f\u000eA to a sentence. They tell us \u000f\u000eDhow, when, or where\u000f\u000eA something happened.\u000f","p":1},{"t":"eg","x":"\u000eHSlowly\u000f\u000eE the bus drove past.\u000f","p":1},{"t":"eg","x":"\u000eEWe have now been waiting \u000f\u000eHan hour.\u000f","p":1},{"t":"eg","x":"I'm travelling around the world."},{"t":"rule","x":"\u000eAOften an adverbial is an \u000f\u000eDextra element\u000f\u000eA that could be \u000f\u000eDleft out of sentence.\u000f","p":1},{"t":"eg","x":"\u000eHAt last\u000f\u000eE we were off. Or we were off\u000f","p":1},{"t":"rule","x":"But sometimes it is necessary to complete the sentence ➤2D"},{"t":"eg","x":"\u000eEThe match is \u000f\u000eHtomorrow\u000f","p":1},{"t":"eg","x":"\u000eEWe got \u000f\u000eHon the bus\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eAAn adverbial can be a \u000f\u000eDsimple adverb\u000f","p":1},{"t":"eg","x":"\u000eENo one lives \u000f\u000eHthere\u000f","p":1},{"t":"eg","x":"\u000eEI wrapped all the glasses \u000f\u000eHcarefully\u000f","p":1},{"t":"eg","x":"\u000eEThe match is \u000f\u000eHtomorrow\u000f","p":1},{"t":"rule","x":"We can put an adverb of degree (e.g. very) in front of the adverb"},{"t":"eg","x":"\u000eEThe time passed \u000f\u000eHvery quickly\u000f","p":1},{"t":"rule","x":"An adverbial can also be a prepositional phrase ➤1C"},{"t":"eg","x":"\u000eEWe got \u000f\u000eHon the bus\u000f","p":1},{"t":"eg","x":"\u000eEWe walked\u000f\u000eH to the park\u000f","p":1},{"t":"eg","x":"\u000eEThe queue went\u000f\u000eH around/round the block\u000f","p":1},{"t":"eg","x":"\u000eHIn a strange way, \u000f\u000eEI don't mind failing.\u000f","p":1},{"t":"rule","x":"We can use a noun phrase, but this is less frequent"},{"t":"eg","x":"\u000eEI saw a great film \u000f\u000eHlast week.\u000f","p":1},{"t":"eg","x":"\u000eEThe meeting are \u000f\u000eHevery month\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"\u000eAAn adverbial usually go in \u000f\u000eBmore than one place in a sentence\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eHNaturally\u000f\u000eE we were expecting a call.\u000f","p":1},{"t":"eg","x":"\u000eEWe were \u000f\u000eHnaturally \u000f\u000eEexpecting a call.\u000f","p":1},{"t":"eg","x":"\u000eEWe were expecting a call, \u000f\u000eHnaturally .\u000f","p":1},{"t":"rule","x":"The best position for an adverbial may depend on what type it is ( e.g. manner or time) , or on its length. A long phrase goe s better at the beginning or end."},{"t":"eg","x":"\u000eEI can't express it \u000f\u000eHin simple words.\u000f","p":1},{"t":"rule","x":"Sometimes we put an adverbial in front position to link with the previous sentence"},{"t":"eg","x":"\u000eEI waited for ages\u000f\u000eH. In the end \u000f\u000eEI gave up and went home.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"An adverbial can also follow a noun that it modifies."},{"t":"eg","x":"\u000eEThe car \u000f\u000eHin front\u000f\u000eE braked suddenly.\u000f","p":1},{"t":"eg","x":"\u000eEThe rain \u000f\u000eHyesterday\u000f\u000eE spoilt our picnic.\u000f","p":1},{"t":"tip","x":"TIP: When there are 2 clauses, the position of the adverbial can affect the meaning. We agreed immediately that I would leave. We agreed that I would leave immediately."}]}]},{"n":121,"t":"Adverbials: front and end position","u":"Adverbials","s":[{"l":"A","b":[{"t":"sub","x":"Front position"},{"t":"rule","x":"Front position is at the beginning."},{"t":"eg","x":"\u000eHSure enough,\u000f\u000eE there was a queue.\u000f","p":1},{"t":"eg","x":"\u000eHJust\u000f\u000eE stop doing that, will you?\u000f","p":1},{"t":"rule","x":"Most types of adverbial can go here."},{"t":"rule","x":"\u000eAIf there is a \u000f\u000eDconjunction\u000f\u000eA, it goes \u000f\u000eDbefore the adverbial.\u000f","p":1},{"t":"eg","x":"\u000eEI thought there would be a queue, \u000f\u000eHand sure enough\u000f\u000eE there was.\u000f","p":1},{"t":"rule","x":"\u000eAWe often put an adverbial in front position to \u000f\u000eDrelate\u000f\u000eA to something in the previous sentence.\u000f","p":1},{"t":"eg","x":"\u000eEI’m busy today. \u000f\u000eHTomorrow\u000f\u000eE I’m free.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"End position"},{"t":"rule","x":"Sometimes an adverbial comes at the end of a clause."},{"t":"eg","x":"\u000eEIt doesn’t often rain \u000f\u000eHin the desert\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEEveryone thanked her \u000f\u000eHvery warmly\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eDAlmost all types\u000f\u000eA of adverbial can go here.\u000f","p":1},{"t":"rule","x":"\u000eAAn adverbial usually \u000f\u000eDfollows an object.\u000f","p":1},{"t":"eg","x":"\u000eEI planned the trip \u000f\u000eHcarefully\u000f\u000eE.\u000f","p":1},{"t":"wrong","x":"I planned carefully the trip."},{"t":"rule","x":"\u000eABut a short adverbial can go \u000f\u000eDbefore\u000f\u000eA a \u000f\u000eDlong object.\u000f","p":1},{"t":"eg","x":"\u000eEI planned \u000f\u000eHcarefully\u000f\u000eE our trip around the States.\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"Order in end position"},{"t":"rule","x":"Sometimes there is more than one adverbial in end position. Usually a shorter adverbial goes before a longer one."},{"t":"sub","x":"\u000eEWe sat \u000f\u000eHaround most of the weekend.\u000f","p":1},{"t":"rule","x":"\u000eAAn adverbial goes directly after a verb to which it is \u000f\u000eDclosely\u000f\u000eA linked in \u000f\u000eDmeaning\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI don’t want to go \u000f\u000eHto work\u000f\u000eE today.\u000f","p":1},{"t":"eg","x":"\u000eEWhy did you come \u000f\u000eHhome\u000f\u000eE late?\u000f","p":1},{"t":"rule","x":"\u000eAWe usually put an adverbial of place next to \u000f\u000eFgo\u000f\u000eI, \u000f\u000eFcome\u000f\u000eA, etc.\u000f","p":1},{"t":"rule","x":"Time and place adverbials go either way."},{"t":"eg","x":"\u000eEI saw "\u000eETry to act \u000f\u000eHsensibly\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"An adverb of manner says how something happens. It usually comes after a verb (act) or a verb + object (solved the problem). Most are formed from an adjective + -ly. ➤123"}]},{"l":"B","b":[{"t":"sub","x":"Linking verb and action verb"},{"t":"rule","x":"Compare the verbs in these sentences."},{"t":"rule","x":"Linking verb + adjective"},{"t":"eg","x":"\u000eEThe official \u000f\u000eHwas polite\u000f\u000eE.\u000f","p":1},{"t":"sub","x":"Action verb + adverb"},{"t":"eg","x":"\u000eEThe official \u000f\u000eHlistened politely.\u000f","note":"not He listened polite.","p":1},{"t":"rule","x":"\u000eAA linking verb is one like \u000f\u000eEbe, become, feel, look, seem\u000f\u000eD.\u000f\u000eA An action verb is one like \u000f\u000eEargue, drive, meet, listen, work.\u000f","p":1},{"t":"rule","x":"Some verbs can be of either type."},{"t":"sub","x":"\u000eEHe\u000f\u000eH looked nervous.\u000f\u000eA (appeared)\u000f","p":1},{"t":"eg","x":"\u000eEHe \u000f\u000eHlooked nervously\u000f\u000eE at us.\u000f\u000eA (directed his eyes)\u000f","p":1},{"t":"rule","x":"\u000eEThe atmosphere \u000f\u000eHgrew tense.\u000f\u000eA (became)\u000f","p":1},{"t":"eg","x":"\u000eEThe tree \u000f\u000eHgrew rapidly.\u000f\u000eA (increased in size)\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"Prepositional phrases of manner"},{"t":"rule","x":"We can use a prepositional phrase."},{"t":"eg","x":"\u000eEI chose my words carefully / \u000f\u000eHwith care.\u000f","p":1},{"t":"eg","x":"\u000eEHe stared at me rather aggressively / \u000f\u000eHin a rather aggressive manner.\u000f","p":1},{"t":"eg","x":"\u000eEThe winning numbers are chosen randomly / \u000f\u000eHat random.\u000f","p":1}]},{"l":"D","b":[{"t":"sub","x":"Position"},{"t":"rule","x":"\u000eAAn adverbial of manner usually goes\u000f\u000eD in end position\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEThe sun still shone \u000f\u000eHbrightly\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEWe continued our work \u000f\u000eHin silence.\u000f","p":1},{"t":"rule","x":"\u000eAA one-word adverb can sometimes come in mid position. \u000f\u000eB➤122\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHquickly\u000f\u000eE ran and got my coat.\u000f","p":1},{"t":"rule","x":"It can sometimes come in front position for emphasis."},{"t":"eg","x":"\u000eHGently\u000f\u000eE fry the banana pieces.\u000f","p":1},{"t":"rule","x":"The last two examples are more common in writing than in speech."},{"t":"tip","x":"If a verb has a similar meaning to \u0001be\u0002, then it's a linking verb and is followed by an adjective rather than an adverb. She seemed/looked excited is close in meaning to She was excited."}]}]},{"n":125,"t":"Adverbials of place/time","u":"Adverbials","s":[{"l":"A","b":[{"t":"sub","x":"Position"},{"t":"rule","x":"These adverbials often go in end position."},{"t":"eg","x":"\u000eEIt’s my birthday \u000f\u000eHtomorrow\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEThere was an accident \u000f\u000eHon the motorway.\u000f","p":1},{"t":"rule","x":"\u000eAFor more than one adverbial \u000f\u000eB➤121C.\u000f","p":1},{"t":"rule","x":"Adverbials of place and time can also go in front position."},{"t":"eg","x":"\u000eHOn Saturday\u000f\u000eE we’re going to London.\u000f","p":1},{"t":"rule","x":"Some short adverbials of time can go in mid position."},{"t":"eg","x":"\u000eEI’ve \u000f\u000eHjust\u000f\u000eE remembered something.\u000f","p":1},{"t":"rule","x":"\u000eAThese include: \u000f\u000eEalready, finally, immediately, no longer, now, soon, then.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"Yet"},{"t":"eg","x":"\u000eFYet\u000f\u000eA comes at the \u000f\u000eDend\u000f\u000eA of a question or negative.\u000f","p":1},{"t":"eg","x":"\u000eEHave you left \u000f\u000eHyet\u000f\u000eE? I haven’t got up \u000f\u000eHyet\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"In mid position it is a little formal."},{"t
