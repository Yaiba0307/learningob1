es","carrys","carryes","carrings"],"a":0,"e":"A consonant + y changes to -ies. A vowel + y simply adds -s: plays, buys.","k":"mcq"},{"id":"h266","n":177,"q":"What is the past tense of <b>stop<\/b>?","o":["stopped","stoped","stopeed","stopd"],"a":0,"e":"A single stressed vowel before a final consonant means the consonant doubles.","k":"mcq"},{"id":"h267","n":178,"q":"What is the -ing form of <b>make<\/b>?","o":["making","makeing","makking","makinng"],"a":0,"e":"A silent final -e is dropped before -ing.","k":"mcq"},{"id":"h268","n":178,"q":"What is the -ing form of <b>begin<\/b>?","o":["beginning","begining","beginnning","beginingg"],"a":0,"e":"The final consonant doubles because the last syllable is stressed.","k":"mcq"},{"id":"h269","n":179,"q":"A <b>weak form<\/b> is used when a word is…","o":["unstressed in connected speech","at the end of a sentence","emphasised","written formally"],"a":0,"e":"Words like <i>and, of, to, can<\/i> have reduced vowel sounds when unstressed.","k":"mcq"},{"id":"h270","n":180,"q":"Which is the short form of <b>they would<\/b>?","o":["they'd","they'll","they're","they've"],"a":0,"e":"<i>'d<\/i> stands for <i>would<\/i> or <i>had<\/i>; the following verb form shows which one.","k":"mcq"},{"id":"h271","n":180,"q":"<i>He'd gone<\/i> — what does <b>'d<\/b> stand for?","o":["had","would","did","should"],"a":0,"e":"Before a past participle, <i>'d<\/i> is <i>had<\/i>. Before a base form it is <i>would<\/i>.","k":"mcq"},{"id":"a0","n":3,"q":"Which sentence is correct?","o":["You give the attendant your ticket.","You give your ticket the attendant."],"a":0,"e":"When a verb has two objects, the first is the indirect object, and the second is the direct object. The other version is not correct English.","k":"err"},{"id":"a1","n":3,"q":"Which sentence is correct?","o":["Tim described the men to the police.","Tim described the police the men."],"a":0,"e":"Some verbs can occur with to or for but not with an indirect object. The other version is not correct English.","k":"err"},{"id":"a2","n":3,"q":"Which sentence is correct?","o":["I'll explain everything to you.","I'll explain you everything."],"a":0,"e":"Some verbs can occur with to or for but not with an indirect object. The other version is not correct English.","k":"err"},{"id":"a3","n":5,"q":"Which sentence is correct?","o":["I don’t like cowboy films.","The player spoke not to reporters."],"a":0,"e":"In simple tenses we use do as the auxiliary. The other version is not correct English.","k":"err"},{"id":"a4","n":5,"q":"Which sentence is correct?","o":["The message didn't arrive.","The message no arrived."],"a":0,"e":"We do not use no in a negative verb form. The other version is not correct English.","k":"err"},{"id":"a5","n":5,"q":"Which sentence is correct?","o":["The message didn't arrive.","can come before a word or phrase which needs correcting, or before some expressions of quantity, distance, or time."],"a":0,"e":"We do not use no in a negative verb form. The other version is not correct English.","k":"err"},{"id":"a6","n":6,"q":"Which sentence is correct?","o":["Only in summer is it hot enough to swim.","until the following Monday was I able to see a doctor."],"a":0,"e":"The auxiliary (e.g. should) comes before the subject (e.g. you). The other version is not correct English.","k":"err"},{"id":"a7","n":9,"q":"Which sentence is correct?","o":["Could I have reserved a seat?","Could have I reserved a seat?"],"a":0,"e":"If there is more than one auxiliary verb (e.g. could and have), then only the first one comes before the subject. The other version is not correct English.","k":"err"},{"id":"a8","n":9,"q":"Which sentence is correct?","o":["Where did everyone stay?","Where stayed everyone?"],"a":0,"e":"In simple tenses we use do/does as the auxiliary verb. The other version is not correct English.","k":"err"},{"id":"a9","n":9,"q":"Which sentence is correct?","o":["Why were you late?","Why did you be late?"],"a":0,"e":"Be on its own as an ordinary verb also comes before the subject. The other version is not correct English.","k":"err"},{"id":"a10","n":12,"q":"Which sentence is correct?","o":["Why aren’t I on the list?","Do not you like chocolate?"],"a":0,"e":"The negative of am I is aren’t I. The other version is not correct English.","k":"err"},{"id":"a11","n":14,"q":"Which sentence is correct?","o":["That’s right, isn’t it?","... isn’t that?"],"a":0,"e":"After this/that or -thing, we use it. The other version is not correct English.","k":"err"},{"id":"a12","n":16,"q":"Which sentence is correct?","o":["There’s soup here. Would you like some?","Would you like?"],"a":0,"e":"We can also leave out a noun after a number, a quantifier, this/that/these/those, or a superlative adjective. The other version is not correct English.","k":"err"},{"id":"a13","n":17,"q":"Which sentence is correct?","o":["Am I too late? ~ I’m afraid you are.","I’m afraid you’re."],"a":0,"e":"The auxiliary can be positive or negative. A positive auxiliary cannot be a short form. The other version is not correct English.","k":"err"},{"id":"a14","n":19,"q":"Which sentence is correct?","o":["Are these figures correct? ~ I think so.","Yes, I expect or Yes, I expect it."],"a":0,"e":"So can replace a whole clause. The other version is not correct English.","k":"err"},{"id":"a15","n":22,"q":"Which sentence is correct?","o":["Outside two men were talking.","Outside were talking two men."],"a":0,"e":"When an adverbial of place comes in front position, there is sometimes inversion of subject and verb. The other version is not correct English.","k":"err"},{"id":"a16","n":23,"q":"Which sentence is correct?","o":["There was a noise that woke me up.","There was a noise waking me up."],"a":0,"e":"But we do not use a participle for a single complete action. The other version is not correct English.","k":"err"},{"id":"a17","n":23,"q":"Which sentence is correct?","o":["There’s something that I need to do.","There’s something needing to do."],"a":0,"e":"When the relative pronoun is not the subject, we cannot use a participle. The other version is not correct English.","k":"err"},{"id":"a18","n":24,"q":"Which sentence is correct?","o":["We all thought it a pity that it rained.","We all thought that it rained a pity."],"a":0,"e":"We can also use it in the pattern: subject + verb + it + complement + clause. The other version is not correct English.","k":"err"},{"id":"a20","n":26,"q":"Which sentence is correct?","o":["The journey doesn’t take long.","... no takes long. And NOT ... doesn’t takes long."],"a":0,"e":"Tom does not know the answer. The other version is not correct English.","k":"err"},{"id":"a21","n":26,"q":"Which sentence is correct?","o":["How long does the journey take?","How long takes the journey?"],"a":0,"e":"In the third person singular we use does. The other version is not correct English.","k":"err"},{"id":"a22","n":29,"q":"Which sentence is correct?","o":["They didn’t run away.","They no ran away.) and NOT They didn’t ran away."],"a":0,"e":"In the negative we use did not or didn't + base form. The other version is not correct English.","k":"err"},{"id":"a23","n":29,"q":"Which sentence is correct?","o":["How fast did they run?","How fast ran they?"],"a":0,"e":"In questions we use did + base form. The other version is not correct English.","k":"err"},{"id":"a24","n":29,"q":"Which sentence is correct?","o":["Were you tired last night?","Did you be tired last night?"],"a":0,"e":"We do not use did with was or were. The other version is not correct English.","k":"err"},{"id":"a25","n":34,"q":"Which sentence is correct?","o":["It’s wet here. The roof has been leaking.","I wait here for half an hour."],"a":0,"e":"We use the present perfect continuous for an action over a period of time leading up to the present. The other version is not correct English.","k":"err"},{"id":"a26","n":36,"q":"Which sentence is correct?","o":["We are decorating the flat.","We are owning the flat."],"a":0,"e":"It belongs to me. We need some help. The other version is not correct English.","k":"err"},{"id":"a27","n":36,"q":"Which sentence is correct?","o":["They were guessing the answers.","They were knowing the answers."],"a":0,"e":"It belongs to me. We need some help. The other version is not correct English.","k":"err"},{"id":"a28","n":40,"q":"Which sentence is correct?","o":["I'll carry that for you.","I carry that for you."],"a":0,"e":"We do not use the present simple for decisions or intentions. The other version is not correct English.","k":"err"},{"id":"a29","n":40,"q":"Which sentence is correct?","o":["They're going to build a road through here soon.","They build a road through here soon."],"a":0,"e":"We do not use the present simple for decisions or intentions. The other version is not correct English.","k":"err"},{"id":"a30","n":40,"q":"Which sentence is correct?","o":["Call me as soon as you have any news.","... as soon as you'll have any news."],"a":0,"e":"We often use the present simple for future time in a clause with if, when, as, while, before, after, until, by the time, or as soon as. The other version is not correct English.","k":"err"},{"id":"a31","n":40,"q":"Which sentence is correct?","o":["I'll relax when I'm lying by the pool.","... when I'll be lying by the pool."],"a":0,"e":"We also use the present, and not will, with the continuous and the perfect. The other version is not correct English.","k":"err"},{"id":"a32","n":40,"q":"Which sentence is correct?","o":["Let's carry on until we've finished.","... until we'll have finished."],"a":0,"e":"We also use the present, and not will, with the continuous and the perfect. The other version is not correct English.","k":"err"},{"id":"a33","n":41,"q":"Which sentence is correct?","o":["I’ll be away for three weeks.","I’m being away for three weeks."],"a":0,"e":"Note that we do not use the ordinary verb be in the present continuous. The other version is not correct English.","k":"err"},{"id":"a34","n":42,"q":"Which sentence is correct?","o":["There is no time with these phrases.","We’re about to leave in ten minutes."],"a":0,"e":"We can use just with be about to and be going to for the very near future. The other version is not correct English.","k":"err"},{"id":"a35","n":44,"q":"Which sentence is correct?","o":["It isn’t very far now.","It doesn’t be very far now."],"a":0,"e":"We do not use do in simple tense negatives and questions. The other version is not correct English.","k":"err"},{"id":"a36","n":44,"q":"Which sentence is correct?","o":["Were you at the meeting?","Did you be at the meeting?"],"a":0,"e":"We do not use do in simple tense negatives and questions. The other version is not correct English.","k":"err"},{"id":"a37","n":45,"q":"Which sentence is correct?","o":["Did you have a good journey?","We’ve got a great time."],"a":0,"e":"We use do as a simple-tense auxiliary. The other version is not correct English.","k":"err"},{"id":"a38","n":60,"q":"Which sentence is correct?","o":["○ My friend has a sport car.","A sports car is had by my friend"],"a":0,"e":"Some state verbs with an object cannot be passive, e.g. have, lack, suit The other version is not correct English.","k":"err"},{"id":"a39","n":62,"q":"Which sentence is correct?","o":["The railway was privatized in the 1990s.","The railway got privatized."],"a":0,"e":"But it is not used for a planned action. The other version is not correct English.","k":"err"},{"id":"a40","n":63,"q":"Which sentence is correct?","o":["The room needs decorating. (= The room needs to be decorated.)","It needed being decorated"],"a":0,"e":"The active gerund has a passive meaning after need or want (=need ). The other version is not correct English.","k":"err"},{"id":"a41","n":67,"q":"Which sentence is correct?","o":["I was intending to study law.","I was intending studying law"],"a":0,"e":"We usually avoid two ing-forms together. The other version is not correct English.","k":"err"},{"id":"a42","n":68,"q":"Which sentence is correct?","o":["This group includes can’t bear, hate, like, love, need, prefer, want, wish.","We want that people have fun."],"a":0,"e":"Say is used only in the passive. ➤61C The other version is not correct English.","k":"err"},{"id":"a43","n":69,"q":"Which sentence is correct?","o":["The puzzle is impossible to solve","The puzzle is possible to solve."],"a":0,"e":"We can use impossible but not possible. The other version is not correct English.","k":"err"},{"id":"a44","n":75,"q":"Which sentence is correct?","o":["I drove all the way without stopping.","I drove all the way without to stop."],"a":0,"e":"We sometimes use a gerund after a preposition. The other version is not correct English.","k":"err"},{"id":"a45","n":78,"q":"Which sentence is correct?","o":["Your driving isn’t advisable. You’re tired.","Your drivings terrify me."],"a":0,"e":"Compare the subject your. ➤73C The other version is not correct English.","k":"err"},{"id":"a46","n":82,"q":"Which sentence is correct?","o":["Having dug a hole, the men went away.","Digging a hole, the men went away."],"a":0,"e":"When the first action is not short, we must use the perfect. The other version is not correct English.","k":"err"},{"id":"a47","n":82,"q":"Which sentence is correct?","o":["Being rather busy, I forgot the time.","feeling well, Emma went to lie down."],"a":0,"e":"A participle clause can express reason. The other version is not correct English.","k":"err"},{"id":"a48","n":86,"q":"Which sentence is correct?","o":["Sam’s dog, Lucy’s idea, people’s jobs","the Sam’s dog"],"a":0,"e":"We use the possessive form for a connection, often the fact that someone has something, or something belongs to them. The other version is not correct English.","k":"err"},{"id":"a49","n":86,"q":"Which sentence is correct?","o":["your dad’s car","the car of your dad"],"a":0,"e":"Sometimes we can use either form. But often only one is possible. The other version is not correct English.","k":"err"},{"id":"a50","n":86,"q":"Which sentence is correct?","o":["the end of the term","the term’s end"],"a":0,"e":"Sometimes we can use either form. But often only one is possible. The other version is not correct English.","k":"err"},{"id":"a51","n":88,"q":"Which sentence is correct?","o":["Water is essential for life.","The water is essential for life."],"a":0,"e":"We can use an uncountable noun on its own. The other version is not correct English.","k":"err"},{"id":"a52","n":88,"q":"Which sentence is correct?","o":["The boat leaves at ten o’clock.","Boat leaves at ten o’clock."],"a":0,"e":"But a singular noun normally has to have a word like a or the. The other version is not correct English.","k":"err"},{"id":"a53","n":89,"q":"Which sentence is correct?","o":["I’ve found out some information.","an information"],"a":0,"e":"It is not always clear from the meaning whether a noun is countable or uncountable. For example, information, news, and furniture are uncountable. The other version is not correct English.","k":"err"},{"id":"a54","n":89,"q":"Which sentence is correct?","o":["There was no news of the missing child.","There were no news."],"a":0,"e":"It is not always clear from the meaning whether a noun is countable or uncountable. For example, information, news, and furniture are uncountable. The other version is not correct English.","k":"err"},{"id":"a55","n":89,"q":"Which sentence is correct?","o":["They had very little furniture.","very few furnitures"],"a":0,"e":"It is not always clear from the meaning whether a noun is countable or uncountable. For example, information, news, and furniture are uncountable. The other version is not correct English.","k":"err"},{"id":"a56","n":93,"q":"Which sentence is correct?","o":["The goods were never delivered.","The good was never delivered."],"a":0,"e":"Some nouns are always plural. The other version is not correct English.","k":"err"},{"id":"a57","n":94,"q":"Which sentence is correct?","o":["There are some scissors in the drawer.","a scissor and not two scissors"],"a":0,"e":"A pair noun is plural and takes a plural verb. The other version is not correct English.","k":"err"},{"id":"a58","n":106,"q":"Which sentence is correct?","o":["Most of the pubs in town serve food.","the most of the pubs"],"a":0,"e":"Referring to a specific group, we use all / most / half / none + of + determiner + noun. The other version is not correct English.","k":"err"},{"id":"a59","n":106,"q":"Which sentence is correct?","o":["None of the rabbits survived, I’m afraid.","All of the rabbits didn’t survive."],"a":0,"e":"None means ‘not any of the group’. The other version is not correct English.","k":"err"},{"id":"a60","n":106,"q":"Which sentence is correct?","o":["None of the rabbits survived, I’m afraid.","all means ‘fewer/less than all’."],"a":0,"e":"None means ‘not any of the group’. The other version is not correct English.","k":"err"},{"id":"a61","n":106,"q":"Which sentence is correct?","o":["Did you watch the whole game?","the all game"],"a":0,"e":"We can use whole as an adjective before a singular noun. The other version is not correct English.","k":"err"},{"id":"a62","n":110,"q":"Which sentence is correct?","o":["Sam could have rung you or me.","I and Elaine"],"a":0,"e":"We can use and or or to combine a pronoun with a noun phrase or another pronoun. The other version is not correct English.","k":"err"},{"id":"a63","n":110,"q":"Which sentence is correct?","o":["Gemma is in my class.","Gemma she’s in my class."],"a":0,"e":"We do not usually use a pronoun together with a noun. The other version is not correct English.","k":"err"},{"id":"a64","n":116,"q":"Which sentence is correct?","o":["The book available at the library is out of stock.","a full of old clothes box"],"a":0,"e":"2. The adjective + prepositional phrase can go directly after the noun. The other version is not correct English.","k":"err"},{"id":"a65","n":117,"q":"Which sentence is correct?","o":["A nice big warm fire","a warm big nice fire"],"a":0,"e":"When two or more adjectives come before a noun, there is often a fixed order. The other version is not correct English.","k":"err"},{"id":"a66","n":121,"q":"Which sentence is correct?","o":["I planned the trip carefully.","I planned carefully the trip."],"a":0,"e":"An adverbial usually follows an object. The other version is not correct English.","k":"err"},{"id":"a67","n":122,"q":"Which sentence is correct?","o":["You play that song all the time.","You all the time play that song."],"a":0,"e":"Most longer phrases do not go in mid position. The other version is not correct English.","k":"err"},{"id":"a68","n":128,"q":"Which sentence is correct?","o":["We received such a warm welcome.","a so warm welcome"],"a":0,"e":"Instead, we use this pattern with such. The other version is not correct English.","k":"err"},{"id":"a69","n":128,"q":"Which sentence is correct?","o":["The film was quite brilliant.","quite means ‘not completely’."],"a":0,"e":"In British English, quite before an ungradable adjective means ‘completely’. The other version is not correct English.","k":"err"},{"id":"a70","n":135,"q":"Which sentence is correct?","o":["We succeeded in moving the piano.","We succeeded in to move the piano."],"a":0,"e":"We can use certain prepositions before a gerund. ▶ 75–76 The other version is not correct English.","k":"err"},{"id":"a71","n":140,"q":"Which sentence is correct?","o":["It rained all day.","for all day"],"a":0,"e":"We do not use for before all + noun. The other version is not correct English.","k":"err"},{"id":"a72","n":141,"q":"Which sentence is correct?","o":["The festival went on for five days.","It went on during five days."],"a":0,"e":"We do not use during + length of time. The other version is not correct English.","k":"err"},{"id":"a73","n":141,"q":"Which sentence is correct?","o":["I’ll be working here till/until next April.","… till/until means that something happens later than expected."],"a":0,"e":"We use till/until to say when something comes to an end. The other version is not correct English.","k":"err"},{"id":"a74","n":142,"q":"Which sentence is correct?","o":["I’ll go in my car.","I’ll go by my car."],"a":0,"e":"But by is not used for a specific vehicle. The other version is not correct English.","k":"err"},{"id":"a75","n":148,"q":"Which sentence is correct?","o":["She knew that she was in trouble.","She knew that she in trouble was"],"a":0,"e":"A sub-clause cannot stand alone. The other version is not correct English.","k":"err"},{"id":"a76","n":150,"q":"Which sentence is correct?","o":["He was both a writer and an actor.","He was a writer and an actor."],"a":0,"e":"With two things, we can use both ... and ... for extra emphasis. The other version is not correct English.","k":"err"},{"id":"a77","n":151,"q":"Which sentence is correct?","o":["He didn’t have a coat on, even though it was freezing.","even although"],"a":0,"e":"We can use the conjunction although, sometimes shortened to though. The other version is not correct English.","k":"err"},{"id":"a78","n":158,"q":"Which sentence is correct?","o":["We would have got lost if we hadn’t bought a map.","We had got lost if we hadn’t bought a map."],"a":0,"e":"We do not use the past simple or past perfect in the main clause. The other version is not correct English.","k":"err"},{"id":"a79","n":158,"q":"Which sentence is correct?","o":["If you’d lent him the money, you would never have got it back.","If you would have lent him the money, you would never have got it back."],"a":0,"e":"And we do not normally use would in the if-clause. The other version is not correct English.","k":"err"},{"id":"a81","n":160,"q":"Which sentence is correct?","o":["If I hadn’t fallen, I would have won.","Unless I had fallen, …"],"a":0,"e":"We do not normally use unless meaning if not in an unreal condition. The other version is not correct English.","k":"err"},{"id":"a82","n":160,"q":"Which sentence is correct?","o":["I’ll be upset if you don’t come.","I’ll be upset unless you come."],"a":0,"e":"And we do not use unless when talking about a feeling caused by something not happening. The other version is not correct English.","k":"err"},{"id":"a83","n":166,"q":"Which sentence is correct?","o":["Josh told us he was going to London.","Josh told he was going to London."],"a":0,"e":"We normally use an indirect object after tell. The other version is not correct English.","k":"err"},{"id":"a84","n":166,"q":"Which sentence is correct?","o":["Josh said he was going to London.","Josh said us he was going to London."],"a":0,"e":"But after say we do not use an indirect object. The other version is not correct English.","k":"err"},{"id":"a86","n":166,"q":"Which sentence is correct?","o":["Laura said she was tired.","Laura talked/spoke she was tired."],"a":0,"e":"Talk and speak are not verbs of reporting. The other version is not correct English.","k":"err"},{"id":"a87","n":171,"q":"Which sentence is correct?","o":["The boy who won got a prize.","the boy who he won"],"a":0,"e":"A relative clause follows a noun phrase. The clause identifies which one, or it adds information. A relative pronoun (e.g. who, which, that) replaces a personal pronoun. The other version is not correct English.","k":"err"},{"id":"a88","n":171,"q":"Which sentence is correct?","o":["The film that we saw was really good.","the film that we saw it"],"a":0,"e":"A relative clause follows a noun phrase. The clause identifies which one, or it adds information. A relative pronoun (e.g. who, which, that) replaces a personal pronoun. The other version is not correct English.","k":"err"},{"id":"a89","n":173,"q":"Which sentence is correct?","o":["I get paid a bit more now, which means I can afford to run a car.","The team lost, what wasn’t surprising."],"a":0,"e":"Which can relate to a whole clause, not just to a noun. The other version is not correct English.","k":"err"},{"id":"a91","n":176,"q":"Which sentence is correct?","o":["We heard water running in the pipes.","We heard running in the pipes water"],"a":0,"e":"A participle clause comes after the noun. The other version is not correct English.","k":"err"}];
const EXTRAS={"1":["A word's class depends on its job in the sentence, not its shape. <i>Book<\/i> is a noun in <i>a good book<\/i> but a verb in <i>book a table<\/i>.","Test for a noun phrase: can you replace the whole thing with <i>it<\/i> or <i>they<\/i>? <i>Some very old books<\/i> → <i>they<\/i>."],"2":["These seven patterns cover almost every English clause. When a sentence feels wrong, check which pattern the verb actually needs.","Intransitive verbs cannot be made passive: you can say <i>the road was crossed<\/i> but not <i>was arrived<\/i>."],"3":["Quick test: if you can insert <i>to<\/i> or <i>for<\/i> before the first object, it is an indirect object.","Long or heavy noun phrases go last. Prefer <i>I gave the tickets to the woman standing by the door<\/i> over the two-object version."],"4":["Performative verbs only work in the present simple. <i>I promised<\/i> reports an act; <i>I promise<\/i> performs it.","In emails, performatives raise the formality sharply — <i>I apologise for the delay<\/i> reads more seriously than <i>sorry for the delay<\/i>."],"5":["Standard English uses one negative per clause. Double negatives (<i>I didn't see nothing<\/i>) are non-standard, though common in dialects and song lyrics.","<i>Few / little<\/i> without <i>a<\/i> are quietly negative and take positive tags: <i>Few people came, did they?<\/i>"],"6":["Fronted-negative inversion is a register signal. It suits formal writing and speeches, and sounds odd in casual conversation.","<i>Not only … but also<\/i> also triggers inversion: <i>Not only did she win, but she also broke the record.<\/i>"],"7":["The imperative has no subject, but you can add one for contrast: <i>You wait here, I'll go in.<\/i>","In written instructions the imperative is standard and not impolite — recipes, manuals and exam papers all use it."],"8":["Politeness in English is carried mainly by sentence length and indirectness, not by a single 'polite' word.","<i>Please<\/i> softens but does not rescue an imperative: <i>Please do it<\/i> is still more abrupt than <i>Could you do it?<\/i>"],"9":["The auxiliary carries the question. If a statement has no auxiliary, <i>do/does/did<\/i> must be supplied.","Rising intonation alone can make a statement a question in speech: <i>You're coming?<\/i> — but avoid this in writing."],"10":["Subject questions keep statement order because nothing needs to move: <i>Who broke it?<\/i> not <i>Who did break it?<\/i>","In formal English <i>whom<\/i> is the object form: <i>To whom did you speak?<\/i> Everyday English uses <i>who<\/i>."],"11":["<i>What<\/i> asks from an open set, <i>which<\/i> from a limited set: <i>What colour?<\/i> vs <i>Which of these two?<\/i>","<i>How<\/i> combines widely: how long, how far, how often, how much, how come."],"12":["Answering a negative question can be ambiguous. <i>Didn't you go? ~ No<\/i> means you did not go — the answer follows the fact, not the question's polarity.","Negative questions often carry emotion: surprise, criticism, or an invitation to agree."],"13":["Short answers repeat the auxiliary, not the whole verb: <i>Have you finished? ~ Yes, I have.<\/i>","A bare <i>yes<\/i> or <i>no<\/i> can sound blunt; the short answer form is friendlier."],"14":["Tag rule: positive statement takes a negative tag, and vice versa. The tag copies the auxiliary and uses a pronoun.","Falling intonation on the tag asks for agreement; rising intonation asks a real question."],"15":["Echo questions check or express surprise: <i>She's moving to Peru. ~ She's moving where?<\/i>","Exclamations use <i>What (a) + noun phrase<\/i> or <i>How + adjective<\/i>: <i>What a mess! How strange!<\/i>"],"16":["Substitution keeps writing tight. <i>So, one, do<\/i> and <i>not<\/i> all stand in for longer stretches already mentioned.","Overusing ellipsis can confuse readers — leave out only what is genuinely recoverable."],"17":["After an auxiliary you can drop everything that repeats: <i>I haven't finished, but she has.<\/i>","This is why the auxiliary matters so much in English — it is the anchor for tags, short answers and ellipsis."],"18":["<i>So<\/i> and <i>neither/nor<\/i> invert; <i>too<\/i> and <i>either<\/i> do not: <i>So do I<\/i> vs <i>I do too.<\/i>","<i>Either<\/i> follows a negative: <i>I don't like it either.<\/i>"],"19":["Verbs taking <i>so<\/i>: think, hope, believe, suppose, expect, guess, imagine.","Two negative patterns exist: <i>I don't think so<\/i> (common) and <i>I think not<\/i> (formal). With <i>hope<\/i>, only <i>I hope not<\/i> works."],"20":["<i>So<\/i> also intensifies (<i>so tired<\/i>), links result (<i>so we left<\/i>), and forms <i>so … that<\/i> clauses.","Compare <i>so<\/i> + adjective with <i>such<\/i> + noun phrase: <i>so cold<\/i> / <i>such a cold day<\/i>."],"21":["End-focus: put the newest, heaviest information last. This single principle explains much English word order.","The passive exists largely to serve end-focus — it lets you choose what starts the sentence."],"22":["Fronting an adverbial adds emphasis or links back to the previous sentence.","Fronted place adverbials with intransitive verbs can invert: <i>On the hill stood a castle.<\/i>"],"23":["<i>There<\/i> introduces existence; the verb agrees with what follows: <i>There is a problem<\/i> / <i>There are problems<\/i>.","In speech <i>there's<\/i> is often used with plurals, but write <i>there are<\/i>."],"24":["Empty <i>it<\/i> covers weather, time, distance and postponed subjects: <i>It's raining. It's five miles. It's clear that…<\/i>","Postponing a long subject with <i>it<\/i> keeps sentences readable: <i>It surprised me that he agreed.<\/i>"],"25":["Cleft sentences (<i>It was X who…<\/i>) and pseudo-clefts (<i>What I need is…<\/i>) both isolate one element for emphasis.","Emphatic <i>do<\/i> works in positive statements: <i>I do like it.<\/i>"],"26":["Also used for narrative and commentary: <i>He passes the ball, shoots, and scores.<\/i>","Watch the -s: it appears only in the third person singular, and is one of the most common errors in writing."],"27":["Beyond 'now', the continuous covers temporary situations, changing states (<i>prices are rising<\/i>) and annoyance with <i>always<\/i>."],"28":["State verbs used in the continuous change meaning: <i>I'm thinking<\/i> (mental activity) vs <i>I think<\/i> (opinion).","<i>See, have, taste<\/i> and <i>feel<\/i> all shift meaning between simple and continuous."],"29":["The past simple needs a finished time frame, even an implied one.","Regular -ed endings have three pronunciations: /t/ (worked), /d/ (played), /ɪd/ (wanted)."],"30":["Three main uses: experience (<i>I've been to Japan<\/i>), recent news (<i>She's just left<\/i>), and unfinished time (<i>I've read two books this week<\/i>).","American English often prefers the past simple where British English uses the present perfect."],"31":["Ask: is the time period finished? Finished → past simple. Still open → present perfect.","<i>I lost my keys<\/i> reports an event; <i>I've lost my keys<\/i> reports a present problem."],"32":["Present perfect: since, for, already, yet, just, ever, never, so far, recently.","Past simple: ago, yesterday, last week, in 2020, then, when."],"33":["The past continuous sets the scene; the past simple moves the story forward.","Also used for polite distancing: <i>I was wondering if you could help.<\/i>"],"34":["The continuous stresses duration and the activity itself; the simple perfect stresses completion and result.","<i>I've painted the room<\/i> (finished) vs <i>I've been painting<\/i> (explains the mess)."],"35":["The past perfect only earns its place when the order of events would otherwise be unclear.","Also used after <i>wish<\/i> and in type 3 conditionals for unreal past."],"36":["State verbs cover senses, emotions, thinking, possession and description.","A verb can be both: <i>The soup tastes good<\/i> (state) / <i>I'm tasting the soup<\/i> (action)."],"37":["The system is built from two contrasts: simple vs continuous (completeness) and perfect vs non-perfect (looking back).","Learning tenses as combinations of these two choices is faster than memorising twelve separate boxes."],"38":["<i>Will<\/i> for instant decisions, offers, promises, refusals and neutral predictions.","<i>Shall<\/i> survives mainly in <i>Shall I…?<\/i> and <i>Shall we…?<\/i> for offers and suggestions."],"39":["<i>Be going to<\/i> covers prior intention and evidence-based prediction.","In speech it often reduces to <i>gonna<\/i> — fine in conversation, not in formal writing."],"40":["Present continuous = personal arrangement; present simple = timetable.","<i>I'm meeting Sam<\/i> implies an agreement already made; <i>I'll meet Sam<\/i> decides it now."],"41":["Rough guide: evidence or plan → <i>going to<\/i>; schedule → present simple; arrangement → present continuous; everything else → <i>will<\/i>."],"42":["<i>Be to<\/i> is formal and common in news headlines. <i>Be about to<\/i> and <i>be on the point of<\/i> mean the very near future.","<i>Be due to<\/i> expresses a scheduled expectation: <i>The train is due to arrive at six.<\/i>"],"43":["The future continuous can be a polite way of asking about plans: <i>Will you be using the car?<\/i>","The future perfect is common with <i>by<\/i>: <i>by then, by next year, by the time we arrive<\/i>."],"44":["<i>Be<\/i> is the only English verb with eight forms, and the only one that inverts and negates without <i>do<\/i>.","<i>Be<\/i> + adjective can describe temporary behaviour: <i>You're being silly.<\/i>"],"45":["<i>Have<\/i> works as a main verb, an auxiliary, and in <i>have something done<\/i>.","British English uses <i>have got<\/i> for possession; American English prefers plain <i>have<\/i>."],"46":["Broad pattern: <i>do<\/i> for activities and unspecified work, <i>make<\/i> for creating and producing.","Learn the collocations as chunks — do homework, do the dishes, make a decision, make progress."],"47":["<i>Have/take/give/make<\/i> + noun spreads meaning across the phrase and often sounds more natural than the plain verb.","<i>Have a look<\/i> feels lighter and briefer than <i>look<\/i>."],"48":["Modals have no -s, no -ing, no infinitive, and cannot follow another modal — use a modal phrase instead: <i>will be able to<\/i>."],"49":["Modal phrases fill the gaps: be able to, have to, be allowed to, be going to, had better, be supposed to.","Because they inflect, they can appear in any tense: <i>I've had to work late.<\/i>"],"50":["<i>Must<\/i> is speaker-driven; <i>have to<\/i> is rule-driven. In the past only <i>had to<\/i> is available.","<i>Must<\/i> also expresses confident deduction — a completely separate meaning."],"51":["This trio is a classic trap: <i>mustn't<\/i> = forbidden, <i>don't have to<\/i> / <i>needn't<\/i> = optional."],"52":["<i>Should<\/i> and <i>ought to<\/i> are close; <i>should<\/i> is far more frequent.","<i>Should have<\/i> + past participle expresses regret or criticism: <i>You should have told me.<\/i>"],"53":["<i>May<\/i> is the most formal for permission; <i>can<\/i> the most everyday.","<i>Be allowed to<\/i> supplies the missing forms: <i>I haven't been allowed to see him.<\/i>"],"54":["Deduction scale: must (certain yes) → should → may/might/could → can't (certain no).","For the past add <i>have<\/i>: <i>She must have left. He can't have known.<\/i>"],"55":["<i>May<\/i> and <i>might<\/i> are near-identical for possibility; <i>might<\/i> is slightly more tentative.","<i>Could<\/i> means possibility here, not ability — context decides."],"56":["<i>Could<\/i> = general past ability. <i>Was able to<\/i> / <i>managed to<\/i> = one specific success.","In the negative both work: <i>couldn't<\/i> and <i>wasn't able to<\/i>."],"57":["<i>Would<\/i> covers polite requests, unreal conditionals, past habits, and reported <i>will<\/i>."],"58":["<i>Used to<\/i> + base form = past habit or state. <i>Be used to<\/i> + -ing = accustomed to.","<i>Dare<\/i> behaves as both a modal and an ordinary verb: <i>How dare you<\/i> / <i>He didn't dare to ask.<\/i>"],"59":["Only verbs with an object can be made passive.","Keep passive chains short — <i>will have been being repaired<\/i> is grammatical but unusable."],"60":["Use the passive when the agent is unknown, obvious, or deliberately hidden, or to keep the topic in subject position.","Academic and technical writing lean on the passive; most style guides urge restraint elsewhere."],"61":["Verbs with two objects give two possible passives; the person is usually the more natural subject.","Reporting passives (<i>It is thought that…<\/i> / <i>He is thought to…<\/i>) are standard in news and research writing."],"62":["<i>Have something done<\/i> = arrange a service. <i>Get something done<\/i> is more informal.","<i>Have<\/i> can also mean an unwanted experience: <i>She had her bag stolen.<\/i>"],"63":["Passive infinitive: <i>to be done<\/i>. Passive gerund: <i>being done<\/i>. Passive perfect: <i>having been done<\/i>."],"64":["The to-infinitive expresses purpose, follows many verbs and adjectives, and can act as a subject.","Split infinitives (<i>to boldly go<\/i>) are acceptable in modern usage when they aid clarity."],"65":["Common patterns: verb + to-infinitive, verb + object + to-infinitive, adjective + to-infinitive, noun + to-infinitive."],"66":["No shortcut here — the choice is fixed by the verb, so learn verbs in groups.","Gerund verbs often involve avoiding, enjoying, finishing; infinitive verbs often involve deciding, hoping, planning."],"67":["Meaning-changing pairs: remember, forget, stop, try, regret, go on, mean.","<i>Try to<\/i> = attempt. <i>Try -ing<\/i> = experiment with a method."],"68":["Pattern: advise, allow, ask, encourage, expect, invite, order, persuade, remind, tell, want + object + to-infinitive.","<i>Suggest<\/i> does not fit this pattern: <i>suggest that we go<\/i>, not <i>suggest me to go<\/i>."],"69":["Two structures: <i>He is easy to please<\/i> (he is the object of please) vs <i>He is eager to please<\/i> (he is the subject)."],"70":["Also used after question words (<i>I don't know what to do<\/i>) and superlatives (<i>the first to arrive<\/i>)."],"71":["<i>Of<\/i> when the adjective judges the person; <i>for<\/i> in all other cases.","<i>It was good of you to come<\/i> (praises you) vs <i>It was good for you to come<\/i> (beneficial)."],"72":["Bare infinitive after modals, <i>make<\/i>, <i>let<\/i>, <i>had better<\/i>, <i>would rather<\/i>, and verbs of perception.","Note the passive shift: <i>make someone do<\/i> → <i>be made to do<\/i>."],"73":["The gerund is a verb acting as a noun — it can take an object and an adverb while still filling a noun slot.","Always use the gerund after a preposition, including <i>to<\/i> when <i>to<\/i> is a preposition: <i>look forward to seeing<\/i>."],"74":["Gerund verbs include admit, avoid, consider, deny, enjoy, finish, imagine, mind, practise, risk, suggest."],"75":["The <i>to<\/i> trap: in <i>used to, look forward to, object to, be committed to<\/i>, the <i>to<\/i> is a preposition, so a gerund follows."],"76":["Fixed combinations: it's no use/good, it's worth, can't help, can't stand, there's no point in, have difficulty (in)."],"77":["<i>For + -ing<\/i> gives a thing's function; <i>to + infinitive<\/i> gives a person's purpose.","<i>A knife for cutting bread<\/i> vs <i>I took a knife to cut the bread.<\/i>"],"78":["A gerund can take a possessive in formal style: <i>I don't mind his leaving early.<\/i> Informally, <i>him leaving<\/i> is common."],"79":["Present participle = active meaning (<i>a running tap<\/i>); past participle = passive (<i>a broken tap<\/i>)."],"80":["Compound participle adjectives are hyphenated before a noun: <i>a well-known writer<\/i>, <i>home-made bread<\/i>."],"81":["Perception verbs: <i>+ bare infinitive<\/i> for a complete action, <i>+ -ing<\/i> for an action in progress.","<i>I saw him cross the road<\/i> (all of it) vs <i>I saw him crossing<\/i> (part of it)."],"82":["Participle clauses compress writing, but the subject must match the main clause or you create a dangling participle.","<i>Walking home, the rain started<\/i> is faulty — the rain was not walking."],"83":["<i>Having done<\/i> shows a completed earlier action. <i>Being done<\/i> is the passive form.","These clauses suit formal writing; in speech a full clause is usually clearer."],"84":["A noun phrase can be a single word or a long structure with determiners, adjectives, and following phrases or clauses."],"85":["Common irregulars: child/children, foot/feet, man/men, mouse/mice, person/people, tooth/teeth.","Some nouns are unchanged: sheep, deer, fish, series, species, aircraft."],"86":["Singular → 's; plural in -s → s'; irregular plural → 's.","With a compound or a phrase, the 's goes at the end: <i>my brother-in-law's car<\/i>."],"87":["The possessive is normal for people, animals, time, organisations and countries: <i>a week's holiday<\/i>, <i>the company's policy<\/i>.","Use <i>of<\/i> for inanimate things: <i>the roof of the house<\/i>."],"88":["Uncountables take singular verbs and cannot follow <i>a/an<\/i> or a number.","Many uncountables can be counted with a partitive: <i>a piece of advice<\/i>, <i>a bit of luck<\/i>."],"89":["High-frequency uncountables to memorise: advice, information, news, furniture, luggage, equipment, homework, research, traffic, weather, work."],"90":["The same noun can shift: countable = a specific instance; uncountable = the substance or general idea.","<i>Two coffees<\/i> is fine in a café — the countable form means 'cups of coffee'."],"91":["The first noun is almost always singular: <i>a shoe shop<\/i>, <i>a five-minute walk<\/i>.","Stress usually falls on the first noun: <i>a BUS stop<\/i>."],"92":["The verb agrees with the head noun, not the nearest word: <i>The box of chocolates is on the table.<\/i>","Quantities and distances take singular verbs: <i>Twenty pounds is too much.<\/i>"],"93":["Nouns always plural: clothes, goods, outskirts, savings, thanks, surroundings.","Nouns that look plural but are singular: news, mathematics, physics, economics, politics."],"94":["Pair nouns take <i>a pair of<\/i> for counting: <i>two pairs of trousers<\/i>.","British English allows a plural verb with group nouns (<i>the team are<\/i>); American English prefers singular."],"95":["Three choices exist, not two: <i>a/an<\/i>, <i>the<\/i>, and no article at all.","Articles are decided by shared knowledge, not by the noun itself."],"96":["First mention → <i>a/an<\/i>; second mention or shared knowledge → <i>the<\/i>.","<i>The<\/i> is also used when something is unique: <i>the sun, the internet, the first time<\/i>."],"97":["<i>The<\/i> with instruments, inventions, superlatives, ordinals and adjectives-as-nouns.","No article with institutions used for purpose: <i>go to school, be in hospital, at church<\/i>."],"98":["Compare four options: <i>a dog<\/i> (one), <i>some dogs<\/i> (a number), <i>the dogs<\/i> (specific), <i>dogs<\/i> (all in general)."],"99":["A singular countable noun needs a determiner, except in fixed phrases: <i>by car, on foot, at home, in bed<\/i>."],"100":["<i>In the morning<\/i>, but <i>on Monday morning<\/i>. <i>At night<\/i>, but <i>in the night<\/i> for a specific one.","No article with months, days, seasons in general use: <i>in July, in summer, on Friday<\/i>."],"101":["Take <i>the<\/i>: rivers, seas, oceans, mountain ranges, plural countries, deserts, hotels, museums.","No <i>the<\/i>: single mountains, lakes, continents, most countries, streets, airports, universities named after a place."],"102":["Possessive determiners (my, your, his) sit before nouns; possessive pronouns (mine, yours, his) stand alone.","<i>Its<\/i> is possessive; <i>it's<\/i> means <i>it is<\/i> or <i>it has<\/i>."],"103":["Demonstratives mark distance in space, time or attitude: <i>this week<\/i> (near), <i>those days<\/i> (distant).","<i>This<\/i> can introduce something new in speech: <i>There was this man…<\/i>"],"104":["Quantifiers split by noun type: countable only (many, few, several), uncountable only (much, little), both (some, any, a lot of, all, most)."],"105":["<i>Much<\/i> is rare in positive statements — use <i>a lot of<\/i>: <i>We have a lot of time<\/i>, not <i>much time<\/i>.","<i>Few/little<\/i> stress scarcity; <i>a few/a little<\/i> stress that some exists."],"106":["<i>All, most, some<\/i> + noun for generalizations; + <i>of the<\/i> + noun for specific groups.","<i>Most people<\/i> (in general) vs <i>most of the people here<\/i> (this group)."],"107":["<i>Both<\/i> = two together, <i>either<\/i> = one of two, <i>neither<\/i> = not one of two.","<i>Every<\/i> looks at the whole group; <i>each<\/i> looks at members one by one."],"108":["Default: <i>some<\/i> in positives, <i>any<\/i> in negatives and questions.","<i>Some<\/i> appears in offers and requests; <i>any<\/i> in positives means 'it doesn't matter which'."],"109":["<i>Enough<\/i> precedes nouns but follows adjectives and adverbs.","<i>Some more, a few more, much more<\/i> — the quantifier comes before <i>more<\/i>."],"110":["Subject forms: I, you, he, she, it, we, they. Object forms: me, you, him, her, it, us, them.","<i>It<\/i> also works as an empty subject with no real meaning."],"111":["Pronouns must have a clear antecedent — ambiguous reference is one of the commonest writing faults.","Singular <i>they<\/i> is now widely accepted for an unknown or non-binary person."],"112":["Reflexive when subject and object are the same; emphatic when it stresses who did it.","<i>By myself<\/i> means alone or unaided."],"113":["<i>One/ones<\/i> replace countable nouns only — never uncountables. Say <i>some<\/i>, not <i>one<\/i>, for uncountables."],"114":["Compound pronouns are singular for agreement but often take <i>they/their<\/i> for reference.","<i>-body<\/i> and <i>-one<\/i> forms are interchangeable; <i>-body<\/i> is slightly more informal."],"115":["Adjectives do not change for number or gender in English: <i>a red car, red cars<\/i>.","Attributive = before the noun; predicative = after a linking verb."],"116":["Attributive-only: main, only, elder, former, sheer. Predicative-only: afraid, alive, alone, asleep, glad, ill.","Some adjectives shift meaning by position: <i>a present situation<\/i> vs <i>the people present<\/i>."],"117":["Order: opinion → size → age → shape → colour → origin → material → purpose → noun.","Native speakers rarely stack more than three; break up long strings with a relative clause."],"118":["-ing describes the source of the feeling; -ed describes the person feeling it.","Saying <i>I am boring<\/i> instead of <i>I am bored<\/i> is a memorable error to avoid."],"119":["<i>The<\/i> + adjective refers to a group and takes a plural verb: <i>The unemployed are…<\/i>","Also used with nationalities: <i>the French, the Dutch, the Japanese<\/i>."],"120":["Adverbials answer how, where, when, how often, and to what degree — and can be single words, phrases or clauses."],"121":["Front position links to what came before or sets a scene; end position is the default and carries most weight."],"122":["Mid position: after <i>be<\/i>, after the first auxiliary, otherwise before the main verb.","This is where frequency adverbs and adverbs like <i>probably, already, just<\/i> live."],"123":["Most adverbs add -ly, but watch: hard/hardly, late/lately, near/nearly and free/freely differ in meaning.","<i>Good<\/i> is an adjective; the adverb is <i>well<\/i> — except <i>feel well<\/i>, meaning healthy."],"124":["Manner adverbials normally follow the verb and its object, never between them."],"125":["When several adverbials end a clause, the usual order is manner, then place, then time."],"126":["Definite frequency (<i>every day, twice a week<\/i>) goes at the end; indefinite frequency (<i>often, rarely<\/i>) goes mid position."],"127":["Gradable adjectives take <i>very, quite, rather<\/i>. Non-gradable ones (<i>perfect, impossible, freezing<\/i>) take <i>absolutely, completely, totally<\/i>."],"128":["<i>Too<\/i> means more than is acceptable; <i>very<\/i> is neutral. <i>Too hot to drink<\/i> is a problem; <i>very hot<\/i> is not.","<i>Quite<\/i> is slippery: with gradable adjectives it softens, with non-gradable ones it means completely."],"129":["Focus adverbials (only, even, also) change meaning by position: <i>Only I saw her<\/i> vs <i>I only saw her<\/i>."],"130":["Comment adverbials give the speaker's view (frankly, luckily); linking adverbials connect ideas (however, therefore, in addition).","Linking adverbials need a full stop or semicolon before them, not a comma."],"131":["One syllable → -er/-est. Three or more → more/most. Two syllables can go either way; -y, -ly, -ow and -er usually take -er."],"132":["Irregulars: good/better/best, bad/worse/worst, far/further/furthest, little/less/least, many/more/most.","<i>Older/oldest<\/i> for anything; <i>elder/eldest<\/i> only for family members, before the noun."],"133":["Adverbs ending in -ly take more/most. Short adverbs (fast, hard, soon, early) take -er/-est.","Quantifiers compare too: more, most, less, least, fewer, fewest."],"134":["<i>Than<\/i> after comparatives; <i>as … as<\/i> for equality; <i>not as/so … as<\/i> for the negative.","Double comparatives show parallel change: <i>The more I read, the less I understand.<\/i>"],"135":["A preposition is always followed by a noun phrase, pronoun or gerund — never a bare infinitive.","Ending a sentence with a preposition is entirely acceptable English."],"136":["Position vs movement: <i>in<\/i> vs <i>into<\/i>, <i>on<\/i> vs <i>onto<\/i>, <i>at<\/i> vs <i>to<\/i>."],"137":["Think in dimensions: <i>at<\/i> = a point, <i>on<\/i> = a surface or line, <i>in<\/i> = an enclosed space or area.","<i>In the corner<\/i> of a room, but <i>at the corner<\/i> of a street."],"138":["<i>Across<\/i> = surface, <i>through<\/i> = inside something, <i>along<\/i> = following a line, <i>over<\/i> = above or covering."],"139":["<i>At<\/i> for clock times and festivals; <i>on<\/i> for days and dates; <i>in<\/i> for months, seasons, years and parts of the day.","No preposition before <i>next, last, this, every<\/i>: <i>I'll see you next week.<\/i>"],"140":["<i>For<\/i> + duration, <i>since<\/i> + starting point, <i>ago<\/i> after a period and with the past simple.","<i>Since<\/i> pairs with the perfect; <i>ago<\/i> pairs with the past simple."],"141":["<i>By<\/i> = not later than. <i>Until<\/i> = up to that point. <i>During<\/i> + noun; <i>while<\/i> + clause.","<i>In two hours<\/i> means after two hours have passed; <i>within two hours<\/i> means before they do."],"142":["Prepositions also mark means (<i>by train<\/i>), agent (<i>by Dickens<\/i>), instrument (<i>with a knife<\/i>), and topic (<i>about money<\/i>)."],"143":["Phrasal verbs take adverb particles and can separate; prepositional verbs cannot.","Test: if you can put a pronoun before the particle (<i>turn it off<\/i>), it is phrasal."],"144":["Meanings are usually idiomatic and often have several senses — learn them in context, not in lists.","Phrasal verbs dominate speech; a single-word equivalent usually sounds more formal."],"145":["The preposition binds tightly to the verb: <i>look after, deal with, rely on, apply for, cope with<\/i>."],"146":["Some verbs take an object plus a preposition: <i>remind someone of, accuse someone of, congratulate someone on<\/i>."],"147":["These combinations are arbitrary and must be learned: interested in, good at, afraid of, proud of, reason for, solution to."],"148":["A sentence needs at least one main clause. Subordinate clauses attach with a conjunction, relative pronoun or participle."],"149":["What follows the verb depends on the verb: nothing, an object, a complement, an adverbial, or a clause."],"150":["<i>And<\/i> adds, <i>or<\/i> gives alternatives, <i>both … and<\/i> / <i>either … or<\/i> / <i>neither … nor<\/i> pair items.","Keep paired structures parallel: <i>either by bus or by train<\/i>, not or complement. They begin with <i>that<\/i>, a wh-word, or <i>if/whether<\/i>.","<i>That<\/i> can often be dropped after common verbs: <i>I think (that) he's right.<\/i>"],"164":["Nominalization compresses information and raises formality, but overuse makes writing abstract and heavy.","<i>We decided<\/i> → <i>our decision<\/i>; useful in reports, deadening in narrative."],"165":["Indirect speech reports meaning rather than exact words, so no quotation marks are used."],"166":["<i>Say<\/i> takes no indirect object; <i>tell<\/i> requires one. <i>Ask<\/i> takes an object directly."],"167":["Shifts: this → that, here → there, now → then, today → that day, ago → before, tomorrow → the next day."],"168":["Backshift: present → past, past → past perfect, will → would, can → could, may → might.","Must, should, would, could and might usually stay unchanged."],"169":["Reported questions use statement order, drop <i>do<\/i>, and take <i>if/whether<\/i> for yes/no questions."],"170":["Orders and requests: <i>tell/ask someone to do<\/i>. Offers and suggestions: <i>offer to do<\/i>, <i>suggest doing<\/i> or <i>suggest that…<\/i>"],"171":["Defining clauses identify which one and take no commas; non-defining clauses add extra detail and take commas."],"172":["The relative pronoun can be omitted only when it is the object of the clause.","<i>That<\/i> is common in defining clauses, especially in speech."],"173":["Non-defining clauses cannot use <i>that<\/i> and cannot omit the pronoun.","<i>Which<\/i> can refer back to a whole clause: <i>He was late, which annoyed everyone.<\/i>"],"174":["<i>Whose<\/i> works for people and things: <i>a house whose roof leaks<\/i>.","<i>What<\/i> means 'the thing that' and never follows a noun."],"175":["<i>Where, when, why<\/i> replace a preposition + <i>which<\/i>: <i>the day when<\/i> = <i>the day on which<\/i>."],"176":["Reduced clauses: <i>the man standing there<\/i> (active), <i>the letter sent yesterday<\/i> (passive), <i>the first person to arrive<\/i> (infinitive)."],"177":["-s endings follow the same spelling rules as plurals. Add -es after s, sh, ch, x, z; change consonant + y to -ies.","-ed and -ing follow the doubling and silent-e rules in topic 178."],"178":["Drop silent -e before -ing and -ed. Double a final consonant after a single stressed vowel.","British English also doubles final -l in unstressed syllables: <i>travelling, cancelled<\/i>."],"179":["Weak forms make English rhythm stress-timed; content words are stressed and function words are reduced.","Recognising weak forms is essential for listening, even though you need not use them yourself."],"180":["Short forms are standard in speech and informal writing, and best avoided in formal writing.","<i>'s<\/i> can be <i>is<\/i> or <i>has<\/i>; <i>'d<\/i> can be <i>would<\/i> or <i>had<\/i> — the following verb form tells you which."]};
const STYLES=[["k",false,false],["b",false,false],["k",true,false],["k",false,true],["b",false,true],["r",false,true],["k",true,true],["b",true,true],["r",false,false],["r",true,false],["b",true,false],["r",true,true],["p",false,false],["p",false,true],["p",true,false]];
/* ============================ storage ============================ */
const KEY = 'pocketgrammar.v1';
const Store = {
  mode: 'memory', mem: null,
  async init(){
    try{
      if (window.storage && window.storage.get){
        this.mode = 'cloud';
        try{ const r = await window.storage.get(KEY); return r ? JSON.parse(r.value) : null; }
        catch(e){ return null; }
      }
    }catch(e){}
    try{
      localStorage.setItem('__t','1'); localStorage.removeItem('__t');
      this.mode = 'local';
      const v = localStorage.getItem(KEY);
      return v ? JSON.parse(v) : null;
    }catch(e){ this.mode = 'memory'; return null; }
  },
  async save(obj){
    const s = JSON.stringify(obj);
    try{
      if (this.mode === 'cloud'){ await window.storage.set(KEY, s); return true; }
      if (this.mode === 'local'){ localStorage.setItem(KEY, s); return true; }
    }catch(e){ return false; }
    this.mem = s; return false;
  }
};

/* ============================ state ============================ */
const DAY = 864e5;
const todayNum = () => Math.floor((Date.now() - new Date().getTimezoneOffset()*6e4) / DAY);
const dayStr = n => new Date(n*DAY).toISOString().slice(0,10);

let S = {
  q:{},            // qid -> {b:box, d:due day, c:right, w:wrong}
  days:{},         // "YYYY-MM-DD" -> {a:answered, c:correct}
  read:{},         // topic n -> 1 when opened
  size:10,
  units:[],        // selected unit names, [] = all
  gen:0,           // generated-question counter (for stable ids)
  edits:{},        // "<topic>|<section>" -> user-edited blocks
  editsAt:{},      // "<topic>|<section>" -> time of last edit or restore (for sync)
  last:null
};

let saveTimer = null;
function persist(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const ok = await Store.save(S);
    if (typeof Sync !== 'undefined' && Sync.on()){ Sync.schedule(); return; }
    const el = document.getElementById('savenote');
    if (el) el.textContent = ok ? '180 topics · progress saved'
                                : '180 topics · progress not saved in this preview';
  }, 250);
}

/* ============================ data prep ============================ */
const T = {};                       // topic number -> topic
const UNITS = [];                   // ordered unit names
const UNIT_TOPICS = {};
TOPICS.forEach(t => {
  T[t.n] = t;
  if (!UNIT_TOPICS[t.u]){ UNIT_TOPICS[t.u] = []; UNITS.push(t.u); }
  UNIT_TOPICS[t.u].push(t.n);
});

// example sentences usable for cloze questions
/* ============================ helpers ============================ */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// content may carry a little inline markup we wrote ourselves (<i>, <b>)
const rich = s => esc(s).replace(/&lt;(\/?)(i|b)&gt;/g, '<$1$2>');

function shuffle(a, rnd){
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor((rnd ? rnd() : Math.random()) * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const strip = w => w.toLowerCase().replace(/^[^a-z']+|[^a-z']+$/g, '');

/* ============================ session building ============================ */
function allowedSet(){
  if (!S.units.length) return null;
  const set = {};
  S.units.forEach(u => (UNIT_TOPICS[u] || []).forEach(n => { set[n] = 1; }));
  return set;
}

function bankPool(){
  const allow = allowedSet();
  return BANK.filter(q => !allow || allow[q.n]);
}

// returns {fresh:[], due:[], done:bool}
function poolStatus(){
  const pool = bankPool();
  const today = todayNum();
  const fresh = pool.filter(q => !S.q[q.id]);
  const due = pool.filter(q => S.q[q.id] && S.q[q.id].d <= today);
  return { pool, fresh, due, done: fresh.length === 0 };
}

function buildSession(size, forceGenerate){
  const { fresh, due } = poolStatus();
  const allow = allowedSet();
  let out = [];
  if (forceGenerate){
    out = generate(size, allow);
    if (out.length < size) out = out.concat(shuffle(due).slice(0, size - out.length));
  } else {
    const wrongFirst = shuffle(due).sort((a, b) => (S.q[a.id].d - S.q[b.id].d));
    out = wrongFirst.slice(0, Math.ceil(size * 0.4));
    out = out.concat(shuffle(fresh).slice(0, size - out.length));
    if (out.length < size) out = out.concat(shuffle(due.filter(q => !out.includes(q))).slice(0, size - out.length));
    if (out.length < size) out = out.concat(generate(size - out.length, allow));
  }
  return shuffle(out).slice(0, size).map(q => ({
    ...q,
    _order: shuffle(q.o.map((text, i) => ({ text, correct: i === q.a })))
  }));
}

/* ============================ scoring ============================ */
const BOX_DAYS = [1, 2, 4, 8, 16, 32];
function record(q, correct){
  const today = todayNum();
  const st = S.q[q.id] || { b: 0, d: today, c: 0, w: 0 };
  if (correct){ st.c++; st.b = Math.min(5, st.b + 1); st.d = today + BOX_DAYS[st.b]; }
  else { st.w++; st.b = 0; st.d = today; }
  if (q.k !== 'gen') S.q[q.id] = st;      // generated items aren't tracked individually
  const d = dayStr(today);
  S.days[d] = S.days[d] || { a: 0, c: 0 };
  S.days[d].a++; if (correct) S.days[d].c++;
  persist();
}

function streak(){
  let n = 0, d = todayNum();
  if (!S.days[dayStr(d)]) d--;             // today not started yet is fine
  while (S.days[dayStr(d)]){ n++; d--; }
  return n;
}

function unitStats(){
  return UNITS.map(u => {
    const tops = new Set(UNIT_TOPICS[u]);
    const qs = BANK.filter(q => tops.has(q.n));
    let seen = 0, mastered = 0, right = 0, total = 0;
    qs.forEach(q => {
      const st = S.q[q.id];
      if (!st) return;
      seen++; right += st.c; total += st.c + st.w;
      if (st.b >= 3) mastered++;
    });
    const readCount = UNIT_TOPICS[u].filter(n => S.read[n]).length;
    return { u, qs: qs.length, seen, mastered, right, total,
             topics: UNIT_TOPICS[u].length, read: readCount };
  });
}

/* ============================ section editing ============================ */
// Edits are stored per topic+section in S.edits, keyed "<topic>|<sectionIndex>".

function stripMarks(s){
  return String(s).replace(/\u000e./g, '').replace(/[\u0001-\u0007\u000f-\u0011]/g, '');
}

// blocks -> editable plain text
function mergeRuns(x){
  return String(x).replace(/\u000f\u000e(.)/g, (m, c) => '\u0000' + c)
    .replace(/\u000e(.)([^\u000e\u000f\u0000]*)((?:\u0000(.)[^\u000e\u000f\u0000]*)*)\u000f/g,
      (m) => m)
    .replace(/\u0000(.)/g, (m, c) => '\u000f\u000e' + c);
}

function toMarkup(blocks){
  // `implicitItalic` is true for examples, where italic is the default
  const md = (x, implicitItalic) => String(x)
    .replace(/\u0001([^\u0001\u0002]*)\u0002/g, '$1')
    .replace(/\u000e(.)([^\u000e\u000f]*)\u000f/g, (m, c, body) => {
      const st = STYLES[c.charCodeAt(0) - 65] || ['k', false, false];
      return wrap(body, st[1], st[2] && !implicitItalic, st[0] === 'r');
    })
    .replace(/\u0004([^\u0004\u0005]*)\u0005/g, (m, b) => wrap(b, true, false, false))
    .replace(/\u0006([^\u0006\u0007]*)\u0007/g, (m, b) => wrap(b, false, !implicitItalic, false))
    .replace(/\u0010([^\u0010\u0011]*)\u0011/g, (m, b) => wrap(b, false, false, true))
    .replace(/[\u0003\u000f]/g, '')
;

  // keep whitespace outside the markers so the text stays readable
  function wrap(body, bold, ital, red){
    const m = /^(\s*)([\s\S]*?)(\s*)$/.exec(body);
    let t = m[2];
    if (!t) return body;
    if (red)  t = '{' + t + '}';
    if (ital) t = '*' + t + '*';
    if (bold) t = '**' + t + '**';
    return m[1] + t + m[3];
  }

  const lines = [];
  blocks.forEach(b => {
    if (b.t === 'table'){
      b.rows.forEach(r => lines.push('| ' + r.map(c => md(c, false).replace(/\n/g, ' ')).join(' | ')));
      lines.push('');
      return;
    }
    const soft = b.t === 'eg' || b.t === 'wrong';
    const body = md(b.x, soft) + (b.note ? ' (' + b.note + ')' : '');
    if (b.t === 'sub')        lines.push('# ' + body);
    else if (b.t === 'eg')    lines.push('> ' + body);
    else if (b.t === 'wrong') lines.push('! ' + body);
    else if (b.t === 'tip')   lines.push('~ ' + body);
    else                      lines.push(body);
  });
  return lines.join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

// editable plain text -> blocks
function fromMarkup(text){
  const inline = s => s
    .replace(/\{([^{}]+)\}/g, '\u0010$1\u0011')
    .replace(/\*\*([^*]+)\*\*/g, '\u0004$1\u0005')
    .replace(/\*([^*]+)\*/g, '\u0006$1\u0007');
  const out = [];
  let table = null;
  const flush = () => {
    if (table && table.length){
      const w = Math.max(...table.map(r => r.length));
      out.push({ t: 'table', rows: table.map(r => r.concat(Array(w - r.length).fill(''))) });
    }
    table = null;
  };
  text.split('\n').forEach(raw => {
    const line = raw.trim();
    if (!line){ flush(); return; }
    if (line.startsWith('|')){
      table = table || [];
      table.push(line.replace(/^\|/, '').replace(/\|\s*$/, '')
        .split('|').map(c => inline(c.trim())));
      return;
    }
    flush();
    const m = /^([#>!~])\s*(.*)$/.exec(line);
    if (m){
      const kind = { '#': 'sub', '>': 'eg', '!': 'wrong', '~': 'tip' }[m[1]];
      if (m[2]) out.push({ t: kind, x: inline(m[2]) });
    } else {
      out.push({ t: 'rule', x: inline(line) });
    }
  });
  flush();
  return out;
}

// the sections actually shown: originals unless the user has edited them
function effSecs(n){
  return T[n].s.map((sec, i) => {
    const e = S.edits && S.edits[n + '|' + i];
    return e ? { l: sec.l, b: e, edited: true } : sec;
  });
}

/* -------- keep search and the question pools in step with edits -------- */
function indexTopic(t){
  const parts = [t.t];
  effSecs(t.n).forEach(sec => sec.b.forEach(b => {
    if (b.t === 'table') b.rows.forEach(r => parts.push(r.map(stripMarks).join(' ')));
    else parts.push(stripMarks(b.x));
  }));
  (EXTRAS[t.n] || []).forEach(x => parts.push(x));
  t._txt = parts.join(' \u00b7 ');
  t._low = t._txt.toLowerCase();
}

function rebuildPools(){
  buildSections();
}

function saveEdit(n, idx, text){
  const blocks = fromMarkup(text);
  S.edits = S.edits || {};
  S.editsAt = S.editsAt || {};
  if (!blocks.length){ delete S.edits[n + '|' + idx]; }
  else { S.edits[n + '|' + idx] = blocks; }
  S.editsAt[n + '|' + idx] = Date.now();
  persist();
  indexTopic(T[n]);
  rebuildPools();
}

function resetEdit(n, idx){
  if (S.edits) delete S.edits[n + '|' + idx];
  S.editsAt = S.editsAt || {};
  S.editsAt[n + '|' + idx] = Date.now();
  persist();
  indexTopic(T[n]);
  rebuildPools();
}
