<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Grammar — study &amp; practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14212b;
  --ink-2:#3d525f;
  --muted:#6b7c85;
  --paper:#ffffff;
  --surface:#eef1f0;
  --surface-2:#f7f8f8;
  --rule:#d3dad8;
  --rule-soft:#e4e9e7;
  --right:#16674f;
  --right-bg:#e8f2ee;
  --eg:#12508f;
  --eg-rule:#9cbfe2;
  --wrong:#a32a28;
  --wrong-bg:#f8eae9;
  --focus:#1a5fb4;
  --serif:'Spectral',Georgia,'Times New Roman',serif;
  --sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --shell:1180px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--surface);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.25}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
a{color:var(--focus)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- masthead ---------- */
.masthead{
  background:var(--ink);color:#eef1f0;
  border-bottom:3px solid var(--right);
}
.masthead-in{
  max-width:var(--shell);margin:0 auto;padding:14px 20px 0;
  display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;
}
.brand{font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:-.01em}
.brand span{color:#8fb9ab;font-weight:400}
.brand-sub{font-size:12.5px;color:#93a7ae;margin-left:auto}
nav.tabs{max-width:var(--shell);margin:0 auto;padding:10px 20px 0;display:flex;gap:2px;overflow-x:auto}
nav.tabs button{
  background:none;border:0;border-bottom:3px solid transparent;
  color:#a7bcc4;padding:9px 15px 10px;font-weight:500;white-space:nowrap;
  margin-bottom:-3px;
}
nav.tabs button:hover{color:#fff}
nav.tabs button[aria-current="true"]{color:#fff;border-bottom-color:var(--right)}

/* ---------- shell ---------- */
main{max-width:var(--shell);margin:0 auto;padding:26px 20px 90px}
.panel{background:var(--paper);border:1px solid var(--rule);border-radius:4px}
.pad{padding:22px}
.stack>*+*{margin-top:16px}
.lede{color:var(--ink-2);max-width:64ch}
.eyebrow{font-size:12.5px;color:var(--muted);letter-spacing:.02em}

/* ---------- buttons ---------- */
.btn{
  background:var(--ink);color:#fff;border:1px solid var(--ink);
  padding:10px 18px;border-radius:3px;font-weight:500;
}
.btn:hover{background:#0b1720}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--ink-2)}
.btn.go{background:var(--right);border-color:var(--right)}
.btn.go:hover{background:#0f5540}
.btn.sm{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:10px}

/* ---------- today ---------- */
.today{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}
.hero{padding:26px 26px 24px}
.hero h1{font-family:var(--serif);font-size:31px;letter-spacing:-.015em}
.streak{
  display:flex;align-items:baseline;gap:10px;margin:18px 0 4px;
  font-family:var(--serif);
}
.streak b{font-size:52px;line-height:1;font-weight:600}
.streak span{color:var(--muted);font-family:var(--sans);font-size:14px}
.dots{display:flex;gap:5px;margin:14px 0 20px}
.dot{width:26px;height:26px;border-radius:3px;background:var(--surface);border:1px solid var(--rule-soft);
  display:grid;place-items:center;font-size:11px;color:var(--muted)}
.dot.on{background:var(--right);border-color:var(--right);color:#fff}
.dot.today{outline:2px solid var(--ink);outline-offset:1px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule-soft);border-top:1px solid var(--rule-soft)}
.mini div{background:var(--paper);padding:15px 18px}
.mini b{display:block;font-family:var(--serif);font-size:25px;font-weight:600}
.mini small{color:var(--muted);font-size:12.5px}
.bar{height:7px;background:var(--surface);border-radius:99px;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:var(--right)}

.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.ucard{display:block;text-align:left;background:var(--paper);border:1px solid var(--rule);
  border-radius:3px;padding:13px 15px}
.ucard:hover{border-color:var(--ink-2);background:var(--surface-2)}
.ucard .un{display:block;font-size:14.5px;font-weight:500;line-height:1.3}
.ucard .uc{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.ucard .bar{display:block}

/* ---------- reference ---------- */
.ref{display:grid;grid-template-columns:288px 1fr;gap:18px;align-items:start}
.side{position:sticky;top:14px;max-height:calc(100vh - 30px);overflow:auto}
.search{width:100%;padding:11px 13px;border:1px solid var(--rule);border-radius:3px;
  font-family:inherit;font-size:15px;background:var(--paper)}
.unit{border-top:1px solid var(--rule-soft)}
.unit>button{
  width:100%;text-align:left;background:none;border:0;padding:11px 14px;
  display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:500;font-size:14.5px;
}
.unit>button:hover{background:var(--surface-2)}
.unit>button i{font-style:normal;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.tlist{list-style:none;margin:0;padding:0 0 8px}
.tlist button{
  width:100%;text-align:left;background:none;border:0;padding:6px 14px 6px 22px;
  font-size:14px;color:var(--ink-2);display:flex;gap:9px;
}
.tlist button:hover{background:var(--surface-2);color:var(--ink)}
.tlist button[aria-current="true"]{background:var(--right-bg);color:var(--ink);font-weight:500;
  box-shadow:inset 3px 0 0 var(--right)}
.tlist em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;min-width:26px}

.topic{padding:30px 34px 40px}
.topic-head{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:22px}
.topic-head .eyebrow{margin-bottom:5px}
.topic-head h2{font-family:var(--serif);font-size:29px;letter-spacing:-.015em}
.sec{margin:26px 0}
.sec-label{
  float:left;width:30px;font-family:var(--serif);font-size:18px;font-weight:600;
  color:var(--right);padding-top:1px;
}
.sec-body{margin-left:30px}
.sec.nolabel .sec-body{margin-left:0}
.rule{margin:9px 0;max-width:70ch;color:var(--ink)}
.sub{font-family:var(--serif);font-size:19px;font-weight:600;margin:20px 0 8px}
.eg,.bad{
  font-family:var(--serif);font-size:17px;line-height:1.45;
  margin:5px 0;padding:5px 0 5px 14px;max-width:70ch;
}
.eg{border-left:3px solid var(--eg-rule);color:var(--eg)}
.bad{border-left:3px solid var(--wrong);color:#5a2422;background:var(--wrong-bg)}
.bad::before{content:"not ";color:var(--wrong);font-family:var(--sans);font-size:12px;
  text-transform:uppercase;letter-spacing:.06em;font-weight:600;vertical-align:1px}
b.term{
  font-weight:600;font-family:var(--serif);font-size:1.05em;
  background:#fcefc4;border-bottom:2px solid #e0b449;
  padding:0 4px 1px;border-radius:3px;cursor:pointer;
  white-space:nowrap;
}
b.term:hover{background:#f8e29a;border-bottom-color:#c9962a}
.tip b.term{font-size:1.02em}
a.xref{
  color:inherit;text-decoration:underline;text-decoration-color:var(--right);
  text-decoration-thickness:1.5px;text-underline-offset:2.5px;
  cursor:pointer;font-variant-numeric:tabular-nums;
}
a.xref:hover{background:var(--right-bg);text-decoration-thickness:2px}
.eg b.key,.bad b.key,td.egcell b.key{font-weight:700;color:inherit}
.eg,.bad,td.egcell{font-style:italic}
.rule i.em,.tip i.em,.sub i.em{font-style:italic;color:inherit}
.emr{color:var(--wrong)}
.eg.pdf,.bad.pdf,.rule.pdf{color:var(--ink);font-style:normal}
/* where the notebook already colours a word, don't add a highlight on top */
.pdf b.term{background:none;border:0;padding:0;font-weight:inherit;font-style:inherit;
  font-family:inherit;font-size:inherit;color:inherit}
.pdf b.term:hover{background:#fcefc4;border-radius:2px}
.bad.pdf{background:none;border-left-color:var(--wrong)}
.bad.pdf::before{content:none}
b.term{font-style:italic}
.gloss{color:var(--muted);font-family:var(--sans);font-size:13.5px;font-style:normal}
.tip{background:var(--surface-2);border:1px solid var(--rule-soft);border-left:3px solid var(--ink);
  padding:14px 16px;margin:18px 0;font-size:15px;max-width:74ch}
.tip b{font-size:12px;letter-spacing:.06em;color:var(--muted);display:block;margin-bottom:4px}
.twrap{overflow-x:auto;margin:14px 0;-webkit-overflow-scrolling:touch}
table.gt{border-collapse:collapse;font-size:14.5px;width:100%;min-width:min(100%,420px)}
table.gt td,table.gt th{border:1px solid var(--rule-soft);padding:7px 10px;vertical-align:top;text-align:left}
table.gt th{background:var(--surface-2);font-weight:500;font-size:13px;color:var(--ink-2)}
table.gt tbody tr:nth-child(even){background:#fbfcfc}
table.gt td.egcell{color:var(--eg);font-family:var(--serif);font-size:15.5px;line-height:1.4}
table.gt td:first-child{white-space:nowrap}
table.gt.wide td:first-child{white-space:normal}
.extra{background:#f4f7f6;border:1px solid var(--rule-soft);border-radius:4px;padding:18px 20px;margin-top:30px}
.extra h3{font-size:15px;margin-bottom:9px}
.extra ul{margin:0;padding-left:19px}
.extra li{margin:7px 0;max-width:70ch}
.sec{position:relative}
.sec-edit{
  float:right;margin:0 0 2px 14px;background:none;border:1px solid var(--rule);
  color:var(--muted);font-size:11.5px;padding:2px 9px;border-radius:99px;opacity:.5;
}
.sec-edit:hover{opacity:1;color:var(--ink);border-color:var(--ink-2);background:var(--surface-2)}
.editor{border:1px solid var(--ink-2);border-radius:4px;padding:14px;background:var(--surface-2)}
.ed-bar{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.editor textarea{
  width:100%;min-height:260px;resize:vertical;padding:12px;border:1px solid var(--rule);
  border-radius:3px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:13.5px;line-height:1.65;background:var(--paper);color:var(--ink);
}
.ed-help{display:flex;flex-wrap:wrap;gap:4px 14px;margin:10px 0 12px;font-size:12px;color:var(--muted)}
.ed-help code{background:var(--paper);border:1px solid var(--rule-soft);border-radius:2px;
  padding:1px 5px;font-size:11.5px;color:var(--ink)}
details.setup{border:1px solid var(--rule-soft);border-radius:3px;padding:10px 14px;background:var(--surface-2)}
details.setup summary{cursor:pointer;font-weight:500;font-size:14.5px}
details.setup ol{margin:10px 0 2px;padding-left:20px;font-size:14px;color:var(--ink-2)}
details.setup li{margin:6px 0}
details.setup code{background:var(--paper);border:1px solid var(--rule-soft);border-radius:2px;padding:0 4px;font-size:12.5px}
.sync-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.sync-form label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
.sync-form input{padding:9px 11px;border:1px solid var(--rule);border-radius:3px;
  font-size:16px;font-family:inherit;color:var(--ink);background:var(--paper)}
.topic-foot{display:flex;justify-content:space-between;gap:12px;margin-top:32px;
  border-top:1px solid var(--rule-soft);padding-top:16px}

/* search results */
.hit{padding:12px 14px;border-bottom:1px solid var(--rule-soft);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.hit:hover{background:var(--surface-2)}
.hit b{display:block;font-size:15px}
.hit small{color:var(--muted)}
mark{background:#fdf2c4;color:inherit;padding:0 1px}

/* ---------- practice ---------- */
.quiz{max-width:760px;margin:0 auto}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:12px 18px;border-bottom:1px solid var(--rule-soft);font-size:13.5px;color:var(--muted)}
.qbar{height:4px;background:var(--surface);}
.qbar i{display:block;height:100%;background:var(--ink);transition:width .25s}
.qbody{padding:26px 28px}
.qtopic{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.qtext{font-family:var(--serif);font-size:21px;line-height:1.4;margin-bottom:20px}
.qtext i{font-style:italic}
.opts{display:grid;gap:9px}
.opt{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  padding:13px 15px;border:1px solid var(--rule);border-radius:3px;background:var(--paper);
  font-family:var(--serif);font-size:16.5px;line-height:1.4;
}
.opt:hover:not(:disabled){border-color:var(--ink-2);background:var(--surface-2)}
.opt kbd{
  font-family:var(--sans);font-size:12px;font-weight:600;background:var(--surface);
  border:1px solid var(--rule-soft);border-radius:3px;padding:2px 7px;color:var(--muted);flex:none;margin-top:1px
}
.opt.right{border-color:var(--right);background:var(--right-bg)}
.opt.right kbd{background:var(--right);color:#fff;border-color:var(--right)}
.opt.wrong{border-color:var(--wrong);background:var(--wrong-bg)}
.opt.wrong kbd{background:var(--wrong);color:#fff;border-color:var(--wrong)}
.opt:disabled{cursor:default}
.verdict{margin-top:20px;padding:16px 18px;border-radius:3px;font-size:15px;border:1px solid}
.verdict.ok{background:var(--right-bg);border-color:#bcd9cf}
.verdict.no{background:var(--wrong-bg);border-color:#e8c6c4}
.verdict b{display:block;margin-bottom:5px}
.verdict a{font-size:13.5px}
.qfoot{display:flex;justify-content:space-between;gap:12px;padding:16px 28px 22px;align-items:center}

/* results */
.score{text-align:center;padding:34px 26px 26px}
.score .n{font-family:var(--serif);font-size:56px;font-weight:600;line-height:1}
.score p{color:var(--ink-2);margin:8px 0 0}
.rev{border-top:1px solid var(--rule-soft);padding:16px 22px}
.rev .q{font-family:var(--serif);font-size:16.5px;margin-bottom:7px}
.rev .a{font-size:14px;margin:3px 0}
.rev .a.you{color:var(--wrong)}
.rev .a.sol{color:var(--right)}
.rev .why{font-size:14px;color:var(--ink-2);margin-top:7px;padding-left:12px;border-left:2px solid var(--rule)}
.flag{width:8px;height:8px;border-radius:99px;display:inline-block;margin-right:7px;vertical-align:1px}
.flag.ok{background:var(--right)}.flag.no{background:var(--wrong)}

/* setup */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.chip{border:1px solid var(--rule);background:var(--paper);border-radius:99px;padding:6px 13px;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.banner{background:var(--right-bg);border:1px solid #bcd9cf;border-left:3px solid var(--right);
  padding:15px 18px;border-radius:3px;margin-bottom:18px}
.banner b{display:block;margin-bottom:3px}

/* progress */
.ptable{width:100%;border-collapse:collapse;font-size:14.5px}
.ptable th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;
  border-bottom:1px solid var(--rule);padding:0 10px 8px}
.ptable td{border-bottom:1px solid var(--rule-soft);padding:10px}
.ptable td:first-child{font-weight:500}
.ptable .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pbar{height:6px;background:var(--surface);border-radius:99px;overflow:hidden;min-width:90px}
.pbar i{display:block;height:100%;background:var(--right)}
.empty{padding:44px 24px;text-align:center;color:var(--muted)}
.empty p{max-width:44ch;margin:0 auto 16px}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:11px 20px;border-radius:3px;font-size:14px;z-index:50}

@media(max-width:920px){
  /* iOS zooms the page in when a focused field is under 16px */
  .editor textarea,.search,input,textarea,select{font-size:16px}
  .editor textarea{line-height:1.55}
  .topic{padding:20px 15px 28px}
  .sec-body{margin-left:24px}
  .sec-label{width:24px}
  .today{grid-template-columns:1fr}
  .ref{grid-template-columns:1fr}
  .side{position:static;max-height:none}
  .sidewrap{display:none}
  .sidewrap.open{display:block}
  .topic{padding:22px 18px 30px}
  .qbody{padding:20px 18px}
  .qfoot{padding:14px 18px 20px}
  .hero{padding:22px 20px}
  .hero h1{font-size:26px}
}
.mobbar{display:none}
@media(max-width:920px){.mobbar{display:flex;gap:10px;margin-bottom:14px}}
</style>
</head>
<body>
<header class="masthead">
  <div class="masthead-in">
    <div class="brand">Pocket Grammar <span>· study &amp; practice</span></div>
    <div class="brand-sub" id="savenote">180 topics</div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="today" aria-current="true">Today</button>
    <button data-tab="reference">Reference</button>
    <button data-tab="practice">Practice</button>
    <button data-tab="progress">Progress</button>
  </nav>
</header>
<main id="app"></main>
<script>
const TOPICS=[{"n":1,"t":"Words and Phrase","u":"Sentences & Sentence Types","s":[{"l":"A","b":[{"t":"rule","x":"\u000eAThere are \u000f\u000eD8 word\u000f\u000eA classes in English sometimes called \"parts of speech\"\u000f","p":1},{"t":"rule","x":"1. \u000eAVerb: \u000f\u000eEbe, \u0001bring\u0002\u000f","p":1},{"t":"rule","x":"2. \u000eANoun: \u000f\u000eEcar, dog\u000f","p":1},{"t":"rule","x":"3. \u000eAAdjective:\u000f\u000eE \u0001big\u0002, \u0001different\u0002\u000f","p":1},{"t":"rule","x":"4. \u000eAAdverb: \u000f\u000eEbadly, often, probably\u000f","p":1},{"t":"rule","x":"5. Determiner: determiners include the following common types:"},{"t":"rule","x":"\u000eAArticles: \u000f\u000eFa, \u0001an\u0002,  \u0001the\u0002\u000f","p":1},{"t":"rule","x":"\u000eADemonstratives:\u000f\u000eF this, that, these, those \u000f\u000eA(they are both determiners and pronouns)\u000f","p":1},{"t":"rule","x":"\u000eAPossessives: \u000f\u000eFmy, your, his ,her, its, our, their, x's (possessive 's)  ( and corresponding pronouns: mine, yours, theirs, his, hers)\u000f","p":1},{"t":"rule","x":"\u000eAQuantifiers:\u000f\u000eF (a) few, fewer, fewest, (a) little, many, much, more, most, some, any, every, all, several, enough etc.\u000f","p":1},{"t":"rule","x":"\u000eANumbers: \u000f\u000eFone, two, three etc\u000f\u000eD.\u000f","p":1},{"t":"rule","x":"6. \u000eAPronoun: \u000f\u000eFhim, myself, something, you\u000f","p":1},{"t":"rule","x":"7. \u000eAConjunction: \u000f\u000eFand, because, but, if\u000f","p":1},{"t":"rule","x":"8. \u000eAPreposition: \u000f\u000eFat, by, to, with\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"Some words belong to more than one word class."}]},{"l":"C","b":[{"t":"rule","x":"\u000eAThere are \u000f\u000eD5 kinds of phrase\u000f","p":1},{"t":"rule","x":"1. \u000eAA \u000f\u000eCverb phrase\u000f\u000eA: has an ordinary verb. There can also be \u000f\u000eDone or more auxiliaries in \u000f\u000eGfront\u000f\u000eD of the ordinary verb\u000f","p":1},{"t":"rule","x":"\u000eAE.g. \u000f\u000eHwas\u000f\u000eE, \u000f\u000eHarrives\u000f\u000eE, can \u000f\u000eHsee\u000f\u000eE, don't know, have been \u000f\u000eHthinking\u000f","p":1},{"t":"rule","x":"2. \u000eAA \u000f\u000eCnoun phrase \u000f\u000eI➤84\u000f\u000eA: has a noun. There can also be a \u000f\u000eDdeterminer\u000f\u000eA and/or and an\u000f\u000eD adjective\u000f\u000eA  or other nouns in \u000f\u000eDfront\u000f\u000eA of the noun\u000f","p":1},{"t":"rule","x":"\u000eAE.g. \u000f\u000eHmusic\u000f\u000eE, some \u000f\u000eHmoney\u000f\u000eE, a good \u000f\u000eHgame\u000f\u000eE, a car \u000f\u000eHaccident\u000f","p":1},{"t":"rule","x":"3. \u000eAAn \u000f\u000eCadjective phrase\u000f\u000eA: is often just \u000f\u000eDan adjective\u000f\u000eA. There can also be an \u000f\u000eDadverb of degree  \u000f\u000eI➤127\u000f\u000eA in front of the adjective.\u000f","p":1},{"t":"rule","x":"\u000eAE.g. \u000f\u000eHgreat\u000f\u000eE, very \u000f\u000eHold\u000f\u000eE, most \u000f\u000eHridiculous\u000f","p":1},{"t":"rule","x":"4. \u000eAAn \u000f\u000eCadverb phrase \u000f\u000eAis often just \u000f\u000eDan adverb\u000f\u000eA. There can be an \u000f\u000eDadverb of degree \u000f\u000eI➤127\u000f\u000eA in front of the adverb\u000f","p":1},{"t":"eg","x":"\u000eAE.g. \u000f\u000eEsometimes, very \u000f\u000eHcarefully\u000f","p":1},{"t":"rule","x":"5. \u000eAA \u000f\u000eCprepositional phrase\u000f\u000eA is\u000f\u000eD a preposition + noun phrase  \u000f\u000eI➤135A-B\u000f","p":1},{"t":"rule","x":"\u000eAE.g. \u000f\u000eHon\u000f\u000eE the road, \u000f\u000eHby\u000f\u000eE Friday, \u000f\u000eHfor\u000f\u000eE a long time\u000f","p":1}]}]},{"n":2,"t":"The simple sentence","u":"Sentences & Sentence Types","s":[{"l":"A","b":[{"t":"sub","x":"S + V"},{"t":"eg","x":"\u000eEThe visitors have \u000f\u000eHarrived\u000f","p":1},{"t":"rule","x":"\u000eAA verb in this structure is called an \u000f\u000eDintransitive\u000f\u000eA verb e.g. \u000f\u000eEarrive, \u0001rise\u0002, \u0001wait\u0002\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"S + V + Object"},{"t":"eg","x":"\u000eEThe shops \u000f\u000eHsell\u000f\u000eE computers\u000f","p":1},{"t":"rule","x":"\u000eAA verb in this structure is called an \u000f\u000eDtransitive \u000f\u000eAverb e.g. \u000f\u000eEeat, sell, take , wear\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"S + V + Complement"},{"t":"eg","x":"\u000eEThis jacket \u000f\u000eHis\u000f\u000eE nice\u000f","p":1},{"t":"eg","x":"\u000eEThe song \u000f\u000eHbecame\u000f\u000eE a big hit\u000f","p":1},{"t":"rule","x":"\u000eAA verb in this structure is called a \u000f\u000eDlinking verb\u000f\u000eA e.g. \u000f\u000eEbe, become, look, seem\u000f","p":1},{"t":"rule","x":"\u000eAThe complement can be an \u000f\u000eDadjective phrase\u000f\u000eA (\u000f\u000eEnice\u000f\u000eA) or a \u000f\u000eDnoun phrase\u000f\u000eA ( \u000f\u000eEa big hit\u000f\u000eA)\u000f","p":1}]},{"l":"D","b":[{"t":"sub","x":"S + V + Adverbial"},{"t":"eg","x":"\u000eEThe match is \u000f\u000eHtomorrow\u000f","p":1},{"t":"eg","x":"\u000eEWe got \u000f\u000eHon the bus\u000f","p":1},{"t":"eg","x":"\u000eEThe meeting are \u000f\u000eHevery month\u000f","p":1},{"t":"rule","x":"\u000eAThe \u000f\u000eDadverbial\u000f\u000eA can be an \u000f\u000eDadverb phrase\u000f\u000eA (\u000f\u000eEtomorrow\u000f\u000eA), a \u000f\u000eDprepositional phrase\u000f\u000eA (\u000f\u000eEon the bus\u000f\u000eA) or a \u000f\u000eDnoun phrase\u000f\u000eA ( \u000f\u000eEevery month\u000f\u000eA)\u000f","p":1}]},{"l":"E","b":[{"t":"sub","x":"S + V + Object + Object"},{"t":"eg","x":"\u000eEWe \u000f\u000eHshould\u000f\u000eE give the children presents\u000f","p":1},{"t":"eg","x":"\u000eESarah \u000f\u000eHsent\u000f\u000eE me a text message\u000f","p":1},{"t":"rule","x":"\u000eAHere there is a direct object (\u000f\u000eEa text message\u000f\u000eA) and an indirect object (\u000f\u000eEme\u000f\u000eA)\u000f","p":1}]},{"l":"F","b":[{"t":"sub","x":"S + V + Object + Complement"},{"t":"eg","x":"The project kept everyone very busy"},{"t":"eg","x":"All the publicity made the song a big hit"},{"t":"rule","x":"\u000eAHere the complement ( \u000f\u000eEa big hit\u000f\u000eA) relates to the object of the clause ( \u000f\u000eEthe song\u000f\u000eA)\u000f","p":1}]},{"l":"G","b":[{"t":"sub","x":"S + V + Object + Adverbial"},{"t":"eg","x":"\u000eEI put my mobile \u000f\u000eHin my pocket\u000f","p":1},{"t":"eg","x":"\u000eEThe police got the car \u000f\u000eHout of the river\u000f","p":1},{"t":"rule","x":"\u000eAHere the adverbial (\u000f\u000eEout of the river\u000f\u000eA) relates to the object (\u000f\u000eEthe car\u000f\u000eA)\u000f","p":1}]},{"l":"H","b":[{"t":"rule","x":"We can add extra adverbials to any of the clause structures"},{"t":"eg","x":"\u000eEThe visitors have \u000f\u000eHjust\u000f\u000eE arrived.\u000f","p":1},{"t":"eg","x":"\u000eHTo my surprise\u000f\u000eE, Sarah \u000f\u000eHactually\u000f\u000eE sent me a text message \u000f\u000eHright away\u000f\u000eE.\u000f","p":1},{"t":"tip","x":"With some verbs it is easy to predict the structure. Give usually has two objects; put always has an object + adverbial. But some verbs occur in different structures; for example tell the truth (one object) and tell me a story (two objects)"}]}]},{"n":3,"t":"Give, send, buy, etc","u":"Sentences & Sentence Types","s":[{"l":"A","b":[{"t":"sub","x":"Two objects"},{"t":"rule","x":"\u000eAWhen a verb has two objects, the first is the \u000f\u000eDindirect\u000f\u000eA object, and the second is the \u000f\u000eDdirect\u000f\u000eA object. \u000f","p":1},{"t":"eg","x":"You give the attendant your ticket."},{"t":"wrong","x":"You give your ticket the attendant."},{"t":"eg","x":"\u000eEWe'll send \u000f\u000eHour teacher a message\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eENigel bought \u000f\u000eHCelia a diamond ring\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEI can reserve \u000f\u000eHyou a seat\u000f\u000eE.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"Object + prepositional phrase"},{"t":"rule","x":"\u000eAInstead of an indirect object, we can use a prepositional phrase with \u000f\u000eIto\u000f\u000eA or\u000f\u000eI for.\u000f","p":1},{"t":"eg","x":"\u000eEYou give your ticket \u000f\u000eHto\u000f\u000eE the attendant.\u000f","p":1},{"t":"eg","x":"\u000eENigel bought a diamond ring \u000f\u000eHfor\u000f\u000eE Celia.\u000f","p":1},{"t":"rule","x":"\u000eAThe phrase with \u000f\u000eIto\u000f\u000eA or\u000f\u000eI for\u000f\u000eA comes after the \u000f\u000eDdirect\u000f\u000eA object.\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"To or for?"},{"t":"rule","x":"These verbs can go with \u0001to\u0002: award, fax, feed, give, grant, hand, leave (in a will), lend, mail, offer, owe, pass, pay, post, promise, read, sell, send, s how, take, teach, tell, throw, write."},{"t":"rule","x":"\u000eAThese verbs can go with \u000f\u000eDfor\u000f\u000eA: \u000f\u000eEbuy, cook, fetch, find, fix, get, keep, leave, make, order, pick, reserve, save.\u000f","p":1}]},{"l":"D","b":[{"t":"sub","x":"Pronouns after give, send, etc"},{"t":"rule","x":"\u000eAWhen there is a pronoun, it usually comes before \u000f\u000eDa phrase with a noun\u000f\u000eA. \u000f","p":1},{"t":"eg","x":"\u000eEJames lent \u000f\u000eHme\u000f\u000eE his mobile\u000f","p":1},{"t":"eg","x":"\u000eEI might send \u000f\u000eHthem\u000f\u000eE to my sister.\u000f","p":1},{"t":"rule","x":"\u000eAWhen there are two pronouns after the verb, we normally use \u000f\u000eDto\u000f\u000eA or \u000f\u000eDfor\u000f\u000eA. \u000f","p":1},{"t":"eg","x":"\u000eEWe'll send \u000f\u000eHthem to you\u000f\u000eE straight away.\u000f","p":1},{"t":"eg","x":"\u000eEMy friend saved \u000f\u000eHit for me\u000f\u000eE.\u000f","p":1}]},{"l":"E","b":[{"t":"sub","x":"Describe, explain, etc"},{"t":"rule","x":"\u000eASome verbs can occur with \u000f\u000eFto\u000f\u000eA or \u000f\u000eFfor\u000f\u000eA but not with an indirect object. \u000f","p":1},{"t":"eg","x":"Tim described the men \u0004to\u0005 the police."},{"t":"wrong","x":"Tim described the police the men."},{"t":"eg","x":"I'll explain everything \u0004to\u0005 you."},{"t":"wrong","x":"I'll explain you everything."},{"t":"eg","x":"\u000eASuch verbs include \u000f\u000eEannounce, communicate, deliver, describe, donate, explain, obtain, propose, purchase, report, and suggest.\u000f","p":1},{"t":"tip","x":"It is safer to use an indirect object only with a short verb like give or send and not with a longer verb like describe or explain. Can you give me the figures? but Can you explain the figures to me?"}]}]},{"n":4,"t":"The use of statements","u":"Sentences & Sentence Types","s":[{"l":"A","b":[{"t":"rule","x":"\u000eAThere are \u000f\u000eDfour sentence types\u000f\u000eA. Each has a main use.\u000f","p":1},{"t":"eg","x":"\u000eAStatement (giving information) \u000f\u000eEYou \u000f\u000eHtook\u000f\u000eE a photo.\u000f","p":1},{"t":"eg","x":"\u000eAQuestion (asking for information) \u000f\u000eHDid\u000f\u000eE you \u000f\u000eHtake\u000f\u000eE a photo?\u000f","p":1},{"t":"rule","x":"\u000eAImperative (an order or request) \u000f\u000eHTake\u000f\u000eE a photo.\u000f","p":1},{"t":"eg","x":"\u000eAExclamation (expressing a feeling) \u000f\u000eHWhat\u000f\u000eE a nice photo\u000f\u000eH!\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"Besides the main use, some sentence types have other uses."},{"t":"rule","x":"For example, a statement can ask for information."},{"t":"eg","x":"\u000eEI want to hear all your latest news\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"A question can be a request."},{"t":"eg","x":"Could you close the window, please?"}]},{"l":"C","b":[{"t":"rule","x":"There are many uses (or 'communicative functions') of statements, for example:"},{"t":"eg","x":"\u000eAOffering to do something \u000f\u000eEI can carry that for you.\u000f","p":1},{"t":"eg","x":"\u000eAThanking someone \u000f\u000eEI’m very grateful.\u000f","p":1},{"t":"eg","x":"\u000eAGiving orders \u000f\u000eEI’d like you to check these figures.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"\u000eASome present-simple verbs express the use of the statement. They are \u000f\u000eD‘performative verbs’\u000f\u000eA. They include:\u000f","p":1},{"t":"rule","x":"\u000eEadmit, advise, agree, apologize, guarantee, insist, object, predict, promise, protest, refuse, suggest, warn\u000f\u000eA. \u000f","p":1},{"t":"rule","x":"Here are some examples."},{"t":"eg","x":"\u000eAApologizing \u000f\u000eEIt was my fault. I \u000f\u000eHapologize\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eAPromising \u000f\u000eEI \u000f\u000eHpromise\u000f\u000eE to behave myself.\u000f","p":1},{"t":"eg","x":"\u000eAPredicting \u000f\u000eEI \u000f\u000eHpredict\u000f\u000eE a close game.\u000f","p":1},{"t":"eg","x":"\u000eASuggesting \u000f\u000eEI \u000f\u000eHsuggest\u000f\u000eE we all meet later.\u000f","p":1},{"t":"rule","x":"\u000eAIn general, performative verbs are \u000f\u000eDfairly emphati\u000f\u000eAc, and some are \u000f\u000eDrather formal\u000f\u000eA. \u000f","p":1},{"t":"rule","x":"\u000eAFor example, \u000f\u000eEI promise to behave\u000f\u000eA is more emphatic than \u000f\u000eEI’ll behave\u000f\u000eA, and \u000f\u000eEI apologize\u000f\u000eA is more formal than \u000f\u000eEI’m sorry.\u000f","p":1}]},{"l":"E","b":[{"t":"rule","x":"\u000eASometimes we use \u000f\u000eDa modal verb before\u000f\u000eA a performative verb. \u000f","p":1},{"t":"eg","x":"\u000eEI\u000f\u000eH’d advise\u000f\u000eE you to shred the documents.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHmust insist\u000f\u000eE we keep to the rules.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHcan guarantee\u000f\u000eE you’ll enjoy yourself.\u000f","p":1},{"t":"tip","x":"It is important to learn how statements are used in communication. Some are strongly associated with certain uses, e.g. I’m going to ... expresses an intention, I think you should ... gives advice and \u0001if only\u0002 ... expresses a wish."}]}]},{"n":5,"t":"Negative statements","u":"Sentences & Sentence Types","s":[{"l":"A","b":[{"t":"rule","x":"\u000eAIn a negative statement, \u000f\u000eFnot\u000f\u000eA or \u000f\u000eFn't\u000f\u000eA comes \u000f\u000eDafter\u000f\u000eA the \u000f\u000eDauxiliary verb\u000f\u000eA. We write the auxiliary and \u000f\u000eFn't\u000f\u000eA together as \u000f\u000eDone word\u000f\u000eA. \u000f","p":1},{"t":"eg","x":"\u000eEWe \u000f\u000eHhave not\u000f\u000eE received an invitation.\u000f","p":1},{"t":"eg","x":"\u000eEThe scheme \u000f\u000eHwasn't\u000f\u000eE working properly.\u000f","p":1},{"t":"rule","x":"\u000eAIf there is \u000f\u000eDmore than one\u000f\u000eA auxiliary, \u000f\u000eFnot\u000f\u000eA or \u000f\u000eFn't\u000f\u000eA comes after the \u000f\u000eDfirst\u000f\u000eA auxiliary. \u000f","p":1},{"t":"eg","x":"\u000eEWe \u000f\u000eHshouldn't have\u000f\u000eE stayed so long.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHmight not be\u000f\u000eE coming back next term.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eAIn simple tenses we use \u000f\u000eFdo\u000f\u000eA as the auxiliary. \u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHdon’t\u000f\u000eE like cowboy films.\u000f","p":1},{"t":"eg","x":"The player did not speak to reporters."},{"t":"wrong","x":"The player spoke not to reporters."}]},{"l":"C","b":[{"t":"eg","x":"\u000eFBe\u000f\u000eA on its own has \u000f\u000eFnot\u000f\u000eA or \u000f\u000eFn't\u000f\u000eA after it. \u000f","p":1},{"t":"eg","x":"\u000eEThe area \u000f\u000eHis not/isn’t\u000f\u000eE very nice.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"\u000eAWe do not use \u000f\u000eFno\u000f\u000eA in a \u000f\u000eDnegative\u000f\u000eA verb form. \u000f","p":1},{"t":"eg","x":"The message didn't arrive."},{"t":"wrong","x":"The message \u0004no\u0005 arrived."}]},{"l":"E","b":[{"t":"rule","x":"\u000eFNot\u000f\u000eA can come \u000f\u000eDbefore\u000f\u000eA a word or phrase which needs \u000f\u000eDcorrecting\u000f\u000eA, or before some \u000f\u000eDexpressions\u000f\u000eA of quantity, distance, or time.\u000f","p":1},{"t":"eg","x":"\u000eEI ordered tea, \u000f\u000eHnot coffee\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eHNot many\u000f\u000eE people have their own aircraft.\u000f","p":1},{"t":"eg","x":"\u000eEThere's an internet cafe \u000f\u000eHnot far away\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEWe arrived \u000f\u000eHnot a moment\u000f\u000eE too soon.\u000f","p":1}]},{"l":"F","b":[{"t":"sub","x":"Other negative words"},{"t":"eg","x":"\u000eAThere are other words besides \u000f\u000eFnot\u000f\u000eA which have a \u000f\u000eDnegative\u000f\u000eA meaning.\u000f","p":1},{"t":"table","rows":[["","No, none, etc","Not/n't"],["no","\u000eEWe have \u000f\u000eHno\u000f\u000eE time.\u000f","\u000eEWe have\u000f\u000eHn’t any\u000f\u000eE time.\u000f"],["none","\u000eETickets? Oh, there are \u000f\u000eHnone\u000f\u000eE left.\u000f","\u000eETickets? Oh, there are\u000f\u000eHn’t any\u000f\u000eE left.\u000f"],["No one, nobody","\u000eEI saw \u000f\u000eHno one\u000f\u000eE acting strangely.\u000f","\u000eEI did\u000f\u000eHn’t\u000f\u000eE see \u000f\u000eHanyone\u000f\u000eE acting strangely.\u000f"],["nothing","\u000eEI did \u000f\u000eHnothing\u000f\u000eE wrong.\u000f","\u000eEI did\u000f\u000eHn’t\u000f\u000eE do \u000f\u000eHanything\u000f\u000eE wrong.\u000f"],["nowhere","\u000eEThere was \u000f\u000eHnowhere\u000f\u000eE to park.\u000f","\u000eEThere was\u000f\u000eHn’t anywhere\u000f\u000eE to park.\u000f"],["few","\u000eHFew\u000f\u000eE people were interested.\u000f","\u000eHNot many\u000f\u000eE people were interested.\u000f"],["little","\u000eEThere was \u000f\u000eHlittle\u000f\u000eE interest.\u000f","\u000eEThere was\u000f\u000eHn’t much\u000f\u000eE interest.\u000f"],["never","\u000eEI’ve \u000f\u000eHnever\u000f\u000eE seen the film.\u000f","\u000eEI have\u000f\u000eHn’t ever\u000f\u000eE seen the film.\u000f"],["Seldom, rarely","\u000eEWe \u000f\u000eHseldom\u000f\u000eE eat out.\u000f","\u000eEWe do\u000f\u000eHn’t often\u000f\u000eE eat out.\u000f"],["No longer","\u000eEAdam \u000f\u000eHno longer\u000f\u000eE lives here.\u000f","\u000eEAdam does\u000f\u000eHn’t\u000f\u000eE live here \u000f\u000eHany more\u000f\u000eE.\u000f"],["Hardly, scarcely","\u000eEI’ve \u000f\u000eHhardly\u000f\u000eE started on my project.\u000f","\u000eEI have\u000f\u000eHn’t really\u000f\u000eE started on my project.\u000f"],["Neither, nor","\u000eEYou can’t sing, and \u000f\u000eHneither\u000f\u000eE can I.\u000f","\u000eEYou can’t sing, and I ca\u000f\u000eHn’t either\u000f\u000eE.\u000f"]]}]}]},{"n":6,"t":"Negatives with emphasis and inversion","u":"Sentences & Sentence Types","s":[{"l":"A","b":[{"t":"sub","x":"The emphatic negative"},{"t":"rule","x":"\u000eAWe can stress \u000f\u000eFnot\u000f\u000eA or an auxiliary with \u000f\u000eFn't\u000f\u000eI. \u000f","p":1},{"t":"eg","x":"\u000eEI did \u000f\u000eHNOT\u000f\u000eE take your mobile.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHDIDN'T\u000f\u000eE take your mobile.\u000f","p":1},{"t":"rule","x":"\u000eAWe speak the word with \u000f\u000eDextra force\u000f\u000eA, and in writing we highlight the word, \u000f\u000eDe.g., by underlining or using capital letters. \u000f","p":1},{"t":"rule","x":"\u000eAWe can also use \u000f\u000eDat all\u000f\u000eA to \u000f\u000eDemphasize\u000f\u000eA a negative. \u000f","p":1},{"t":"eg","x":"\u000eEWe don't like our new boss\u000f\u000eH at all\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEIn no time \u000f\u000eHat all\u000f\u000eE, the tour was over\u000f\u000eD.\u000f","p":1},{"t":"rule","x":"\u000eFAt all\u000f\u000eA usually goes \u000f\u000eDat the end\u000f\u000eA of a clause or \u000f\u000eDafter a negative phrase\u000f\u000eA, \u000f\u000eBe.g., \u000f\u000eEno time\u000f\u000eB. \u000f","p":1},{"t":"eg","x":"\u000eAHere are some other phrases which \u000f\u000eDemphasize\u000f\u000eA a negative.\u000f","p":1},{"t":"rule","x":"\u000eEThe event did not go well \u000f\u000eHby any means\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEI’m not \u000f\u000eHin the least\u000f\u000eE hungry.\u000f","p":1},{"t":"eg","x":"\u000eEHer son’s visits were \u000f\u000eHfar from\u000f\u000eE frequent.\u000f","p":1},{"t":"rule","x":"\u000eAWe can use \u000f\u000eIabsolutely\u000f\u000eA before \u000f\u000eFno, nobody, nowhere, etc\u000f\u000eD.\u000f","p":1},{"t":"eg","x":"\u000eEThere was \u000f\u000eHabsolutely\u000f\u000eE nowhere to park\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"\u000eAWe can use \u000f\u000eIwhatever\u000f\u000eA or \u000f\u000eIwhatsoever\u000f\u000eA after \u000f\u000eInothing\u000f\u000eA or \u000f\u000eInone\u000f\u000eA, or after \u000f\u000eIno + noun\u000f\u000eA. \u000f","p":1},{"t":"eg","x":"\u000eEThere’s nothing \u000f\u000eHwhatever\u000f\u000eE we can do about it.\u000f","p":1},{"t":"eg","x":"\u000eEI have no sympathy \u000f\u000eHwhatsoever\u000f\u000eE.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"Inversion after a negative phrase"},{"t":"rule","x":"\u000eAA negative phrase can come in \u000f\u000eDfront position\u000f\u000eA. This can happen with phrases containing \u000f\u000eEno, never, neither, nor, seldom, rarely, hardly,\u000f\u000eB and \u000f\u000eEonly\u000f\u000eA. \u000f","p":1},{"t":"rule","x":"\u000eAThe auxiliary \u000f\u000eE(e.g. should)\u000f\u000eA comes before the subject \u000f\u000eE(e.g. you)\u000f\u000eA. \u000f","p":1},{"t":"eg","x":"\u000eHUnder no circumstances\u000f\u000eE should you travel alone.\u000f","note":"Compare: You should not travel alone under any circumstances.","p":1},{"t":"eg","x":"\u000eHNever in my life\u000f\u000eE have I seen such things.\u000f","p":1},{"t":"eg","x":"\u000eEThe electricity had been disconnected —\u000f\u000eH nor\u000f\u000eE was there any water.\u000f","p":1},{"t":"eg","x":"\u000eHOnly in summer\u000f\u000eE is it hot enough to swim.\u000f","p":1},{"t":"rule","x":"\u000eASometimes a phrase with \u000f\u000eInot\u000f\u000eA can come in front position. \u000f","p":1},{"t":"eg","x":"\u000eHNot until the following Monday\u000f\u000eE was I able to see a doctor.\u000f","p":1},{"t":"rule","x":"\u000eAIf the verb is in a simple tense, we use the auxiliary verb \u000f\u000eIdo\u000f\u000eA. \u000f","p":1},{"t":"rule","x":"\u000eHSeldom do\u000f\u000eE we have any visitors. (Compare: We seldom have any visitors.) \u000f","p":1},{"t":"eg","x":"\u000eEOnly once \u000f\u000eHdid\u000f\u000eE my attention wander.\u000f","p":1},{"t":"tip","x":"A negative phrase with inversion can sound formal and literary. An exception is no way, which is informal, e.g., No way can we get there on time."}]}]},{"n":7,"t":"The imperative","u":"Sentences & Sentence Types","s":[{"l":"A","b":[{"t":"sub","x":"Form"},{"t":"rule","x":"\u000eAThe imperative is the base form of the verb, e.g., \u000f\u000eEwait, answer, arrive, tell, ask\u000f\u000eB. \u000f","p":1},{"t":"eg","x":"\u000eHWait\u000f\u000eE a moment, please.\u000f","p":1},{"t":"eg","x":"\u000eHAnswer\u000f\u000eE all the questions.\u000f","p":1},{"t":"rule","x":"\u000eAThe negative is \u000f\u000eFdo not/don't + base form.\u000f","p":1},{"t":"eg","x":"\u000eHDo not remove\u000f\u000eE this book from the library.\u000f","p":1},{"t":"eg","x":"\u000eHDon't make\u000f\u000eE so much fuss.\u000f","p":1},{"t":"rule","x":"\u000eAFor emphasis we use \u000f\u000eFdo + base form\u000f\u000eA. \u000f","p":1},{"t":"eg","x":"\u000eHDo\u000f\u000eE be careful.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"Use"},{"t":"rule","x":"\u000eAThe basic use of the imperative is to \u000f\u000eDtell someone what to do. \u000f","p":1},{"t":"rule","x":"\u000eABut this use is too \u000f\u000eDabrupt\u000f\u000eA in many situations, and there are more polite ways of telling people what to do. For more details, \u000f\u000eB➤8\u000f\u000eA. \u000f","p":1},{"t":"rule","x":"The imperative is also used in these contexts:"},{"t":"eg","x":"\u000eASlogans and advertisements \u000f\u000eHSave\u000f\u000eE the planet. \u000f\u000eHVisit\u000f\u000eE historic Bath.\u000f","p":1},{"t":"eg","x":"\u000eAWarnings and reminders \u000f\u000eHLook\u000f\u000eE out! There's a car coming.\u000f\u000eH Don't forget\u000f\u000eE your key.\u000f","p":1},{"t":"eg","x":"\u000eAInstructions and directions \u000f\u000eHSelect\u000f\u000eE a document from the menu.\u000f\u000eH Turn\u000f\u000eE left at the lights.\u000f","p":1},{"t":"rule","x":"\u000eAInformal offers and invitations \u000f\u000eHHave\u000f\u000eE a biscuit. \u000f\u000eHCome\u000f\u000eE to lunch.\u000f","p":1},{"t":"eg","x":"\u000eAGood wishes \u000f\u000eHHave\u000f\u000eE a nice holiday. \u000f\u000eHEnjoy\u000f\u000eE yourselves.\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"Imperative + question tag"},{"t":"rule","x":"\u000eAWe can use a \u000f\u000eDpositive tag\u000f\u000eA after a \u000f\u000eDpositive imperative. \u000f","p":1},{"t":"eg","x":"\u000eECome here, \u000f\u000eHwill/would/can could you?\u000f","p":1},{"t":"rule","x":"The tag makes the imperative less abrupt."},{"t":"rule","x":"\u000eFCan't you?\u000f\u000eA after an imperative expresses \u000f\u000eDannoyance or impatience. \u000f","p":1},{"t":"eg","x":"\u000eEKeep still, \u000f\u000eHcan't you?\u000f","p":1},{"t":"rule","x":"\u000eAIn warnings and reminders, the tag is \u000f\u000eFwon't you?\u000f\u000eA after a positive imperative and \u000f\u000eFwill you?\u000f\u000eA after a negative. \u000f","p":1},{"t":"eg","x":"\u000eEDrive carefully, \u000f\u000eHwon't you?\u000f","p":1},{"t":"eg","x":"\u000eEDon't forget your key, \u000f\u000eHwill you?\u000f","p":1}]},{"l":"D","b":[{"t":"sub","x":"Let's"},{"t":"rule","x":"Let's + verb expresses a suggestion."},{"t":"eg","x":"\u000eHLet's\u000f\u000eE go for a walk. ~ Good idea.\u000f","p":1},{"t":"rule","x":"\u000eAThe negative is \u000f\u000eIlet's not\u000f\u000eA or (in British English) \u000f\u000eIdon't let's. \u000f","p":1},{"t":"eg","x":"\u000eHLet's not\u000f\u000eE waste/\u000f\u000eHDon't let's\u000f\u000eE waste time.\u000f","p":1},{"t":"rule","x":"\u000eAIn British English we can use the tag \u000f\u000eIshall we?\u000f","p":1},{"t":"eg","x":"\u000eELet's sit down, \u000f\u000eHshall we?\u000f","p":1},{"t":"tip","x":"You can use Let me see or Let me think to show that you are thinking about something, e.g. Let me see. What else do we need?"}]}]},{"n":8,"t":"Getting people to do things","u":"Sentences & Sentence Types","s":[{"l":"A","b":[{"t":"rule","x":"There are many different ways of getting people to do things in English. Compare these sentences:"},{"t":"eg","x":"\u000eHI'd be very grateful if you could\u000f\u000eE translate this letter. (asking a favour)\u000f","p":1},{"t":"eg","x":"\u000eHCould you\u000f\u000eE translate this letter, please? (a polite request)\u000f","p":1},{"t":"eg","x":"\u000eHTranslate\u000f\u000eE this letter. (an instruction on an exam paper)\u000f","p":1},{"t":"rule","x":"The form we use for an order or request depends on the situation."},{"t":"rule","x":"\u000eAIt is usually necessary to use a \u000f\u000eDpolite\u000f\u000eA formula such as \u000f\u000eFCould you ...?\u000f\u000eA rather than an \u000f\u000eDimperative\u000f\u000eA.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eATo be very \u000f\u000eDpolite\u000f\u000eA when asking a favour, we need to use a \u000f\u000eDlonger formula.\u000f","p":1},{"t":"eg","x":"\u000eHWould you be so kind as to\u000f\u000eE ring me in the other room, please?\u000f","p":1},{"t":"eg","x":"\u000eHI wonder if you'd mind\u000f\u000eE dealing with the matter for me.\u000f","p":1},{"t":"rule","x":"In most situations we use a question form."},{"t":"eg","x":"\u000eHCould you\u000f\u000eE sign here, please?\u000f","p":1},{"t":"eg","x":"\u000eHWould you mind\u000f\u000eE giving me a lift?\u000f","p":1},{"t":"rule","x":"It is always worth taking the trouble to put your request into a question form. It would not be polite to say simply"},{"t":"eg","x":"Give me a lift."},{"t":"rule","x":"Even people in authority often use a polite formula rather than an imperative."},{"t":"eg","x":"\u000eHCan you\u000f\u000eE get your books out, please?\u000f","p":1},{"t":"eg","x":"\u000eHI want you\u000f\u000eE to just keep still a moment.\u000f","p":1},{"t":"eg","x":"\u000eHYou mustn't\u000f\u000eE spend too long on this.\u000f","p":1},{"t":"eg","x":"\u000eHI'd like you\u000f\u000eE to move closer together.\u000f","p":1},{"t":"eg","x":"\u000eHWould you like\u000f\u000eE to come this way?\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"Imperative can be used to give orders"},{"t":"rule","x":"\u000eATeacher to pupils: \u000f\u000eHOpen\u000f\u000eE your books, please. \u000f","p":1},{"t":"eg","x":"\u000eADoctor to patient: \u000f\u000eHDon't move\u000f\u000eC. \u000f","p":1},{"t":"rule","x":"\u000eABoss to employee: \u000f\u000eENow \u000f\u000eHprint\u000f\u000eE out a copy.\u000f","p":1},{"t":"rule","x":"But it is unusual to begin a conversation with an imperative. Often a polite formula is used first, then a series of imperatives."},{"t":"eg","x":"\u000eHCan you\u000f\u000eE get out your books, please? \u000f","p":1},{"t":"eg","x":"\u000eHOpen\u000f\u000eE them at page 60 and \u000f\u000eHlook\u000f\u000eE at the photo. Then \u000f\u000eHthink\u000f\u000eE about your reaction.\u000f","p":1},{"t":"rule","x":"An imperative can also be used informally between equals"},{"t":"eg","x":"\u000eHGive\u000f\u000eE me a hand with these boxes.\u000f","p":1},{"t":"eg","x":"\u000eHHurry\u000f\u000eE up, or we're going to be late.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"This is how we ask to be given something"},{"t":"eg","x":"\u000eHCan/Could we have\u000f\u000eE our bill, please? \u000f","p":1},{"t":"eg","x":"\u000eHI'd like\u000f\u000eE an orange juice. \u000f","p":1},{"t":"eg","x":"\u000eEA box of matches, \u000f\u000eHplease\u000f\u000eE.\u000f","p":1},{"t":"tip","x":"\u000eARather than \u000f\u000eEDo it\u000f\u000eD, say\u000f\u000eE Could you do it, please?\u000f\u000eD Or \u000f\u000eEWould you mind doing it, please?\u000f","p":1}]}]},{"n":9,"t":"Questions","u":"Sentences & Sentence Types","s":[{"l":"A","b":[{"t":"sub","x":"Types of questions"},{"t":"rule","x":"\u000eAThere are two types of questions: a \u000f\u000eIyes/no \u000f\u000eAquestion and a \u000f\u000eIwh-\u000f\u000eAquestion.\u000f","p":1},{"t":"rule","x":"\u000eAA \u000f\u000eIyes/no\u000f\u000eA question can be answered by \u000f\u000eIyes\u000f\u000eA or \u000f\u000eIno\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEDo you sell magazines? ~ \u000f\u000eHYes\u000f\u000eE, we do.\u000f","p":1},{"t":"eg","x":"\u000eEWill I need to pay? ~ \u000f\u000eHNo\u000f\u000eE, it's free.\u000f","p":1},{"t":"rule","x":"\u000eAThe question begins with an \u000f\u000eDauxiliary\u000f\u000eA verb \u000f\u000eI(do, will)\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"\u000eAA \u000f\u000eIwh-\u000f\u000eAquestion begins with a question word.\u000f","p":1},{"t":"eg","x":"\u000eHWhen\u000f\u000eE are you travelling? - Tomorrow.\u000f","p":1},{"t":"eg","x":"\u000eHWhat\u000f\u000eE should we do? ~ I don't know.\u000f","p":1},{"t":"rule","x":"\u000eAFor more details on question words, see \u000f\u000eB➤10-11\u000f\u000eA.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"Inversion in questions"},{"t":"rule","x":"\u000eAIn most questions there is inversion of the subject and auxiliary verb. (But see  \u000f\u000eB➤10C\u000f\u000eA.)\u000f","p":1},{"t":"eg","x":"\u000eHAre you\u000f\u000eE doing a course here?\u000f","p":1},{"t":"eg","x":"\u000eEWhy \u000f\u000eHhas the machin\u000f\u000eEe stopped?\u000f","p":1},{"t":"eg","x":"\u000eEWhere \u000f\u000eHcan we\u000f\u000eE sit?\u000f","p":1},{"t":"rule","x":"\u000eACompare the statement \u000f\u000eHYou are\u000f\u000eE \u0001doing\u0002...\u000f\u000eA and the question \u000f\u000eHAre you\u000f\u000eE doing...?\u000f","p":1},{"t":"rule","x":"\u000eAIf there is more than one auxiliary verb (e.g. \u000f\u000eIcould\u000f\u000eA and \u000f\u000eIhave\u000f\u000eA), then \u000f\u000eDonly the first one\u000f\u000eA comes before the subject.\u000f","p":1},{"t":"eg","x":"Could I have reserved a seat?"},{"t":"wrong","x":"Could have I reserved a seat?"},{"t":"rule","x":"\u000eAIn simple tenses we use \u000f\u000eIdo/does\u000f\u000eA as the auxiliary verb.\u000f","p":1},{"t":"eg","x":"\u000eHDo\u000f\u000eE you like walking? \u000f","p":1},{"t":"eg","x":"Where did everyone stay?"},{"t":"wrong","x":"Where stayed everyone?"},{"t":"rule","x":"\u000eIBe\u000f\u000eA on its own as an ordinary verb also comes before the subject.\u000f","p":1},{"t":"eg","x":"\u000eHIs this\u000f\u000eE cotton?\u000f","p":1},{"t":"eg","x":"Why were you late?"},{"t":"wrong","x":"Why did you be late?"}]},{"l":"C","b":[{"t":"sub","x":"Questions without inversion"},{"t":"rule","x":"In informal conversation a question can sometimes have the same word order as a statement."},{"t":"eg","x":"\u000eHYou were\u000f\u000eE late? Yes, I'm afraid so.\u000f","p":1},{"t":"eg","x":"\u000eHThey went\u000f\u000eE which way? ~ That way. \u000f","p":1},{"t":"rule","x":"\u000eABut this pattern is used \u000f\u000eDless often in English\u000f\u000eA than in many other languages.\u000f","p":1}]},{"l":"D","b":[{"t":"sub","x":"Indirect questions"},{"t":"rule","x":"\u000eAWe can ask a question \u000f\u000eDindirectly\u000f\u000eA, and less abruptly, by putting it into a \u000f\u000eDsub-clause with a question word\u000f\u000eA or with\u000f\u000eI if/whether. \u000f","p":1},{"t":"rule","x":"\u000eAThere is \u000f\u000eDno inversion\u000f\u000eA in the sub-clause.\u000f","p":1},{"t":"eg","x":"\u000eECould you tell me \u000f\u000eHhow much this costs?\u000f","p":1},{"t":"eg","x":"\u000eEI want to know \u000f\u000eHif I can book a seat.\u000f","p":1},{"t":"tip","x":"We use questions in many ways: not only to ask for information, but also to make requests (\u0001Could you…?\u0002), suggestions (\u0001Shall we…?\u0002), offers (Can I…?, would you like to…?) and to ask permission (\u0001May I..?\u0002)"}]}]},{"n":10,"t":"Wh-questions","u":"Sentences & Sentence Types","s":[{"l":"A","b":[{"t":"sub","x":"Question words"},{"t":"rule","x":"These are the eight question words:"},{"t":"eg","x":"\u000eHWho\u000f\u000eE did Matt choose as his partner?\u000f","p":1},{"t":"eg","x":"\u000eHWhat\u000f\u000eE are you reading?\u000f","p":1},{"t":"eg","x":"\u000eHWhich\u000f\u000eE is your car?\u000f","p":1},{"t":"eg","x":"\u000eHWhose\u000f\u000eE is this newspaper?\u000f","p":1},{"t":"eg","x":"\u000eHWhere\u000f\u000eE do you work?\u000f","p":1},{"t":"eg","x":"\u000eHWhen\u000f\u000eE did the accident happen?\u000f","p":1},{"t":"eg","x":"\u000eHWhy\u000f\u000eE is your friend so upset?\u000f","p":1},{"t":"eg","x":"\u000eHHow\u000f\u000eE did you manage to get a ticket?\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"Question words + noun"},{"t":"rule","x":"\u000eJWhat\u000f\u000eI, \u000f\u000eJwhich\u000f\u000eA, and \u000f\u000eJwhose\u000f\u000eA can have a noun (or adjective + noun) after them.\u000f","p":1},{"t":"rule","x":"Examples:"},{"t":"eg","x":"\u000eHWhat action\u000f\u000eE will you take?\u000f","p":1},{"t":"eg","x":"\u000eHWhich day\u000f\u000eE is best for you?\u000f","p":1},{"t":"eg","x":"\u000eHWhose stupid idea\u000f\u000eE was this?\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"Subject and object questions"},{"t":"rule","x":"\u000eAWhen \u000f\u000eJwho\u000f\u000eA or \u000f\u000eJwhat\u000f\u000eA is the subject of a question, there \u000f\u000eDis no inversion\u000f\u000eA. The word order is the same as in a statement.\u000f","p":1},{"t":"rule","x":"Compare these examples:"},{"t":"rule","x":"\u000eCSubject\u000f\u000eA: \u000f\u000eHWho invited\u000f\u000eE you?\u000f\u000eB ~ \u000f\u000eELaura did.\u000f\u000eB (Someone invited you.)\u000f","p":1},{"t":"rule","x":"\u000eCObject\u000f\u000eA: \u000f\u000eHWho did\u000f\u000eE you \u000f\u000eHinvite\u000f\u000eE?\u000f\u000eB ~ \u000f\u000eEMy friends.\u000f\u000eB (You invited someone.)\u000f","p":1},{"t":"rule","x":"\u000eAWe can also use \u000f\u000eJhow many\u000f\u000eA or \u000f\u000eJhow much\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"Examples:"},{"t":"eg","x":"\u000eHHow many people\u000f\u000eE know the secret?\u000f","p":1},{"t":"eg","x":"\u000eHHow much of the money\u000f\u000eE was left?\u000f","p":1},{"t":"rule","x":"Here are some more examples of a question word as (part of) the subject"},{"t":"eg","x":"\u000eHWho\u000f\u000eE is organizing the trip?\u000f","p":1},{"t":"eg","x":"\u000eHWhat\u000f\u000eE caused the accident?\u000f","p":1},{"t":"eg","x":"\u000eHWhich\u000f\u000eE coat suits me best?\u000f","p":1},{"t":"eg","x":"\u000eHWhose\u000f\u000eE car was vandalized?\u000f","p":1}]},{"l":"D","b":[{"t":"sub","x":"Whom"},{"t":"rule","x":"\u000eAIn formal English, when \u000f\u000eCwho\u000f\u000eA is the object, we can use \u000f\u000eCwhom\u000f\u000eA instead.\u000f","p":1},{"t":"rule","x":"Example:"},{"t":"eg","x":"\u000eHWho/Whom\u000f\u000eE did you invite?\u000f","p":1}]},{"l":"E","b":[{"t":"sub","x":"Prepositions in questions"},{"t":"rule","x":"\u000eAA question word can be the \u000f\u000eDobject of a preposition.\u000f","p":1},{"t":"rule","x":"Examples:"},{"t":"eg","x":"\u000eHWhere\u000f\u000eE is Maria \u000f\u000eHfrom\u000f\u000eE? (She is \u000f\u000eHfrom somewhere\u000f\u000eE.)\u000f","p":1},{"t":"eg","x":"\u000eHWhat\u000f\u000eE are you looking \u000f\u000eHat\u000f\u000eE? (You are looking \u000f\u000eHat something\u000f\u000eE.)\u000f","p":1},{"t":"rule","x":"\u000eAUsually, the preposition comes in the same place as in a statement (\u000f\u000eBlooking at\u000f\u000eA). However, in formal English, the preposition can \u000f\u000eDcome before the question word.\u000f","p":1},{"t":"rule","x":"Examples:"},{"t":"eg","x":"\u000eHTo which\u000f\u000eE hospital was
