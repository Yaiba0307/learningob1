000eE complained.\u000f","p":1},{"t":"rule","x":"\u000eABut \u000f\u000eFthe number of\u000f\u000eD...\u000f\u000eA takes a plural verb.\u000f","p":1},{"t":"eg","x":"\u000eEThe \u000f\u000eHnumber\u000f\u000eE of complaints \u000f\u000eHis\u000f\u000eE increasing.\u000f","p":1}]},{"l":"G","b":[{"t":"rule","x":"\u000eFNone/neither/either\u000f\u000eA and a plural noun can be either singular or plural.\u000f","p":1},{"t":"eg","x":"\u000eHNone\u000f\u000eE (of the pupils) \u000f\u000eHhas/have\u000f\u000eE failed.\u000f","p":1},{"t":"eg","x":"\u000eHNeither\u000f\u000eE (of the answers) \u000f\u000eHis/are\u000f\u000eE correct.\u000f","p":1},{"t":"tip","x":"After a fraction or percentage, the verb agrees with the noun, e.g. Two thirds (of the drink) is water. Half the birds were killed."}]}]},{"n":93,"t":"Nouns with a plural form","u":"Nouns","s":[{"l":"A","b":[{"t":"sub","x":"Plural noun and plural verb"},{"t":"rule","x":"\u000eASome nouns are\u000f\u000eD always plural.\u000f","p":1},{"t":"eg","x":"\u000eEThe \u000f\u000eHgoods were\u000f\u000eE never delivered.\u000f","p":1},{"t":"wrong","x":"The good was never delivered."},{"t":"rule","x":"Nouns of this kind include: belongings, clothes, congratulations, earnings, goods, odds (probability), outskirts (outer parts of a town), particulars (details), premises (building), remains (what is left), \u0001surroundings\u0002, \u0001thanks\u0002, \u0001troops\u0002."},{"t":"rule","x":"\u000eASome nouns have a plural-only form which has a \u000f\u000eDdifferent\u000f\u000eA meaning from the \u000f\u000eDsingular or uncountable form.\u000f","p":1},{"t":"sub","x":"Plural only:"},{"t":"eg","x":"\u000eEto carry \u000f\u000eHarms\u000f\u000eA (weapons)\u000f","p":1},{"t":"eg","x":"\u000eEthe \u000f\u000eHcontents\u000f\u000eE of the bag\u000f\u000eA (what is in it)\u000f","p":1},{"t":"eg","x":"\u000eEgo through \u000f\u000eHcustoms\u000f\u000eE at the airport\u000f","p":1},{"t":"eg","x":"\u000eEpay \u000f\u000eHdamages\u000f\u000eE of £10,000\u000f","p":1},{"t":"eg","x":"\u000eEhis good \u000f\u000eHlooks\u000f\u000eA (appearance)\u000f","p":1},{"t":"eg","x":"\u000eHregards\u000f\u000eE to Kate\u000f\u000eA (good wishes)\u000f","p":1},{"t":"eg","x":"\u000eEmy life \u000f\u000eHsavings\u000f\u000eA (money saved)\u000f","p":1},{"t":"sub","x":"Other meanings:"},{"t":"eg","x":"\u000eEI hurt my \u000f\u000eHarm\u000f\u000eA (part of the body)\u000f","p":1},{"t":"eg","x":"\u000eEthe \u000f\u000eHcontent\u000f\u000eE of the mail\u000f\u000eA (what it says)\u000f","p":1},{"t":"eg","x":"\u000eEan old \u000f\u000eHcustom\u000f\u000eA (tradition)\u000f","p":1},{"t":"eg","x":"\u000eEdid some \u000f\u000eHdamage\u000f\u000eA (e.g. in an accident)\u000f","p":1},{"t":"eg","x":"\u000eEhe gave me a \u000f\u000eHlook\u000f\u000eA (he looked at me)\u000f","p":1},{"t":"eg","x":"\u000eEa high \u000f\u000eHregard\u000f\u000eE for her\u000f\u000eA (a good opinion)\u000f","p":1},{"t":"eg","x":"\u000eEa \u000f\u000eHsaving\u000f\u000eE of £10\u000f\u000eA (paying less)\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"Plural noun form but singular verb"},{"t":"rule","x":"\u000eASome nouns end in \u000f\u000eF-s\u000f\u000eA but normally take a singular verb.\u000f","p":1},{"t":"eg","x":"\u000eEThe \u000f\u000eHnews isn’t\u000f\u000eE very good, I’m afraid.\u000f","p":1},{"t":"rule","x":"\u000eHMaths was\u000f\u000eE my best subject at school.\u000f","p":1},{"t":"eg","x":"\u000eANouns of this kind include news; some words for sports and games, e.g. \u000f\u000eEathletics, billiards, gymnastics\u000f\u000eB;\u000f\u000eA some subjects of study, e.g. \u000f","p":1},{"t":"eg","x":"\u000eEmaths, politics, statistics\u000f\u000eB;\u000f\u000eA and some illnesses, e.g. \u000f\u000eEmeasles, diabetes.\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"\u000eCNouns ending in \u000f\u000eL-s \u000f\u000eCin both singular and plural\u000f","p":1},{"t":"rule","x":"\u000eAA few nouns end in \u000f\u000eF-s\u000f\u000eA and can be\u000f\u000eD either singular or plural.\u000f","p":1},{"t":"eg","x":"\u000eEThe new comedy \u000f\u000eHseries ha\u000f\u000eEs been a flop.\u000f","p":1},{"t":"eg","x":"\u000eEBird \u000f\u000eHspecies are\u000f\u000eE numerous in the area.\u000f","p":1},{"t":"rule","x":"\u000eASome nouns of this kind are \u000f\u000eEbarracks\u000f\u000eA (a building where soldiers live), \u000f\u000eEcrossroads, headquarters, means, series, species\u000f\u000eD,\u000f\u000eA and \u000f\u000eEworks\u000f","p":1},{"t":"rule","x":"(factory)."},{"t":"rule","x":"\u000eEBarracks, \u0001headquarters\u0002\u000f\u000eA, and \u000f\u000eEworks\u000f\u000eA can take a plural verb even for a single entity.\u000f","p":1},{"t":"eg","x":"\u000eDT\u000f\u000eEhe \u000f\u000eHheadquarters was/were\u000f\u000eE in Tokyo.\u000f","p":1},{"t":"tip","x":"Politics and statistics as subjects take a singular verb, but when they have a more specific meaning, they take a plural, e.g. His politics are very left-wing. The statistics are on the Internet."}]}]},{"n":94,"t":"Pair nouns and group nouns","u":"Nouns","s":[{"l":"A","b":[{"t":"sub","x":"Pair nouns"}]},{"l":"A","b":[{"t":"sub","x":"Pair nouns"},{"t":"rule","x":"We use a pair noun for certain things made of two similar parts. Most refer to devices, e.g. scissors, glasses, spectacles, binoculars, scales, or to clothes that cover part or all of your legs, e.g. trousers, jeans, shorts, tights, pants. Note also pyjamas."},{"t":"rule","x":"\u000eAA pair noun is \u000f\u000eDplural and takes a plural verb.\u000f","p":1},{"t":"eg","x":"\u000eHThese trousers need\u000f\u000eE cleaning.\u000f","p":1},{"t":"eg","x":"\u000eEI need my \u000f\u000eHglasses\u000f\u000eE, but I can’t find \u000f\u000eHthem\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEThere \u000f\u000eHare some scissors\u000f\u000eE in the drawer.\u000f","p":1},{"t":"rule","x":"\u000eAWe cannot use \u000f\u000eFa\u000f\u000eA \u0001or\u0002 numbers.\u000f","p":1},{"t":"wrong","x":"a scissor and not two scissors"},{"t":"rule","x":"\u000eAWe can use \u000f\u000eFpair of\u000f\u000eA or \u000f\u000eFpairs of.\u000f","p":1},{"t":"eg","x":"\u000eHThis pair of trousers\u000f\u000eE needs cleaning.\u000f","p":1},{"t":"eg","x":"\u000eEHave you got \u000f\u000eHa pair of binoculars\u000f\u000eE?\u000f","p":1},{"t":"eg","x":"\u000eEThere are \u000f\u000eHthree pairs of scissors\u000f\u000eE here.\u000f","p":1},{"t":"rule","x":"\u000eAWe\u000f\u000eD \u0001have to\u0002\u000f\u000eA use \u000f\u000eFpair\u000f\u000eA to say how many.\u000f","p":1},{"t":"rule","x":"\u000eAWe can also use \u000f\u000eFpair\u000f\u000eA with two separate items, e.g. \u000f\u000eDs\u000f\u000eEocks, shoes, boots, gloves.\u000f","p":1},{"t":"eg","x":"\u000eEI’ve packed \u000f\u000eHsix pairs of socks\u000f\u000eE.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"Group nouns"},{"t":"rule","x":"A group noun (or ‘collective noun’) refers to a group of people, e.g. audience, club, committee, company, family, government, group, population, press, public, school."},{"t":"rule","x":"\u000eAAfter a singular group noun, the verb \u000f\u000eDis usually singular, but it can be plural.\u000f","p":1},{"t":"eg","x":"\u000eEThe crowd \u000f\u000eHwas/were\u000f\u000eE in a cheerful mood.\u000f","p":1},{"t":"rule","x":"We use the singular to talk about the group as a whole: its size or make-up or how it compares with others."},{"t":"eg","x":"\u000eEThe \u000f\u000eHclass consists\u000f\u000eE of thirty 11-year-olds.\u000f","p":1},{"t":"eg","x":"\u000eEThe \u000f\u000eHorchestra is\u000f\u000eE the best in the country.\u000f","p":1},{"t":"rule","x":"A plural is more likely with the thoughts and feelings of individuals."},{"t":"eg","x":"\u000eEThe \u000f\u000eHclass don’t\u000f\u000eE/doesn’t know very much.\u000f","p":1},{"t":"eg","x":"\u000eEThe \u000f\u000eHorchestra are\u000f\u000eE/is happy to play.\u000f","p":1},{"t":"rule","x":"\u000eAWe normally use \u000f\u000eEit, \u0001its\u0002\u000f\u000eD,\u000f\u000eA and \u000f\u000eEwhich/that\u000f\u000eA with a singular verb and \u000f\u000eDt\u000f\u000eEhey, \u0001their\u0002,\u000f\u000eA and \u000f\u000eEwho/that\u000f\u000eA with a plural verb.\u000f","p":1},{"t":"eg","x":"\u000eEThe team \u000f\u000eHwhich\u000f\u000eE lost \u000f\u000eHwas\u000f\u000eE doing \u000f\u000eHits\u000f\u000eE best.\u000f","p":1},{"t":"eg","x":"\u000eEThe team \u000f\u000eHwho\u000f\u000eE lost \u000f\u000eHwere\u000f\u000eE doing \u000f\u000eHtheir\u000f\u000eE best.\u000f","p":1},{"t":"rule","x":"The names of companies and sports teams are mostly group nouns."},{"t":"eg","x":"\u000eHTesco sells\u000f\u000eE/sell organic bananas.\u000f","p":1},{"t":"eg","x":"\u000eHEngland has\u000f\u000eE/have lost again.\u000f","p":1},{"t":"rule","x":"\u000eECattle, livestock, people, police\u000f\u000eD,\u000f\u000eA and \u000f\u000eEstaff\u000f\u000eA are plural.\u000f","p":1},{"t":"eg","x":"\u000eEThe \u000f\u000eHpolice are\u000f\u000eE questioning a man.\u000f","p":1},{"t":"tip","x":"\u000eAThe safest choice is the \u000f\u000eDsingular\u000f\u000eA verb because it is more common than the plural verb, especially in American English.\u000f","p":1}]}]},{"n":95,"t":"Introduction to a/an and the","u":"Articles & Determiners","s":[{"l":"A","b":[{"t":"rule","x":"\u000eFA\u000f\u000e\u0001A\u0002 or \u000f\u000eFan\u000f\u000eA is \u0001the\u0002 \u000f\u000eDindefinite\u000f\u000eA article, and \u000f\u000eFthe\u000f\u000eA is the \u000f\u000eDdefinite\u000f\u000eA article.\u000f","p":1},{"t":"rule","x":"Storms battered the coast of Britain yesterday. A man drowned when he was swept into the sea by an enormous wave during a storm at Clacton-on-Sea. Some onlookers tried to rescue the man but without success."},{"t":"rule","x":"\u000eAWe use \u000f\u000eFa/\u0001an\u0002\u000f\u000eA only with \u000f\u000eDa singular countable noun\u000f\u000eA (\u000f\u000eEa man\u000f\u000eB, \u000f\u000eEan enormous wave\u000f\u000eA).\u000f","p":1},{"t":"rule","x":"\u000eAThe \u000f\u000eDplural/uncountable equivalent\u000f\u000eA is \u000f\u000eFsome\u000f\u000eA (\u000f\u000eEsome onlookers\u000f\u000eB, \u000f\u000eEsome water\u000f\u000eA), or no article (\u000f\u000eEstorms\u000f\u000eB, \u000f\u000eEwate\u000f\u000eDr\u000f\u000eA). \u000f","p":1},{"t":"rule","x":"\u000eAWe can use \u000f\u000eFthe\u000f\u000eA with \u000f\u000eDall types of noun.\u000f","p":1},{"t":"rule","x":"\u000eAWe use \u000f\u000eFthe\u000f\u000eA when it is clear which one we mean.\u000f","p":1},{"t":"rule","x":"\u000eAWe say \u000f\u000eHthe\u000f\u000eE coast of Britain\u000f\u000eA because there is only \u000f\u000eDone coast of Britain.\u000f","p":1},{"t":"rule","x":"\u000eAWe say \u000f\u000eHa\u000f\u000eE man\u000f\u000eA when we mention him for the first time, but after that we say \u000f\u000eHthe\u000f\u000eE man\u000f\u000eA, meaning \u000f\u000eD“the man already mentioned.”\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eABefore \u0001a\u0002 \u000f\u000eDconsonant\u000f\u000e\u0001A\u0002 sound, \u0001the\u0002 articles are \u000f\u000eFa\u000f\u000eA and \u000f\u000eFthe\u000f\u000eD. A\u000f\u000eA is pronounced as in the first syllable of \u000f\u000eFaway\u000f\u000eA and \u000f\u000eDthe\u000f\u000eA as in \u000f\u000eFbrother\u000f\u000eD.\u000f","p":1},{"t":"eg","x":"\u000eEa book\u000f\u000eB, \u000f\u000eEa ship\u000f\u000eB, \u000f\u000eEa lovely evening\u000f\u000eB (pronounced \u000f\u000eI/ə/\u000f\u000eB)\u000f","p":1},{"t":"eg","x":"\u000eEthe book\u000f\u000eB, \u000f\u000eEthe ship\u000f\u000eB, \u000f\u000eEthe lovely evening\u000f\u000eB (pronounced \u000f\u000eI/ðə/\u000f\u000eB)\u000f","p":1},{"t":"rule","x":"\u000eABefore a \u000f\u000eDvowel\u000f\u000eA sound, \u0001the\u0002 articles are \u000f\u000eDan\u000f\u000eA and \u000f\u000eDthe.\u000f","p":1},{"t":"rule","x":"\u000eFAn\u000f\u000eA is pronounced as in \u000f\u000eFspoken\u000f\u000eA and \u000f\u000eFthe\u000f\u000eA as in \u000f\u000eFworthy\u000f\u000eA (with \u0001the\u0002 \u000f\u000eIy\u000f\u000eA sound of \u000f\u000eFhappy\u000f\u000eA).\u000f","p":1},{"t":"eg","x":"\u000eEan apple, an idea, an old picture (pronounced\u000f\u000eF /ən/\u000f\u000eE)\u000f","p":1},{"t":"eg","x":"\u000eEthe apple, the idea, the old picture (pronounced \u000f\u000eF/ði/\u000f\u000eE)\u000f","p":1}]},{"l":"C","b":[{"t":"eg","x":"\u000eFA/an\u000f\u000eA and \u000f\u000eFone\u000f\u000eA both refer to \u000f\u000eDa single thing\u000f\u000eA, but \u000f\u000eFone\u000f\u000eA puts more \u000f\u000eDemphasis on the number\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEWe have \u000f\u000eHa\u000f\u000eE car. (We can travel by road.)\u000f","p":1},{"t":"eg","x":"\u000eEWe have \u000f\u000eHone\u000f\u000eE car. (We don’t have two.)\u000f","p":1},{"t":"rule","x":"\u000eAWe use \u000f\u000eFone\u000f\u000eA when we mean a \u000f\u000eDsingle \u0001one\u0002 among a larger number\u000f\u000eA:\u000f","p":1},{"t":"eg","x":"\u000eHOne\u000f\u000eE expert says \u000f\u000eHone\u000f\u000eE thing, and another says something completely different.\u000f","p":1},{"t":"eg","x":"\u000eEJust \u000f\u000eHone\u000f\u000eE of the shops was open.\u000f","p":1},{"t":"rule","x":"\u000eAWe use \u000f\u000eFone\u000f\u000eA in phrases of \u000f\u000eDtime\u000f\u000eA:\u000f","p":1},{"t":"eg","x":"\u000eHOne\u000f\u000eE morning a strange thing happened.\u000f","p":1},{"t":"eg","x":"\u000eHOne\u000f\u000eE day my genius will be recognized.\u000f","p":1},{"t":"eg","x":"\u000eEAt \u000f\u000eHone\u000f\u000eE time I lived in a caravan.\u000f","p":1},{"t":"tip","x":"The choice between \u0001a\u0002 and an depends on the pronunciation—not the spelling—of the word after the article. Note especially words beginning with o, u, or h, or abbreviations:"},{"t":"eg","x":"\u000eHa\u000f\u000eE one-day event\u000f\u000eB, \u000f\u000eHa\u000f\u000eE university\u000f\u000eB, \u000f\u000eHa\u000f\u000eE European\u000f\u000eB, \u000f\u000eHa\u000f\u000eE U-turn\u000f\u000eB, \u000f\u000eHan\u000f\u000eE hour\u000f\u000eB, \u000f\u000eHan\u000f\u000eE MI5 agent.\u000f","p":1}]}]},{"n":96,"t":"The main uses of a/an and the","u":"Articles & Determiners","s":[{"l":"A","b":[{"t":"rule","x":"\u000eAWhen something is first mentioned, the noun usually has\u000f\u000eI a/an\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eHA\u000f\u000eE man and \u000f\u000eHa\u000f\u000eE woman were arrested, but \u000f\u000eHthe\u000f\u000eE woman was later released.\u000f","p":1},{"t":"rule","x":"\u000eAWhen it is mentioned again, we use \u000f\u000eFthe\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"Now look at this example."},{"t":"eg","x":"\u000eHWe\u000f\u000eE went by train. \u000f\u000eHThe\u000f\u000eE trip took an hour.\u000f","p":1},{"t":"rule","x":"\u000eAWe say \u000f\u000eFthe trip\u000f\u000eA because the idea of a trip is mentioned in the first sentence.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eAWe use \u000f\u000eFthe\u000f\u000eA for what is \u000f\u000eDunique\u000f\u000eA in \u0001the\u0002 context.\u000f","p":1},{"t":"eg","x":"\u000eHA\u000f\u000eE car stopped and \u000f\u000eHthe driver\u000f\u000eE got out. (A car has only one driver.)\u000f","p":1},{"t":"eg","x":"\u000eHThe sun\u000f\u000eE was still shining. (There is only one in our solar system.)\u000f","p":1},{"t":"rule","x":"The moon, the internet, the president (of a country), the sky"}]},{"l":"C","b":[{"t":"rule","x":"\u000eAWe often use \u000f\u000eFthe\u000f\u000eA when\u000f\u000eD a phrase or clause follows \u0001the\u0002 noun.\u000f","p":1},{"t":"sub","x":"\u000eEOurs is \u000f\u000eHthe house on the corner.\u000f","p":1},{"t":"rule","x":"\u000eABut if the clause or phrase does \u000f\u000eDnot show exactly\u000f\u000eA which one, we use \u000f\u000eFa/an\u000f\u000eD.\u000f","p":1},{"t":"eg","x":"\u000eEWe live in \u000f\u000eHa house by the park\u000f\u000eE. (There are other houses by the park.)\u000f","p":1},{"t":"rule","x":"\u000eAWe often use \u000f\u000eFthe\u000f\u000eA before an \u000f\u000eI*of-*phrase.\u000f","p":1},{"t":"eg","x":"\u000eEThey heard\u000f\u000eH the sound of an aircraft.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"\u000eAWe can use a phrase with \u000f\u000eFa/an\u000f\u000eA as a complement to describe something.\u000f","p":1},{"t":"eg","x":"\u000eEYesterday was \u000f\u000eHa beautiful day.\u000f","p":1}]},{"l":"E","b":[{"t":"rule","x":"\u000eAWe can use a phrase with \u000f\u000eFa/an\u000f\u000eA to \u000f\u000eDclassify\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEWhat kind of bird is that? ~ \u000f\u000eHA blackbird\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEAnglesey is \u000f\u000eHan island\u000f\u000eE off the Welsh coast.\u000f","p":1}]},{"l":"F","b":[{"t":"rule","x":"\u000eAWe normally use \u000f\u000eFthe\u000f\u000eA rather than \u000f\u000eFa/an\u000f\u000eA with superlative adjectives and with \u000f\u000eFfirst, last, next, only, right, same, \u000f\u000eAand\u000f\u000eF wrong\u000f\u000eI.\u000f","p":1},{"t":"eg","x":"\u000eEThis is \u000f\u000eHthe tallest building\u000f\u000eE in the city.\u000f","p":1},{"t":"eg","x":"\u000eEIs this \u000f\u000eHthe first time\u000f\u000eE you’ve been here?\u000f","p":1},{"t":"eg","x":"\u000eEI think you went \u000f\u000eHthe wrong way\u000f\u000eE there.\u000f","p":1}]},{"l":"G","b":[{"t":"rule","x":"\u000eAIn a generalization, we often use\u000f\u000eD a plural or uncountable noun without an article.\u000f","p":1},{"t":"eg","x":"\u000eEI hate \u000f\u000eHhospitals\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eHTime\u000f\u000eE costs \u000f\u000eHmoney\u000f\u000eE, you know.\u000f","p":1},{"t":"eg","x":"\u000eHBlackbirds\u000f\u000eE have a lovely song.\u000f","p":1},{"t":"rule","x":"\u000eAHere \u000f\u000eFblackbirds\u000f\u000eA means “all blackbirds.”\u000f","p":1},{"t":"rule","x":"\u000eAWe can use \u000f\u000eFa/an\u000f\u000eA in a generalization.\u000f","p":1},{"t":"eg","x":"\u000eHA computer\u000f\u000eE does what you tell it to do.\u000f","p":1},{"t":"eg","x":"\u000eHA blackbird\u000f\u000eE has a lovely song.\u000f","p":1},{"t":"rule","x":"\u000eAHere \u000f\u000eFa blackbird\u000f\u000eA means “any blackbird.”\u000f","p":1},{"t":"rule","x":"\u000eAWe can use \u000f\u000eFthe\u000f\u000eI + singular noun\u000f\u000eA to generalize in some contexts.\u000f","p":1},{"t":"eg","x":"\u000eHThe blackbird\u000f\u000eE has a lovely song.\u000f","p":1},{"t":"eg","x":"\u000eHThe customer\u000f\u000eE is always right.\u000f","p":1},{"t":"tip","x":"We use \u0001a/an\u0002 to classify people by job, e.g.: My sister is a doctor, not My sister is doctor."}]}]},{"n":97,"t":"Special uses of a/an and the","u":"Articles & Determiners","s":[{"l":"A","b":[{"t":"rule","x":"\u000eEWe go to \u000f\u000eHthe\u000f\u000eE cinema/theatre\u000f\u000eA even if we do not mean a specific one.\u000f","p":1},{"t":"eg","x":"\u000eEWe haven’t been to \u000f\u000eHthe cinema\u000f\u000eE for ages.\u000f","p":1},{"t":"eg","x":"\u000eALook at these examples with \u000f\u000eItelevision\u000f\u000eA and \u000f\u000eIradio\u000f\u000eA in a \u000f\u000eDgeneral\u000f\u000eA sense as a \u000f\u000eDmedium\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEMy friend has got a job in \u000f\u000eHtelevision\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEWe watch \u000f\u000eHtelevision\u000f\u000eE in the evenings.\u000f","p":1},{"t":"eg","x":"\u000eEWe sometimes listen to \u000f\u000eHthe radio.\u000f","p":1},{"t":"eg","x":"\u000eEWhat’s on \u000f\u000eHtelevision\u000f\u000eE / on \u000f\u000eHthe radio\u000f\u000eE?\u000f","note":"On the television is also possible.","p":1},{"t":"rule","x":"\u000eAWith the \u000f\u000eDphysical object\u000f\u000eAs, we use \u000f\u000eFa/an\u000f\u000eI or \u000f\u000eFthe\u000f\u000eD in the usual way:\u000f","p":1},{"t":"eg","x":"\u000eEThere was\u000f\u000eH a TV / a radio\u000f\u000eE on the shelf.\u000f","p":1},{"t":"eg","x":"\u000eEI turned on \u000f\u000eHthe television / the radio.\u000f","p":1},{"t":"rule","x":"\u000eAWe say \u000f\u000eFthe press\u000f\u000eA (newspapers) and \u000f\u000eFthe media\u000f\u000eA (TV, radio, newspapers, etc.):\u000f","p":1},{"t":"eg","x":"\u000eHThe media\u000f\u000eE love a nice scandal.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eAWith \u000f\u000eDmusical instruments\u000f\u000eA, we usually use \u000f\u000eFthe\u000f\u000eA for a general ability to play:\u000f","p":1},{"t":"eg","x":"\u000eECan you play t\u000f\u000eHhe piano?\u000f","p":1},{"t":"rule","x":"\u000eAWith \u000f\u000eDsports/game\u000f\u000eAs, we do not use \u000f\u000eFthe\u000f\u000eA:\u000f","p":1},{"t":"eg","x":"\u000eEDo you play \u000f\u000eHtennis\u000f\u000eE at school?\u000f","p":1},{"t":"eg","x":"\u000eEWe do \u000f\u000eHjudo\u000f\u000eE on Saturdays.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"\u000eAWe use \u000f\u000eFthe bus / the train\u000f\u000eA for a means of transport:\u000f","p":1},{"t":"eg","x":"\u000eEI usually go to work on \u000f\u000eHthe bus\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"But we say by bus / by train. ➤ 142E"}]},{"l":"D","b":[{"t":"rule","x":"\u000eFTown, country, countryside, sea, and seaside\u000f\u000eA usually have \u000f\u000eFthe\u000f\u000eA in a general meaning:\u000f","p":1},{"t":"eg","x":"\u000eEDo you live in \u000f\u000eHthe town\u000f\u000eE or\u000f\u000eH the country\u000f\u000eE?\u000f","p":1},{"t":"eg","x":"\u000eEI’d love a day at \u000f\u000eHthe seaside\u000f\u000eE.\u000f","note":"We do not mean a specific seaside place.","p":1},{"t":"rule","x":"These examples refer to specific places:"},{"t":"eg","x":"\u000eEIn the valley there’s \u000f\u000eHa\u000f\u000eE small \u000f\u000eHtown\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEWe want to see the sights of \u000f\u000eHthe town.\u000f","p":1},{"t":"eg","x":"\u000eHThe countryside \u000f\u000eEhere is beautiful.\u000f","note":"The countryside means the scenery in a specific country area.","p":1}]},{"l":"E","b":[{"t":"rule","x":"\u000eAWe can use \u000f\u000eFa/an\u000f\u000eA in expressions of \u000f\u000eDfrequency, price, and speed:\u000f","p":1},{"t":"eg","x":"\u000eEWe walk the dogs \u000f\u000eHtwice a day\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEThe material cost t\u000f\u000eHen pounds a metre\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEThe speed limit on motorways is \u000f\u000eHseventy miles an hour\u000f\u000eE.\u000f","p":1}]},{"l":"F","b":[{"t":"rule","x":"\u000eAWe can use \u000f\u000eFby the\u000f\u000eA to say \u000f\u000eDhow something is measured:\u000f","p":1},{"t":"eg","x":"\u000eEBoats can be hired \u000f\u000eHby the hour.\u000f","p":1},{"t":"eg","x":"\u000eECarpets are sold \u000f\u000eHby the square metre\u000f\u000eE.\u000f","p":1},{"t":"tip","x":"We usually say the police, e.g.: The police arrived in five minutes. But we can say a police officer, the policeman, etc."}]}]},{"n":98,"t":"A/an, some, the, and a noun on its own","u":"Articles & Determiners","s":[{"l":"A","b":[{"t":"rule","x":"\u000eAWe use \u000f\u000eFa/an\u000f\u000eD only with a singular countable noun\u000f\u000eA. With\u000f\u000eD a plural or uncountable\u000f\u000eA noun, we use \u000f\u000eFsome\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEThere’s \u000f\u000eHa rat\u000f\u000eE in the cellar.\u000f","p":1},{"t":"eg","x":"\u000eEThere are \u000f\u000eHsome rats\u000f\u000eE in the cellar.\u000f","p":1},{"t":"eg","x":"\u000eEThere’s \u000f\u000eHsome milk\u000f\u000eE in the fridge.\u000f","p":1},{"t":"rule","x":"\u000eFA rat\u000f\u000eA means one rat, \u000f\u000eFsome rats\u000f\u000eA means a number of rats, and \u000f\u000eFsome milk\u000f\u000eA means an amount of milk.\u000f","p":1},{"t":"rule","x":"\u000eAWe can sometimes leave out \u000f\u000eFsome\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEThere are \u000f\u000eHrats\u000f\u000eE in the cellar.\u000f","p":1},{"t":"eg","x":"\u000eEThere’s \u000f\u000eHmilk\u000f\u000eE in the fridge.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eAWe \u000f\u000eDdo not\u000f\u000eA use \u000f\u000eFsome\u000f\u000eA to classify or describe.\u000f","p":1},{"t":"eg","x":"\u000eEThose are \u000f\u000eHrats\u000f\u000eE, not mice.\u000f","p":1},{"t":"eg","x":"\u000eEIs this \u000f\u000eHmilk\u000f\u000eE or cream?\u000f","p":1},{"t":"eg","x":"\u000eEThey’re huge \u000f\u000eHrats\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEIt’s fresh \u000f\u000eHmilk\u000f\u000eE.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"\u000eAWe can use an \u000f\u000eDuncountable or plural noun on its own\u000f\u000eA to make a \u000f\u000eDgeneralization\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eHSugar\u000f\u000eE is bad for your teeth.\u000f","p":1},{"t":"eg","x":"\u000eHLife\u000f\u000eE isn’t fair, is it?\u000f","p":1},{"t":"eg","x":"\u000eHChildren\u000f\u000eE can be cruel sometimes.\u000f","p":1},{"t":"rule","x":"\u000eAWhen \u0001the\u0002 meaning is \u000f\u000eDmore specific\u000f\u000eA, we use \u000f\u000eFthe\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eECould you pass \u000f\u000eHthe sugar\u000f\u000eE, please?\u000f","p":1},{"t":"eg","x":"\u000eET\u000f\u000eHhe life\u000f\u000eE of a hill farmer isn’t easy.\u000f","p":1},{"t":"eg","x":"\u000eHThe children\u000f\u000eE are playing in the garden.\u000f","p":1},{"t":"rule","x":"\u000eAWe also often use \u000f\u000eFthe\u000f\u000eA when there is a phrase after \u0001the\u0002 noun which makes the meaning more specific. We say \u000f\u000eILife…\u000f\u000eA (in general) but \u000f","p":1},{"t":"rule","x":"\u000eIThe life of…\u000f\u000eA (a specific person or group of people).\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"Compare these patterns:"},{"t":"rule","x":"\u000eEa book on \u000f\u000eHIrish history\u000f","p":1},{"t":"rule","x":"\u000eEa book on \u000f\u000eHthe history of Ireland\u000f","p":1},{"t":"rule","x":"\u000eEstudying \u000f\u000eHAmerican literature\u000f","p":1},{"t":"rule","x":"\u000eEstudying \u000f\u000eHthe literature of America\u000f","p":1},{"t":"rule","x":"\u000eAWe can use an\u000f\u000eD adjective + noun\u000f\u000eA without \u000f\u000eFthe\u000f\u000eA, or \u000f\u000eFthe\u000f\u000eA + noun with an \u000f\u000eF*of-*phrase.\u000f","p":1},{"t":"rule","x":"The same thing happens with a noun modifier or a possessive form."},{"t":"eg","x":"town planning / \u0004the\u0005 planning of towns"},{"t":"eg","x":"Mozart’s music / \u0004the\u0005 music of Mozart"}]},{"l":"E","b":[{"t":"rule","x":"\u000eABefore a \u000f\u000eFnoun + *of-*phrase\u000f\u000eA we usually use \u000f\u000eFthe\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eHThe safety of passengers\u000f\u000eE is our priority.\u000f","p":1},{"t":"rule","x":"\u000eABut with \u000f\u000eDother prepositions\u000f\u000eA, we can use a noun on its own if the meaning is general.\u000f","p":1},{"t":"eg","x":"\u000eHSafety on the railways\u000f\u000eE is our priority.\u000f","p":1},{"t":"eg","x":"\u000eHLife in those days\u000f\u000eE wasn’t easy.\u000f","p":1},{"t":"tip","x":"Many proverbs and sayings begin with an uncountable noun on its own, e.g.: Life is sweet. Money is the root of all evil. Love makes the world go round."}]}]},{"n":99,"t":"A singular noun on its own","u":"Articles & Determiners","s":[{"l":"","b":[{"t":"rule","x":"\u000eABefore \u0001a\u0002 \u000f\u000eDsingular\u000f\u000eA noun, we normally put a word like \u000f\u000eFa, \u0001the\u0002, \u0001my\u0002\u000f\u000eD,\u000f\u000eA etc. But there are some \u000f\u000eDexceptions\u000f\u000eA.\u000f","p":1}]},{"l":"A","b":[{"t":"rule","x":"\u000eASome nouns can be without \u000f\u000eFthe\u000f\u000eA when we talk about their normal purpose.\u000f","p":1},{"t":"rule","x":"These include places of education (\u0001school\u0002, \u0001college\u0002, \u0001university\u0002), places of worship (especially church and mosque), and other public institutions (prison, jail, court, hospital)."},{"t":"eg","x":"\u000eHSchool\u000f\u000eE starts at nine o’clock.\u000f","p":1},{"t":"eg","x":"\u000eEThe guilty men were sent to \u000f\u000eHprison\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eAHere \u000f\u000eEschool\u000f\u000eA means “school activities” and people are \u000f\u000eEsent to prison\u000f\u000eA for their crimes.\u000f","p":1},{"t":"rule","x":"\u000eABut when we talk about a specific \u000f\u000eEbuilding\u000f\u000eA, we use \u000f\u000eDthe\u000f\u000eA:\u000f","p":1},{"t":"eg","x":"\u000eHThe school\u000f\u000eE is in the centre of the village. \u000f\u000eA(the school building)\u000f","p":1},{"t":"eg","x":"\u000eEMail is delivered to \u000f\u000eHthe prison\u000f\u000eE every day.\u000f\u000eA (the prison building)\u000f","p":1},{"t":"rule","x":"\u000eAWe use an article if there is a \u000f\u000eDword or phrase modifying the noun\u000f\u000eA:\u000f","p":1},{"t":"eg","x":"\u000eEThey are in\u000f\u000eH a high-security prison.\u000f","p":1},{"t":"eg","x":"\u000eEI’m doing a course at \u000f\u000eHthe new college\u000f\u000eE.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eFWork, home, town, bed\u000f\u000eD, \u000f\u000eAand \u000f\u000eFsea\u000f\u000eA can also be used without an article:\u000f","p":1},{"t":"eg","x":"\u000eEI was on my way to \u000f\u000eHwork\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEWe left \u000f\u000eHhome\u000f\u000eE at eight o’clock.\u000f","p":1},{"t":"rule","x":"Compare these sentences:"},{"t":"eg","x":"\u000eEI’m usually \u000f\u000eHin bed\u000f\u000eE by eleven.\u000f","p":1},{"t":"eg","x":"\u000eHThe bed\u000f\u000eE felt very uncomfortable.\u000f","p":1},{"t":"rule","x":"\u000eFIn bed\u000f\u000eA means “sleeping/resting in a bed,” but \u000f\u000eFthe bed\u000f\u000eA means a specific bed.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"\u000eAWe sometimes use \u000f\u000eDno article\u000f\u000eA with\u000f\u000eD a repeated noun or two nouns in contrast.\u000f","p":1},{"t":"eg","x":"\u000eEI lie awake \u000f\u000eHnight after night.\u000f","p":1},{"t":"eg","x":"\u000eEIt was a fiasco from \u000f\u000eHstart to finish.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"\u000eAWe often use no article for a \u000f\u000eDunique\u000f\u000eA role after \u000f\u000eFelect, \u0001appoint\u0002, \u0001make\u0002\u000f\u000eD,\u000f\u000eA and after \u000f\u000eFas\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"The young woman was elected leader."},{"t":"eg","x":"\u0004As\u0005 chairman, I have to keep order."},{"t":"eg","x":"\u000eAIf the role is \u000f\u000eDnot unique\u000f\u000eA, use \u000f\u000eDa/an\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eHAs a member\u000f\u000eE of the club, I have a vote.\u000f","p":1}]},{"l":"E","b":[{"t":"rule","x":"\u000eAWith two nouns \u000f\u000eDclosely linked\u000f\u000eA, we can leave out an article to avoid repeating it.\u000f","p":1},{"t":"eg","x":"\u000eEPut \u000f\u000eHthe knife\u000f\u000eE and \u000f\u000eHfork\u000f\u000eE on the tray.\u000f","p":1},{"t":"rule","x":"\u000eAIf there is \u000f\u000eDno link,\u000f\u000eA we repeat the article.\u000f","p":1},{"t":"eg","x":"\u000eEI bought \u000f\u000eHa sweate\u000f\u000eEr and\u000f\u000eH a book.\u000f","p":1}]},{"l":"F","b":[{"t":"rule","x":"We also use a singular noun on its own in some prepositional phrases (e.g. on Thursday ➤100, by train ➤142E) and in some styles such as instructions (➤16F)."},{"t":"tip","x":"\u000eAAmericans use \u000f\u000eFthe\u000f\u000eA with \u000f\u000eFhospital\u000f\u000eA and \u000f\u000eFuniversity\u000f\u000eA:\u000f","p":1},{"t":"rule","x":"\u000eDGB: \u000f\u000eEMy sister is in hospital.\u000f","p":1},{"t":"rule","x":"\u000eDUS: \u000f\u000eEMy sister is in the hospital.\u000f","p":1}]}]},{"n":100,"t":"A/an and the in phrases of time","u":"Articles & Determiners","s":[{"l":"A","b":[{"t":"sub","x":"Introduction"},{"t":"rule","x":"\u000eAIn a phrase of time we often use \u000f\u000eDa singular noun without an article.\u000f","p":1},{"t":"eg","x":"in winter  —  on Monday"},{"t":"rule","x":"\u000eABut we use an\u000f\u000eD article with an adjective\u000f\u000eA or if there is a\u000f\u000eD phrase after the noun\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"a cold winter  —  the Monday before last"},{"t":"rule","x":"\u000eASee \u000f\u000eCB–H\u000f\u000eA for the various kinds of phrase.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"Years"},{"t":"eg","x":"in 2004  —  from 1939 to 1945"},{"t":"rule","x":"\u000eABut: \u000f\u000eEin \u000f\u000eHthe year 1066\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"Seasons and months"},{"t":"eg","x":"\u000eHSpring\u000f\u000eE is on the way.\u000f","p":1},{"t":"eg","x":"\u000eEIt’s nice here in (\u000f\u000eHthe\u000f\u000eE) \u000f\u000eHsummer\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEThe elections are in \u000f\u000eHMarch\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"But: a hot summer  —  the winter of 2002"}]},{"l":"D","b":[{"t":"sub","x":"Special times of the year"},{"t":"eg","x":"\u000eEI don’t enjoy \u000f\u000eHChristmas\u000f\u000eE much.\u000f","p":1},{"t":"eg","x":"\u000eEAmericans eat turkey at \u000f\u000eHThanksgiving\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eABut: \u000f\u000eEIt was \u000f\u000eHa Christmas\u000f\u000eE I won’t forget.\u000f","p":1}]},{"l":"E","b":[{"t":"sub","x":"Days of the week"},{"t":"eg","x":"\u000eEOur visitors are coming on \u000f\u000eHTuesday\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"But:"},{"t":"eg","x":"\u000eEIt’ll be \u000f\u000eHthe Tuesda\u000f\u000eEy before my holiday.\u000f","p":1},{"t":"eg","x":"\u000eEThis happened on \u000f\u000eHa Friday in July.\u000f","p":1},{"t":"eg","x":"\u000eEI’ll see you at \u000f\u000eHthe weekend.\u000f","p":1}]},{"l":"F","b":[{"t":"sub","x":"Parts of the day and night"},{"t":"eg","x":"\u000eEThey reached the camp at \u000f\u000eHsunset\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEWe’ll be home before \u000f\u000eHdark\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"But:"},{"t":"sub","x":"\u000eEIt was \u000f\u000eHa wonderful sunset.\u000f","p":1},{"t":"eg","x":"\u000eEI couldn’t see in \u000f\u000eHthe dark.\u000f","p":1},{"t":"rule","x":"In time phrases we normally use these nouns on their own:"},{"t":"eg","x":"dawn, daybreak, sunrise; midday, noon; dusk, sunset, twilight; dark, nightfall, midnight."},{"t":"rule","x":"\u000eABut we use an article for the\u000f\u000eD physical aspect,\u000f\u000eA e.g.\u000f\u000eE not being able to see in \u000f\u000eHthe\u000f\u000eE dark.\u000f","p":1}]},{"l":"G","b":[{"t":"sub","x":"Meals"},{"t":"eg","x":"\u000eHBreakfast\u000f\u000eE is from seven o’clock.\u000f","p":1},{"t":"eg","x":"\u000eEI had a sandwich for \u000f\u000eHlunch\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"But:"},{"t":"eg","x":"\u000eHThe breakfast\u000f\u000eE they gave us was awful.\u000f","p":1},{"t":"eg","x":"\u000eEThey all had \u000f\u000eHa\u000f\u000eE delicious \u000f\u000eHlunch\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eHThe meal\u000f\u000eE was perfect.\u000f","p":1}]},{"l":"H","b":[{"t":"sub","x":"\u000eGLast\u000f\u000eC and \u000f\u000eGnext\u000f","p":1},{"t":"eg","x":"\u000eEThese flats were built \u000f\u000eHlast year.\u000f","p":1},{"t":"eg","x":"\u000eEThe party is \u000f\u000eHnext Saturday.\u000f","p":1},{"t":"rule","x":"\u000eABut: \u000f\u000eHthe\u000f\u000eE previous \u000f\u000eHyear\u000f\u000eE, t\u000f\u000eHhe year\u000f\u000eE before, \u000f\u000eHthe\u000f\u000eE following \u000f\u000eHSaturday\u000f\u000eE, (\u000f\u000eHthe\u000f\u000eE) next \u000f\u000eHday\u000f\u000eE.\u000f","p":1},{"t":"tip","x":"When seen from the present: \u0001yesterday\u0002, tomorrow (no article). When seen from the past: the day before/after (with article)."}]}]},{"n":101,"t":"Names","u":"Articles & Determiners","s":[{"l":"A","b":[{"t":"rule","x":"\u000eANames of people and most place names are without \u000f\u000eFthe\u000f\u000eA.\u000f","p":1},{"t":"table","rows":[["Lucy","Mr Smith     Doctor Fry" ss it has one of these patterns or you know that the \u0001the\u0002 is correct."}]}]},{"n":102,"t":"Possessives","u":"Articles & Determiners","s":[{"l":"A","b":[{"t":"rule","x":"\u000eAThese are the forms of the possessive \u000f\u000eDdeterminers and pronouns.\u000f","p":1},{"t":"eg","x":"Person  —  Determiners  —  Pronouns"},{"t":"sub","x":"Singular"},{"t":"table","rows":[["First","\u000eJMy\u000f\u000eA book\u000f","Mine"],["Second","\u000eJYou\u000f\u000eA number\u000f","Yours"],["Third","\u000eJHis\u000f\u000eA father\u000f","His"],["","\u000eJHer\u000f\u000eA decision\u000f","Hers"]]},{"t":"rule","x":"\u000eJIts\u000f\u000eA location\u000f","p":1},{"t":"sub","x":"Plural"},{"t":"table","rows":[["First","\u000eJOur\u000f\u000eA house\u000f","Ours"],["Second","\u000eJYour\u000f\u000eA coats\u000f","Yours"],["Third","\u000eJTheir\u000f\u000eA attitude\u000f","theirs"]]},{"t":"eg","x":"\u000eFHis\u000f\u000eA is male, and \u000f\u000eFher\u000f\u000eA is female.\u000f","p":1},{"t":"eg","x":"Ben’s / his pen  —  Emma’s / her dad"},{"t":"rule","x":"\u000eFIts\u000f\u000eA refers to something not human.\u000f","p":1},{"t":"eg","x":"\u000eEthe roof of the car\u000f\u000eB / \u000f\u000eHits\u000f\u000eE roof\u000f","p":1},{"t":"eg","x":"\u000eEthe country’s exports\u000f\u000eB / \u000f\u000eHits\u000f\u000eE exports\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"We use possessives for a connection, often the fact that someone has something."},{"t":"eg","x":"\u000eHmy\u000f\u000eE bag\u000f\u000eA (the bag that belongs to me)\u000f","p":1},{"t":"rule","x":"Possessive determiners come before a noun."},{"t":"eg","x":"\u000eEHave you got \u000f\u000eHyour diary\u000f\u000eE?\u000f","p":1},{"t":"rule","x":"\u000eAWe use a pronoun on its own \u000f\u000eDwithout a noun\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI’ve got my diary. Have you got \u000f\u000eHyours\u000f\u000eE?\u000f","p":1},{"t":"eg","x":"\u000eEThose CDs are \u000f\u000eHmine\u000f\u000eE.\u000f","p":
