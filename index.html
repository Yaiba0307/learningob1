speech went on \u000f\u000eHtoo long\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"Compare these positive statements."},{"t":"eg","x":"\u000eEI had to wait\u000f\u000eH a long time.\u000f","p":1},{"t":"eg","x":"\u000eEIt’s\u000f\u000eH a long way\u000f\u000eE to walk.\u000f","p":1}]},{"l":"G","b":[{"t":"sub","x":"\u000eLAfter\u000f\u000eC and \u000f\u000eLAfterwards\u000f","p":1},{"t":"rule","x":"\u000eAWe use \u000f\u000eFafterwards\u000f\u000eA or \u000f\u000eFafter that\u000f\u000eA as an adverb rather than \u000f\u000eFafter\u000f\u000eD.\u000f","p":1},{"t":"eg","x":"\u000eEWe discussed the film \u000f\u000eHafterwards\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eABut we say \u000f\u000eDt\u000f\u000eEhe day after, soon after\u000f\u000eD,\u000f\u000eA etc.\u000f","p":1},{"t":"eg","x":"\u000eEI ordered a CD and it came \u000f\u000eHthe day after\u000f\u000eE.\u000f","p":1},{"t":"tip","x":"\u000eAAn adverbial can also modify a noun, e.g. \u000f\u000eEExports \u000f\u000eHlast year\u000f\u000eE broke all records.\u000f","p":1}]}]},{"n":126,"t":"Adverbials of frequency","u":"Adverbials","s":[{"l":"A","b":[{"t":"rule","x":"An adverb of frequency says how often something happens. It usually goes in mid position."},{"t":"eg","x":"\u000eEWe \u000f\u000eHsometimes\u000f\u000eE eat out.\u000f","p":1},{"t":"eg","x":"\u000eEThe bus doesn’t \u000f\u000eHusually\u000f\u000eE stop here.\u000f","p":1},{"t":"eg","x":"\u000eEI can \u000f\u000eHnever\u000f\u000eE open these packets.\u000f","p":1},{"t":"rule","x":"\u000eAThese adverbs include: \u000f\u000eEalways; normally, usually; often, frequently; sometimes, occasionally; seldom, rarely; never, ever.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eAIn mid position, \u000f\u000eFsometimes, \u0001occasionally\u0002\u000f\u000eD,\u000f\u000eA and \u000f\u000eFfrequently\u000f\u000eA go before a negative auxiliary.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHsometimes don’t\u000f\u000eE have any lunch.\u000f","p":1},{"t":"rule","x":"\u000eAAs a general rule, \u000f\u000eFalways, \u0001often\u0002, \u0001normally\u0002\u000f\u000eD,\u000f\u000eA and \u000f\u000eFusually\u000f\u000eA go after the negative auxiliary.\u000f","p":1},{"t":"rule","x":"\u000eEYou \u000f\u000eHcan’t always\u000f\u000eE get a seat on the bus.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHdon’t normally\u000f\u000eE come this way.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"Some adverbs of frequency can go in front or end position."},{"t":"eg","x":"\u000eHNormally\u000f\u000eE I tip my hairdresser.\u000f","p":1},{"t":"eg","x":"\u000eEWe all make mistakes \u000f\u000eHsometimes\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eAThese adverbs are \u000f\u000eEnormally, usually, generally, frequently, sometimes\u000f\u000eD,\u000f\u000eA and \u000f\u000eEoccasionally\u000f\u000eD.\u000f","p":1},{"t":"rule","x":"\u000eFOften\u000f\u000eA can go in end position, especially with \u000f\u000eFvery\u000f\u000eA or \u000f\u000eFquite\u000f\u000eD.\u000f\u000eF \u0001A lot\u0002\u000f\u000eA takes end position.\u000f","p":1},{"t":"eg","x":"\u000eEDo you come here \u000f\u000eHoften / a lot?\u000f","p":1},{"t":"eg","x":"\u000eEI see Laura quite \u000f\u000eHoften\u000f\u000eE / quite \u000f\u000eHa lot.\u000f","p":1},{"t":"rule","x":"\u000eAIn instructions, \u000f\u000eFalways\u000f\u000eA and \u000f\u000eFnever\u000f\u000eA go in front position.\u000f","p":1},{"t":"eg","x":"\u000eHAlways\u000f\u000eE switch the machine off after use.\u000f","p":1},{"t":"eg","x":"\u000eHNever\u000f\u000eE leave luggage unattended.\u000f","p":1}]},{"l":"D","b":[{"t":"eg","x":"\u000eFNever\u000f\u000eA (= not ever) is a negative word.\u000f","p":1},{"t":"eg","x":"\u000eEWe \u000f\u000eHnever\u000f\u000eE ask for your password.\u000f","note":"We don’t ever ask for your password.","p":1},{"t":"rule","x":"\u000eAWe use \u000f\u000eFever\u000f\u000eA mainly in questions.\u000f","p":1},{"t":"eg","x":"\u000eEHave you \u000f\u000eHever\u000f\u000eE been to Australia?\u000f","p":1},{"t":"rule","x":"We also use it with negative words."},{"t":"eg","x":"\u000eEI would\u000f\u000eHn’t ever\u000f\u000eE do a thing like that.\u000f","p":1},{"t":"eg","x":"Nothing \u0004ever\u0005 happens in this place."},{"t":"rule","x":"Or we can use it in a condition or a comparison."},{"t":"eg","x":"\u000eHIf\u000f\u000eE you \u000f\u000eHever\u000f\u000eE want a chat, just drop in.\u000f","p":1},{"t":"eg","x":"\u000eEThe river was higher \u000f\u000eHthan\u000f\u000eE I’d \u000f\u000eHever\u000f\u000eE seen it.\u000f","p":1}]},{"l":"E","b":[{"t":"rule","x":"\u000eAWe can use a phrase with \u000f\u000eFevery, \u0001most\u0002\u000f\u000eD,\u000f\u000eA or \u000f\u000eFsome\u000f\u000eA in front or end position.\u000f","p":1},{"t":"eg","x":"\u000eHEvery summer\u000f\u000eE we all go sailing together.\u000f","p":1},{"t":"eg","x":"\u000eEThe postman calls \u000f\u000eHmost days.\u000f","p":1},{"t":"eg","x":"\u000eHSome mornings\u000f\u000eE it’s hard to get up.\u000f","p":1},{"t":"rule","x":"\u000eAWe also use \u000f\u000eFonce, twice, three times\u000f\u000eD,\u000f\u000eA etc. in this pattern.\u000f","p":1},{"t":"eg","x":"\u000eEThe group meets \u000f\u000eHonce a month.\u000f","p":1},{"t":"eg","x":"\u000eEOne tablet to be taken \u000f\u000eHthree times a day.\u000f","p":1},{"t":"tip","x":"\u0001Seldom\u0002 and \u0001rarely\u0002 are a little formal. Instead of I seldom watch TV, say I don’t often watch TV."}]}]},{"n":127,"t":"Adverbs of degree","u":"Adverbials","s":[{"l":"A","b":[{"t":"rule","x":"We can use an adverb of degree before an adjective or before another adverb."},{"t":"eg","x":"\u000eEIt’s a \u000f\u000eHvery\u000f\u000eE simple idea.\u000f","p":1},{"t":"eg","x":"\u000eEIt’s getting \u000f\u000eHa bit\u000f\u000eE hot in here.\u000f","p":1},{"t":"eg","x":"\u000eEThe time passed \u000f\u000eHquite\u000f\u000eE quickly.\u000f","p":1},{"t":"eg","x":"\u000eEWe must leave \u000f\u000eHfairly\u000f\u000eE soon.\u000f","p":1},{"t":"rule","x":"These adverbs include: absolutely, completely, totally; extremely, very, really, awfully, too; fairly, pretty, quite, rather, somewhat; a bit, a little, slightly; hardly; (not) at all."}]},{"l":"B","b":[{"t":"eg","x":"\u000eFSomewhat, a little, a bit,\u000f\u000eA and \u000f\u000eFslightly\u000f\u000eA usually go with undesirable qualities.\u000f","p":1},{"t":"eg","x":"\u000eEThe journey was \u000f\u000eHsomewhat stressful.\u000f","note":"not The journey was somewhat enjoyable.","p":1},{"t":"rule","x":"But we can use a desirable quality with the comparative form."},{"t":"eg","x":"\u000eEI was feeling \u000f\u000eHsomewhat better.\u000f","p":1},{"t":"rule","x":"\u000eAOther adverbs that can go before a comparative include: \u000f\u000eEa bit, a little, a lot, any, much, no, rather, slightly.\u000f","p":1},{"t":"eg","x":"\u000eELet’s try to go \u000f\u000eHa bit\u000f\u000eE faster.\u000f","p":1},{"t":"eg","x":"\u000eEThis gadget makes the job \u000f\u000eHmuch\u000f\u000eE easier.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"An adverb of degree can modify a verb."},{"t":"eg","x":"\u000eEI was \u000f\u000eHnearly\u000f\u000eE dying of thirst.\u000f","p":1},{"t":"eg","x":"\u000eEDo you \u000f\u000eHreally\u000f\u000eE think so?\u000f","p":1},{"t":"eg","x":"\u000eEThe man \u000f\u000eHabsolutely\u000f\u000eE refused to move.\u000f","p":1},{"t":"rule","x":"Those in mid position include: absolutely, almost, completely, hardly, just, nearly, quite, rather, really, totally. Some can also go in end position."},{"t":"eg","x":"\u000eEI forgot the time \u000f\u000eHcompletely\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eEAlmost, \u0001just\u0002,\u000f\u000eA and \u000f\u000eEnearly\u000f\u000eA go before a negative auxiliary.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHjust\u000f\u000eE don’t understand, I’m afraid.\u000f","p":1},{"t":"rule","x":"\u000eAThese adverbs always go in end position: \u000f\u000eEa bit, a little, a lot, awfully, more, (the) most, terribly.\u000f","p":1},{"t":"eg","x":"\u000eEFirst impressions matter\u000f\u000eH a lot.\u000f","p":1},{"t":"eg","x":"\u000eEI miss you \u000f\u000eHterribly\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eAWe can use \u000f\u000eE(\u0001very) much\u0002\u000f\u000eA in a negative sentence or question.\u000f","p":1},{"t":"eg","x":"\u000eEI didn’t enjoy the meal (very) \u000f\u000eHmuch\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eABut in a positive sentence we\u000f\u000eD \u0001do not\u0002\u000f\u000eA use \u000f\u000eEmuch\u000f\u000eA on its own.\u000f","p":1},{"t":"eg","x":"\u000eEI enjoyed the meal \u000f\u000eHvery much.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"Some adverbs can modify a preposition."},{"t":"eg","x":"\u000eEThe office is\u000f\u000eH right in\u000f\u000eE the city centre.\u000f","p":1},{"t":"rule","x":"Some can modify a quantifier."},{"t":"eg","x":"\u000eHVery few\u000f\u000eE people would agree.\u000f","p":1},{"t":"eg","x":"\u000eEI’ve made\u000f\u000eH quite a lot of\u000f\u000eE mistakes.\u000f","p":1},{"t":"tip","x":"We use \u0001not very\u0002 for a small degree or a negative judgement. Say The photos aren’t very good rather than They aren’t good or They’re bad."}]}]},{"n":128,"t":"Too, enough, quite, rather, and such","u":"Adverbials","s":[{"l":"A","b":[{"t":"rule","x":"\u000eFToo\u000f\u000eA comes before an adjective or adverb.\u000f","p":1},{"t":"eg","x":"\u000eEThe water is \u000f\u000eHtoo cold\u000f\u000eE to swim in.\u000f","p":1},{"t":"eg","x":"\u000eEHang on. You’re going \u000f\u000eHtoo fast.\u000f","p":1},{"t":"eg","x":"\u000eEThis coat is much \u000f\u000eHtoo big\u000f\u000eE for me.\u000f","p":1},{"t":"rule","x":"\u000eDEnough\u000f\u000eA follows an adjective or adverb.\u000f","p":1},{"t":"eg","x":"\u000eEThe water isn’t \u000f\u000eHwarm enough\u000f\u000eE to swim in.\u000f","p":1},{"t":"eg","x":"\u000eEI didn’t react \u000f\u000eHquickly enough.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eAWe can use most adverbs of degree after \u000f\u000eFa/an\u000f\u000eA, e.g\u000f\u000eI. \u000f\u000eFa very warm welcome\u000f\u000eA or \u000f\u000eFa fairly big crowd\u000f\u000eD.\u000f\u000eA But we do not use \u000f\u000eFso\u000f\u000eA in this position. \u000f","p":1},{"t":"rule","x":"\u000eAInstead, we use this pattern with \u000f\u000eFsuch\u000f\u000eD.\u000f","p":1},{"t":"eg","x":"\u000eEWe received \u000f\u000eHsuch a warm\u000f\u000eE welcome.\u000f","p":1},{"t":"wrong","x":"a \u0004so\u0005 warm welcome"},{"t":"rule","x":"\u000eAWe use the same pattern with \u000f\u000eFquite\u000f\u000eD.\u000f","p":1},{"t":"eg","x":"\u000eEThere was \u000f\u000eHquite a big\u000f\u000eE crowd.\u000f","p":1},{"t":"rule","x":"\u000eFA quite big crowd\u000f\u000eA is less usual. But with \u000f\u000eFrather\u000f\u000eA, both patterns are possible.\u000f","p":1},{"t":"rule","x":"\u000eHa rather big\u000f\u000eE crowd / \u000f\u000eHrather a big\u000f\u000eE crowd\u000f","p":1},{"t":"rule","x":"\u000eAWe can also use \u000f\u000eFsuch/quite/rather + a/an + noun\u000f\u000eA without an adjective.\u000f","p":1},{"t":"eg","x":"\u000eEDon’t make \u000f\u000eHsuch a fuss.\u000f","p":1},{"t":"eg","x":"\u000eEWe had to wait \u000f\u000eHquite a while.\u000f","p":1},{"t":"eg","x":"\u000eEIt’s \u000f\u000eHrather a pity\u000f\u000eE we can’t go.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"\u000eFToo\u000f\u000eD or \u000f\u000eFas\u000f\u000eD + \u000f\u000eFadjective\u000f\u000eA go before \u000f\u000eFa/an\u000f\u000eI.\u000f","p":1},{"t":"eg","x":"\u000eEYou’ve cut \u000f\u000eHtoo short a\u000f\u000eE piece.\u000f","p":1},{"t":"eg","x":"\u000eEYou don’t get \u000f\u000eHas nice a\u000f\u000eE view from here.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"\u000eFQuite\u000f\u000eA means ‘fairly’ when it comes before a gradable adjective.\u000f","p":1},{"t":"eg","x":"\u000eEThe task is \u000f\u000eHquite difficult.\u000f","p":1},{"t":"eg","x":"\u000eEThe film was \u000f\u000eHquite good.\u000f","p":1},{"t":"rule","x":"\u000eAIn British English, \u000f\u000eFquite\u000f\u000eA before an ungradable adjective means ‘completely’.\u000f","p":1},{"t":"eg","x":"\u000eEThe task is\u000f\u000eH quite impossible.\u000f","p":1},{"t":"eg","x":"\u000eEThe film was \u000f\u000eHquite brilliant.\u000f","p":1},{"t":"rule","x":"\u000eFNot quite\u000f\u000eA means ‘not completely’.\u000f","p":1},{"t":"eg","x":"\u000eEI’m \u000f\u000eHnot quite\u000f\u000eE ready yet.\u000f","p":1},{"t":"rule","x":"\u000eFQuite\u000f\u000eA is not usually stressed.\u000f","p":1},{"t":"eg","x":"It’s \u0004quite\u0005 WARM today."},{"t":"rule","x":"\u000eAHere we focus on the warmth. But when we stress \u000f\u000eFquite\u000f\u000eA, we limit the force of the next word.\u000f","p":1},{"t":"eg","x":"It’s \u0004QUITE\u0005 warm, but not VERY warm."}]},{"l":"E","b":[{"t":"rule","x":"--"},{"t":"eg","x":"\u000eFQuite\u000f\u000eA and \u000f\u000eFrather\u000f\u000eA have a similar meaning, but we tend to use \u000f\u000eFquite\u000f\u000eA for favourable comments and \u000f\u000eFrather\u000f\u000eA for unfavourable ones.\u000f","p":1},{"t":"eg","x":"\u000eEIt was \u000f\u000eHquite a good\u000f\u000eE party, wasn’t it?\u000f","p":1},{"t":"eg","x":"\u000eEIt was \u000f\u000eHrather a dull\u000f\u000eE party, wasn’t it?\u000f","p":1},{"t":"rule","x":"\u000eFRather\u000f\u000eA in a favourable comment often means ‘to a surprising degree’.\u000f","p":1},{"t":"eg","x":"\u000eEIn fact the test paper was \u000f\u000eHrather easy\u000f\u000eE.\u000f","p":1},{"t":"tip","x":"You can use \u0001quite\u0002 with a verb. I quite enjoyed the film expresses a positive opinion, although not as positive as I really enjoyed it."}]}]},{"n":129,"t":"Focus, viewpoint, and truth adverbials","u":"Adverbials","s":[{"l":"A","b":[{"t":"sub","x":"\u000eLOnly\u000f\u000eC and \u000f\u000eLeven\u000f","p":1},{"t":"rule","x":"\u000eAWe can use \u000f\u000eFonly\u000f\u000eA and \u000f\u000eFeven\u000f\u000eA to focus on a word or phrase. We can put \u000f\u000eFonly\u000f\u000eA before the relevant word or phrase.\u000f","p":1},{"t":"eg","x":"\u000eEWe’re here for \u000f\u000eHonly\u000f\u000eE two days.\u000f","p":1},{"t":"eg","x":"\u000eEI speak \u000f\u000eHonly\u000f\u000eE a little French.\u000f","p":1},{"t":"rule","x":"\u000eFOnly\u000f\u000eA can also be in mid position.\u000f","p":1},{"t":"eg","x":"\u000eEWe’re \u000f\u000eHonly\u000f\u000eE here for two days.\u000f","p":1},{"t":"eg","x":"\u000eEI \u000f\u000eHonly\u000f\u000eE speak a little French.\u000f","p":1},{"t":"rule","x":"\u000eAIn official written English, \u000f\u000eFonly\u000f\u000eA comes after the word or phrase focused on.\u000f","p":1},{"t":"eg","x":"\u000eEWaiting limited to 30 minutes \u000f\u000eHonly\u000f\u000eE. \u000f","p":1},{"t":"eg","x":"\u000eEMembers \u000f\u000eHonly \u000f\u000eA(a notice)\u000f","p":1},{"t":"rule","x":"\u000eFEven\u000f\u000eA goes in mid position or before the relevant word or phrase.\u000f","p":1},{"t":"eg","x":"\u000eEEmma travels a lot. She’s \u000f\u000eHeven\u000f\u000eE been to the North Pole.\u000f","p":1},{"t":"eg","x":"\u000eEI never watch TV. I don’t \u000f\u000eHeven\u000f\u000eE own a set.\u000f","p":1},{"t":"eg","x":"\u000eEJack always wears shorts, \u000f\u000eHeven\u000f\u000eE in winter.\u000f","p":1},{"t":"eg","x":"\u000eEIt was warm yesterday, and it’s \u000f\u000eHeven\u000f\u000eE warmer today.\u000f","p":1},{"t":"rule","x":"\u000eAWhen we focus on the subject, we put \u000f\u000eFonly\u000f\u000eA or \u000f\u000eFeven\u000f\u000eA before it.\u000f","p":1},{"t":"eg","x":"\u000eHOnly you\u000f\u000eE would do a silly thing like that.\u000f","p":1},{"t":"eg","x":"\u000eHEven the experts\u000f\u000eE don’t know the answer.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"Viewpoint adverbials"},{"t":"rule","x":"These express the idea that we are looking at a situation from a particular aspect."},{"t":"eg","x":"\u000eHFinancially\u000f\u000eE, we’ve had a difficult year.\u000f","p":1},{"t":"eg","x":"\u000eEIt’s a good move for me \u000f\u000eHfrom a career point of view.\u000f","p":1},{"t":"eg","x":"\u000eHAs far as the weather is concerned\u000f\u000eE, I’m not very optimistic.\u000f","p":1},{"t":"rule","x":"These adverbials go in front or end position and can modify an adjective."},{"t":"eg","x":"\u000eEThe plan is \u000f\u000eHenvironmentally\u000f\u000eE disastrous.\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"Truth adverbials"},{"t":"rule","x":"These say how likely a statement is to be true, or in what way it is true."},{"t":"eg","x":"\u000eHPerhaps/Maybe\u000f\u000eE it’s a software problem.\u000f","p":1},{"t":"eg","x":"\u000eEWe’re \u000f\u000eHcertainly/definitely\u000f\u000eE on course.\u000f","p":1},{"t":"eg","x":"\u000eEYou’ve got satnav, \u000f\u000eHpresumably\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eHClearly\u000f\u000eE, the matter is urgent.\u000f","p":1},{"t":"rule","x":"Most of these adverbs can go in front, mid, or end position. \u0001Certainly\u0002, \u0001definitely\u0002, and probably usually go in mid position. But we put a truth adverb before a negative auxiliary."},{"t":"eg","x":"\u000eEThe company \u000f\u000eHbasically\u000f\u000eE isn’t interested.\u000f","p":1},{"t":"rule","x":"We can also use a prepositional phrase."},{"t":"eg","x":"\u000eHIn my opinion\u000f\u000eE it’s a great idea.\u000f","p":1},{"t":"eg","x":"\u000eEThe results are good \u000f\u000eHon the whole.\u000f","p":1},{"t":"tip","x":"\u000eAA clause with \u000f\u000eEI think, I expect\u000f\u000eA, etc. has the same effect as a truth adverbial, e.g. \u000f\u000eHI think\u000f\u000eE it’s a great idea.\u000f","p":1}]}]},{"n":130,"t":"Comment adverbials and linking adverbials","u":"Adverbials","s":[{"l":"A","b":[{"t":"rule","x":"We can use an adverb to comment on what is said in the rest of the sentence."},{"t":"eg","x":"\u000eHLuckily\u000f\u000eE no one was killed.\u000f","p":1},{"t":"eg","x":"\u000eEThe newspapers weren’t interested in the story, \u000f\u000eHsurprisingly\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eHUnfortunately\u000f\u000eE we didn’t win anything.\u000f","p":1},{"t":"rule","x":"These adverbs usually go in front or end position."},{"t":"rule","x":"\u000eAA clause with \u000f\u000eEI’m surprised, I’m afraid\u000f\u000eA, etc. has the same effect.\u000f","p":1},{"t":"eg","x":"\u000eHI’m surprised\u000f\u000eE they weren’t interested.\u000f","p":1},{"t":"eg","x":"\u000eHI’m afraid\u000f\u000eE we didn’t win anything.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"We can also use an adverb to comment on someone’s behaviour."},{"t":"eg","x":"\u000eHWisely\u000f\u000eE, the cashier obeyed the gunman.\u000f","p":1},{"t":"rule","x":"Mid position is also possible."},{"t":"eg","x":"\u000eEThe cashier \u000f\u000eHwisely\u000f\u000eE obeyed the gunman.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"\u000eAWe can use a phrase with \u000f\u000eDto\u000f\u000eA for someone’s reaction.\u000f","p":1},{"t":"eg","x":"\u000eHTo my surprise,\u000f\u000eE the place was deserted.\u000f","p":1},{"t":"eg","x":"\u000eEChloe won a prize, \u000f\u000eHto her great delight.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"We can point out that we are being honest."},{"t":"eg","x":"\u000eHFrankly\u000f\u000eE, I’m not interested in old cars.\u000f","p":1},{"t":"eg","x":"\u000eEI don’t really have a choice, \u000f\u000eHto be honest.\u000f","p":1},{"t":"eg","x":"\u000eHTo tell the truth,\u000f\u000eE I’m against the idea.\u000f","p":1}]},{"l":"E","b":[{"t":"rule","x":"Here are some ways of relating one clause to another using linking adverbials."},{"t":"eg","x":"Function  —  Example  —  Linking"},{"t":"sub","x":"Adverbials"},{"t":"table","rows":[["Adding something","\u000eEThe baby grows bigger and heavier. Its shape \u000f\u000eHalso\u000f\u000eE changes.\u000f","Also"],["Contrasting","\u000eEI know you don’t believe me. \u000f\u000eHNevertheless,\u000f\u000eE it’s the truth.\u000f","Nevertheless"],["Contradicting","\u000eEI expect you’re tired. ~ \u000f\u000eHOn the contrary,\u000f\u000eE I feel wide awake..\u000f","On the contrary"],["Correcting","\u000eEI’ll see you tomorrow. \u000f\u000eHOr rather\u000f\u000eE on Monday.\u000f","Or rather"],["Rephrasing","\u000eEIt’s under consideration. \u000f\u000eHIn other words,\u000f\u000eE they’re thinking about it.\u000f","In other words"],["Expressing result","\u000eEWe need to reduce costs, and \u000f\u000eHconsequently\u000f\u000eE there will be job cuts.\u000f","Consequently"],["Comparing","\u000eEI was tricked out of £50. Daniel was conned \u000f\u000eHin the same way.\u000f","in the same way."],["Ordering","\u000eEOf course the man is guilty. \u000f\u000eHFirstly,\u000f\u000eE he had a motive, and \u000f\u000eHsecondly\u000f\u000eE his DNA was found on the \u000f","Firstly, Secondly"]]},{"t":"rule","x":"victim"},{"t":"table","rows":[["Summing up","\u000eHIn conclusion,\u000f\u000eE I’d like to say a few words about future prospects.\u000f","In conclusion"],["Giving examples","\u000eEColours affect us. Green, \u000f\u000eHfor example,\u000f\u000eE is thought to be restful.\u000f","For example"],["Changing the subject","\u000eEHow can I help? This conversation is being recorded, \u000f\u000eHby the way.\u000f","by the way"],["Supporting a","\u000eEI think I’d better be going. It’s past midnight, \u000f\u000eHafter all.\u000f","after all"]]},{"t":"rule","x":"statement"},{"t":"rule","x":"Dismissing something  —  I don’t know if we did the right thing. Anyway, it doesn’t matter now.  —  Anyway"}]}]},{"n":131,"t":"Comparison of adjectives","u":"Comparison","s":[{"l":"A","b":[{"t":"sub","x":"Regular comparison"},{"t":"rule","x":"\u000eDShort\u000f\u000eA adjectives usually have a comparative form in \u000f\u000eJ-er\u000f\u000eA and a superlative form in \u000f\u000eJ-est.\u000f","p":1},{"t":"eg","x":"\u000eEIt’s \u000f\u000eHwarmer\u000f\u000eE in here than outside. \u000f","p":1},{"t":"eg","x":"\u000eEThis is the \u000f\u000eHoldest\u000f\u000eE building in the town.\u000f","note":"For spelling rules for -er/-est, see section ➤178A-B.","p":1},{"t":"rule","x":"\u000eDLong\u000f\u000eA adjectives form the comparative and superlative with \u000f\u000eJmore\u000f\u000eA and \u000f\u000eJmost\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eESkiing is \u000f\u000eHmore difficult\u000f\u000eE than it looks.\u000f","p":1},{"t":"eg","x":"\u000eEShe’s the \u000f\u000eHmost irritating\u000f\u000eE person I know.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"One-syllable adjectives"},{"t":"rule","x":"\u000eAMost one-syllable adjectives take \u000f\u000eJ-er/-est\u000f\u000eI.\u000f","p":1},{"t":"eg","x":"Our new flat is nicer."},{"t":"wrong","x":"Our new flat is more nice."},{"t":"rule","x":"\u000eASome can take either\u000f\u000eJ -er/-est\u000f\u000eA or \u000f\u000eJmore/most\u000f\u000eA:\u000f","p":1},{"t":"eg","x":"\u000eEI feel \u000f\u000eHsafer / more safe\u000f\u000eE on the cycle path.\u000f","p":1},{"t":"rule","x":"\u000eASuch adjectives include: \u000f\u000eEclear, fair, free, keen, proud, rude, safe, sure, true.\u000f","p":1},{"t":"rule","x":"\u000eAWe use \u000f\u000eJmore/most\u000f\u000eA (not \u000f\u000eJ-er/-est\u000f\u000eA) with \u000f\u000eFreal, \u0001right\u0002, \u0001wrong\u0002\u000f\u000eA and with adjectives ending in \u000f\u000eJ-ed\u000f\u000eA (e.g.,\u000f\u000eB bored, pleased\u000f\u000eA).\u000f","p":1},{"t":"eg","x":"\u000eEThe story seemed \u000f\u000eHmore real\u000f\u000eE in the film.\u000f","p":1},{"t":"eg","x":"\u000eEThose \u000f\u000eHmost pleased\u000f\u000eE to go were the kids.\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"Two-syllable adjectives"},{"t":"rule","x":"\u000eAMany of these take \u000f\u000eJmore/most\u000f\u000eI:\u000f","p":1},{"t":"eg","x":"Our new place is more central."},{"t":"rule","x":"\u000eAThese adjectives take\u000f\u000eJ more/most\u000f","p":1},{"t":"rule","x":"\u000eEEnding \u000f\u000eL-ful\u000f\u000eF:\u000f\u000eE careful, hopeful\u000f","p":1},{"t":"rule","x":"\u000eEEnding \u000f\u000eL-less\u000f\u000eE: helpless, useless\u000f","p":1},{"t":"rule","x":"\u000eEEnding \u000f\u000eL-ing/-ed\u000f\u000eF: \u000f\u000eEboring, annoyed\u000f","p":1},{"t":"rule","x":"Some others: afraid, central, certain, complex, correct, exact, famous, foolish, frequent, modern, normal, recent."},{"t":"rule","x":"\u000eASome two-syllable adjectives can take either \u000f\u000eC-er/-est\u000f\u000eA or \u000f\u000eCmore/most\u000f\u000eA:\u000f","p":1},{"t":"eg","x":"\u000eEUse the \u000f\u000eHsimplest\u000f\u000eE /\u000f\u000eH most simple\u000f\u000eE method.\u000f","p":1},{"t":"rule","x":"\u000eAThey include\u000f\u000eK: \u000f\u000eEable, clever, common, cruel, feeble, gentle, narrow, pleasant, polite, quiet, simple, stupid, tired.\u000f","p":1},{"t":"rule","x":"\u000eAWe use \u000f\u000eC-er/-est\u000f\u000eA with most two-syllable adjectives ending in \u000f\u000eC-y\u000f\u000eA (e.g. \u000f\u000eEangry, \u0001funny\u0002, \u0001happy\u0002), \u000f\u000eDalthough\u000f\u000eF \u0001more/most\u0002\u000f\u000eD is also possible\u000f","p":1},{"t":"eg","x":"\u000eELife would be \u000f\u000eHeasier\u000f\u000eE if I had a job.\u000f","p":1}]},{"l":"D","b":[{"t":"sub","x":"Three-syllable adjectives"},{"t":"rule","x":"Adjectives of three or more syllables take more/most:"},{"t":"eg","x":"Your health is the most important thing."},{"t":"tip","x":"\u000eAIf you are not sure about the correct form, it is safer to use \u000f\u000eCmore/most\u000f\u000eA.\u000f","p":1}]}]},{"n":132,"t":"Irregular comparison and special forms","u":"Comparison","s":[{"l":"A","b":[{"t":"rule","x":"\u000eAThe adjectives \u000f\u000eIgood\u000f\u000eA and \u000f\u000eIbad \u000f\u000eAhave irregular comparative and superlative forms: \u000f\u000eJgood, better, best ; bad, worse, worst\u000f","p":1},{"t":"eg","x":"\u000eELast week we saw \u000f\u000eHa good\u000f\u000eE game, but this week we saw an even \u000f\u000eHbetter\u000f\u000eE one. In fact, it’s the \u000f\u000eHbest\u000f\u000eE I’ve seen for a long time.\u000f","p":1},{"t":"eg","x":"\u000eEWe’ve had \u000f\u000eHbad\u000f\u000eE weather for some time, and now it’s getting \u000f\u000eHworse\u000f\u000eE. It’s the \u000f\u000eHworst\u000f\u000eE of the winter so far.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eJFar\u000f\u000eA has two different comparative and superlative forms: \u000f\u000eJfarther/further\u000f\u000eI and \u000f\u000eJfarthest/furthest\u000f","p":1},{"t":"eg","x":"\u000eEThe \u000f\u000eHfarthest/furthest\u000f\u000eE moon is 13 million kilometres from Saturn.\u000f","p":1},{"t":"rule","x":"\u000eJFurther\u000f\u000eA can also mean “more” or “additional”:\u000f","p":1},{"t":"eg","x":"\u000eELet’s hope there are no \u000f\u000eHfurther\u000f\u000eE problems.\u000f","p":1},{"t":"eg","x":"\u000eHFurther\u000f\u000eE details on our website.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"\u000eJElder, eldest\u000f\u000eA mean the same as \u000f\u000eJolder, oldest\u000f\u000eI. \u000f\u000eAWe use the irregular forms mainly to talk about ages in a family.\u000f","p":1},{"t":"eg","x":"\u000eEHave you got an \u000f\u000eHolder/elder\u000f\u000eE brother?\u000f","p":1},{"t":"eg","x":"\u000eETheir \u000f\u000eHoldest/eldest\u000f\u000eE daughter married a Russian billionaire.\u000f","p":1},{"t":"rule","x":"\u000eIElder and eldest\u000f\u000eA go before the noun. Not\u000f\u000eB My brother is elder than me\u000f","p":1}]},{"l":"D","b":[{"t":"sub","x":"Latest and last"},{"t":"rule","x":"\u000eAThese mean different things: \u000f\u000eJLatest\u000f\u000eA means “furthest ahead in time” or “newest.”\u000f","p":1},{"t":"eg","x":"\u000eEWhat’s the \u000f\u000eHlatest\u000f\u000eE time we can leave and still get there on time?\u000f","p":1},{"t":"eg","x":"This jacket is the latest fashion."},{"t":"wrong","x":"This jacket is the last fashion."},{"t":"rule","x":"\u000eJLast\u000f\u000eA means “previous” or “final.”\u000f","p":1},{"t":"eg","x":"\u000eEI had my hair cut \u000f\u000eHlast\u000f\u000eE week. (the week before this one)\u000f","p":1},{"t":"eg","x":"\u000eEThe \u000f\u000eHlast\u000f\u000eE bus goes at midnight. (the final bus of the day)\u000f","p":1}]},{"l":"E","b":[{"t":"sub","x":"Nearest and next"},{"t":"rule","x":"\u000eAThese also mean different things: \u000f\u000eJNearest\u000f\u000eA means “the shortest distance away.”\u000f","p":1},{"t":"eg","x":"\u000eEWhere’s the \u000f\u000eHnearest\u000f\u000eE post office? (the one that is closest)\u000f","p":1},{"t":"rule","x":"\u000eJNext\u000f\u000eA means “following in a series.”\u000f","p":1},{"t":"eg","x":"\u000eEI’m going on holiday \u000f\u000eHnext\u000f\u000eE week. (the week after this one)\u000f","p":1},{"t":"eg","x":"\u000eEWe have to get out at the \u000f\u000eHnext\u000f\u000eE stop. (the stop after this one)\u000f","p":1},{"t":"eg","x":"\u000eEThere’s a newsagent’s in the \u000f\u000eHnext\u000f\u000eE street. (the street beside this one)\u000f","p":1},{"t":"tip","x":"We can use better and worse as comparative forms of well and ill to talk about health and illness: • I expect I’ll be well again soon. I certainly feel better than I did. I was much worse yesterday."}]}]},{"n":133,"t":"Comparison of adverbs and quantifiers","u":"Comparison","s":[{"l":"A","b":[{"t":"sub","x":"Comparison of adverbs"},{"t":"rule","x":"Adverbs with the same form as adjectives (e.g., hard → ➤123c) take -er/-est:"},{"t":"eg","x":"\u000eEYou work \u000f\u000eHharder\u000f\u000eE than I do.\u000f","p":1},{"t":"eg","x":"\u000eEWho can shoot the \u000f\u000eHstraightest\u000f\u000eE?\u000f","p":1},{"t":"eg","x":"\u000eEI got up \u000f\u000eHearlier\u000f\u000eE than usual.\u000f","p":1},{"t":"rule","x":"Well, badly, and far have irregular comparative and superlative forms: better, best; worse, worst; farther, farthest; or further, furthest."},{"t":"eg","x":"\u000eEI find these pills work \u000f\u000eHbest\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEMy tooth was aching \u000f\u000eHworse\u000f\u000eE than ever.\u000f","p":1},{"t":"eg","x":"\u000eEHow much \u000f\u000eHfarther/further\u000f\u000eE is it?\u000f","p":1},{"t":"rule","x":"\u000eAAdverbs with\u000f\u000eJ -ly \u000f\u000eAtake \u000f\u000eJmore/most\u000f\u000eA: (\u000f\u000eDBut “\u000f\u000eFearly\u000f\u000eD” is an exception; see above.\u000f\u000eA)\u000f","p":1},{"t":"rule","x":"\u000eEYou can draw \u000f\u000eHmore accurately\u000f\u000eE than that.\u000f","p":1},{"t":"eg","x":"\u000eEThe first speaker presented his case the \u000f\u000eHmost convincingly\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eAAdverbs not formed from adjectives (e.g., \u000f\u000eFoften\u000f\u000eA) also take \u000f\u000eJmore/most\u000f\u000eA:\u000f","p":1},{"t":"eg","x":"\u000eEI wish we could meet \u000f\u000eHmore often.\u000f","p":1},{"t":"eg","x":"\u0004But\u0005 “soon” is an exception."},{"t":"eg","x":"\u000eEIf I help, we’ll finish the job \u000f\u000eHsooner\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eASome adverbs have alternative forms (e.g., \u000f\u000eFcheap/cheaply\u000f\u000eA): \u000f\u000eB➤123D\u000f","p":1},{"t":"rule","x":"There is also a choice of comparative/superlative forms:"},{"t":"rule","x":"\u000eEYou can buy them \u000f\u000eHcheaper\u000f\u000eE /\u000f\u000eH more cheaply\u000f\u000eE on the internet.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"Comparison of quantifiers"},{"t":"table","rows":[["Plural","Uncountable"],["More (a larger number)","More (a larger amount)"],["\u000eEThere are \u000f\u000eHmore\u000f\u000eE cars in LA than people.\u000f","\u0003You've got more money than I have"],["Most ( the largest number)","Most ( the largest amount)"],["\u0003AC Milan has the most points.","\u0003Claire is always studying. She does the most work."],["Fewer/les ( a smaller number)","Less ( a smaller amount)"],["\u0003There are fewer/less phone boxes than there used to be","\u0003If you want to be healthy, you should eat less fat"],["Fewest/lease (the smallest number)","Least ( the smallest amount)"],["\u0003We're bottom of the league. We've got the fewest/lease","\u000eEI'm the busiest person here . I have the least spare tim\u000f\u000eBe\u000f"]]},{"t":"rule","x":"points"},{"t":"rule","x":"\u000eASome people think \u000f\u000eFless phone boxes\u000f\u000eA and \u000f\u000eFthe least points\u000f\u000eA are incorrect, although they are commonly used.\u000f","p":1}]}]},{"n":134,"t":"Comparison: than, as, etc","u":"Comparison","s":[{"l":"A","b":[{"t":"rule","x":"\u000eAWe often use \u000f\u000eDthan\u000f\u000eA after a comparative:\u000f","p":1},{"t":"eg","x":"\u000eEGlasgow is bigger \u000f\u000eHthan\u000f\u000eE Edinburgh.\u000f","p":1},{"t":"eg","x":"\u000eEFlying is a lot quicker \u000f\u000eHthan\u000f\u000eE going by train\u000f","p":1},{"t":"eg","x":"\u000eEPrices are higher \u000f\u000eHthan\u000f\u000eE I expected.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eAL\u000f\u000eDess\u000f\u000eA and \u000f\u000eDleast\u000f\u000eA are the opposites of \u000f\u000eDmore\u000f\u000eA and \u000f\u000eDmost\u000f\u000eA:\u000f","p":1},{"t":"eg","x":"\u000eEThe place is \u000f\u000eHless\u000f\u000eE busy on a Sunday.\u000f","p":1},{"t":"eg","x":"\u000eEThis is the \u000f\u000eHleast\u000f\u000eE expensive model.\u000f","p":1},{"t":"eg","x":"\u000eEI see Vicky \u000f\u000eHless\u000f\u000eE often these days.\u000f","p":1},{"t":"eg","x":"\u000eEMy back hurts \u000f\u000eHless\u000f\u000eE if I lie down.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"\u000eAWe use the pattern \u000f\u000eEas… as…\u000f\u000eA to say that things are equal:\u000f","p":1},{"t":"eg","x":"\u000eEThe tree is \u000f\u000eHas\u000f\u000eE tall \u000f\u000eHas\u000f\u000eE the house.\u000f","p":1},{"t":"rule","x":"\u000eAIn a negative statement, we use either\u000f\u000eE as… as… or so… as\u000f\u000eA…:\u000f","p":1},{"t":"eg","x":"\u000eEI don’t drink\u000f\u000eH as/so\u000f\u000eE much tea \u000f\u000eHas\u000f\u000eE you do.\u000f","p":1},{"t":"eg","x":"\u000eEWatching sport on TV isn’t \u000f\u000eHas/so\u000f\u000eE exciting \u000f\u000eHas\u000f\u000eE being there.\u000f","p":1},{"t":"eg","x":"\u000eEThe film isn’t\u000f\u000eH as/so\u000f\u000eE good \u000f\u000eHas\u000f\u000eE the book. \u000f","note":"The book is better.","p":1}]},{"l":"D","b":[{"t":"rule","x":"\u000eAThese examples have an adverb of degree before a comparative or \u000f\u000eDas\u000f\u000eA:\u000f","p":1},{"t":"eg","x":"\u000eEFrance is \u000f\u000eHmuch\u000f\u000eE bigger than Belgium.\u000f","p":1},{"t":"eg","x":"\u000eEI’m feeling \u000f\u000eHa bit\u000f\u000eE less nervous now.\u000f","p":1},{"t":"eg","x":"\u000eEThe holiday was \u000f\u000eHjust\u000f\u000eE as good as the brochure said it would be.\u000f","p":1},{"t":"rule","x":"We can also use even with a comparative:"},{"t":"eg","x":"\u000eEThis stadium is pretty big, but the new one will be \u000f\u000eHeven\u000f\u000eE bigger.\u000f","p":1}]},{"l":"E","b":[{"t":"rule","x":"\u000eAThis pattern with \u000f\u000eDand\u000f\u000eA expresses a continuing change:\u000f","p":1},{"t":"eg","x":"\u000eEThe plant grew \u000f\u000eHtaller and taller.\u000f","p":1},{"t":"eg","x":"\u000eEThe air gets \u000f\u000eHmore and more polluted\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEThere’s \u000f\u000eHmore and more traffic\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"(With more, we do not repeat the adjective."},{"t":"wrong","x":"more polluted \u0004and\u0005 more polluted"},{"t":"rule","x":"\u000eAWe can also use \u000f\u000eDless\u000f\u000eA:\u000f","p":1},{"t":"eg","x":"\u000eEI felt \u000f\u000eHless and less keen\u000f\u000eE on the idea.\u000f","p":1}]},{"l":"F","b":[{"t":"sub","x":"The pattern the… the…"},{"t":"rule","x":"This links a change in one thing to a change in another:"},{"t":"eg","x":"\u000eHThe furthe\u000f\u000eEr you go, \u000f\u000eHthe more\u000f\u000eE you pay.\u000f","p":1},{"t":"eg","x":"\u000eHThe later\u000f\u000eE I get up, \u000f\u000eHthe more tired\u000f\u000eE I feel.\u000f","p":1},{"t":"rule","x":"\u000eHThe older\u000f\u000eE you get, \u000f\u000eHthe harder\u000f\u000eE it becomes to start a new career\u000f","p":1}]},{"l":"G","b":[{"t":"sub","x":"Superlative + phrase/relative clause"},{"t":"rule","x":"After a superlative, we often use a phrase or a relative clause:"},{"t":"eg","x":"\u000eEWhich is the oldest city\u000f\u000eH in the world\u000f\u000eE?\u000f","p":1},{"t":"eg","x":"\u000eEIt’s going to be the best gig\u000f\u000eH of all time.\u000f","p":1},{"t":"eg","x":"\u000eEThat was the nicest meal\u000f\u000eH I’ve ever had.\u000f","p":1},{"t":"rule","x":"We sometimes use one of or some of before a superlative:"},{"t":"eg","x":"\u000eETurn left for \u000f\u000eHone of\u000f\u000eE the most magnificent views you’ll ever see in your life.\u000f","p":1},{"t":"tip","x":"A pronoun on its own after \u0001as\u0002 or than has the object form, e.g.: I’m not as tall as him. It is formal and old-fashioned to say I’m not as tall as he. But we say: I’m not as tall as he is. PREPOSITION 135 - 147"}]}]},{"n":135,"t":"Introduction to prepositions","u":"Prepositions","s":[{"l":"A","b":[{"t":"rule","x":"\u000eAA preposition is a word like \u000f\u000eFin\u000f\u000eI, \u000f\u000eFto\u000f\u000eI, or \u000f\u000eFfor\u000f\u000eA. It usually comes \u000f\u000eDbefore a noun phrase.\u000f","p":1},{"t":"rule","x":"into the house at lunch without a coat"},{"t":"eg","x":"\u000eAIt can also be\u000f\u000eD more than one word.\u000f","p":1},{"t":"rule","x":"next to the window on top of the hill"},{"t":"rule","x":"\u000eASome prepositions can also come \u000f\u000eDbefore an adverb.\u000f","p":1},{"t":"rule","x":"until tomorrow through there"}]},{"l":"B","b":[{"t":"rule","x":"\u000eAA phrase like \u000f\u000eEat the office\u000f\u000eA is a \u000f\u000eDprepositional phrase\u000f\u000eA. It often functions \u000f\u000eDas an adverbial.\u000f","p":1},{"t":"eg","x":"\u000eEWe were very busy \u000f\u000eHat the office.\u000f","p":1},{"t":"eg","x":"\u000eHOn Tuesda\u000f\u000eEy things were back to normal.\u000f","p":1},{"t":"rule","x":"\u000eAIt can also come \u000f\u000eDafter a noun\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEThe panic \u000f\u000eHat the office\u000f\u000eE was soon ove\u000f\u000eDr.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"\u000eAMany \u000f\u000eDidiomatic\u000f\u000eA combinations have a preposition \u000f\u000eDfollowing a verb, adjective, or noun.\u000f","p":1},{"t":"rule","x":"▶ 145–147"},{"t":"rule","x":"wait for me keen on golf a tax on beer"},{"t":"rule","x":"\u000eAThere are also many \u000f\u000eDidiomatic\u000f\u000eA phrases \u000f\u000eDbeginning\u000f\u000eA with a preposition.\u000f","p":1},{"t":"eg","x":"\u000eHAbove all\u000f\u000eE, we don’t want any accidents.\u000f","p":1},{"t":"rule","x":"\u000eEYou must let me know \u000f\u000eHat once.\u000f","p":1},{"t":"eg","x":"\u000eEThe house is \u000f\u000eHfor sale\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"\u000eHOf course\u000f\u000eE you can stay.\u000f","p":1},{"t":"eg","x":"\u000eHOn the whole\u000f\u000eE we’ve had a good year.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"We can use certain prepositions before a gerund. ▶ 75–76"},{"t":"eg","x":"\u000eEWe succeeded \u000f\u000eHin moving\u000f\u000eE the piano.\u000f","p":1},{"t":"rule","x":"But we do not use a preposition + infinitive."},{"t":"wrong","x":"We succeeded in to move the piano."},{"t":"rule","x":"And we do not use a preposition + that-clause."},{"t":"wrong","x":"We’re hoping for that it stays fine."},{"t":"rule","x":"We use one of these patterns."},{"t":"eg","x":"We’re hoping for fine weather."},{"t":"eg","x":"We’re hoping (that) it stays fine."},{"t":"rule","x":"For a preposition + wh-clause, ▶ 163E."},{"t":"rule","x":"\u000eEI’ll make a list \u000f\u000eHof what\u000f\u000eE we need.\u000f","p":1}]},{"l":"E","b":[{"t":"rule","x":"We can modify a preposition."},{"t":"rule","x":"just off the motorway all over the floor almost at the end halfway up the hill"}]},{"l":"F","b":[{"t":"rule","x":"Sometimes a preposition goes at the end of a wh-question, a passive clause, an infinitive clause, or a relative clause."},{"t":"eg","x":"Who did you go out with? ▶ 10E"},{"t":"eg","x":"The matter has been looked into. ▶ 59D"},{"t":"eg","x":"There’s plenty to think about. ▶ 64D"},{"t":"eg","x":"Here’s the key I was looking for. ▶ 172D"},{"t":"tip","x":"Many idiomatic phrases beginning with a preposition have a noun on its own without a determiner, e.g. in fact, on average, on holiday, out of work, under pressure."}]}]},{"n":136,"t":"Prepositions of place","u":"Prepositions","s":[{"l":"A","b":[{"t":"sub","x":"Some common prepositions"},{"t":"eg","x":"\u000eEThere’s a man \u000f\u000eHin/inside\u000f\u000eE the phone box.\u000f","p":1},{"t":"rule","x":"\u000eEYou can park \u000f\u000eHoutside\u000f\u000eE the bank.\u000f","p":1},{"t":"eg","x":"\u000eELunch is \u000f\u000eHon\u000f\u000eE the table.\u000f","p":1},{"t":"eg","x":"\u000eEThere’s a flag \u000f\u000eHon top of\u000f\u000eE the building.\u000f","p":1},{"t":"eg","x":"\u000eEThe dog was \u000f\u000eHunder(neath)\u000f\u000eE the table.\u000f","p":1},{"t":"eg","x":"\u000eEThe clock is \u000f\u000eHover/above\u000f\u000eE the entrance.\u000f","p":1},{"t":"eg","x":"\u000eEComing \u000f\u000eHdown\u000f\u000eE the steps is easier than climbing \u000f\u000eHup\u000f\u000eE them.\u000f","p":1},{"t":"eg","x":"\u000eEThe fans were going \u000f\u000eHin/into\u000f\u000eE the stadium.\u000f","p":1},{"t":"eg","x":"\u000eEAfterwards they came \u000f\u000eHout of\u000f\u000eE the stadium.\u000f","p":1},{"t":"eg","x":"\u000eEThe road goes \u000f\u000eHthrough\u000f\u000eE a tunnel.\u000f","p":1},{"t":"eg","x":"\u000eEI tipped the money \u000f\u000eHon/onto\u000f\u000eE the counter.\u000f","p":1},{"t":"eg","x":"\u00 :1},{"t":"eg","x":"\u000eEA dog ran \u000f\u000eHacross\u000f\u000eE the road.\u000f","p":1},{"t":"eg","x":"\u000eFAt\u000f\u000eA usually expresses \u000f\u000eDposition\u000f\u000eA, and \u000f\u000eFto\u000f\u000eA expresses \u000f\u000eDmovement\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEWe were \u000f\u000eHat\u000f\u000eE the café.\u000f","p":1},{"t":"eg","x":"\u000eEWe went \u000f\u000eHto\u000f\u000eE the café\u000f\u000eD.\u000f","p":1},{"t":"eg","x":"\u000eAAs a general rule, \u000f\u000eDin\u000f\u000eA and \u000f\u000eDon\u000f\u000eA express position, and \u000f\u000eDinto\u000f\u000eA and \u000f\u000eDonto\u000f\u000eA express movement.\u000f","p":1},{"t":"eg","x":"\u000eEWe were \u000f\u000eHin\u000f\u000eE the café / \u000f\u000eHon\u000f\u000eE the balcony.\u000f","p":1},{"t":"eg","x":"\u000eEHe went \u000f\u000eHinto\u000f\u000eE the café / \u000f\u000eHonto\u000f\u000eE the balcony.\u000f","p":1},{"t":"rule","x":"\u000eABut \u0001in\u0002 informal English we also use \u000f\u000eFin\u000f\u000eA and \u000f\u000eFon\u000f\u000eA for movement.\u000f","p":1},{"t":"eg","x":"\u000eEWe went \u000f\u000eHin\u000f\u000eE the café.\u000f","p":1},{"t":"eg","x":"\u000eEBabies often throw things \u000f\u000eHon\u000f\u000eE the floor.\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"Other meanings"},{"t":"rule","x":"Prepositions of place can also have more abstract meanings. For example:"},{"t":"eg","x":"\u000eEShe’s really \u000f\u000eHinto\u000f\u000eE yoga.\u000f\u000eA (interested in)\u000f","p":1},{"t":"eg","x":"\u000eEThe talk is \u000f\u000eHon\u000f\u000eE China.\u000f\u000eA (about China)\u000f","p":1},{"t":"eg","x":"\u000eEWe’re right \u000f\u000eHbehind\u000f\u000eE you\u000f\u000eD.\u000f\u000eA (supporting)\u000f","p":1},{"t":"tip","x":"After lay, place, put, and sit we usually use \u0001in\u0002 or \u0001on\u0002 rather than \u0001into\u0002 or \u0001onto\u0002, e.g. They laid the body on a blanket. Advertisements were placed in the newspapers. She sat on the table."}]}]},{"n":137,"t":"Place: at, on, and in","u":"Prepositions","s":[{"l":"A","b":[{"t":"rule","x":"\u000eAWe use \u000f\u000eJat\u000f\u000eA for \u000f\u000eDposition\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI was \u000f\u000eHat\u000f\u000eE the bus stop.\u000f","p":1},{"t":"eg","x":"There’s someone \u0004at\u0005 the door."},{"t":"rule","x":"\u000eAWe see\u000f\u000eE the bus stop\u000f\u000eA and\u000f\u000eE the door\u000f\u000eA as a point in space.\u000f","p":1},{"t":"rule","x":"\u000eAWe use \u000f\u000eJat\u000f\u000eA with a building or institution when we mean its \u000f\u000eDnormal purpose.\u000f","p":1},{"t":"eg","x":"\u000eEShe’s \u000f\u000eHat\u000f\u000eE the theatre.\u000f\u000eA (watching a play)\u000f","p":1},{"t":"eg","x":"\u000eEI’m still \u000f\u000eHat\u000f\u000eE school.\u000f\u000eA (attending school)\u000f","p":1},{"t":"rule","x":"\u000eAWe use \u000f\u000eJat\u000f\u000eA with someone’s house and with a social event.\u000f","p":1},{"t":"eg","x":"\u000eEWe were all \u000f\u000eHat\u000f\u000eE Alice’s (house/flat).\u000f","p":1},{"t":"eg","x":"\u000eEWe met \u000f\u000eHat\u000f\u000eE Adam’s party, didn’t we?\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eJOn\u000f\u000eA is two-dimensional. We use it for a surface.\u000f","p":1},{"t":"eg","x":"\u000eEDon’t leave your glasses \u000f\u000eHon\u000f\u000eE the floor.\u000f","p":1},{"t":"eg","x":"\u000eEThere were pictures \u000f\u000eHon\u000f\u000eE the walls.\u000f","p":1},{"t":"rule","x":"We also use it for position on a line."},{"t":"eg","x":"\u000eEBath is \u000f\u000eHon\u000f\u000eE the River Avon.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"\u000eJIn\u000f\u000eA is three-dimensional.\u000f","p":1},{"t":"eg","x":"\u000eEI had ten pounds \u000f\u000eHin\u000f\u000eE my pocket.\u000f","p":1},{"t":"eg","x":"\u000eEWho’s that girl \u000f\u000eHin\u000f\u000eE the green dress?\u000f","p":1},{"t":"eg","x":"\u000eEWe sat \u000f\u000eHin\u000f\u0 ccurred \u000f\u000eHon\u000f\u000eE the evening of 27 April.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"\u000eAWe use \u000f\u000eFin\u000f\u000eA for how long something takes.\u000f","p":1},{"t":"eg","x":"\u000eECan you run a mile \u000f\u000eHin\u000f\u000eE four minutes?\u000f","p":1},{"t":"rule","x":"\u000eAWe can also use \u000f\u000eFin\u000f\u000eA for a time \u0001in\u0002 the future measured from the present.\u000f","p":1},{"t":"eg","x":"\u000eEWe’ll take our exams \u000f\u000eHin\u000f\u000eE three weeks.\u000f","p":1},{"t":"rule","x":"Compare these examples."},{"t":"rule","x":"\u000eEYou can walk there \u000f\u000eFin\u000f\u000eE half an hour.\u000f","p":1},{"t":"rule","x":"(It takes half an hour.)"},{"t":"eg","x":"\u000eEI’m going out \u000f\u000eFin\u000f\u000eE half an hour.\u000f","note":"half an hour from now","p":1}]},{"l":"E","b":[{"t":"rule","x":"Sometimes we use an expression of time without a preposition."},{"t":"eg","x":"\u000eEI received the letter \u000f\u000eHlast Thursday.\u000f","p":1},{"t":"eg","x":"\u000eEI’m starting a new course \u000f\u000eHnext year.\u000f","p":1},{"t":"eg","x":"\u000eEThe same thing happens \u000f\u000eHevery time.\u000f","p":1},{"t":"eg","x":"\u000eEI’ll see you \u000f\u000eHtomorrow morning.\u000f","p":1},{"t":"eg","x":"\u000eHA week later\u000f\u000eE I got a reply.\u000f","p":1},{"t":"rule","x":"\u000eAWe do not normally use \u000f\u000eFat\u000f\u000eE, \u000f\u000eFon\u000f\u000eD,\u000f\u000eA or \u000f\u000eFin\u000f\u000eA with \u000f\u000eFlast, \u0001next\u0002\u000f\u000eD,\u000f\u000eA or \u000f\u000eFthis\u000f\u000eD;\u000f\u000eA with \u000f\u000eFevery\u000f\u000eA or \u000f\u000eFall\u000f\u000eD;\u000f\u000eA with \u000f\u000eFyesterday\u000f\u000eA or \u000f\u000eFtomorrow\u000f\u000eD;\u000f\u000eA or with the adverb \u000f\u000eFlater\u000f\u000eD.\u000f","p":1},{"t":"rule","x":"In some contexts we can either use the preposition or leave it out."},{"t":"eg","x":"\u000eEI was feeling unwell (\u000f\u000eHon\u000f\u000eE) that day.\u000f","p":1},{"t":"eg","x":"\u000eEProfits were higher (\u000f\u000eHin\u000f\u000eE) the previous year.\u000f","p":1},{"t":"eg","x":"\u000eEWe met (\u000f\u000eHon\u000f\u000eE) the following Monday.\u000f","p":1},{"t":"tip","x":"\u000eAIn informal English, and especially in American English, \u000f\u000eDon\u000f\u000eA is often left out in e.g. \u000f\u000eEI’ll see you \u000f\u000eHMonday\u000f\u000eE.\u000f","p":1}]}]},{"n":140,"t":"For, since, and ago","u":"Prepositions","s":[{"l":"A","b":[{"t":"rule","x":"\u000eAWe use \u000f\u000eFfor\u000f\u000eA with a period of time to say how long something continues.\u000f","p":1},{"t":"eg","x":"\u000eEI can surf the internet \u000f\u000eHfor\u000f\u000eE hours on end.\u000f","p":1},{"t":"eg","x":"\u000eEI once stayed at that hotel \u000f\u000eHfor\u000f\u000eE a week.\u000f","p":1},{"t":"eg","x":"\u000eELet’s just sit down \u000f\u000eHfor\u000f\u000eE five minutes.\u000f","p":1},{"t":"rule","x":"\u000eAWe do not use \u000f\u000eFfor\u000f\u000eA before \u000f\u000eFall\u000f\u000eD +\u000f\u000eA noun.\u000f","p":1},{"t":"eg","x":"It rained \u0004all\u0005 day."},{"t":"wrong","x":"\u0004for\u0005 \u0004all\u0005 day"},{"t":"rule","x":"\u000eAAnd we do not usually use \u000f\u000eFfor\u000f\u000eA before a phrase with \u000f\u000eFwhole\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEIt rained \u000f\u000eHthe whole day.\u000f","p":1},{"t":"eg","x":"\u000eAThis is more usual than \u000f\u000eEfor the whole day\u000f\u000eB.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eAWe often use \u000f\u000eFfor\u000f\u000eA and \u000f\u000eFsince\u000f\u000eA with the perfect. We use \u000f\u000eFfor\u000f\u000eI + length of time\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI’ve worked there \u000f\u000eHfor\u000f\u000eE five years now.\u000f","p":1},{"t":"eg","x":"\u000eEWe haven’t seen Rory \u000f\u000eHfor\u000f\u000eE months.\u000f","p":1},{"t":"eg","x":"\u000eEI’ve been waiting here \u000f\u000eHfor\u000f\u000eE twenty minutes.\u000f","p":1},{"t":"rule","x":"\u000eAWe can sometimes leave out \u000f\u000eFfor\u000f\u000eA in informal English.\u000f","p":1},{"t":"eg","x":"I’ve been waiting twenty minutes."},{"t":"rule","x":"\u000eAWe use \u000f\u000eFsince\u000f\u000eI + time\u000f\u000eA when\u000f","p":1},{"t":"eg","x":"\u000eEI’ve worked here \u000f\u000eHsince\u000f\u000eE 2005.\u000f","p":1},{"t":"eg","x":"\u000eEWe haven’t seen Rory \u000f\u000eHsince\u000f\u000eE August.\u000f","p":1},{"t":"eg","x":"\u000eEI’ve been waiting here \u000f\u000eHsince\u000f\u000eE twelve o’clock.\u000f","p":1},{"t":"rule","x":"\u000eAWe sometimes also use \u000f\u000eFsince\u000f\u000eA with an event.\u000f","p":1},{"t":"eg","x":"\u000eEI haven’t been out \u000f\u000eHsince\u000f\u000eE the concert.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"\u000eAWe use the adverb \u000f\u000eFago\u000f\u000eA for something that happened at a time in the past measured from the present.\u000f","p":1},{"t":"eg","x":"\u000eEI joined the company five years \u000f\u000eHago\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eEWe last saw Rory months \u000f\u000eHago.\u000f","p":1},{"t":"eg","x":"\u000eEAn hour \u000f\u000eHago\u000f\u000eE I was still in bed.\u000f","p":1},{"t":"rule","x":"\u000eDAgo\u000f\u000eA comes after the length of time (\u000f\u000eEfive years, months, an hour\u000f\u000eA).\u000f","p":1},{"t":"rule","x":"\u000eAWhen we look back to an even earlier time, we usually use the adverb \u000f\u000eFbefore\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eERachel left the company last year. She’d joined them five years \u000f\u000eHbefore\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eAThis is more usual than \u000f\u000eEShe’d joined them five years ago.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"Compare these examples."},{"t":"rule","x":"Looking into the past:"},{"t":"eg","x":"\u000eEI’ve been here (\u000f\u000eHfor\u000f\u000eE) ten minutes.\u000f","p":1},{"t":"eg","x":"\u000eEI’ve been here \u000f\u000eHsince\u000f\u000eE four forty.\u000f","p":1},{"t":"eg","x":"\u000eEI arrived ten minutes \u000f\u000eHago\u000f\u000eE.\u000f","p":1},{"t":"rule","x":"Looking into the future:"},{"t":"eg","x":"\u000eEI’ll stay (\u000f\u000eHfor\u000f\u000eE) ten minutes.\u000f","p":1},{"t":"eg","x":"\u000eEI’ll stay \u000f\u000eHuntil\u000f\u000eE five o’clock.\u000f","p":1},{"t":"eg","x":"\u000eEI’m leaving \u000f\u000eHin\u000f\u000eE ten minutes\u000f","p":1},{"t":"tip","x":"Don’t use \u0001since\u0002 with a phrase expressing length of time. Say for four days but since Tuesday, for two years but since 2008. A useful sentence when you meet someone after a long time is I haven’t seen you for ages."}]}]},{"n":141,"t":"More prepositions of time","u":"Prepositions","s":[{"l":"A","b":[{"t":"sub","x":"Place of time"},{"t":"rule","x":"Some prepositions of place can also be used with time."},{"t":"eg","x":"\u000eEI’ll be there \u000f\u000eHbetween\u000f\u000eE three and half past.\u000f","p":1},{"t":"rule","x":"\u000eEYou can do the journey \u000f\u000eHinside\u000f\u000eE an hour.\u000f","p":1},{"t":"rule","x":"\u000eFAt\u000f\u000eD, \u000f\u000eFon\u000f\u000eD,\u000f\u000eA and \u000f\u000eFin\u000f\u000eA can also express either place \u000f\u000eB➤137\u000f\u000eA or time \u000f\u000eB➤139\u000f\u000eA.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"During"},{"t":"rule","x":"\u000eAWe use \u000f\u000eFduring\u000f\u000eA with an event or a specific period of time.\u000f","p":1},{"t":"eg","x":"\u000eENobody works \u000f\u000eHduring\u000f\u000eE the festival.\u000f","p":1},{"t":"eg","x":"\u000eEI suddenly felt ill \u000f\u000eHduring\u000f\u000eE the meeting.\u000f","p":1},{"t":"eg","x":"\u000eEThe office will be closed \u000f\u000eHduring\u000f\u000eE August.\u000f","p":1},{"t":"eg","x":"\u000eEI have to be away several times \u000f\u000eHduring\u000f\u000eE the next couple of months.\u000f","p":1},{"t":"rule","x":" \u000eFor\u000f\u000eA rather than \u000f\u000eFand\u000f\u000eA.  .--\u000f\u000eF coordinating conjunction\u000f","p":1},{"t":"eg","x":"\u000eEI haven’t seen the film \u000f\u000eHor\u000f\u000eE read the book.\u000f","p":1},{"t":"eg","x":"\u000eEI didn’t have a coat \u000f\u000eHor\u000f\u000eE an umbrella.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"\u000eAWe can use \u000f\u000eFbesides (adverb)\u000f\u000eA and \u000f\u000eFwhat’s more (adverb)\u000f\u000eA to make an extra point.\u000f","p":1},{"t":"eg","x":"\u000eEI’m too tired to go for a walk. \u000f\u000eHBesides\u000f\u000eE, it looks like rain.\u000f","p":1},{"t":"eg","x":"\u000eEIt’s dangerous to phone while driving. \u000f\u000eHWhat’s more\u000f\u000eE, it’s against the law.\u000f","p":1},{"t":"rule","x":"\u000eFFurthermore, \u0001moreover\u0002\u000f\u000eI, \u0001and\u0002 \u000f\u000eFin addition (adverb) \u000f\u000eAare more typical of written English.\u000f","p":1},{"t":"eg","x":"\u000eESome people have no car. \u000f\u000eHFurthermore\u000f\u000eE, there is little public transport.\u000f","p":1},{"t":"eg","x":"\u000eEStudents must sit three exam papers, and \u000f\u000eHin addition\u000f\u000eE there is a practical test.\u000f","p":1},{"t":"rule","x":"Self note: If full stop, we can use adverb at the start of next sentence. If comma, we can use adverb with and/\u0001or\u0002"}]},{"l":"D","b":[{"t":"rule","x":"\u000eAWe can use the prepositions \u000f\u000eFas well as, in addition to\u000f\u000eI, and \u000f\u000eFbesides\u000f\u000eI.\u000f","p":1},{"t":"eg","x":"\u000eEHe was an actor \u000f\u000eHas well as\u000f\u000eE a writer.\u000f","p":1},{"t":"eg","x":"\u000eHBesides\u000f\u000eE the rent, I have to pay for gas.\u000f","p":1},{"t":"rule","x":"Besides here is preposition, we have to use besides + noun phrase"},{"t":"rule","x":"As well, in addition: function as adverb but as well as \u0001and\u0002 in addition to function as preposition."}]},{"l":"E","b":[{"t":"rule","x":"\u000eAWe use \u000f\u000eFor\u000f\u000eA to express an alternative. --\u000f\u000eF coordinating conjunction\u000f","p":1},{"t":"eg","x":"\u000eEI’d like to study at Oxford \u000f\u000eHor\u000f\u000eE Cambridge.\u000f","p":1},{"t":"eg","x":"\u000eEWe can take a bus, \u000f\u000eHor\u000f\u000eE (alternatively) we can walk.\u000f","p":1},{"t":"rule","x":"\u000eFEither ... \u0001or\u0002\u000f\u000eA is more emphatic. --\u000f\u000eF either here is adverb\u000f","p":1},{"t":"eg","x":"\u000eEYou’ll have to go \u000f\u000eHeither\u000f\u000eE right \u000f\u000eHor\u000f\u000eE left.\u000f","p":1},{"t":"eg","x":"\u000eHEither\u000f\u000eE we pay someone to do the job, \u000f\u000eHor\u000f\u000eE we do it ourselves.\u000f","p":1}]},{"l":"F","b":[{"t":"rule","x":"\u000eFOr\u000f\u000eA can mean ‘if not’. We can also use \u000f\u000eFor else (adverb)\u000f\u000eA or \u000f\u000eFotherwise (adverb)\u000f\u000eI.\u000f","p":1},{"t":"eg","x":"\u000eEWe must go now, \u000f\u000eHor (else)\u000f\u000eE we’ll be late.\u000f","p":1},{"t":"eg","x":"\u000eEPut the leaflet in your bag, \u000f\u000eHotherwise\u000f\u000eE you’ll lose it.\u000f","p":1}]},{"l":"G","b":[{"t":"rule","x":"\u000eAWith two things, we can use \u000f\u000eFboth ... and ...\u000f\u000eA for extra emphasis.\u000f","p":1},{"t":"eg","x":"He was both a writer \u0004and\u0005 an actor."},{"t":"wrong","x":"He was a writer \u0004and\u0005 an actor."},{"t":"rule","x":"\u000eFNeither ... nor (adverb)\u000f\u000eA is more emphatic \u0001and\u0002 can be a little formal.\u000f","p":1},{"t":"eg","x":"\u000eEI had \u000f\u000eHneither\u000f\u000eE a coat \u000f\u000eHnor\u000f\u000eE an umbrella.\u000f","p":1},{"t":"eg","x":"\u000eHNeither\u000f\u000eE Steve \u000f\u000eHnor\u000f\u000eE Amy was/were there.\u000f","p":1},{"t":"eg","x":"\u000eEThe old man can \u000f\u000eHneither\u000f\u000eE read \u000f\u000eHnor\u000f\u000eE write.\u000f","p":1},{"t":"rule","x":"\u000eAWe use a positive verb, e.g. \u000f\u000eDcan\u000f\u000eA.\u000f","p":1},{"t":"tip","x":"\u000eAAs well as \u000f\u000eDboth ... and ...\u000f\u000eA, we can use \u000f\u000eDnot only ... but also\u000f\u000eA, e.g. \u000f\u000eBHe was \u000f\u000eHnot only\u000f\u000eB a writer \u000f\u000eHbut also\u000f\u000eB an actor.\u000f","p":1}]}]},{"n":151,"t":"Words meaning but and so","u":"Clauses & Linking","s":[{"l":"A","b":[{"t":"rule","x":"\u000eAWe use \u000f\u000eFbut\u000f\u000eA to express a contrast.\u000f","p":1},{"t":"eg","x":"\u000eEJulie is 20, \u000f\u000eHbut\u000f\u000eE she looks younger.\u000f","p":1},{"t":"rule","x":"\u000eAWe can also use the adverb \u000f\u000eFthough\u000f\u000eD.\u000f","p":1},{"t":"eg","x":"\u000eEJulie is 20. She looks younger, \u000f\u000eHthough\u000f\u000eE.\u000f","p":1},{"t":"eg","x":"\u000eETourism can bring benefits. On the whole, \u000f\u000eHthough\u000f\u000eE, its long-term impact is negative.\u000f","p":1},{"t":"rule","x":"\u000eAWe sometimes use the conjunction \u000f\u000eFyet\u000f\u000eA in front position.\u000f","p":1},{"t":"eg","x":"\u000eEIt was sunny, \u000f\u000eHyet\u000f\u000eE people were indoors.\u000f","p":1}]},{"l":"B","b":[{"t":"rule","x":"\u000eAThe adverbs \u000f\u000eFhowever\u000f\u000eA and \u000f\u000eFnevertheless\u000f\u000eA are a little formal.\u000f","p":1},{"t":"eg","x":"\u000eEIt was Sunday. \u000f\u000eHHowever/Nevertheless\u000f\u000eE, the streets seemed as busy as usual.\u000f","p":1},{"t":"rule","x":"\u000eAWe can also use \u000f\u000eDeven so\u000f\u000eA and \u000f\u000eDall the same.\u000f","p":1},{"t":"eg","x":"\u000eEShe had lots of friends. \u000f\u000eHEven so/All the same\u000f\u000eE, she often felt lonely.\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"\u000eAWe can use the conjunction \u000f\u000eFalthough\u000f\u000eD,\u000f\u000eA sometimes shortened to \u000f\u000eFthough\u000f\u000eD.\u000f","p":1},{"t":"eg","x":"\u000eEI was angry, \u000f\u000eHthough\u000f\u000eE I tried to hide it.\u000f","p":1},{"t":"eg","x":"\u000eHAlthough\u000f\u000eE Julie is 20, she looks younger.\u000f","p":1},{"t":"eg","x":"\u000eFEven though\u000f\u000eA is more emphatic.\u000f","p":1},{"t":"eg","x":"He didn’t have a coat on, even \u0004though\u0005 it was freezing."},{"t":"wrong","x":"even \u0004although\u0005"}]},{"l":"D","b":[{"t":"rule","x":"\u000eAWe can use the prepositions \u000f\u000eFdespite\u000f\u000eA and \u000f\u000eFin spite of\u000f\u000eD.\u000f","p":1},{"t":"eg","x":"\u000eEThe game went ahead \u000f\u000eHdespite\u000f\u000eE the rain.\u000f","p":1},{"t":"eg","x":"\u000eEWe got there \u000f\u000eHin spite of\u000f\u000eE losing the way.\u000f","p":1},{"t":"rule","x":"\u000eAWe can use \u000f\u000eFthe fact that\u000f\u000eI + finite clause.\u000f","p":1},{"t":"eg","x":"\u000eEThe game went ahead despite/in spite of \u000f\u000eHthe fact that\u000f\u000eE it was raining.\u000f","p":1}]},{"l":"E","b":[{"t":"rule","x":"\u000eAWe use \u000f\u000eFwhereas\u000f\u000eA or \u000f\u000eFwhile\u000f\u000eA for a comparison rather than a conflict between two ideas.\u000f","p":1},{"t":"eg","x":"\u000eEI’m right-handed, \u000f\u000eHwhereas/while\u000f\u000eE my brother is left-handed.\u000f","p":1}]},{"l":"F","b":[{"t":"rule","x":"\u000eAWe use the conjunction \u000f\u000eFso\u000f\u000eA to express result.\u000f","p":1},{"t":"eg","x":"\u000eEIt hasn’t rained, \u000f\u000eHso\u000f\u000eE the ground is very dry.\u000f","p":1},{"t":"rule","x":"\u000eAWe can use the adverbials \u000f\u000eFas a result, consequently,\u000f\u000eA and \u000f\u000eFtherefore\u000f\u000eD.\u000f","p":1},{"t":"eg","x":"\u000eEMore women are working. \u000f\u000eHAs a result/Consequently\u000f\u000eE, the birth rate is falling.\u000f","p":1},{"t":"eg","x":"\u000eEThere has been little rainfall. The ground is \u000f\u000eHtherefore\u000f\u000eE very dry.\u000f","p":1}]},{"l":"G","b":[{"t":"rule","x":"\u000eAThis pattern with \u000f\u000eFso\u000f\u000eA or \u000f\u000eDsuch\u000f\u000eA and a that-clause expresses result.\u000f","p":1},{"t":"eg","x":"\u000eEIt’s \u000f\u000eHso\u000f\u000eE dry (\u000f\u000eHthat\u000f\u000eE) the plants are dying.\u000f","p":1},{"t":"eg","x":"\u000eEThe place looked \u000f\u000eHsuch\u000f\u000eE a mess (\u000f\u000eHthat\u000f\u000eE) I couldn’t ask anyone in.\u000f","p":1},{"t":"tip","x":"Words meaning \u0001but\u0002 can be conjunctions, prepositions, or adverbs. Each word class is used in a different grammatical pattern, e.g. Although I felt tired... Despite feeling tired... I felt tired. However,..."}]}]},{"n":152,"t":"Clauses of time - adverb time clauses","u":"Clauses & Linking","s":[{"l":"A","b":[{"t":"sub","x":"Conjunctions of time"},{"t":"rule","x":"A clause of time often begins with a conjunction."},{"t":"eg","x":"\u000eHAfter\u000f\u000eE we’d finished, we all had a rest.\u000f","p":1},{"t":"eg","x":"\u000eEThink carefully \u000f\u000eHbeforfe\u000f\u000eE you decide.\u000f","p":1},{"t":"eg","x":"\u000eEI’ve changed my job \u000f\u000eHsince\u000f\u000eE I last saw you.\u000f","p":1},{"t":"eg","x":"\u000eEJack could swim \u000f\u000eHwhen\u000f\u000eE he was a baby.\u000f","p":1},{"t":"rule","x":"\u000eAOthers include: \u000f\u000eFas\u000f\u000eI, \u000f\u000eFas soon \u0001as\u0002\u000f\u000eI, \u000f\u000eFonce\u000f\u000eI, \u000f\u000eFtill/until\u000f\u000eI, \u000f\u000eFwhenever\u000f\u000eI, \u000f\u000eFwhile\u000f\u000eI.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"Non-finite clauses of time"},{"t":"rule","x":"\u000eAWe can use a gerund with \u000f\u000eFafter\u000f\u000eI, \u000f\u000eFbefore\u000f\u000eI, \u000f\u000eFon\u000f\u000eI, and \u000f\u000eFsince\u000f\u000eI.\u000f","p":1},{"t":"eg","x":"\u000eEThink carefully \u000f\u000eHbefore deciding.\u000f","p":1},{"t":"rule","x":"\u000eAWe can use a participle after \u000f\u000eFonce\u000f\u000eI, \u000f\u000eFuntil\u000f\u000eI, \u000f\u000eFwhen\u000f\u000eI, \u000f\u000eFwhenever\u000f\u000eI, and \u000f\u000eFwhile\u000f\u000eI.\u000f","p":1},{"t":"eg","x":"\u000eETake care \u000f\u000eHwhen crossing\u000f\u000eE the road.\u000f","p":1},{"t":"eg","x":"\u000eEPlease wait \u000f\u000eHuntil told\u000f\u000eE to proceed.\u000f","p":1},{"t":"rule","x":"\u000eAWe can also use a participle without a conjunction \u000f\u000eJ->82A\u000f","p":1},{"t":"eg","x":"\u000eETake care \u000f\u000eHcrossing\u000f\u000eE the road.\u000f","p":1}]},{"l":"C","b":[{"t":"sub","x":"\u000eGWhen, while\u000f\u000eC, and \u000f\u000eGas\u000f","p":1},{"t":"rule","x":"\u000eAWe use these words for things happening at the same time. \u000f\u000eFWhile\u000f\u000eA and \u000f\u000eFas\u000f\u000eA suggest something continuing.\u000f","p":1},{"t":"eg","x":"\u000eEThe model sat still \u000f\u000eHwhile\u000f\u000eE we drew her.\u000f","p":1},{"t":"eg","x":"\u000eHAs\u000f\u000eE I was cycling along, I saw a fox.\u000f","p":1},{"t":"rule","x":"\u000eABut for a time in your life, use \u000f\u000eFwhen\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI’ll be a millionaire \u000f\u000eHwhen\u000f\u000eE I’m thirty.\u000f","p":1},{"t":"rule","x":"\u000eAWe also use \u000f\u000eFwhen\u000f\u000eA with two short actions one after the other.\u000f","p":1},{"t":"eg","x":"\u000eHWhen\u000f\u000eE I clicked the icon, everything froze.\u000f","p":1},{"t":"rule","x":"\u000eFWhen\u000f\u000eA can also mean ‘every time’.\u000f","p":1},{"t":"eg","x":"\u000eEI cycle to work \u000f\u000eHwhen/whenever\u000f\u000eE it’s fine.\u000f","p":1},{"t":"rule","x":"\u000eAWe can use \u000f\u000eFas\u000f\u000eA (not \u000f\u000eFwhile\u000f\u000eA) to say that one change goes with another.\u000f","p":1},{"t":"eg","x":"\u000eEThe mixture hardens \u000f\u000eHas\u000f\u000eE it cools.\u000f","p":1}]},{"l":"D","b":[{"t":"sub","x":"\u000eGAs soon as\u000f\u000eC, etc\u000f","p":1},{"t":"rule","x":"\u000eFAs soon as\u000f\u000eA means that one thing comes immediately after another.\u000f","p":1},{"t":"eg","x":"\u000eHAs soon as\u000f\u000eE the gates were open, the crowds rushed in.\u000f","p":1},{"t":"rule","x":"\u000eAWe can use these patterns with \u000f\u000eFno sooner\u000f\u000eA and \u000f\u000eFhardly\u000f\u000eA with a similar meaning to \u000f\u000eFas soon as\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEEmma was \u000f\u000eHno sooner\u000f\u000eE in bed \u000f\u000eHthan\u000f\u000eE the phone rang.\u000f","p":1},{"t":"eg","x":"\u000eEI had \u000f\u000eHhardly\u000f\u000eE started work \u000f\u000eHwhen\u000f\u000eE I felt a pain in my back.\u000f","p":1},{"t":"rule","x":"We can also use inversion."},{"t":"eg","x":"\u000eHNo sooner\u000f\u000eB was Emma \u000f\u000eHin bed than\u000f\u000eB …\u000f","p":1},{"t":"eg","x":"\u000eHHardly\u000f\u000eE had I\u000f\u000eB started work \u000f\u000eHwhen\u000f\u000eB …\u000f","p":1},{"t":"tip","x":"Do not use \u0001by\u0002 as a conjunction. Use by the time, e.g. It was midday by the time I got to the office, not It was midday by I got to the office."}]}]},{"n":153,"t":"Reason and purpose - adverb reason clauses","u":"Clauses & Linking","s":[{"l":"A","b":[{"t":"sub","x":"Clauses of reason"},{"t":"rule","x":"\u000eAWe can form a clause of reason with a conjunction such as \u000f\u000eIbecause\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI made a mistake \u000f\u000eHbecause\u000f\u000eE I was tired.\u000f","p":1},{"t":"eg","x":"\u000eHAs\u000f\u000eE it’s so warm, I turned off the heating.\u000f","p":1},{"t":"eg","x":"\u000eHSince\u000f\u000eE we’ve started, let’s carry on.\u000f","p":1},{"t":"eg","x":"\u000eHSeeing\u000f\u000eE it’s so late, why not stay here?\u000f","p":1},{"t":"rule","x":"\u000eIFor\u000f\u000eA meaning ‘because’ is rather literary. \u000f\u000eI-- coordinating conjunction\u000f","p":1},{"t":"eg","x":"\u000eDThe cause of the accident is unclear, \u000f\u000eLfor\u000f\u000eD there are many factors involved.\u000f","p":1},{"t":"rule","x":"\u000eAWe can use a \u000f\u000eDparticiple clause\u000f\u000eA. \u000f\u000eI➔ 82B\u000f","p":1},{"t":"eg","x":"\u000eHBeing\u000f\u000eE tired, I made a mistake.\u000f","p":1},{"t":"eg","x":"\u000eHHaving spent\u000f\u000eE all the money, I couldn’t pay the hotel bill.\u000f","p":1},{"t":"rule","x":"\u000eAWe can also use a \u000f\u000eDpreposition\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEThe project was abandoned \u000f\u000eHbecause of\u000f\u000eE the cost.\u000f","p":1},{"t":"eg","x":"\u000eEThe show was cancelled \u000f\u000eHdue to\u000f\u000eE illness.\u000f","p":1},{"t":"eg","x":"\u000eHIn view of\u000f\u000eE the risks, I would advise you not to take part.\u000f","p":1},{"t":"rule","x":"\u000eAWe also use \u000f\u000eIon account of\u000f\u000eA and \u000f\u000eIowing to\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"\u000eAWe can use \u000f\u000eIdue to\u000f\u000eA and \u000f\u000eIin view of\u000f\u000eA with \u000f\u000eIthe fact that.\u000f","p":1},{"t":"eg","x":"\u000eEThe applicant was rejected \u000f\u000eHdue to the fact that\u000f\u000eE he was not properly qualified.\u000f","p":1},{"t":"rule","x":"\u000eIOut of\u000f\u000eA can express motive.\u000f","p":1},{"t":"eg","x":"\u000eDI had a look just \u000f\u000eHout of \u000f\u000eEcuriosity.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"Clauses of purpose"},{"t":"rule","x":"\u000eAFor purpose, we often use a \u000f\u000eJto-infinitive\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI went out \u000f\u000eHto buy\u000f\u000eE a newspaper.\u000f","p":1},{"t":"rule","x":"\u000eEYou need a drill \u000f\u000eHto make\u000f\u000eE the holes. \u000f\u000eB➔ \u000f\u000eK65C\u000f","p":1},{"t":"rule","x":"\u000eJIn order to\u000f\u000eA and \u000f\u000eJso as to\u000f\u000eA are more\u000f\u000eD emphatic and a little formal.\u000f","p":1},{"t":"eg","x":"\u000eEI arrived early \u000f\u000eHin order to\u000f\u000eE get a seat.\u000f","p":1},{"t":"rule","x":"\u000eEYou can pay in instalments \u000f\u000eHso as to\u000f\u000eE spread the cost.\u000f","p":1},{"t":"rule","x":"\u000eAThe negative is \u000f\u000eJin order not to\u000f\u000eA or \u000f\u000eJso as not to\u000f\u000eA. \u000f\u000eJNot to\u000f\u000eA on its own is\u000f\u000eD not possible.\u000f","p":1},{"t":"eg","x":"\u000eEAllow lots of time \u000f\u000eHin order not to\u000f\u000eE be late.\u000f","p":1},{"t":"wrong","x":"Allow lots of time not to be late."},{"t":"rule","x":"\u000eAWe can use a \u000f\u000eDfinite\u000f\u000eA clause with \u000f\u000eJso that\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI recorded it \u000f\u000eHso that\u000f\u000eE I could watch it later.\u000f","p":1},{"t":"rule","x":"\u000eAIn informal style we can leave out \u000f\u000eCthat\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI recorded it \u000f\u000eHso\u000f\u000eE I could watch it later.\u000f","p":1},{"t":"rule","x":"\u000eIIn order that\u000f\u000eA is more formal than \u000f\u000eIso that\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEYou will receive full details \u000f\u000eHin order that\u000f\u000eE you may make your arrangements.\u000f","p":1},{"t":"rule","x":"\u000eAWe sometimes use \u000f\u000eJto avoid\u000f\u000eI / \u000f\u000eJto prevent\u000f\u000eA instead of a negative clause.\u000f","p":1},{"t":"eg","x":"\u000eEI held it tight \u000f\u000eHso that\u000f\u000eE I would\u000f\u000eHn’t\u000f\u000eE drop it.\u000f","p":1},{"t":"eg","x":"\u000eEI held it tight \u000f\u000eHto avoid\u000f\u000eE dropping it.\u000f","p":1},{"t":"tip","x":"We can use for + noun phrase to express the purpose of an action, e.g. • We went out for some fresh air. And we use for + gerund to give the general purpose of something, e.g. • This paper is for printing photos on."}]}]},{"n":154,"t":"As and like; whoever, etc","u":"Clauses & Linking","s":[{"l":"A","b":[{"t":"sub","x":"\u000eLAs\u000f\u000eC and \u000f\u000eLlike\u000f","p":1},{"t":"rule","x":"\u000eAWe can use \u000f\u000eCas\u000f\u000eA and \u000f\u000eClike\u000f\u000eA \u0001as\u0002 \u000f\u000eDconjunctions\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEI kept quiet, \u000f\u000eHas\u000f\u000eE/\u000f\u000eHlike\u000f\u000eE I was told to do.\u000f","p":1},{"t":"rule","x":"\u000eAIn more formal English, and especially in British English, \u000f\u000eJas\u000f\u000eA is preferred to \u000f\u000eJlike\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEThe event was a great success, \u000f\u000eLas\u000f\u000eE it had been the previous year.\u000f","p":1},{"t":"rule","x":"\u000eABut the\u000f\u000eD equivalent preposition\u000f\u000eA is \u000f\u000eJlike\u000f\u000eA rather than \u000f\u000eJas\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eEIt was just \u000f\u000eLlike\u000f\u000eE the previous year.\u000f","p":1},{"t":"rule","x":"\u000eAFor the prepositions \u000f\u000eJas\u000f\u000eA and \u000f\u000eJlike\u000f\u000eA, \u000f\u000eB➔ \u000f\u000eK142F\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"\u000eAWe can use a clause with \u000f\u000eJas\u000f\u000eA when what we say\u000f\u000eD is already known or expected.\u000f","p":1},{"t":"eg","x":"\u000eHAs\u000f\u000eE you know, I’ll be leaving soon.\u000f","p":1},{"t":"rule","x":"\u000eEI was terrified, \u000f\u000eHas\u000f\u000eE you can imagine.\u000f","p":1},{"t":"rule","x":"\u000eAWe \u000f\u000eDdo not\u000f\u000eA usually use \u000f\u000eJlike\u000f\u000eA in this kind of clause, except informally with \u000f\u000eJsay\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eHAs\u000f\u000eE/\u000f\u000eHLike\u000f\u000eE I said, you’re welcome to stay.\u000f","p":1}]},{"l":"B","b":[{"t":"sub","x":"\u000eLAs if\u000f\u000eC and \u000f\u000eLas though\u000f","p":1},{"t":"rule","x":"\u000eAWe can use these conjunctions to say \u000f\u000eDhow something seems.\u000f","p":1},{"t":"eg","x":"\u000eEIt was \u000f\u000eHas if\u000f\u000eE/\u000f\u000eHas though\u000f\u000eE I was dreaming.\u000f","p":1},{"t":"eg","x":"\u000eEIt looks \u000f\u000eHas if\u000f\u000eE/\u000f\u000eHas though\u000f\u000eE it’s going to be a nice day.\u000f","p":1},{"t":"eg","x":"\u000eEIt feels \u000f\u000eHas if\u000f\u000eE/\u000f\u000eHas though\u000f\u000eE we’re travelling quite slowly.\u000f","p":1},{"t":"rule","x":"\u000eAThe verbs \u000f\u000eJbe\u000f\u000eI, \u000f\u000eJlook\u000f\u000eI, \u000f\u000eJfeel\u000f\u000eI,\u000f\u000eA and \u000f\u000eJseem\u000f\u000eA are often used before \u000f\u000eJas if\u000f\u000eI/\u000f\u000eJas though\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"\u000eAWe can use \u000f\u000eJlike\u000f\u000eA (informal) instead of \u000f\u000eJas if\u000f\u000eI/\u000f\u000eJas though\u000f\u000eI.\u000f","p":1},{"t":"eg","x":"\u000eEIt was \u000f\u000eHlike\u000f\u000eE I was dreaming.\u000f","p":1},{"t":"rule","x":"\u000eAWe can also use \u000f\u000eJlike\u000f\u000eI + \u000f\u000eJing-form\u000f\u000eI.\u000f","p":1},{"t":"rule","x":"It looks like being a nice day. (this is unusual in standard English. Can say: It looks like/\u0001as if\u0002/\u0001as though\u0002 it's going to be a nice day)"}]},{"l":"C","b":[{"t":"sub","x":"\u000eWhoever\u000f, \u000ewhatever\u000f, etc"},{"t":"rule","x":"\u000eAWe can use \u000f\u000eJwhoever\u000f\u000eI, \u000f\u000eJwhatever\u000f\u000eI, \u000f\u000eJwhichever\u000f\u000eI, \u000f\u000eJwhenever\u000f\u000eI, \u000f\u000eJwherever\u000f\u000eI,\u000f\u000eA and \u000f\u000eJhowever\u000f\u000eA meaning ‘\u000f\u000eDit doesn’t matter who, what,’ etc\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eHWhoever\u000f\u000eE we elect, they won’t have the power to change anything.\u000f","p":1},{"t":"rule","x":"\u000eEI won’t agree, \u000f\u000eHwhatever\u000f\u000eE you say.\u000f","p":1},{"t":"eg","x":"\u000eEIt takes ages, \u000f\u000eHwhichever\u000f\u000eE way you go.\u000f","p":1},{"t":"eg","x":"\u000eEI can’t draw, \u000f\u000eHhowever\u000f\u000eE hard I try.\u000f","p":1},{"t":"rule","x":"\u000eAWe can also use \u000f\u000eJno matter\u000f\u000eI.\u000f","p":1},{"t":"rule","x":"\u000eEI won’t agree, \u000f\u000eHno matter\u000f\u000eE what you say.\u000f","p":1}]},{"l":"D","b":[{"t":"sub","x":"\u000eJWhether\u000f\u000eC … \u000f\u000eJor\u000f\u000eC …\u000f","p":1},{"t":"rule","x":"\u000eAThis means\u000f\u000eD ‘it doesn’t matter if … or …’\u000f\u000eA.\u000f","p":1},{"t":"eg","x":"\u000eHWhether\u000f\u000eE the Conservatives \u000f\u000eHor\u000f\u000eE Labour win the election, it makes no difference.\u000f","p":1},{"t":"eg","x":"\u000eEYou have to pay in advance, \u000f\u000eHwhether\u000f\u000eE you like it \u000f\u000eHor\u000f\u000eE not.\u000f","p":1},{"t":"tip","x":"You can use feel like + gerund to make an informal suggestion, e.g. • Do you feel like going to the cinema? ~ I don’t mind. What’s on?"}]}]},{"n":155,"t":"Introduction to conditionals","u":"Conditionals & Unreal Past","s":[{"l":"A","b":[{"t":"rule","x":"\u000eAMost conditional sentences have a clause starting with \u000f\u000eIif\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"\u000eHIf\u000f\u000eE you haven’t got TV, you can’t watch it.\u000f","p":1},{"t":"eg","x":"\u000eEWe can sit down \u000f\u000eHif\u000f\u000eE we want to.\u000f","p":1},{"t":"eg","x":"\u000eHIf\u000f\u000eE I phone the Helpline, they might be able to give me the information.\u000f","p":1},{"t":"eg","x":"\u000eHIf\u000f\u000eE you lived on the planet Mercury, you’d have four birthdays in an Earth year.\u000f","p":1},{"t":"rule","x":"We can use many different verb forms in conditional sentences. In an open condition (when something may or may not happen), we use the present tense (If I phone...). For something unreal we often use the past tense (If you lived...)."}]},{"l":"B","b":[{"t":"rule","x":"There are some verb forms which often go together. These patterns are usually called Types 1, 2, and 3."},{"t":"rule","x":"\u000eCType 1\u000f\u000eA: \u000f\u000eHIf\u000f\u000eE the company \u000f\u000eHfails\u000f\u000eE, we \u000f\u000eHwill lose\u000f\u000eE all our money\u000f\u000eA. \u000f\u000eI➔ 156\u000f","p":1},{"t":"rule","x":"\u000eCType 2\u000f\u000eA: \u000f\u000eHIf\u000f\u000eE the company \u000f\u000eHfailed\u000f\u000eE, we \u000f\u000eHwould lose\u000f\u000eE all our money\u000f\u000eA. \u000f\u000eI➔ 157\u000f","p":1},{"t":"rule","x":"\u000eCType 3\u000f\u000eA: \u000f\u000eHIf\u000f\u000eE the company \u000f\u000eHhad failed\u000f\u000eE, we \u000f\u000eHwould have lost\u000f\u000eE all our money\u000f\u000eA. \u000f\u000eB➔ 158\u000f","p":1},{"t":"rule","x":"\u000eAThere is another pattern we can call \u000f\u000eCType 0\u000f\u000eA.\u000f","p":1},{"t":"rule","x":"\u000eCType 0\u000f\u000eA: \u000f\u000eHIf\u000f\u000eE the company \u000f\u000eHfails\u000f\u000eE, we \u000f\u000eHlose\u000f\u000eE all our money\u000f\u000eA. \u000f\u000eI➔ 156\u000f","p":1}]},{"l":"C","b":[{"t":"rule","x":"\u000eAThe \u000f\u000eJif\u000f\u000eI-clause\u000f\u000eA usually comes \u000f\u000eDbefore\u000f\u000eA the main clause, \u000f\u000eDbut it can come after it.\u000f","p":1},{"t":"eg","x":"\u000eHIf\u000f\u000eE you’re in a hurry, you needn’t wait.\u000f","p":1},{"t":"eg","x":"\u000eEYou needn’t wait \u000f\u000eHif\u000f\u000eE you’re in a hurry.\u000f","p":1},{"t":"rule","x":"\u000eAA \u000f\u000eDcomma\u000f\u000eA between the clauses is \u000f\u000eDmore likely\u000f\u000eA when the \u000f\u000eCif\u000f\u000eA-clause comes first.\u000f","p":1}]},{"l":"D","b":[{"t":"rule","x":"We can use conditional sentences in different ways: not only to give information but also when we request, advise, criticize, and so on."},{"t":"rule","x":"\u000eARequesting: \u000f\u000eHIf\u000f\u000eE you’re going into town, could you post this letter for me, please?\u000f","p":1},{"t":"rule","x":"\u000eAAdvising: \u000f\u000eHIf\u000f\u000eE the headache persists, you should consult a doctor.\u000f","p":1},{"t":"rule","x":"\u000eACriticizing: \u000f\u000eHIf\u000f\u000eE you’d remembered your passport, we wouldn’t be in such a rush.\u000f","p":1},{"t":"rule","x":"\u000eASuggesting: \u000f\u000eEWe can go for a walk \u000f\u000eHif\u000f\u000eE you like.\u000f","p":1},{"t":"rule","x":"\u
